function pnlCartaoEdicao(k){
  var e = pnlEdicao(k);
  if(!e.ed) return "";
  var bloqueio = motivoBloqueio("crm_config");
  var passou = Math.abs(e.diasCorte);
  var corte = e.diasCorte >= 0
    ? 'faltam <b>' + e.diasCorte + (e.diasCorte === 1 ? ' dia' : ' dias') + '</b> pro corte comercial (' + dataBR(e.ed.corteComercial) + ')'
    : 'o corte comercial passou ha <b>' + passou + (passou === 1 ? ' dia' : ' dias') + '</b> (' + dataBR(e.ed.corteComercial) + ')';
  var cls = e.pct >= 100 ? "green" : (e.pct >= 60 ? "" : (e.diasCorte < 30 ? "red" : "warn"));

  var h = '<div class="kpi"><div class="kpi-l">' + esc(e.ed.rot) + '</div>';
  h += pnlNum(brl(e.vendido), "edVendido", "lime", ' data-k="' + esc(k) + '"');

  if(e.meta > 0){
    h += '<div class="kpi-s">vendidos de <b>' + brl(e.meta) + '</b> de meta (' + pct(e.pct) + ')</div>' +
         pnlBarra(e.pct, cls);
  } else {
    // Sem meta da edicao cadastrada, nenhum percentual e mostrado. O link
    // fica visivel e desabilitado pra quem nao mexe em meta, com o motivo
    // escrito: botao que some faz a pessoa achar que o CRM quebrou.
    h += '<div class="kpi-s">vendidos. <b>Sem meta definida</b> pra esta edicao, entao nao existe percentual aqui. ' +
         '<button style="color:var(--lime);' + PNL_CLIC +
         (bloqueio ? ';opacity:.45;cursor:not-allowed' : '') + '" data-a="editarMeta"' +
         (bloqueio ? " disabled" : "") + '>definir a meta</button>' +
         (bloqueio ? '<br><span style="color:var(--text3)">' + esc(bloqueio) + '</span>' : '') + '</div>';
  }
  h += '<div class="kpi-s" style="margin-top:8px">' +
    pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(k) + '"') +
    '<span class="muted"> em aberto em ' + e.nAb + (e.nAb === 1 ? ' negocio' : ' negocios') + ', e ' + corte + '.</span>' +
    // O CRM atravessa edicoes: depois do evento diasEvento fica negativo, e
    // "daqui a -12 dias" e numero com unidade errada na cara do gestor.
    '<br><span class="muted">Evento em ' + dataBR(e.ed.dataEvento) + ', ' +
    (e.diasEvento >= 0
      ? 'daqui a ' + e.diasEvento + (e.diasEvento === 1 ? ' dia' : ' dias')
      : 'ja aconteceu ha ' + Math.abs(e.diasEvento) + (Math.abs(e.diasEvento) === 1 ? ' dia' : ' dias')) + '. ' +
    e.nVend + (e.nVend === 1 ? ' cota vendida' : ' cotas vendidas') + '.</span>' +
    (e.permuta > 0 ? '<br><span class="muted">Permuta de ' + brl(e.permuta) + ' fechada a parte, nunca somada ao dinheiro.</span>' : '') +
  '</div></div>';
  return h;
}

/* ---------------------------------------------------------------------
   A LISTA POR TRAS DE CADA NUMERO
   Uma so funcao resolve toda chave de lista, pra que a lista aberta nunca
   seja calculada com um criterio diferente do numero que ela explica.
   --------------------------------------------------------------------- */
function pnlValorModo(n, modo){
  if(modo === "mrr")   return mrrDe(n);
  // O que saiu entra NEGATIVO: a manchete do liquido e novo menos perdido,
  // e um Total que somasse os dois grupos mostraria R$ 7.500/mes embaixo de
  // uma manchete de R$ -500/mes. Numero que nao fecha derruba a tela toda.
  if(modo === "mrrLiq") return (n.status === "encerrado" ? -mrrDe(n) : mrrDe(n));
  if(modo === "fee")   return (n.ag && n.ag.mrr) || 0;
  if(modo === "verba") return (n.ag && n.ag.verbaMidia) || 0;
  if(modo === "fatia") return mrrDe(n) - ((n.ag && n.ag.mrr) || 0);
  if(modo === "cota")  return (n.pt && n.pt.valor) || 0;
  return valorRefDe(n);
}
function pnlUnidade(modo){
  return (modo === "mrr" || modo === "mrrLiq" || modo === "fee" ||
          modo === "verba" || modo === "fatia") ? "/mes" : "";
}
function pnlFiltra(arr, fn){
  var out = [];
  for(var i = 0; i < arr.length; i++) if(fn(arr[i])) out.push(arr[i]);
  return out;
}

// O parametro NAO se chama "chave": chave() e a funcao de busca do nucleo.
function pnlListaDef(qual, el){
  var ym = pnlYm();
  var N  = numerosDoMes(ym);
  var S  = pnlSaude(ym);
  var G  = null;
  var tipo = el ? el.getAttribute("data-tipo") : "";
  var k    = el ? el.getAttribute("data-k") : "";
  var idx  = el ? Number(el.getAttribute("data-i")) : 0;
  var mesNome = pnlNomeMes(ym);
  // A mesma nota da coluna Total, palavra por palavra: a lista e o numero
  // nao podem explicar a mesma soma com duas frases diferentes.
  var notaTotal = PNL_NOTA_TOTAL;

  switch(qual){
    case "carteira":
      return { t:"Carteira ativa", sub:"Contrato de agencia ganho e ainda nao encerrado. R$/mes que a Lime fatura.",
               itens:N.carteiraItens, modo:"mrr" };
    case "carteiraFee":
      return { t:"Fee contratado", sub:"A parte do MRR que esta escrita no contrato, sem a fatia de verba.",
               itens:N.carteiraItens, modo:"fee" };
    case "carteiraVerba":
      return { t:"Estimado sobre a verba", sub:"A fatia de pctVerba sobre a verba de midia. E estimativa, muda com a verba do mes.",
               itens:N.carteiraItens, modo:"fatia" };
    case "verba":
      return { t:"Verba sob gestao", sub:"Verba do cliente, NAO e receita da Lime. Aparece so pra dimensionar a operacao.",
               itens:N.carteiraItens, modo:"verba" };
    case "novoMrr":
      return { t:"Novo MRR de " + mesNome, sub:"Contratos de agencia ganhos no mes, em R$/mes.",
               itens:N.novoMrrItens, modo:"mrr" };
    case "mrrPerdido":
      return { t:"MRR perdido em " + mesNome, sub:"Contratos encerrados no mes. Renovacao fica fora: ela vira contrato novo.",
               itens:N.perdidoItens, modo:"mrr" };
    case "perdidoCancel":
      return { t:"Cancelamento em " + mesNome, sub:"Ruptura no meio do contrato: cliente cancelou, a Lime encerrou ou o cliente fechou as portas.",
               itens:pnlFiltra(N.perdidoItens, function(n){ return n.motivoEncerramento !== "fim_natural"; }), modo:"mrr" };
    case "perdidoNaoRenov":
      return { t:"Nao renovacao em " + mesNome, sub:"Fim natural do contrato sem renovar. A correcao e conversar antes, nao depois.",
               itens:pnlFiltra(N.perdidoItens, function(n){ return n.motivoEncerramento === "fim_natural"; }), modo:"mrr" };
    case "mrrLiquido":
      return { t:"MRR liquido de " + mesNome,
               sub:"Entrou " + brl(N.novoMrr) + "/mes e saiu " + brl(N.mrrPerdido) +
                   "/mes. O que saiu aparece negativo, entao o Total do rodape e o liquido.",
               itens:N.novoMrrItens.concat(N.perdidoItens), modo:"mrrLiq" };
    case "fechado":
    case "piso":
      return { t:(qual === "piso" ? "Piso de " : "Fechado em ") + mesNome,
               sub:"Ja assinado no mes, nos dois funis. " + notaTotal,
               itens:N.fechadoItens, modo:"valor" };
    case "alta":
      return { t:"Alta chance de " + mesNome,
               sub:"Aberto, ja passou do estagio em que o comprador se comprometeu, previsto pra este mes com data confirmada, e com plano vivo ou contato nos ultimos 10 dias.",
               itens:N.altaChance, modo:"valor" };
    case "altaAg":
      return { t:"Alta chance de agencia, MRR em jogo", sub:"R$/mes que entra se estes fecharem.",
               itens:pnlFiltra(N.altaChance, function(n){ return n.tipo === "agencia"; }), modo:"mrr" };
    case "provavel":
      return { t:"Provavel de " + mesNome, sub:"Piso mais alta chance. " + notaTotal,
               itens:N.fechadoItens.concat(N.altaChance), modo:"valor" };
    case "limpo":
      return { t:"Provavel sem risco alto, " + mesNome,
               sub:"Tira da conta o que esta vencido ha 7 dias ou mais, adiado 3 vezes ou parado no estagio ao dobro do teto.",
               itens:N.fechadoItens.concat(pnlFiltra(N.altaChance, function(n){ return !riscoAlto(n); })), modo:"valor" };
    case "risco":
      return { t:"Alta chance em risco alto",
               sub:"Estao dentro do Provavel, mas apoiados em negocio que ninguem toca. A distancia entre Provavel e Sem risco alto e exatamente isto.",
               itens:N.riscoItens, modo:"valor" };
    case "fechadoT":
      return { t:"Fechado em " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"", itens:pnlFiltra(N.fechadoItens, function(n){ return n.tipo === tipo; }), modo:"valor" };
    case "altaT":
      return { t:"Alta chance de " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"", itens:pnlFiltra(N.altaChance, function(n){ return n.tipo === tipo; }), modo:"valor" };
    case "provavelT":
      return { t:"Provavel de " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"Fechado mais alta chance do funil.",
               itens:pnlFiltra(N.fechadoItens.concat(N.altaChance), function(n){ return n.tipo === tipo; }), modo:"valor" };
    case "limpoT":
      return { t:"Sem risco alto em " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"", itens:pnlFiltra(N.fechadoItens.concat(N.altaChance), function(n){
                 return n.tipo === tipo && !(n.status === "aberto" && riscoAlto(n));
               }), modo:"valor" };

    case "tocados":
      return { t:"Tocados nos ultimos 7 dias", sub:S.naoTocados.length + " abertos ficaram sem contato no periodo.",
               itens:S.tocados, modo:"valor" };
    case "emDia":
      return { t:"Negocios em dia", sub:"Proximo passo com data no futuro e contato dentro do limite do funil.",
               itens:S.emDia, modo:"valor" };
    case "foraDia":
      return { t:"Negocios fora do dia", sub:"Ou estao sem plano com data, ou passaram do limite de silencio do funil.",
               itens:S.foraDia, modo:"valor" };
    case "vencidos":
      return { t:"Proximo passo vencido", sub:"O pior esta vencido ha " + S.piorAtraso + " dias.",
               itens:S.vencidos, modo:"valor" };
    case "concentra":
      return { t:"Abertos previstos pra " + mesNome,
               sub:"Concentracao = o maior dividido pelo total destes " + S.abertosMes.length + " negocios.",
               itens:S.abertosMes, modo:"valor" };

    case "ganhos12":
      G = pnlGanhosPerdas();
      return { t:"Ganhos dos ultimos 12 meses", sub:"Denominador da taxa de ganho: " + G.den + " negocios decididos. " + notaTotal,
               itens:G.ganhos, modo:"valor" };
    case "perdas12":
      G = pnlGanhosPerdas();
      return { t:"Perdas reais dos ultimos 12 meses", sub:"Sem os desqualificados.", itens:G.perdasReais, modo:"valor" };
    case "foraPerfil":
      G = pnlGanhosPerdas();
      return { t:"Desqualificados nos 12 meses",
               sub:"Ficam fora do denominador da taxa de ganho: contar desqualificacao como derrota pune a disciplina de dizer nao.",
               itens:G.foraPerfil, modo:"valor" };
    case "motivo":
      G = pnlGanhosPerdas();
      var mp = motivoPerdaDe(k);
      return { t:"Perdidos por: " + (mp ? mp.rot : "sem motivo"), sub:notaTotal,
               itens:pnlFiltra(G.perdasReais, function(n){ return (n.motivoPerda || "sem_motivo") === k; }), modo:"valor" };
    case "conv":
      G = pnlGanhosPerdas();
      var f = FUNIL[tipo] || [];
      var de = f[idx] ? f[idx].rot : "estagio", pa = f[idx+1] ? f[idx+1].rot : "o seguinte";
      return { t:"Chegaram em " + de, sub:"Fechados dos ultimos 12 meses que alcancaram este estagio. A conversao mede quantos passaram pra " + pa + ".",
               itens:pnlFiltra(G.fechados, function(n){ return n.tipo === tipo && (n.maiorEstagio || 0) >= idx; }), modo:"valor" };
    case "ticketAg":
      G = pnlGanhosPerdas();
      return { t:"Contratos de agencia ganhos, 12 meses", sub:"Valor total de contrato, em R$.",
               itens:pnlFiltra(G.ganhos, function(n){ return n.tipo === "agencia"; }), modo:"valor" };

    case "edVendido":
      var ev = pnlEdicao(k);
      return { t:"Cotas vendidas, " + (ev.ed ? ev.ed.rot : k), sub:"Ganhos da edicao. Permuta nao entra neste numero.",
               itens:ev.vendidos, modo:"cota" };
    case "edAberto":
      var ea = pnlEdicao(k);
      return { t:"Cotas em aberto, " + (ea.ed ? ea.ed.rot : k), sub:"Negocios abertos da edicao, no valor proposto de hoje.",
               itens:ea.abertos, modo:"cota" };
  }
  return { t:"Lista", sub:"", itens:[], modo:"valor" };
}

// Segunda linha de cada item: sempre diz o estado com o numero, nunca so
// "atrasado". Alerta sem motivo explicito e ignorado em uma semana.
function pnlSub(n){
  var p = [];
  if(n.status === "aberto"){
    p.push(estagioDe(n).rot);
    var pq = porQue(n);
    if(pq) p.push(pq);
  } else if(n.status === "ganho"){
    p.push("Ganho em " + dataBR(n.fechadoEm));
  } else if(n.status === "perdido"){
    var mp = motivoPerdaDe(n.motivoPerda);
    p.push("Perdido em " + dataBR(n.fechadoEm) + (mp ? ", " + mp.rot.toLowerCase() : ""));
  } else if(n.status === "encerrado"){
    var me = "";
    for(var i = 0; i < MOTIVOS_ENCERRAMENTO.length; i++)
      if(MOTIVOS_ENCERRAMENTO[i].k === n.motivoEncerramento) me = MOTIVOS_ENCERRAMENTO[i].rot;
    p.push("Encerrado em " + dataBR(n.encerradoEm) + (me ? ", " + me.toLowerCase() : ""));
  }
  if(n.tipo === "patrocinio" && n.pt && n.pt.edicao){
    var ed = edicaoDe(n.pt.edicao);
    if(ed) p.push(ed.rot);
  }
  return esc(p.join(" · "));
}

function pnlLinhaItem(n, modo){
  var v = pnlValorModo(n, modo);
  return '<button class="search-it" data-a="painelAbrirNegocio" data-id="' + esc(n.id) + '">' +
    '<span style="flex:1;min-width:0">' +
      '<span class="t truncate" style="display:block">' + esc(n.empresa || n.titulo || "sem nome") + '</span>' +
      '<span class="s truncate" style="display:block">' + pnlSub(n) + '</span>' +
    '</span>' +
    '<span class="nowrap" style="font-family:var(--disp);font-weight:800;font-size:16px">' +
      esc(brl(v) + pnlUnidade(modo)) + '</span>' +
  '</button>';
}

ACOES.verLista = function(el){
  var qual = el.getAttribute("data-lista");
  var d = pnlListaDef(qual, el);
  var itens = d.itens || [], i, total = 0;

  // Ordena pelo valor que entra na conta. Negocio sem valor cai pro
  // valorOrdem, senao a indicacao fresca fica sempre no fim da lista.
  itens = itens.slice(0).sort(function(a, b){
    var va = pnlValorModo(a, d.modo) || valorOrdem(a);
    var vb = pnlValorModo(b, d.modo) || valorOrdem(b);
    return vb - va;
  });

  var corpo = d.sub ? '<p class="tiny muted" style="margin-bottom:10px">' + esc(d.sub) + '</p>' : "";
  if(!itens.length){
    corpo += '<div class="empty"><div class="ei">∅</div><div class="et">Nenhum negocio nesta conta</div>' +
             '<div class="ex">O numero e zero porque a lista esta vazia mesmo, nao porque faltou dado.</div></div>';
  } else {
    for(i = 0; i < itens.length; i++){
      total += pnlValorModo(itens[i], d.modo);
      corpo += pnlLinhaItem(itens[i], d.modo);
    }
    corpo += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;' +
      'margin-top:10px;padding-top:12px;border-top:1px solid var(--border)">' +
      '<span class="h3" style="margin:0">Total, ' + itens.length + (itens.length === 1 ? ' negocio' : ' negocios') + '</span>' +
      '<span style="font-family:var(--disp);font-weight:900;font-size:22px;color:var(--lime)">' +
        esc(brl(total) + pnlUnidade(d.modo)) + '</span>' +
    '</div>';
  }
  folha(d.t, corpo, '<button class="btn btn-ghost" data-a="fecharFolha">Fechar</button>');
};

// Abrir o negocio pela lista fecha a folha antes de navegar, senao o
// detalhe abre atras do modal e a pessoa acha que o clique nao pegou.
ACOES.painelAbrirNegocio = function(el){
  var id = el.getAttribute("data-id");
  fecharFolha();
  if(id) ir("negocio/" + id);
};

ACOES.salvarMeta = function(f){
  var bloqueio = motivoBloqueio("crm_config");
  if(bloqueio){ toast(bloqueio, "bad"); return; }
  var campo = document.getElementById("mtMrr");
  var mrr = campo ? Math.round(lerValor(campo.value)) : 0;
  var cotas = {}, i;
  for(i = 0; i < EDICOES.length; i++){
    var el = document.getElementById("mtC_" + EDICOES[i].k);
    var v = el ? Math.round(lerValor(el.value)) : 0;
    // Grava 0 em vez de omitir a chave. gravar() escreve com merge, e no
    // merge um mapa aninhado sem a chave MANTEM o valor velho no servidor:
    // apagar a meta sumiria so do cache e ela voltaria no proximo sync.
    // pnlMetaCota ja le 0 como "sem meta definida".
    cotas[EDICOES[i].k] = v > 0 ? v : 0;
  }
  var btn = f.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }
  // Toast so depois que a promise resolve: dizer "salvo" antes de o
  // servidor confirmar e o momento exato em que se perde a confianca.
  gravar("crm_config", "geral", { metaMrrMes:(mrr > 0 ? mrr : 0), metaCota:cotas })
    .then(function(){
      fecharFolha();
      toast("Meta salva", "ok");
      redesenhar();

    .catch(function(){
      if(btn){ btn.disabled = false; btn.textContent = "Salvar meta"; }
    });
};

/* =====================================================================
   CRM LIME - CADASTRO, BUSCA, MENSAGEM E ACESSOS

   Quatro coisas que parecem soltas e sao o mesmo assunto: a porta de
   entrada do dado. Cadastro rapido (negocio e contato), busca que roda
   em memoria, mensagem de WhatsApp com captura no retorno, e o painel
   de acessos. Tudo aqui escreve pouco e le zero do banco, com uma
   excecao anotada (a lista de acessos, que e do admin e custa 4 leituras).

   Regras que valem no arquivo inteiro:
     - toda string que veio do usuario passa por esc() antes de virar HTML
     - todo botao dentro de <form> que nao envia leva type="button", senao
       o navegador trata como submit e o formulario sai pela metade
     - acao sem permissao fica VISIVEL e desabilitada, com o motivo embaixo
   ===================================================================== */

/* ---------------------------------------------------------------------
   HELPERS DA CASA (prefixo cad_ pra nao colidir com os outros modulos)
   --------------------------------------------------------------------- */

// Linha cinza de motivo, embaixo de botao desabilitado. Invariante 12.
function cadMotivo(txt){
  if(!txt) return "";
  return '<div class="tiny" style="color:var(--text3);margin-top:5px;line-height:1.4">' + esc(txt) + '</div>';
}

// Cor do semaforo em variavel de CSS, do jeito que o contrato define.
function cadCorTemp(t){
  if(t === "verde")     return "var(--green)";
  if(t === "amarelo")   return "var(--warn)";
  if(t === "vermelho")  return "var(--red)";
  if(t === "congelado") return "var(--blue)";
  return "var(--text3)";
}

// Valor curto do negocio, com a unidade certa de cada funil. Nunca soma
// MRR de agencia com valor de patrocinio (invariante 5).
function cadValorCurto(n){
  if(!n) return "";
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mes" : "valor a definir";
  }
  var v = valorRefDe(n);
  return v > 0 ? brl(v) : "valor a definir";
}

// "11 de agosto de 2027 (quarta)". Data em copy e SEMPRE absoluta com o
// dia da semana: "essa sexta" numa mensagem lida na segunda seguinte
// manda o cliente pro dia errado.
function cadDataCopy(iso){
  var e = dataExtenso(iso);
  if(!e) return "";
  var p = e.split(", ");
  if(p.length < 2) return e;
  return p[1] + " (" + p[0] + ")";
}

// Primeiro nome. Em WhatsApp ninguem escreve o nome completo da pessoa.
function cadPrimeiroNome(nome){
  var p = String(nome||"").trim().split(/\s+/).filter(Boolean);
  return p.length ? p[0] : "";
}

// Copia pra area de transferencia. A string e montada ANTES da chamada,
// pelo chamador: no Safari do iPhone qualquer await entre o clique e o
// writeText faz a permissao ser recusada em silencio e o botao parece
// quebrado. O fallback do textarea cobre http e webview antigo.
function cadCopiar(txt){
  function naMao(){
    var ok = false;
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
    toast(ok ? "Texto copiado" : "Nao deu pra copiar sozinho. Selecione o texto e copie na mao", ok ? "ok" : "bad");
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt)
        .then(function(){ toast("Texto copiado", "ok"); })
        .catch(function(){ naMao(); });
      return;
    }
  }catch(e){}
  naMao();
}

/* =====================================================================
   1. BUSCA
   Roda em memoria sobre os ~250 registros ja carregados. ZERO leitura.
   Casa por PREFIXO DE PALAVRA, nao substring solta: "mar" acha "Marroca"
   e "Ana Maria" e NAO acha "Camargo". Substring solta devolve lixo em
   metade das buscas e ensina a pessoa a nao confiar na busca.
   ===================================================================== */

// Quebra em palavras normalizadas. O @ e o ponto ficam na palavra pra
// e-mail continuar buscavel por "paulo@shineray".
function cadPalavras(txt){
  return chave(txt).split(/[^a-z0-9@.]+/).filter(Boolean);
}
// Todos os termos precisam casar (E, nao OU): com 250 registros, OU
// devolve a base inteira assim que a pessoa digita duas palavras.
function cadCasaPrefixo(alvo, termos){
  var pal = cadPalavras(alvo);
  for(var i=0;i<termos.length;i++){
    var achou = false;
    for(var j=0;j<pal.length;j++){
      if(pal[j].indexOf(termos[i]) === 0){ achou = true; break; }
    }
    if(!achou) return false;
  }
  return true;
}

function buscar(termo){
  var bruto = String(termo||"").trim();
  var termos = cadPalavras(bruto);
  var dig = soDigito(bruto);
  var porFone = dig.length >= 4;          // 4 digitos ja e o fim de um numero
  var vazio = { negocios:[], contatos:[], total:0 };

  if(!termos.length && !porFone) return vazio;
  // Uma letra so casa quase tudo e o resultado vira ruido.
  if(!porFone && termos.length === 1 && termos[0].length < 2) return vazio;

  var ns = lista("negocios").filter(function(n){
    if(porFone && soDigito(n.contatoTel).indexOf(dig) > -1) return true;
    if(!termos.length) return false;
    return cadCasaPrefixo(
      [n.empresa, n.titulo, n.contatoNome, n.indicadorNome].join(" "), termos);
  });

  var cs = lista("contatos").filter(function(c){
    if(porFone && soDigito(c.tel).indexOf(dig) > -1) return true;
    if(!termos.length) return false;
    return cadCasaPrefixo([c.nome, c.empresa, c.cargo, c.email].join(" "), termos);
  });

  // Aberto primeiro, e dentro disso valorOrdem desc. valorOrdem e nao
  // valorRefDe porque negocio sem valor (a indicacao cadastrada em 20
  // segundos) afundaria pro fim da lista e nunca apareceria.
  ns.sort(function(a,b){
    var aa = a.status === "aberto" ? 0 : 1, bb = b.status === "aberto" ? 0 : 1;
    if(aa !== bb) return aa - bb;
    return valorOrdem(b) - valorOrdem(a);
  });
  // Indicador primeiro: e quem se procura com pressa pra pedir um empurrao.
  cs.sort(function(a,b){
    var aa = a.ehIndicador ? 0 : 1, bb = b.ehIndicador ? 0 : 1;
    if(aa !== bb) return aa - bb;
    return chave(a.nome) < chave(b.nome) ? -1 : 1;
  });

  // total e o numero HONESTO de casamentos. As listas vem cortadas em 5,
  // e a tela usa o total pra dizer "5 de 12" em vez de mentir. O total de
  // cada grupo vem separado porque "5 de 12" no cabecalho de Negocios tem
  // que contar negocio, nunca negocio mais pessoa.
  return { negocios:ns.slice(0,5), contatos:cs.slice(0,5),
           totalNegocios:ns.length, totalContatos:cs.length,
           total:ns.length + cs.length };
}

/* ---------------------------------------------------------------------
   DESENHO DA BUSCA DO CABECALHO
   O input mora no cabecalho com id "busca" e o resultado vai pra
   #buscaOut. Os escutadores sao registrados UMA vez, no documento, e nao
   dentro de tela: redesenhar() troca o innerHTML inteiro e escuta presa
   em elemento de tela vazaria a cada render.
   --------------------------------------------------------------------- */
var BUSCA_SEL = -1;   // item destacado pelo teclado

function cadCaixaBusca(){
  var out = document.getElementById('buscaOut');
  if(out) return out;
  // Defensivo: se o cabecalho nao trouxer a caixa, ela nasce aqui dentro
  // do .search, que e quem tem position:relative.
  var inp = document.getElementById('busca');
  if(!inp) return null;
  var pai = inp.closest ? inp.closest('.search') : null;
  out = document.createElement('div');
  out.id = "buscaOut";
  out.className = "search-out";
  out.hidden = true;
  (pai || inp.parentNode).appendChild(out);
  return out;
}

function fecharBusca(){
  var out = document.getElementById('buscaOut');
  if(out){ out.hidden = true; out.innerHTML = ""; }
  BUSCA_SEL = -1;
}

function pintarBusca(termo){
  var out = cadCaixaBusca();
  if(!out) return;
  var t = String(termo||"").trim();
  BUSCA_SEL = -1;

  if(t.length < 2 && soDigito(t).length < 4){ out.hidden = true; out.innerHTML = ""; return; }

  var r = buscar(t);
  var podeN = motivoBloqueio("crm_negocios");
  var podeC = motivoBloqueio("crm_contatos");
  var h = "";

  if(r.negocios.length){
    h += '<div class="search-grp">Negocios' +
         (r.totalNegocios > r.negocios.length
            ? ' (' + r.negocios.length + ' de ' + r.totalNegocios + ' achados)' : '') +
         '</div>';
    for(var i=0;i<r.negocios.length;i++) h += cadItemNegocio(r.negocios[i]);
  }
  if(r.contatos.length){
    h += '<div class="search-grp">Pessoas' +
         (r.totalContatos > r.contatos.length
            ? ' (' + r.contatos.length + ' de ' + r.totalContatos + ' achadas)' : '') +
         '</div>';
    for(var j=0;j<r.contatos.length;j++) h += cadItemContato(r.contatos[j]);
  }

  // Busca vazia vira cadastro: quando o vendedor procura alguem que nao
  // existe e porque acabou de receber uma indicacao e esta com o nome na
  // cabeca. Fazer ele fechar a busca, achar o [+] e digitar de novo e o
  // jeito mais barato de perder o lead.
  h += '<div class="search-grp">' + (r.total ? "Nao achou?" : "Nao existe ainda") + '</div>';
  h += '<button class="search-it" type="button" data-a="buscaCriarNegocio" data-t="' + esc(t) + '"' +
         (podeN ? ' disabled style="opacity:.45"' : '') + '>' +
         '<span style="flex:1;min-width:0">' +
           '<span class="t" style="display:block">+ Criar negocio pra "' + esc(t) + '"</span>' +
           '<span class="s" style="display:block">' +
             (podeN ? esc(podeN) : 'abre o cadastro com o nome ja preenchido, leva menos de 20 segundos') +
           '</span></span></button>';
  h += '<button class="search-it" type="button" data-a="buscaCriarContato" data-t="' + esc(t) + '"' +
         (podeC ? ' disabled style="opacity:.45"' : '') + '>' +
         '<span style="flex:1;min-width:0">' +
           '<span class="t" style="display:block">+ Criar contato "' + esc(t) + '"</span>' +
           '<span class="s" style="display:block">' +
             (podeC ? esc(podeC) : 'nome mais um jeito de falar com a pessoa') +
           '</span></span></button>';

  out.innerHTML = h;
  out.hidden = false;
}

function cadItemNegocio(n){
  var e = estagioDe(n);
  var sub = (n.status === "aberto" ? e.rot : cadRotStatus(n.status)) +
            " · " + cadValorCurto(n) +
            (n.contatoNome ? " · " + n.contatoNome : "");
  return '<button class="search-it" type="button" data-a="buscaAbrir" data-r="negocio/' + esc(n.id) + '">' +
    '<span class="dot" style="background:' + cadCorTemp(temperatura(n)) + ';margin-top:6px"></span>' +
    '<span style="flex:1;min-width:0">' +
      '<span class="t truncate" style="display:block;text-transform:uppercase">' + esc(n.empresa || n.titulo) + '</span>' +
      '<span class="s truncate" style="display:block">' + esc(sub) + '</span>' +
    '</span></button>';
}
function cadItemContato(c){
  var sub = [];
  if(c.cargo)   sub.push(c.cargo);
  if(c.empresa) sub.push(c.empresa);
  if(c.tel)     sub.push(foneBR(c.tel));
  else if(c.email) sub.push(c.email);
  if(c.ehIndicador) sub.push("indicador");
  return '<button class="search-it" type="button" data-a="buscaAbrir" data-r="pessoa/' + esc(c.id) + '">' +
    '<span class="dot" style="background:' + (c.ehIndicador ? "var(--lime)" : "var(--text3)") + ';margin-top:6px"></span>' +
    '<span style="flex:1;min-width:0">' +
      '<span class="t truncate" style="display:block">' + esc(c.nome) + '</span>' +
      '<span class="s truncate" style="display:block">' + esc(sub.join(" · ") || "sem telefone e sem e-mail") + '</span>' +
    '</span></button>';
}
function cadRotStatus(s){
  if(s === "ganho")     return "Ganho";
  if(s === "perdido")   return "Perdido";
  if(s === "encerrado") return "Encerrado";
  return "Aberto";
}

ACOES.buscaAbrir = function(el){

  ir(el.getAttribute('data-r'));

ACOES.buscaCriarNegocio = function(el){

// Aba "Buscar" da barra de baixo no celular.
ACOES.focarBusca = function(){
  var inp = document.getElementById('busca');
  if(!inp) return;
  try{ inp.focus(); inp.select(); }catch(e){}
};
ACOES.abrirBusca = ACOES.focarBusca;

document.addEventListener('input', function(ev){
  var el = ev.target;
  if(!el || !el.id) return;
  if(el.id === "busca"){ pintarBusca(el.value); return; }
  if(el.id === "nnEmpresa"){ nnPintarDup(); nnPintarTitulo(); return; }
  if(el.id === "nnTitulo"){ if(NOVO) NOVO.tituloTocado = true; return; }
  if(el.id === "nnIndicBusca"){ nnPintarIndic(); return; }
  if(el.id === "msgTexto"){
    // A lista de campos que faltam so e refeita quando a lista MUDA. Refazer
    // a cada tecla custa nada, mas apagaria o que estiver sendo digitado
    // dentro de um campo de variavel.
    if(MSG){
      var f = msgFaltando(el.value).join(",");
      if(f !== MSG.faltavam) msgPintarVars();
    }
    return;
  }
});
// Campo inline de variavel de modelo (ex: {gancho}).
document.addEventListener('input', function(ev){
  var el = ev.target;
  if(!el || !el.getAttribute) return;
  var v = el.getAttribute('data-v');
  if(!v || !MSG) return;
  msgAplicarVar(v, el.value);
});

document.addEventListener('keydown', function(ev){
  var inp = document.getElementById('busca');
  var out = document.getElementById('buscaOut');
  var digitando = document.activeElement &&
    /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

  // "/" foca a busca. So fora de campo de texto, senao vira barra digitada.
  if(ev.key === "/" && !digitando && !FOLHA_ABERTA && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
    if(inp){ ev.preventDefault(); try{ inp.focus(); inp.select(); }catch(e){} }
    return;
  }
  if(!out || out.hidden) return;
  if(ev.key === "Escape"){ fecharBusca(); if(inp) try{ inp.blur(); }catch(e){} return; }

  var itens = out.querySelectorAll('.search-it');
  if(!itens.length) return;
  if(ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    BUSCA_SEL += (ev.key === "ArrowDown" ? 1 : -1);
    if(BUSCA_SEL < 0) BUSCA_SEL = itens.length - 1;
    if(BUSCA_SEL >= itens.length) BUSCA_SEL = 0;
    for(var i=0;i<itens.length;i++) itens[i].classList.toggle('sel', i === BUSCA_SEL);
    try{ itens[BUSCA_SEL].scrollIntoView({ block:"nearest" }); }catch(e){}
  } else if(ev.key === "Enter" && document.activeElement === inp){
    ev.preventDefault();
    itens[BUSCA_SEL >= 0 ? BUSCA_SEL : 0].click();
  }
});
// Clique fora fecha. Roda depois da delegacao do shell, entao um clique
// em resultado ainda e processado antes de a caixa sumir.
document.addEventListener('click', function(ev){
  var out = document.getElementById('buscaOut');
  if(!out || out.hidden) return;
  if(ev.target && ev.target.closest && ev.target.closest('.search')) return;
  fecharBusca();
});

/* =====================================================================
   2. NEGOCIO NOVO
   Alvo: 2 textos e 3 toques, menos de 20 segundos. Empresa, tipo, origem,
   quem indicou quando for indicacao, proximo passo. Nada mais entra aqui:
   valor, cota, quem decide e verba sao da tela de detalhe, e pedir isso
   no cadastro e o que faz o vendedor nao cadastrar.
   ===================================================================== */
var NOVO = null;          // rascunho em memoria do cadastro aberto
var NN_SALVANDO = false;  // trava contra duplo toque no Salvar

function nnRascunho(){
  // Negocio de mentira, so pra o bloco de proximo passo saber de que funil
  // esta falando (o tipo "cobrar aprovacao interna" so existe em patrocinio).
  var tipo = (NOVO && NOVO.tipo) || "agencia";
  return { id:"", tipo:tipo, estagio:(FUNIL[tipo][0] || {}).k, status:"aberto",
           empresa:"", titulo:"", proxData:"", proxTipo:"", estagioDesde:hojeISO(),
           ultimoToqueEm:hojeISO() };
}

function abrirNovoNegocio(pre){
  pre = pre || {};
  NOVO = {
    tipo: pre.tipo || "agencia",
    origem: pre.origem || "",
    indicadorId: pre.indicadorId || "",
    indicadorNome: "",
    contatoId: pre.contatoId || "",
    tituloTocado: false
  };
  NN_SALVANDO = false;

  var ct = NOVO.contatoId ? contatoPorId(NOVO.contatoId) : null;
  if(NOVO.indicadorId){
    var ind = contatoPorId(NOVO.indicadorId);
    if(ind){ NOVO.indicadorNome = ind.nome; if(!NOVO.origem) NOVO.origem = "indicacao"; }
    else NOVO.indicadorId = "";
  }
  var empresa = pre.empresa || (ct && ct.empresa) || "";
  var bloqueio = motivoBloqueio("crm_negocios");

  var corpo =
    '<form class="form" id="nnForm" data-a="salvarNovoNegocio">' +
      '<div class="fld">' +
        '<label>Empresa <span class="req">*</span></label>' +
        '<input class="inp" id="nnEmpresa" autocomplete="off" maxlength="120" ' +
          'placeholder="Marroca Editora" value="' + esc(empresa) + '">' +
        '<div id="nnDup"></div>' +

function nnPintarTipos(){
  var w = document.getElementById('nnTipos');
  if(!w || !NOVO) return;
  var h = "";
  for(var i=0;i<TIPOS.length;i++){
    var t = TIPOS[i], on = (NOVO.tipo === t.k);
    h += '<button type="button" class="btn btn-lg btn-block' + (on ? ' btn-primary' : '') + '" ' +
         'data-a="nnTipo" data-k="' + t.k + '">' + t.ic + ' ' + esc(t.rot) + '</button>';
  }
  // Tipo e imutavel depois de criado (invariante 6). Dito aqui, que e o
  // unico momento em que da pra escolher.
  h += '<div class="tiny muted" style="grid-column:1/-1">O tipo nao muda depois de salvo. ' +
       'Agencia e fee por mes, patrocinio e cota do festival.</div>';
  w.innerHTML = h;
}

  // funil. Como o tipo se escolhe antes do proximo passo, nao ha o que perder.

function nnPintarPrev(){
  var el = document.getElementById('nnPrev');

  // obrigatorio que o vendedor odeia e mata o undefined que quebra a tela.
  // Enquanto for estimada, o negocio fica fora de alta chance de proposito.
  el.innerHTML = 'Previsao de fechamento: <b>' + dataBR(d) + '</b> ' +
    '<span class="muted">(data estimada, ' + dias + ' dias, que e o ciclo mediano de ' +
    esc(NOVO.tipo === "agencia" ? "agencia" : "patrocinio") + ')</span>. ' +
    'Enquanto for estimada esse negocio nao entra em alta chance. Ajuste na tela do negocio.';

function nnPintarDup(){
  var el = document.getElementById('nnDup');
  var inp = document.getElementById('nnEmpresa');
  if(!el || !inp) return;
  var v = chave(inp.value);
  el.innerHTML = "";
  if(v.length < 3) return;

  // Casa por prefixo nos DOIS sentidos: digitar "hond" acha "Honda do
  // Brasil", e digitar "Honda do Brasil Ltda" acha "Honda do Brasil".
  // Com duas pessoas cadastrando, Honda, Honda do Brasil e HONDA MOTOS
  // viram tres empresas em tres meses e o historico da conta se parte.
  var grupos = {}, ordem = [];
  var ns = lista("negocios");
  for(var i=0;i<ns.length;i++){
    var n = ns[i];
    var ek = n.empresaChave || chave(n.empresa);
    if(!ek) continue;
    if(ek.indexOf(v) !== 0 && v.indexOf(ek) !== 0) continue;
    if(!grupos[ek]){ grupos[ek] = { grafia:n.empresa, n:0 }; ordem.push(ek); }
    grupos[ek].n++;
  }
  if(!ordem.length) return;

  var h = "";
  for(var j=0;j<ordem.length && j<3;j++){
    var g = grupos[ordem[j]];
    var igual = chave(g.grafia) === v;
    h += '<div class="tiny" style="color:var(--warn);margin-top:6px;display:flex;' +
         'align-items:center;gap:8px;flex-wrap:wrap">' +
         '<span>Essa empresa ja tem ' + g.n + (g.n === 1 ? ' negocio' : ' negocios') +
         ' como <b>' + esc(g.grafia) + '</b></span>' +
         (igual ? '' : '<button type="button" class="btn btn-sm" data-a="nnUsarGrafia" data-g="' +
                       esc(g.grafia) + '">usar essa grafia</button>') +
         '</div>';
  }
  el.innerHTML = h;
}

  if(!inp) return;
  inp.value = el.getAttribute('data-g') || "";
  nnPintarDup(); nnPintarTitulo();
};

ACOES.salvarNovoNegocio = function(form){
  if(NN_SALVANDO) return;
  var err = document.getElementById('nnErr');
  function falha(m){ if(err) err.textContent = m; toast(m, "bad"); }

  var motivo = motivoBloqueio("crm_negocios");
  if(motivo){ falha(motivo); return; }
  if(!NOVO){ falha("O cadastro perdeu o rascunho. Abra de novo."); return; }

  var empresa = (document.getElementById('nnEmpresa').value || "").trim();
  if(empresa.length < 2){ falha("Escreva o nome da empresa."); return; }
  if(!NOVO.origem){ falha("Diga de onde veio esse negocio."); return; }
  if(NOVO.origem === "indicacao" && !NOVO.indicadorId){
    falha("Escolha quem indicou, ou crie o contato ali mesmo no campo."); return;
  }
  var pp = lerProxPasso('np');
  if(!pp || !pp.ok){ falha((pp && pp.erro) || "Marque o proximo passo com tipo e data."); return; }

  var titulo = (document.getElementById('nnTitulo').value || "").trim() || nnTituloAuto();
  var tipo = NOVO.tipo;
  var ct = NOVO.contatoId ? contatoPorId(NOVO.contatoId) : null;
  var ctNome = ct ? ct.nome : "";
  var id = idNovo("n");
  var hoje = hojeISO();

  var n = {
    id:id, tipo:tipo, titulo:titulo.slice(0,120),
    empresa:empresa.slice(0,120), empresaChave:chave(empresa),
    contatoId: ct ? ct.id : "", contatoNome: ctNome, contatoTel: ct ? (ct.tel||"") : "",
    estagio:(FUNIL[tipo][0] || {}).k, status:"aberto",
    origem:NOVO.origem,
    indicadorId:NOVO.indicadorId || "", indicadorNome:NOVO.indicadorNome || "",
    valorRef:0,
    prevFechamento: somaDias(hoje, CICLO_MEDIANO[tipo] || 30),
    prevEstimada: true,
    proxTipo:pp.proxTipo, proxData:pp.proxData,
    proxTexto:(pp.proxTexto || "").slice(0,140), proxHora:pp.proxHora || "",
    congeladoAte:"", congeladoMotivo:"",
    vezesAdiado:0, vezesRemarcouPrev:0,
    ultimoToqueEm:hoje, ultimoToqueTxt:"Negocio cadastrado",
    estagioDesde:hoje, maiorEstagio:0,
    motivoPerda:"", motivoPerdaObs:"", fechadoEm:"", encerradoEm:"", motivoEncerramento:"",
    linkProposta:"", obs:"",
    busca: chave([empresa, titulo, ctNome, NOVO.indicadorNome].filter(Boolean).join(" ")),
    criadoEm:hoje, criadoPor:(SESSAO && SESSAO.nome) || "", arquivado:false
  };

  if(tipo === "agencia"){
    n.ag = { mrr:0, mrrInicial:0, meses:0, verbaMidia:0, pctVerba:0, servicos:[],
             inicioContrato:"", fimContrato:"", renovacaoDeId:"",
             quemDecide:"", faixaVerba:"" };
    n.pt = null;
  } else {
    // A edicao nasce na primeira que ainda nao passou do corte comercial.
    // Cota sem edicao nao aparece na cobertura de edicao nenhuma, e
    // ninguem volta pra preencher campo que a tela nao cobra.
    var ed = "";
    for(var i=0;i<EDICOES.length;i++){
      if(EDICOES[i].corteComercial >= hoje){ ed = EDICOES[i].k; break; }
    }
    n.pt = { edicao:ed, cota:"", valor:0, valorInicial:0, permuta:0,
             entregaveis:"", quemAprova:"", mesBudget:"" };
    n.ag = null;
  }

  var ativ = {
    negocioId:id, contatoId:n.contatoId, tipo:"nota",
    texto:"Negocio cadastrado. Origem: " + rotOrigem(NOVO.origem) +
          (NOVO.indicadorNome ? ", indicado por " + NOVO.indicadorNome : ""),
    quando:hoje, ts:Date.now(), por:(SESSAO && SESSAO.nome) || "", de:"", para:""
  };
  var ativId = idAtiv();

  NN_SALVANDO = true;
  // Duas escritas: o negocio e a atividade de criacao. A atividade existe
  // pra timeline nao comecar vazia, que e o que faz a tela parecer quebrada
  // no primeiro negocio de cada pessoa.
  gravar("crm_negocios", id, n)
    .then(function(){
      ativ.id = ativId;
      empurrarTimeline(id, ativ);           // entra na timeline local sem leitura
      return gravar("crm_atividades", ativId, ativ);
    })
    .then(function(){
      NN_SALVANDO = false;
      NOVO = null;
      fecharFolha();
      toast("Negocio criado", "ok");
      ir("negocio/" + id);
    })
    .catch(function(e){
      NN_SALVANDO = false;
      falha("Nao deu pra salvar: " + ((e && e.message) || "erro") +
            ". O registro ficou guardado no aparelho.");
    });
};

ACOES.salvarNovoContato = function(){
  if(NC_SALVANDO) return;
  var err = document.getElementById('ncErr');
  function falha(m){ if(err) err.textContent = m; toast(m, "bad"); }

  var motivo = motivoBloqueio("crm_contatos");
  if(motivo){ falha(motivo); return; }

  var nome  = (document.getElementById('ncNome').value || "").trim();
  var tel   = (document.getElementById('ncTel').value || "").trim();
  var email = (document.getElementById('ncEmail').value || "").trim();
  if(nome.length < 2){ falha("Escreva o nome da pessoa."); return; }

  var temTel = soDigito(tel).length >= 10;      // 10 digitos = DDD mais numero
  var temMail = email.indexOf("@") > 0 && email.indexOf(".") > 0;
  if(!temTel && !temMail){
    falha("Falta um jeito de falar com a pessoa: telefone com DDD ou e-mail.");
    return;
  }
  if(tel && !temTel){ falha("Esse telefone esta sem DDD. Escreva com os 2 digitos do DDD."); return; }

  function v(id){ var e = document.getElementById(id); return e ? (e.value || "").trim() : ""; }
  var marcado = document.getElementById('ncIndicador');

  var id = idNovo("c");
  var empresa = v('ncEmpresa');
  var c = {
    id:id, nome:nome.slice(0,120), nomeChave:chave(nome),
    empresa:empresa.slice(0,120), empresaChave:chave(empresa),
    cargo:v('ncCargo').slice(0,80),
    tel: temTel ? soDigito(tel) : "",         // so digito, a tela formata
    email: temMail ? email.slice(0,120) : "",
    ehIndicador: !!(marcado && marcado.checked),
    acordo:v('ncAcordo').slice(0,140),
    obs:v('ncObs').slice(0,400),
    busca: chave([nome, empresa, v('ncCargo'), email].join(" ")),
    criadoEm:hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || "", arquivado:false
  };

  NC_SALVANDO = true;
  gravar("crm_contatos", id, c)
    .then(function(){
      NC_SALVANDO = false;
      var cb = CONT_AOSALVAR; CONT_AOSALVAR = null;
      fecharFolha();
      toast("Contato salvo", "ok");
      if(cb) cb(c);
    })
    .catch(function(e){
      NC_SALVANDO = false;
      falha("Nao deu pra salvar: " + ((e && e.message) || "erro") +
            ". O registro ficou guardado no aparelho.");
    });
};

/* =====================================================================
   4. MENSAGEM DE WHATSAPP
   E onde a venda acontece. A previa e editavel, o que falta vira campo
   inline, e o botao de abrir conversa CRUA nunca e bloqueado: um modelo
   que pede um campo que nao existe nao pode travar justamente o negocio
   de maior ticket.
   ===================================================================== */
var MSG = null;

var MSG_ROTULOS = {
  nome:"Primeiro nome de quem recebe", empresa:"Empresa",
  indicador:"Quem indicou", vendedor:"Seu nome",
  mrr:"Fee por mes", meses:"Meses de contrato",
  cota:"Cota", valor:"Valor da cota", evento:"Edicao do festival",
  dataEvento:"Data do evento", entregaveis:"O que entra na cota",
  corte:"Data de corte da producao", diaRetorno:"Quando voce liga de volta",
  assunto:"Sobre o que voces falaram", gancho:"O motivo real de lembrar agora",
  hora:"Hora da reuniao"
};

// Troca {chave} pelo que o sistema sabe. O que nao sabe FICA como {chave}
// e vira campo inline, em vez de sumir e deixar a frase sem sentido.
function msgTrocar(txt, mapa){
  return String(txt||"").replace(/\{([a-zA-Z]+)\}/g, function(tudo, v){
    var val = mapa[v];
    return (val == null || val === "") ? tudo : String(val);
  });
}
function msgFaltando(txt){
  var r = [], re = /\{([a-zA-Z]+)\}/g, m;
  while((m = re.exec(String(txt||"")))){ if(r.indexOf(m[1]) === -1) r.push(m[1]); }
  return r;
}

function msgMapa(n, c, nome){
  var mapa = {};
  mapa.vendedor = (SESSAO && SESSAO.nome) || "";
  mapa.nome = cadPrimeiroNome(nome);
  if(c){
    if(c.empresa) mapa.empresa = c.empresa;
    // Em m5 e m6 quem recebe a mensagem E o indicador, entao {indicador}
    // e o nome de quem esta do outro lado.
    mapa.indicador = cadPrimeiroNome(c.nome);
  }
  if(n){
    mapa.empresa = n.empresa || mapa.empresa;
    if(n.indicadorNome) mapa.indicador = cadPrimeiroNome(n.indicadorNome);
    if(n.tipo === "agencia" && n.ag){
      if(mrrDe(n) > 0) mapa.mrr = brl(mrrDe(n));
      if(n.ag.meses > 0) mapa.meses = String(n.ag.meses);   // 0 = indeterminado, vira campo
    }
    if(n.tipo === "patrocinio" && n.pt){
      if(n.pt.cota) mapa.cota = n.pt.cota;
      if(n.pt.valor > 0) mapa.valor = brl(n.pt.valor);
      if(n.pt.entregaveis) mapa.entregaveis = String(n.pt.entregaveis).split("\n").filter(Boolean).join(", ");
      var ed = edicaoDe(n.pt.edicao);
      if(ed){
        mapa.evento = ed.rot;
        mapa.dataEvento = cadDataCopy(ed.dataEvento);
        mapa.corte = cadDataCopy(ed.corteComercial);
      }
    }
    if(n.proxData) mapa.diaRetorno = cadDataCopy(n.proxData);
    if(n.proxHora) mapa.hora = n.proxHora;
  }
  return mapa;
}

function abrirMensagem(ctx){
  ctx = ctx || {};
  var n = ctx.negocioId ? achar("negocios", ctx.negocioId) : null;
  var c = ctx.contatoId ? contatoPorId(ctx.contatoId) : null;
  if(!c && n && n.contatoId) c = contatoPorId(n.contatoId);

  var tel  = ctx.tel  || (c && c.tel) || (n && n.contatoTel) || "";
  var nome = ctx.nome || (c && c.nome) || (n && n.contatoNome) || "";
  var email = (c && c.email) || "";

  MSG = {
    negocioId: (n && n.id) || ctx.negocioId || "",
    contatoId: (c && c.id) || ctx.contatoId || "",
    tel:tel, nome:nome, email:email,
    mapa: msgMapa(n, c, nome),
    modelo:"", base:"", valores:{}, aplicado:{}, faltavam:"",
    n:n
  };

  // Contexto: quais modelos fazem sentido aqui. Mostrar os sete sempre
  // transforma a escolha num formulario, e o vendedor para de usar.
  var ok = { sempre:true };
  if(n){ ok[n.tipo] = true; if(n.origem === "indicacao") ok.indicacao = true; }
  if(nome) ok.contato = true;

  var pills = '<button type="button" class="pill on" data-a="msgModelo" data-k="">Sem modelo</button>';
  for(var i=0;i<MODELOS.length;i++){
    var m = MODELOS[i];
    if(!ok[m.quando]) continue;
    pills += '<button type="button" class="pill" data-a="msgModelo" data-k="' + m.k + '">' +
             esc(m.rot) + '</button>';
  }

  var linkCru = linkWhats(tel, "");
  var corpo =
    '<div class="form">' +
      '<div class="fld"><label>Modelo</label><div class="pills" id="msgPills">' + pills + '</div></div>' +
      '<div class="fld">' +
        '<label>Previa, da pra editar antes de mandar</label>' +
        '<textarea class="inp" id="msgTexto" rows="7" maxlength="1200" ' +
          'placeholder="escreva aqui, ou escolha um modelo em cima"></textarea>' +
      '</div>' +
      '<div id="msgVars"></div>' +
      '<div class="tiny muted">' +
        (tel ? 'Vai pra <b>' + esc(foneBR(tel)) + '</b>' +
               (nome ? ' (' + esc(nome) + ')' : '')
             : 'Esse contato nao tem telefone com DDD guardado.') +
      '</div>' +
      // O cru NUNCA e bloqueado. Se o modelo pede um campo que nao existe,
      // a conversa ainda tem que abrir.
      (linkCru
        ? '<button type="button" class="btn btn-block" data-a="msgAbrirCru">' +
          'Abrir conversa sem texto nenhum</button>'
        : '') +
      (email ? '<a class="btn btn-block" href="mailto:' + esc(email) + '">Mandar e-mail pra ' + esc(email) + '</a>' : '') +
    '</div>';

  var rodape =
    '<button class="btn btn-ghost" type="button" data-a="msgCopiar">Copiar texto</button>' +
    (linkCru
      ? '<button class="btn btn-primary" type="button" data-a="msgAbrir">Abrir conversa</button>'
      : '<div style="flex:1;min-width:0"><button class="btn btn-primary btn-block" disabled>Abrir conversa</button>' +
        cadMotivo("Sem telefone com DDD nao da pra montar o link do WhatsApp. Copie o texto, ou mande por e-mail.") +
        '</div>');

  folha("Mensagem" + (nome ? " pra " + nome : ""), corpo, rodape);

  if(ctx.modelo) msgEscolher(ctx.modelo);
}

function msgEscolher(k){
  if(!MSG) return;
  var m = null;
  for(var i=0;i<MODELOS.length;i++) if(MODELOS[i].k === k) m = MODELOS[i];
  MSG.modelo = m ? m.k : "";
  MSG.base = m ? m.txt : "";
  MSG.valores = {}; MSG.aplicado = {};

  var w = document.getElementById('msgPills');
  if(w){
    var bts = w.querySelectorAll('[data-a="msgModelo"]');
    for(var j=0;j<bts.length;j++){
      bts[j].classList.toggle('on', (bts[j].getAttribute('data-k') || "") === MSG.modelo);
    }
  }
  var ta = document.getElementById('msgTexto');
  if(ta) ta.value = msgTrocar(MSG.base, MSG.mapa);
  msgPintarVars();
}
ACOES.msgModelo = function(el){ msgEscolher(el.getAttribute('data-k') || ""); };

function msgPintarVars(){
  var w = document.getElementById('msgVars');
  if(!w || !MSG) return;
  var ta = document.getElementById('msgTexto');
  var faltam = msgFaltando(ta ? ta.value : "");
  MSG.faltavam = faltam.join(",");
  if(!faltam.length){ w.innerHTML = ""; return; }

  var h = '<div class="fld"><label>Falta preencher</label></div>';
  for(var i=0;i<faltam.length;i++){
    var v = faltam[i];
    var dica = "";
    if(v === "assunto" && MSG.n && MSG.n.ultimoToqueTxt) dica = MSG.n.ultimoToqueTxt;
    if(v === "gancho") dica = "saiu materia do setor, indicacao nova, mudanca na marca";
    h += '<div class="fld">' +
      '<label>' + esc(MSG_ROTULOS[v] || v) + '</label>' +
      '<input class="inp" data-v="' + esc(v) + '" autocomplete="off" maxlength="200" ' +
        'placeholder="' + esc(dica) + '" value="' + esc(MSG.valores[v] || "") + '">' +
    '</div>';
  }
  h += '<div class="tiny muted">O que voce escrever aqui entra no texto na hora. ' +
       'O que ficar entre chaves vai junto pro WhatsApp, entao apague antes de mandar.</div>';
  w.innerHTML = h;
}

// Troca no texto ATUAL da previa, nao remonta do modelo. Assim a edicao
// que a pessoa fez a mao nao e jogada fora a cada letra digitada no campo.
function msgAplicarVar(v, valor){
  var ta = document.getElementById('msgTexto');
  if(!ta || !MSG) return;
  MSG.valores[v] = valor;
  var antes = (MSG.aplicado[v] != null && MSG.aplicado[v] !== "") ? MSG.aplicado[v] : ("{" + v + "}");
  var depois = valor || ("{" + v + "}");
  if(antes === depois) return;
  if(ta.value.indexOf(antes) === -1) return;    // a pessoa apagou o trecho, nao inventa
  ta.value = ta.value.split(antes).join(depois);
  MSG.aplicado[v] = valor;
}

ACOES.msgCopiar = function(){
  var ta = document.getElementById('msgTexto');
  var txt = ta ? ta.value : "";
  if(!txt.trim()){ toast("Nao tem texto pra copiar", "bad"); return; }
  cadCopiar(txt);      // string montada ANTES da chamada de clipboard
};
ACOES.msgAbrir = function(){
  var ta = document.getElementById('msgTexto');
  cadAbrirConversa(MSG && MSG.tel, ta ? ta.value : "");
};
ACOES.msgAbrirCru = function(){
  cadAbrirConversa(MSG && MSG.tel, "");
};

function cadAbrirConversa(tel, texto){
  var url = linkWhats(tel, texto || "");
  if(!url){ toast("Esse contato nao tem telefone com DDD", "bad"); return; }

  // CAPTURA NO RETORNO. Grava no localStorage, NAO em memoria: no celular
  // o webview e descarregado enquanto o WhatsApp esta aberto e a memoria
  // some junto, entao a pergunta da volta nunca apareceria.
  if(MSG){
    guardar("pendente", { negocioId:MSG.negocioId || "", contatoId:MSG.contatoId || "",
                          nome:MSG.nome || "", quando:Date.now() });
  }
  fecharFolha();
  // window.open porque a delegacao do shell da preventDefault em tudo que
  // tem data-a. Se o navegador bloquear a aba, vai no mesmo lugar, que no
  // celular e o comportamento normal (o WhatsApp assume a tela).
  var w = null;
  try{ w = window.open(url, "_blank"); }catch(e){ w = null; }
  if(!w) location.href = url;
}

/* ---------------------------------------------------------------------
   A PERGUNTA DA VOLTA
   Chamada pelo shell na volta ao foco e na inicializacao. O registro
   acontece NA VOLTA, com a conversa fresca, e nao antes de sair, quando a
   pessoa esta com pressa e ainda nao sabe o que aconteceu.
   --------------------------------------------------------------------- */
// A barra ja existe no corpo da pagina (<div id="barraRetorno" hidden>) e o
// design system ja a posiciona: presa embaixo, largura inteira, e em
// bottom:62px no celular, que e logo acima da barra de abas. Aqui so se
// preenche e se mostra. Pendurar na regiao dos toasts nao serve: aquele
// embrulho tem transform, e transform vira o bloco de referencia de tudo
// que e position:fixed la dentro, entao a barra encolheria no meio da tela.
function cadBarraRetorno(){
  var b = document.getElementById('barraRetorno');
  if(!b){
    b = document.createElement('div');
    b.id = "barraRetorno"; b.hidden = true;
    document.body.appendChild(b);
  }
  return b;
}
function esconderBarraRetorno(){
  var b = document.getElementById('barraRetorno');
  if(b){ b.hidden = true; b.innerHTML = ""; }
}

function perguntarDoRetorno(){
  esconderBarraRetorno();
  if(!SESSAO) return;

  var p = recuperar("pendente", null);
  if(!p || !p.quando) return;
  if(Date.now() - p.quando > 3*3600*1000){ esquecer("pendente"); return; }  // 3 horas

  var quem = cadPrimeiroNome(p.nome) || "o contato";
  var b = cadBarraRetorno();
  // Botao de tamanho cheio, nao btn-sm: essa barra e usada com o polegar,
  // na rua, com o WhatsApp ainda aberto atras.
  b.innerHTML =
    '<span class="rt-q">Falou com ' + esc(quem) + '?</span>' +
    '<button class="btn btn-primary" data-a="retFalei">Falei</button>' +
    '<button class="btn" data-a="retSemResposta">Sem resposta</button>' +
    '<button class="btn btn-ghost" data-a="retDepois">Depois</button>';
  b.hidden = false;
}

ACOES.retDepois = function(){
  // "Depois" apaga o pendente de proposito: manter faria a mesma pergunta
  // voltar a cada troca de aba por 3 horas, e alarme repetido e alarme
  // que a pessoa aprende a ignorar.
  esquecer("pendente");
  perguntarDoRetorno();
};
ACOES.retFalei       = function(){ abrirRetorno(true); };
ACOES.retSemResposta = function(){ abrirRetorno(false); };

function abrirRetorno(falou){
  RET_SALVANDO = false;
  var p = recuperar("pendente", null);
  if(!p){ perguntarDoRetorno(); return; }
  esquecer("pendente");
  esconderBarraRetorno();

  var n = p.negocioId ? achar("negocios", p.negocioId) : null;
  var quem = cadPrimeiroNome(p.nome) || "o contato";
  var padrao = falou ? "" : "Mandei mensagem no WhatsApp, sem resposta ate agora";
  var bloqueio = motivoBloqueio("crm_atividades", { tipo:"whats" });

  var corpo =
    '<form class="form" id="retForm" data-a="salvarRetorno">' +
      '<input type="hidden" id="retNegocio" value="' + esc(p.negocioId || "") + '">' +
      '<input type="hidden" id="retContato" value="' + esc(p.contatoId || "") + '">' +
      '<div class="fld">' +
        '<label>O que aconteceu</label>' +
        '<textarea class="inp" id="retTexto" rows="3" maxlength="1200" ' +
          'placeholder="' + (falou ? 'ficou de responder ate quinta, quer ver numero de midia' : 'sem resposta') + '">' +
          esc(padrao) + '</textarea>' +
        '<div class="hint">Pode deixar em branco. O registro vale mais que o texto.</div>' +
      '</div>' +
      (n ? '<div id="retProx"></div>' :
           '<div class="tiny muted">Essa conversa nao esta amarrada a negocio nenhum, ' +
           'entao vai ficar so como registro na pessoa.</div>') +
      '<div class="fld"><div class="err" id="retErr"></div></div>' +
    '</form>';

  var rodape =
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Agora nao</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="retForm"' +
        (bloqueio ? ' disabled' : '') + '>Salvar</button>' +
      cadMotivo(bloqueio) +
    '</div>';

  folha("Falou com " + quem + "?", corpo, rodape);
  if(n){
    var w = document.getElementById('retProx');
    // Com o negocio cru, o bloco reapresentaria o passo que a pessoa ACABOU
    // de cumprir na conversa, com a data vencida, e salvar deixaria o negocio
    // atrasado do mesmo jeito. semProxPasso limpa o passo antigo pra que o
    // bloco ofereca a sugestao do estagio.
    if(w) w.innerHTML = blocoProxPasso('rp', semProxPasso(n), true);
  }
}

var RET_SALVANDO = false;   // trava contra duplo toque, igual ao resto do arquivo

ACOES.salvarRetorno = function(){
  if(RET_SALVANDO) return;
  var err = document.getElementById('retErr');
  function falha(m){ RET_SALVANDO = false; if(err) err.textContent = m; toast(m, "bad"); }

  var negocioId = (document.getElementById('retNegocio').value || "");
  var contatoId = (document.getElementById('retContato').value || "");
  var texto = (document.getElementById('retTexto').value || "").trim() || "Conversa no WhatsApp";
  var n = negocioId ? achar("negocios", negocioId) : null;

  var motivo = motivoBloqueio("crm_atividades", { tipo:"whats" });
  if(motivo){ falha(motivo); return; }

  if(n){
    var pp = lerProxPasso('rp');
    if(!pp || !pp.ok){ falha((pp && pp.erro) || "Marque o proximo passo com tipo e data."); return; }
    // O proximo passo vai em dados.prox, que e exatamente o que
    // lerProxPasso() devolve. Mandar proxTipo e proxData soltos na raiz
    // entra no registro e NAO mexe no proximo passo do negocio.
    RET_SALVANDO = true;
    registrarAtividade(negocioId, {
      tipo:"whats", texto:texto.slice(0,1200), quando:hojeISO(),
      prox:pp
    }).then(function(){
      RET_SALVANDO = false;
      fecharFolha(); toast("Registrado", "ok"); redesenhar();
    }).catch(function(e){
      falha("Nao deu pra salvar: " + ((e && e.message) || "erro"));
    });
    return;
  }

  // Sem negocio, e uma atividade de pessoa: 1 escrita, sem proximo passo.
  var id = idAtiv();
  RET_SALVANDO = true;
  gravar("crm_atividades", id, {
    negocioId:"", contatoId:contatoId, tipo:"whats", texto:texto.slice(0,1200),
    quando:hojeISO(), ts:Date.now(), por:(SESSAO && SESSAO.nome) || "", de:"", para:""
  }).then(function(){
    RET_SALVANDO = false;
    fecharFolha(); toast("Registrado", "ok");
  }).catch(function(e){
    falha("Nao deu pra salvar: " + ((e && e.message) || "erro"));
  });
};

    'desenho de tela, nao fechadura: ela decide o que aparece pra cada pessoa, nao o que o ' +
    'banco aceita. Vale contra o erro do dia a dia e contra quem passa perto da tela, ' +
    'nao contra quem quer entrar de verdade. Nada que nao pode vazar deve ser guardado no CRM.' +
    '</p>' +
    '<p class="tiny muted" style="margin-top:8px;line-height:1.6">' +
    'A senha nao e recuperavel, so trocavel: o que fica gravado e o embaralhado dela, nunca ela. ' +
    'E quem criou e quem registrou sao o nome do ACESSO, nao da pessoa, porque senha se ' +
    'empresta. Serve pra separar duas pessoas que confiam uma na outra, nao como prova de nada.' +
    '</p></div>';

  return h;
};

function acTabela(){
  var h = '<div class="tw no-mob"><table class="tb"><thead><tr>' +
    '<th>Nome</th><th>Perfil</th><th>Situacao</th><th>Criado em</th><th class="r">Acoes</th>' +
    '</tr></thead><tbody>';
  for(var i=0;i<ACESSOS.length;i++){
    var a = ACESSOS[i];
    var eu = (SESSAO && SESSAO.acessoId === a.id);
    var perfil = (PERFIS[a.perfil] || {}).rotulo || a.perfil || "sem perfil";
    h += '<tr>' +
      '<td><div class="cel-nome">' + esc(a.nome || "sem nome") + (eu ? ' <span class="tag tag-lime">voce</span>' : '') + '</div>' +
        '<div class="cel-sub">' + esc(a.id || "") + '</div></td>' +
      '<td><span class="tag' + (a.perfil === "admin" ? ' tag-lime' : '') + '">' + esc(perfil) + '</span></td>' +
      '<td>' + (a.ativo === false
        ? '<span class="tag tag-red">desativado</span>'
        : '<span class="tag tag-green">ativo</span>') + '</td>' +
      '<td class="small muted">' + esc(a.criadoEm ? dataBR(a.criadoEm) : "sem data") + '</td>' +
      '<td class="r"><div class="pills" style="justify-content:flex-end">' + acBotoes(a) + '</div></td>' +
    '</tr>';
  }
  return h + '</tbody></table></div>';
}

// Abaixo de 860px a tabela vira lista de cartao. O admin tambem mexe em
// acesso do celular, geralmente quando alguem perdeu a senha na sexta.
function acCartoes(){
  // O flex vai num div POR DENTRO do .only-mob. Estilo em linha no proprio
  // .only-mob ganha do display:none da classe e a lista de cartao apareceria
  // tambem no computador, embaixo da tabela, duas vezes a mesma coisa.
  var h = '<div class="only-mob"><div style="display:flex;flex-direction:column;gap:10px">';
  for(var i=0;i<ACESSOS.length;i++){
    var a = ACESSOS[i];
    var eu = (SESSAO && SESSAO.acessoId === a.id);
    var perfil = (PERFIS[a.perfil] || {}).rotulo || a.perfil || "sem perfil";
    h += '<div class="card" style="padding:14px">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">' +
        '<div style="min-width:0">' +
          '<div class="cel-nome truncate">' + esc(a.nome || "sem nome") + (eu ? ' (voce)' : '') + '</div>' +
          '<div class="cel-sub">criado em ' + esc(a.criadoEm ? dataBR(a.criadoEm) : "data desconhecida") + '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<span class="tag' + (a.perfil === "admin" ? ' tag-lime' : '') + '">' + esc(perfil) + '</span><br>' +
          (a.ativo === false ? '<span class="tag tag-red" style="margin-top:5px">desativado</span>'
                             : '<span class="tag tag-green" style="margin-top:5px">ativo</span>') +
        '</div>' +
      '</div>' +
      '<div class="pills" style="margin-top:11px">' + acBotoes(a) + '</div>' +
    '</div>';
  }
  return h + '</div></div>';
}

function acBotoes(a){
  var eu = (SESSAO && SESSAO.acessoId === a.id);
  var ultimoAdmin = acEhUltimoAdmin(a);
  var h = '<button class="btn btn-sm" data-a="acSenha" data-id="' + esc(a.id) + '">Trocar senha</button>' +
          '<button class="btn btn-sm" data-a="acPerfil" data-id="' + esc(a.id) + '">Trocar perfil</button>';
  if(a.ativo === false){
    h += '<button class="btn btn-sm btn-primary" data-a="acAtivar" data-id="' + esc(a.id) + '">Ativar</button>';
  } else {
    // Bloqueio visivel e desabilitado, com o motivo do lado. Sumir com o
    // botao faria o admin achar que a tela quebrou.
    var motivo = eu ? "nao da pra desativar o proprio acesso"
               : (ultimoAdmin ? "e o ultimo admin ativo" : "");
    h += '<button class="btn btn-sm btn-danger" data-a="acDesativar" data-id="' + esc(a.id) + '"' +
         (motivo ? ' disabled' : '') + '>Desativar</button>' +
         (motivo ? '<span class="tiny" style="color:var(--text3)">' + esc(motivo) + '</span>' : '');
  }
  return h;
}

function acEhUltimoAdmin(a){
  if(a.perfil !== "admin" || a.ativo === false) return false;
  var n = 0;
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].perfil === "admin" && ACESSOS[i].ativo !== false) n++;
  }
  return n <= 1;
}
function acPorId(id){
  for(var i=0;i<ACESSOS.length;i++) if(ACESSOS[i].id === id) return ACESSOS[i];
  return null;
}
// Varre a lista INTEIRA, inclusive desativados. Se so olhasse os ativos,
// reativar depois criaria dois logins com o mesmo nome ou o mesmo hash, e
// a autoria de tudo passaria a depender da ordem do laco do login.
function acNomeRepetido(nome, exceto){
  var k = chave(nome);
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].id === exceto) continue;
    if(chave(ACESSOS[i].nome) === k) return ACESSOS[i];
  }
  return null;
}
function acHashRepetido(hash, exceto){
  if(hash && hash === ACESSO_RECUPERACAO.hash) return { nome:"Recuperacao" };
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].id === exceto) continue;
    if(ACESSOS[i].hash && ACESSOS[i].hash === hash) return ACESSOS[i];
  }
  return null;
}

ACOES.acRecarregar = function(){
  toast("Lendo a lista...");
  carregarAcessos().then(function(acc){
    toast(acc.length ? acc.length + " acessos lidos" : "Nao deu pra ler a lista", acc.length ? "ok" : "bad");
    redesenhar();
  });
};

/* ---------- cartao da senha, o unico lugar onde ela aparece ---------- */
function acCartaoSenha(){
  var s = SENHA_NOVA;
  var txt = "Sua senha do CRM Lime: " + s.senha +
            ". Guarde no gerenciador de senha, ela nao aparece de novo. " +
            "Se quiser trocar, tem 'Trocar a minha senha' no menu.";
  var link = linkWhats(s.tel, txt);
  return '<div class="card card-lime" style="margin-bottom:16px">' +
    '<div class="h3">Senha de ' + esc(s.nome) + '</div>' +
    '<div class="num" style="font-size:38px;color:var(--lime);margin:10px 0;' +
      'word-break:break-all;line-height:1.1">' + esc(s.senha) + '</div>' +
    '<p class="tiny muted" style="line-height:1.6">' +
      'Essa senha nao aparece de novo em lugar nenhum, e nao da pra recuperar: o que fica ' +
      'gravado e so o embaralhado dela. Copie agora e mande pra pessoa. Se perder, o ' +
      'caminho e criar uma nova aqui.' +
    '</p>' +
    '<div class="pills" style="margin-top:12px">' +
      '<button class="btn btn-sm btn-primary" data-a="acCopiarSenha">Copiar senha</button>' +
      (link ? '<button class="btn btn-sm" data-a="acMandarSenha">Mandar no WhatsApp</button>' : '') +
      '<button class="btn btn-sm btn-ghost" data-a="acFechouSenha">Ja anotei, pode sumir</button>' +
    '</div></div>';
}
ACOES.acCopiarSenha = function(){ if(SENHA_NOVA) cadCopiar(SENHA_NOVA.senha); };
ACOES.acMandarSenha = function(){
  if(!SENHA_NOVA) return;
  var url = linkWhats(SENHA_NOVA.tel,
    "Sua senha do CRM Lime: " + SENHA_NOVA.senha +
    ". Guarde no gerenciador de senha, ela nao aparece de novo.");
  if(!url){ toast("Esse numero nao da pra usar no WhatsApp", "bad"); return; }
  var w = null;
  try{ w = window.open(url, "_blank"); }catch(e){ w = null; }
  if(!w) location.href = url;
};
ACOES.acFechouSenha = function(){ SENHA_NOVA = null; redesenhar(); };

/* ---------- criar acesso ---------- */
ACOES.acNovo = function(){
  var bloqueio = motivoBloqueio("crm_acessos");
  var opc = "";
  for(var k in PERFIS){
    if(!Object.prototype.hasOwnProperty.call(PERFIS, k)) continue;
    opc += '<option value="' + esc(k) + '"' + (k === "vendedor" ? ' selected' : '') + '>' +
           esc(PERFIS[k].rotulo) + '</option>';
  }
  folha("Novo acesso",
    '<form class="form" id="acForm" data-a="acSalvarNovo">' +
      '<div class="fld"><label>Nome <span class="req">*</span></label>' +
        '<input class="inp" id="acNome" maxlength="60" autocomplete="off" placeholder="Comercial"></div>' +
      '<div class="fld"><label>Perfil <span class="req">*</span></label>' +
        '<select class="inp" id="acPerfilNovo">' + opc + '</select>' +
        '<div class="hint">Vendedor mexe em tudo do comercial. Gestor so ve, e registra Nota. ' +
        'Admin ainda mexe em acesso.</div></div>' +
      '<div class="fld"><label>WhatsApp pra mandar a senha</label>' +
        '<input class="inp" id="acTel" inputmode="tel" maxlength="20" placeholder="(11) 98765-4321">' +
        '<div class="hint">Nao fica guardado. Serve so pra montar o link agora.</div></div>' +
      '<p class="tiny muted">A senha e sorteada com 12 caracteres e aparece no fim, ' +
      'num cartao que so some quando voce mandar.</p>' +
      '<div class="fld"><div class="err" id="acErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Cancelar</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="acForm"' +
        (bloqueio ? ' disabled' : '') + '>Criar acesso</button>' +
      cadMotivo(bloqueio) + '</div>');
};

ACOES.acSalvarNovo = function(){
  var err = document.getElementById('acErr');
  function falha(m){ if(err) err.textContent = m; }

  var motivo = motivoBloqueio("crm_acessos");
  if(motivo){ falha(motivo); return; }

  var nome = (document.getElementById('acNome').value || "").trim();
  var perfil = document.getElementById('acPerfilNovo').value;
  var tel = (document.getElementById('acTel').value || "").trim();
  if(nome.length < 2){ falha("Escreva o nome do acesso."); return; }
  if(!PERFIS[perfil]){ falha("Escolha um perfil."); return; }

  var rep = acNomeRepetido(nome, null);
  if(rep){
    falha('Ja existe um acesso chamado "' + rep.nome + '" (' +
          (rep.ativo === false ? "desativado" : "ativo") +
          '). Reative ou troque a senha dele, senao ficam dois logins iguais e ' +
          'ninguem sabe quem registrou o que.');
    return;
  }

  var senha = senhaGerada();
  var id = idNovo("ac");
  err.textContent = "Criando...";

  sha256(senha).then(function(h){
    var colisao = acHashRepetido(h, null);
    if(colisao) throw new Error('Essa senha sorteada ja e de "' + colisao.nome + '". Tente de novo.');
    var doc = {
      id:id, nome:nome.slice(0,60), perfil:perfil, hash:h, ativo:true,
      criadoEm:hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || ""
    };
    // A lista local so muda depois que o banco confirma, porque aqui a
    // lista NAO passa pelo cache do gravar() (crm_acessos fica fora dele).
    return gravar("crm_acessos", id, doc).then(function(){ ACESSOS.push(doc); });
  }).then(function(){
    SENHA_NOVA = { nome:nome, senha:senha, tel:tel };
    fecharFolha();
    toast("Acesso criado", "ok");
    ir("acessos");            // ja redesenha, e o cartao da senha aparece no topo
  }).catch(function(e){
    if(e && e.message === "sem-crypto"){
      falha("Esse navegador nao embaralha senha aqui. Abra pelo endereco https, nao por arquivo local.");
    } else {
      falha("Nao deu: " + ((e && e.message) || "erro"));
    }
  });
};

/* ---------- trocar senha de outra pessoa ---------- */
ACOES.acSenha = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  var bloqueio = motivoBloqueio("crm_acessos");
  folha("Trocar a senha de " + a.nome,
    '<form class="form" id="asForm" data-a="acSalvarSenha">' +
      '<input type="hidden" id="asId" value="' + esc(a.id) + '">' +
      '<div class="fld"><label>Senha nova</label>' +
        '<input class="inp" id="asSenha" type="text" maxlength="60" autocomplete="off" ' +
          'value="' + esc(senhaGerada()) + '">' +
        '<div class="hint">Ja veio sorteada com 12 caracteres. Da pra escrever outra, ' +
        'com pelo menos 8 caracteres.</div></div>' +
      '<div class="fld"><label>WhatsApp pra mandar</label>' +
        '<input class="inp" id="asTel" inputmode="tel" maxlength="20" placeholder="(11) 98765-4321">' +
        '<div class="hint">Nao fica guardado.</div></div>' +
      '<p class="tiny muted">A senha antiga para de funcionar na hora. ' +
      'Quem estiver dentro continua ate a sessao vencer, em 7 dias.</p>' +
      '<div class="fld"><div class="err" id="asErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Cancelar</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="asForm"' +
        (bloqueio ? ' disabled' : '') + '>Salvar senha</button>' +
      cadMotivo(bloqueio) + '</div>');
};
ACOES.acSalvarSenha = function(){
  var err = document.getElementById('asErr');
  function falha(m){ if(err) err.textContent = m; }
  var motivo = motivoBloqueio("crm_acessos");
  if(motivo){ falha(motivo); return; }

  var id = document.getElementById('asId').value;
  var a = acPorId(id);
  if(!a){ falha("Esse acesso nao esta mais na lista."); return; }
  var senha = (document.getElementById('asSenha').value || "").trim();
  var tel = (document.getElementById('asTel').value || "").trim();
  if(senha.length < 8){ falha("Muito curta. Use pelo menos 8 caracteres."); return; }

  err.textContent = "Salvando...";
  sha256(senha).then(function(h){
    var colisao = acHashRepetido(h, id);
    if(colisao) throw new Error('Essa senha ja e de "' + colisao.nome +
      '". Duas senhas iguais fazem o login cair no primeiro da lista e a autoria vira loteria.');
    return gravar("crm_acessos", id, { hash:h }).then(function(){ a.hash = h; });
  }).then(function(){
    SENHA_NOVA = { nome:a.nome, senha:senha, tel:tel };
    fecharFolha();
    toast("Senha trocada", "ok");
    redesenhar();
  }).catch(function(e){
    if(e && e.message === "sem-crypto"){
      falha("Esse navegador nao embaralha senha aqui. Abra pelo endereco https.");
    } else {
      falha("Nao deu: " + ((e && e.message) || "erro"));
    }
  });
};

/* ---------- trocar perfil ---------- */
ACOES.acPerfil = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  var bloqueio = motivoBloqueio("crm_acessos");
  var ultimo = acEhUltimoAdmin(a);
  var opc = "";
  for(var k in PERFIS){
    if(!Object.prototype.hasOwnProperty.call(PERFIS, k)) continue;
    opc += '<option value="' + esc(k) + '"' + (k === a.perfil ? ' selected' : '') + '>' +
           esc(PERFIS[k].rotulo) + '</option>';
  }
  folha("Perfil de " + a.nome,
    '<form class="form" id="apForm" data-a="acSalvarPerfil">' +
      '<input type="hidden" id="apId" value="' + esc(a.id) + '">' +
      '<div class="fld"><label>Perfil</label>' +
        '<select class="inp" id="apPerfil"' + (ultimo ? ' disabled' : '') + '>' + opc + '</select>' +
        (ultimo ? cadMotivo("E o ultimo admin ativo. Promova outra pessoa a admin antes de " +
                            "rebaixar esse, senao ninguem mais abre esta tela.") : '') +
      '</div>' +
      '<p class="tiny muted">Vendedor mexe em tudo do comercial. Gestor so ve e registra Nota. ' +
      'Admin faz tudo isso e ainda mexe em acesso. Quem estiver logado pega o perfil novo ' +
      'na proxima vez que abrir.</p>' +
      '<div class="fld"><div class="err" id="apErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Cancelar</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="apForm"' +
        ((bloqueio || ultimo) ? ' disabled' : '') + '>Salvar perfil</button>' +
      cadMotivo(bloqueio) + '</div>');
};
ACOES.acSalvarPerfil = function(){
  var err = document.getElementById('apErr');
  function falha(m){ if(err) err.textContent = m; }
  var motivo = motivoBloqueio("crm_acessos");
  if(motivo){ falha(motivo); return; }

  var id = document.getElementById('apId').value;
  var a = acPorId(id);
  if(!a){ falha("Esse acesso nao esta mais na lista."); return; }
  var novo = document.getElementById('apPerfil').value;
  if(!PERFIS[novo]){ falha("Perfil desconhecido."); return; }
  if(novo === a.perfil){ fecharFolha(); return; }
  if(novo !== "admin" && acEhUltimoAdmin(a)){
    falha("E o ultimo admin ativo. Promova outra pessoa antes.");
    return;
  }

  var antes = a.perfil;
  a.perfil = novo;                       // otimista, igual ao resto do sistema
  gravar("crm_acessos", id, { perfil:novo })
    .then(function(){
      fecharFolha();
      toast("Perfil de " + a.nome + " agora e " + (PERFIS[novo].rotulo || novo), "ok");
      redesenhar();
    })
    .catch(function(e){
      a.perfil = antes;
      falha("Nao deu: " + ((e && e.message) || "erro"));
      redesenhar();
    });
};

/* ---------- ativar e desativar. NAO existe apagar ---------- */
ACOES.acDesativar = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  if(SESSAO && SESSAO.acessoId === a.id){
    toast("Nao da pra desativar o proprio acesso", "bad"); return;
  }
  if(acEhUltimoAdmin(a)){ toast("E o ultimo admin ativo", "bad"); return; }
  folha("Desativar " + a.nome,
    '<p class="muted2">A senha dessa pessoa para de funcionar na proxima vez que ela abrir o CRM. ' +
    'Tudo que ela registrou continua no lugar, com o nome dela.</p>' +
    '<p class="tiny muted" style="margin-top:10px">Nada e apagado: o acesso fica na lista como ' +
    'desativado e da pra reativar quando quiser. Apagar de verdade faria a autoria dos ' +
    'registros antigos apontar pra ninguem.</p>',
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Deixar como esta</button>' +
    '<button class="btn btn-danger" type="button" data-a="acDesativarMesmo" data-id="' +
      esc(a.id) + '">Desativar</button>');
};
ACOES.acDesativarMesmo = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  a.ativo = false;
  gravar("crm_acessos", a.id, { ativo:false })
    .then(function(){ fecharFolha(); toast(a.nome + " nao entra mais", "ok"); redesenhar(); })
    .catch(function(e){ a.ativo = true; toast("Nao deu: " + ((e && e.message) || "erro"), "bad"); redesenhar(); });
};
ACOES.acAtivar = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  a.ativo = true;
  gravar("crm_acessos", a.id, { ativo:true })
    .then(function(){
      toast(a.nome + " entra de novo com a senha antiga", "ok");
      redesenhar();
    })
    .catch(function(e){ a.ativo = false; toast("Nao deu: " + ((e && e.message) || "erro"), "bad"); redesenhar(); });
};

if(document.readyState === "loading") document.addEventListener('DOMContentLoaded', boot);
else boot();
