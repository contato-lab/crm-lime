/* ----- visão TODOS ----- */
function pesViewTodos(contatos){
  // Quantos negócios cada contato carrega, num passe só.
  var porContato = {}, neg = lista("negocios"), i;
  for(i=0;i<neg.length;i++) if(neg[i].contatoId) porContato[neg[i].contatoId] = (porContato[neg[i].contatoId]||0) + 1;

  var rank = rankIndicadores(), porInd = {};
  for(i=0;i<rank.length;i++) porInd[rank[i].id] = rank[i];

  var lst = contatos.filter(function(c){ return pesCasa(c, PESSOAS_FILTRO); });
  lst.sort(function(a,b){ return chave(a.nome) < chave(b.nome) ? -1 : 1; });

  if(!lst.length){
    if(PESSOAS_FILTRO){
      return `<div class="card"><div class="empty">
        <div class="ei">🔍</div><div class="et">Ninguém com esse nome</div>
        <div class="ex">Nenhum dos ${contatos.length} contatos casa com "${esc(PESSOAS_FILTRO)}".</div>
        <button class="btn" data-a="pessoasLimparFiltro">Limpar o filtro</button>
      </div></div>`;
    }
    return `<div class="card"><div class="empty">
      <div class="ei">👥</div><div class="et">Nenhum contato ainda</div>
      <div class="ex">Contato e indicador são a mesma ficha aqui. Cadastre quem te indica e quem decide na empresa cliente.</div>
      ${pesBotao("Cadastrar o primeiro contato","pessoasNovoContato",{},"btn-primary",motivoBloqueio("crm_contatos"))}
    </div></div>`;
  }

  var linhas = "", cards = "";
  for(i=0;i<lst.length;i++){
    var c = lst[i];
    var nNeg = porContato[c.id] || 0;
    var r = porInd[c.id];
    var selo = c.ehIndicador
      ? '<span class="tag tag-lime">Indicador</span>' + (r ? ' <span class="tiny muted">' + pesQtd(r.n,"indicação","indicações") + '</span>' : ' <span class="tiny muted">ainda sem indicação</span>')
      : (r ? '<span class="tiny muted">' + pesQtd(r.n,"indicação","indicações") + ', sem a marca de indicador</span>' : '<span class="muted">-</span>');

    linhas += `<tr data-a="ir" data-r="pessoa/${esc(c.id)}">
      <td><div class="cel-nome">${esc(c.nome)}</div><div class="cel-sub">${esc(c.cargo || "cargo não informado")}</div></td>
      <td>${esc(c.empresa || "-")}</td>
      <td class="nowrap">${c.tel ? esc(foneBR(c.tel)) : '<span class="muted">sem telefone</span>'}</td>
      <td class="r">${nNeg ? pesQtd(nNeg,"negócio","negócios") : '<span class="muted">0</span>'}</td>
      <td>${selo}</td>
    </tr>`;

    cards += `<div class="card" style="padding:13px;margin-bottom:9px;cursor:pointer" data-a="ir" data-r="pessoa/${esc(c.id)}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0">
          <div class="cel-nome truncate">${esc(c.nome)}</div>
          <div class="cel-sub truncate">${esc(c.empresa || "sem empresa")}${c.cargo ? ", " + esc(c.cargo) : ""}</div>
        </div>
        ${c.ehIndicador ? '<span class="tag tag-lime">Indicador</span>' : ''}
      </div>
      <div class="tiny muted" style="margin-top:7px">
        ${c.tel ? esc(foneBR(c.tel)) : "sem telefone"} · ${pesQtd(nNeg,"negócio","negócios")}${r ? " · " + pesQtd(r.n,"indicação","indicações") : ""}
      </div>
    </div>`;
  }

  return `<div>
    <div class="tw no-mob">
      <table class="tb">
        <thead><tr>
          <th>Pessoa</th><th>Empresa</th><th>Telefone</th><th class="r">Negócios</th><th>Indicação</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    <div class="only-mob">${cards}</div>
  </div>`;

/* ----- visão INDICADORES ----- */
function pesViewIndicadores(){
  var rank = rankIndicadores();
  var orfas = indicacoesSemDono();
  var visiveis = rank.filter(function(r){
    return pesCasa({ nome:r.nome, empresa:r.empresa, tel:r.tel }, PESSOAS_FILTRO);
  });

  var totN=0, totG=0, totGer=0, totMrr=0, totCota=0, totAb=0, i;
  for(i=0;i<rank.length;i++){
    totN += rank[i].n; totG += rank[i].ganhos; totGer += rank[i].gerado;
    totMrr += rank[i].mrrGerado; totCota += rank[i].cotaGerada; totAb += rank[i].emAberto;
  }

  if(!rank.length){
    // Sem ranking a tela NÃO pode acabar aqui. No primeiro dia a pilha diz
    // "Só indicadores (3)" e o ranking está vazio: se o bloco de marcados
    // sem indicar também some, o vendedor vê o contador prometer 3 pessoas
    // e a tela não mostrar nenhuma. São justamente as 3 ligações que ele
    // tem pra fazer hoje.
    return `<div class="card"><div class="empty">
      <div class="ei">🤝</div><div class="et">Nenhuma indicação anotada ainda</div>
      <div class="ex">Assim que um negócio for cadastrado com origem indicação e com quem indicou preenchido, o ranking aparece aqui sozinho, sem precisar recalcular nada.</div>
      ${orfas.length ? '<div class="tiny" style="color:var(--warn)">' + pesQtd(orfas.length,"negócio tem","negócios têm") + ' origem indicação mas ninguém anotado como indicador.</div>' : ''}
    </div></div>` + pesBlocoSemIndicar(rank);
  }

  var h = `<div class="kpis">
    <div class="kpi accent">
      <div class="kpi-l">Indicações recebidas</div>
      <div class="kpi-v lime">${totN}</div>
      <div class="kpi-s">de ${pesQtd(rank.length,"pessoa","pessoas")}${orfas.length ? ", mais " + orfas.length + " sem indicador anotado" : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-l">Viraram cliente</div>
      <div class="kpi-v green">${totG}</div>
      <div class="kpi-s">${totN ? pct((totG/totN)*100,0) + " de " + pesQtd(totN,"indicação","indicações") : "sem base ainda"}</div>
    </div>
    <div class="kpi">
      <div class="kpi-l">Gerado</div>
      <div class="kpi-v">${brlCurto(totGer)}</div>
      <div class="kpi-s">${brl(totMrr)}/mês de recorrente ativo, ${brl(totCota)} em cota</div>
    </div>
    <div class="kpi">
      <div class="kpi-l">Em aberto</div>
      <div class="kpi-v warn">${brlCurto(totAb)}</div>
      <div class="kpi-s">${pesQtd(rank.reduce(function(s,r){ return s + r.abertos; },0),"negócio indicado","negócios indicados")} ainda em jogo</div>
    </div>
  </div>`;

  h += pesTabelaRank(visiveis, rank.length);
  h += pesBlocoBuraco(totN, totG, totGer, orfas);
  h += pesBlocoEsfriando(rank);
  h += pesBlocoSemIndicar(rank);
  h += pesBlocoComparativo();
  return h;
}

function pesTabelaRank(rank, totalGeral){
  if(!rank.length){
    return `<div class="card"><div class="empty">
      <div class="ei">🔍</div><div class="et">Nenhum indicador com esse nome</div>
      <div class="ex">O ranking tem ${pesQtd(totalGeral,"indicador","indicadores")}, nenhum casa com "${esc(PESSOAS_FILTRO)}".</div>
      <button class="btn" data-a="pessoasLimparFiltro">Limpar o filtro</button>
    </div></div>`;
  }

  var linhas = "", cards = "", i, r;
  for(i=0;i<rank.length;i++){
    r = rank[i];
    var conv = pct(r.conversao, 0) + ' <span class="tiny muted">(' + r.ganhos + ' de ' + r.n + ')</span>';
    var abre = r.semCadastro ? "" : ' data-a="ir" data-r="pessoa/' + esc(r.id) + '"';

    linhas += `<tr${abre}>
      <td>
        <div class="cel-nome">${esc(r.nome)}${r.frio ? ' <span class="tag tag-warn">Esfriando</span>' : ''}</div>
        <div class="cel-sub">${esc(r.empresa || "sem empresa")}${r.ultimaEm ? ", última em " + esc(dataBR(r.ultimaEm)) : ""}${r.semCadastro ? ", contato não cadastrado" : ""}</div>
      </td>
      <td class="r">${r.n}</td>
      <td class="r">${r.ganhos}</td>
      <td class="r nowrap">${conv}</td>
      <td class="r nowrap">${r.gerado ? esc(brl(r.gerado)) : '<span class="muted">R$ 0</span>'}</td>
      <td class="r nowrap">${r.mrrGerado ? esc(brl(r.mrrGerado)) + '<span class="tiny muted">/mês</span>' : '<span class="muted">-</span>'}</td>
      <td class="r nowrap">${r.cotaGerada ? esc(brl(r.cotaGerada)) : '<span class="muted">-</span>'}</td>
      <td class="r nowrap">${r.emAberto ? esc(brl(r.emAberto)) : '<span class="muted">-</span>'}</td>
    </tr>`;

    // No celular a tabela vira cartão. O vendedor abre isso com uma mão só
    // depois da reunião, e tabela de 8 colunas no bolso é ilegível.
    cards += `<div class="card" style="padding:13px;margin-bottom:9px${r.semCadastro ? "" : ";cursor:pointer"}"${r.semCadastro ? "" : ' data-a="ir" data-r="pessoa/' + esc(r.id) + '"'}>
      <div style="display:flex;justify-content:space-between;gap:9px;align-items:flex-start">
        <div style="min-width:0">
          <div class="cel-nome truncate">${esc(r.nome)}</div>
          <div class="cel-sub truncate">${esc(r.empresa || "sem empresa")}</div>
        </div>
        ${r.frio ? '<span class="tag tag-warn">Esfriando</span>' : ''}
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:9px">
        <div><div class="tiny muted">Indicações</div><div class="num" style="font-size:19px">${r.n}</div></div>
        <div><div class="tiny muted">Viraram cliente</div><div class="num" style="font-size:19px">${r.ganhos} <span class="tiny muted">${pct(r.conversao,0)} de ${r.n}</span></div></div>
        <div><div class="tiny muted">Gerado</div><div class="num" style="font-size:19px">${brlCurto(r.gerado)}</div></div>
      </div>
      <div class="tiny muted" style="margin-top:8px">
        ${r.mrrGerado ? esc(brl(r.mrrGerado)) + "/mês de recorrente · " : ""}${r.cotaGerada ? esc(brl(r.cotaGerada)) + " em cota · " : ""}${r.emAberto ? esc(brl(r.emAberto)) + " em aberto" : "nada em aberto"}
      </div>
    </div>`;
  }

  return `<div>
    <div class="sec-title">Quem indicou, e o que aquilo virou${ajuda("indicacao")}</div>
    <div class="sec-sub">Ordenado por R$ gerado. Toda taxa vem com o n ao lado, porque 100% com uma indicação não é 100%, é uma indicação.${
      // Com filtro ligado a tabela mostra menos linhas que os totais de
      // cima, que continuam somando o ranking inteiro. Sem esta linha as
      // duas metades da tela discordam sem explicação.
      (PESSOAS_FILTRO && rank.length < totalGeral)
        ? ' Mostrando ' + rank.length + ' de ' + pesQtd(totalGeral,"indicador","indicadores") + ', filtrado por "' + esc(PESSOAS_FILTRO) + '". Os números grandes acima somam o ranking inteiro.'
        : ''}</div>
    <div class="tw no-mob" style="margin-top:12px">
      <table class="tb">
        <thead><tr>
          <th>Quem indicou</th>

          <th class="r">Recorrente (R$/mês)</th>
          <th class="r">Cota (R$)</th>
          <th class="r">Em aberto (R$)</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    <div class="only-mob" style="margin-top:12px">${cards}</div>
    <div class="tiny muted" style="margin-top:9px;line-height:1.6">
      Gerado junta valor total de contrato de agência (fee vezes meses) com cota de patrocínio (pagamento único). Serve pra dimensionar o esforço comercial, não é caixa do mês.

      Recorrente conta só contrato ativo, contrato encerrado continua contando em Gerado porque a porta foi aberta do mesmo jeito.
    </div>
  </div>`;
}

/* A linha do buraco. Número derivado sem o buraco declarado é número em
   que ninguém deveria acreditar. */
function pesBlocoBuraco(totN, totG, totGer, orfas){
  var medio;
  if(totN >= 8){
    medio = `<b>${esc(brl(Math.round(totGer/totN)))}</b> por indicação recebida <span class="tiny muted">(${esc(brl(totGer))} gerados divididos por ${totN} indicações, contando as que não fecharam)</span>`;
  } else {
    // Abaixo de 8 não existe média honesta aqui: a mediana por indicacao
    // daria R$ 0 na maioria das bases pequenas (a maior parte das
    // indicações ainda não fechou) e leria como "indicação não vale nada",
    // que é o contrário do que o dado diz. Então mostra os brutos.
    medio = `<b>${esc(brl(totGer))}</b> gerados em ${pesQtd(totN,"indicação","indicações")}, ${pesQtd(totG,"virou","viraram")} cliente <span class="tiny" style="color:var(--text3);opacity:.7">amostra pequena demais pra média, precisa de 8 indicações</span>`;
  }

  var buraco = orfas.length
    ? `<div class="tiny" style="color:var(--warn);margin-top:7px">(${pesQtd(orfas.length,"negócio","negócios")} com origem indicação e indicador não informado ${orfas.length === 1 ? "ficou" : "ficaram"} de fora desta conta)</div>`
    : `<div class="tiny muted" style="margin-top:7px">Nenhum negócio com origem indicação ficou sem indicador anotado. A conta acima cobre todos.</div>`;

  return `<div class="card">
    <div class="h3" style="margin-bottom:7px">Valor médio da indicação</div>
    <div style="font-size:15px">${medio}</div>
    ${buraco}
  </div>`;
}

/* Indicador esfriando: 2 indicações ganhas ou mais e mais de 120 dias sem
   indicar. Pra uma agência que só entra por indicação, mandar a m5 pra
   essas pessoas é a ação de maior retorno disponível no sistema inteiro. */
function pesBlocoEsfriando(rank){
  var frios = rank.filter(function(r){ return r.frio; });
  if(!frios.length) return "";

  var itens = frios.map(function(r){
    var semTel = pesMotivoTel(r.tel);
    return `<div class="card" style="background:var(--card2);padding:13px;margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div style="min-width:0">
          <div class="cel-nome">${esc(r.nome)}</div>
          <div class="cel-sub">${esc(r.empresa || "sem empresa")}${r.ultimaEm ? ", última indicação em " + esc(dataBR(r.ultimaEm)) + " (" + pesDias(r.diasSemIndicar) + " atrás)" : ""}</div>
          <div class="tiny muted" style="margin-top:5px">${pesQtd(r.n,"indicação","indicações")}, ${pesQtd(r.ganhos,"virou","viraram")} cliente, ${esc(brl(r.gerado))} gerados${r.acordo ? " · acordo: " + esc(r.acordo) : ""}</div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start">

/* Marcado como indicador e que nunca indicou. Não é "frio" pela regra dos
   120 dias (nunca teve a primeira), mas é a mesma ligação. */
function pesBlocoSemIndicar(rank){
  var tem = {}, i;
  for(i=0;i<rank.length;i++) tem[rank[i].id] = true;
  var zerados = lista("contatos").filter(function(c){ return c.ehIndicador && !tem[c.id]; });
  if(!zerados.length) return "";

  zerados.sort(function(a,b){ return chave(a.nome) < chave(b.nome) ? -1 : 1; });
  var itens = zerados.map(function(c){
    var semTel = pesMotivoTel(c.tel);
    return `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--border)">
      <div style="min-width:0">
        <div class="cel-nome truncate">${esc(c.nome)}</div>
        <div class="cel-sub truncate">${esc(c.empresa || "sem empresa")}</div>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        ${pesBotao("Pedir indicação","pessoaPedirIndicacao",{ id:c.id },"",semTel)}
        ${pesBotao("Abrir","ir",{ r:"pessoa/" + c.id },"btn-sm",null)}
      </div>
    </div>`;
  }).join("");

  return `<div class="card">
    <div class="sec-title">Marcados como indicador, ainda sem indicar</div>
    <div class="sec-sub">${pesQtd(zerados.length,"pessoa está","pessoas estão")} com a marca de indicador e nenhuma indicação anotada até agora.</div>
    <div style="margin-top:11px">${itens}</div>
  </div>`;
}

/* Indicado contra não indicado. A frase só aparece quando os DOIS lados
   têm n suficiente: comparar 8 fechados com 2 fechados produz uma frase
   redonda e falsa, e frase redonda e falsa é o jeito mais rápido de o
   sistema inteiro perder a confiança de quem le. */
function pesBlocoComparativo(){
  var c = pesComparaIndicacao(), a = c.ind, b = c.out;
  if(!a.nFech && !b.nFech) return "";

  var partes = [];
  if(a.nFech >= 3 && b.nFech >= 3){
    if(b.taxa > 0 && a.taxa > 0){
      var r = a.taxa / b.taxa;
      if(r >= 1.05)      partes.push("ganha " + pesNumBR(r) + " vezes mais");
      else if(r <= 0.95) partes.push("ganha " + pesNumBR(1/r) + " vezes menos");
      else               partes.push("ganha na mesma proporção");
    } else if(a.taxa > 0 && b.taxa === 0){
      // Dizer "nenhum negócio de outra origem fechou ainda" seria falso:
      // eles fecharam, todos perdidos, e o bloco ao lado mostra o número.
      partes.push("ganha " + pct(a.taxa,0) + " das vezes, e nenhum dos " +
                  pesQtd(b.nFech, "negócio", "negócios") + " de outra origem foi ganho");
    }
  }
  if(a.ciclos.length >= 3 && b.ciclos.length >= 3){
    var d = mediana(b.ciclos) - mediana(a.ciclos);
    if(d > 0)      partes.push("fecha " + pesDias(d) + " antes");
    else if(d < 0) partes.push("fecha " + pesDias(-d) + " depois");
    else           partes.push("fecha no mesmo tempo");
  }
  var frase = partes.length ? "Negócio indicado " + partes.join(" e ") + "." : "";

  /* Quando a frase não sai, a tela precisa dizer o motivo CERTO. Antes ela
     acusava sempre amostra pequena, e mentia na base em que os dois lados
     tinham 3 fechados ou mais e ninguém tinha ganhado nada ainda: os
     números logo abaixo mostravam 3 e 3, e o texto dizia que faltava
     amostra. Texto que discorda do número ao lado derruba a confiança em
     todo o resto da tela. */
  var semFrase;
  if(a.nFech < 3 || b.nFech < 3){
    var curto = a.nFech < 3 ? "os indicados" : "as outras origens";
    semFrase = "Ainda não dá pra comparar: " + curto + " tem " +
      pesQtd(Math.min(a.nFech, b.nFech), "negócio fechado", "negócios fechados") +
      ", e abaixo de 3 a frase sai bonita e errada. Indicados: " +
      pesQtd(a.nFech, "fechado", "fechados") + ". Outras origens: " +
      pesQtd(b.nFech, "fechado", "fechados") + ".";
  } else if(!a.nGanhos && !b.nGanhos){
    semFrase = "Os dois lados já têm fechamento suficiente (" + a.nFech + " indicados e " +
      b.nFech + " de outras origens), mas nenhum negócio foi ganho ainda, então não existe taxa pra comparar.";
  } else if(!a.nGanhos){
    semFrase = "Nenhum dos " + pesQtd(a.nFech, "negócio indicado fechado", "negócios indicados fechados") +
      " foi ganho ainda, então a comparação de taxa sairia como zero contra tudo e não diria nada.";
  } else {
    semFrase = "Dá pra comparar a taxa, mas não o ciclo: falta data de criação ou de fechamento em pelo menos um dos lados, " +
      "que têm " + a.ciclos.length + " e " + b.ciclos.length + " ciclos completos, e o mínimo é 3 de cada.";
  }

  return `<div class="card">
    <div class="sec-title">Indicado contra não indicado${ajuda("conversao")}</div>
    <div class="sec-sub">Só negócio já fechado entra. Quem a gente desqualificou ("não era perfil") fica fora do denominador da taxa.</div>
    ${frase ? `<div class="h1" style="margin-top:13px;color:var(--lime);font-size:20px;line-height:1.3">${esc(frase)}</div>` : `<div class="tiny muted" style="margin-top:13px">${esc(semFrase)}</div>`}
    <div class="grid2" style="margin-top:15px">
      ${pesColunaComparativo("Veio de indicação", a)}
      ${pesColunaComparativo("Outras origens", b)}
    </div>
    <div class="tiny muted" style="margin-top:11px;line-height:1.6">
      Ticket junta valor total de contrato de agência com cota de patrocínio. Serve pra comparar esforço, não é caixa.
    </div>
  </div>`;
}
function pesColunaComparativo(rot, s){
  var taxa = s.nFech
    ? '<b>' + pct(s.taxa,0) + '</b> <span class="tiny muted">(' + s.nGanhos + ' ganhos de ' + s.nFech + ' fechados)</span>' +
      (s.nFech < 3 ? ' <span class="tiny" style="color:var(--text3);opacity:.7">amostra pequena</span>' : '')
    : '<span class="muted small">nenhum negócio fechado ainda</span>';
  return `<div class="card" style="background:var(--card2)">
    <div class="h3">${esc(rot)}</div>
    <div style="margin-top:11px"><div class="tiny muted">Taxa de ganho</div><div style="font-size:15px">${taxa}</div></div>
    <div style="margin-top:11px"><div class="tiny muted">Ciclo até fechar (dias)</div><div style="font-size:15px">${pesEstat(s.ciclos, pesDias)}</div></div>
    <div style="margin-top:11px"><div class="tiny muted">Ticket do ganho (R$)</div><div style="font-size:15px">${pesEstat(s.tickets, brl)}</div></div>
  </div>`;
}

// Aberto primeiro (é o que dá pra fazer algo hoje), depois o mais recente.
function pesOrdemNegocio(a, b){
  var aa = a.status === "aberto" ? 0 : 1, bb = b.status === "aberto" ? 0 : 1;
  if(aa !== bb) return aa - bb;
  // Nomes dA/dB porque "db" é o handle do Firestore, global neste arquivo.
  var dA = a.fechadoEm || a.encerradoEm || a.criadoEm || "";
  var dB = b.fechadoEm || b.encerradoEm || b.criadoEm || "";
  return dA < dB ? 1 : -1;
}

ACOES.pessoaSalvar = function(f){
  var id = f.getAttribute('data-id');
  var c = contatoPorId(id) || {};
  var err = document.getElementById('pfErr');
  var nome = (document.getElementById('pfNome').value || "").trim();
  var tel  = soDigito(document.getElementById('pfTel').value);
  var mail = (document.getElementById('pfEmail').value || "").trim();

  if(!nome){ err.textContent = "O nome é obrigatório."; return; }
  // Nome mais UMA forma de contato, não WhatsApp especificamente: o contato
  // de montadora com ramal e e-mail corporativo é justamente o do maior
  // ticket da casa (seção 2.5).
  if(!tel && !mail){ err.textContent = "Preciso de pelo menos um jeito de falar com a pessoa: telefone ou e-mail."; return; }
  // Mesmo corte do cadastro: 10 dígitos e DDD mais número. Sem isso um
  // ramal de 4 dígitos entrava no banco, o foneBR mostrava ele cru e o
  // botão de WhatsApp ficava vivo sem link nenhum atrás.
  if(tel && tel.length < 10){ err.textContent = "Esse telefone está sem DDD. Escreva com os 2 dígitos do DDD."; return; }

  var empresa = (document.getElementById('pfEmpresa').value || "").trim();
  var cargo   = (document.getElementById('pfCargo').value || "").trim();
  var dados = {
    nome: nome.slice(0,120),
    nomeChave: chave(nome),
    empresa: empresa.slice(0,120),
    empresaChave: chave(empresa),
    cargo: cargo.slice(0,80),
    tel: tel,
    email: mail.slice(0,120),
    ehIndicador: !!document.getElementById('pfInd').checked,
    acordo: (document.getElementById('pfAcordo').value || "").trim().slice(0,140),
    obs: (document.getElementById('pfObs').value || "").trim().slice(0,400),
    // Mesmo campo busca que o cadastro monta, e-mail incluído: salvar aqui
    // não pode reescrever o campo num formato menor que o de la.
    busca: chave([nome, empresa, cargo, mail].join(" "))
  };
  if(!c.criadoEm){ dados.criadoEm = hojeISO(); dados.criadoPor = (SESSAO && SESSAO.nome) || ""; }
  // Editar não desarquiva sozinho: quem quer de volta clica em Restaurar.
  if(c.arquivado !== true) dados.arquivado = false;

  gravar("crm_contatos", id, dados).then(function(){
    fecharFolha();
    toast("Contato salvo", "ok");      // só depois da promise resolver
    redesenhar();
  }).catch(function(e){
    if(err) err.textContent = "Não deu pra salvar: " + ((e && e.message) || "erro");
  });
};

    ${usados ? '<p class="tiny" style="color:var(--warn);margin-top:9px">' + pesQtd(usados,"negócio aponta","negócios apontam") + ' pra essa pessoa. Eles continuam exatamente como estão, inclusive no ranking de indicação.</p>' : ""}`,
    '<button class="btn btn-ghost" data-a="fecharFolha">Deixar como está</button>' +
    '<button class="btn btn-danger" data-a="pessoaArquivarMesmo" data-id="' + esc(id) + '">Arquivar</button>');
};
ACOES.pessoaArquivarMesmo = function(el){
  var id = el.getAttribute('data-id');
  // Nunca delete: exclusão é arquivado:true, que é escrita e por isso
  // viaja no delta do sincronismo (invariante 3).
  gravar("crm_contatos", id, { arquivado:true }).then(function(){
    fecharFolha();
    comDesfazer("Contato arquivado", "crm_contatos", id, { arquivado:false });
    ir("pessoas");
  });
};
ACOES.pessoaRestaurar = function(el){
  var id = el.getAttribute('data-id');
  gravar("crm_contatos", id, { arquivado:false }).then(function(){
    toast("Contato restaurado", "ok");
    redesenhar();
  });
};

/* ============ 10-painel ============ */
/* =====================================================================
   CRM LIME - PAINEL DO GESTOR

   Esta é a tela de quem SÓ OLHA. O gestor não move card, não fecha
   negócio e não edita valor: o painel é o produto inteiro pra ele.
   Por isso duas coisas mandam aqui:

   1. TODO NÚMERO GRANDE E CLICÁVEL e abre a lista dos negócios que
      entram na conta, e a soma da lista bate com o número na tela.
      Número que não pode ser aberto é número em que ninguém acredita,
      e um número desacreditado derruba o sistema inteiro junto.
   2. Nada aqui lê o banco. Trocar de mês, alternar mês/edição e abrir
      qualquer lista é aritmética sobre o array que já está na memória,
      exatamente como manda a regra 5 do orçamento de leitura.
   ===================================================================== */

/* ---------------------------------------------------------------------
   ESTADO DA TELA
   Fica fora da função porque redesenhar() troca o innerHTML inteiro e
   nada sobrevive dentro do DOM entre dois renders.
   --------------------------------------------------------------------- */
var PAINEL = { ym:"", ptModo:"mes", ed:(EDICOES[0] && EDICOES[0].k) || "" };

// Mês escolhido, resolvido tarde de propósito: a aba fica aberta dias
// seguidos e o painel não pode congelar no mês em que a página carregou.
function pnlYm(){
  if(!PAINEL.ym) PAINEL.ym = mesAtual();
  return PAINEL.ym;
}
// Aritmética de "AAAA-MM" na mão. Date com dia 31 andando pra trás pula
// fevereiro inteiro, e o seletor de mês ficaria com buraco.
function pnlMesMenos(ym, n){
  var p = String(ym || mesAtual()).split("-");
  var a = Number(p[0]), m = Number(p[1]) - n;
  while(m <= 0){ m += 12; a--; }
  while(m > 12){ m -= 12; a++; }
  return a + "-" + (m < 10 ? "0" : "") + m;
}
// Os últimos 6 meses mais o atual, do mais antigo pro mais novo.
function pnlMeses(){
  var atual = mesAtual(), out = [];
  for(var i = 6; i >= 0; i--) out.push(pnlMesMenos(atual, i));
  return out;
}
function pnlNomeMes(ym){
  var i = Number(String(ym || "").slice(5, 7)) - 1;
  return MESES[i] || mesBR(ym);
}

/* ---------------------------------------------------------------------
   CONFIG E META
   O núcleo grava a config de dois jeitos: o delta do sincronismo põe o
   documento na RAIZ de BASE.config, e a gravação local (aplicarNoCache)
   põe em BASE.config.geral. Ler os dois juntos é o que impede a meta
   recém salva de sumir no redesenho seguinte.
   --------------------------------------------------------------------- */
function pnlConfig(){
  var c = BASE.config || {}, out = {}, k;
  for(k in c) if(Object.prototype.hasOwnProperty.call(c, k) && k !== "geral") out[k] = c[k];
  var g = (c.geral && typeof c.geral === "object") ? c.geral : null;
  if(g) for(k in g) if(Object.prototype.hasOwnProperty.call(g, k)) out[k] = g[k];
  return out;
}
// Meta de MRR NOVO por mês, em R$/mês. É a única meta mensal que existe
// no modelo de dados (crm_config/geral.metaMrrMes), então é ela que a
// tela compara com novoMrr. Meta de cota é por EDIÇÃO, não por mês,
// porque cota não obedece mês, obedece ciclo de verba da montadora.
function pnlMetaMrr(){ return Number(pnlConfig().metaMrrMes) || 0; }
function pnlMetaCota(k){
  var mc = pnlConfig().metaCota;
  return Number(mc && mc[k]) || 0;
}

/* ---------------------------------------------------------------------
   ALTA CHANCE (7.2)
   Os quatro testes do SPEC, na ordem, sem nenhum quinto inventado.
   --------------------------------------------------------------------- */
// Índice do primeiro estágio em que o COMPRADOR se comprometeu. Se o
// funil não tiver nenhum marcado, ninguém entra em alta chance, que é o
// erro seguro: previsão a menos não mente, previsão a mais mente.
function idxCompromisso(tipo){
  var f = FUNIL[tipo] || [];
  for(var i = 0; i < f.length; i++) if(f[i].compromisso) return i;
  return f.length;
}
function altaChance(n, ym){
  if(!n || n.status !== "aberto") return false;
  // Tipo fora dos dois funis não tem estágio de compromisso pra comparar,
  // e sem esta linha ele entraria na previsão com valor zero, aparecendo
  // na lista de alta chance sem somar nada. Previsão a mais mente.
  if(!FUNIL[n.tipo]) return false;
  if(n.prevEstimada) return false;               // data automática não conta
  if(!n.prevFechamento) return false;
  var hoje = hojeISO();
  var alvo = ym || mesAtual();
  // Plano vivo: quem marcou reunião pro dia 25 continua em alta chance até
  // o dia 25. Teto de 21 dias pra "plano" não virar data no ano que vem.
  var planoVivo = !!n.proxData && n.proxData >= hoje && diasEntre(hoje, n.proxData) <= 21;
  // Sem ultimoToqueEm gravado, diasVencido devolve 0 e o negócio passaria
  // como "tocado hoje". Sem toque registrado só entra por plano vivo.
  var toqueRecente = !!n.ultimoToqueEm && diasVencido(n.ultimoToqueEm) <= 10;
  return idxEstagio(n) >= idxCompromisso(n.tipo)   // 1. comprador se comprometeu
      && mesDe(n.prevFechamento) === alvo          // 2. previsto pra este mês
      && n.prevFechamento >= hoje                  // 3. a data não venceu
      && (planoVivo || toqueRecente);              // 4. plano vivo OU toque recente
}

/* ---------------------------------------------------------------------
   OS NÚMEROS DO MÊS (7.1 e 7.2)
   Uma varredura só sobre a base inteira. Devolve também as LISTAS por
   trás de cada número, porque a tela precisa abrir cada um deles e a
   lista não pode ser recalculada com outro critério em outro lugar.
   --------------------------------------------------------------------- */
function numerosDoMes(ym){
  ym = ym || mesAtual();
  var todos = lista("negocios");
  var r = {
    ym:ym,
    // carteira (7.1)
    carteira:0, carteiraFee:0, carteiraVerba:0, verbaSobGestao:0, carteiraItens:[],
    // movimento do mês (7.1)
    novoMrr:0, novoMrrItens:[],
    mrrPerdido:0, mrrPerdidoCancel:0, mrrPerdidoNaoRenov:0, perdidoItens:[],
    mrrLiquido:0, mrrAlta:0,
    /* CUIDADO AO USAR fechado, piso, provavel e limpo FORA DO PAINEL.
       Os quatro somam contrato de agência (fee vezes meses) com cota de
       patrocínio (pagamento único), que são unidades diferentes. Isso é
       proposital e serve pra UMA coisa só: dimensionar esforço comercial
       na coluna Total, que na tela vem com a nota fixa explicando.
       Não é caixa do mês e não pode virar frase solta em outra tela.
       Quem for escrever texto ou número em outro lugar usa porTipo, que
       já vem quebrado por funil. O resumo do dia (06-hoje.js) faz assim.
       A invariante 5 do SPEC existe por causa disso.                   */
    fechado:0, fechadoItens:[],
    // previsão (7.2)
    altaChance:[], riscoItens:[], piso:0, provavel:0, limpo:0,
    porTipo:{
      agencia:   { fechado:0, alta:0, risco:0, piso:0, provavel:0, limpo:0, nFechado:0, nAlta:0 },
      patrocinio:{ fechado:0, alta:0, risco:0, piso:0, provavel:0, limpo:0, nFechado:0, nAlta:0 }
    },
    // meta
    meta:0, temMeta:false, faltam:0, pctMeta:0
  };

  for(var i = 0; i < todos.length; i++){
    var n = todos[i];

    /* CARTEIRA ATIVA. Contrato recorrente não termina por data, termina
       por evento: filtrar por vigência apaga o cliente que continua
       pagando depois do fim do papel. Por isso o corte é encerradoEm. */
    if(n.tipo === "agencia" && n.status === "ganho" && !n.encerradoEm){
      r.carteira      += mrrDe(n);
      r.carteiraFee   += (n.ag && n.ag.mrr) || 0;
      r.verbaSobGestao += (n.ag && n.ag.verbaMidia) || 0;
      r.carteiraItens.push(n);
    }

    /* FECHADO NO MÊS, nos dois funis. */
    if(n.status === "ganho" && mesDe(n.fechadoEm) === ym){
      var v = valorRefDe(n);
      r.fechado += v;
      r.fechadoItens.push(n);
      var t = r.porTipo[n.tipo];
      if(t){ t.fechado += v; t.nFechado++; }
      if(n.tipo === "agencia"){ r.novoMrr += mrrDe(n); r.novoMrrItens.push(n); }
    }

    /* MRR PERDIDO NO MÊS. "renovado" fica de fora: renovação encerra o
       contrato velho e abre um novo, e contar isso como perda mostraria
       uma queda de R$ 3.500/mês que não aconteceu. */
    if(n.tipo === "agencia" && n.status === "encerrado" &&
       mesDe(n.encerradoEm) === ym && n.motivoEncerramento !== "renovado"){
      var m = mrrDe(n);
      r.mrrPerdido += m;
      r.perdidoItens.push(n);
      // Duas linhas na tela porque as correções são opostas: cancelamento
      // é ruptura no meio do contrato (se corrige com entrega e relação),
      // não renovação é fim de ciclo (se corrige conversando antes).
      if(n.motivoEncerramento === "fim_natural") r.mrrPerdidoNaoRenov += m;
      else r.mrrPerdidoCancel += m;
    }

    /* ALTA CHANCE DO MÊS. */
    if(altaChance(n, ym)){
      var va = valorRefDe(n);
      r.altaChance.push(n);
      var tt = r.porTipo[n.tipo];
      if(tt){ tt.alta += va; tt.nAlta++; }
      if(n.tipo === "agencia") r.mrrAlta += mrrDe(n);
      if(riscoAlto(n)){
        r.riscoItens.push(n);
        if(tt) tt.risco += va;
      }
    }
  }

  r.carteiraVerba = r.carteira - r.carteiraFee;   // fatia de pctVerba, estimada
  r.mrrLiquido    = r.novoMrr - r.mrrPerdido;

  var somaAlta = 0, somaRisco = 0, j;
  for(j = 0; j < r.altaChance.length; j++) somaAlta += valorRefDe(r.altaChance[j]);
  for(j = 0; j < r.riscoItens.length; j++) somaRisco += valorRefDe(r.riscoItens[j]);

  r.piso     = r.fechado;                 // já assinado, não depende de ninguem
  r.provavel = r.piso + somaAlta;
  r.limpo    = r.provavel - somaRisco;    // tira o que está apoiado em negócio parado

  var k;
  for(k in r.porTipo){
    if(!Object.prototype.hasOwnProperty.call(r.porTipo, k)) continue;
    var c = r.porTipo[k];
    c.piso = c.fechado;
    c.provavel = c.fechado + c.alta;
    c.limpo = c.provavel - c.risco;
  }

  r.meta    = pnlMetaMrr();
  r.temMeta = r.meta > 0;
  // Sem meta cadastrada o painel escreve "sem meta definida" e NUNCA NaN%.
  r.faltam  = r.temMeta ? Math.max(0, r.meta - r.novoMrr) : 0;
  r.pctMeta = r.temMeta ? Math.round((r.novoMrr / r.meta) * 100) : 0;
  return r;
}

/* ---------------------------------------------------------------------
   SAÚDE DO FUNIL (7.3)
   --------------------------------------------------------------------- */
function pnlAbertos(){
  return lista("negocios").filter(function(n){ return n.status === "aberto"; });
}
// Em dia = tem plano com data no futuro E o silêncio está dentro do
// limite do próprio funil (5 dias em agência, 15 em patrocínio).
function pnlEmDia(n){
  if(!n.proxData || n.proxData < hojeISO()) return false;
  var lim = (TOQUE[n.tipo] && TOQUE[n.tipo].normal) || 7;
  return !!n.ultimoToqueEm && diasVencido(n.ultimoToqueEm) <= lim;
}
function pnlSaude(ym){
  var ab = pnlAbertos(), i, n;
  var s = {
    abertos:ab, total:ab.length,
    emDia:[], foraDia:[], tocados:[], naoTocados:[],
    vencidos:[], piorAtraso:0,
    abertosMes:[], maior:null, somaMes:0, concentracao:0, temConcentracao:false
  };
  for(i = 0; i < ab.length; i++){
    n = ab[i];
    if(pnlEmDia(n)) s.emDia.push(n); else s.foraDia.push(n);
    // Cobertura de toque: medir só o toque mais recente da base inteira da
    // verde permanente pra quem cuida do negócio grande e deixa os outros
    // onze apodrecerem. Aqui conta negócio por negócio.
    if(n.ultimoToqueEm && diasVencido(n.ultimoToqueEm) <= 7) s.tocados.push(n);
    else s.naoTocados.push(n);
    var atraso = n.proxData ? diasVencido(n.proxData) : 0;
    if(atraso >= 1){
      s.vencidos.push(n);
      if(atraso > s.piorAtraso) s.piorAtraso = atraso;
    }
    if(mesDe(n.prevFechamento) === ym) s.abertosMes.push(n);
  }
  s.pctEmDia    = s.total ? Math.round((s.emDia.length / s.total) * 100) : 0;
  s.pctCobertura = s.total ? Math.round((s.tocados.length / s.total) * 100) : 0;

  // Concentração só aparece com 3 ou mais abertos no mês. Com dois, "80%
  // num negócio só" é uma frase sobre o tamanho da amostra, não sobre risco.
  if(s.abertosMes.length >= 3){
    for(i = 0; i < s.abertosMes.length; i++){
      var v = valorRefDe(s.abertosMes[i]);
      s.somaMes += v;
      if(!s.maior || v > valorRefDe(s.maior)) s.maior = s.abertosMes[i];
    }
    if(s.somaMes > 0){
      s.concentracao = Math.round((valorRefDe(s.maior) / s.somaMes) * 100);
      s.temConcentracao = true;
    }
  }
  return s;
}

/* ---------------------------------------------------------------------
   GANHOS E PERDAS, JANELA DE 12 MESES (7.4)
   --------------------------------------------------------------------- */
// Contrato que foi GANHO e depois encerrado continua sendo um negócio
// ganho: encerrar troca o status pra "encerrado" mas mantém o fechadoEm.
// Sem esta linha, todo cliente que saiu some da taxa de ganho e do ciclo,
// e uma agência com clientes antigos mostra uma taxa de ganho menor do
// que a real justamente porque ganhou faz tempo.
function pnlFoiGanho(n){
  return n.status === "ganho" || (n.status === "encerrado" && !!n.fechadoEm);
}
function pnlFechados12(){
  var corte = somaDias(hojeISO(), -365);
  return lista("negocios").filter(function(n){
    return (pnlFoiGanho(n) || n.status === "perdido") &&
           n.fechadoEm && n.fechadoEm >= corte;
  });
}
function pnlGanhosPerdas(){
  var f = pnlFechados12(), i, n;
  var g = { fechados:f, ganhos:[], perdidos:[], perdasReais:[], foraPerfil:[],
            taxaGanho:0, temTaxa:false, ciclos:[], ciclosPerda:[], motivos:[] };
  var mapa = {};
  for(i = 0; i < f.length; i++){
    n = f[i];
    if(pnlFoiGanho(n)){
      g.ganhos.push(n);
      if(n.criadoEm) g.ciclos.push(diasEntre(n.criadoEm, n.fechadoEm));
      continue;
    }
    g.perdidos.push(n);
    // "Fora do perfil" sai do denominador: contar desqualificação como
    // derrota pune a única disciplina que faz um time de duas pessoas
    // sobreviver, que é dizer não.
    if(n.motivoPerda === "fora_do_perfil"){ g.foraPerfil.push(n); continue; }
    g.perdasReais.push(n);
    if(n.criadoEm) g.ciclosPerda.push(diasEntre(n.criadoEm, n.fechadoEm));
    var k = n.motivoPerda || "sem_motivo";
    if(!mapa[k]) mapa[k] = { k:k, valor:0, n:0 };
    mapa[k].valor += valorRefDe(n);
    mapa[k].n++;
  }
  var den = g.ganhos.length + g.perdasReais.length;
  g.temTaxa = den > 0;
  // Regra de amostra pequena, que vale pra TODO número derivado do sistema.
  // Com 1 ganho e nenhuma perda a conta dá 100%, e no primeiro mês de uso é
  // sempre esse o caso: a manchete mais visível do painel nasce mentindo.
  // Abaixo de 3 decididos a tela mostra a contagem crua, não a taxa.
  g.temAmostra = den >= 3;
  g.taxaGanho = den ? Math.round((g.ganhos.length / den) * 100) : 0;
  g.den = den;
  for(var mk in mapa) if(Object.prototype.hasOwnProperty.call(mapa, mk)) g.motivos.push(mapa[mk]);
  // Ranqueado por R$ PERDIDO, nunca por quantidade: três contratos de
  // R$ 3.500/mês perdidos por preço somam menos que uma cota perdida por
  // verba, e ordenar por quantidade esconde justamente o que importa.
  g.motivos.sort(function(a, b){ return b.valor - a.valor; });
  return g;
}
// Conversão de um estágio pro SEGUINTE, só com negócio já fechado. Aberto
// parado no estágio 2 ainda pode avançar; contá-lo derruba a conversão e
// o diagnóstico sai invertido.
function pnlConversao(tipo, fechados){
  var f = FUNIL[tipo] || [], out = [], i, j, n;
  var base = fechados.filter(function(x){ return x.tipo === tipo; });
  for(i = 0; i < f.length - 1; i++){
    var nb = 0, np = 0;
    for(j = 0; j < base.length; j++){
      n = base[j];
      if((n.maiorEstagio || 0) >= i){
        nb++;
        if((n.maiorEstagio || 0) >= i + 1) np++;
      }
    }
    out.push({ i:i, de:f[i].rot, para:f[i+1].rot, base:nb, passou:np,
               taxa: nb ? Math.round((np / nb) * 100) : 0 });
  }
  return out;
}

/* ---------------------------------------------------------------------
   COBERTURA DA EDIÇÃO (7.6)
   A única métrica do sistema que junta dinheiro e tempo.
   --------------------------------------------------------------------- */
function pnlEdicao(k){
  var ed = edicaoDe(k);
  var r = { k:k, ed:ed, vendido:0, emAberto:0, permuta:0, nVend:0, nAb:0,
            meta:pnlMetaCota(k), vendidos:[], abertos:[] };
  if(!ed) return r;
  var todos = lista("negocios");
  for(var i = 0; i < todos.length; i++){
    var n = todos[i];
    if(n.tipo !== "patrocinio" || !n.pt || n.pt.edicao !== k) continue;
    if(n.status === "ganho"){
      r.vendido += (n.pt.valor || 0);
      r.permuta += (n.pt.permuta || 0);   // nunca somada ao dinheiro
      r.vendidos.push(n); r.nVend++;
    } else if(n.status === "aberto"){
      r.emAberto += (n.pt.valor || 0);
      r.abertos.push(n); r.nAb++;
    }
  }
  r.diasCorte  = diasEntre(hojeISO(), ed.corteComercial);  // positivo = ainda falta
  r.diasEvento = diasEntre(hojeISO(), ed.dataEvento);
  r.pct = r.meta > 0 ? Math.round((r.vendido / r.meta) * 100) : 0;
  return r;
}

/* ---------------------------------------------------------------------
   PEDAÇOS DE HTML REUSADOS
   --------------------------------------------------------------------- */
// Todo número grande é um botão. O tracejado embaixo é o único aviso de
// que dá pra abrir a lista: tooltip não existe no dedo.
var PNL_CLIC = "border-bottom:1px dashed var(--border2);padding-bottom:1px";

// O parâmetro NÃO se chama "lista": lista() é a função do núcleo que
// devolve a base, e um parâmetro com esse nome a apaga dentro da função.
function pnlNum(txt, chaveLista, cls, extra){
  return '<button class="kpi-v ' + (cls || "") + '" style="' + PNL_CLIC + '" ' +
         'data-a="verLista" data-lista="' + chaveLista + '"' + (extra || "") + '>' + txt + '</button>';
}
// Número pequeno clicável, pra dentro de tabela e de linha de texto. O
// padding vertical existe por causa do dedo: sem ele o alvo tem a altura
// da letra, uns 19px, e no celular o toque cai ao lado em vez de abrir a
// lista. Vem depois de PNL_CLIC pra vencer o padding-bottom de la.
function pnlNumPeq(txt, chaveLista, cor, extra){
  return '<button style="font-family:var(--disp);font-weight:800;font-size:16px;' + PNL_CLIC +
         ';display:inline-block;padding:7px 2px' +
         (cor ? ";color:" + cor : "") + '" data-a="verLista" data-lista="' + chaveLista + '"' +
         (extra || "") + '>' + txt + '</button>';
}
/* chaveAjuda e opcional: quando vem, o rotulo ganha o bolinha de
   interrogacao do lado. Os numeros de dinheiro sao onde mora o jargao
   (MRR, piso, provavel), e e onde quem nunca usou CRM mais trava. */
function pnlKpi(rot, valorHtml, sub, accent, chaveAjuda){
  return '<div class="kpi' + (accent ? " accent" : "") + '">' +
           '<div class="kpi-l">' + rot + (chaveAjuda ? ajuda(chaveAjuda) : "") + '</div>' + valorHtml +
           (sub ? '<div class="kpi-s">' + sub + '</div>' : '') +
         '</div>';
}
function pnlBarra(pctNum, cls){
  var p = Math.max(0, Math.min(100, Math.round(pctNum || 0)));
  return '<div class="bar" style="margin-top:9px"><i class="' + (cls || "") + '" style="width:' + p + '%"></i></div>';
}
// Regra de amostra pequena, vale pra TODO número derivado do sistema.
function pnlAmostra(vals, fmt){
  var n = (vals || []).length, i, s = [];
  if(!n) return '<span class="muted">sem negócio fechado ainda</span>';
  if(n < 3){
    // Com 2 fechados, "ticket médio R$ 41.000" é pior que "R$ 62.000 e R$ 20.000".
    for(i = 0; i < n; i++) s.push(fmt(vals[i]));
    return '<span style="font-family:var(--disp);font-weight:800;font-size:17px">' + s.join(" e ") + '</span>' +
           ' <span class="tiny muted">' + n + (n === 1 ? " negócio, sem mediana" : " negócios, sem mediana") + '</span>';
  }
  var op = n < 8 ? ";opacity:.7" : "";
  return '<span style="font-family:var(--disp);font-weight:900;font-size:22px' + op + '">' + fmt(mediana(vals)) + '</span>' +
         ' <span class="tiny muted">mediana, n=' + n + '</span>';
}
// Nota fixa da coluna Total. Escrita na tela, sempre, nunca em tooltip:
// a única coisa que impede alguém de ler o Total como caixa do mês e
// essa frase estar visível ao lado do número.
var PNL_NOTA_TOTAL = "Soma valor total de contrato (fee vezes meses) com cota de patrocínio " +
  "(pagamento único). Serve pra dimensionar o esforço comercial. Não é caixa do mês.";

/* ---------------------------------------------------------------------
   A TELA
   --------------------------------------------------------------------- */
TELAS.painel = function(){
  var ym = pnlYm();
  var N  = numerosDoMes(ym);
  var S  = pnlSaude(ym);

  if(!lista("negocios").length){
    return pnlCabecalho(ym) +
      '<div class="empty"><div class="ei">📊</div>' +
      '<div class="et">Nenhum negócio cadastrado ainda</div>' +
      '<div class="ex">O painel é conta feita em cima dos negócios. Assim que o primeiro entrar, ' +
      'todos os números desta tela passam a existir sozinhos.</div>' +
      '<button class="btn" data-a="ir" data-r="funil">Ver o funil</button></div>';
  }

  return pnlCabecalho(ym) +
         pnlFaixaConfianca(S) +
         pnlBlocoCarteira(N) +
         pnlBlocoPrevisao(N) +
         pnlBlocoSaude(S, N) +
         pnlBlocoCaptacao(ym) +
         pnlBlocoGanhosPerdas() +
         pnlBlocoEdicoes() +
         pnlBlocoMeta(N);
};

function pnlCabecalho(ym){
  var ms = pnlMeses(), h = "", i;
  for(i = 0; i < ms.length; i++){
    h += '<button class="pill' + (ms[i] === ym ? " on" : "") + '" data-a="painelMes" data-ym="' + ms[i] + '">' +
         esc(mesBR(ms[i])) + '</button>';
  }
  return '<div class="card-head" style="margin-bottom:0">' +
    '<div>' +
      '<div class="sec-title">Painel</div>' +
      '<div class="sec-sub">Todo número grande abre a lista dos negócios que entram na conta. ' +
      'Trocar de mês não consulta o banco.</div>' +
    '</div>' +
    '<div class="pills">' + h + '</div>' +
  '</div>';
}

/* Faixa de confiança no topo: cobertura de toque. Vem antes de qualquer
   previsão porque é ela que diz se dava pra acreditar na previsão. */
function pnlFaixaConfianca(S){
  if(!S.total){
    return '<div class="card"><div class="muted">Nenhum negócio aberto agora. ' +
           'A previsão do mês é só o que já foi fechado.</div></div>';
  }
  var cls = S.pctCobertura > 70 ? "green" : (S.pctCobertura >= 40 ? "warn" : "red");
  var cor = S.pctCobertura > 70 ? "var(--green)" : (S.pctCobertura >= 40 ? "var(--warn)" : "var(--red)");
  var frase = S.pctCobertura > 70
    ? "A base está sendo tocada. Dá pra confiar no resto desta tela."
    : (S.pctCobertura >= 40
      ? "Boa parte da base passou uma semana sem contato. A previsão abaixo está apoiada em negócio que ninguém tocou."
      : "A maior parte da base está sem contato há mais de 7 dias. Os números abaixo descrevem um funil parado.");
  return '<div class="card' + (cls === "green" ? " card-lime" : "") + '">' +
    '<div class="card-head" style="margin-bottom:8px">' +
      '<div class="h3" style="margin:0">Cobertura de toque, últimos 7 dias' + ajuda("cobertura_toque") + '</div>' +
      '<div>' + pnlNumPeq(pct(S.pctCobertura), "tocados", cor) + '</div>' +
    '</div>' +
    pnlBarra(S.pctCobertura, cls) +
    '<div class="kpi-s" style="margin-top:9px">' +
      pnlNumPeq(String(S.tocados.length), "tocados", "") +
      ' <span class="muted">de ' + S.total + ' negócios abertos tiveram contato nos últimos 7 dias. ' +
      esc(frase) + '</span>' +
    '</div>' +
  '</div>';
}

/* ------------------------ 1. CARTEIRA E MOVIMENTO ------------------- */
function pnlBlocoCarteira(N){
  var nome = pnlNomeMes(N.ym);
  var liqCls = N.mrrLiquido > 0 ? "green" : (N.mrrLiquido < 0 ? "red" : "");
  var liqSinal = N.mrrLiquido > 0 ? "+" : "";

  var h = '<div class="card">' +
    '<div class="card-head">' +
      '<div><div class="sec-title">Carteira e movimento do mês' + ajuda("carteira_ativa") + '</div>' +
      '<div class="sec-sub">O recorrente ativo hoje, e o que entrou e saiu em ' + esc(nome) + '</div></div>' +
    '</div>' +
    '<div class="kpis">';

  // Duas linhas separadas: dinheiro contratado e estimado sobre verba.
  h += pnlKpi("Carteira ativa",
        pnlNum(brl(N.carteira) + '<span style="font-size:16px;color:var(--text3)">/mês</span>', "carteira", "lime"),
        'em ' + N.carteiraItens.length + (N.carteiraItens.length === 1 ? ' contrato de agência' : ' contratos de agência') +
        '<br>' + pnlNumPeq(brl(N.carteiraFee), "carteiraFee", "") + '<span class="muted">/mês de fee contratado</span>' +
        '<br>' + pnlNumPeq(brl(N.carteiraVerba), "carteiraVerba", "") +
        '<span class="muted">/mês estimado sobre a verba (% de pctVerba)</span>', true, "carteira_ativa");

  h += pnlKpi("Novo MRR no mês",
        pnlNum(brl(N.novoMrr) + '<span style="font-size:16px;color:var(--text3)">/mês</span>', "novoMrr", "green"),
        N.novoMrrItens.length + (N.novoMrrItens.length === 1 ? ' contrato novo' : ' contratos novos') + ' fechados em ' + esc(nome), "mrr");

  h += pnlKpi("MRR perdido no mês",
        pnlNum(brl(N.mrrPerdido) + '<span style="font-size:16px;color:var(--text3)">/mês</span>', "mrrPerdido", N.mrrPerdido ? "red" : ""),
        pnlNumPeq(brl(N.mrrPerdidoCancel), "perdidoCancel", "") + '<span class="muted">/mês de cancelamento</span><br>' +
        pnlNumPeq(brl(N.mrrPerdidoNaoRenov), "perdidoNaoRenov", "") + '<span class="muted">/mês de não renovação</span><br>' +
        '<span class="muted">renovação não entra aqui: ela vira contrato novo</span>');

  /* MRR líquido é o número que um dono de agência olha primeiro e que
     quase nenhum CRM mostra. Fechar R$ 3.500 e perder R$ 4.000 no mesmo
     mês é ENCOLHER, e sem a linha de perdido o CRM comemora isso. */
  h += pnlKpi("MRR líquido do mês",
        pnlNum(liqSinal + brl(N.mrrLiquido) + '<span style="font-size:16px;color:var(--text3)">/mês</span>', "mrrLiquido", liqCls),
        N.mrrLiquido < 0
          ? 'A carteira encolheu em ' + esc(nome) + '. Entrou ' + brl(N.novoMrr) + '/mês e saiu ' + brl(N.mrrPerdido) + '/mês.'
          : 'novo menos perdido, o tamanho real do crescimento no mês', "mrr_liquido");

  h += pnlKpi("Fechado no mês",
        pnlNum(brl(N.fechado), "fechado", "lime"),
        N.fechadoItens.length + (N.fechadoItens.length === 1 ? ' negócio ganho' : ' negócios ganhos') +
        ', contrato cheio mais cota. Não é caixa do mês.');

  h += '</div>';

  // Verba sob gestão em linha própria, com o rótulo que impede o engano.
  h += '<div class="kpi-s" style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">' +
       pnlNumPeq(brl(N.verbaSobGestao) + "/mês", "verba", "") +
       ' <span class="muted">de verba sob gestão. Verba do cliente, NÃO é receita da Lime. ' +
       'Só a fatia de pctVerba entra no MRR acima.</span></div>';

  h += pnlSerieFechado(N.ym);
  h += '</div>';
  return h;
}

// Série mensal em barra de CSS. Clicar numa barra troca o mês do painel,
// que custa zero leitura porque tudo aqui é conta sobre o array carregado.
function pnlSerieFechado(ym){
  var ms = pnlMeses(), vals = [], i, maior = 0, todos = lista("negocios");
  for(i = 0; i < ms.length; i++){
    var v = 0;
    for(var j = 0; j < todos.length; j++){
      var n = todos[j];
      if(n.status === "ganho" && mesDe(n.fechadoEm) === ms[i]) v += valorRefDe(n);
    }
    vals.push(v);
    if(v > maior) maior = v;
  }
  if(!maior) return "";
  var h = '<div class="h3" style="margin-top:18px">Fechado por mês</div>' +
          '<div class="chart-bars">';
  for(i = 0; i < ms.length; i++){
    var alt = Math.max(2, Math.round((vals[i] / maior) * 100));
    h += '<button class="cb" data-a="painelMes" data-ym="' + ms[i] + '">' +
           '<span class="cv">' + (vals[i] ? esc(brlCurto(vals[i])) : "-") + '</span>' +
           '<i class="' + (ms[i] === ym ? "" : "dim") + '" style="height:' + alt + '%"></i>' +
           '<span class="cl">' + esc(mesBR(ms[i])) + '</span>' +
         '</button>';
  }
  return h + '</div><div class="tiny muted" style="margin-top:6px">' +
         'Valor total de contrato somado com cota, em R$. Toque numa barra pra abrir o mês.</div>';
}

/* ------------------------ 2. PREVISÃO DO MÊS ------------------------ */
function pnlBlocoPrevisao(N){
  var nome = pnlNomeMes(N.ym);
  var edicao = PAINEL.ptModo === "edicao";
  var h = '<div class="card">' +
    '<div class="card-head">' +
      '<div><div class="sec-title">Previsão de ' + esc(nome) + '</div>' +
      '<div class="sec-sub">Valor cheio em três linhas, nunca um ponderado como manchete: ' +
      'com 10 a 15 negócios abertos o resultado de cada um é binário.</div></div>' +
    '</div>';

  /* As três manchetes. A distância entre Provável e Sem risco alto é a
     métrica mais honesta do sistema: mede quanto da previsão está apoiado
     em negócio que ninguém toca há semanas. */
  h += '<div class="kpis">' +
    pnlKpi("Piso", pnlNum(brl(N.piso), "piso", ""),
      'já assinado em ' + esc(nome) + ', não depende de mais ninguém', "piso") +
    pnlKpi("Provável", pnlNum(brl(N.provavel), "provavel", "lime"),
      'piso mais ' + N.altaChance.length + (N.altaChance.length === 1 ? ' negócio' : ' negócios') + ' em alta chance', true, "provavel") +
    pnlKpi("Sem risco alto", pnlNum(brl(N.limpo), "limpo", N.limpo < N.provavel ? "warn" : ""),
      N.riscoItens.length
        ? brl(N.provavel - N.limpo) + ' do Provável está em ' + N.riscoItens.length +
          (N.riscoItens.length === 1 ? ' negócio de risco alto' : ' negócios de risco alto') + '. ' +
          pnlNumPeq("ver quais", "risco", "var(--warn)")
        : 'nenhum negócio de alta chance está em risco alto', "sem_risco") +
  '</div>';

  // Alternador MÊS | EDIÇÃO do patrocínio: cota não obedece mês, obedece
  // ciclo de verba da montadora.
  h += '<div class="card-head" style="margin:18px 0 10px">' +
    '<div class="h3" style="margin:0">Duas réguas, nunca no mesmo número</div>' +
    '<div class="pills"><span class="tiny muted">Patrocínio por</span>' +
      '<button class="pill' + (edicao ? "" : " on") + '" data-a="painelPt" data-m="mes">Mês</button>' +
      '<button class="pill' + (edicao ? " on" : "") + '" data-a="painelPt" data-m="edicao">Edição</button>' +
    '</div>' +
  '</div>';

  h += edicao ? pnlTabelaEdicao(N) : pnlTabelaMes(N);
  h += '<div class="tiny muted" style="margin-top:10px"><b>Coluna Total.</b> ' + esc(PNL_NOTA_TOTAL) + '</div>';

  // Novo MRR em jogo, na unidade certa (R$/mês), nunca somado ao total.
  h += '<div class="kpi-s" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">' +
    '<span class="muted">Novo MRR em jogo: </span>' +
    pnlNumPeq(brl(N.novoMrr) + "/mês", "novoMrr", "var(--green)") + '<span class="muted"> fechado, </span>' +
    pnlNumPeq(brl(N.mrrAlta) + "/mês", "altaAg", "") + '<span class="muted"> em alta chance de agência</span>' +
  '</div>';

  h += pnlLinhaMeta(N);
  return h + '</div>';
}

// Definição das colunas, usada pela tabela do desktop e pelos cartões do
// celular, pra que os dois nunca discordem.
function pnlColunasMes(N){
  var a = N.porTipo.agencia, p = N.porTipo.patrocinio;
  return [
    { rot:"Agência",    fechado:a.fechado, alta:a.alta, piso:a.piso, provavel:a.provavel, limpo:a.limpo,
      lf:"fechadoT", la:"altaT", ex:' data-tipo="agencia"' },
    { rot:"Patrocínio", fechado:p.fechado, alta:p.alta, piso:p.piso, provavel:p.provavel, limpo:p.limpo,
      lf:"fechadoT", la:"altaT", ex:' data-tipo="patrocinio"' },
    { rot:"Total",      fechado:N.fechado, alta:N.provavel - N.piso, piso:N.piso, provavel:N.provavel, limpo:N.limpo,
      lf:"fechado", la:"alta", ex:"", total:true }
  ];
}

function pnlTabelaMes(N){
  var c = pnlColunasMes(N), i;
  // Desktop: tabela. Celular: três cartões empilhados, porque tabela com
  // rolagem lateral no celular não é lida por ninguém.
  var h = '<div class="tw no-mob"><table class="tb"><thead><tr><th>' + esc(pnlNomeMes(N.ym)) + '</th>';
  for(i = 0; i < c.length; i++) h += '<th class="r">' + esc(c[i].rot) + '</th>';
  h += '</tr></thead><tbody>';

  h += '<tr><td class="cel-nome">Fechado</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].fechado), c[i].lf, "", c[i].ex) + '</td>';
  h += '</tr><tr><td class="cel-nome">Alta chance</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].alta), c[i].la, "", c[i].ex) + '</td>';
  h += '</tr><tr><td class="cel-nome">Provável</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].provavel), c[i].total ? "provavel" : "provavelT", "var(--lime)", c[i].ex) + '</td>';
  h += '</tr><tr><td class="cel-nome">Sem risco alto</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].limpo), c[i].total ? "limpo" : "limpoT", "", c[i].ex) + '</td>';
  h += '</tr></tbody></table></div>';

  h += '<div class="only-mob">';
  for(i = 0; i < c.length; i++){
    h += '<div class="card" style="margin-top:9px;background:var(--card2)">' +
      '<div class="h3" style="margin-bottom:8px">' + esc(c[i].rot) + '</div>' +
      pnlLinhaCartao("Fechado", pnlNumPeq(brl(c[i].fechado), c[i].lf, "", c[i].ex)) +
      pnlLinhaCartao("Alta chance", pnlNumPeq(brl(c[i].alta), c[i].la, "", c[i].ex)) +
      pnlLinhaCartao("Provável", pnlNumPeq(brl(c[i].provavel), c[i].total ? "provavel" : "provavelT", "var(--lime)", c[i].ex)) +
      pnlLinhaCartao("Sem risco alto", pnlNumPeq(brl(c[i].limpo), c[i].total ? "limpo" : "limpoT", "", c[i].ex)) +
    '</div>';
  }
  h += '</div>';

  // Mês vazio de patrocínio não some nem parece problema: diz onde a cota
  // está, que é na edição.
  if(!N.porTipo.patrocinio.fechado && !N.porTipo.patrocinio.alta){
    var e = pnlEdicao(PAINEL.ed || (EDICOES[0] && EDICOES[0].k));
    h += '<div class="kpi-s" style="margin-top:10px">Nenhuma cota prevista pra ' + esc(pnlNomeMes(N.ym)) + '. ' +
      (e.ed ? 'Na edição ' + esc(e.ed.rot) + ': ' + pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(e.k) + '"') +
              ' <span class="muted">em aberto.</span>' : '') + '</div>';
  }
  return h;
}

function pnlTabelaEdicao(N){
  var a = N.porTipo.agencia;
  var k = PAINEL.ed || (EDICOES[0] && EDICOES[0].k);
  var e = pnlEdicao(k), i;
  var pills = "";
  for(i = 0; i < EDICOES.length; i++){
    pills += '<button class="pill' + (EDICOES[i].k === k ? " on" : "") + '" data-a="painelEd" data-k="' +
             esc(EDICOES[i].k) + '">' + esc(EDICOES[i].rot) + '</button>';
  }
  var h = '<div class="pills" style="margin-bottom:10px">' + pills + '</div>';

  h += '<div class="tw no-mob"><table class="tb"><thead><tr>' +
    '<th>Regua</th><th class="r">Agência (' + esc(mesBR(N.ym)) + ')</th>' +
    '<th class="r">Patrocínio (' + esc(e.ed ? e.ed.rot : "edicao") + ')</th><th class="r">Total</th>' +
  '</tr></thead><tbody>' +
    '<tr><td class="cel-nome">Fechado</td>' +
      '<td class="r">' + pnlNumPeq(brl(a.fechado), "fechadoT", "", ' data-tipo="agencia"') + '</td>' +
      '<td class="r">' + pnlNumPeq(brl(e.vendido), "edVendido", "", ' data-k="' + esc(k) + '"') + '</td>' +
      '<td class="r muted">não se soma</td></tr>' +
    /* A linha NÃO se chama "Em aberto": as duas células contam coisas
       diferentes, e um rótulo só pras duas faria a coluna de agência
       mentir. Agência conta alta chance do mês, patrocínio conta toda
       cota aberta da edição. A linha de baixo diz isso por escrito. */
    '<tr><td class="cel-nome">Ainda em jogo</td>' +
      '<td class="r">' + pnlNumPeq(brl(a.alta), "altaT", "", ' data-tipo="agencia"') + '</td>' +
      '<td class="r">' + pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(k) + '"') + '</td>' +
      '<td class="r muted">não se soma</td></tr>' +
  '</tbody></table>' +
  '<div class="tiny muted" style="margin-top:6px">Em "ainda em jogo", a coluna de agência conta a ' +
  'alta chance do mês, em R$, e a de patrocínio conta toda cota aberta da edição, em R$. ' +
  'São dois recortes diferentes, por isso nunca aparecem somados.</div></div>';

  h += '<div class="only-mob">' +
    '<div class="card" style="margin-top:9px;background:var(--card2)">' +
      '<div class="h3" style="margin-bottom:8px">Agência, ' + esc(mesBR(N.ym)) + '</div>' +
      pnlLinhaCartao("Fechado", pnlNumPeq(brl(a.fechado), "fechadoT", "", ' data-tipo="agencia"')) +
      pnlLinhaCartao("Alta chance", pnlNumPeq(brl(a.alta), "altaT", "", ' data-tipo="agencia"')) +
    '</div>' +
    '<div class="card" style="margin-top:9px;background:var(--card2)">' +
      '<div class="h3" style="margin-bottom:8px">Patrocínio, ' + esc(e.ed ? e.ed.rot : "edicao") + '</div>' +
      pnlLinhaCartao("Vendido", pnlNumPeq(brl(e.vendido), "edVendido", "", ' data-k="' + esc(k) + '"')) +
      pnlLinhaCartao("Em aberto", pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(k) + '"')) +
    '</div>' +
  '</div>';

  /* Nesta régua a coluna Total fica vazia de propósito: agência está no
     mês e patrocínio está na edição inteira. Somar duas janelas de tempo
     diferentes produz um número que não responde pergunta nenhuma. */
  h += '<div class="tiny muted" style="margin-top:10px">Com o patrocínio por edição não existe Total: ' +
       'a coluna de agência é do mês e a de patrocínio é da edição inteira. ' +
       'Somar duas janelas de tempo diferentes daria um número que não responde nada.</div>';
  return h;
}

// Só aparece dentro de .only-mob, então a altura mínima é a do dedo: 44px.
function pnlLinhaCartao(rot, valorHtml){
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;' +
         'min-height:44px;padding:4px 0;border-bottom:1px solid var(--border)">' +
         '<span class="muted small">' + esc(rot) + '</span>' + valorHtml + '</div>';
}

function pnlLinhaMeta(N){
  var bloqueio = motivoBloqueio("crm_config");
  var botao = '<button class="btn btn-sm" data-a="editarMeta"' + (bloqueio ? " disabled" : "") + '>' +
              (N.temMeta ? "Editar meta" : "Definir meta") + '</button>' +
              (bloqueio ? '<div class="tiny" style="color:var(--text3);margin-top:4px">' + esc(bloqueio) + '</div>' : '');

  if(!N.temMeta){
    // Sem meta cadastrada, nunca NaN%.
    return '<div class="card-head" style="margin:12px 0 0;border-top:1px solid var(--border);padding-top:12px">' +
      '<div class="muted">Meta de MRR novo: <b>sem meta definida</b>. Enquanto não houver meta, ' +
      'o painel não mostra percentual nenhum.</div><div>' + botao + '</div></div>';
  }

      'fazer com, e "3 negócios fora" tem nome, valor e telefone.</div>' +

  var clsDia = S.pctEmDia >= 75 ? "green" : (S.pctEmDia >= 50 ? "warn" : "red");
  h += '<div class="kpi"><div class="kpi-l">Negócios em dia' + ajuda("temperatura") + '</div>' +
    pnlNum(S.emDia.length + '<span style="font-size:17px;color:var(--text3)"> de ' + S.total + '</span>', "emDia",

    '<div class="kpi-s">Em dia = próximo passo com data no futuro e contato dentro do limite do funil ' +
    '(5 dias em agência, 15 em patrocínio). ' +
    (S.foraDia.length ? pnlNumPeq(String(S.foraDia.length), "foraDia", "") + '<span class="muted"> fora.</span>' : '') +
    '</div></div>';

  // Concentração: quatro linhas de código e o alerta mais honesto do painel.
  if(S.temConcentracao){
    var cc = S.concentracao > 60 ? "red" : (S.concentracao > 40 ? "warn" : "");
    h += '<div class="kpi"><div class="kpi-l">Concentração do mês' + ajuda("concentracao") + '</div>' +
      pnlNum(pct(S.concentracao), "concentra", cc) +
      pnlBarra(S.concentracao, cc || "green") +
      '<div class="kpi-s">' + esc((S.maior && (S.maior.empresa || S.maior.titulo)) || "o maior negócio") +
      ' sozinho vale ' + brl(valorRefDe(S.maior)) + ' de ' + brl(S.somaMes) +
      ' em ' + S.abertosMes.length + ' negócios abertos previstos pro mês.' +
      (S.concentracao > 60 ? '<br><b style="color:var(--red)">A previsão do mês é uma moeda girando num negócio só.</b>' : '') +
      '</div></div>';
  } else {
    // Duas razões diferentes pro traço, e a tela precisa dizer QUAL. Escrever
    // "só aparece com 3 ou mais, agora são 3" é a tela se contradizendo na
    // mesma linha, que é o que acontecia com três negócios cadastrados às
    // pressas sem valor nenhum preenchido.
    h += pnlKpi("Concentracao do mês", '<div class="kpi-v muted" style="font-size:20px">-</div>',
      S.abertosMes.length >= 3
        ? 'Os ' + S.abertosMes.length + ' negócios abertos previstos pro mês estão todos sem valor em R$, ' +
          'então não dá pra dizer quanto o maior pesa. Preencha o valor deles pra este número existir.'
        : 'Só aparece com 3 ou mais negócios abertos previstos pro mês. Agora ' +
          (S.abertosMes.length === 1 ? 'é 1.' : 'são ' + S.abertosMes.length + '.'));
  }

  var cv = !S.vencidos.length ? "green" : (S.piorAtraso > 30 ? "red" : "warn");
  h += '<div class="kpi"><div class="kpi-l">Com data vencida</div>' +
    pnlNum(String(S.vencidos.length) + '<span style="font-size:17px;color:var(--text3)"> ' +
      (S.vencidos.length === 1 ? 'negócio' : 'negócios') + '</span>', "vencidos", cv) +
    '<div class="kpi-s">' +
    (!S.vencidos.length
      ? 'Nenhum próximo passo vencido. Funil em dia.'
      : 'O pior está vencido há ' + S.piorAtraso + (S.piorAtraso === 1 ? ' dia' : ' dias') + '. ' +
        (S.piorAtraso > 30 ? 'Passou de 30 dias não é atraso, é negócio morto contando na conta.' : '')) +
    '</div></div>';

  h += '</div></div>';
  return h;
}

/* ------------------------ 4. GANHOS E PERDAS ------------------------ */
/* ---------------------------------------------------------------------
   PLACAR DA CAPTACAO

   A pergunta que esse bloco responde e uma so: o problema esta em cima do
   funil ou embaixo? Com SDR e closer, "vendemos pouco" tem duas causas
   opostas, e a correcao de uma piora a outra. Poucos leads captados pede
   mais prospeccao; muitos leads captados e poucos fechados pede parar de
   prospectar e cuidar do que ja esta na mesa.

   O QUE ENTRA NA CONTA
   Um negocio conta pro SDR pelo mes em que ele foi CAPTADO (criadoEm),
   nao pelo mes em que fechou. Contar pelo fechamento jogaria o merito da
   captacao de marco no placar de junho, e o SDR passaria meses sem ver o
   proprio trabalho aparecer.

   O "fechados" desta tela e a parte dos captados NAQUELE mes que ja virou
   ganho, mesmo que o ganho tenha acontecido depois. E por isso que o
   numero de um mes recente parece baixo: negocio captado ontem ainda nao
   teve tempo de fechar, e a linha embaixo do numero diz isso.
   --------------------------------------------------------------------- */
function pnlCaptacao(ym){
  var todos = lista("negocios"), i, n, d;
  var porPessoa = {}, ordem = [];

  function slot(nome){
    var k = chave(nome);
    if(!porPessoa[k]){
      porPessoa[k] = { nome:nome, captados:0, passados:0, ganhos:0, perdidos:0,
                       abertos:0, gerado:0, diasAtePassar:[], estagios:{} };
      ordem.push(k);
    }
    return porPessoa[k];
  }

  for(i=0;i<todos.length;i++){
    n = todos[i];
    if(n.arquivado) continue;
    if(mesDe(n.criadoEm) !== ym) continue;
    if(!n.captouNome) continue;
    d = slot(n.captouNome);
    d.captados++;
    if(n.passadoEm){
      d.passados++;
      var dias = diasEntre(n.criadoEm, n.passadoEm);
      if(dias >= 0) d.diasAtePassar.push(dias);
      if(n.passadoNoEstagio) d.estagios[n.passadoNoEstagio] = (d.estagios[n.passadoNoEstagio] || 0) + 1;
    }
    if(n.status === "ganho"){ d.ganhos++; d.gerado += valorRefDe(n); }
    else if(n.status === "perdido") d.perdidos++;
    else if(n.status === "aberto") d.abertos++;
  }

  var r = [];
  for(i=0;i<ordem.length;i++) r.push(porPessoa[ordem[i]]);
  r.sort(function(a,b){ return b.captados - a.captados; });
  return r;
}

  var h = '<div class="card">' +

  for(var i=0;i<linhas.length;i++){

    h += '<tr>' +

      '</div></td>' +
      '<td class="r mono-num">' + L.captados + '</td>' +
      '<td class="r mono-num">' + L.passados +
        (L.captados ? '<div class="tiny muted">' + pct((L.passados/L.captados)*100, 0) + '</div>' : '') + '</td>' +
      '<td class="r mono-num">' + L.ganhos + '</td>' +

      '<td class="r mono-num">' + (med === null ? '<span class="muted">-</span>'
        : (med + (med === 1 ? ' dia' : ' dias') +
           (L.diasAtePassar.length < 3 ? '<div class="tiny muted">n=' + L.diasAtePassar.length + '</div>' : ''))) + '</td>' +

  /* O aviso que evita a leitura errada mais provavel deste bloco. */

  return h + '</div>';
}

function pnlMotivosHTML(G){

function pnlTicketHTML(G){
  var ag = [], fee = [], mes = [], i, n;
  var porEd = {};
  for(i = 0; i < G.ganhos.length; i++){
    n = G.ganhos[i];
    if(n.tipo === "agencia"){
      ag.push(valorRefDe(n));
      fee.push(mrrDe(n));
      // meses 0 = indeterminado, e valorRefDe já trata como 12. A duração
      // mediana tem que contar a mesma coisa, senão as duas linhas brigam.
      mes.push(((n.ag && n.ag.meses) || 0) || 12);
    } else if(n.pt){
      var k = n.pt.edicao || "sem_edicao";
      if(!porEd[k]) porEd[k] = [];
      porEd[k].push(n.pt.valor || 0);
    }
  }
  var h = '<div class="h3" style="margin-top:18px">Ticket dos ganhos, 12 meses</div>' +
    '<div class="tiny muted" style="margin-bottom:8px">Agência com três números e três unidades: ' +
    'R$ 42.000 pode ser 3.500 por 12 meses ou 7.000 por 6, e são negócios diferentes.</div>' +
    '<div class="kpis">' +
    pnlKpi("Contrato de agência", '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(ag, brl) + '</div>',
      'valor total do contrato, em R$. ' + (ag.length ? pnlNumPeq("ver a lista", "ticketAg", "") : "")) +
    pnlKpi("Fee de agência", '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(fee, function(v){ return brl(v) + "/mês"; }) + '</div>',
      'R$ por mês que a Lime fatura, já com a fatia da verba') +
    pnlKpi("Duração de agência", '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(mes, function(v){ return v + " meses"; }) + '</div>',
      'em meses. Contrato indeterminado conta como 12.');
  var ek;
  for(ek in porEd){
    if(!Object.prototype.hasOwnProperty.call(porEd, ek)) continue;
    var ed = edicaoDe(ek);
    h += pnlKpi("Cota " + esc(ed ? ed.rot : ek),
      '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(porEd[ek], brl) + '</div>',
      'cota vendida, em R$. ' + pnlNumPeq("ver a lista", "edVendido", "", ' data-k="' + esc(ek) + '"'));
  }
  return h + '</div>';
}

function pnlCartaoEdicao(k){

    ? 'faltam <b>' + e.diasCorte + (e.diasCorte === 1 ? ' dia' : ' dias') + '</b> pro corte comercial (' + dataBR(e.ed.corteComercial) + ')'
    : 'o corte comercial passou há <b>' + passou + (passou === 1 ? ' dia' : ' dias') + '</b> (' + dataBR(e.ed.corteComercial) + ')';
  var cls = e.pct >= 100 ? "green" : (e.pct >= 60 ? "" : (e.diasCorte < 30 ? "red" : "warn"));

  var h = '<div class="kpi"><div class="kpi-l">' + esc(e.ed.rot) + '</div>';
  h += pnlNum(brl(e.vendido), "edVendido", "lime", ' data-k="' + esc(k) + '"');

  if(e.meta > 0){
    h += '<div class="kpi-s">vendidos de <b>' + brl(e.meta) + '</b> de meta (' + pct(e.pct) + ')</div>' +
         pnlBarra(e.pct, cls);
  } else {
    // Sem meta da edição cadastrada, nenhum percentual é mostrado. O link
    // fica visível e desabilitado pra quem não mexe em meta, com o motivo
    // escrito: botão que some faz a pessoa achar que o CRM quebrou.
    h += '<div class="kpi-s">vendidos. <b>Sem meta definida</b> pra esta edição, então não existe percentual aqui. ' +
         '<button style="color:var(--lime);' + PNL_CLIC +
         (bloqueio ? ';opacity:.45;cursor:not-allowed' : '') + '" data-a="editarMeta"' +
         (bloqueio ? " disabled" : "") + '>definir a meta</button>' +
         (bloqueio ? '<br><span style="color:var(--text3)">' + esc(bloqueio) + '</span>' : '') + '</div>';
  }
  h += '<div class="kpi-s" style="margin-top:8px">' +
    pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(k) + '"') +
    '<span class="muted"> em aberto em ' + e.nAb + (e.nAb === 1 ? ' negócio' : ' negócios') + ', e ' + corte + '.</span>' +
    // O CRM atravessa edições: depois do evento diasEvento fica negativo, e
    // "daqui a -12 dias" é número com unidade errada na cara do gestor.
    '<br><span class="muted">Evento em ' + dataBR(e.ed.dataEvento) + ', ' +
    (e.diasEvento >= 0
      ? 'daqui a ' + e.diasEvento + (e.diasEvento === 1 ? ' dia' : ' dias')
      : 'já aconteceu há ' + Math.abs(e.diasEvento) + (Math.abs(e.diasEvento) === 1 ? ' dia' : ' dias')) + '. ' +
    e.nVend + (e.nVend === 1 ? ' cota vendida' : ' cotas vendidas') + '.</span>' +
    (e.permuta > 0 ? '<br><span class="muted">Permuta de ' + brl(e.permuta) + ' fechada a parte, nunca somada ao dinheiro.</span>' : '') +
  '</div></div>';
  return h;
}

      : 'Enquanto não houver meta, o painel não calcula percentual nenhum.');

  for(var i = 0; i < EDICOES.length; i++){
