<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<!-- Fora do Google e de qualquer buscador. A pagina e publica por endereco,
     entao a unica coisa que impede ela de ser achada sem querer e isto aqui
     mais o robots.txt do repo. -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0A0A">
<meta name="format-detection" content="telephone=no">
<title>CRM Lime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Ctext x='16' y='23' font-family='Arial Black,Arial' font-size='18' font-weight='900' fill='%23C8FF00' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
/* =====================================================================
   CRM LIME - SISTEMA DE DESIGN
   Identidade da Agencia Lime, a mesma dos outros paineis:
   lime #C8FF00 sobre fundo quase preto, Inter no corpo e Barlow
   Condensed em titulo e numero grande.
   Tudo aqui e CSS puro. Sem framework, sem build.
   ===================================================================== */

:root{
  --lime:#C8FF00; --lime-dim:rgba(200,255,0,0.10); --lime-border:rgba(200,255,0,0.25);
  --lime-ink:#0A0A0A;
  --bg:#0A0A0A; --card:#141414; --card2:#1A1A1A; --card3:#202020;
  /* CONTRASTE. Os dois tons de apoio eram #CCCCCC e #888888, e no fundo
     quase preto o #888888 sumia: virava cinza sobre preto em texto de
     11px, que e justamente onde moram as explicacoes e as unidades dos
     numeros. Subiram pra #E8E8E8 e #ADADAD, que passam de 7:1 de
     contraste no fundo dos cartoes. O lime continua sendo o destaque;
     o que mudou foi so parar de apagar o texto de apoio. */
  --text:#FFFFFF; --text2:#E8E8E8; --text3:#ADADAD;
  --green:#00FF88; --red:#FF4444; --warn:#FFB800; --blue:#5B9BD5; --purple:#7B2D8B;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --radius:14px; --rad-sm:8px; --rad-pill:999px;
  --disp:'Barlow Condensed',sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --shadow:0 6px 24px rgba(0,0,0,0.45);
  --sidebar-w:232px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--lime);text-decoration:none}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}

/* ---------- tipografia ---------- */
.h1{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.3px;line-height:1.1}
.h2{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.7px;text-transform:uppercase}
.h3{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
.num{font-family:var(--disp);font-weight:900;letter-spacing:-.5px;line-height:1}
.muted{color:var(--text3)}
.muted2{color:var(--text2)}
.tiny{font-size:11.5px;font-weight:450}
.small{font-size:12.5px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono-num{font-variant-numeric:tabular-nums}

/* barra de secao com o tico lime na esquerda */
.sec-title{font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;border-left:3px solid var(--lime);padding-left:11px;
  display:flex;align-items:center;gap:9px}
.sec-sub{font-size:12.5px;color:var(--text3);margin-top:5px;padding-left:14px;line-height:1.45}

/* ---------- layout geral ---------- */
.shell{display:flex;min-height:100vh}

.side{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:#0D0D0D;
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{padding:16px 16px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
.side-brand img{height:30px;width:auto;display:block}
.side-brand .bn{font-family:var(--disp);font-weight:800;font-size:17px;
  letter-spacing:1px;color:var(--lime);text-transform:uppercase;line-height:1}
.side-brand .bs{font-size:10px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase}

.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--text3);padding:12px 10px 6px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;border-radius:var(--rad-sm);color:var(--text2);
  font-size:13.5px;font-weight:500;text-align:left;transition:background .12s,color .12s}
.nav a:hover,.nav button:hover{background:var(--card2);color:var(--text)}
.nav .on{background:var(--lime-dim);color:var(--lime);font-weight:600;
  box-shadow:inset 2px 0 0 var(--lime)}
.nav .ic{width:18px;text-align:center;font-size:15px;flex:0 0 18px}
.nav .cnt{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:12px;
  color:var(--text3);background:var(--card2);border-radius:var(--rad-pill);
  padding:1px 8px;min-width:24px;text-align:center}
.nav .on .cnt{background:rgba(200,255,0,.15);color:var(--lime)}
.nav .cnt.alert{background:rgba(255,68,68,.15);color:var(--red)}

.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.side-foot .who{color:var(--text2);font-weight:600;font-size:12px}
.side-foot .perfil{display:inline-block;font-family:var(--disp);font-size:10px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;color:var(--lime);
  background:var(--lime-dim);border:1px solid var(--lime-border);
  border-radius:var(--rad-pill);padding:1px 8px;margin-top:4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:11px 20px;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border)}
.topbar .grow{flex:1;min-width:0}
.content{padding:20px;max-width:1400px;width:100%;margin:0 auto;
  display:flex;flex-direction:column;gap:22px;flex:1}

/* ---------- botoes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--rad-sm);font-weight:600;font-size:13px;
  border:1px solid var(--border2);background:var(--card2);color:var(--text);
  transition:all .14s;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--card3);border-color:var(--text3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:700}
.btn-primary:hover{background:#d8ff3a;border-color:#d8ff3a}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-ghost:hover{background:var(--card2)}
.btn-danger{background:transparent;border-color:rgba(255,68,68,.35);color:var(--red)}
.btn-danger:hover{background:rgba(255,68,68,.1);border-color:var(--red)}
.btn-sm{padding:5px 11px;font-size:12px;min-height:30px}
.btn-lg{padding:13px 22px;font-size:15px;min-height:46px}
.btn-block{width:100%}
.btn-icon{padding:7px;min-width:34px;min-height:34px}

/* pilula de filtro */
.pill{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;padding:5px 14px;border-radius:var(--rad-pill);
  border:1px solid var(--border);background:transparent;color:var(--text3);
  transition:all .14s;min-height:30px}
.pill:hover{border-color:var(--lime-border);color:var(--lime)}
.pill.on{background:var(--lime-dim);border-color:var(--lime-border);color:var(--lime)}
.pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* ---------- formulario ---------- */
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.6px}
.fld label .req{color:var(--lime)}
.inp,select.inp,textarea.inp{background:var(--card2);border:1px solid var(--border2);
  border-radius:var(--rad-sm);padding:10px 12px;color:var(--text);width:100%;
  outline:none;transition:border-color .14s,box-shadow .14s;min-height:40px}
.inp::placeholder{color:#666}
.inp:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,255,0,.13)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.5}
select.inp{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.fld .hint{font-size:12px;color:var(--text3);line-height:1.45}
.fld .err{font-size:11.5px;color:var(--red);font-weight:600}
.inp.bad{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.form{display:flex;flex-direction:column;gap:14px}

/* busca no topo */
.search{position:relative;max-width:420px;width:100%}
.search .inp{padding-left:34px}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:14px;pointer-events:none}
.search-out{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:80;
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;padding:6px}
.search-grp{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--text3);padding:8px 10px 4px}
.search-it{display:flex;align-items:center;gap:9px;padding:8px 10px;
  border-radius:var(--rad-sm);cursor:pointer;width:100%;text-align:left}
.search-it:hover,.search-it.sel{background:var(--card2)}
.search-it .t{font-weight:600;font-size:13px}
.search-it .s{font-size:11.5px;color:var(--text3)}

/* ---------- cartao ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-lime{border-color:var(--lime-border);box-shadow:0 0 0 1px rgba(200,255,0,.05)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:14px}

/* faixa de numeros grandes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px}
.kpi.accent{border-color:var(--lime-border);
  background:linear-gradient(135deg,rgba(200,255,0,.09) 0%,var(--card) 68%)}
.kpi-l{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.kpi-v{font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:-.5px;line-height:1}
.kpi-v.lime{color:var(--lime)} .kpi-v.green{color:var(--green)}
.kpi-v.red{color:var(--red)} .kpi-v.warn{color:var(--warn)}
.kpi-s{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.4}

/* ---------- etiqueta ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);
  font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  padding:3px 10px;border-radius:var(--rad-pill);
  border:1px solid var(--border);color:var(--text3);white-space:nowrap}
.tag-lime{background:var(--lime-dim);border-color:var(--lime-border);color:var(--lime)}
.tag-green{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.35);color:var(--green)}
.tag-red{background:rgba(255,68,68,.1);border-color:rgba(255,68,68,.35);color:var(--red)}
.tag-warn{background:rgba(255,184,0,.1);border-color:rgba(255,184,0,.35);color:var(--warn)}
.tag-blue{background:rgba(91,155,213,.12);border-color:rgba(91,155,213,.35);color:var(--blue)}
.tag-purple{background:rgba(123,45,139,.18);border-color:rgba(123,45,139,.5);color:#c77ad4}
.tag-solid{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}

/* ---------- tabela ---------- */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table.tb{width:100%;border-collapse:collapse;min-width:620px}
table.tb th{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--text3);text-align:left;padding:11px 14px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:#101010;
  position:sticky;top:0;z-index:2}
table.tb th.srt{cursor:pointer;user-select:none}
table.tb th.srt:hover{color:var(--lime)}
table.tb td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr{cursor:pointer;transition:background .1s}
table.tb tbody tr:hover{background:var(--card2)}
table.tb td.r,table.tb th.r{text-align:right;font-variant-numeric:tabular-nums}
.cel-nome{font-weight:600}
.cel-sub{font-size:11.5px;color:var(--text3)}

/* ---------- funil kanban ---------- */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;
  scroll-snap-type:x proximity}
.kb-col{flex:0 0 268px;width:268px;background:#101010;border:1px solid var(--border);
  border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 230px);
  scroll-snap-align:start}
.kb-col.drop{border-color:var(--lime);background:rgba(200,255,0,.04)}
.kb-h{padding:11px 13px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:#101010;border-radius:var(--radius) var(--radius) 0 0;z-index:2}
.kb-h .n{font-family:var(--disp);font-weight:800;font-size:13.5px;letter-spacing:.6px;
  text-transform:uppercase;display:flex;align-items:center;gap:7px}
.kb-h .v{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--lime);margin-top:3px}
.kb-h .c{font-size:11px;color:var(--text3)}
.kb-body{padding:9px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;min-height:70px}
.kb-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad-sm);
  padding:11px 12px;cursor:pointer;transition:all .14s;position:relative}
.kb-card:hover{border-color:var(--lime-border);transform:translateY(-1px);box-shadow:var(--shadow)}
.kb-card.dragging{opacity:.4}
.kb-card .kt{font-weight:600;font-size:13.5px;line-height:1.3;margin-bottom:3px}
.kb-card .ke{font-size:11.5px;color:var(--text3);margin-bottom:8px}
.kb-card .kv{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--text)}
.kb-card .kf{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.kb-card .flag{position:absolute;top:0;left:0;bottom:0;width:3px;border-radius:var(--rad-sm) 0 0 var(--rad-sm)}
.kb-empty{font-size:11.5px;color:#555;text-align:center;padding:16px 8px;line-height:1.5}

/* ---------- linha do tempo ---------- */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-it{display:flex;gap:12px;padding:11px 0;position:relative}
.tl-it:not(:last-child)::before{content:'';position:absolute;left:15px;top:34px;bottom:-6px;
  width:1px;background:var(--border)}
.tl-ic{flex:0 0 31px;height:31px;border-radius:50%;background:var(--card2);
  border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-size:14px;z-index:1}
.tl-bd{flex:1;min-width:0}
.tl-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl-t{font-weight:600;font-size:13px}
.tl-d{font-size:11px;color:var(--text3);margin-left:auto}
.tl-x{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.5;white-space:pre-wrap;
  overflow-wrap:anywhere}

/* ---------- caixa modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;
  align-items:flex-start;justify-content:center;padding:22px;overflow-y:auto;
  backdrop-filter:blur(3px);animation:fade .15s ease}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  width:100%;max-width:560px;box-shadow:var(--shadow);margin:auto;animation:pop .18s ease}
.modal.wide{max-width:920px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:var(--card);border-radius:var(--radius) var(--radius) 0 0;z-index:3}
.modal-b{padding:20px}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;
  border-top:1px solid var(--border);flex-wrap:wrap;position:sticky;bottom:0;background:var(--card)}
.x{font-size:22px;line-height:1;color:var(--text3);padding:2px 8px;border-radius:var(--rad-sm)}
.x:hover{color:var(--text);background:var(--card2)}

/* ---------- aviso rapido ---------- */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:400;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1d1d1d;border:1px solid var(--border2);border-radius:var(--rad-pill);
  padding:10px 20px;font-size:13px;font-weight:500;box-shadow:var(--shadow);
  animation:up .2s ease;max-width:90vw}
.toast.ok{border-color:rgba(0,255,136,.4);color:var(--green)}
.toast.bad{border-color:rgba(255,68,68,.4);color:var(--red)}

/* ---------- estado vazio ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--text3)}
.empty .ei{font-size:34px;opacity:.3;margin-bottom:10px}
.empty .et{font-family:var(--disp);font-weight:700;font-size:17px;color:var(--text2);margin-bottom:5px}
.empty .ex{font-size:13px;max-width:330px;margin:0 auto 16px;line-height:1.5}

/* ---------- barra de progresso ---------- */
.bar{height:7px;background:var(--card2);border-radius:var(--rad-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:var(--rad-pill);
  transition:width .4s ease}
.bar i.green{background:var(--green)} .bar i.red{background:var(--red)}
.bar i.warn{background:var(--warn)}

/* ---------- tela de entrada ---------- */
.gate{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;
  align-items:center;justify-content:center;padding:22px}
.gate-card{width:100%;max-width:352px;text-align:center}
.gate-card > img{height:74px;width:auto;margin:0 auto 22px;display:block}
.gate-t{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:.5px;line-height:1}
.gate-s{font-family:var(--disp);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--text3);margin-top:7px}
.gate-f{margin-top:26px;display:flex;flex-direction:column;gap:11px}
.gate-e{color:var(--red);font-size:12.5px;min-height:1.2em;font-weight:600}
.gate-n{color:var(--text3);font-size:12px;margin-top:20px;line-height:1.5}
.pww{position:relative}
.pww .inp{padding-right:76px;text-align:center;letter-spacing:1px}
.pweye{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;
  color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;
  padding:5px 7px;border-radius:var(--rad-sm)}
.pweye:hover{color:var(--lime)}

/* ---------- grafico em CSS puro ---------- */
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:132px;padding-top:16px}
.cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:5px;min-width:0;height:100%}
.cb i{width:100%;background:var(--lime);border-radius:4px 4px 0 0;min-height:2px;
  transition:height .4s ease;display:block;position:relative}
.cb i.dim{background:#333}
.cb .cl{font-size:10px;color:var(--text3);text-align:center;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .cv{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--text2)}

.funnel{display:flex;flex-direction:column;gap:5px}
.fn-row{display:flex;align-items:center;gap:11px}
.fn-lbl{flex:0 0 132px;font-size:12px;color:var(--text2);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn-bar{flex:1;height:26px;background:var(--card2);border-radius:var(--rad-sm);overflow:hidden;position:relative}
.fn-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime) 0%,rgba(200,255,0,.55) 100%);
  border-radius:var(--rad-sm);transition:width .5s ease}
.fn-val{flex:0 0 96px;font-family:var(--disp);font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums}

/* ---------- animacao ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.rise{animation:rise .34s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- celular ----------
   O vendedor usa no celular depois da reuniao. A barra lateral vira uma
   barra de abas embaixo, na altura do polegar, e o kanban rola na horizontal
   uma coluna por vez. Trocar de estagio no celular NAO e arrastar, e escolher
   numa lista, porque arrastar com uma mao so nao funciona.               */
.only-mob{display:none}
@media (max-width:860px){
  /* ALVO DE TOQUE. No computador 38px e confortavel com mouse, mas no
     celular o minimo que a mao acerta e 44px, e essa tela e usada na rua,
     em pe, com uma mao so. Subir so aqui evita engordar a interface do
     computador, onde cabe mais informacao por altura de tela. */
  .btn{min-height:44px}
  .btn-sm{min-height:40px;padding:8px 13px}
  .pill{min-height:38px;padding:8px 15px}
  .inp,select.inp,textarea.inp{min-height:46px}
  /* 16px impede o iOS de dar zoom no foco e desalinhar a tela inteira. */
  input.inp,select.inp,textarea.inp{font-size:16px}
  .x{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}

  .side{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;
    flex-direction:row;border-right:0;border-top:1px solid var(--border);z-index:90;
    overflow:visible;padding-bottom:env(safe-area-inset-bottom)}
  .side-brand,.side-foot,.nav-lbl{display:none}
  .nav{flex-direction:row;width:100%;padding:5px 4px;gap:0;justify-content:space-around}
  .nav a,.nav button{flex-direction:column;gap:3px;padding:6px 3px;font-size:9.5px;
    text-align:center;letter-spacing:.2px;border-radius:var(--rad-sm)}
  .nav .on{box-shadow:none}
  .nav .ic{font-size:18px;width:auto;flex:none}
  .nav .cnt{position:absolute;top:1px;right:50%;margin-right:-20px;margin-left:0;
    font-size:9.5px;padding:0 5px;min-width:17px;line-height:16px}
  .nav .hide-mob{display:none}
  .content{padding:14px 13px 84px;gap:17px}
  .topbar{padding:9px 13px}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:12px 13px}
  .kpi-v{font-size:24px}
  .kb{gap:9px;margin:0 -13px;padding:0 13px 10px;scroll-snap-type:x mandatory}
  .kb-col{flex:0 0 84vw;width:84vw;max-height:none}
  .modal{max-width:100%;margin:0}
  .ov{padding:0;align-items:flex-end}
  .modal{border-radius:var(--radius) var(--radius) 0 0;max-height:94vh;overflow-y:auto}
  .modal-f{flex-direction:column-reverse}
  .modal-f .btn{width:100%}
  .fn-lbl{flex:0 0 88px;font-size:11px}
  .fn-val{flex:0 0 74px;font-size:12.5px}
  .h1{font-size:22px}
  .only-mob{display:initial}
  .no-mob{display:none!important}
  .search{max-width:none}
  .toast-wrap{bottom:78px}
}
@media (max-width:400px){
  .kpis{grid-template-columns:1fr}
}
@media print{
  .side,.topbar,.btn,.pills{display:none!important}
  body{background:#fff;color:#000}
  .card,.kpi{border-color:#ccc;background:#fff}
}

/* ---------- faixa de aviso ----------
   Nao some sozinha. Some quando a pessoa fecha ou quando o problema
   acaba. Aviso que some sozinho e aviso que ninguem leu.               */
.faixa{display:flex;align-items:center;gap:10px;padding:10px 20px;
  background:rgba(255,184,0,.1);border-bottom:1px solid rgba(255,184,0,.3);
  color:var(--warn);font-size:13px;line-height:1.45}
.faixa .fx-ic{font-size:15px;flex:0 0 auto}
.faixa .fx-txt{flex:1;min-width:0}
.faixa .x{color:var(--warn);flex:0 0 auto}
.faixa.grave{background:rgba(255,68,68,.1);border-bottom-color:rgba(255,68,68,.35);color:var(--red)}
.faixa.grave .x{color:var(--red)}

/* ---------- pontinho de sincronismo ----------
   Tres estados, e o title explica cada um. Sem isso, "salvo" e "nao
   salvo" ficam iguais na tela.                                        */
.sync{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px;
  background:var(--green);transition:background .2s}
.sync-ok{background:var(--green)}
.sync-pend{background:var(--warn);animation:pulsa 1.6s ease-in-out infinite}
.sync-erro{background:var(--red)}
.sync-sync{background:var(--lime);animation:pulsa .9s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- barra da volta do WhatsApp ----------
   Aparece no rodape quando a pessoa volta de uma conversa. O registro
   acontece NA VOLTA, com a conversa fresca, e nao antes de sair, quando
   a pessoa esta com pressa.                                            */
#barraRetorno{position:fixed;left:0;right:0;bottom:0;z-index:150;
  background:var(--card);border-top:1px solid var(--lime-border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 -6px 22px rgba(0,0,0,.4);animation:up .2s ease}
#barraRetorno .rt-q{flex:1;min-width:150px;font-weight:600;font-size:13.5px}
@media (max-width:860px){ #barraRetorno{bottom:62px} }

/* ---------- linha de negocio na fila do Hoje ---------- */
.fila{display:flex;flex-direction:column}
.fila-it{display:flex;align-items:flex-start;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--border);cursor:pointer}
.fila-it:last-child{border-bottom:0}
.fila-it:hover{background:rgba(255,255,255,.02)}
.fila-tmp{flex:0 0 26px;font-size:17px;text-align:center;line-height:1.2;padding-top:1px}
.fila-bd{flex:1;min-width:0}
.fila-emp{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.4px;
  text-transform:uppercase;line-height:1.15}
.fila-mot{font-size:12.5px;color:var(--text2);margin-top:3px;line-height:1.4}
.fila-ult{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.4}
.fila-vl{flex:0 0 auto;text-align:right;font-family:var(--disp);font-weight:800;
  font-size:16px;white-space:nowrap;padding-top:1px}
.fila-ac{flex:0 0 auto;display:flex;gap:6px;align-items:center}
@media (max-width:860px){
  .fila-it{flex-wrap:wrap}
  .fila-vl{order:3;flex:1;text-align:left;font-size:15px}
  .fila-ac{order:4}
}

/* ---------- numero gigante da fila ---------- */
.gigante{font-family:var(--disp);font-weight:900;font-size:64px;line-height:.9;
  letter-spacing:-2px;color:var(--lime)}
@media (max-width:860px){ .gigante{font-size:52px} }

/* ---------- stepper de estagio ---------- */
.step{display:flex;align-items:center;gap:0;margin:14px 0}
.step-p{flex:0 0 13px;width:13px;height:13px;border-radius:50%;
  border:2px solid var(--border2);background:var(--bg);position:relative;z-index:1}
.step-p.feito{background:var(--lime);border-color:var(--lime)}
.step-p.atual{background:var(--lime);border-color:var(--lime);
  box-shadow:0 0 0 4px rgba(200,255,0,.2)}
.step-l{flex:1;height:2px;background:var(--border2);min-width:10px}
.step-l.feito{background:var(--lime)}
.step-rot{font-size:11.5px;color:var(--text3);margin-top:7px}
.step-rot b{color:var(--text);font-weight:600}

/* ---------- item selecionavel em folha ---------- */
.esc{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:var(--rad-sm);
  border:1px solid var(--border);background:var(--card2);margin-bottom:8px;transition:all .14s}
.esc:hover{border-color:var(--lime-border);background:var(--card3)}
.esc.on{border-color:var(--lime);background:var(--lime-dim)}
.esc .en{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.esc .ed{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.45}
.esc.atual .en::after{content:'atual';font-family:var(--disp);font-size:10px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;color:var(--lime);
  background:var(--lime-dim);border:1px solid var(--lime-border);
  border-radius:var(--rad-pill);padding:1px 8px;margin-left:auto}

/* ---------- cartao de senha gerada ---------- */
.senha-card{background:var(--lime-dim);border:1px solid var(--lime-border);
  border-radius:var(--radius);padding:18px;text-align:center;margin:12px 0}
.senha-card .sv{font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:2px;
  color:var(--lime);word-break:break-all;margin:8px 0 12px;user-select:all}

/* ---------- aviso honesto de seguranca ---------- */
.honesto{border:1px dashed var(--border2);border-radius:var(--rad-sm);padding:13px 15px;
  font-size:12px;color:var(--text3);line-height:1.55;margin-top:18px}
.honesto b{color:var(--text2)}

/* ---------- item de atividade nao enviado ---------- */
.tl-it.pend{opacity:.6}
.tl-it.pend .tl-t::after{content:' ⏱';font-size:11px;color:var(--warn)}

/* ---------- acoes da linha da fila (tela Hoje) ----------
   No computador sao botoes compactos: com flex:1 eles esticavam ate a
   borda e cada linha da fila ficava com 90px de altura, entao a fila de
   8 itens, que existe justamente pra caber numa tela, obrigava a rolar.
   No celular voltam a ocupar a linha inteira, porque ali o que manda e o
   tamanho do alvo pro polegar.                                         */
.acao-fila{flex:0 0 auto;min-width:104px;justify-content:center}
@media (max-width:860px){
  .acao-fila{flex:1 1 0;min-width:0}
}

/* ---------- ajuda de tela: o bolinha de interrogacao ----------
   Discreto ao lado do rotulo, forte quando o mouse chega. Nao usa o
   title do navegador de proposito: title so existe no hover, e hover nao
   existe no dedo, entao metade do uso ficaria sem explicacao nenhuma. */
.aj{display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;flex:0 0 17px;border-radius:50%;
  border:1px solid var(--border2);background:transparent;
  color:var(--text3);font-size:10.5px;font-weight:700;line-height:1;
  vertical-align:middle;margin-left:5px;padding:0;transition:all .14s}
.aj:hover,.aj:focus-visible{border-color:var(--lime);color:var(--lime);
  background:var(--lime-dim);outline:none}

.aj-pop{position:absolute;z-index:300;width:340px;max-width:calc(100vw - 24px);
  background:var(--card2);border:1px solid var(--lime-border);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;
  animation:pop .14s ease}
.aj-pop .aj-t{font-family:var(--disp);font-weight:800;font-size:15px;
  letter-spacing:.5px;text-transform:uppercase;color:var(--lime);margin-bottom:8px}
.aj-pop p{font-size:13px;line-height:1.55;color:var(--text2);margin-bottom:9px}
.aj-pop p:last-of-type{margin-bottom:0}
.aj-pop .aj-x{display:none}

/* No celular a caixinha flutuante taparia justamente o numero que a
   pessoa quer entender, entao ela vira uma faixa presa embaixo, acima da
   barra de abas, com botao de fechar do tamanho do polegar. */
@media (max-width:860px){
  .aj{width:21px;height:21px;flex:0 0 21px;font-size:12px}
  .aj-pop.aj-baixo{position:fixed;left:10px;right:10px;bottom:72px;top:auto;
    width:auto;max-width:none;max-height:60vh;overflow-y:auto;
    padding-bottom:8px;animation:up .18s ease}
  .aj-pop .aj-x{display:block;width:100%;margin-top:12px;min-height:44px;
    border-radius:var(--rad-sm);border:1px solid var(--lime-border);
    background:var(--lime-dim);color:var(--lime);
    font-family:var(--disp);font-weight:700;font-size:13px;
    letter-spacing:.6px;text-transform:uppercase}
}

/* ---------- TUTORIAL ----------
   Passo numerado com o numero fora do texto, pra vista bater o olho e
   saber onde parou. As figuras sao SVG que escala sozinho: largura 100%
   e altura automatica, entao o mesmo desenho serve monitor e celular. */
.tu-passo{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.tu-n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  background:var(--lime-dim);border:1px solid var(--lime-border);color:var(--lime);
  font-family:var(--disp);font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.tu-bd{min-width:0;flex:1 1 auto}
.tu-bd p{margin:0 0 9px;color:var(--text2);line-height:1.55}
.tu-bd p:last-child{margin-bottom:0}
.tu-bd b{color:var(--text)}
.tu-fig{margin:12px 0 2px;padding:0}
.tu-fig svg{width:100%;height:auto;display:block;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--rad-sm)}
.tu-fig figcaption{margin-top:7px;font-size:11.5px;font-weight:450;color:var(--text3);line-height:1.5}
@media(max-width:760px){
  .tu-passo{gap:10px}
  .tu-n{width:26px;height:26px;font-size:15px}
  /* No celular a figura larga vira ilegivel encolhida. Deixa rolar
     na horizontal dentro da propria moldura, sem empurrar a pagina. */
  .tu-fig{overflow-x:auto}
  .tu-fig svg{min-width:560px}
}

<body>

<!-- TELA DE ENTRADA. Preenchida por pintarGate(). -->
<div id="gate" class="gate" hidden></div>

<!-- APLICACAO -->
<div id="app" class="shell" hidden>

  <!-- BARRA LATERAL no computador, BARRA DE ABAS embaixo no celular.
       No celular ela fica na altura do polegar de proposito: o vendedor
       usa isso na rua, com uma mao so. -->
  <aside class="side">
    <div class="side-brand">
      <img src="logo-lime.png" alt="Agencia Lime">
      <div>
        <div class="bn">CRM</div>
        <div class="bs">Comercial</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="sideQuem"></div>
      <div id="sidePerfil"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-icon only-mob" data-a="voltar" aria-label="Voltar">‹</button>

      <div class="search grow">
        <span class="si">⌕</span>
        <!-- Sem data-a aqui: a delegacao do shell e de CLIQUE, e busca
             reage a DIGITACAO. Quem escuta e o escutador de input do
             modulo de cadastro, delegado no documento, que funciona
             mesmo com a tela sendo repintada por baixo. -->
        <input class="inp" id="busca" type="search" placeholder="Buscar empresa, pessoa ou negócio"
               autocomplete="off" aria-label="Buscar">
        <div class="search-out" id="buscaOut" hidden></div>
      </div>

      <button class="btn btn-primary" data-a="novo" title="Novo negocio">
        <span>+</span><span class="no-mob">Negócio</span>
      </button>

      <span class="sync sync-ok" id="pontoSync" title="tudo salvo"></span>
      <span class="tag tag-warn" id="pendCont" hidden></span>

      <div id="quemSou" class="tiny"></div>
      <button class="btn btn-icon" data-a="menu" aria-label="Menu">⋯</button>
    </header>

    <!-- Faixa de aviso. Nao some sozinha: some quando a pessoa fecha ou
         quando o problema acaba. As mensagens de sem conexao, cota
         estourada e regra recusada sao DIFERENTES de proposito, porque
         em 18/08/2026 todo mundo achou que era sinal ruim enquanto era
         cota de leitura estourada. -->
    <div class="faixa" id="faixaAviso" hidden>
      <span class="fx-ic">⚠</span>

    <main class="content" id="conteudo"></main>

</div>

<!-- FOLHA (o modal da casa) -->

<!-- AVISOS RAPIDOS -->

<!-- BARRA DA VOLTA DO WHATSAPP -->
<div id="barraRetorno" hidden></div>

<script>

/* ============ 02-util ============ */
/* =====================================================================
   CRM LIME - UTILIDADES E CAMADA DE DADOS
   JavaScript puro, sem dependência. Roda direto no navegador.
   ===================================================================== */

/* ---------------------------------------------------------------------
   TEXTO E NÚMERO
   --------------------------------------------------------------------- */

// Escapa antes de jogar em innerHTML. Toda string que veio do usuário
// passa por aqui, senão um nome de empresa com "<" quebra a tela.
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// R$ 3.500 sem centavos. Valor de negócio em agência nunca tem centavo,
// e centavo na tela só rouba espaço no celular.
function brl(n){
  var v = Number(n)||0;
  return 'R$ ' + v.toLocaleString('pt-BR',{maximumFractionDigits:0});
}
// Versão curta pro card do kanban: R$ 42 mil, R$ 1,2 mi
// O corte do milhão é feito no valor JÁ ARREDONDADO em milhares, senão
// R$ 999.999 cai na faixa de "mil", arredonda pra 1000 e a tela escreve
// "R$ 1000 mil", que não é como ninguém fala nem lê.
function brlCurto(n){
  var v = Number(n)||0;
  var mil = Math.round(v/1000);
  if(Math.abs(mil) >= 1000) return 'R$ ' + (v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi';
  if(Math.abs(v) >= 10000)  return 'R$ ' + mil + ' mil';
  return brl(v);
}
function pct(n,casas){
  var v = Number(n)||0;
  return v.toLocaleString('pt-BR',{maximumFractionDigits:(casas==null?0:casas)}) + '%';
}
/* Lê dinheiro digitado à mão e devolve número.

   O PONTO É AMBÍGUO EM PORTUGUÊS e essa ambiguidade já corrompeu valor
   aqui: "3.500" pode ser três mil e quinhentos (milhar, que é como todo
   mundo escreve) ou três e meio (decimal do jeito americano). Sem
   desfazer isso, uma cota de R$ 180.000 digitada como "180.000" entrava
   no banco como R$ 180, calada, e "1.200.000" virava zero.

   A regra que desfaz, na ordem:
     1. Tem vírgula? Então a vírgula é o decimal e todo ponto é milhar.
        É o padrão brasileiro escrito por extenso: "3.500,00".
     2. Não tem vírgula, mas os pontos separam grupos de exatamente três
        dígitos? Só pode ser milhar: "3.500", "1.200.000".
     3. Qualquer outro caso, o ponto é decimal: "3.5", "0.75".
   Dinheiro neste sistema é sempre inteiro em reais, sem centavo (seção
   2.2 do SPEC), mas esta função também lê porcentagem, então ela devolve
   o número cru e quem chama arredonda.                                 */
function lerValor(s){
  if(typeof s === 'number') return isNaN(s) ? 0 : s;
  var t = String(s||'').replace(/[^\d,.-]/g,'').trim();
  if(!t) return 0;
  if(t.indexOf(',') > -1){
    t = t.replace(/\./g,'').replace(',','.');
  } else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)){
    t = t.replace(/\./g,'');
  }
  var n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}

/* ---------------------------------------------------------------------
   DATA
   Tudo guardado como "AAAA-MM-DD" (texto), nunca como Date nem Timestamp.
   Motivo: texto ordena sozinho, compara com >= e <=, não tem fuso e não
   vira "ontem" quando o celular está em outro fuso. Data e hora de
   registro guardam o ISO completo.
   --------------------------------------------------------------------- */

function hojeISO(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function agoraISO(){ return new Date().toISOString(); }
function pad2(n){ return (n<10?'0':'') + n; }

// "2026-09-10" -> "10/09/2026"
function dataBR(iso){
  if(!iso) return '';
  var p = String(iso).slice(0,10).split('-');
  if(p.length !== 3) return String(iso);
  return p[2] + '/' + p[1] + '/' + p[0];
}
// "2026-09-10" -> "10 set"
var MESES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS_SEMANA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function dataCurta(iso){
  if(!iso) return '';
  var p = String(iso).slice(0,10).split('-');
  if(p.length !== 3) return String(iso);
  var m = MESES_CURTO[Number(p[1])-1];
  // Mês fora de 1 a 12 (importação torta, data digitada em outro formato)
  // escrevia "1 undefined" no cartão. Melhor devolver o texto cru, que
  // pelo menos deixa a pessoa ver o que está gravado e consertar.
  if(!m) return String(iso).slice(0,10);
  return Number(p[2]) + ' ' + m;
}
// Data por extenso com dia da semana, do jeito que a casa escreve:
// "quinta, 10 de setembro de 2026". Nunca "essa quinta".
function dataExtenso(iso){
  if(!iso) return '';
  var d = dataDe(iso);
  if(!d) return String(iso);
  return DIAS_SEMANA[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
}
// Constrói Date local a partir de "AAAA-MM-DD" sem passar pelo parser de
// ISO do navegador, que trata como UTC e joga pro dia anterior no Brasil.
function dataDe(iso){
  if(!iso) return null;
  var p = String(iso).slice(0,10).split('-');
  if(p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
// Diferença em dias inteiros. Positivo = b depois de a.
function diasEntre(isoA, isoB){
  var a = dataDe(isoA), b = dataDe(isoB||hojeISO());
  if(!a || !b) return 0;
  return Math.round((b - a) / 86400000);
}
function somaDias(iso, n){
  var d = dataDe(iso);
  if(!d) return iso;
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
// "2026-09" do mês de uma data
function mesDe(iso){ return String(iso||'').slice(0,7); }
function mesAtual(){ return hojeISO().slice(0,7); }
function mesBR(ym){
  var p = String(ym||'').split('-');
  if(p.length < 2) return String(ym||'');
  var m = MESES_CURTO[Number(p[1])-1];
  if(!m) return String(ym||'');           // nunca escrever "undefined/26" no painel
  return m + '/' + String(p[0]).slice(2);
}
// "há 3 dias", "hoje", "em 5 dias". Usado na linha do tempo e nos alertas.
function quando(iso){
  if(!iso) return '';
  // Data que não da pra ler devolvia "hoje", porque diasEntre responde 0
  // quando não consegue montar a Date. Ou seja, a fila do dia dizia que
  // um próximo passo com data estragada era pra hoje. Mentir a favor da
  // urgência é pior do que não dizer nada.
  if(!dataDe(iso)) return '';
  var d = diasEntre(iso, hojeISO());
  if(d === 0) return 'hoje';
  if(d === 1) return 'ontem';
  if(d === -1) return 'amanhã';
  if(d > 1)  return 'há ' + d + ' dias';
  return 'em ' + Math.abs(d) + ' dias';
}

/* ---------------------------------------------------------------------
   TELEFONE E WHATSAPP
   O comercial vive no WhatsApp. O número é guardado só com dígito, e a
   tela mostra formatado. Link wa.me exige 55 na frente e nada mais.
   --------------------------------------------------------------------- */

function soDigito(s){ return String(s||'').replace(/\D/g,''); }

function foneBR(s){
  var d = soDigito(s);
  if(d.length === 13 && d.slice(0,2) === '55') d = d.slice(2);
  if(d.length === 12 && d.slice(0,2) === '55') d = d.slice(2);
  if(d.length === 11) return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
  if(d.length === 10) return '(' + d.slice(0,2) + ') ' + d.slice(2,6) + '-' + d.slice(6);
  return s || '';
}
/* Devolve o link wa.me ou vazio se o número não dá pra usar.

   O DDI só pode ser decidido pelo TAMANHO, nunca pelos dois primeiros
   dígitos: 55 também é DDD de verdade (Santa Maria e toda a região
   central do Rio Grande do Sul). Olhando só o prefixo, o número
   (55) 3333-4444 virava wa.me/5533334444, que é um telefone de 10
   dígitos sem país nenhum, e o WhatsApp abre em contato inexistente.
   Até 11 dígitos é número nacional e leva o 55 na frente; 12 ou 13
   dígitos já vêm com DDI e ficam como estão.                         */
function linkWhats(fone, texto){
  var d = soDigito(fone);
  if(d.length < 10 || d.length > 13) return '';   // acima de 13 é sujeira, não telefone
  if(d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + (texto ? '?text=' + encodeURIComponent(texto) : '');
}

/* ---------------------------------------------------------------------
   IDENTIFICADOR
   Sem Math.random por hábito da casa (quebra em ambiente determinista) e
   sem depender do relógio do celular estar certo. Contador + carimbo.
   --------------------------------------------------------------------- */
var _seq = 0;
function novoId(prefixo){
  _seq++;
  var t = Date.now().toString(36);
  var c = _seq.toString(36);
  var e = (typeof crypto !== 'undefined' && crypto.getRandomValues)
    ? crypto.getRandomValues(new Uint32Array(1))[0].toString(36)
    : c;
  return (prefixo||'x') + '_' + t + c + e.slice(0,4);
}

// Chave de busca: tira acento e caixa, pra "Móvel" achar com "movel".
function chave(s){
  return String(s||'')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().trim();
}
// Iniciais pro avatar: "Suhai Seguros" -> "SS"
function iniciais(nome){
  var p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  if(p.length === 1) return p[0].slice(0,2).toUpperCase();
  return (p[0][0] + p[p.length-1][0]).toUpperCase();
}

/* ---------------------------------------------------------------------
   AVISO NA TELA
   --------------------------------------------------------------------- */
function toast(msg, tipo){
  var w = document.getElementById('toasts');
  if(!w){
    w = document.createElement('div');
    w.id = 'toasts'; w.className = 'toast-wrap';
    document.body.appendChild(w);
  }
  var t = document.createElement('div');
  t.className = 'toast' + (tipo ? ' ' + tipo : '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.transition = 'opacity .25s';
    t.style.opacity = '0';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 260);
  }, tipo === 'bad' ? 4200 : 2600);
}

/* ---------------------------------------------------------------------
   GUARDAR NO APARELHO
   Serve de cache do Firestore e de rascunho. Sempre dentro de try, porque
   em aba anônima do Safari o localStorage existe mas estoura ao gravar.
   --------------------------------------------------------------------- */
var LS_PREFIXO = 'crmlime.';
function guardar(chaveNome, valor){
  try{ localStorage.setItem(LS_PREFIXO + chaveNome, JSON.stringify(valor)); return true; }
  catch(e){ return false; }
}
function recuperar(chaveNome, padrao){
  try{
    var s = localStorage.getItem(LS_PREFIXO + chaveNome);
    if(s == null) return padrao;
    return JSON.parse(s);
  }catch(e){ return padrao; }
}
function esquecer(chaveNome){
  try{ localStorage.removeItem(LS_PREFIXO + chaveNome); }catch(e){}
}

   Banco, cache, sincronismo, fila de gravação offline e permissão.

   ANTES DE MAIS NADA, O TAMANHO REAL DO PROBLEMA HOJE: o projeto está no
   plano BLAZE, com crédito do Google. O teto rígido de 50 mil leituras
   por dia só existe no plano gratuito, e foi ele que derrubou a Central
   em 18/08/2026. No Blaze não há teto: as primeiras 50 mil do dia são

   Então gastar leitura HOJE não derruba nada, só custa pouco dinheiro.

   Por que o desenho econômico continua valendo mesmo assim:
     a) velocidade no celular. Escuta em coleção recarrega a coleção
        inteira a cada abertura de página, e no 4G isso se sente.
     b) o banco é aberto. Sem autenticação de verdade, quem tem o

        o teto rígido volta, e volta compartilhado com a Central.

   As sete regras:
     1. Zero onSnapshot. Tudo get().
     2. Sincronismo por delta no campo "at", com 5 min de folga, e "at"
        sempre serverTimestamp (celular adiantado cegaria o delta calado).
     3. Atividade só é lida ao abrir o negócio, com limit(10).
     4. Re-sync no foco com teto duro: 1 a cada 30 min, 8 por dia.
     5. Relatório, semáforo, ranking, previsão e busca são aritmética

   ===================================================================== */

// sinal invertido dependendo da ordem e faz TODO negócio em dia nascer
// vermelho no primeiro dia de uso.
function diasVencido(dataISO){
  if(!dataISO) return 0;
  return diasEntre(dataISO, hojeISO());
}
function idNovo(p){ return novoId(p); }
function idAtiv(){
  // carimbo invertido: a ordem alfabética do id do documento já é do mais
  // novo pro mais velho, então a timeline não precisa de índice composto.
  return "a_" + (9999999999999 - Date.now()) + Math.random().toString(36).slice(2,4);
}
function mediana(arr){
  var a = (arr||[]).filter(function(x){ return typeof x === "number" && !isNaN(x); })
                   .sort(function(x,y){ return x-y; });
  if(!a.length) return 0;
  var m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : Math.round((a[m-1]+a[m])/2);
}
function lista(col){
  var o = BASE[col] || {}, r = [];
  for(var k in o) if(Object.prototype.hasOwnProperty.call(o,k) && !o[k].arquivado) r.push(o[k]);
  return r;
}
function achar(col, id){ return (BASE[col] && BASE[col][id]) || null; }

function idxEstagio(n){
  var f = FUNIL[n.tipo] || [];
  for(var i=0;i<f.length;i++) if(f[i].k === n.estagio) return i;
  return 0;
}
/* Estágio que não pertence ao funil do negócio NÃO pode virar o estágio
   zero. idxEstagio devolve 0 quando não acha, que é o certo pra ordenar,
   mas usar esse 0 aqui fazia um negócio de agência parado num estágio
   "pt_" aparecer como "Contato", com o teto de 7 dias do Contato, calado.
   O SPEC (seção 4) pede o contrário: aparecer como estágio desconhecido,
   pra alguém consertar o dado em vez de acreditar na coluna errada. */
function estagioDe(n){
  var f = FUNIL[(n && n.tipo)] || [];
  for(var i=0;i<f.length;i++) if(f[i].k === (n && n.estagio)) return f[i];
  return { k:(n && n.estagio) || "", rot:"Estágio desconhecido", p:0, teto:30, saida:"" };
}
function edicaoDe(k){
  for(var i=0;i<EDICOES.length;i++) if(EDICOES[i].k === k) return EDICOES[i];
  return null;
}

  for(var i=0;i<ORIGENS.length;i++) if(ORIGENS[i][0] === k) return ORIGENS[i][1];
  return k || "";
}
function motivoPerdaDe(k){
  for(var i=0;i<MOTIVOS_PERDA.length;i++) if(MOTIVOS_PERDA[i].k === k) return MOTIVOS_PERDA[i];
  return null;
}
function proxTipoDe(k){
  for(var i=0;i<PROX_TIPOS.length;i++) if(PROX_TIPOS[i].k === k) return PROX_TIPOS[i];
  return null;
}
function tipoAtivDe(k){
  for(var i=0;i<TIPOS_ATIV.length;i++) if(TIPOS_ATIV[i].k === k) return TIPOS_ATIV[i];

/* ---------------------------------------------------------------------
   VALOR
   Uma função só, chamada em todo ponto de escrita. valorRef é o ÚNICO
   campo derivado que fica gravado, porque ordenar e somar o funil não
   pode depender de ler documento nenhum.
   --------------------------------------------------------------------- */
function mrrDe(n){                                   // R$/mês que a Lime fatura
  if(!n || n.tipo !== "agencia" || !n.ag) return 0;
  return Math.round((n.ag.mrr||0) + (n.ag.verbaMidia||0) * ((n.ag.pctVerba||0)/100));
}
function valorRefDe(n){                              // R$ do negócio, pra ordenar e listar
  if(!n) return 0;
  if(n.tipo === "patrocinio") return Math.round((n.pt && n.pt.valor) || 0);  // permuta fica fora
  return Math.round(mrrDe(n) * (((n.ag && n.ag.meses)||0) || 12));           // indeterminado conta 12
}
// Valor usado só pra ORDENAR. Negócio sem valor não pode afundar pro fim.
function valorOrdem(n){
  var v = valorRefDe(n);
  return v > 0 ? v : (VALOR_PRESUMIDO[n.tipo] || 0);
}

/* ---------------------------------------------------------------------
   SEMÁFORO
   --------------------------------------------------------------------- */
// Tolerância de silêncio do funil do negócio. Tipo que não existe em
// TOQUE (dado velho, importação torta) derrubava a tela Hoje inteira num
// TypeError, e um negócio estragado não pode levar a fila do dia junto.
function toqueDe(tipo){ return TOQUE[tipo] || { normal:5, ultimo:3 }; }

function temperatura(n){
  if(!n || n.status !== "aberto") return "fechado";
  if(n.congeladoAte && n.congeladoAte > hojeISO()) return "congelado";
  var f = FUNIL[n.tipo] || [], i = idxEstagio(n), e = f[i] || { teto:30 };
  var venc   = diasVencido(n.proxData);
  var silen  = diasVencido(n.ultimoToqueEm);
  var parado = diasVencido(n.estagioDesde);
  var limToque = (i === f.length-1) ? toqueDe(n.tipo).ultimo : toqueDe(n.tipo).normal;
  // O vermelho de estágio parado vem ANTES do amarelo de "sem próximo
  // passo". Na ordem antiga, o negócio sem plano nenhum saía amarelo
  // mesmo com 40 dias num estágio de teto 7, ou seja, justo o mais
  // abandonado do funil era o que a tela pintava de mais brando.
  if(venc >= 1)              return "vermelho";
  if(parado > e.teto*1.5)    return "vermelho";
  if(!n.proxData)            return "amarelo";       // sem plano é alerta, não verde
  if(venc >= -1)             return "amarelo";       // vence hoje ou amanhã
  if(parado > e.teto)        return "amarelo";
  if(silen > limToque)       return "amarelo";
  return "verde";
}
// Explica o semáforo com o NÚMERO. Alerta sem motivo explícito é treinado
// a ser ignorado em uma semana.
function porQue(n){
  if(n.status !== "aberto") return "";
  if(n.congeladoAte && n.congeladoAte > hojeISO())
    return "congelado até " + dataBR(n.congeladoAte);
  var f = FUNIL[n.tipo] || [], i = idxEstagio(n), e = f[i] || { teto:30, rot:"" };
  var venc = diasVencido(n.proxData), silen = diasVencido(n.ultimoToqueEm), parado = diasVencido(n.estagioDesde);
  var limToque = (i === f.length-1) ? toqueDe(n.tipo).ultimo : toqueDe(n.tipo).normal;
  // Mesma ordem de temperatura(), senão o semáforo fica vermelho por
  // estágio parado e a frase embaixo dele fala de outra coisa.
  if(venc >= 1)   return (proxTipoDe(n.proxTipo) ? proxTipoDe(n.proxTipo).rot : "próximo passo")
                        + ", venceu há " + venc + (venc===1?" dia":" dias");
  if(parado > e.teto*1.5)
    return parado + " dias em " + (e.rot || "um estágio que não é deste funil") + ", o limite é " + e.teto;
  if(!n.proxData) return "sem próximo passo marcado";
  if(venc === 0)  return (proxTipoDe(n.proxTipo) ? proxTipoDe(n.proxTipo).rot : "próximo passo")
                        + " hoje" + (n.proxHora ? ", " + n.proxHora : "");
  if(venc === -1) return (proxTipoDe(n.proxTipo) ? proxTipoDe(n.proxTipo).rot : "próximo passo") + " amanhã";
  if(parado > e.teto)
    return parado + " dias em " + e.rot + ", o limite é " + e.teto;
  if(silen > limToque)
    return silen + " dias sem contato, o limite em " + e.rot + " é " + limToque;
  return (proxTipoDe(n.proxTipo) ? proxTipoDe(n.proxTipo).rot : "próximo passo") + " em " + dataCurta(n.proxData);
}
function riscoAlto(n){                               // só a previsão usa
  if(!n || n.status !== "aberto") return false;
  var e = estagioDe(n);
  return diasVencido(n.proxData) >= 7
      || (n.vezesAdiado||0) >= ADIAMENTOS_PARA_RISCO
      || diasVencido(n.estagioDesde) > e.teto*2;
}

/* ---------------------------------------------------------------------
   QUEM TOCA O NEGOCIO

   O time tem dois papeis: quem CAPTA (o SDR, que prospecta e qualifica) e
   quem FECHA (o closer, que monta a proposta e negocia). O mesmo negocio
   passa pelas duas maos, e a passagem tem hora marcada em passadoEm.

   POR QUE DOIS CAMPOS, E NAO UM "RESPONSAVEL"
   Com um campo so, a passagem sobrescreve o nome do SDR e apaga o
   trabalho dele. No fim do mes ninguem consegue responder quantos leads
   o SDR trouxe, porque todo negocio fechado esta no nome do closer. Os
   dois campos ficam, e passadoEm diz qual dos dois esta com a bola AGORA.

   POR QUE A PASSAGEM NAO TEM ESTAGIO FIXO
   Foi escolha da casa: o SDR passa quando achar que o lead esta pronto,
   em qualquer etapa. Em troca, o sistema grava em que estagio a passagem
   aconteceu (passadoNoEstagio), senao nao daria pra comparar um mes com o
   outro nem perceber que alguem comecou a passar cedo demais.

   Negocio antigo, cadastrado antes disso existir, nao tem nenhum dos
   campos: ele cai em "o time todo" e continua aparecendo pra todo mundo,
   em vez de sumir da fila de todo mundo. */
function donoDe(n){
  if(!n) return { id:"", nome:"", papel:"time" };
  if(n.passadoEm && (n.fechaId || n.fechaNome))
    return { id:n.fechaId || "", nome:n.fechaNome || "", papel:"closer" };
  if(n.captouId || n.captouNome)
    return { id:n.captouId || "", nome:n.captouNome || "", papel:"sdr" };
  return { id:"", nome:"", papel:"time" };
}
/* Verdadeiro pro negocio que ainda nao foi passado E tem um SDR no nome. */
function esperandoPassagem(n){
  return !!n && !n.passadoEm && !!(n.captouId || n.captouNome);
}
/* Esse negocio e meu? Negocio sem dono e de todo mundo, senao ele some da
   fila de todos e vira o negocio que ninguem trabalha. */
function meuNegocio(n){
  var d = donoDe(n);
  if(d.papel === "time") return true;
  if(!SESSAO) return false;
  if(d.id && SESSAO.acessoId) return d.id === SESSAO.acessoId;
  return !!d.nome && chave(d.nome) === chave(SESSAO.nome || "");
}
function souSdr(){   return !!SESSAO && SESSAO.perfil === "sdr"; }
function souCloser(){ return !!SESSAO && SESSAO.perfil === "closer"; }

// Devolve null quando pode, ou o TEXTO do motivo quando não pode. O mesmo
// texto vai pro toast do bloqueio e pra linha cinza embaixo do botão,
// então a tela e o bloqueio nunca discordam.
// Coleção não listada aqui nasce FECHADA.
function motivoBloqueio(colecao, doc){
  if(!SESSAO || !PERM) return "Sessão encerrada. Entre de novo.";
  if(colecao === "crm_negocios") return podeEditarNegocios() ? null : "Seu acesso é só de leitura.";
  if(colecao === "crm_contatos") return podeEditarContatos() ? null : "Seu acesso é só de leitura.";
  if(colecao === "crm_tarefas")  return podeEditarNegocios() ? null : "Seu acesso é só de leitura.";
  if(colecao === "crm_atividades"){
    if(podeRegistrarTudo()) return null;
    if(podeRegistrarNota() && doc && doc.tipo === "nota") return null;
    return "Seu acesso registra só nota.";
  }
  if(colecao === "crm_config")  return podeMexerMeta() ? null : "Seu acesso é só de leitura.";
  if(colecao === "crm_acessos") return ehAdmin() ? null : "Só o Admin mexe em acessos.";
  return "Coleção fora do CRM.";
}

/* ---------------------------------------------------------------------
   CACHE LOCAL
   Cache é conveniência e NUNCA pode ser caminho de falha: todo acesso
   dentro de try, e QuotaExceededError joga fora a timeline e tenta uma
   vez antes de desistir e rodar sem cache.
   --------------------------------------------------------------------- */
var CACHE_SEM = false;   // true = o aparelho recusou o armazenamento

function salvarCache(){
  if(CACHE_SEM) return;
  var ok = guardar("base", { v:1, sync:SYNC.ultimo, base:BASE });
  if(!ok){
    TIMELINE = {};
    esquecer("timeline");
    ok = guardar("base", { v:1, sync:SYNC.ultimo, base:BASE });
    if(!ok){ CACHE_SEM = true; avisoBarra("O aparelho não deixou guardar dado local. Tudo funciona, mas cada abertura vai buscar do zero."); }
  }
}
function carregarCache(){
  var c = recuperar("base", null);
  if(c && c.base && c.v === 1){
    BASE = { negocios:c.base.negocios||{}, contatos:c.base.contatos||{},
             tarefas:c.base.tarefas||{},  config:c.base.config||{} };
    SYNC.ultimo = c.sync || 0;
    return true;
  }
  return false;
}
function aplicarNoCache(colecao, id, dados){
  var m = { crm_negocios:"negocios", crm_contatos:"contatos",
            crm_tarefas:"tarefas", crm_config:"config" }[colecao];
  if(!m) return;
  var atual = BASE[m][id] || {};
  var novo = {};
  for(var k in atual) if(Object.prototype.hasOwnProperty.call(atual,k)) novo[k] = atual[k];
  for(var j in dados) if(Object.prototype.hasOwnProperty.call(dados,j)) novo[j] = dados[j];
  novo.id = id;
  novo.at = Date.now();        // otimista; o delta corrige com o do servidor
  BASE[m][id] = novo;
  salvarCache();
}

/* ---------------------------------------------------------------------
   FILA DE GRAVAÇÃO (outbox)
   Sem enablePersistence de propósito. Com persistência ligada a tela diz
   "salvo" antes de o servidor confirmar, e o iOS descarrega a aba no
   bolso levando a escrita junto. Aqui a fila é explícita e a tela
   consegue dizer "3 esperando internet" em vez de mentir.
   --------------------------------------------------------------------- */
var OUTBOX = recuperar("outbox", []);
var PENDENTES = {};          // id -> true, pro selo "não enviado" na tela

function paraOutbox(colecao, id, dados, erro){
  // FieldValue não sobrevive ao JSON. Guarda sem o carimbo e recria no envio.
  var copia = {};
  for(var k in dados) if(Object.prototype.hasOwnProperty.call(dados,k) && k !== "at") copia[k] = dados[k];
  OUTBOX = OUTBOX.filter(function(o){ return !(o.colecao === colecao && o.id === id); });
  OUTBOX.push({ colecao:colecao, id:id, dados:copia, erro:(erro && erro.code)||"", em:agoraISO() });
  guardar("outbox", OUTBOX);
  PENDENTES[id] = true;
  pintarSync();
}
function marcarEnviado(colecao, id){
  OUTBOX = OUTBOX.filter(function(o){ return !(o.colecao === colecao && o.id === id); });
  guardar("outbox", OUTBOX);
  delete PENDENTES[id];
  pintarSync();
}
function esvaziarOutbox(){
  if(!FB_ON || !AUTH_OK || !OUTBOX.length) return Promise.resolve(0);
  var fila = OUTBOX.slice(0), enviados = 0;
  return fila.reduce(function(p, o){
    return p.then(function(){
      var d = {};
      for(var k in o.dados) if(Object.prototype.hasOwnProperty.call(o.dados,k)) d[k] = o.dados[k];
      d.at = CARIMBO();
      return db.collection(o.colecao).doc(o.id).set(d, {merge:true})
        .then(function(){ marcarEnviado(o.colecao, o.id); enviados++; })
        .catch(function(){ /* fica na fila pra próxima */ });
    });
  }, Promise.resolve()).then(function(){
    if(enviados) toast(enviados === 1 ? "1 registro subiu" : enviados + " registros subiram", "ok");
    return enviados;
  });
}

/* ---------------------------------------------------------------------
   A ÚNICA PORTA DE ESCRITA DO SISTEMA
   Toda escrita passa por aqui. Quem escrever direto no db some do cache,
   fura a permissão e não entra na fila offline.
   --------------------------------------------------------------------- */
function gravar(colecao, id, dados){
  var motivo = motivoBloqueio(colecao, dados);
  if(motivo){ toast(motivo, "bad"); return Promise.reject(new Error(motivo)); }

  // O Firestore RESERVA todo id que casa com __alguma_coisa__, e recusa a
  // gravação com "Resource id is invalid because it is reserved", que na
  // tela não explica nada. Já mordeu duas vezes nesta casa: a migração do
  // conteúdo em agosto de 2026, e o acesso de recuperação em setembro.
  // Barrar aqui transforma um erro do banco num erro nosso, com nome.
  // A barra entra junto porque o Firestore lê "a/b" como caminho de
  // subcoleção e recusa o documento com outro erro sem nome na tela.
  if(!id || /^__.*__$/.test(String(id)) || String(id).indexOf("/") > -1){
    var m = !id ? "Tentei gravar sem identificador."
                : String(id).indexOf("/") > -1
                  ? 'O identificador "' + id + '" tem barra, e barra o banco lê como caminho.'
                  : 'O identificador "' + id + '" é reservado pelo banco e não pode ser usado.';
    console.error(m + " colecao: " + colecao);
    toast(m, "bad");
    return Promise.reject(new Error(m));
  }

  if(SESSAO) dados.alteradoPor = SESSAO.nome;

  // Nenhuma chave com ponto: set() não interpreta caminho de campo, cria
  // campo de nome literal na raiz e faz a regra recusar toda gravação
  // futura daquele documento.
  for(var k in dados){
    if(Object.prototype.hasOwnProperty.call(dados,k) && k.indexOf(".") > -1){
      console.error("chave com ponto em " + colecao + ": " + k);
      delete dados[k];
    }
  }

  aplicarNoCache(colecao, id, dados);          // a tela muda na hora
  if(typeof redesenhar === "function") redesenhar();

  if(!FB_ON || !AUTH_OK){
    paraOutbox(colecao, id, dados, { code:"sem-banco" });
    return Promise.resolve();                   // modo local: não é erro
  }

  var env = {};
  for(var j in dados) if(Object.prototype.hasOwnProperty.call(dados,j)) env[j] = dados[j];
  env.at = CARIMBO();

  return db.collection(colecao).doc(id).set(env, {merge:true})
    .then(function(){ marcarEnviado(colecao, id); })
    .catch(function(e){
      paraOutbox(colecao, id, dados, e);
      explicarErro(e);
      throw e;
    });
}

// As três mensagens são diferentes de propósito. Em 18/08/2026 todo mundo
// achou que era sinal ruim enquanto era cota de leitura estourada.
function explicarErro(e){
  var c = (e && e.code) || "";
  SYNC.falhou = c;
  if(c === "resource-exhausted"){
    avisoBarra("O limite diário do banco foi atingido. Nada se perdeu, mas nada novo sobe até amanhã.");
  } else if(c === "permission-denied"){
    avisoBarra("A gravação foi recusada pela regra do banco. A tela mostra a última versão salva.");
  } else if(c === "unavailable" || !navigator.onLine){
    avisoBarra("Sem conexão. O que você registrar fica guardado no aparelho e sobe sozinho quando voltar.");
  } else {
    avisoBarra("Não deu pra salvar agora: " + (c || "erro desconhecido") + ". O registro ficou guardado no aparelho.");
  }
  pintarSync();
}

/* ---------------------------------------------------------------------
   SINCRONISMO POR DELTA
   Pede só o que mudou desde a última vez. Uma consulta que não devolve
   nada custa 1 leitura. Nada é apagado de verdade: exclusão é
   arquivado:true, que é escrita e portanto viaja no delta. Delete físico
   sumiria do delta e deixaria o cache mentindo pra sempre.
   --------------------------------------------------------------------- */
var COLECOES_SYNC = [
  { col:"crm_negocios", campo:"negocios" },
  { col:"crm_contatos", campo:"contatos" },
  { col:"crm_tarefas",  campo:"tarefas"  }
];

function podeSincronizar(){
  if(!FB_ON || !AUTH_OK) return false;
  var t = recuperar("syncTeto", { dia:"", n:0, ultimo:0 });
  var hoje = hojeISO();
  if(t.dia !== hoje){ t = { dia:hoje, n:0, ultimo:0 }; }
  if(t.n >= SYNC_MAX_DIA) return false;
  if(Date.now() - (t.ultimo||0) < SYNC_MIN_MINUTOS*60*1000) return false;
  return true;
}
function marcarSincronizou(){
  var t = recuperar("syncTeto", { dia:"", n:0, ultimo:0 });
  var hoje = hojeISO();
  if(t.dia !== hoje) t = { dia:hoje, n:0, ultimo:0 };
  t.n++; t.ultimo = Date.now();
  guardar("syncTeto", t);
}

function sincronizar(forcado){
  if(!FB_ON || !AUTH_OK) return Promise.resolve(false);
  if(SYNC.emCurso) return Promise.resolve(false);
  if(!forcado && !podeSincronizar()) return Promise.resolve(false);

  SYNC.emCurso = true; pintarSync();
  var desde = SYNC.ultimo ? SYNC.ultimo - MARGEM_DELTA_MS : 0;
  var maior = SYNC.ultimo;

  var jobs = COLECOES_SYNC.map(function(c){
    var q = db.collection(c.col);
    if(desde > 0) q = q.where("at", ">", firebase.firestore.Timestamp.fromMillis(desde));
    return q.get().then(function(snap){
      SYNC.lidas += Math.max(snap.size, 1);   // consulta vazia ainda custa 1
      snap.forEach(function(d){
        var o = d.data(); o.id = d.id;
        o.at = (o.at && o.at.toMillis) ? o.at.toMillis() : (o.at || Date.now());
        if(o.at > maior) maior = o.at;
        BASE[c.campo][d.id] = o;
      });
    });
  });

  jobs.push(
    db.collection("crm_config").doc("geral").get().then(function(d){
      SYNC.lidas += 1;
      if(d.exists){
        var o = d.data();
        o.at = (o.at && o.at.toMillis) ? o.at.toMillis() : Date.now();
        BASE.config = o;
      }
    })
  );

  return Promise.all(jobs).then(function(){
    SYNC.ultimo = maior || Date.now();
    SYNC.emCurso = false; SYNC.falhou = null;
    marcarSincronizou(); salvarCache(); guardar("lidas", SYNC.lidas);
    pintarSync();
    if(typeof redesenhar === "function") redesenhar();
    return true;
  }).catch(function(e){
    SYNC.emCurso = false;
    explicarErro(e);
    return false;
  });
}

/* Timeline: única leitura por clique do sistema, e só quando o negócio é
   aberto pela primeira vez ou mudou desde a última vez que foi lido. */
function carregarTimeline(negocioId, tudo){
  var n = achar("negocios", negocioId);
  var cache = TIMELINE[negocioId];
  if(!tudo && cache && n && cache.at >= (n.at||0)) return Promise.resolve(cache.itens);
  if(!FB_ON || !AUTH_OK) return Promise.resolve((cache && cache.itens) || []);

  var lim = tudo ? TIMELINE_PAGINA*3 : TIMELINE_PAGINA;
  return db.collection("crm_atividades")
    .where("negocioId","==",negocioId)
    .orderBy(firebase.firestore.FieldPath.documentId())
    .limit(lim).get()
    .then(function(snap){
      SYNC.lidas += Math.max(snap.size,1); guardar("lidas", SYNC.lidas);
      var itens = [];
      snap.forEach(function(d){ var o = d.data(); o.id = d.id; itens.push(o); });
      itens.sort(function(a,b){
        if(a.quando !== b.quando) return a.quando < b.quando ? 1 : -1;
        return (b.ts||0) - (a.ts||0);
      });
      TIMELINE[negocioId] = { at:(n && n.at) || Date.now(), itens:itens, completa:snap.size < lim };
      return itens;
    })
    .catch(function(e){ explicarErro(e); return (cache && cache.itens) || []; });
}
// Põe na timeline local sem ir ao banco. Usado logo depois de registrar.
function empurrarTimeline(negocioId, ativ){
  if(!TIMELINE[negocioId]) TIMELINE[negocioId] = { at:0, itens:[], completa:false };
  TIMELINE[negocioId].itens.unshift(ativ);
  TIMELINE[negocioId].at = Date.now();
}

/* ---------------------------------------------------------------------
   CARGA FRIA
   Aparelho novo, cache limpo, ou Safari que descartou o armazenamento
   depois de 7 dias sem uso. Cerca de 260 leituras, algumas vezes por mês.
   É o preço de não ter documento-índice único, e está no orçamento.
   --------------------------------------------------------------------- */
function cargaFria(){
  if(!FB_ON || !AUTH_OK) return Promise.resolve(false);
  var maior = 0;
  var jobs = COLECOES_SYNC.map(function(c){
    var q = db.collection(c.col);
    if(c.col === "crm_tarefas") q = q.where("feita","==",false).limit(60);
    return q.get().then(function(snap){
      SYNC.lidas += Math.max(snap.size,1);
      snap.forEach(function(d){
        var o = d.data(); o.id = d.id;
        o.at = (o.at && o.at.toMillis) ? o.at.toMillis() : Date.now();
        if(o.at > maior) maior = o.at;
        BASE[c.campo][d.id] = o;
      });
    });
  });
  jobs.push(db.collection("crm_config").doc("geral").get().then(function(d){
    SYNC.lidas += 1;
    if(d.exists){ var o = d.data(); o.at = Date.now(); BASE.config = o; }
  }));
  return Promise.all(jobs).then(function(){
    SYNC.ultimo = maior || Date.now();
    marcarSincronizou(); salvarCache(); guardar("lidas", SYNC.lidas);
    return true;
  }).catch(function(e){ explicarErro(e); return false; });
}

/* ---------------------------------------------------------------------
   SENHA
   O que se grava é SHA-256(SAL + senha), nunca a senha. Todo caminho tem
   catch: abrir por file:// ou por IP da rede, que é como se testa antes
   de subir, deixa o crypto.subtle indisponível e o botão Entrar mudo.
   --------------------------------------------------------------------- */
function sha256(txt){
  if(!(window.crypto && crypto.subtle)) return Promise.reject(new Error("sem-crypto"));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(SAL + String(txt||"").trim().toLowerCase()))
    .then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){
        return ("0"+x.toString(16)).slice(-2);
      }).join("");
    });
}
function senhaGerada(){
  var abc = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var out = "", a = new Uint32Array(12);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  for(var i=0;i<12;i++) out += abc[(a[i] || (i*7+3)) % abc.length];
  return out;
}

/* ---------------------------------------------------------------------
   SESSÃO
   7 dias no aparelho, revalidada contra a lista de acessos a cada carga.
   Se a lista vier VAZIA (erro de leitura, regra republicada errada), NÃO
   derruba ninguém: mantém a sessão e avisa no cabeçalho. Derrubar o time
   inteiro por causa de um erro de leitura é pior que o risco que evita.
   --------------------------------------------------------------------- */
function abrirSessao(acesso, porRecuperacao){
  SESSAO = { nome:acesso.nome, perfil:acesso.perfil, acessoId:acesso.id||"",
             entrouEm:Date.now(), recuperacao:!!porRecuperacao };
  PERM = PERFIS[SESSAO.perfil] || null;
  guardar("sessao", SESSAO);
}
function fecharSessao(){
  SESSAO = null; PERM = null;
  esquecer("sessao");
}
function sessaoValida(){
  var s = recuperar("sessao", null);
  if(!s || !s.perfil || !PERFIS[s.perfil]) return null;
  if(Date.now() - (s.entrouEm||0) > SESSAO_DIAS*86400000) return null;
  return s;
}
function carregarAcessos(){
  if(!FB_ON || !AUTH_OK) return Promise.resolve([]);
  return db.collection("crm_acessos").get().then(function(snap){
    SYNC.lidas += Math.max(snap.size,1);
    var r = [];
    snap.forEach(function(d){ var o = d.data(); o.id = d.id; r.push(o); });
    ACESSOS = r;
    return r;
  }).catch(function(e){ explicarErro(e); return []; });
}

/* ---------------------------------------------------------------------
   BOOT DO FIREBASE
   Login anônimo ANTES de qualquer leitura. Custa 0 leitura e derruba
   varredor automático e curl sem token. Não afeta a Central do Evento,
   que tem regras próprias em caminhos próprios.
   --------------------------------------------------------------------- */
function iniciarBanco(){
  FB_ON = !!(window.firebase && firebaseConfig.projectId);
  if(!FB_ON) return Promise.resolve(false);
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    CARIMBO = function(){ return firebase.firestore.FieldValue.serverTimestamp(); };
  }catch(e){ FB_ON = false; return Promise.resolve(false); }

  // SDK de auth que não carregou NÃO é "está tudo certo". Antes isto
  // marcava AUTH_OK = true, e o resultado era um CRM que abria, deixava
  // digitar e recusava toda gravação em silêncio, porque request.auth
  // ficava nulo e a regra negava. A mensagem que explicaria o motivo
  // morava só no catch do signInAnonymously, que nesse caminho nem roda.
  if(!firebase.auth){
    AUTH_OK = false;
    avisoBarra("A parte de login do Firebase não carregou. Recarregue a página. " +
               "Enquanto isso o que você registrar fica guardado neste aparelho.");
    return Promise.resolve(false);
  }

  // Reautenticar sozinho. A sessão anônima pode cair por vários motivos
  // (token revogado, conta apagada no console, aparelho muito tempo com a
  // aba aberta). Sem isso, quem deixa o CRM aberto por semanas começa a
  // levar recusa em toda gravação e não tem como saber por quê.
  firebase.auth().onAuthStateChanged(function(u){
    if(u){ AUTH_OK = true; return; }
    AUTH_OK = false;
    firebase.auth().signInAnonymously().catch(function(e){
      avisoBarra("A sessão com o banco caiu e não consegui refazer (" +
                 ((e&&e.code)||"erro") + "). Recarregue a página.");
      pintarSync();
    });
  });

  return firebase.auth().signInAnonymously()
    .then(function(){ AUTH_OK = true; return true; })
    .catch(function(e){
      AUTH_OK = false;
      avisoBarra("Não consegui entrar no banco (" + ((e&&e.code)||"erro") +
                 "). Verifique se o login Anônimo está ligado no console do Firebase.");
      return false;
    });
}

/* ---------------------------------------------------------------------
   AVISOS DE ESTADO
   A faixa NÃO some sozinha: some quando a pessoa fecha ou quando o

function avisoBarra(txt){
  var el = document.getElementById('faixaAviso');
  if(!el) return;

  el.hidden = false;
}
function limparAviso(){

}
function pintarSync(){
  var el = document.getElementById('pontoSync');
  if(!el) return;
  var n = OUTBOX.length;
  var estado = SYNC.emCurso ? "sync" : (n ? "pend" : (SYNC.falhou ? "erro" : "ok"));
  el.className = "sync sync-" + estado;
  el.title = estado === "sync" ? "buscando novidades"
           : estado === "pend" ? (n + (n===1?" registro":" registros") + " esperando internet")

           : "tudo salvo";
