/* ---------------------------------------------------------------------
   A LISTA POR TRÁS DE CADA NÚMERO
   Uma só função resolve toda chave de lista, pra que a lista aberta nunca
   seja calculada com um critério diferente do número que ela explica.
   --------------------------------------------------------------------- */
function pnlValorModo(n, modo){
  if(modo === "mrr")   return mrrDe(n);
  // O que saiu entra NEGATIVO: a manchete do líquido é novo menos perdido,
  // e um Total que somasse os dois grupos mostraria R$ 7.500/mês embaixo de
  // uma manchete de R$ -500/mês. Número que não fecha derruba a tela toda.
  if(modo === "mrrLiq") return (n.status === "encerrado" ? -mrrDe(n) : mrrDe(n));
  if(modo === "fee")   return (n.ag && n.ag.mrr) || 0;
  if(modo === "verba") return (n.ag && n.ag.verbaMidia) || 0;
  if(modo === "fatia") return mrrDe(n) - ((n.ag && n.ag.mrr) || 0);
  if(modo === "cota")  return (n.pt && n.pt.valor) || 0;
  return valorRefDe(n);
}
function pnlUnidade(modo){
  return (modo === "mrr" || modo === "mrrLiq" || modo === "fee" ||
          modo === "verba" || modo === "fatia") ? "/mês" : "";
}
function pnlFiltra(arr, fn){
  var out = [];
  for(var i = 0; i < arr.length; i++) if(fn(arr[i])) out.push(arr[i]);
  return out;
}

// O parâmetro NÃO se chama "chave": chave() é a função de busca do núcleo.
function pnlListaDef(qual, el){
  var ym = pnlYm();
  var N  = numerosDoMes(ym);
  var S  = pnlSaude(ym);
  var G  = null;
  var tipo = el ? el.getAttribute("data-tipo") : "";
  var k    = el ? el.getAttribute("data-k") : "";
  var idx  = el ? Number(el.getAttribute("data-i")) : 0;
  var mesNome = pnlNomeMes(ym);
  // A mesma nota da coluna Total, palavra por palavra: a lista e o número
  // não podem explicar a mesma soma com duas frases diferentes.
  var notaTotal = PNL_NOTA_TOTAL;

  switch(qual){
    case "carteira":
      return { t:"Carteira ativa", sub:"Contrato de agência ganho e ainda não encerrado. R$/mês que a Lime fatura.",
               itens:N.carteiraItens, modo:"mrr" };
    case "carteiraFee":
      return { t:"Fee contratado", sub:"A parte do MRR que está escrita no contrato, sem a fatia de verba.",
               itens:N.carteiraItens, modo:"fee" };
    case "carteiraVerba":
      return { t:"Estimado sobre a verba", sub:"A fatia de pctVerba sobre a verba de mídia. É estimativa, muda com a verba do mês.",
               itens:N.carteiraItens, modo:"fatia" };
    case "verba":
      return { t:"Verba sob gestão", sub:"Verba do cliente, NÃO é receita da Lime. Aparece só pra dimensionar a operação.",
               itens:N.carteiraItens, modo:"verba" };
    case "novoMrr":
      return { t:"Novo MRR de " + mesNome, sub:"Contratos de agência ganhos no mês, em R$/mês.",
               itens:N.novoMrrItens, modo:"mrr" };
    case "mrrPerdido":
      return { t:"MRR perdido em " + mesNome, sub:"Contratos encerrados no mês. Renovação fica fora: ela vira contrato novo.",
               itens:N.perdidoItens, modo:"mrr" };
    case "perdidoCancel":
      return { t:"Cancelamento em " + mesNome, sub:"Ruptura no meio do contrato: cliente cancelou, a Lime encerrou ou o cliente fechou as portas.",
               itens:pnlFiltra(N.perdidoItens, function(n){ return n.motivoEncerramento !== "fim_natural"; }), modo:"mrr" };
    case "perdidoNaoRenov":
      return { t:"Não renovação em " + mesNome, sub:"Fim natural do contrato sem renovar. A correção é conversar antes, não depois.",
               itens:pnlFiltra(N.perdidoItens, function(n){ return n.motivoEncerramento === "fim_natural"; }), modo:"mrr" };
    case "mrrLiquido":
      return { t:"MRR líquido de " + mesNome,
               sub:"Entrou " + brl(N.novoMrr) + "/mês e saiu " + brl(N.mrrPerdido) +
                   "/mês. O que saiu aparece negativo, então o Total do rodapé é o líquido.",
               itens:N.novoMrrItens.concat(N.perdidoItens), modo:"mrrLiq" };
    case "fechado":
    case "piso":
      return { t:(qual === "piso" ? "Piso de " : "Fechado em ") + mesNome,
               sub:"Já assinado no mês, nos dois funis. " + notaTotal,
               itens:N.fechadoItens, modo:"valor" };
    case "alta":
      return { t:"Alta chance de " + mesNome,
               sub:"Aberto, já passou do estágio em que o comprador se comprometeu, previsto pra este mês com data confirmada, e com plano vivo ou contato nos últimos 10 dias.",
               itens:N.altaChance, modo:"valor" };
    case "altaAg":
      return { t:"Alta chance de agência, MRR em jogo", sub:"R$/mês que entra se estes fecharem.",
               itens:pnlFiltra(N.altaChance, function(n){ return n.tipo === "agencia"; }), modo:"mrr" };
    case "provavel":
      return { t:"Provável de " + mesNome, sub:"Piso mais alta chance. " + notaTotal,
               itens:N.fechadoItens.concat(N.altaChance), modo:"valor" };
    case "limpo":
      return { t:"Provável sem risco alto, " + mesNome,
               sub:"Tira da conta o que está vencido há 7 dias ou mais, adiado 3 vezes ou parado no estágio ao dobro do teto.",
               itens:N.fechadoItens.concat(pnlFiltra(N.altaChance, function(n){ return !riscoAlto(n); })), modo:"valor" };
    case "risco":
      return { t:"Alta chance em risco alto",
               sub:"Estão dentro do Provável, mas apoiados em negócio que ninguém toca. A distância entre Provável e Sem risco alto é exatamente isto.",
               itens:N.riscoItens, modo:"valor" };
    case "fechadoT":
      return { t:"Fechado em " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"", itens:pnlFiltra(N.fechadoItens, function(n){ return n.tipo === tipo; }), modo:"valor" };
    case "altaT":
      return { t:"Alta chance de " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"", itens:pnlFiltra(N.altaChance, function(n){ return n.tipo === tipo; }), modo:"valor" };
    case "provavelT":
      return { t:"Provável de " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"Fechado mais alta chance do funil.",
               itens:pnlFiltra(N.fechadoItens.concat(N.altaChance), function(n){ return n.tipo === tipo; }), modo:"valor" };
    case "limpoT":
      return { t:"Sem risco alto em " + mesNome + ", " + (tipo === "agencia" ? "agencia" : "patrocinio"),
               sub:"", itens:pnlFiltra(N.fechadoItens.concat(N.altaChance), function(n){
                 return n.tipo === tipo && !(n.status === "aberto" && riscoAlto(n));
               }), modo:"valor" };

    case "tocados":
      return { t:"Tocados nos últimos 7 dias", sub:S.naoTocados.length + " abertos ficaram sem contato no período.",
               itens:S.tocados, modo:"valor" };
    case "emDia":
      return { t:"Negócios em dia", sub:"Próximo passo com data no futuro e contato dentro do limite do funil.",
               itens:S.emDia, modo:"valor" };
    case "foraDia":
      return { t:"Negócios fora do dia", sub:"Ou estão sem plano com data, ou passaram do limite de silêncio do funil.",
               itens:S.foraDia, modo:"valor" };
    case "vencidos":
      return { t:"Próximo passo vencido", sub:"O pior está vencido há " + S.piorAtraso + " dias.",
               itens:S.vencidos, modo:"valor" };
    case "concentra":
      return { t:"Abertos previstos pra " + mesNome,
               sub:"Concentracao = o maior dividido pelo total destes " + S.abertosMes.length + " negócios.",
               itens:S.abertosMes, modo:"valor" };

    case "ganhos12":
      G = pnlGanhosPerdas();
      return { t:"Ganhos dos últimos 12 meses", sub:"Denominador da taxa de ganho: " + G.den + " negócios decididos. " + notaTotal,
               itens:G.ganhos, modo:"valor" };
    case "perdas12":
      G = pnlGanhosPerdas();
      return { t:"Perdas reais dos últimos 12 meses", sub:"Sem os desqualificados.", itens:G.perdasReais, modo:"valor" };
    case "foraPerfil":
      G = pnlGanhosPerdas();
      return { t:"Desqualificados nos 12 meses",
               sub:"Ficam fora do denominador da taxa de ganho: contar desqualificação como derrota pune a disciplina de dizer não.",
               itens:G.foraPerfil, modo:"valor" };
    case "motivo":
      G = pnlGanhosPerdas();
      var mp = motivoPerdaDe(k);
      return { t:"Perdidos por: " + (mp ? mp.rot : "sem motivo"), sub:notaTotal,
               itens:pnlFiltra(G.perdasReais, function(n){ return (n.motivoPerda || "sem_motivo") === k; }), modo:"valor" };
    case "conv":
      G = pnlGanhosPerdas();
      var f = FUNIL[tipo] || [];
      var de = f[idx] ? f[idx].rot : "estagio", pa = f[idx+1] ? f[idx+1].rot : "o seguinte";
      return { t:"Chegaram em " + de, sub:"Fechados dos últimos 12 meses que alcançaram este estágio. A conversão mede quantos passaram pra " + pa + ".",
               itens:pnlFiltra(G.fechados, function(n){ return n.tipo === tipo && (n.maiorEstagio || 0) >= idx; }), modo:"valor" };
    case "ticketAg":
      G = pnlGanhosPerdas();
      return { t:"Contratos de agência ganhos, 12 meses", sub:"Valor total de contrato, em R$.",
               itens:pnlFiltra(G.ganhos, function(n){ return n.tipo === "agencia"; }), modo:"valor" };

    case "edVendido":
      var ev = pnlEdicao(k);
      return { t:"Cotas vendidas, " + (ev.ed ? ev.ed.rot : k), sub:"Ganhos da edição. Permuta não entra neste número.",
               itens:ev.vendidos, modo:"cota" };
    case "edAberto":
      var ea = pnlEdicao(k);
      return { t:"Cotas em aberto, " + (ea.ed ? ea.ed.rot : k), sub:"Negócios abertos da edição, no valor proposto de hoje.",
               itens:ea.abertos, modo:"cota" };
  }
  return { t:"Lista", sub:"", itens:[], modo:"valor" };
}

// Segunda linha de cada item: sempre diz o estado com o número, nunca só
// "atrasado". Alerta sem motivo explícito é ignorado em uma semana.
function pnlSub(n){
  var p = [];
  if(n.status === "aberto"){
    p.push(estagioDe(n).rot);
    var pq = porQue(n);
    if(pq) p.push(pq);
  } else if(n.status === "ganho"){
    p.push("Ganho em " + dataBR(n.fechadoEm));
  } else if(n.status === "perdido"){
    var mp = motivoPerdaDe(n.motivoPerda);
    p.push("Perdido em " + dataBR(n.fechadoEm) + (mp ? ", " + mp.rot.toLowerCase() : ""));
  } else if(n.status === "encerrado"){
    var me = "";
    for(var i = 0; i < MOTIVOS_ENCERRAMENTO.length; i++)
      if(MOTIVOS_ENCERRAMENTO[i].k === n.motivoEncerramento) me = MOTIVOS_ENCERRAMENTO[i].rot;
    p.push("Encerrado em " + dataBR(n.encerradoEm) + (me ? ", " + me.toLowerCase() : ""));
  }
  if(n.tipo === "patrocinio" && n.pt && n.pt.edicao){
    var ed = edicaoDe(n.pt.edicao);
    if(ed) p.push(ed.rot);
  }
  return esc(p.join(" · "));
}

function pnlLinhaItem(n, modo){
  var v = pnlValorModo(n, modo);
  return '<button class="search-it" data-a="painelAbrirNegocio" data-id="' + esc(n.id) + '">' +
    '<span style="flex:1;min-width:0">' +
      '<span class="t truncate" style="display:block">' + esc(n.empresa || n.titulo || "sem nome") + '</span>' +
      '<span class="s truncate" style="display:block">' + pnlSub(n) + '</span>' +
    '</span>' +
    '<span class="nowrap" style="font-family:var(--disp);font-weight:800;font-size:16px">' +
      esc(brl(v) + pnlUnidade(modo)) + '</span>' +
  '</button>';
}

ACOES.verLista = function(el){
  var qual = el.getAttribute("data-lista");
  var d = pnlListaDef(qual, el);
  var itens = d.itens || [], i, total = 0;

  // Ordena pelo valor que entra na conta. Negócio sem valor cai pro
  // valorOrdem, senão a indicação fresca fica sempre no fim da lista.
  itens = itens.slice(0).sort(function(a, b){
    var va = pnlValorModo(a, d.modo) || valorOrdem(a);
    var vb = pnlValorModo(b, d.modo) || valorOrdem(b);
    return vb - va;
  });

  var corpo = d.sub ? '<p class="tiny muted" style="margin-bottom:10px">' + esc(d.sub) + '</p>' : "";
  if(!itens.length){
    corpo += '<div class="empty"><div class="ei">∅</div><div class="et">Nenhum negócio nesta conta</div>' +
             '<div class="ex">O número é zero porque a lista está vazia mesmo, não porque faltou dado.</div></div>';
  } else {
    for(i = 0; i < itens.length; i++){
      total += pnlValorModo(itens[i], d.modo);
      corpo += pnlLinhaItem(itens[i], d.modo);
    }
    corpo += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;' +
      'margin-top:10px;padding-top:12px;border-top:1px solid var(--border)">' +
      '<span class="h3" style="margin:0">Total, ' + itens.length + (itens.length === 1 ? ' negócio' : ' negócios') + '</span>' +
      '<span style="font-family:var(--disp);font-weight:900;font-size:22px;color:var(--lime)">' +
        esc(brl(total) + pnlUnidade(d.modo)) + '</span>' +
    '</div>';
  }
  folha(d.t, corpo, '<button class="btn btn-ghost" data-a="fecharFolha">Fechar</button>');
};

// Abrir o negócio pela lista fecha a folha antes de navegar, senão o
// detalhe abre atrás do modal e a pessoa acha que o clique não pegou.
ACOES.painelAbrirNegocio = function(el){

/* ---------------------------------------------------------------------
   META
   Grava em crm_config/geral: metaMrrMes (R$/mês de MRR novo) e metaCota
   (R$ por edição). Duas unidades diferentes, dois campos diferentes,
   nunca somadas nem misturadas num "alvo do mês".
   --------------------------------------------------------------------- */
ACOES.editarMeta = function(){
  var bloqueio = motivoBloqueio("crm_config");
  var c = pnlConfig(), i;
  var h = '<form class="form" data-a="salvarMeta">' +
    // Placeholder sem ponto de milhar. lerValor() hoje já le "5.000" como
    // cinco mil (foi corrigido em 11/09/2026, quando "180.000" entrava no
    // banco como R$ 180), mas o campo devolve o valor salvo sem ponto,
    // então o placeholder segue a mesma grafia que a pessoa vai ver de
    // volta. Coerência entre o que se digita e o que se lê depois.
    '<div class="fld"><label>Meta de MRR novo por mês</label>' +
      '<input class="inp" id="mtMrr" inputmode="numeric" placeholder="5000" value="' +
        esc(Number(c.metaMrrMes) > 0 ? Number(c.metaMrrMes) : "") + '"' + (bloqueio ? " disabled" : "") + '>' +
      '<div class="hint">Em R$ por mês, só os números, sem ponto de milhar. ' +
        'É o MRR de contrato NOVO fechado no mês, não o tamanho da carteira.</div>' +
    '</div>';
  for(i = 0; i < EDICOES.length; i++){
    var mc = pnlMetaCota(EDICOES[i].k);
    h += '<div class="fld"><label>Meta de cota, ' + esc(EDICOES[i].rot) + '</label>' +
      '<input class="inp" id="mtC_' + esc(EDICOES[i].k) + '" inputmode="numeric" placeholder="600000" value="' +
        esc(mc > 0 ? mc : "") + '"' + (bloqueio ? " disabled" : "") + '>' +
      '<div class="hint">Em R$ pela edição inteira, só os números, sem ponto de milhar, não por mês. ' +
        'O corte comercial é ' +
        esc(dataBR(EDICOES[i].corteComercial)) + '.</div>' +
    '</div>';
  }
  h += '<p class="tiny muted">Deixar em branco apaga a meta, e o painel volta a escrever ' +
       '"sem meta definida" em vez de qualquer percentual.</p>';
  if(bloqueio) h += '<div class="tiny" style="color:var(--text3)">' + esc(bloqueio) + '</div>';
  h += '<button class="btn btn-primary btn-block" type="submit"' + (bloqueio ? " disabled" : "") + '>Salvar meta</button>' +
  '</form>';
  folha("Meta", h);
};

ACOES.salvarMeta = function(f){
  var bloqueio = motivoBloqueio("crm_config");
  if(bloqueio){ toast(bloqueio, "bad"); return; }
  var campo = document.getElementById("mtMrr");
  var mrr = campo ? Math.round(lerValor(campo.value)) : 0;
  var cotas = {}, i;
  for(i = 0; i < EDICOES.length; i++){
    var el = document.getElementById("mtC_" + EDICOES[i].k);
    var v = el ? Math.round(lerValor(el.value)) : 0;
    // Grava 0 em vez de omitir a chave. gravar() escreve com merge, e no
    // merge um mapa aninhado sem a chave MANTÉM o valor velho no servidor:
    // apagar a meta sumiria só do cache e ela voltaria no próximo sync.
    // pnlMetaCota já le 0 como "sem meta definida".
    cotas[EDICOES[i].k] = v > 0 ? v : 0;
  }
  var btn = f.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }
  // Toast só depois que a promise resolve: dizer "salvo" antes de o
  // servidor confirmar é o momento exato em que se perde a confiança.
  gravar("crm_config", "geral", { metaMrrMes:(mrr > 0 ? mrr : 0), metaCota:cotas })
    .then(function(){
      fecharFolha();
      toast("Meta salva", "ok");
      redesenhar();
    })
    .catch(function(){
      if(btn){ btn.disabled = false; btn.textContent = "Salvar meta"; }
    });
};

/* ============ 11-cadastro ============ */
/* =====================================================================
   CRM LIME - CADASTRO, BUSCA, MENSAGEM E ACESSOS

   Quatro coisas que parecem soltas e sao o mesmo assunto: a porta de
   entrada do dado. Cadastro rapido (negocio e contato), busca que roda
   em memoria, mensagem de WhatsApp com captura no retorno, e o painel
   de acessos. Tudo aqui escreve pouco e le zero do banco, com uma
   excecao anotada (a lista de acessos, que é do admin e custa 4 leituras).

   Regras que valem no arquivo inteiro:
     - toda string que veio do usuario passa por esc() antes de virar HTML
     - todo botao dentro de <form> que nao envia leva type="button", senao
       o navegador trata como submit e o formulario sai pela metade
     - acao sem permissao fica VISIVEL e desabilitada, com o motivo embaixo
   ===================================================================== */

/* ---------------------------------------------------------------------
   HELPERS DA CASA (prefixo cad_ pra nao colidir com os outros modulos)
   --------------------------------------------------------------------- */

// Linha cinza de motivo, embaixo de botao desabilitado. Invariante 12.
function cadMotivo(txt){
  if(!txt) return "";
  return '<div class="tiny" style="color:var(--text3);margin-top:5px;line-height:1.4">' + esc(txt) + '</div>';
}

// Cor do semaforo em variavel de CSS, do jeito que o contrato define.
function cadCorTemp(t){
  if(t === "verde")     return "var(--green)";
  if(t === "amarelo")   return "var(--warn)";
  if(t === "vermelho")  return "var(--red)";
  if(t === "congelado") return "var(--blue)";
  return "var(--text3)";
}

// Valor curto do negocio, com a unidade certa de cada funil. Nunca soma
// MRR de agencia com valor de patrocinio (invariante 5).
function cadValorCurto(n){
  if(!n) return "";
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mês" : "valor a definir";
  }
  var v = valorRefDe(n);
  return v > 0 ? brl(v) : "valor a definir";
}

// "11 de agosto de 2027 (quarta)". Data em copy é SEMPRE absoluta com o
// dia da semana: "essa sexta" numa mensagem lida na segunda seguinte
// manda o cliente pro dia errado.
function cadDataCopy(iso){
  var e = dataExtenso(iso);
  if(!e) return "";
  var p = e.split(", ");
  if(p.length < 2) return e;
  return p[1] + " (" + p[0] + ")";
}

// Primeiro nome. Em WhatsApp ninguem escreve o nome completo da pessoa.
function cadPrimeiroNome(nome){
  var p = String(nome||"").trim().split(/\s+/).filter(Boolean);
  return p.length ? p[0] : "";
}

// Copia pra area de transferencia. A string é montada ANTES da chamada,
// pelo chamador: no Safari do iPhone qualquer await entre o clique e o
// writeText faz a permissao ser recusada em silencio e o botao parece
// quebrado. O fallback do textarea cobre http e webview antigo.
function cadCopiar(txt){
  function naMao(){
    var ok = false;
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
    toast(ok ? "Texto copiado" : "Não deu pra copiar sozinho. Selecione o texto e copie na mao", ok ? "ok" : "bad");
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt)
        .then(function(){ toast("Texto copiado", "ok"); })
        .catch(function(){ naMao(); });
      return;
    }
  }catch(e){}
  naMao();
}

/* =====================================================================
   1. BUSCA
   Roda em memoria sobre os ~250 registros ja carregados. ZERO leitura.
   Casa por PREFIXO DE PALAVRA, nao substring solta: "mar" acha "Marroca"
   e "Ana Maria" e NAO acha "Camargo". Substring solta devolve lixo em
   metade das buscas e ensina a pessoa a nao confiar na busca.
   ===================================================================== */

// Quebra em palavras normalizadas. O @ e o ponto ficam na palavra pra
// e-mail continuar buscavel por "paulo@shineray".
function cadPalavras(txt){
  return chave(txt).split(/[^a-z0-9@.]+/).filter(Boolean);
}
// Todos os termos precisam casar (E, nao OU): com 250 registros, OU
// devolve a base inteira assim que a pessoa digita duas palavras.
function cadCasaPrefixo(alvo, termos){
  var pal = cadPalavras(alvo);
  for(var i=0;i<termos.length;i++){
    var achou = false;
    for(var j=0;j<pal.length;j++){
      if(pal[j].indexOf(termos[i]) === 0){ achou = true; break; }
    }
    if(!achou) return false;
  }
  return true;
}

function buscar(termo){
  var bruto = String(termo||"").trim();
  var termos = cadPalavras(bruto);
  var dig = soDigito(bruto);
  var porFone = dig.length >= 4;          // 4 digitos ja é o fim de um numero
  // A resposta vazia tem que ter a MESMA forma da cheia. Quem le
  // r.totalNegocios pra escrever "5 de 12" recebia undefined aqui, e
  // "5 de undefined" é o tipo de coisa que vaza pra tela do vendedor.
  var vazio = { negocios:[], contatos:[], totalNegocios:0, totalContatos:0, total:0 };

  if(!termos.length && !porFone) return vazio;
  // Uma letra só casa quase tudo e o resultado vira ruido.
  if(!porFone && termos.length === 1 && termos[0].length < 2) return vazio;

  var ns = lista("negocios").filter(function(n){
    if(porFone && soDigito(n.contatoTel).indexOf(dig) > -1) return true;
    if(!termos.length) return false;
    return cadCasaPrefixo(
      [n.empresa, n.titulo, n.contatoNome, n.indicadorNome].join(" "), termos);
  });

  var cs = lista("contatos").filter(function(c){
    if(porFone && soDigito(c.tel).indexOf(dig) > -1) return true;
    if(!termos.length) return false;
    return cadCasaPrefixo([c.nome, c.empresa, c.cargo, c.email].join(" "), termos);
  });

  // Aberto primeiro, e dentro disso valorOrdem desc. valorOrdem é nao
  // valorRefDe porque negocio sem valor (a indicacao cadastrada em 20
  // segundos) afundaria pro fim da lista e nunca apareceria.
  ns.sort(function(a,b){
    var aa = a.status === "aberto" ? 0 : 1, bb = b.status === "aberto" ? 0 : 1;
    if(aa !== bb) return aa - bb;
    return valorOrdem(b) - valorOrdem(a);
  });
  // Indicador primeiro: é quem se procura com pressa pra pedir um empurrao.
  cs.sort(function(a,b){
    var aa = a.ehIndicador ? 0 : 1, bb = b.ehIndicador ? 0 : 1;
    if(aa !== bb) return aa - bb;
    return chave(a.nome) < chave(b.nome) ? -1 : 1;
  });

  // total é o numero HONESTO de casamentos. As listas vem cortadas em 5,
  // e a tela usa o total pra dizer "5 de 12" em vez de mentir. O total de
  // cada grupo vem separado porque "5 de 12" no cabecalho de Negocios tem
  // que contar negocio, nunca negocio mais pessoa.
  return { negocios:ns.slice(0,5), contatos:cs.slice(0,5),
           totalNegocios:ns.length, totalContatos:cs.length,
           total:ns.length + cs.length };
}

/* ---------------------------------------------------------------------
   DESENHO DA BUSCA DO CABECALHO
   O input mora no cabecalho com id "busca" e o resultado vai pra
   #buscaOut. Os escutadores sao registrados UMA vez, no documento, e nao
   dentro de tela: redesenhar() troca o innerHTML inteiro e escuta presa
   em elemento de tela vazaria a cada render.
   --------------------------------------------------------------------- */
var BUSCA_SEL = -1;   // item destacado pelo teclado

function cadCaixaBusca(){
  var out = document.getElementById('buscaOut');
  if(out) return out;
  // Defensivo: se o cabecalho nao trouxer a caixa, ela nasce aqui dentro
  // do .search, que é quem tem position:relative.
  var inp = document.getElementById('busca');
  if(!inp) return null;
  var pai = inp.closest ? inp.closest('.search') : null;
  out = document.createElement('div');
  out.id = "buscaOut";
  out.className = "search-out";
  out.hidden = true;
  (pai || inp.parentNode).appendChild(out);
  return out;
}

function fecharBusca(){
  var out = document.getElementById('buscaOut');
  if(out){ out.hidden = true; out.innerHTML = ""; }
  BUSCA_SEL = -1;
}

function pintarBusca(termo){
  var out = cadCaixaBusca();
  if(!out) return;
  var t = String(termo||"").trim();
  BUSCA_SEL = -1;

  if(t.length < 2 && soDigito(t).length < 4){ out.hidden = true; out.innerHTML = ""; return; }

  var r = buscar(t);
  var podeN = motivoBloqueio("crm_negocios");
  var podeC = motivoBloqueio("crm_contatos");
  var h = "";

  if(r.negocios.length){
    h += '<div class="search-grp">Negócios' +
         (r.totalNegocios > r.negocios.length
            ? ' (' + r.negocios.length + ' de ' + r.totalNegocios + ' achados)' : '') +
         '</div>';
    for(var i=0;i<r.negocios.length;i++) h += cadItemNegocio(r.negocios[i]);
  }
  if(r.contatos.length){
    h += '<div class="search-grp">Pessoas' +
         (r.totalContatos > r.contatos.length
            ? ' (' + r.contatos.length + ' de ' + r.totalContatos + ' achadas)' : '') +
         '</div>';
    for(var j=0;j<r.contatos.length;j++) h += cadItemContato(r.contatos[j]);
  }

  // Busca vazia vira cadastro: quando o vendedor procura alguem que nao
  // existe é porque acabou de receber uma indicacao e está com o nome na
  // cabeca. Fazer ele fechar a busca, achar o [+] e digitar de novo é o
  // jeito mais barato de perder o lead.
  h += '<div class="search-grp">' + (r.total ? "Não achou?" : "Não existe ainda") + '</div>';
  h += '<button class="search-it" type="button" data-a="buscaCriarNegocio" data-t="' + esc(t) + '"' +
         (podeN ? ' disabled style="opacity:.45"' : '') + '>' +
         '<span style="flex:1;min-width:0">' +
           '<span class="t" style="display:block">+ Criar negócio pra "' + esc(t) + '"</span>' +
           '<span class="s" style="display:block">' +
             (podeN ? esc(podeN) : 'abre o cadastro com o nome já preenchido, leva menos de 20 segundos') +
           '</span></span></button>';
  h += '<button class="search-it" type="button" data-a="buscaCriarContato" data-t="' + esc(t) + '"' +
         (podeC ? ' disabled style="opacity:.45"' : '') + '>' +
         '<span style="flex:1;min-width:0">' +
           '<span class="t" style="display:block">+ Criar contato "' + esc(t) + '"</span>' +
           '<span class="s" style="display:block">' +
             (podeC ? esc(podeC) : 'nome mais um jeito de falar com a pessoa') +
           '</span></span></button>';

  out.innerHTML = h;
  out.hidden = false;
}

function cadItemNegocio(n){
  var e = estagioDe(n);
  var sub = (n.status === "aberto" ? e.rot : cadRotStatus(n.status)) +
            " · " + cadValorCurto(n) +
            (n.contatoNome ? " · " + n.contatoNome : "");
  return '<button class="search-it" type="button" data-a="buscaAbrir" data-r="negocio/' + esc(n.id) + '">' +
    '<span class="dot" style="background:' + cadCorTemp(temperatura(n)) + ';margin-top:6px"></span>' +
    '<span style="flex:1;min-width:0">' +
      '<span class="t truncate" style="display:block;text-transform:uppercase">' + esc(n.empresa || n.titulo) + '</span>' +
      '<span class="s truncate" style="display:block">' + esc(sub) + '</span>' +
    '</span></button>';
}
function cadItemContato(c){
  var sub = [];
  if(c.cargo)   sub.push(c.cargo);
  if(c.empresa) sub.push(c.empresa);
  if(c.tel)     sub.push(foneBR(c.tel));
  else if(c.email) sub.push(c.email);
  if(c.ehIndicador) sub.push("indicador");
  return '<button class="search-it" type="button" data-a="buscaAbrir" data-r="pessoa/' + esc(c.id) + '">' +
    '<span class="dot" style="background:' + (c.ehIndicador ? "var(--lime)" : "var(--text3)") + ';margin-top:6px"></span>' +
    '<span style="flex:1;min-width:0">' +
      '<span class="t truncate" style="display:block">' + esc(c.nome) + '</span>' +
      '<span class="s truncate" style="display:block">' + esc(sub.join(" · ") || "sem telefone e sem e-mail") + '</span>' +
    '</span></button>';
}
function cadRotStatus(s){
  if(s === "ganho")     return "Ganho";
  if(s === "perdido")   return "Perdido";
  if(s === "encerrado") return "Encerrado";
  return "Aberto";
}

ACOES.focarBusca = function(){

  if(!inp) return;
  try{ inp.focus(); inp.select(); }catch(e){}

document.addEventListener('input', function(ev){
  var el = ev.target;
  if(!el || !el.id) return;
  if(el.id === "busca"){ pintarBusca(el.value); return; }
  if(el.id === "nnEmpresa"){ nnPintarDup(); nnPintarTitulo(); return; }
  if(el.id === "nnTitulo"){ if(NOVO) NOVO.tituloTocado = true; return; }
  if(el.id === "ncNome" || el.id === "ncTel"){ ncPintarDup(); return; }
  if(el.id === "nnIndicBusca"){ nnPintarIndic(); return; }
  if(el.id === "msgTexto"){
    // A lista de campos que faltam so e refeita quando a lista MUDA. Refazer
    // a cada tecla custa nada, mas apagaria o que estiver sendo digitado
    // dentro de um campo de variavel.
    if(MSG){
      var f = msgFaltando(el.value).join(",");
      if(f !== MSG.faltavam) msgPintarVars();
    }
    return;
  }
});
// Campo inline de variavel de modelo (ex: {gancho}).
document.addEventListener('input', function(ev){
  var el = ev.target;
  if(!el || !el.getAttribute) return;
  var v = el.getAttribute('data-v');
  if(!v || !MSG) return;
  msgAplicarVar(v, el.value);
});

document.addEventListener('keydown', function(ev){
  var inp = document.getElementById('busca');
  var out = document.getElementById('buscaOut');
  var digitando = document.activeElement &&
    /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

  // "/" foca a busca. Só fora de campo de texto, senao vira barra digitada.
  if(ev.key === "/" && !digitando && !FOLHA_ABERTA && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
    if(inp){ ev.preventDefault(); try{ inp.focus(); inp.select(); }catch(e){} }
    return;
  }
  if(!out || out.hidden) return;
  if(ev.key === "Escape"){ fecharBusca(); if(inp) try{ inp.blur(); }catch(e){} return; }

  var itens = out.querySelectorAll('.search-it');
  if(!itens.length) return;
  if(ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    BUSCA_SEL += (ev.key === "ArrowDown" ? 1 : -1);
    if(BUSCA_SEL < 0) BUSCA_SEL = itens.length - 1;
    if(BUSCA_SEL >= itens.length) BUSCA_SEL = 0;
    for(var i=0;i<itens.length;i++) itens[i].classList.toggle('sel', i === BUSCA_SEL);
    try{ itens[BUSCA_SEL].scrollIntoView({ block:"nearest" }); }catch(e){}
  } else if(ev.key === "Enter" && document.activeElement === inp){
    ev.preventDefault();
    itens[BUSCA_SEL >= 0 ? BUSCA_SEL : 0].click();
  }
});
// Clique fora fecha. Roda depois da delegacao do shell, entao um clique
// em resultado ainda é processado antes de a caixa sumir.
document.addEventListener('click', function(ev){
  var out = document.getElementById('buscaOut');
  if(!out || out.hidden) return;
  if(ev.target && ev.target.closest && ev.target.closest('.search')) return;
  fecharBusca();
});

/* =====================================================================
   2. NEGOCIO NOVO
   Alvo: 2 textos e 3 toques, menos de 20 segundos. Empresa, tipo, origem,
   quem indicou quando for indicacao, proximo passo. Nada mais entra aqui:
   valor, cota, quem decide e verba sao da tela de detalhe, e pedir isso
   no cadastro é o que faz o vendedor nao cadastrar.
   ===================================================================== */
var NOVO = null;          // rascunho em memoria do cadastro aberto
var NN_SALVANDO = false;  // trava contra duplo toque no Salvar

function nnRascunho(){
  // Negocio de mentira, só pra o bloco de proximo passo saber de que funil
  // está falando (o tipo "cobrar aprovação interna" só existe em patrocinio).
  var tipo = (NOVO && NOVO.tipo) || "agencia";
  return { id:"", tipo:tipo, estagio:(FUNIL[tipo][0] || {}).k, status:"aberto",
           empresa:"", titulo:"", proxData:"", proxTipo:"", estagioDesde:hojeISO(),
           ultimoToqueEm:hojeISO() };
}

function abrirNovoNegocio(pre){
  pre = pre || {};
  NOVO = {
    tipo: pre.tipo || "agencia",
    origem: pre.origem || "",
    indicadorId: pre.indicadorId || "",
    indicadorNome: "",
    contatoId: pre.contatoId || "",
    tituloTocado: false
  };
  NN_SALVANDO = false;

  var ct = NOVO.contatoId ? contatoPorId(NOVO.contatoId) : null;
  if(NOVO.indicadorId){
    var ind = contatoPorId(NOVO.indicadorId);
    // Contato excluido nao pode nascer como quem indicou: a ficha dele nao
    // aparece em lista nenhuma, entao o credito da indicacao ficaria preso
    // num lugar onde ninguem consegue abrir pra cobrar o acordo.
    if(ind && !ind.arquivado){ NOVO.indicadorNome = ind.nome; if(!NOVO.origem) NOVO.origem = "indicacao"; }
    else NOVO.indicadorId = "";
  }
  var empresa = pre.empresa || (ct && ct.empresa) || "";
  var bloqueio = motivoBloqueio("crm_negocios");

  var corpo =
    '<form class="form" id="nnForm" data-a="salvarNovoNegocio">' +
      '<div class="fld">' +
        '<label>Empresa <span class="req">*</span></label>' +
        '<input class="inp" id="nnEmpresa" autocomplete="off" maxlength="120" ' +
          'placeholder="Marroca Editora" value="' + esc(empresa) + '">' +
        '<div id="nnDup"></div>' +
      '</div>' +

      '<div class="fld">' +
        '<label>Tipo <span class="req">*</span></label>' +
        '<div class="grid2" id="nnTipos"></div>' +
        '<div class="hint" id="nnPrev"></div>' +
      '</div>' +

      '<div class="fld">' +
        '<label>De onde veio <span class="req">*</span></label>' +
        '<div class="pills" id="nnOrigens"></div>' +
      '</div>' +

      '<div class="fld" id="nnIndicBloco" hidden>' +
        '<label>Quem indicou <span class="req">*</span></label>' +
        '<div id="nnIndicEscolhido"></div>' +
        '<input class="inp" id="nnIndicBusca" autocomplete="off" maxlength="120" ' +
          'placeholder="digite o nome, mesmo que não exista ainda">' +
        '<div id="nnIndicOut"></div>' +
      '</div>' +

      '<div class="fld">' +
        '<label>Título</label>' +
        '<input class="inp" id="nnTitulo" maxlength="120" autocomplete="off">' +
        '<div class="hint">gerado sozinho com empresa, tipo e ano. Pode mudar.</div>' +
      '</div>' +

      '<div id="nnProx"></div>' +

      '<div class="fld"><div class="err" id="nnErr"></div></div>' +
    '</form>';

  var rodape =
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Cancelar</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="nnForm"' +
        (bloqueio ? ' disabled' : '') + '>Salvar negócio</button>' +
      cadMotivo(bloqueio) +
    '</div>';

  folha("Negócio novo", corpo, rodape);

  // A folha ja existe no DOM aqui, entao os blocos que dependem do estado
  // sao pintados na sequencia, sem esperar render nenhum.
  nnPintarTipos(); nnPintarPrev(); nnPintarOrigens(); nnPintarIndicBloco();
  nnPintarProx(); nnPintarTitulo(); nnPintarDup();
}

function nnPintarTipos(){
  var w = document.getElementById('nnTipos');
  if(!w || !NOVO) return;
  var h = "";
  for(var i=0;i<TIPOS.length;i++){
    var t = TIPOS[i], on = (NOVO.tipo === t.k);
    h += '<button type="button" class="btn btn-lg btn-block' + (on ? ' btn-primary' : '') + '" ' +
         'data-a="nnTipo" data-k="' + t.k + '">' + t.ic + ' ' + esc(t.rot) + '</button>';
  }
  // Tipo é imutavel depois de criado (invariante 6). Dito aqui, que é o
  // unico momento em que da pra escolher.
  h += '<div class="tiny muted" style="grid-column:1/-1">O tipo não muda depois de salvo. ' +
       'Agência é fee por mês, patrocínio é cota do festival.</div>';
  w.innerHTML = h;
}
ACOES.nnTipo = function(el){
  if(!NOVO) return;
  NOVO.tipo = el.getAttribute('data-k');
  nnPintarTipos(); nnPintarPrev(); nnPintarTitulo();
  // O bloco de proximo passo é refeito porque a lista de tipos depende do
  // funil. Como o tipo se escolhe antes do proximo passo, nao ha o que perder.
  nnPintarProx();
};

function nnPintarPrev(){
  var el = document.getElementById('nnPrev');
  if(!el || !NOVO) return;
  var dias = CICLO_MEDIANO[NOVO.tipo] || 30;
  var d = somaDias(hojeISO(), dias);
  // prevFechamento NUNCA nasce vazia: data estimada mata o campo
  // obrigatorio que o vendedor odeia e mata o undefined que quebra a tela.
  // Enquanto for estimada, o negocio fica fora de alta chance de proposito.
  el.innerHTML = 'Previsão de fechamento: <b>' + dataBR(d) + '</b> ' +
    '<span class="muted">(data estimada, ' + dias + ' dias, que é o ciclo mediano de ' +
    esc(NOVO.tipo === "agencia" ? "agência" : "patrocínio") + ')</span>. ' +
    'Enquanto for estimada esse negócio não entra em alta chance. Ajuste na tela do negócio.';
}

function nnPintarOrigens(){
  var w = document.getElementById('nnOrigens');
  if(!w || !NOVO) return;
  var h = "";
  for(var i=0;i<ORIGENS.length;i++){
    var o = ORIGENS[i];
    h += '<button type="button" class="pill' + (NOVO.origem === o[0] ? ' on' : '') + '" ' +
         'data-a="nnOrigem" data-k="' + o[0] + '">' + esc(o[1]) + '</button>';
  }

}
ACOES.nnOrigem = function(el){
  if(!NOVO) return;
  NOVO.origem = el.getAttribute('data-k');

};

function nnPintarIndicBloco(){
  var b = document.getElementById('nnIndicBloco');
  if(!b || !NOVO) return;
  b.hidden = (NOVO.origem !== "indicacao");
  var esc1 = document.getElementById('nnIndicEscolhido');
  var inp  = document.getElementById('nnIndicBusca');
  var out  = document.getElementById('nnIndicOut');
  if(!esc1 || !inp || !out) return;

function nnPintarDup(){
  var el = document.getElementById('nnDup');
  var inp = document.getElementById('nnEmpresa');
  if(!el || !inp) return;
  var v = chave(inp.value);
  el.innerHTML = "";
  if(v.length < 3) return;

  // Casa por prefixo nos DOIS sentidos: digitar "hond" acha "Honda do
  // Brasil", e digitar "Honda do Brasil Ltda" acha "Honda do Brasil".
  // Com duas pessoas cadastrando, Honda, Honda do Brasil e HONDA MOTOS
  // viram tres empresas em tres meses e o historico da conta se parte.
  var grupos = {}, ordem = [];
  var ns = lista("negocios");
  for(var i=0;i<ns.length;i++){
    var n = ns[i];
    var ek = n.empresaChave || chave(n.empresa);
    if(!ek) continue;
    if(ek.indexOf(v) !== 0 && v.indexOf(ek) !== 0) continue;
    if(!grupos[ek]){ grupos[ek] = { grafia:n.empresa, n:0 }; ordem.push(ek); }
    grupos[ek].n++;
  }
  if(!ordem.length) return;

  var h = "";
  for(var j=0;j<ordem.length && j<3;j++){
    var g = grupos[ordem[j]];
    var igual = chave(g.grafia) === v;
    h += '<div class="tiny" style="color:var(--warn);margin-top:6px;display:flex;' +
         'align-items:center;gap:8px;flex-wrap:wrap">' +
         '<span>Essa empresa já tem ' + g.n + (g.n === 1 ? ' negócio' : ' negócios') +
         ' como <b>' + esc(g.grafia) + '</b></span>' +
         (igual ? '' : '<button type="button" class="btn btn-sm" data-a="nnUsarGrafia" data-g="' +
                       esc(g.grafia) + '">usar essa grafia</button>') +
         '</div>';
  }
  el.innerHTML = h;
}
ACOES.nnUsarGrafia = function(el){

  inp.value = el.getAttribute('data-g') || "";

};

ACOES.salvarNovoNegocio = function(form){
  if(NN_SALVANDO) return;
  var err = document.getElementById('nnErr');
  function falha(m){ if(err) err.textContent = m; toast(m, "bad"); }

  var motivo = motivoBloqueio("crm_negocios");
  if(motivo){ falha(motivo); return; }
  if(!NOVO){ falha("O cadastro perdeu o rascunho. Abra de novo."); return; }

  var empresa = (document.getElementById('nnEmpresa').value || "").trim();
  if(empresa.length < 2){ falha("Escreva o nome da empresa."); return; }
  if(!NOVO.origem){ falha("Diga de onde veio esse negócio."); return; }
  if(NOVO.origem === "indicacao" && !NOVO.indicadorId){
    falha("Escolha quem indicou, ou crie o contato ali mesmo no campo."); return;
  }
  var pp = lerProxPasso('np');
  // O proximo passo é obrigatorio NO CADASTRO, e por isso a checagem olha
  // pp.ligado antes de pp.ok: com a caixinha desmarcada lerProxPasso devolve
  // ok:true de proposito (no resto do sistema desmarcar é uma escolha valida),
  // e o negocio nasceria com proxData vazia, no balde "sem data", fora da fila
  // do Hoje. Negocio que nao aparece na fila é negocio esquecido.
  if(!pp || !pp.ligado){
    falha("Marque o próximo passo. Sem data o negócio não entra na fila do Hoje e ninguém lembra dele.");
    return;
  }
  if(!pp.ok){ falha(pp.erro || "Marque o próximo passo com tipo e data."); return; }

  var titulo = (document.getElementById('nnTitulo').value || "").trim() || nnTituloAuto();
  var tipo = NOVO.tipo;
  var ct = NOVO.contatoId ? contatoPorId(NOVO.contatoId) : null;
  var ctNome = ct ? ct.nome : "";
  var id = idNovo("n");
  var hoje = hojeISO();

  var n = {
    id:id, tipo:tipo, titulo:titulo.slice(0,120),
    empresa:empresa.slice(0,120), empresaChave:chave(empresa),
    contatoId: ct ? ct.id : "", contatoNome: ctNome, contatoTel: ct ? (ct.tel||"") : "",
    estagio:(FUNIL[tipo][0] || {}).k, status:"aberto",
    origem:NOVO.origem,
    indicadorId:NOVO.indicadorId || "", indicadorNome:NOVO.indicadorNome || "",
    /* Quem cadastra e quem captou. Nao tem campo pra escolher outra
       pessoa de proposito: no dia a dia quem prospecta e quem digita sao
       a mesma pessoa, e um seletor a mais no cadastro so serve pra ser
       preenchido errado com pressa. Admin corrige depois na ficha. */
    captouId:(SESSAO && SESSAO.acessoId) || "", captouNome:(SESSAO && SESSAO.nome) || "",
    fechaId:"", fechaNome:"", passadoEm:"", passadoNoEstagio:"",
    valorRef:0,
    prevFechamento: somaDias(hoje, CICLO_MEDIANO[tipo] || 30),
    prevEstimada: true,
    proxTipo:pp.proxTipo, proxData:pp.proxData,
    proxTexto:(pp.proxTexto || "").slice(0,140), proxHora:pp.proxHora || "",
    congeladoAte:"", congeladoMotivo:"",
    vezesAdiado:0, vezesRemarcouPrev:0,
    ultimoToqueEm:hoje, ultimoToqueTxt:"Negócio cadastrado",
    estagioDesde:hoje, maiorEstagio:0,
    motivoPerda:"", motivoPerdaObs:"", fechadoEm:"", encerradoEm:"", motivoEncerramento:"",
    linkProposta:"", obs:"",
    busca: chave([empresa, titulo, ctNome, NOVO.indicadorNome].filter(Boolean).join(" ")),
    criadoEm:hoje, criadoPor:(SESSAO && SESSAO.nome) || "", arquivado:false
  };

  if(tipo === "agencia"){
    n.ag = { mrr:0, mrrInicial:0, meses:0, verbaMidia:0, pctVerba:0, servicos:[],
             inicioContrato:"", fimContrato:"", renovacaoDeId:"",
             quemDecide:"", faixaVerba:"" };
    n.pt = null;
  } else {
    // A edicao nasce na primeira que ainda nao passou do corte comercial.
    // Cota sem edicao nao aparece na cobertura de edicao nenhuma, e
    // ninguem volta pra preencher campo que a tela nao cobra.
    var ed = "";
    for(var i=0;i<EDICOES.length;i++){
      if(EDICOES[i].corteComercial >= hoje){ ed = EDICOES[i].k; break; }
    }
    n.pt = { edicao:ed, cota:"", valor:0, valorInicial:0, permuta:0,
             entregaveis:"", quemAprova:"", mesBudget:"" };
    n.ag = null;
  }

  var ativ = {
    negocioId:id, contatoId:n.contatoId, tipo:"nota",
    texto:"Negócio cadastrado. Origem: " + rotOrigem(NOVO.origem) +
          (NOVO.indicadorNome ? ", indicado por " + NOVO.indicadorNome : ""),
    quando:hoje, ts:Date.now(), por:(SESSAO && SESSAO.nome) || "", de:"", para:""
  };
  var ativId = idAtiv();

  NN_SALVANDO = true;
  // Duas escritas: o negocio e a atividade de criacao. A atividade existe
  // pra timeline nao comecar vazia, que é o que faz a tela parecer quebrada
  // no primeiro negocio de cada pessoa.
  gravar("crm_negocios", id, n)
    .then(function(){
      ativ.id = ativId;
      empurrarTimeline(id, ativ);           // entra na timeline local sem leitura
      return gravar("crm_atividades", ativId, ativ);
    })
    .then(function(){
      NN_SALVANDO = false;
      NOVO = null;
      fecharFolha();
      toast("Negócio criado", "ok");
      ir("negocio/" + id);
    })
    .catch(function(e){
      NN_SALVANDO = false;
      falha("Não deu pra salvar: " + ((e && e.message) || "erro") +
            ". O registro ficou guardado no aparelho.");
    });
};

/* O cadastro de negocio ja avisa de empresa repetida; a pessoa nao avisava
   nada. Quem liga com pressa cadastra a Carla de novo como "Carla M", e a
   partir dali as indicacoes dela ficam divididas em duas fichas: o ranking
   de indicadores conta metade, e a conversa antiga está na outra. Avisa e
   oferece a ficha que ja existe, sem barrar, porque duas pessoas podem
   dividir o mesmo telefone de empresa. */
function ncPintarDup(){
  var w = document.getElementById('ncDup');
  if(!w) return;
  w.innerHTML = "";
  var elN = document.getElementById('ncNome');
  var elT = document.getElementById('ncTel');
  var nk = chave(elN ? elN.value : "");
  var dig = soDigito(elT ? elT.value : "");
  if(nk.length < 3 && dig.length < 10) return;

  var cs = lista("contatos");
  var achados = [], porFone = false;
  for(var i=0;i<cs.length && achados.length < 3;i++){
    var c = cs[i];
    var mesmoFone = dig.length >= 10 && c.tel && soDigito(c.tel) === dig;
    var mesmoNome = nk.length >= 3 && chave(c.nome) === nk;
    if(!mesmoFone && !mesmoNome) continue;
    if(mesmoFone) porFone = true;
    achados.push({ c:c, fone:mesmoFone });
  }
  if(!achados.length) return;

  var h = '';
  for(var j=0;j<achados.length;j++){
    var a = achados[j];
    var sub = a.fone ? "mesmo telefone" : "mesmo nome";
    h += '<div class="tiny" style="color:var(--warn);margin-top:6px;display:flex;' +
         'align-items:center;gap:8px;flex-wrap:wrap">' +
         '<span><b>' + esc(a.c.nome) + '</b> já está cadastrada com ' + sub +
         (a.c.empresa ? ' (' + esc(a.c.empresa) + ')' : '') + '</span>' +
         '<button type="button" class="btn btn-sm" data-a="ncUsarExistente" data-id="' +
         esc(a.c.id) + '">usar essa pessoa</button>' +
         '</div>';
  }
  if(porFone){
    h += '<div class="tiny muted" style="margin-top:4px">Duas fichas com o mesmo telefone ' +
         'partem a conversa e o crédito da indicação em duas.</div>';
  }
  w.innerHTML = h;
}

  var motivo = motivoBloqueio("crm_contatos");

    obs:v('ncObs').slice(0,400),
    busca: chave([nome, empresa, v('ncCargo'), email].join(" ")),
    criadoEm:hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || "", arquivado:false
  };

  NC_SALVANDO = true;
  gravar("crm_contatos", id, c)
    .then(function(){
      NC_SALVANDO = false;
      var cb = CONT_AOSALVAR; CONT_AOSALVAR = null;
      fecharFolha();
      toast("Contato salvo", "ok");
      if(cb) cb(c);
    })
    .catch(function(e){
      NC_SALVANDO = false;
      falha("Não deu pra salvar: " + ((e && e.message) || "erro") +
            ". O registro ficou guardado no aparelho.");
    });
};

var MSG = null;

var MSG_ROTULOS = {

  mrr:"Fee por mês", meses:"Meses de contrato",

  dataEvento:"Data do evento", entregaveis:"O que entra na cota",
  corte:"Data de corte da produção", diaRetorno:"Quando você liga de volta",
  assunto:"Sobre o que vocês falaram", gancho:"O motivo real de lembrar agora",

};

// Troca {chave} pelo que o sistema sabe. O que nao sabe FICA como {chave}
// e vira campo inline, em vez de sumir e deixar a frase sem sentido.
function msgTrocar(txt, mapa){
  return String(txt||"").replace(/\{([a-zA-Z]+)\}/g, function(tudo, v){
    var val = mapa[v];
    return (val == null || val === "") ? tudo : String(val);
  });
}
function msgFaltando(txt){
  var r = [], re = /\{([a-zA-Z]+)\}/g, m;
  while((m = re.exec(String(txt||"")))){ if(r.indexOf(m[1]) === -1) r.push(m[1]); }
  return r;
}

function msgMapa(n, c, nome){
  var mapa = {};
  mapa.vendedor = (SESSAO && SESSAO.nome) || "";
  mapa.nome = cadPrimeiroNome(nome);
  if(c){
    if(c.empresa) mapa.empresa = c.empresa;
    // Em m5 e m6 quem recebe a mensagem É o indicador, entao {indicador}
    // é o nome de quem está do outro lado.
    mapa.indicador = cadPrimeiroNome(c.nome);
  }
  if(n){
    mapa.empresa = n.empresa || mapa.empresa;
    if(n.indicadorNome) mapa.indicador = cadPrimeiroNome(n.indicadorNome);
    if(n.tipo === "agencia" && n.ag){
      if(mrrDe(n) > 0) mapa.mrr = brl(mrrDe(n));
      if(n.ag.meses > 0) mapa.meses = String(n.ag.meses);   // 0 = indeterminado, vira campo
    }
    if(n.tipo === "patrocinio" && n.pt){
      if(n.pt.cota) mapa.cota = n.pt.cota;
      if(n.pt.valor > 0) mapa.valor = brl(n.pt.valor);
      if(n.pt.entregaveis) mapa.entregaveis = String(n.pt.entregaveis).split("\n").filter(Boolean).join(", ");
      var ed = edicaoDe(n.pt.edicao);
      if(ed){
        mapa.evento = ed.rot;
        mapa.dataEvento = cadDataCopy(ed.dataEvento);
        mapa.corte = cadDataCopy(ed.corteComercial);
      }
    }
    if(n.proxData) mapa.diaRetorno = cadDataCopy(n.proxData);
    if(n.proxHora) mapa.hora = n.proxHora;
  }
  return mapa;
}

function msgEscolher(k){
  if(!MSG) return;
  var m = null;
  for(var i=0;i<MODELOS.length;i++) if(MODELOS[i].k === k) m = MODELOS[i];
  MSG.modelo = m ? m.k : "";
  MSG.base = m ? m.txt : "";
  MSG.valores = {}; MSG.aplicado = {};

  var w = document.getElementById('msgPills');
  if(w){
    var bts = w.querySelectorAll('[data-a="msgModelo"]');
    for(var j=0;j<bts.length;j++){
      bts[j].classList.toggle('on', (bts[j].getAttribute('data-k') || "") === MSG.modelo);
    }
  }
  var ta = document.getElementById('msgTexto');
  if(ta) ta.value = msgTrocar(MSG.base, MSG.mapa);
  msgPintarVars();
}
ACOES.msgModelo = function(el){ msgEscolher(el.getAttribute('data-k') || ""); };

function msgPintarVars(){
  var w = document.getElementById('msgVars');
  if(!w || !MSG) return;
  var ta = document.getElementById('msgTexto');
  var faltam = msgFaltando(ta ? ta.value : "");
  MSG.faltavam = faltam.join(",");
  if(!faltam.length){ w.innerHTML = ""; return; }

  var h = '<div class="fld"><label>Falta preencher</label></div>';
  for(var i=0;i<faltam.length;i++){

    if(v === "assunto" && MSG.n && MSG.n.ultimoToqueTxt) dica = MSG.n.ultimoToqueTxt;
    if(v === "gancho") dica = "saiu matéria do setor, indicação nova, mudança na marca";
    h += '<div class="fld">' +
      '<label>' + esc(MSG_ROTULOS[v] || v) + '</label>' +

        'placeholder="' + esc(dica) + '" value="' + esc(MSG.valores[v] || "") + '">' +
    '</div>';
  }
  h += '<div class="tiny muted">O que você escrever aqui entra no texto na hora. ' +
       'O que ficar entre chaves vai junto pro WhatsApp, então apague antes de mandar.</div>';
  w.innerHTML = h;

// Troca no texto ATUAL da previa, nao remonta do modelo. Assim a edicao
// que a pessoa fez a mao nao é jogada fora a cada letra digitada no campo.
function msgAplicarVar(v, valor){
  var ta = document.getElementById('msgTexto');
  if(!ta || !MSG) return;
  MSG.valores[v] = valor;
  var antes = (MSG.aplicado[v] != null && MSG.aplicado[v] !== "") ? MSG.aplicado[v] : ("{" + v + "}");
  var depois = valor || ("{" + v + "}");
  if(antes === depois) return;
  if(ta.value.indexOf(antes) === -1) return;    // a pessoa apagou o trecho, nao inventa
  ta.value = ta.value.split(antes).join(depois);
  MSG.aplicado[v] = valor;
}

/* ---------------------------------------------------------------------
   E-MAIL COM O TEXTO DENTRO

   O botao de e-mail era um <a href="mailto:alguem@..."> montado na hora
   de DESENHAR a folha, sem assunto e sem corpo. Ou seja: a pessoa
   escolhia o modelo, ajustava a mensagem, clicava em e-mail, e o
   programa de e-mail abria EM BRANCO. Todo o texto ia pro lixo, sem
   aviso nenhum, e a saida obvia virava o botao verde do lado, que manda
   pro WhatsApp. Era o caminho do e-mail prometendo uma coisa e fazendo
   outra.

   Agora o link é montado no momento do clique, lendo o texto que está na
   tela naquele instante, e leva assunto junto.
   --------------------------------------------------------------------- */
function cadLinkEmail(email, texto, assunto){
  if(!email) return "";
  var q = [];
  if(assunto) q.push("subject=" + encodeURIComponent(assunto));
  if(texto)   q.push("body=" + encodeURIComponent(texto));
  return "mailto:" + encodeURIComponent(email).replace(/%40/g, "@") +
         (q.length ? "?" + q.join("&") : "");
}

/* Assunto que faz sentido pra quem recebe. Sem assunto, e-mail comercial
   cai em spam ou passa batido na caixa de entrada. */
function cadAssuntoEmail(){
  var n = MSG && MSG.n;
  if(n && n.titulo)  return n.titulo + " | Agência Lime";
  if(n && n.empresa) return n.empresa + " | Agência Lime";
  return "Agência Lime";
}

function cadAbrirEmail(email, texto){
  if(!email){ toast("Esse contato não tem e-mail guardado", "bad"); return; }
  var url = cadLinkEmail(email, texto || "", cadAssuntoEmail());
  // mailto muito comprido é cortado por alguns programas de e-mail. O
  // texto vai junto do mesmo jeito, e o aviso evita a pessoa achar que
  // mandou inteiro quando o programa truncou.
  if(url.length > 1900) toast("Texto longo: confira se o e-mail abriu completo", "bad");
  cadSair(url);
}

/* Saida comum do WhatsApp e do e-mail: guarda o pendente e sai da pagina.
   CAPTURA NO RETORNO. Grava no localStorage, NAO em memoria: no celular
   o webview é descarregado enquanto o outro aplicativo está aberto e a
   memoria some junto, entao a pergunta da volta nunca apareceria. */
function cadSair(url){
  if(MSG){
    guardar("pendente", { negocioId:MSG.negocioId || "", contatoId:MSG.contatoId || "",
                          nome:MSG.nome || "", quando:Date.now() });
  }
  fecharFolha();
  // window.open porque a delegacao do shell da preventDefault em tudo que
  // tem data-a. Se o navegador bloquear a aba, vai no mesmo lugar, que no
  // celular é o comportamento normal (o outro aplicativo assume a tela).
  var w = null;
  try{ w = window.open(url, "_blank"); }catch(e){ w = null; }
  if(!w) location.href = url;
}

/* ---------------------------------------------------------------------
   A PERGUNTA DA VOLTA
   Chamada pelo shell na volta ao foco e na inicializacao. O registro
   acontece NA VOLTA, com a conversa fresca, e nao antes de sair, quando a
   pessoa está com pressa e ainda nao sabe o que aconteceu.
   --------------------------------------------------------------------- */
// A barra ja existe no corpo da pagina (<div id="barraRetorno" hidden>) e o
// design system ja a posiciona: presa embaixo, largura inteira, e em
// bottom:62px no celular, que é logo acima da barra de abas. Aqui só se
// preenche e se mostra. Pendurar na regiao dos toasts nao serve: aquele
// embrulho tem transform, e transform vira o bloco de referencia de tudo
// que é position:fixed la dentro, entao a barra encolheria no meio da tela.
function cadBarraRetorno(){
  var b = document.getElementById('barraRetorno');
  if(!b){
    b = document.createElement('div');
    b.id = "barraRetorno"; b.hidden = true;
    document.body.appendChild(b);
  }
  return b;
}
function esconderBarraRetorno(){
  var b = document.getElementById('barraRetorno');
  if(b){ b.hidden = true; b.innerHTML = ""; }
}

function perguntarDoRetorno(){
  esconderBarraRetorno();
  if(!SESSAO) return;

  var p = recuperar("pendente", null);
  if(!p || !p.quando) return;
  if(Date.now() - p.quando > 3*3600*1000){ esquecer("pendente"); return; }  // 3 horas

  var quem = cadPrimeiroNome(p.nome) || "o contato";
  var b = cadBarraRetorno();
  // Botao de tamanho cheio, nao btn-sm: essa barra é usada com o polegar,
  // na rua, com o WhatsApp ainda aberto atras.
  b.innerHTML =
    '<span class="rt-q">Falou com ' + esc(quem) + '?</span>' +
    '<button class="btn btn-primary" data-a="retFalei">Falei</button>' +
    '<button class="btn" data-a="retSemResposta">Sem resposta</button>' +
    '<button class="btn btn-ghost" data-a="retDepois">Depois</button>';
  b.hidden = false;
}

ACOES.retDepois = function(){
  // "Depois" apaga o pendente de proposito: manter faria a mesma pergunta
  // voltar a cada troca de aba por 3 horas, e alarme repetido é alarme
  // que a pessoa aprende a ignorar.
  esquecer("pendente");
  perguntarDoRetorno();
};

      '<input type="hidden" id="retContato" value="' + esc(p.contatoId || "") + '">' +

        '<label>O que aconteceu</label>' +

          'placeholder="' + (falou ? 'ficou de responder até quinta, quer ver número de mídia' : 'sem resposta') + '">' +
          esc(padrao) + '</textarea>' +
        '<div class="hint">Pode deixar em branco. O registro vale mais que o texto.</div>' +
      '</div>' +
      (n ? '<div id="retProx"></div>' :
           '<div class="tiny muted">Essa conversa não está amarrada a negócio nenhum, ' +
           'então vai ficar só como registro na pessoa.</div>') +
      '<div class="fld"><div class="err" id="retErr"></div></div>' +
    '</form>';

  var rodape =
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Agora não</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="retForm"' +
        (bloqueio ? ' disabled' : '') + '>Salvar</button>' +
      cadMotivo(bloqueio) +
    '</div>';

  folha("Falou com " + quem + "?", corpo, rodape);
  if(n){
    var w = document.getElementById('retProx');
    // Com o negocio cru, o bloco reapresentaria o passo que a pessoa ACABOU
    // de cumprir na conversa, com a data vencida, e salvar deixaria o negocio
    // atrasado do mesmo jeito. semProxPasso limpa o passo antigo pra que o
    // bloco ofereca a sugestao do estagio.
    if(w) w.innerHTML = blocoProxPasso('rp', semProxPasso(n), true);
  }
}

var RET_SALVANDO = false;   // trava contra duplo toque, igual ao resto do arquivo

ACOES.salvarRetorno = function(){
  if(RET_SALVANDO) return;
  var err = document.getElementById('retErr');
  function falha(m){ RET_SALVANDO = false; if(err) err.textContent = m; toast(m, "bad"); }

  var negocioId = (document.getElementById('retNegocio').value || "");
  var contatoId = (document.getElementById('retContato').value || "");
  var texto = (document.getElementById('retTexto').value || "").trim() || "Conversa no WhatsApp";
  var n = negocioId ? achar("negocios", negocioId) : null;

  var motivo = motivoBloqueio("crm_atividades", { tipo:"whats" });
  if(motivo){ falha(motivo); return; }

  if(n){
    var pp = lerProxPasso('rp');
    if(!pp || !pp.ok){ falha((pp && pp.erro) || "Marque o próximo passo com tipo e data."); return; }
    // O proximo passo vai em dados.prox, que é exatamente o que
    // lerProxPasso() devolve. Mandar proxTipo e proxData soltos na raiz
    // entra no registro e NAO mexe no proximo passo do negocio.
    RET_SALVANDO = true;
    registrarAtividade(negocioId, {
      tipo:"whats", texto:texto.slice(0,1200), quando:hojeISO(),
      prox:pp
    }).then(function(){
      RET_SALVANDO = false;
      fecharFolha(); toast("Registrado", "ok"); redesenhar();
    }).catch(function(e){
      falha("Não deu pra salvar: " + ((e && e.message) || "erro"));
    });
    return;
  }

  // Sem negocio, é uma atividade de pessoa: 1 escrita, sem proximo passo.
  var id = idAtiv();
  RET_SALVANDO = true;
  gravar("crm_atividades", id, {
    negocioId:"", contatoId:contatoId, tipo:"whats", texto:texto.slice(0,1200),
    quando:hojeISO(), ts:Date.now(), por:(SESSAO && SESSAO.nome) || "", de:"", para:""
  }).then(function(){
    RET_SALVANDO = false;
    fecharFolha(); toast("Registrado", "ok");
  }).catch(function(e){
    falha("Não deu pra salvar: " + ((e && e.message) || "erro"));
  });
};

var ACESSOS_PEDIDOS = false;    // ja pedi a lista nesta sessao?

TELAS.acessos = function(){

      '<div class="et">Essa tela é do Admin</div>' +
      '<div class="ex">Seu perfil não mexe em acesso de ninguém.</div>' +
      '<button class="btn" data-a="ir" data-r="hoje">Voltar pro Hoje</button></div>';
  }

  // Leitura sob demanda, uma vez por sessao. O redesenhar vem do .then,
  // e a trava impede o laco de render pedindo a lista pra sempre.
  if(!ACESSOS.length && !ACESSOS_PEDIDOS){
    ACESSOS_PEDIDOS = true;
    DEPOIS.push(function(){
      carregarAcessos().then(function(){ redesenhar(); });
    });
  }

  var ativos = 0, admins = 0;
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].ativo !== false){ ativos++; if(ACESSOS[i].perfil === "admin") admins++; }
  }

  var h = "";
  if(SENHA_NOVA) h += acCartaoSenha();

  h += '<div class="card-head">' +
    '<div><div class="sec-title">Acessos' + ajuda("perfis") + '</div>' +
      '<div class="sec-sub">' + ACESSOS.length + (ACESSOS.length === 1 ? ' acesso' : ' acessos') +
      ' no total, ' + ativos + ' ativo' + (ativos === 1 ? '' : 's') + ', ' +
      admins + ' admin' + (admins === 1 ? '' : 's') + ' ativo' + (admins === 1 ? '' : 's') + '</div></div>' +
    '<div class="pills">' +
      '<button class="btn btn-sm" data-a="acRecarregar">Reler a lista</button>' +
      '<button class="btn btn-sm btn-primary" data-a="acNovo">Novo acesso</button>' +
    '</div></div>';

  if(!ACESSOS.length){
    h += '<div class="empty"><div class="ei">🔑</div>' +
      '<div class="et">Nenhum acesso na lista</div>' +
      '<div class="ex">Ou a lista ainda não chegou, ou o sistema está rodando só com a ' +
      'senha de recuperação. Crie o acesso de cada pessoa aqui e troque a senha de ' +
      'recuperação no código.</div>' +
      '<button class="btn btn-primary" data-a="acNovo">Criar o primeiro acesso</button></div>';
  } else {
    h += acTabela() + acCartoes();
  }

  // Aviso honesto. Sem isso alguem guarda contrato e valor de cliente aqui
  // achando que a senha protege o banco, e nao protege.
  h += '<div class="card" style="margin-top:18px">' +
    '<div class="h3">O que essa senha protege, e o que não protege' + ajuda("seguranca") + '</div>' +
    '<p class="tiny muted" style="margin-top:8px;line-height:1.6">' +
    'Quem tem o endereço da página consegue falar com o banco. A matriz de perfil é ' +
    'desenho de tela, não fechadura: ela decide o que aparece pra cada pessoa, não o que o ' +
    'banco aceita. Vale contra o erro do dia a dia e contra quem passa perto da tela, ' +
    'não contra quem quer entrar de verdade. Nada que não pode vazar deve ser guardado no CRM.' +
    '</p>' +
    '<p class="tiny muted" style="margin-top:8px;line-height:1.6">' +
    'A senha não é recuperável, só trocável: o que fica gravado é o embaralhado dela, nunca ela. ' +
    'E quem criou e quem registrou são o nome do ACESSO, não da pessoa, porque senha se ' +
    'empresta. Serve pra separar duas pessoas que confiam uma na outra, não como prova de nada.' +
    '</p></div>';

  return h;
};

function acBotoes(a){
  var eu = (SESSAO && SESSAO.acessoId === a.id);
  var ultimoAdmin = acEhUltimoAdmin(a);
  var h = '<button class="btn btn-sm" data-a="acNome" data-id="' + esc(a.id) + '">Editar nome</button>' +
          '<button class="btn btn-sm" data-a="acSenha" data-id="' + esc(a.id) + '">Trocar senha</button>' +
          '<button class="btn btn-sm" data-a="acPerfil" data-id="' + esc(a.id) + '">Trocar perfil</button>';
  if(a.ativo === false){
    h += '<button class="btn btn-sm btn-primary" data-a="acAtivar" data-id="' + esc(a.id) + '">Ativar</button>';
  } else {
    // Bloqueio visivel e desabilitado, com o motivo do lado. Sumir com o
    // botao faria o admin achar que a tela quebrou.
    var motivo = eu ? "não dá pra desativar o próprio acesso"
               : (ultimoAdmin ? "é o último admin ativo" : "");
    h += '<button class="btn btn-sm btn-danger" data-a="acDesativar" data-id="' + esc(a.id) + '"' +
         (motivo ? ' disabled' : '') + '>Desativar</button>' +
         (motivo ? '<span class="tiny" style="color:var(--text3)">' + esc(motivo) + '</span>' : '');
  }
  return h;
}

function acEhUltimoAdmin(a){
  if(a.perfil !== "admin" || a.ativo === false) return false;
  var n = 0;
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].perfil === "admin" && ACESSOS[i].ativo !== false) n++;
  }
  return n <= 1;
}
function acPorId(id){
  for(var i=0;i<ACESSOS.length;i++) if(ACESSOS[i].id === id) return ACESSOS[i];
  return null;
}
// Varre a lista INTEIRA, inclusive desativados. Se só olhasse os ativos,
// reativar depois criaria dois logins com o mesmo nome ou o mesmo hash, e
// a autoria de tudo passaria a depender da ordem do laco do login.
function acNomeRepetido(nome, exceto){
  var k = chave(nome);
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].id === exceto) continue;
    if(chave(ACESSOS[i].nome) === k) return ACESSOS[i];
  }
  return null;
}
function acHashRepetido(hash, exceto){
  if(hash && hash === ACESSO_RECUPERACAO.hash) return { nome:"Recuperação" };
  for(var i=0;i<ACESSOS.length;i++){
    if(ACESSOS[i].id === exceto) continue;
    if(ACESSOS[i].hash && ACESSOS[i].hash === hash) return ACESSOS[i];
  }
  return null;
}

        (bloqueio ? ' disabled' : '') + '>Criar acesso</button>' +

};

ACOES.acSalvarNovo = function(){
  // A lista local só recebe o acesso novo depois que o banco confirma, entao
  // sem esta trava o segundo toque passa pela checagem de nome repetido (que
  // ainda nao ve o primeiro) e cria DOIS acessos com o mesmo nome e senhas
  // diferentes, que é exatamente o que a checagem existe pra impedir.
  if(AC_SALVANDO) return;
  var err = document.getElementById('acErr');
  function falha(m){ AC_SALVANDO = false; if(err) err.textContent = m; }

  var motivo = motivoBloqueio("crm_acessos");
  if(motivo){ falha(motivo); return; }

  var nome = (document.getElementById('acNome').value || "").trim();
  var perfil = document.getElementById('acPerfilNovo').value;
  var tel = (document.getElementById('acTel').value || "").trim();
  if(nome.length < 2){ falha("Escreva o nome do acesso."); return; }
  if(!PERFIS[perfil]){ falha("Escolha um perfil."); return; }

  var rep = acNomeRepetido(nome, null);
  if(rep){
    falha('Já existe um acesso chamado "' + rep.nome + '" (' +
          (rep.ativo === false ? "desativado" : "ativo") +
          '). Reative ou troque a senha dele, senão ficam dois logins iguais e ' +
          'ninguém sabe quem registrou o que.');
    return;
  }

  var senha = senhaGerada();
  var id = idNovo("ac");
  AC_SALVANDO = true;
  err.textContent = "Criando...";

  sha256(senha).then(function(h){
    var colisao = acHashRepetido(h, null);
    if(colisao) throw new Error('Essa senha sorteada já é de "' + colisao.nome + '". Tente de novo.');
    var doc = {
      id:id, nome:nome.slice(0,60), perfil:perfil, hash:h, ativo:true,
      criadoEm:hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || ""
    };
    // A lista local só muda depois que o banco confirma, porque aqui a
    // lista NAO passa pelo cache do gravar() (crm_acessos fica fora dele).
    return gravar("crm_acessos", id, doc).then(function(){ ACESSOS.push(doc); });
  }).then(function(){
    AC_SALVANDO = false;
    SENHA_NOVA = { nome:nome, senha:senha, tel:tel };
    fecharFolha();
    toast("Acesso criado", "ok");
    ir("acessos");            // ja redesenha, e o cartao da senha aparece no topo
  }).catch(function(e){
    if(e && e.message === "sem-crypto"){
      falha("Esse navegador não embaralha senha aqui. Abra pelo endereço https, não por arquivo local.");
    } else {
      falha("Não deu: " + ((e && e.message) || "erro"));
    }
  });
};

/* ---------- editar o nome do acesso ----------
   Existe porque nome sai errado: erro de digitacao, apelido que nao pega,
   ou a pessoa que usa aquele acesso mudou. Sem isso a unica saida era
   desativar e criar outro, o que suja a lista e quebra a autoria dos
   registros antigos, que guardam o NOME de quem gravou.
   A senha e o perfil nao se tocam aqui: cada um tem o proprio botao.  */
ACOES.acNome = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  var bloqueio = motivoBloqueio("crm_acessos");
  folha("Editar nome do acesso",
    '<form class="form" id="anForm" data-a="acSalvarNome">' +
      '<input type="hidden" id="anId" value="' + esc(a.id) + '">' +
      '<div class="fld"><label>Nome</label>' +
        '<input class="inp" id="anNome" maxlength="60" autocomplete="off" value="' + esc(a.nome || "") + '">' +
        '<div class="hint">É o nome que aparece na autoria dos registros daqui pra frente. ' +
        'O que já foi gravado guarda o nome antigo, porque registro não se reescreve.</div></div>' +
      '<div class="fld"><div class="err" id="anErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Cancelar</button>' +
    '<div style="flex:1;min-width:0">' +
      '<button class="btn btn-primary btn-block" type="submit" form="anForm"' +
        (bloqueio ? ' disabled' : '') + '>Salvar nome</button>' +
      cadMotivo(bloqueio) + '</div>');
};
ACOES.acSalvarNome = function(){
  var err = document.getElementById('anErr');
  function falha(m){ if(err) err.textContent = m; }
  var motivo = motivoBloqueio("crm_acessos");
  if(motivo){ falha(motivo); return; }

  var id = document.getElementById('anId').value;
  var a = acPorId(id);
  if(!a){ falha("Esse acesso não está mais na lista."); return; }
  var nome = (document.getElementById('anNome').value || "").trim();
  if(nome.length < 2){ falha("Escreva o nome do acesso."); return; }
  if(nome === a.nome){ fecharFolha(); return; }

  // Varre a lista inteira, inclusive desativados: dois logins com o mesmo
  // nome fazem a autoria dos registros deixar de distinguir quem foi.
  var rep = acNomeRepetido(nome, id);
  if(rep){
    falha('Já existe um acesso chamado "' + rep.nome + '" (' +
          (rep.ativo === false ? "desativado" : "ativo") + ').');
    return;
  }

  var antigo = a.nome;
  err.textContent = "Salvando...";
  a.nome = nome.slice(0,60);
  gravar("crm_acessos", id, { nome:a.nome })
    .then(function(){
      // Se o nome trocado for o meu, o cabecalho tem que acompanhar na hora.
      if(SESSAO && SESSAO.acessoId === id){
        SESSAO.nome = a.nome; guardar("sessao", SESSAO); pintarCabecalho();
      }
      fecharFolha(); toast("Nome trocado", "ok"); redesenhar();
    })
    .catch(function(e){
      a.nome = antigo;
      falha("Não deu: " + ((e && e.message) || "erro"));
    });
};

ACOES.acSalvarSenha = function(){
  var err = document.getElementById('asErr');
  function falha(m){ if(err) err.textContent = m; }

      falha("Não deu: " + ((e && e.message) || "erro"));

ACOES.acSalvarPerfil = function(){
  var err = document.getElementById('apErr');
  function falha(m){ if(err) err.textContent = m; }
  var motivo = motivoBloqueio("crm_acessos");
  if(motivo){ falha(motivo); return; }

  var id = document.getElementById('apId').value;
  var a = acPorId(id);
  if(!a){ falha("Esse acesso não está mais na lista."); return; }
  var novo = document.getElementById('apPerfil').value;
  if(!PERFIS[novo]){ falha("Perfil desconhecido."); return; }
  if(novo === a.perfil){ fecharFolha(); return; }
  if(novo !== "admin" && acEhUltimoAdmin(a)){
    falha("É o último admin ativo. Promova outra pessoa antes.");
    return;
  }

  var antes = a.perfil;
  a.perfil = novo;                       // otimista, igual ao resto do sistema
  gravar("crm_acessos", id, { perfil:novo })
    .then(function(){
      fecharFolha();
      toast("Perfil de " + a.nome + " agora é " + (PERFIS[novo].rotulo || novo), "ok");
      redesenhar();
    })
    .catch(function(e){
      a.perfil = antes;
      falha("Não deu: " + ((e && e.message) || "erro"));
      redesenhar();
    });
};

/* ---------- ativar e desativar. NAO existe apagar ---------- */
ACOES.acDesativar = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  if(SESSAO && SESSAO.acessoId === a.id){
    toast("Não dá pra desativar o próprio acesso", "bad"); return;
  }
  if(acEhUltimoAdmin(a)){ toast("É o último admin ativo", "bad"); return; }
  folha("Desativar " + a.nome,
    '<p class="muted2">A senha dessa pessoa para de funcionar na próxima vez que ela abrir o CRM. ' +
    'Tudo que ela registrou continua no lugar, com o nome dela.</p>' +
    '<p class="tiny muted" style="margin-top:10px">Nada é apagado: o acesso fica na lista como ' +
    'desativado e dá pra reativar quando quiser. Apagar de verdade faria a autoria dos ' +
    'registros antigos apontar pra ninguém.</p>',
    '<button class="btn btn-ghost" type="button" data-a="fecharFolha">Deixar como está</button>' +
    '<button class="btn btn-danger" type="button" data-a="acDesativarMesmo" data-id="' +
      esc(a.id) + '">Desativar</button>');
};
ACOES.acDesativarMesmo = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  // As duas guardas sao repetidas aqui, e nao só na folha que abre esta
  // confirmacao, porque esta é a porta que ESCREVE. Entre abrir a folha e
  // confirmar cabe um "Reler a lista" ou a desativacao feita por outro admin
  // no aparelho dele, e a pessoa da folha aberta vira o ultimo admin ativo.
  // Confirmar ali derrubaria o ultimo admin e ninguem mais abriria esta tela.
  if(SESSAO && SESSAO.acessoId === a.id){
    fecharFolha(); toast("Não dá pra desativar o próprio acesso", "bad"); return;
  }
  if(acEhUltimoAdmin(a)){
    fecharFolha(); toast("É o último admin ativo. Promova outra pessoa a admin antes.", "bad"); return;
  }
  a.ativo = false;
  gravar("crm_acessos", a.id, { ativo:false })
    .then(function(){ fecharFolha(); toast(a.nome + " não entra mais", "ok"); redesenhar(); })
    .catch(function(e){ a.ativo = true; toast("Não deu: " + ((e && e.message) || "erro"), "bad"); redesenhar(); });
};
ACOES.acAtivar = function(el){
  var a = acPorId(el.getAttribute('data-id'));
  if(!a) return;
  a.ativo = true;
  gravar("crm_acessos", a.id, { ativo:true })
    .then(function(){
      toast(a.nome + " entra de novo com a senha antiga", "ok");
      redesenhar();
    })
    .catch(function(e){ a.ativo = false; toast("Não deu: " + ((e && e.message) || "erro"), "bad"); redesenhar(); });
};

/* =====================================================================
   CRM LIME - TUTORIAL

   A tela de aprender. Quem abre aqui pode nunca ter usado um CRM, e
   pode ser a pessoa que ja usou cinco. Os dois precisam achar o que
   querem sem ler tudo.

   POR QUE OS DESENHOS SAO SVG ESCRITO NA MAO, E NAO PRINT DE TELA
   Print vira mentira. Trocou um botao de lugar, mudou um rotulo, e a
   imagem continua mostrando a versao antiga sem avisar ninguem. Como o
   deploy da casa e upload de UM arquivo, imagem separada ainda teria o
   problema de ficar pra tras num upload esquecido. Desenho em SVG mora
   dentro do proprio index.html, pesa alguns kilobytes e usa as mesmas
   cores do sistema, entao acompanha o tema.

   MELHOR AINDA: o que da pra desenhar a partir do codigo e desenhado a
   partir do codigo. Os funis abaixo saem de FUNIL e de TIPOS. Se alguem
   mexer num estagio amanha, o desenho do tutorial muda junto, sozinho.
   ===================================================================== */

/* ---------- tijolos de desenho ---------- */
/* Caixa com titulo, o formato que se repete em quase toda figura. */
function tuCaixa(x, y, w, h, titulo, cor, preench){
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" ' +
         'fill="' + (preench || "#1A1A1A") + '" stroke="' + (cor || "rgba(255,255,255,0.13)") + '"/>' +
         (titulo ? tuTexto(x + 12, y + 22, titulo, 13, "#FFFFFF", 600) : "");
}
function tuTexto(x, y, s, tam, cor, peso, ancora){
  return '<text x="' + x + '" y="' + y + '" font-size="' + (tam || 12) + '" ' +
         'fill="' + (cor || "#ADADAD") + '" font-weight="' + (peso || 400) + '" ' +
         'font-family="Inter,system-ui,sans-serif"' +
         (ancora ? ' text-anchor="' + ancora + '"' : '') + '>' + esc(s) + '</text>';
}
/* A ponta acompanha o sentido: a seta de volta do ciclo anda da direita
   pra esquerda, e com a ponta fixa pra direita ela apontaria pro lado
   errado, dizendo o contrario do desenho. */
function tuSeta(x1, y, x2, cor){
  var c = cor || "rgba(255,255,255,0.30)";
  var s = (x2 >= x1) ? 1 : -1;
  return '<line x1="' + x1 + '" y1="' + y + '" x2="' + (x2 - 7 * s) + '" y2="' + y + '" ' +
         'stroke="' + c + '" stroke-width="1.5"/>' +
         '<path d="M' + (x2 - 8 * s) + ' ' + (y - 4) + ' L' + x2 + ' ' + y + ' L' + (x2 - 8 * s) + ' ' + (y + 4) + 'Z" fill="' + c + '"/>';
}
/* Uma figura inteira: moldura, legenda embaixo e rotulo de acessibilidade. */
function tuFig(vbW, vbH, dentro, legenda){
  return '<figure class="tu-fig">' +
         '<svg viewBox="0 0 ' + vbW + ' ' + vbH + '" role="img" aria-label="' + esc(legenda) + '">' +
         dentro + '</svg>' +
         '<figcaption>' + esc(legenda) + '</figcaption></figure>';
}

/* ---------- figura 1: as abas e pra que serve cada uma ---------- */
function tuFigAbas(){
  var itens = [
    ["⚡", "Hoje",     "o que cobrar agora"],
    ["▦", "Funil",    "tudo em aberto, por etapa"],
    ["💼", "Negócios", "a lista com busca e filtro"],

    ["📊", "Painel",   "os números do mês"],
    ["🔑", "Acessos",  "quem entra e com que poder"]
  ];
  var d = tuCaixa(6, 6, 748, 132, "", "rgba(255,255,255,0.07)", "#141414"), i;
  for(i=0;i<itens.length;i++){
    var x = 18 + i * 123;
    d += tuCaixa(x, 22, 112, 100, "", (i === 0 ? "rgba(200,255,0,0.25)" : "rgba(255,255,255,0.13)"),
                 (i === 0 ? "rgba(200,255,0,0.10)" : "#1A1A1A"));
    d += tuTexto(x + 56, 56, itens[i][0], 20, "#FFFFFF", 400, "middle");
    d += tuTexto(x + 56, 80, itens[i][1], 13, (i === 0 ? "#C8FF00" : "#FFFFFF"), 600, "middle");
    var p = itens[i][2].split(" "), linha1 = "", linha2 = "";
    for(var j=0;j<p.length;j++){
      if((linha1 + " " + p[j]).length <= 16 && !linha2) linha1 += (linha1 ? " " : "") + p[j];
      else linha2 += (linha2 ? " " : "") + p[j];
    }
    d += tuTexto(x + 56, 98, linha1, 10.5, "#ADADAD", 400, "middle");
    if(linha2) d += tuTexto(x + 56, 111, linha2, 10.5, "#ADADAD", 400, "middle");

  return tuFig(760, 144, d, "As seis abas do menu da esquerda. Acessos só aparece pra quem é Admin.");
}

/* ---------- figura 2: os dois funis, desenhados a partir de FUNIL ---------- */
function tuFigFunis(){
  var d = "", linha = 0, t;
  for(t=0;t<TIPOS.length;t++){
    var k = TIPOS[t].k, f = FUNIL[k] || [];
    var yTopo = 10 + linha * 118;
    d += tuTexto(8, yTopo + 16, TIPOS[t].ic + "  " + TIPOS[t].rotLongo, 14, "#C8FF00", 700);
    var larg = Math.floor((744 - (f.length - 1) * 26) / f.length);
    for(var i=0;i<f.length;i++){
      var x = 8 + i * (larg + 26), y = yTopo + 30;
      d += tuCaixa(x, y, larg, 58, "", "rgba(255,255,255,0.13)");
      d += tuTexto(x + larg / 2, y + 24, f[i].rot, 11.5, "#FFFFFF", 600, "middle");
      d += tuTexto(x + larg / 2, y + 43, pct(f[i].p * 100, 0) + " de chance", 10, "#ADADAD", 400, "middle");
      if(i < f.length - 1) d += tuSeta(x + larg + 4, y + 29, x + larg + 22);
    }
    d += tuTexto(8, yTopo + 105, "Ganho fecha o negócio. Perdido pede o motivo.", 10.5, "#ADADAD");
    linha++;
  }
  return tuFig(760, 246, d,
    "Os dois funis. Agência anda em quatro etapas, patrocínio em cinco. A porcentagem é a chance média de fechar em cada etapa.");
}

    'em amarelo na aba Pessoas, pra você completar depois.</p>');

  h += tuPasso(9, "O Painel, e o que cada número quer dizer",
    '<p>Todo número no Painel tem uma bolinha <b>?</b> do lado. Passe o mouse (ou toque, no celular) ' +
    'e ele explica de onde saiu a conta.</p>' +
    '<p>Duas leituras não confunda: <b>fechado no mês</b> é o que virou contrato neste mês. ' +
    '<b>Caixa</b> é dinheiro que entrou. O CRM não é sistema financeiro, então ele fala de contrato fechado, não de boleto pago.</p>' +
    '<p class="tiny" style="color:var(--text2)">Média só aparece com 3 casos ou mais. Com menos que isso, ' +
    'o CRM lista os valores um a um, porque média de dois números engana.</p>');

  h += tuPasso(10, "Acessos: quem entra e com que poder",
    '<p>Só quem é Admin vê essa aba. <b>Admin</b> mexe em tudo e cria gente. ' +
    '<b>SDR</b> e <b>Closer</b> operam os negócios com exatamente o mesmo poder, e a diferença ' +
    'entre os dois é o papel, não a permissão. <b>Gestor</b> vê tudo mas só registra observação.</p>' +
    '<p>Leitura é o perfil pra quem quer acompanhar sem risco de mexer sem querer. ' +
    'Quem está em Leitura vê os botões desabilitados com o motivo escrito, em vez de clicar e dar erro.</p>');

  h += tuPasso(11, "A regra de ouro do que escrever aqui",
    '<p>Esta página está aberta pra quem tiver o endereço. Então vale uma régua simples: ' +
    '<b>se você não mandaria num grupo de WhatsApp com 50 pessoas, não escreve aqui.</b></p>' +
    '<p>Nada de CPF, CNPJ, dado bancário, cláusula de contrato ou comentário pessoal sobre alguém. ' +
    'Nome da empresa, valor, etapa e o que foi conversado: isso sim.</p>');

  h += tuPasso(12, "Sem internet, continua funcionando",
    '<p>O CRM guarda o que você fez no próprio aparelho e manda pro servidor quando a conexão voltar. ' +
    'O indicador no topo mostra o estado: sincronizado, gravando, ou pendente.</p>' +
    '<p class="tiny" style="color:var(--text2)">Só não feche o aplicativo com pendência e troque de celular no mesmo minuto. ' +
    'Espere o indicador ficar verde.</p>');

  h += '<div class="card" style="margin-top:14px">' +
    '<div class="h3" style="margin:0 0 8px">Travou em alguma coisa?</div>' +
    '<p style="margin:0 0 6px">Procure a bolinha <b>?</b> perto do que você não entendeu. ' +
    'Tem uma em cada termo do sistema, e ela explica em duas linhas, sem palavra difícil.</p>' +
    '<p class="tiny" style="margin:0;color:var(--text2)">Versão ' + esc(VERSAO) + '</p></div>';

  return h;
};
