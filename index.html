  ir("negocio/" + el.getAttribute('data-id'));
};

/* =====================================================================
   A FOLHA DE ESTAGIO, O CAMINHO UNICO DE MOVER

   NAO EXISTE ARRASTAR na versao 1, e nao existe atalho de segurar: no
   iOS o long press dispara sozinho no meio de uma rolagem e move o
   negocio sem ninguem ver o toast. Dois toques com o pedagio pago
   (escolher o estagio, confirmar o proximo passo) funcionam igual no
   computador e no celular, e o Desfazer de 8 segundos cobre o erro.
   ===================================================================== */
function abrirFolhaEstagio(id){
  var n = achar("negocios", id);
  if(!n){ toast("Negócio não encontrado", "bad"); return; }
  var f = FUNIL[n.tipo] || [];
  var iAtual = idxEstagio(n);
  var parado = diasVencido(n.estagioDesde || n.criadoEm);
  // Negocio fechado nao troca de estagio. O estagio de um negocio fechado
  // é a resposta pra "onde o funil vaza", e trocar depois de fechado
  // apaga essa resposta sem deixar rastro. O stepper da tela do negocio
  // continua clicavel quando o negocio está fechado, entao a guarda
  // precisa morar aqui, e nao só em quem chama.
  var fechado = n.status !== "aberto";
  var motivo = fechado
    ? ("Negócio " + (n.status === "ganho" ? "ganho" : n.status === "perdido" ? "perdido" : "encerrado") +
       " não muda de estágio. O estágio em que ele fechou é o que explica onde o funil vaza.")
    : motivoBloqueio("crm_negocios");

  var linhas = "";
  for(var i=0;i<f.length;i++){
    var e = f[i], atual = (i === iAtual);
    var selo = atual
      ? '<span class="tag tag-lime">aqui agora</span><span class="tiny muted">' +
        esc(fnPlural(parado, "dia", "dias")) + ' neste estágio, o limite é ' + e.teto + ' dias</span>'
      : (i < iAtual ? '<span class="tag">voltar</span>' : '');
    var dentro = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="dot" style="background:${atual ? "var(--lime)" : "var(--text3)"}"></span>
        <b style="font-family:var(--disp);font-size:15px;letter-spacing:.4px;text-transform:uppercase">
          ${(i+1)}. ${esc(e.rot)}</b>
        <span class="tiny muted">${Math.round(e.p*100)}% de chance</span>
        ${selo}
      </div>
      <div class="tiny muted" style="margin-top:5px;white-space:normal;line-height:1.45">
        Sai daqui quando: ${esc(e.saida || "")}</div>`;
    var caixa = "display:block;text-align:left;padding:11px 13px;width:100%;";
    if(atual){
      // O estagio de agora é uma caixa, nao um botao desabilitado: com
      // opacity de botao morto, justamente a linha de referencia da folha
      // fica a mais apagada da tela.
      linhas += '<div class="btn" style="' + caixa + 'border-color:var(--lime);background:var(--lime-dim);cursor:default">' +
                dentro + '</div>';
    } else {
      // Acao sem permissao fica VISIVEL e desabilitada, com o motivo
      // embaixo. Botao que some faz o gestor achar que o CRM quebrou.
      var att = motivo ? 'disabled'
        : 'data-a="funilEscolher" data-id="' + esc(n.id) + '" data-k="' + esc(e.k) + '"';
      linhas += '<button class="btn btn-block" ' + att + ' style="' + caixa + '">' + dentro + '</button>';
    }
  }

  var corpo = `<div class="form">
    <div class="tiny muted">${esc(n.empresa || "")} ${n.titulo ? "&middot; " + esc(n.titulo) : ""}<br>
      Funil de ${esc(n.tipo === "agencia" ? "agência" : "patrocínio")}, ${f.length} estágios.
      ${esc(porQue(n))}</div>
    ${linhas}
    ${motivo ? '<div class="tiny" style="color:var(--text3)">' + esc(motivo) + '</div>' : ''}
    <div class="tiny muted">Pular estágio pode. Voltar também pode, e vira uma linha na linha do tempo.</div>
  </div>`;

  folha("Mover de estágio",
    corpo,
    '<button class="btn btn-ghost" data-a="fecharFolha">Fechar</button>' +
    '<button class="btn" data-a="funilAbrirNegocio" data-id="' + esc(n.id) + '">Abrir o negócio</button>');
}

ACOES.funilMover = function(el){ abrirFolhaEstagio(el.getAttribute('data-id')); };
ACOES.funilEscolher = function(el){
  fnPasso2(el.getAttribute('data-id'), el.getAttribute('data-k'));
};

/* Passo 2, NA MESMA FOLHA: o proximo passo ja sugerido pelo estagio de
   DESTINO, e os campos que o destino exige. Um botao Salvar. */
function fnPasso2(id, novoK){
  var n = achar("negocios", id);
  if(!n){ toast("Negócio não encontrado", "bad"); return; }
  var f = FUNIL[n.tipo] || [];
  var iAtual = idxEstagio(n), iNovo = 0;
  for(var i=0;i<f.length;i++) if(f[i].k === novoK) iNovo = i;
  var eAtual = f[iAtual] || { rot:"Estágio desconhecido" };
  var eNovo  = f[iNovo]  || { rot:"" };
  // A mesma guarda da primeira folha, de novo aqui: o passo 2 tem botao
  // Salvar proprio, e sem a guarda ele fica habilitado num negocio ja
  // fechado, prometendo uma acao que o gravar vai recusar (invariante 12
  // pede o botao visivel e DESABILITADO, com o motivo escrito).
  var motivo = n.status !== "aberto"
    ? ("Negócio " + (n.status === "ganho" ? "ganho" : n.status === "perdido" ? "perdido" : "encerrado") +
       " não muda de estágio. O estágio em que ele fechou é o que explica onde o funil vaza.")
    : motivoBloqueio("crm_negocios");

  // A sugestao de proximo passo tem que ser a do estagio de DESTINO, nao
  // a do atual: quem entra em Proposta cobra resposta, nao envia de novo.
  // O proximo passo ANTIGO sai da copia de proposito: blocoProxPasso da
  // preferencia ao que ja esta gravado no negocio, e com ele dentro a
  // folha reapresentaria o passo que acabou de ser cumprido, com a data
  // vencida, em vez da sugestao do destino. O pedagio é passo NOVO.
  var simulado = {};
  for(var kk in n) if(Object.prototype.hasOwnProperty.call(n, kk)) simulado[kk] = n[kk];
  simulado.estagio = novoK;
  simulado.proxTipo = ""; simulado.proxData = "";
  simulado.proxTexto = ""; simulado.proxHora = "";

  // Sem o data-a no form, o Enter no campo de data tambem para de
  // disparar o salvar bloqueado: o submit é delegado igual ao clique.
  var corpo = `<form class="form" ${motivo ? "" : `data-a="funilSalvarEstagio"`} data-id="${esc(n.id)}" data-k="${esc(novoK)}">
    <div class="card" style="padding:12px 14px;background:var(--card2)">
      <div class="tiny muted">${esc(n.empresa || "")}</div>
      <div style="font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.4px;margin-top:2px">
        ${esc(eAtual.rot)} <span style="color:var(--lime)">&rsaquo;</span> ${esc(eNovo.rot)}</div>
      <div class="tiny muted" style="margin-top:4px">
        ${iNovo < iAtual ? "Voltar estágio pode, e vira linha na linha do tempo." :
          iNovo > iAtual + 1 ? "Pular estágio pode: o sistema guarda o maior estágio alcançado." :
          "Avanço de um estágio."}</div>
    </div>
    ${fnGateProposta(n, iNovo)}
    ${blocoProxPasso("fe", simulado, true)}
    <div class="fld"><div class="err" id="feErr"></div></div>
    <p class="tiny muted">Toda mudança de estágio pede um próximo passo novo. É o pedágio de mover o
      cartão, e é o que impede o funil de virar decoração que muda de cor.</p>
  </form>`;

  var rodape = '<button class="btn btn-ghost" data-a="funilMover" data-id="' + esc(n.id) + '">Voltar</button>' +
    (motivo
      ? '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">' +
          '<button class="btn btn-primary" disabled>Salvar</button>' +
          '<span class="tiny" style="color:var(--text3)">' + esc(motivo) + '</span></div>'
      : '<button class="btn btn-primary" data-a="funilSalvarEstagio" data-id="' + esc(n.id) +
        '" data-k="' + esc(novoK) + '">Salvar</button>');

  folha("Mover pra " + (eNovo.rot || "novo estágio"), corpo, rodape);
}

/* Entrar em Proposta (ou em qualquer estagio depois dela) exige fee,
   meses e previsao confirmada. Vale pra frente toda e nao so pra
   ag_proposta porque pular de Diagnostico direto pra Negociacao passaria
   por cima da regra, e é justamente onde o valor chutado entra e envenena
   a previsao do mes. Antes disso o valor é opcional de proposito. */
function fnGateProposta(n, iNovo){
  if(n.tipo !== "agencia") return "";
  var iProp = 0, f = FUNIL.agencia;
  for(var i=0;i<f.length;i++) if(f[i].k === "ag_proposta") iProp = i;
  if(iNovo < iProp) return "";

  var ag = n.ag || {};
  var faltaMrr   = !(ag.mrr > 0);
  var faltaMeses = (typeof ag.meses !== "number");
  var faltaPrev  = !n.prevFechamento || n.prevEstimada === true;
  if(!faltaMrr && !faltaMeses && !faltaPrev) return "";

  var opcoes = [3, 6, 12, 18, 24];
  // Contrato com duracao fora da lista (9 meses, por exemplo) entra como
  // opcao propria. Sem ela nenhum <option> nasce marcado, o navegador
  // mostra o primeiro e salvar trocaria 9 meses por 3 sem ninguem ver,
  // encolhendo o valor do contrato inteiro na previsao.
  if(typeof ag.meses === "number" && ag.meses > 0 && opcoes.indexOf(ag.meses) === -1){
    opcoes.push(ag.meses);
    opcoes.sort(function(x, y){ return x - y; });
  }
  var sel = "";
  for(var j=0;j<opcoes.length;j++){
    sel += '<option value="' + opcoes[j] + '"' + (ag.meses === opcoes[j] ? " selected" : "") + '>' +
           opcoes[j] + ' meses</option>';
  }
  sel += '<option value="0"' + (ag.meses === 0 ? " selected" : "") + '>indeterminado (conta 12 meses)</option>';

  return `<div class="card" style="padding:14px;border-color:var(--lime-border)">
    <div class="h3">Antes de entrar em proposta</div>
    <div class="tiny muted" style="margin-bottom:12px">Proposta em análise só existe com número.
      Fee chutado no dia 1 vira R$ 1.000 de mentira e envenena a previsão do mês.</div>
    <div class="grid2">
      <div class="fld">
        <label>Fee por mês (R$)</label>
        <input class="inp" id="feg_mrr" inputmode="decimal" placeholder="3.500"
               value="${ag.mrr > 0 ? esc(String(ag.mrr)) : ""}">
      </div>
      <div class="fld">
        <label>Duração do contrato</label>
        <select class="inp" id="feg_meses">
          ${faltaMeses ? '<option value="">escolha</option>' : ''}
          ${sel}
        </select>
      </div>
    </div>
    <div class="fld" style="margin-top:12px">
      <label>Previsão de fechamento</label>
      <input class="inp" id="feg_prev" type="date" value="${esc(String(n.prevFechamento || "").slice(0,10))}">
      <div class="hint">${n.prevEstimada === true ? "Hoje está como data estimada pelo sistema. Confirme ou ajuste." : "Confirme a data com o cliente."}</div>
    </div>
  </div>`;
}

ACOES.funilSalvarEstagio = function(el){
  var id = el.getAttribute('data-id'), novoK = el.getAttribute('data-k');
  var n = achar("negocios", id);
  var err = document.getElementById('feErr');
  function ruim(msg){ if(err) err.textContent = msg; else toast(msg, "bad"); }
  if(!n){ ruim("Negócio não encontrado."); return; }

  var motivo = motivoBloqueio("crm_negocios");
  if(motivo){ toast(motivo, "bad"); return; }

  // A mesma guarda da folha, de novo na hora de gravar (regra 11 da secao
  // 4.4 manda checar nos dois momentos): a folha pode ter sido aberta
  // antes de o negocio fechar em outra aba.
  if(n.status !== "aberto"){
    ruim("Negócio já fechado não muda de estágio. O estágio em que ele fechou é o que explica onde o funil vaza.");
    return;
  }

  var f = FUNIL[n.tipo] || [], iNovo = -1, i;
  for(i=0;i<f.length;i++) if(f[i].k === novoK) iNovo = i;
  // Estagio que nao existe no funil DESTE negocio nao entra no banco. Sem
  // isso um data-k errado gravaria "pt_contrato" num negocio de agencia,
  // que depois cai na primeira coluna com o selo de estagio fora do funil
  // e ninguem sabe de onde veio.
  if(iNovo < 0){
    ruim("Esse estágio não existe no funil de " + (n.tipo === "agencia" ? "agência" : "patrocínio") + ".");
    return;
  }
  var eNovo = f[iNovo] || { rot:"" };
  var eAtual = estagioDe(n);

  // Segundo toque no Salvar. No 4G do estacionamento a folha demora a
  // fechar e o dedo bate de novo: a folha nunca oferece o estagio de
  // agora (ele é uma caixa, nao um botao), entao chegar aqui com o
  // estagio ja igual só acontece por toque repetido ou folha velha.
  // Sem esta guarda o segundo toque regrava estagioDesde com hoje, o que
  // zera o contador de dias parado, e deixa uma linha "De Negociação
  // para Negociação" na linha do tempo, que É o log da casa.
  if(n.estagio === novoK){
    ruim("Esse negócio já está em " + (eNovo.rot || "esse estágio") + ".");
    return;
  }

  // maiorEstagio é INDICE numerico. Valor legado nao numerico (a chave do
  // estagio, por exemplo) viraria NaN no Math.max e o NaN iria pro banco.
  var maiorAntes = Number(n.maiorEstagio);
  if(!isFinite(maiorAntes)) maiorAntes = 0;
  var dados = {
    estagio: novoK,
    estagioDesde: hojeISO(),
    maiorEstagio: Math.max(maiorAntes, iNovo)
  };
  var antes = {
    estagio: n.estagio || "",
    estagioDesde: n.estagioDesde || hojeISO(),
    maiorEstagio: maiorAntes,
    proxTipo: n.proxTipo || "",
    proxData: n.proxData || "",
    proxTexto: n.proxTexto || "",
    proxHora: n.proxHora || ""
  };

  /* campos que o estagio de proposta exige */
  var campoMrr = document.getElementById('feg_mrr');
  if(campoMrr){
    var mrr = lerValor(campoMrr.value);
    var mesesTxt = (document.getElementById('feg_meses') || {}).value;
    var prev = (document.getElementById('feg_prev') || {}).value;
    if(!(mrr > 0)){ ruim("O fee por mês precisa de um valor pra entrar em proposta."); return; }
    if(mesesTxt === "" || mesesTxt == null){ ruim("Escolha a duração do contrato."); return; }
    if(!prev){ ruim("Confirme a previsão de fechamento."); return; }
    var ag = {};
    for(var a in (n.ag || {})) if(Object.prototype.hasOwnProperty.call(n.ag, a)) ag[a] = n.ag[a];
    ag.mrr = Math.round(mrr);
    ag.meses = Number(mesesTxt);
    // mrrInicial é gravado uma vez e nunca sobrescrito: é o que mostra o
    // desconto que a negociacao comeu.
    if(!(ag.mrrInicial > 0)) ag.mrrInicial = ag.mrr;
    dados.ag = ag;
    dados.prevFechamento = prev;
    dados.prevEstimada = false;
    dados.valorRef = valorRefDe({ tipo:n.tipo, ag:ag, pt:n.pt });
    antes.ag = n.ag || null;
    antes.prevFechamento = n.prevFechamento || "";
    antes.prevEstimada = n.prevEstimada === true;
    antes.valorRef = Number(n.valorRef || 0);
  }

  /* O pedagio: proximo passo novo, com tipo e data. A caixinha "Marcar o
     próximo passo" do bloco pode ser desmarcada, e nesse caso lerProxPasso
     devolve ok:true com os campos vazios de proposito, porque em outras
     telas marcar o passo é opcional. Aqui nao é: sem conferir o ligado,
     desmarcar viraria a saida pra mover o cartao sem pagar o pedagio, e o
     funil volta a ser decoracao que muda de cor (regra 3 da secao 4.4). */
  var p = lerProxPasso("fe");
  if(!p || !p.ok || p.ligado === false || !p.proxTipo || !p.proxData){
    ruim((p && p.erro) || "Marque o próximo passo com tipo e data. Toda mudança de estágio pede um.");
    return;
  }
  dados.proxTipo  = p.proxTipo;
  dados.proxData  = p.proxData;
  dados.proxTexto = p.proxTexto || "";
  dados.proxHora  = p.proxHora || "";

  // semToque:true porque mover o cartao nao é falar com o cliente. Sem
  // ele, registrarAtividade carimba ultimoToqueEm com hoje e o semaforo
  // passa a dizer "0 dias sem contato" pra quem só arrumou o funil.
  var ativ = {
    tipo: "estagio",
    semToque: true,
    de: n.estagio || "",
    para: novoK,
    quando: hojeISO(),
    ts: Date.now(),
    texto: "De " + (eAtual.rot || "?") + " para " + (eNovo.rot || "?") +
           (iNovo < idxEstagio(n) ? " (voltou)" : "")
  };

  gravar("crm_negocios", id, dados)
    .then(function(){ return registrarAtividade(id, ativ); })
    .then(function(){
      fecharFolha();
      // Toast só depois do servidor confirmar (invariante 8), com
      // Desfazer de 8 segundos em vez de confirmacao dupla.
      comDesfazer("Movido pra " + (eNovo.rot || "novo estágio"), "crm_negocios", id, antes);
      redesenhar();
    })
    .catch(function(e){ ruim("Não deu pra salvar: " + ((e && e.message) || "erro")); });
};

/* =====================================================================
   FOLHA DA VIRADA DE EDICAO
   Quem passou de Mapeado se resolve um a um, porque cada um desses é uma
   conversa real que merece uma decisao. Quem ficou em Mapeado sai em
   LOTE, e essa é a unica excecao da casa a regra do nada em massa:
   aqui nao é silenciar alarme, é fechar um ciclo que acabou de verdade
   numa data conhecida.
   ===================================================================== */
function fnFolhaVirada(edK){
  var ed = edicaoDe(edK);
  if(!ed){ toast("Edição não encontrada", "bad"); return; }
  var prox = fnProximaEdicao(ed);
  var motivo = motivoBloqueio("crm_negocios");

  var abertos = lista("negocios").filter(function(n){
    return n.status === "aberto" && n.tipo === "patrocinio" && n.pt && n.pt.edicao === edK;
  });
  var passou = [], mapeados = [], i;
  for(i=0;i<abertos.length;i++){
    if(idxEstagio(abertos[i]) > 0) passou.push(abertos[i]); else mapeados.push(abertos[i]);
  }
  passou.sort(function(a,b){ return valorOrdem(b) - valorOrdem(a); });
  mapeados.sort(function(a,b){ return valorOrdem(b) - valorOrdem(a); });

  var h = `<div class="form">
    <div class="tiny muted">${esc(ed.rot)} aconteceu em ${esc(dataBR(ed.dataEvento))}.
      ${esc(fnPlural(abertos.length, "negócio segue aberto", "negócios seguem abertos"))} nessa edição.</div>`;

  if(passou.length){
    h += '<div class="sec-title">Um a um, ' + esc(fnPlural(passou.length, "negócio", "negócios")) + '</div>' +
         '<div class="sec-sub">Esses saíram de Mapeado, ou seja, teve conversa. Cada um merece uma decisão.</div>';
    for(i=0;i<passou.length;i++){
      var n = passou[i], e = estagioDe(n), v = (n.pt && n.pt.valor) || 0;
      var btnMigrar = (motivo || !prox)
        ? '<button class="btn btn-sm" disabled>Migrar</button>'
        : '<button class="btn btn-sm" data-a="funilMigrar" data-id="' + esc(n.id) + '" data-e="' + esc(prox.k) +
          '" data-de="' + esc(edK) + '">Migrar pra ' + esc(prox.rot) + '</button>';
      var btnPerder = motivo
        ? '<button class="btn btn-sm btn-danger" disabled>Perder</button>'
        : '<button class="btn btn-sm btn-danger" data-a="funilPerder" data-id="' + esc(n.id) +
          '" data-de="' + esc(edK) + '">Perder</button>';
      h += `<div class="card" style="padding:12px 14px">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          <b class="truncate" style="flex:1;min-width:120px;font-family:var(--disp);font-size:15px;
             text-transform:uppercase;letter-spacing:.4px">${esc(n.empresa || "sem empresa")}</b>
          <span class="nowrap" style="font-family:var(--disp);font-weight:800;color:var(--lime)">
            ${v > 0 ? esc(brl(v)) : "valor a definir"}</span>
        </div>
        <div class="tiny muted" style="margin-top:3px">${esc(e.rot)}, ${esc(fnPlural(diasVencido(n.estagioDesde || n.criadoEm), "dia", "dias"))} parado</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${btnPerder}${btnMigrar}</div>
        ${(!prox && !motivo) ? '<div class="tiny" style="color:var(--text3);margin-top:6px">Não há edição futura cadastrada pra onde migrar.</div>' : ''}
        ${motivo ? '<div class="tiny" style="color:var(--text3);margin-top:6px">' + esc(motivo) + '</div>' : ''}
      </div>`;
    }
  }

  if(mapeados.length){
    h += '<div class="sec-title">Em lote, ' + esc(fnPlural(mapeados.length, "negócio", "negócios")) + '</div>' +
         '<div class="sec-sub">Ninguém nomeado da marca respondeu. Fechar como "perdeu a janela do evento".</div>' +
         '<div class="pills" style="margin-top:2px">' +
           '<button class="pill" data-a="funilLoteTodos" data-v="1">Marcar todos</button>' +
           '<button class="pill" data-a="funilLoteTodos" data-v="0">Desmarcar todos</button>' +
         '</div>';
    for(i=0;i<mapeados.length;i++){
      var mp = mapeados[i];
      h += `<label style="display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);min-height:44px">
        <input type="checkbox" class="fnLote" data-id="${esc(mp.id)}" checked style="width:20px;height:20px;flex:0 0 20px">
        <span class="truncate" style="flex:1;min-width:0">${esc(mp.empresa || "sem empresa")}
          <span class="tiny muted">${esc(quando(mp.criadoEm))}</span></span>
        <span class="tiny muted nowrap">${(mp.pt && mp.pt.valor) ? esc(brlCurto(mp.pt.valor)) : "sem valor"}</span>
      </label>`;
    }
    h += '<div class="tiny muted">Fechar em lote não tem o Desfazer de 8 segundos. Confira a lista antes.</div>';
    if(motivo) h += '<div class="tiny" style="color:var(--text3)">' + esc(motivo) + '</div>';
  }

  h += '</div>';

  var rodape = '<button class="btn btn-ghost" data-a="fecharFolha">Fechar</button>';
  if(mapeados.length){
    rodape += motivo
      ? '<button class="btn btn-primary" disabled>Fechar os ' + mapeados.length + ' negócios</button>'
      : '<button class="btn btn-primary" data-a="funilLote" data-k="' + esc(edK) + '">Fechar os ' +
        mapeados.length + ' negócios que não saíram de Mapeado</button>';
  }
  folha("Virada de edição, " + ed.rot, h, rodape);
}

ACOES.funilVirada = function(el){ fnFolhaVirada(el.getAttribute('data-k')); };
ACOES.funilLoteTodos = function(el){
  var v = el.getAttribute('data-v') === "1";
  var cx = document.querySelectorAll('.fnLote');
  for(var i=0;i<cx.length;i++) cx[i].checked = v;
};

// Fecha um negocio como "perdeu a janela do evento". Regra 7 da secao
// 4.4: fechar negocio que veio de indicacao cria a tarefa de avisar quem
// indicou, ganho ou perdido, porque é a mensagem que mais gera a proxima
// indicacao e a que mais se esquece de mandar.
// txtIndicador troca o texto dessa tarefa quando o fechamento nao foi uma
// perda de verdade: quem migrou pra proxima edicao nao "não saiu", e a
// pessoa vai ler esse texto no Hoje sem o negocio na frente.
function fnFecharPerdido(id, edK, obs, txtIndicador){
  var n = achar("negocios", id);
  if(!n) return Promise.resolve();

  // Guarda explicita: quem só le nao fecha negocio. Sem ela, o caminho
  // abaixo registraria a nota (que o gestor pode) e NAO fecharia o
  // negocio (que ele nao pode), deixando a tela dizendo que fechou.
  var bloq = motivoBloqueio("crm_negocios");
  if(bloq){ toast(bloq, "bad"); return Promise.reject(new Error(bloq)); }

  var ed = edicaoDe(edK);
  var motivo = obs || ("Fechado na virada da edição " + ((ed && ed.rot) || edK));
  var dados = {
    status: "perdido",
    motivoPerda: "janela_evento",
    motivoPerdaObs: motivo,
    fechadoEm: hojeISO(),
    proxTipo: "", proxData: "", proxHora: "", proxTexto: ""
  };

  // Uma chamada só, com negocioExtra: a linha entra na linha do tempo e o
  // negocio é atualizado junto. Antes isso era um gravar() direto, e o
  // negocio fechado pela virada de edicao ficava SEM NENHUMA linha no
  // historico, enquanto o mesmo fechamento feito pela tela do negocio
  // deixava. Como nao existe colecao de auditoria (secao 10 do SPEC), a
  // linha do tempo É o log: buraco nela e buraco no log.
  // semToque porque virada de edicao nao é contato com o cliente, e
  // carimbar contato que nao houve envenena o alerta de esfriamento.
  return registrarAtividade(id, {
    tipo: "nota",
    texto: motivo,
    semToque: true,
    negocioExtra: dados
  }).then(function(){
    // A regra 7 da secao 4.4 é pela ORIGEM, nao por ter indicador
    // cadastrado. Negocio que veio de indicacao mas ficou só com o nome
    // digitado tambem gera o aviso: é a mensagem que mais traz a proxima
    // indicacao e a que mais se esquece de mandar.
    if(n.origem !== "indicacao") return;
    var c = n.indicadorId ? achar("contatos", n.indicadorId) : null;
    var tid = idNovo("t");
    return gravar("crm_tarefas", tid, {
      id: tid,
      tipo: "avisar_indicador",
      texto: String(txtIndicador || ("Avisar " + (n.indicadorNome || "quem indicou") + " que o negócio da " +
             (n.empresa || "empresa") + " não saiu nessa edição")).slice(0,160),
      data: somaDias(hojeISO(), 1),
      contatoId: n.indicadorId || "",
      contatoNome: n.indicadorNome || "",
      contatoTel: (c && c.tel) || "",
      negocioId: n.id,
      negocioTitulo: n.titulo || "",
      feita: false,
      criadoEm: hojeISO(),
      criadoPor: (SESSAO && SESSAO.nome) || "",
      arquivado: false
    }).catch(function(){ /* o negocio ja fechou; falha na tarefa nao vira "não deu pra fechar" */ });
  });
}

ACOES.funilPerder = function(el){
  var id = el.getAttribute('data-id'), edK = el.getAttribute('data-de');
  var n = achar("negocios", id);
  var antes = {
    status: n ? (n.status || "aberto") : "aberto",
    motivoPerda: (n && n.motivoPerda) || "",
    motivoPerdaObs: (n && n.motivoPerdaObs) || "",
    fechadoEm: (n && n.fechadoEm) || "",
    proxTipo: (n && n.proxTipo) || "",
    proxData: (n && n.proxData) || "",
    proxHora: (n && n.proxHora) || "",
    proxTexto: (n && n.proxTexto) || ""
  };
  fnFecharPerdido(id, edK).then(function(){
    comDesfazer("Fechado como perdeu a janela do evento", "crm_negocios", id, antes);
    fnFolhaVirada(edK);      // a folha volta ja sem esse negocio
  }).catch(function(e){ toast("Não deu pra fechar: " + ((e && e.message) || "erro"), "bad"); });
};

// Migrar: negocio NOVO na proxima edicao, herdando contato, empresa e
// indicador. O antigo fecha como perdido, senao o funil da edicao velha
// nunca zera e o total de patrocinio segue mentindo.
ACOES.funilMigrar = function(el){
  var id = el.getAttribute('data-id');
  var edNovaK = el.getAttribute('data-e');
  var edK = el.getAttribute('data-de');
  var n = achar("negocios", id);
  var edNova = edicaoDe(edNovaK), edVelha = edicaoDe(edK);
  if(!n || !edNova){ toast("Não deu pra migrar", "bad"); return; }

  var pt = {
    edicao: edNovaK,
    cota: (n.pt && n.pt.cota) || "",
    valor: (n.pt && n.pt.valor) || 0,
    valorInicial: (n.pt && n.pt.valor) || 0,
    permuta: (n.pt && n.pt.permuta) || 0,
    entregaveis: (n.pt && n.pt.entregaveis) || "",
    quemAprova: (n.pt && n.pt.quemAprova) || "",
    mesBudget: ""            // budget novo, ciclo novo: a data antiga só atrapalha
  };
  var idDoNovo = idNovo("n");   // nome proprio: "novoId" é a funcao do 02-util e sombrea-la aqui e pedir bug
  var titulo = (n.empresa || "Patrocinio") + " " + edNova.rot;
  var novo = {
    id: idDoNovo,
    tipo: "patrocinio",
    titulo: titulo,
    empresa: n.empresa || "",
    empresaChave: chave(n.empresa || ""),
    contatoId: n.contatoId || "",
    contatoNome: n.contatoNome || "",
    contatoTel: n.contatoTel || "",
    estagio: "pt_mapeado",
    status: "aberto",
    origem: n.origem || "prospeccao",
    indicadorId: n.indicadorId || "",
    indicadorNome: n.indicadorNome || "",
    valorRef: valorRefDe({ tipo:"patrocinio", pt:pt }),
    pt: pt,
    ag: null,
    prevFechamento: somaDias(hojeISO(), CICLO_MEDIANO.patrocinio),
    prevEstimada: true,
    proxTipo: "retomar",
    proxData: somaDias(hojeISO(), 7),
    proxTexto: "retomar pra " + edNova.rot,
    proxHora: "",
    congeladoAte: "", congeladoMotivo: "",
    vezesAdiado: 0, vezesRemarcouPrev: 0,
    ultimoToqueEm: n.ultimoToqueEm || hojeISO(),
    ultimoToqueTxt: n.ultimoToqueTxt || "",
    estagioDesde: hojeISO(),
    maiorEstagio: 0,
    motivoPerda: "", motivoPerdaObs: "", fechadoEm: "",
    encerradoEm: "", motivoEncerramento: "",
    linkProposta: n.linkProposta || "",
    obs: ("Veio da edição " + ((edVelha && edVelha.rot) || edK) + ". " + (n.obs || "")).trim(),
    busca: chave([n.empresa || "", titulo, n.contatoNome || "", n.indicadorNome || ""].join(" ")),
    criadoEm: hojeISO(),
    criadoPor: (SESSAO && SESSAO.nome) || "",
    arquivado: false
  };

  gravar("crm_negocios", idDoNovo, novo)
    .then(function(){
      return fnFecharPerdido(id, edK, "Migrado pra " + edNova.rot,
        "Avisar " + (n.indicadorNome || "quem indicou") + " que o negócio da " +
        (n.empresa || "empresa") + " passou pra " + edNova.rot);
    })
    .then(function(){
      toast("Migrado pra " + edNova.rot, "ok");
      fnFolhaVirada(edK);
    })
    .catch(function(e){ toast("Não deu pra migrar: " + ((e && e.message) || "erro"), "bad"); });
};

// O lote: uma escrita por negocio, em fila, pra nao disparar dezenas de
// gravacoes ao mesmo tempo no 4G do estacionamento. Fecha pelo mesmo
// caminho do um a um, porque a regra 7 da secao 4.4 nao abre excecao pro
// lote: negocio que veio de indicacao gera o aviso pra quem indicou,
// ganho ou perdido. Sao poucos, ja que só conta quem tem indicador, e a
// fila do Hoje tem teto proprio de 8 cartoes.
ACOES.funilLote = function(el){
  var edK = el.getAttribute('data-k');
  var motivo = motivoBloqueio("crm_negocios");
  if(motivo){ toast(motivo, "bad"); return; }
  var cx = document.querySelectorAll('.fnLote'), ids = [];
  for(var i=0;i<cx.length;i++) if(cx[i].checked) ids.push(cx[i].getAttribute('data-id'));
  if(!ids.length){ toast("Nenhum marcado", "bad"); return; }

  var ed = edicaoDe(edK), feitos = 0;
  var fila = ids.reduce(function(p, id){
    return p.then(function(){
      return fnFecharPerdido(id, edK, "Não saiu de Mapeado até o " + ((ed && ed.rot) || edK))
        .then(function(){ feitos++; });
    });
  }, Promise.resolve());

  fila.then(function(){
    fecharFolha();
    toast(fnPlural(feitos, "negócio fechado", "negócios fechados"), "ok");
    redesenhar();
  }).catch(function(e){
    toast("Parou em " + fnPlural(feitos, "negócio", "negócios") + ": " + ((e && e.message) || "erro"), "bad");
    redesenhar();
  });
};

/* ============ 08-negocio ============ */
/* =====================================================================
   CRM LIME - NEGÓCIOS: A LISTA E O DETALHE

   O detalhe é a segunda tela mais importante do sistema, depois do Hoje,
   e o registro de atividade que mora dentro dele é o fluxo mais usado de
   todos. Tudo aqui foi desenhado em cima de três decisões:

   1. A BARRA DE REGISTRAR FICA ACIMA DA LINHA DO TEMPO. Quem abre um
      negócio abre pra registrar o que acabou de acontecer, não pra ler o
      histórico. Ler é a exceção, escrever é a regra.
   2. O REGISTRO CUSTA ZERO LEITURA E 2 CLIQUES. Uma escrita na atividade,
      uma no negócio, e o toast só aparece depois do servidor confirmar.
   3. NADA DIZ "SALVO" ANTES DE ESTAR SALVO. O item entra na timeline com
      opacidade 0.6 e um reloginho, e só fica opaco quando a Promise
      resolve. O CRM que mente uma vez sobre isso perde o vendedor.
   ===================================================================== */

/* ---------------------------------------------------------------------
   ESTADO DO MÓDULO
   Filtro da lista guardado no aparelho: o vendedor que trabalha só
   patrocínio não pode ter que remarcar a pílula toda manhã.
   --------------------------------------------------------------------- */
var NG_FILTRO = recuperar("filtroNegocios", null) || {};
if(!NG_FILTRO.tipo)   NG_FILTRO.tipo   = "todos";
if(!NG_FILTRO.status) NG_FILTRO.status = "abertos";
if(!NG_FILTRO.ordem)  NG_FILTRO.ordem  = "valor";

/* Próximo passo sugerido por estágio. Não é adivinhação: é o ato que o
   critério de saída daquele estágio pede. Em Diagnóstico o que falta é
   mandar a proposta; em Proposta o que falta é cobrar a resposta. */
var NG_SUGESTAO = {
  ag_contato:"ligar",      ag_diagnostico:"enviar_prop",
  ag_proposta:"cobrar_prop", ag_negociacao:"enviar_contr",
  pt_mapeado:"mensagem",   pt_apresentado:"enviar_prop",
  pt_proposta:"cobrar_prop", pt_aprovacao:"cobrar_aprov",
  pt_contrato:"enviar_contr"
};

/* O CSS da casa não tem o grid de duas colunas com corte em 900px que a
   seção 6.3 pede, nem a linha de rotulo e valor dos blocos da lateral.
   Então o detalhe carrega esse pedaço de estilo, com prefixo ng- pra não
   encostar em nada. É só layout: cor, botão, cartão, etiqueta e o stepper
   de bolinha (.step, .step-p, .step-l, .step-rot) continuam vindo do
   sistema de design, que já tem todos eles. */
var NG_CSS =
'<style>' +
'.ng-cols{display:flex;flex-direction:column;gap:16px}' +
'.ng-main,.ng-side{display:flex;flex-direction:column;gap:16px;min-width:0}' +
'@média(min-width:900px){.ng-cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}}' +
'.ng-lin{display:flex;justify-content:space-between;gap:12px;padding:7px 0;' +
  'border-bottom:1px solid var(--border);font-size:12.5px}' +
'.ng-lin:last-child{border-bottom:0}' +
'</style>';

/* ---------------------------------------------------------------------
   HELPERS PEQUENOS (prefixo ng, são privados deste módulo)
   --------------------------------------------------------------------- */
function ngCopia(o){
  var r = {};
  for(var k in o) if(Object.prototype.hasOwnProperty.call(o||{},k)) r[k] = o[k];
  return r;
}
function ngOpcoes(pares, sel, vazio){
  var h = vazio ? '<option value="">' + esc(vazio) + '</option>' : '';
  for(var i=0;i<pares.length;i++){
    h += '<option value="' + esc(pares[i][0]) + '"' +
         (pares[i][0] === sel ? ' selected' : '') + '>' + esc(pares[i][1]) + '</option>';
  }
  return h;
}
function ngRotEstagio(k){
  for(var t in FUNIL){
    if(!Object.prototype.hasOwnProperty.call(FUNIL,t)) continue;
    for(var i=0;i<FUNIL[t].length;i++) if(FUNIL[t][i].k === k) return FUNIL[t][i].rot;
  }
  return k || "";
}
function ngRotTipo(k, longo){
  for(var i=0;i<TIPOS.length;i++) if(TIPOS[i].k === k) return longo ? TIPOS[i].rotLongo : TIPOS[i].rot;
  return k || "";
}
function ngCorTemp(t){
  return t === "verde" ? "var(--green)" : t === "amarelo" ? "var(--warn)" :
         t === "vermelho" ? "var(--red)" : t === "congelado" ? "var(--blue)" : "var(--text3)";
}
// Link de proposta só abre se for http ou https. Campo de texto livre que
// vira href é o caminho mais curto pra um javascript: colado sem querer.
function ngLinkSeguro(u){
  var s = String(u||"").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}
function ngDiaDoTs(ts){
  if(!ts) return "";
  var d = new Date(Number(ts));
  if(isNaN(d.getTime())) return "";
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
/* Dinheiro digitado à mão.
   O lerValor() de 02-util já trata ponto separando grupos de três dígitos
   como milhar desde 11/09/2026, então "3.500" e "1.200.000" chegam certos
   sozinhos. Esta função continua na frente dele por dois motivos: ela
   tolera o "R$" colado no número antes da comparação, e ela arredonda,
   porque dinheiro neste sistema é SEMPRE inteiro em reais, sem centavo
   (seção 2.2). Ela nunca desfaz o que o lerValor faz: só tira o ponto de
   milhar de um texto que já é só milhar. */
function ngLerDinheiro(s){
  var t = String(s == null ? "" : s).trim();
  if(/^\d{1,3}(\.\d{3})+$/.test(t.replace(/[^\d.]/g, ""))) t = t.replace(/\./g, "");
  return Math.round(lerValor(t));
}
// Valor do negócio em uma linha, com a unidade que cada funil usa.
/* "valor a definir" e não "R$ 0".

   Negócio recem-cadastrado nasce sem valor de propósito (seção 6.7: forçar
   valor no dia 1 gera R$ 1.000 chutado que envenena a previsão), e esse é
   justamente o estado da indicação fresca, o lead mais quente da casa.
   Escrever "R$ 0" nele diz que o negócio vale zero, o que é mentira e o
   manda pro fim de qualquer leitura de olho. As outras telas já falavam
   "valor a definir"; a lista era a única que destoava.                  */
function ngValorTxt(n){
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mês" : "valor a definir";
  }
  var v = (n.pt && n.pt.valor) || 0;
  return v > 0 ? brl(v) : "valor a definir";
}

/* ---------------------------------------------------------------------
   OS CHIPS DE DATA ESPALHAM DE PROPÓSITO
   Reancorar 6 negócios seguidos com um clique em +1sem empilharia os 6
   exatamente no mesmo dia, e dali a uma semana a fila que existe pra
   parecer terminável vira uma parede de 6 cobranças. Cada clique sorteia
   dentro de uma janela, então a mesma ação repetida distribui a semana
   sozinha. Em dia útil, porque cobrança no sábado não acontece.
   --------------------------------------------------------------------- */
function ngSorteio(min, max){ return min + Math.floor(Math.random()*(max-min+1)); }
function ngDiasUteis(iso, n){
  var d = iso || hojeISO(), i = 0, s;
  while(i < n){
    d = somaDias(d, 1);
    s = dataDe(d);
    if(s && s.getDay() !== 0 && s.getDay() !== 6) i++;
  }
  return d;
}
function ngDataChip(k){
  var h = hojeISO();
  if(k === "2d")   return ngDiasUteis(h, ngSorteio(2, 3));    // 2 ou 3 dias uteis
  if(k === "1sem") return ngDiasUteis(h, ngSorteio(6, 9));    // de 6 a 9
  if(k === "15d")  return ngDiasUteis(h, ngSorteio(12, 18));  // de 12 a 18
  return h;
}

/* Copia do negócio com o próximo passo APAGADO, pra passar pro
   blocoProxPasso quando o passo antigo acabou de ser cumprido.

   Existe porque blocoProxPasso da preferência ao que já está gravado, e
   isso é o certo em duas telas (trocar o próximo passo, e a folha de
   estágio antes de escolher) é o errado em três (registrar atividade,
   volta do WhatsApp, folha de estágio depois de escolher). Nessas três a
   pessoa ACABOU de cumprir o passo, e reapresentar o mesmo com a data
   vencida faz o registro deixar o negócio atrasado do mesmo jeito.

   Compartilhada de propósito: a mesma correção já tinha sido escrita a
   mão em dois arquivos diferentes, e a terceira cópia era só questão de
   tempo. Quem precisa chama semProxPasso(n).                           */
function semProxPasso(n){
  var c = ngCopia(n);
  c.proxTipo = ""; c.proxData = ""; c.proxTexto = ""; c.proxHora = "";
  return c;
}

/* ---------------------------------------------------------------------
   BLOCO DE PRÓXIMO PASSO
   Dono deste módulo, usado também pela folha de estágio do funil e pelo
   cadastro. A obrigação é picklist mais data; o texto é opcional. Data
   sozinha vira botão de adiar alarme, e texto obrigatório vira "TBD".
   --------------------------------------------------------------------- */
function blocoProxPasso(pref, n, ligadoPadrao){
  var bloq = motivoBloqueio("crm_negocios");
  var lig  = bloq ? false : (ligadoPadrao !== false);
  var tipo = (n && n.proxTipo) || NG_SUGESTAO[(n && n.estagio) || ""] || "ligar";
  var pt   = proxTipoDe(tipo) || PROX_TIPOS[0];
  var data = (n && n.proxData) || "";
  // Num negócio atrasado a data gravada já venceu. Devolver ela no campo
  // faz o vendedor salvar o mesmo atraso de novo sem perceber, e o
  // negócio nunca sai do balde de vencidos.
  if(!data || data < hojeISO()) data = pt.dias ? ngDiasUteis(hojeISO(), pt.dias) : hojeISO();
  var pares = [];
  for(var i=0;i<PROX_TIPOS.length;i++){
    // Cobrar aprovação interna só existe em patrocínio: em agência não há
    // comite, o dono decide na mesa.
    if(PROX_TIPOS[i].funil && n && PROX_TIPOS[i].funil !== n.tipo) continue;
    pares.push([PROX_TIPOS[i].k, PROX_TIPOS[i].ic + "  " + PROX_TIPOS[i].rot]);
  }
  var d = bloq ? ' disabled' : '';

  return '' +
  '<div class="card" style="background:var(--card2);padding:13px">' +
    '<label style="display:flex;align-items:center;gap:9px;cursor:pointer">' +
      '<input type="checkbox" id="' + pref + 'on" data-ch="ngChProxOn" data-pref="' + pref + '"' +
        (lig ? ' checked' : '') + d + ' style="width:18px;height:18px;accent-color:var(--lime)">' +
      '<span class="h3" style="margin:0">Marcar o próximo passo</span>' +
    '</label>' +
    '<div id="' + pref + 'box"' + (lig ? '' : ' hidden') + ' style="margin-top:11px;display:flex;flex-direction:column;gap:10px">' +
      '<select class="inp" id="' + pref + 'tipo" data-ch="ngChProxTipo" data-pref="' + pref + '"' + d + '>' +
        ngOpcoes(pares, tipo) +
      '</select>' +
      '<div class="pills">' +
        '<button type="button" class="pill" data-a="ngChipData" data-pref="' + pref + '" data-k="2d"' + d + '>+2 dias</button>' +
        '<button type="button" class="pill" data-a="ngChipData" data-pref="' + pref + '" data-k="1sem"' + d + '>+1 semana</button>' +
        '<button type="button" class="pill" data-a="ngChipData" data-pref="' + pref + '" data-k="15d"' + d + '>+15 dias</button>' +
        '<input class="inp" type="date" id="' + pref + 'data" value="' + esc(data) + '"' + d +
          ' min="' + esc(hojeISO()) + '" style="width:auto;flex:1;min-width:148px">' +
      '</div>' +
      '<div id="' + pref + 'horaBox"' + (pt.hora ? '' : ' hidden') + '>' +
        '<div class="fld"><label>Hora da reunião</label>' +
          '<input class="inp" type="time" id="' + pref + 'hora" value="' + esc((n && n.proxHora) || "") + '"' + d + '></div>' +
      '</div>' +
      '<input class="inp" type="text" id="' + pref + 'txt" maxlength="140" placeholder="detalhe do passo (opcional)" value="' +
        esc((n && n.proxTexto) || "") + '"' + d + '>' +
      // .err só pinta de vermelho dentro de .fld no design system.
      '<div class="fld"><div class="err" id="' + pref + 'err"></div></div>' +
    '</div>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:8px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Lê o bloco de volta. Devolve sempre o mesmo formato, com ok:false e o
   texto do erro quando falta coisa, pra quem chamou não precisar saber
   quais campos existem. */
function lerProxPasso(pref){
  var r = { proxTipo:"", proxData:"", proxTexto:"", proxHora:"", ligado:true, ok:true, erro:"" };
  var on = document.getElementById(pref + "on");
  r.ligado = on ? !!on.checked : true;
  if(!r.ligado) return r;

  var t = document.getElementById(pref + "tipo");
  var d = document.getElementById(pref + "data");
  var h = document.getElementById(pref + "hora");
  var x = document.getElementById(pref + "txt");

  r.proxTipo  = (t && t.value) || "";
  r.proxData  = (d && d.value) || "";
  r.proxTexto = String((x && x.value) || "").slice(0,140);
  var ptp = proxTipoDe(r.proxTipo);
  r.proxHora  = (ptp && ptp.hora && h && h.value) ? h.value : "";

  if(!r.proxTipo){ r.ok = false; r.erro = "Escolha o que vem depois."; }
  else if(!r.proxData){ r.ok = false; r.erro = "Escolha a data do próximo passo."; }
  // Passo marcado no passado nasce vencido: o negócio volta vermelho no
  // mesmo segundo e cai no balde de atrasado amanhã de novo. Hoje vale,
  // porque ligar mais tarde hoje é um passo legítimo.
  else if(r.proxData < hojeISO()){
    r.ok = false;
    r.erro = "A data do próximo passo está no passado. Escolha de hoje (" + dataBR(hojeISO()) + ") em diante.";
  }
  var e = document.getElementById(pref + "err");
  if(e) e.textContent = r.ok ? "" : r.erro;
  return r;
}

ACOES.ngChProxOn = function(el){
  var box = document.getElementById(el.getAttribute('data-pref') + "box");
  if(box) box.hidden = !el.checked;
};
ACOES.ngChProxTipo = function(el){
  var pref = el.getAttribute('data-pref');
  var p = proxTipoDe(el.value);
  var hb = document.getElementById(pref + "horaBox");
  if(hb) hb.hidden = !(p && p.hora);
  // Trocar o tipo re-sugere a data, mas só quando o campo ainda está
  // vazio: sobrescrever data escolhida à mão é o jeito mais rápido de
  // fazer alguém desistir do picklist.
  var d = document.getElementById(pref + "data");
  if(d && !d.value && p && p.dias) d.value = ngDiasUteis(hojeISO(), p.dias);
};
ACOES.ngChipData = function(el){
  var d = document.getElementById(el.getAttribute('data-pref') + "data");
  if(d) d.value = ngDataChip(el.getAttribute('data-k'));
};

/* ---------------------------------------------------------------------
   REGISTRAR ATIVIDADE
   1 escrita em crm_atividades, 1 update no negócio, ZERO leituras.

   dados aceita:
     tipo, texto, quando        o que aconteceu e em que dia
     prox                       o que lerProxPasso(pref) devolveu
     adiar:true                 incrementa vezesAdiado
     semToque:true              não mexe em ultimoToqueEm (mudança de estágio)
     de / para                  só em tipo "estagio"
     negocioExtra               campos a mais pro update do negócio, usado
                                pela folha de estágio do funil
   --------------------------------------------------------------------- */
function registrarAtividade(negocioId, dados){
  var n = achar("negocios", negocioId);
  if(!n) return Promise.reject(new Error("Esse negócio não está carregado neste aparelho."));
  dados = dados || {};

  var tipo = dados.tipo || "nota";
  var bloq = motivoBloqueio("crm_atividades", { tipo:tipo });
  if(bloq){ toast(bloq, "bad"); return Promise.reject(new Error(bloq)); }

  var quando = dados.quando || hojeISO();
  var idA = idAtiv();
  var ativ = {
    negocioId: negocioId,
    contatoId: n.contatoId || "",
    tipo: tipo,
    texto: String(dados.texto || "").slice(0,1200),
    quando: quando,
    ts: Date.now(),                                  // só desempata dentro do dia
    por: (SESSAO && SESSAO.nome) || ""
  };
  if(dados.de)   ativ.de = dados.de;
  if(dados.para) ativ.para = dados.para;

  // Entra na linha do tempo agora, esmaecido e com reloginho. Só fica
  // opaco quando a Promise resolver.
  var naTela = ngCopia(ativ);
  naTela.id = idA;
  naTela.pendente = true;
  empurrarTimeline(negocioId, naTela);

  // Segura o carimbo da timeline local a frente do carimbo do negócio até
  // o gravar terminar. O próprio gravar chama redesenhar() por dentro, e
  // sem essa folga o carregarTimeline veria o negócio mais novo que a
  // timeline e gastaria 1 leitura pra buscar de volta o item que acabamos
  // de escrever aqui. Registrar tem que custar zero leitura.
  TIMELINE[negocioId].at = Date.now() + 3600000;

  var up = {};
  if(!dados.semToque){
    up.ultimoToqueEm  = quando;
    up.ultimoToqueTxt = String(ativ.texto || tipoAtivDe(tipo).rot).slice(0,140);
  }
  var p = dados.prox;
  if(p && p.ligado !== false && p.proxData){
    up.proxTipo  = p.proxTipo || "";
    up.proxData  = p.proxData;
    up.proxTexto = String(p.proxTexto || "").slice(0,140);
    up.proxHora  = p.proxHora || "";
  }
  if(dados.adiar) up.vezesAdiado = (n.vezesAdiado || 0) + 1;
  if(dados.negocioExtra){
    for(var j in dados.negocioExtra)
      if(Object.prototype.hasOwnProperty.call(dados.negocioExtra,j)) up[j] = dados.negocioExtra[j];
  }

  // O gestor registra Nota e só Nota, e não escreve no negócio. Tentar
  // gravar assim mesmo devolveria um toast de bloqueio por cima de um
  // registro que deu certo, o que faz parecer que nada foi salvo.
  var podeNegocio = !motivoBloqueio("crm_negocios");
  var alinhar = function(){
    var nn = achar("negocios", negocioId);
    if(TIMELINE[negocioId]) TIMELINE[negocioId].at = (nn && nn.at) || Date.now();
  };

  return Promise.all([
    gravar("crm_atividades", idA, ativ),
    podeNegocio ? gravar("crm_negocios", negocioId, up) : Promise.resolve()
  ]).then(function(){
    naTela.pendente = false;
    alinhar();
    return naTela;
  }).catch(function(e){
    // Falhou o envio, mas não se perdeu nada: o gravar já jogou na fila do
    // aparelho. O item fica na timeline com o selo de não enviado.
    alinhar();
    throw e;
  });
}

/* Nota de sistema (ganho, perdido, congelado, adiado). Não é toque no
   cliente, então não mexe em ultimoToqueEm. Erro aqui nunca derruba a
   operação principal: o gravar já guardou na fila e já avisou na faixa. */
function ngNota(negocioId, texto){
  var idA = idAtiv();
  var a = {
    negocioId: negocioId, contatoId:"", tipo:"nota",
    texto: String(texto || "").slice(0,1200),
    quando: hojeISO(), ts: Date.now(), por:(SESSAO && SESSAO.nome) || ""
  };
  var naTela = ngCopia(a);
  naTela.id = idA; naTela.pendente = true;
  empurrarTimeline(negocioId, naTela);
  TIMELINE[negocioId].at = Date.now() + 3600000;
  var alinhar = function(){
    var nn = achar("negocios", negocioId);
    if(TIMELINE[negocioId]) TIMELINE[negocioId].at = (nn && nn.at) || Date.now();
  };
  return gravar("crm_atividades", idA, a)
    .then(function(){ naTela.pendente = false; alinhar(); })
    .catch(function(){ alinhar(); });
}

/* Tarefa: o que não é negócio e, sem casa, nunca aparece. */
function ngCriarTarefa(t){
  var id = idNovo("t");
  var doc = {
    tipo: t.tipo, texto: String(t.texto||"").slice(0,160), data: t.data,
    contatoId: t.contatoId || "", contatoNome: t.contatoNome || "", contatoTel: t.contatoTel || "",
    negocioId: t.negocioId || "", negocioTitulo: String(t.negocioTitulo||"").slice(0,120),
    feita: false, criadoEm: hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || "", arquivado: false
  };
  return gravar("crm_tarefas", id, doc).catch(function(){});
}

/* ---------------------------------------------------------------------
   A BARRA DE REGISTRAR
   Alvo: 2 cliques até salvo, 1 quando o tipo repete. O tipo já vem
   marcado com o último usado, o texto é opcional e o próximo passo vem
   ligado com tipo e data sugeridos pelo estágio.
   --------------------------------------------------------------------- */
function ngFormRegistro(n, pref, naFolha){
  var ultimo = recuperar("ultimoTipoAtiv", "ligacao"), achou = false, z;
  for(z=0;z<TIPOS_ATIV.length;z++) if(TIPOS_ATIV[z].k === ultimo) achou = true;
  if(!achou) ultimo = "ligacao";
  // Quem só pode nota começa em nota, senão o primeiro clique é sempre
  // pra corrigir uma escolha que o sistema fez errado.
  if(motivoBloqueio("crm_atividades", { tipo:ultimo })) ultimo = "nota";

  var chips = "", i, t, bl;
  for(i=0;i<TIPOS_ATIV.length;i++){
    t = TIPOS_ATIV[i];
    bl = motivoBloqueio("crm_atividades", { tipo:t.k });
    chips += '<button type="button" class="pill' + (t.k === ultimo ? ' on' : '') + '"' +
      ' data-a="ngTipoAtiv" data-pref="' + pref + '" data-k="' + esc(t.k) + '"' +
      (bl ? ' disabled' : '') + '>' + t.ic + ' ' + esc(t.rot) + '</button>';
  }
  var blAtiv = motivoBloqueio("crm_atividades", { tipo:"ligacao" });
  var rasc = recuperar("rascunho_" + n.id, "");

  /* O bloco vem com a sugestão DO ESTÁGIO, não com o passo que já está
     gravado (seção 6.4). blocoProxPasso da preferência ao que está no
     negócio, e com o negócio cru a barra reapresentaria exatamente o passo
     que a pessoa acabou de cumprir, com a data vencida, e o registro
     deixaria o negócio atrasado do mesmo jeito. Quem não quer reancorar
     desliga o toggle, e aí nada de próximo passo é gravado. */
  var semProx = semProxPasso(n);

  /* Negócio fechado não volta pra fila. Fechar como ganho ou perdido APAGA
     o próximo passo de propósito, e deixar a caixinha ligada aqui fazia o
     primeiro registro depois do fechamento gravar proxTipo e proxData de
     novo num negócio que ninguém mais vai cobrar. */
  var aberto = n.status === "aberto";

  return '' +
  '<div class="card' + (naFolha ? '' : ' card-lime') + '"' + (naFolha ? ' style="padding:0;border:0;background:none"' : '') + '>' +
    (naFolha ? '' : '<div class="card-head"><div class="sec-title">Registrar</div>' +
      '<span class="tiny muted">Ctrl + Enter salva</span></div>') +
    '<form class="form" data-a="ngSalvarRegistro" data-id="' + esc(n.id) + '" data-pref="' + pref + '"' +
      (naFolha ? ' data-folha="1"' : '') + '>' +
      '<input type="hidden" id="' + pref + 'tp" value="' + esc(ultimo) + '">' +
      '<div class="pills">' + chips + '</div>' +
      (blAtiv ? '<div class="tiny" style="color:var(--text3)">' + esc(blAtiv) + '</div>' : '') +
      '<textarea class="inp" id="' + pref + 'obs" data-rascunho="' + esc(n.id) + '" maxlength="1200"' +
        ' placeholder="o que aconteceu (opcional)">' + esc(rasc) + '</textarea>' +
      '<div class="fld" style="max-width:220px"><label>Aconteceu em</label>' +
        // Nunca no futuro: o que vai acontecer não é atividade, é o próximo passo.
        '<input class="inp" type="date" id="' + pref + 'quando" value="' + hojeISO() + '" max="' + hojeISO() + '"></div>' +
      blocoProxPasso(pref, semProx, aberto) +
      (aberto ? '' : '<div class="tiny" style="color:var(--text3)">Este negócio está ' + esc(n.status) +
        '. Marcar próximo passo aqui não devolve ele para a fila, então a caixinha vem desligada.</div>') +
      '<button class="btn btn-primary btn-lg btn-block" type="submit">Salvar</button>' +
    '</form>' +
  '</div>';
}

function abrirRegistroRapido(negocioId){
  var n = achar("negocios", negocioId);
  if(!n){ toast("Esse negócio não está carregado neste aparelho.", "bad"); return; }
  folha("Registrar: " + n.empresa, ngFormRegistro(n, "rp", true));
}

ACOES.ngTipoAtiv = function(el){
  var pref = el.getAttribute('data-pref'), k = el.getAttribute('data-k');
  var hid = document.getElementById(pref + "tp");
  if(hid) hid.value = k;
  var irmaos = el.parentNode.querySelectorAll('.pill');
  for(var i=0;i<irmaos.length;i++) irmaos[i].classList.toggle('on', irmaos[i] === el);
  guardar("ultimoTipoAtiv", k);        // o próximo registro já abre nele
};

ACOES.ngSalvarRegistro = function(f){
  var id   = f.getAttribute('data-id');
  var pref = f.getAttribute('data-pref');
  var naFolha = !!f.getAttribute('data-folha');
  var n = achar("negocios", id);
  if(!n) return;

  var tipo   = (document.getElementById(pref + "tp") || {}).value || "nota";
  var ta     = document.getElementById(pref + "obs");
  var texto  = ta ? ta.value : "";
  var quando = (document.getElementById(pref + "quando") || {}).value || hojeISO();

  var prox = lerProxPasso(pref);
  if(!prox.ok){ toast(prox.erro, "bad"); return; }

  // Limpa o rascunho antes de gravar: o gravar redesenha a tela por
  // dentro e o campo some, e um rascunho órfão reapareceria no próximo
  // registro como se fosse texto novo.
  if(ta) ta.value = "";
  esquecer("rascunho_" + id);
  if(naFolha) fecharFolha();

  var estagioProposta = n.tipo === "agencia" ? "ag_proposta" : "pt_proposta";

  registrarAtividade(id, { tipo:tipo, texto:texto, quando:quando, prox:prox })
    .then(function(){
      toast("Registrado", "ok");
      // Sugere, nunca move sozinho: mover estágio tem pedágio (próximo
      // passo novo) e quem paga o pedágio é a pessoa, não o sistema.
      if(tipo === "proposta" && idxEstagio(n) < idxEstagio({ tipo:n.tipo, estagio:estagioProposta }))
        ngToastMover(id, ngRotEstagio(estagioProposta));
      redesenhar();
    })
    .catch(function(){ /* já avisado pela faixa, e o registro está na fila */ });
};

/* Toast com ação. O toast comum não tem botão, e esta sugestão só vale
   enquanto ela está na tela. */
function ngToastMover(id, rotulo){
  var w = document.getElementById('toasts');
  if(!w){ w = document.createElement('div'); w.id = 'toasts'; w.className = 'toast-wrap'; document.body.appendChild(w); }
  var t = document.createElement('div');
  t.className = "toast ok";
  t.style.pointerEvents = "auto";
  t.innerHTML = 'Proposta enviada. ' +
    '<button class="btn btn-sm" style="margin-left:10px" data-a="ngMover" data-id="' + esc(id) + '">Mover pra ' + esc(rotulo) + '?</button>';
  w.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 8000);
}
ACOES.ngMover = function(el){
  var t = el.closest('.toast'); if(t && t.parentNode) t.parentNode.removeChild(t);
  abrirFolhaEstagio(el.getAttribute('data-id'));
};

/* ---------------------------------------------------------------------
   LINHA DO TEMPO
   Única leitura por clique do sistema, e só quando o negócio é aberto ou
   mudou desde a última vez.
   --------------------------------------------------------------------- */
function ngPintarTimeline(negocioId, tudo){
  var box = document.getElementById('ngTl');
  if(!box) return;
  box.innerHTML = '<div class="tiny muted">carregando a linha do tempo...</div>';
  carregarTimeline(negocioId, tudo).then(function(itens){
    var b = document.getElementById('ngTl');
    // A tela pode ter trocado enquanto a leitura voltava.
    if(!b || b.getAttribute('data-n') !== negocioId) return;
    b.innerHTML = ngHtmlTimeline(itens, negocioId);
  });
}
function ngHtmlTimeline(itens, negocioId){
  itens = itens || [];
  if(!itens.length){
    return '<div class="empty" style="padding:24px 12px"><div class="ei">📝</div>' +
      '<div class="et">Nada registrado ainda</div>' +
      '<div class="ex">Toda ligação, reunião e mensagem que você registrar aqui vira o histórico que explica, daqui a dois meses, por que esse negócio ganhou ou morreu.</div></div>';
  }
  var h = '<div class="tl">', i, it, pend, dia, ic, titulo;
  for(i=0;i<itens.length;i++){
    it = itens[i];
    pend = it.pendente || PENDENTES[it.id];
    ic = it.tipo === "estagio" ? IC_ESTAGIO : tipoAtivDe(it.tipo).ic;
    titulo = it.tipo === "estagio"
      ? ("Mudou de " + ngRotEstagio(it.de) + " pra " + ngRotEstagio(it.para))
      : tipoAtivDe(it.tipo).rot;
    dia = ngDiaDoTs(it.ts);
    h += '<div class="tl-it"' + (pend ? ' style="opacity:.6"' : '') + '>' +
      '<div class="tl-ic">' + (pend ? "⏱" : ic) + '</div>' +
      '<div class="tl-bd">' +
        '<div class="tl-top">' +
          '<span class="tl-t">' + esc(titulo) + '</span>' +
          (it.por ? '<span class="tiny muted">' + esc(it.por) + '</span>' : '') +
          '<span class="tl-d">' + esc(dataCurta(it.quando)) + ', ' + esc(quando(it.quando)) + '</span>' +
        '</div>' +
        (it.texto ? '<div class="tl-x">' + esc(it.texto) + '</div>' : '') +
        // O dia em que aconteceu e o dia em que foi anotado são coisas
        // diferentes, e a diferença importa quando se le a história depois.
        (dia && it.quando && dia !== it.quando
          ? '<div class="tiny muted">registrado em ' + esc(dataBR(dia)) + ', aconteceu em ' + esc(dataBR(it.quando)) + '</div>'
          : '') +
        (pend ? '<div class="tiny" style="color:var(--warn)">esperando internet, já está guardado no aparelho</div>' : '') +
      '</div>' +
    '</div>';
  }
  h += '</div>';
  var tl = TIMELINE[negocioId];
  if(tl && tl.completa === false){
    h += '<button class="btn btn-block btn-ghost" style="margin-top:10px" data-a="ngVerMais" data-id="' +
         esc(negocioId) + '">Ver mais (custa 1 leitura do banco)</button>';
  }
  return h;
}

function ngOrdenar(arr, ordem){
  if(ordem === "previsao"){
    arr.sort(function(a,b){
      var da = a.prevFechamento || "9999-12-31", db = b.prevFechamento || "9999-12-31";
      if(da !== db) return da < db ? -1 : 1;
      return valorOrdem(b) - valorOrdem(a);
    });
  } else if(ordem === "parado"){
    arr.sort(function(a,b){
      return diasVencido(b.ultimoToqueEm || b.criadoEm) - diasVencido(a.ultimoToqueEm || a.criadoEm);
    });
  } else {
    // Invariante 11: quem ainda não tem valor ordena por valorOrdem, nunca
    // por valorRefDe. Com zero, a indicação cadastrada em 20 segundos fica
    // sempre no fim da lista e nunca aparece, e é o lead mais quente da casa.
    arr.sort(function(a,b){ return valorOrdem(b) - valorOrdem(a); });
  }
}

TELAS.negocios = function(){
  var todos = lista("negocios");
  var f = NG_FILTRO;

  var arr = todos.filter(function(n){
    if(f.tipo !== "todos" && n.tipo !== f.tipo) return false;
    if(f.status === "abertos")  return n.status === "aberto";
    if(f.status === "ganhos")   return n.status === "ganho";
    if(f.status === "perdidos") return n.status === "perdido";
    return true;
  });
  ngOrdenar(arr, f.ordem);

  // Os dois funis somam em linhas separadas. Juntar MRR de agência com
  // cota de patrocínio num número só é o invariante 5.
  var ag = arr.filter(function(n){ return n.tipo === "agencia"; });
  var pt = arr.filter(function(n){ return n.tipo === "patrocinio"; });
  var somaAg = 0, somaMrr = 0, somaPt = 0, i;
  for(i=0;i<ag.length;i++){ somaAg += valorRefDe(ag[i]); somaMrr += mrrDe(ag[i]); }
  for(i=0;i<pt.length;i++){ somaPt += valorRefDe(pt[i]); }

  var pil = function(campo, k, rot){
    return '<button class="pill' + (f[campo] === k ? ' on' : '') + '" data-a="ngFiltro" data-c="' +
      campo + '" data-k="' + k + '">' + esc(rot) + '</button>';
  };

  // Invariante 12: ação sem permissão fica visivel e desabilitada, com o
  // motivo escrito. O gestor que clica em Novo negócio e não entende por
  // que nada acontece é o mesmo gestor que diz que o CRM quebrou.
  var bloqNovo = motivoBloqueio("crm_negocios");

  var h = '<div class="card-head" style="margin:0">' +
      '<div><div class="sec-title">Negócios' + ajuda("estagio") + '</div>' +
        '<div class="sec-sub">' + arr.length + ' de ' + todos.length + ' negócios na lista</div></div>' +
      '<div>' +
        '<button class="btn btn-primary btn-lg" data-a="ngNovo"' + (bloqNovo ? ' disabled' : '') +
          '>+ Novo negócio</button>' +
        (bloqNovo ? '<div class="tiny" style="color:var(--text3);margin-top:6px">' + esc(bloqNovo) + '</div>' : '') +
      '</div>' +
    '</div>';

  h += '<div class="pills">' +
      pil("tipo","todos","Todos") + pil("tipo","agencia","Agencia") + pil("tipo","patrocinio","Patrocinio") +
      '<span style="width:10px"></span>' +
      pil("status","abertos","Abertos") + pil("status","ganhos","Ganhos") +
      pil("status","perdidos","Perdidos") + pil("status","todos","Todos") +
      '<span style="width:10px"></span>' +
      '<span class="tiny muted">ordem:</span>' +
      pil("ordem","valor","Valor") + pil("ordem","previsao","Previsao") + pil("ordem","parado","Mais parado") +
    '</div>';

  if(ag.length || pt.length){
    h += '<div class="kpis">' +
      (ag.length ? '<div class="kpi"><div class="kpi-l">Agência</div>' +
        '<div class="kpi-v lime">' + esc(brlCurto(somaAg)) + '</div>' +
        '<div class="kpi-s">' + ag.length + (ag.length===1?' negócio':' negócios') + ', ' +
          esc(brl(somaMrr)) + '/mês de MRR</div></div>' : '') +
      (pt.length ? '<div class="kpi"><div class="kpi-l">Patrocínio</div>' +
        '<div class="kpi-v lime">' + esc(brlCurto(somaPt)) + '</div>' +
        '<div class="kpi-s">' + pt.length + (pt.length===1?' negócio':' negócios') + ' em cota</div></div>' : '') +
    '</div>';
  }

  if(!arr.length){
    if(!todos.length){
      h += '<div class="empty"><div class="ei">💼</div><div class="et">Nenhum negócio cadastrado</div>' +
        '<div class="ex">Comece pelos que estão abertos agora. Cliente antigo e negócio perdido entram quando forem tocados, não antes.</div>' +
        '<button class="btn btn-primary" data-a="ngNovo"' + (bloqNovo ? ' disabled' : '') +
          '>Cadastrar o primeiro</button>' +
        (bloqNovo ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloqNovo) + '</div>' : '') +
      '</div>';
    } else {
      h += '<div class="empty"><div class="ei">⌕</div><div class="et">Nenhum negócio com esse filtro</div>' +
        '<div class="ex">Existem ' + todos.length + ' negócios cadastrados, nenhum deles casa com a combinacao escolhida aqui em cima.</div>' +
        '<button class="btn" data-a="ngLimparFiltro">Limpar os filtros</button></div>';
    }
    return h;
  }

  /* DESKTOP: tabela. CELULAR: a mesma lista em cartão, porque tabela com
     rolagem lateral no celular é onde a pessoa desiste. */
  var linhas = "", n, e, t;
  for(i=0;i<arr.length;i++){
    n = arr[i]; e = estagioDe(n); t = temperatura(n);
    linhas += '<tr data-a="ngAbrir" data-id="' + esc(n.id) + '">' +
      '<td><div class="cel-nome truncate">' + esc(n.empresa) + '</div>' +
        (n.indicadorNome ? '<div class="cel-sub truncate">via ' + esc(n.indicadorNome) + '</div>' : '') + '</td>' +
      '<td><div class="truncate" style="max-width:240px">' + esc(n.titulo) + '</div>' +
        '<div class="cel-sub">' + esc(ngRotTipo(n.tipo)) + '</div></td>' +
      '<td><span class="tag">' + esc(e.rot) + '</span>' +
        '<div class="cel-sub">' + diasVencido(n.estagioDesde) + ' dias aqui</div></td>' +
      // A segunda linha só aparece quando existe contrato pra mostrar.
      // "R$ 0 no contrato" embaixo de "valor a definir" era a mesma
      // mentira escrita duas vezes.
      '<td class="r"><b>' + esc(ngValorTxt(n)) + '</b>' +
        (n.tipo === "agencia" && valorRefDe(n) > 0
          ? '<div class="cel-sub">' + esc(brl(valorRefDe(n))) + ' no contrato</div>' : '') + '</td>' +
      '<td class="r">' + (n.prevFechamento ? esc(dataCurta(n.prevFechamento)) : '<span class="muted">sem data</span>') +
        (n.prevEstimada ? '<div class="cel-sub">estimada</div>' : '') + '</td>' +
      '<td><span class="dot" style="background:' + ngCorTemp(t) + '"></span>' +
        '<div class="cel-sub">' + esc(n.status === "aberto" ? porQue(n)
            : ((n.fechadoEm || n.encerradoEm) ? "fechado em " + dataBR(n.fechadoEm || n.encerradoEm)
                                              : "fechado, sem data registrada")) + '</div></td>' +
      '<td><div class="cel-sub">' + esc(n.ultimoToqueEm ? quando(n.ultimoToqueEm) : "nunca") + '</div>' +
        '<div class="truncate cel-sub" style="max-width:220px;color:var(--text2)">' + esc(n.ultimoToqueTxt || "") + '</div></td>' +
    '</tr>';
  }

  h += '<div class="tw no-mob"><table class="tb"><thead><tr>' +
      '<th>Empresa</th><th>Título</th><th>Estágio</th><th class="r">Valor</th>' +
      '<th class="r">Previsão</th><th>Temperatura</th><th>Último toque</th>' +
    '</tr></thead><tbody>' + linhas + '</tbody></table></div>';

  var cards = "";
  for(i=0;i<arr.length;i++) cards += cardNegocio(arr[i], "lista");
  // O flex vai num div POR DENTRO do .only-mob. Estilo em linha no proprio
  // .only-mob ganha do display:none da classe, e aí a lista de cartao
  // apareceria também no computador, embaixo da tabela.
  h += '<div class="only-mob"><div style="display:flex;flex-direction:column;gap:10px">' +
       cards + '</div></div>';

  var enc = 0;
  for(i=0;i<todos.length;i++) if(todos[i].status === "encerrado") enc++;
  if(enc && f.status !== "todos"){
    h += '<div class="tiny muted center">' + enc +
      (enc===1 ? ' contrato encerrado aparece' : ' contratos encerrados aparecem') + ' só no filtro Todos.</div>';
  }
  return h;
};
