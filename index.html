    p.quemAprova = String((document.getElementById('ngVaprova')||{}).value || "").slice(0,80);
    p.mesBudget = (document.getElementById('ngVbudget')||{}).value || "";
    p.entregaveis = String((document.getElementById('ngVentreg')||{}).value || "").slice(0,600);
    up.pt = p;
  }
  // valorRef e o unico campo derivado gravado, e tem que ser recalculado
  // em TODO ponto de escrita que mexe em valor, senao a lista ordena por
  // um numero que nao existe mais.
  up.valorRef = valorRefDe({ tipo:n.tipo, ag:up.ag || n.ag, pt:up.pt || n.pt });
  fecharFolha();
  gravar("crm_negocios", id, up).then(function(){ toast("Valores salvos", "ok"); });
};

/* ---------------------------------------------------------------------
   DELEGACOES DO MODULO
   Registradas UMA vez no carregamento, nunca dentro de uma tela: o
   redesenhar() troca o innerHTML inteiro e escuta presa a elemento
   vazaria a cada pintura.
   --------------------------------------------------------------------- */
if(!window.NG_DELEGADO){
  window.NG_DELEGADO = true;

  // O clique ja e delegado pela casca. O change nao era, e sem ele o
  // picklist de motivo e a data de congelamento nao conseguem explicar na
  // hora o que vai acontecer.
  document.addEventListener('change', function(ev){
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-ch]') : null;
    if(!el) return;
    var nome = el.getAttribute('data-ch');
    if(ACOES[nome]){ try{ ACOES[nome](el, ev); }catch(e){ console.error(e); } }
  });

  // Ctrl + Enter salva, e so no formulario de registro: sequestrar o
  // atalho em qualquer formulario quebraria as telas dos outros modulos.
  document.addEventListener('keydown', function(ev){
    if(ev.key !== "Enter" || !(ev.ctrlKey || ev.metaKey)) return;
    var f = ev.target && ev.target.closest ? ev.target.closest('form[data-a="ngSalvarRegistro"]') : null;
    if(!f) return;
    ev.preventDefault();
    try{ ACOES.ngSalvarRegistro(f, ev); }catch(e){ console.error(e); }
  });

  /* Rascunho a cada 3 segundos enquanto houver texto. O iOS mata o Safari
     em segundo plano o tempo todo, e perder o relato de uma reuniao de uma
     hora e o tipo de coisa que faz alguem voltar pro caderno. */
  window.NG_RASCUNHO = setInterval(function(){
    var ta = document.querySelector('textarea[data-rascunho]');
    if(!ta || !ta.value) return;
    guardar("rascunho_" + ta.getAttribute('data-rascunho'), ta.value);
  }, 3000);
}

/* ============ 09-pessoas ============ */
/* =====================================================================
   CRM LIME - PESSOAS E INDICACAO

   Contato e indicador sao a MESMA entidade (secao 2.5 do SPEC). Criar uma
   segunda colecao de "indicadores" faria o Paulo da Shineray existir duas
   vezes e nunca mais bater.

   Indicacao e praticamente o unico canal de entrada da casa, entao esta
   tela nao e um cadastro: e o relatorio que responde quem trouxe dinheiro,
   quem parou de trazer e quanto a indicacao vale contra as outras origens.

   ZERO LEITURA. Tudo aqui e aritmetica em cima do array que ja esta na
   memoria. Nao existe contador de indicacao gravado no banco de proposito:
   contador gravado desalinha na primeira gravacao que falha, precisa de
   lote atomico (que o sistema nao tem, invariante 2) e acaba pedindo um
   botao de "recalcular" que ninguem confia. Somar 130 negocios em memoria
   custa menos que um clique.
   ===================================================================== */

/* Estado da tela. Fica so em memoria: filtro de lista nao e dado de
   negocio e nao merece viajar pro banco nem pro cache. */
var PESSOAS_VISAO = "todos";     // "todos" | "indicadores"
var PESSOAS_FILTRO = "";

/* Atalho de achar(). Devolve tambem contato arquivado, de proposito: o
   detalhe precisa abrir pra permitir restaurar, e o Desfazer de 8s
   depende de o documento continuar alcancavel logo depois de arquivar. */
function contatoPorId(id){ return achar("contatos", id); }

/* ---------------------------------------------------------------------
   RANKING DE INDICADORES

   Agrupa os negocios em memoria por indicadorId.

   Negocio "encerrado" conta como cliente que a indicacao trouxe: ele foi
   ganho um dia, e o fim do contrato dois anos depois nao apaga a porta que
   a pessoa abriu. O que NAO conta encerrado e o mrrGerado, que responde
   "quanto recorrente esta ativo hoje" e por isso usa a mesma base da
   carteira da secao 7.1 (status ganho e sem encerradoEm).

   Agrupa por indicadorId mesmo quando a origem nao e "indicacao": se
   alguem apontou o caminho, apontou. Os negocios com origem indicacao e
   SEM indicadorId ficam de fora e sao contados a parte por
   indicacoesSemDono(), porque numero sem o buraco declarado vira mentira.
   --------------------------------------------------------------------- */
function pesVirouCliente(n){ return n.status === "ganho" || n.status === "encerrado"; }

function rankIndicadores(){
  var neg = lista("negocios"), mapa = {}, ordem = [], i, n, r, c;

  for(i=0;i<neg.length;i++){
    n = neg[i];
    if(!n.indicadorId) continue;

    r = mapa[n.indicadorId];
    if(!r){
      c = contatoPorId(n.indicadorId);
      r = mapa[n.indicadorId] = {
        id: n.indicadorId,
        // O nome do contato manda. O indicadorNome gravado no negocio e o
        // retrato do dia do cadastro e serve so quando o contato sumiu.
        nome: (c && c.nome) || n.indicadorNome || "Indicador sem cadastro",
        tel: (c && c.tel) || "",
        empresa: (c && c.empresa) || "",
        acordo: (c && c.acordo) || "",
        semCadastro: !c,
        n:0, ganhos:0, perdidos:0, abertos:0,
        gerado:0, mrrGerado:0, cotaGerada:0, emAberto:0,
        conversao:0, ultimaEm:"", diasSemIndicar:0, valorMedio:0, frio:false
      };
      ordem.push(r);
    }

    r.n++;
    if((n.criadoEm||"") > r.ultimaEm) r.ultimaEm = n.criadoEm || "";

    if(pesVirouCliente(n)){
      r.ganhos++;
      r.gerado += valorRefDe(n);
      // Recorrente (R$/mes) e cota (R$) andam em colunas separadas e nunca
      // se somam: sao unidades diferentes (invariante 5).
      if(n.tipo === "agencia"){
        if(n.status === "ganho" && !n.encerradoEm) r.mrrGerado += mrrDe(n);
      } else {
        r.cotaGerada += Math.round((n.pt && n.pt.valor) || 0);
      }
    } else if(n.status === "perdido"){
      r.perdidos++;
    } else if(n.status === "aberto"){
      r.abertos++;
      r.emAberto += valorRefDe(n);
    }
  }

  for(i=0;i<ordem.length;i++){
    r = ordem[i];
    r.conversao = r.n ? (r.ganhos / r.n) * 100 : 0;        // em % (0 a 100)
    r.diasSemIndicar = r.ultimaEm ? diasVencido(r.ultimaEm) : 0;
    // Valor medio da indicacao divide o gerado por TODAS as indicacoes
    // recebidas, nao so pelas ganhas (secao 7.5). Quem indica cinco e
    // acerta uma nao trouxe R$ 96 mil por indicacao.
    r.valorMedio = r.n ? Math.round(r.gerado / r.n) : 0;
    // Esfriando: ja provou que a indicacao dele fecha (2 ganhos ou mais) e
    // sumiu ha mais de 120 dias. E a ligacao de maior retorno da casa.
    r.frio = r.ganhos >= 2 && r.diasSemIndicar > 120;
  }

  ordem.sort(function(a,b){
    if(b.gerado !== a.gerado) return b.gerado - a.gerado;
    if(b.emAberto !== a.emAberto) return b.emAberto - a.emAberto;   // promessa viva antes de historico vazio
    if(b.n !== a.n) return b.n - a.n;
    return chave(a.nome) < chave(b.nome) ? -1 : 1;
  });
  return ordem;
}

/* O buraco do ranking: origem indicacao e ninguem anotado como indicador.
   Declarar isso na tela e o que sustenta o resto dos numeros. */
function indicacoesSemDono(){
  return lista("negocios").filter(function(n){
    return n.origem === "indicacao" && !n.indicadorId;
  });
}

/* ---------------------------------------------------------------------
   INDICADO CONTRA NAO INDICADO
   Taxa de ganho, ciclo mediano e ticket mediano dos dois lados.
   "Fora do perfil" sai do denominador da taxa (secao 7.4): contar
   desqualificacao como derrota pune a unica disciplina que faz um time de
   duas pessoas sobreviver, que e dizer nao.
   --------------------------------------------------------------------- */
function pesLadoFechado(negocios){
  var ganhos = [], perdas = [], i, n;
  for(i=0;i<negocios.length;i++){
    n = negocios[i];
    if(pesVirouCliente(n)) ganhos.push(n);
    else if(n.status === "perdido" && n.motivoPerda !== "fora_do_perfil") perdas.push(n);
  }
  var ciclos = [], tickets = [], d;
  for(i=0;i<ganhos.length;i++){
    n = ganhos[i];
    if(n.criadoEm && n.fechadoEm){
      d = diasEntre(n.criadoEm, n.fechadoEm);
      if(d >= 0) ciclos.push(d);
    }
    if(valorRefDe(n) > 0) tickets.push(valorRefDe(n));
  }
  var nFech = ganhos.length + perdas.length;
  return {
    nGanhos: ganhos.length, nPerdas: perdas.length, nFech: nFech,
    taxa: nFech ? (ganhos.length / nFech) * 100 : 0,
    ciclos: ciclos, tickets: tickets
  };
}
function pesComparaIndicacao(){
  var fechados = lista("negocios").filter(function(n){
    return n.status === "ganho" || n.status === "perdido" || n.status === "encerrado";
  });
  var ind = [], out = [], i;
  for(i=0;i<fechados.length;i++){
    if(fechados[i].origem === "indicacao" || fechados[i].indicadorId) ind.push(fechados[i]);
    else out.push(fechados[i]);
  }
  return { ind: pesLadoFechado(ind), out: pesLadoFechado(out) };
}

/* ---------------------------------------------------------------------
   FORMATACAO LOCAL
   Tudo com prefixo "pes" pra nao colidir com helper de outro modulo.
   --------------------------------------------------------------------- */
function pesNumBR(v){
  return (Number(v)||0).toLocaleString('pt-BR',{ minimumFractionDigits:1, maximumFractionDigits:1 });
}
function pesDias(v){ return v + (v === 1 ? " dia" : " dias"); }
function pesQtd(v, sing, plur){ return v + " " + (v === 1 ? sing : plur); }

/* Regra de amostra pequena, vale pra TODO numero derivado do sistema:
     8 ou mais    -> a estatistica normal
     de 3 a 7     -> a MEDIANA, com "n=5" ao lado em --text3, opacidade 70%
     menos de 3   -> media nenhuma, lista os valores
   Com 2 fechados, "ticket medio de R$ 41.000" informa menos que
   "R$ 62.000 e R$ 20.000", e ainda por cima mente. */
function pesEstat(valores, fmt){
  var v = (valores||[]).filter(function(x){ return typeof x === "number" && !isNaN(x); });
  if(!v.length) return '<span class="muted small">sem dado ainda</span>';
  if(v.length < 3){
    return '<b>' + v.map(fmt).join(" e ") + '</b>' +
           ' <span class="tiny" style="color:var(--text3);opacity:.7">valor a valor, n=' + v.length + '</span>';
  }
  var m = mediana(v);
  var peq = v.length < 8;
  return '<b>' + fmt(m) + '</b> <span class="tiny" style="color:var(--text3)' + (peq ? ';opacity:.7' : '') + '">' +
         (peq ? 'mediana, n=' + v.length : 'mediana de ' + v.length) + '</span>';
}

/* Acao sem permissao fica VISIVEL e DESABILITADA, com o motivo embaixo em
   --text3 (invariante 12). Botao que some faz o gestor abrir no celular,
   nao ver acao nenhuma e achar que o CRM quebrou. */
function pesBotao(rotulo, acao, dados, classe, motivo){
  var at = "", k;
  for(k in dados) if(Object.prototype.hasOwnProperty.call(dados,k)) at += ' data-' + k + '="' + esc(dados[k]) + '"';
  var b = '<button class="btn ' + (classe||"") + '"' +
          (motivo ? ' disabled' : ' data-a="' + esc(acao) + '"') + at + '>' + esc(rotulo) + '</button>';
  if(!motivo) return b;
  return '<div>' + b + '<div class="tiny" style="color:var(--text3);margin-top:4px;max-width:200px">' + esc(motivo) + '</div></div>';
}

function pesRotEncerramento(k){
  for(var i=0;i<MOTIVOS_ENCERRAMENTO.length;i++) if(MOTIVOS_ENCERRAMENTO[i].k === k) return MOTIVOS_ENCERRAMENTO[i].rot;
  return k || "encerrado";
}
function pesTagStatus(n){
  if(n.status === "ganho")     return '<span class="tag tag-green">Ganho</span>';
  if(n.status === "perdido")   return '<span class="tag tag-red">Perdido</span>';
  if(n.status === "encerrado") return '<span class="tag">Encerrado</span>';
  var t = temperatura(n);
  var cls = t === "verde" ? "tag-green" : t === "amarelo" ? "tag-warn" :
            t === "vermelho" ? "tag-red" : t === "congelado" ? "tag-blue" : "";
  return '<span class="tag ' + cls + '">' + esc(estagioDe(n).rot) + '</span>';
}
function pesResultado(n){
  // Data sempre condicional: dataBR("") devolve texto vazio e a frase sairia
  // como "ganho em ," no negocio importado ou fechado antes de o campo
  // existir. Buraco na frase e pior que a frase sem a data.
  if(n.status === "ganho"){
    var d = (n.criadoEm && n.fechadoEm) ? diasEntre(n.criadoEm, n.fechadoEm) : null;
    return "ganho" + (n.fechadoEm ? " em " + dataBR(n.fechadoEm) : ", sem data de fechamento anotada") +
           (d !== null && d >= 0 ? ", levou " + pesDias(d) : "");
  }
  if(n.status === "perdido"){
    var m = motivoPerdaDe(n.motivoPerda);
    return "perdido" + (n.fechadoEm ? " em " + dataBR(n.fechadoEm) : "") + (m ? ", " + m.rot.toLowerCase() : "");
  }
  if(n.status === "encerrado")
    return "encerrado" + (n.encerradoEm ? " em " + dataBR(n.encerradoEm) : "") + ", " + pesRotEncerramento(n.motivoEncerramento).toLowerCase();
  return estagioDe(n).rot + ", " + porQue(n);
}

/* Linha de negocio da tela de pessoa. Nao usa cardNegocio() de proposito:

/* Casa por PREFIXO DE PALAVRA, igual a busca do cabecalho: "mar" acha
   "Marroca" e "Ana Maria", nao acha "Camargo". Telefone casa por digito. */
function pesCasa(c, termo){
  if(!termo) return true;
  var dig = soDigito(termo);
  if(dig.length >= 3 && soDigito(c.tel||"").indexOf(dig) > -1) return true;
  // O termo tambem e quebrado em palavras. Comparando o termo inteiro de
  // uma vez, quem digitava o nome completo ("ana silva") procurava uma
  // palavra com espaco dentro, que nunca casa, e a lista voltava vazia
  // justo na busca mais natural que existe.
  var busca = chave(termo).split(/[\s.@_\-]+/).filter(Boolean);
  if(!busca.length) return false;
  var pal = chave((c.nome||"") + " " + (c.empresa||"") + " " + (c.cargo||"") + " " + (c.email||"")).split(/[\s.@_\-]+/);
  for(var j=0;j<busca.length;j++){
    var achou = false;
    for(var i=0;i<pal.length;i++) if(pal[i] && pal[i].indexOf(busca[j]) === 0){ achou = true; break; }
    if(!achou) return false;   // toda palavra do termo precisa casar
  }
  return true;
}

/* Abaixo de 860px toda tabela deste modulo vira lista de cartao. O
   espacamento dos cartoes do celular vai em margin-bottom, e nao em gap de
   flex, porque .only-mob entra como display:initial (ou seja, inline) e
   gap nao valeria: a margem do filho e o unico jeito que funciona nos dois
   casos sem inventar classe nova de CSS. */

/* O campo tel e GUARDADO so com digito e SEM DDI, que e o formato que o
   cadastro (modulo 11) grava e que o foneBR espera. O 55 entra so na hora
   de montar link (tel: aqui, wa.me dentro do linkWhats), nunca no banco:
   duas telas gravando o mesmo campo em formato diferente e como o mesmo
   telefone passa a existir de dois jeitos. Numero de 10 ou 11 digitos e
   sempre brasileiro. */
function pesTelComDDI(s){
  var d = soDigito(s);
  if(d.length === 10 || d.length === 11) d = "55" + d;
  return d;
}

/* ----- visao TODOS ----- */
function pesViewTodos(contatos){
  // Quantos negocios cada contato carrega, num passe so.
  var porContato = {}, neg = lista("negocios"), i;
  for(i=0;i<neg.length;i++) if(neg[i].contatoId) porContato[neg[i].contatoId] = (porContato[neg[i].contatoId]||0) + 1;

  var rank = rankIndicadores(), porInd = {};
  for(i=0;i<rank.length;i++) porInd[rank[i].id] = rank[i];

  var lst = contatos.filter(function(c){ return pesCasa(c, PESSOAS_FILTRO); });
  lst.sort(function(a,b){ return chave(a.nome) < chave(b.nome) ? -1 : 1; });

  if(!lst.length){
    if(PESSOAS_FILTRO){
      return `<div class="card"><div class="empty">
        <div class="ei">🔍</div><div class="et">Ninguem com esse nome</div>
        <div class="ex">Nenhum dos ${contatos.length} contatos casa com "${esc(PESSOAS_FILTRO)}".</div>
        <button class="btn" data-a="pessoasLimparFiltro">Limpar o filtro</button>
      </div></div>`;
    }
    return `<div class="card"><div class="empty">
      <div class="ei">👥</div><div class="et">Nenhum contato ainda</div>
      <div class="ex">Contato e indicador sao a mesma ficha aqui. Cadastre quem te indica e quem decide na empresa cliente.</div>
      ${pesBotao("Cadastrar o primeiro contato","pessoasNovoContato",{},"btn-primary",motivoBloqueio("crm_contatos"))}
    </div></div>`;
  }

  var linhas = "", cards = "";
  for(i=0;i<lst.length;i++){
    var c = lst[i];
    var nNeg = porContato[c.id] || 0;
    var r = porInd[c.id];
    var selo = c.ehIndicador
      ? '<span class="tag tag-lime">Indicador</span>' + (r ? ' <span class="tiny muted">' + pesQtd(r.n,"indicacao","indicacoes") + '</span>' : ' <span class="tiny muted">ainda sem indicacao</span>')
      : (r ? '<span class="tiny muted">' + pesQtd(r.n,"indicacao","indicacoes") + ', sem a marca de indicador</span>' : '<span class="muted">-</span>');

    linhas += `<tr data-a="ir" data-r="pessoa/${esc(c.id)}">
      <td><div class="cel-nome">${esc(c.nome)}</div><div class="cel-sub">${esc(c.cargo || "cargo nao informado")}</div></td>
      <td>${esc(c.empresa || "-")}</td>
      <td class="nowrap">${c.tel ? esc(foneBR(c.tel)) : '<span class="muted">sem telefone</span>'}</td>
      <td class="r">${nNeg ? pesQtd(nNeg,"negocio","negocios") : '<span class="muted">0</span>'}</td>
      <td>${selo}</td>
    </tr>`;

    cards += `<div class="card" style="padding:13px;margin-bottom:9px;cursor:pointer" data-a="ir" data-r="pessoa/${esc(c.id)}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0">
          <div class="cel-nome truncate">${esc(c.nome)}</div>
          <div class="cel-sub truncate">${esc(c.empresa || "sem empresa")}${c.cargo ? ", " + esc(c.cargo) : ""}</div>
        </div>
        ${c.ehIndicador ? '<span class="tag tag-lime">Indicador</span>' : ''}
      </div>
      <div class="tiny muted" style="margin-top:7px">
        ${c.tel ? esc(foneBR(c.tel)) : "sem telefone"} · ${pesQtd(nNeg,"negocio","negocios")}${r ? " · " + pesQtd(r.n,"indicacao","indicacoes") : ""}
      </div>
    </div>`;
  }

  return `<div>
    <div class="tw no-mob">
      <table class="tb">
        <thead><tr>
          <th>Pessoa</th><th>Empresa</th><th>Telefone</th><th class="r">Negocios</th><th>Indicacao</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>

/* ----- visao INDICADORES ----- */
function pesViewIndicadores(){
  var rank = rankIndicadores();
  var orfas = indicacoesSemDono();
  var visiveis = rank.filter(function(r){
    return pesCasa({ nome:r.nome, empresa:r.empresa, tel:r.tel }, PESSOAS_FILTRO);
  });

  var totN=0, totG=0, totGer=0, totMrr=0, totCota=0, totAb=0, i;
  for(i=0;i<rank.length;i++){
    totN += rank[i].n; totG += rank[i].ganhos; totGer += rank[i].gerado;
    totMrr += rank[i].mrrGerado; totCota += rank[i].cotaGerada; totAb += rank[i].emAberto;
  }

  if(!rank.length){
    return `<div class="card"><div class="empty">
      <div class="ei">🤝</div><div class="et">Nenhuma indicacao anotada ainda</div>
      <div class="ex">Assim que um negocio for cadastrado com origem indicacao e com quem indicou preenchido, o ranking aparece aqui sozinho, sem precisar recalcular nada.</div>
      ${orfas.length ? '<div class="tiny" style="color:var(--warn)">' + pesQtd(orfas.length,"negocio tem","negocios tem") + ' origem indicacao mas ninguem anotado como indicador.</div>' : ''}
    </div></div>`;
  }

  var h = `<div class="kpis">
    <div class="kpi accent">
      <div class="kpi-l">Indicacoes recebidas</div>
      <div class="kpi-v lime">${totN}</div>
      <div class="kpi-s">de ${pesQtd(rank.length,"pessoa","pessoas")}${orfas.length ? ", mais " + orfas.length + " sem indicador anotado" : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-l">Viraram cliente</div>
      <div class="kpi-v green">${totG}</div>
      <div class="kpi-s">${totN ? pct((totG/totN)*100,0) + " de " + pesQtd(totN,"indicacao","indicacoes") : "sem base ainda"}</div>
    </div>
    <div class="kpi">
      <div class="kpi-l">Gerado</div>
      <div class="kpi-v">${brlCurto(totGer)}</div>
      <div class="kpi-s">${brl(totMrr)}/mes de recorrente ativo, ${brl(totCota)} em cota</div>
    </div>
    <div class="kpi">
      <div class="kpi-l">Em aberto</div>
      <div class="kpi-v warn">${brlCurto(totAb)}</div>
      <div class="kpi-s">${pesQtd(rank.reduce(function(s,r){ return s + r.abertos; },0),"negocio indicado","negocios indicados")} ainda em jogo</div>
    </div>
  </div>`;

  h += pesTabelaRank(visiveis, rank.length);
  h += pesBlocoBuraco(totN, totG, totGer, orfas);
  h += pesBlocoEsfriando(rank);
  h += pesBlocoSemIndicar(rank);
  h += pesBlocoComparativo();
  return h;
}

function pesTabelaRank(rank, totalGeral){

      <div class="ei">🔍</div><div class="et">Nenhum indicador com esse nome</div>

      <button class="btn" data-a="pessoasLimparFiltro">Limpar o filtro</button>
    </div></div>`;

  var linhas = "", cards = "", i, r;
  for(i=0;i<rank.length;i++){
    r = rank[i];
    var conv = pct(r.conversao, 0) + ' <span class="tiny muted">(' + r.ganhos + ' de ' + r.n + ')</span>';
    var abre = r.semCadastro ? "" : ' data-a="ir" data-r="pessoa/' + esc(r.id) + '"';

    linhas += `<tr${abre}>
      <td>
        <div class="cel-nome">${esc(r.nome)}${r.frio ? ' <span class="tag tag-warn">Esfriando</span>' : ''}</div>
        <div class="cel-sub">${esc(r.empresa || "sem empresa")}${r.ultimaEm ? ", ultima em " + esc(dataBR(r.ultimaEm)) : ""}${r.semCadastro ? ", contato nao cadastrado" : ""}</div>
      </td>
      <td class="r">${r.n}</td>
      <td class="r">${r.ganhos}</td>
      <td class="r nowrap">${conv}</td>
      <td class="r nowrap">${r.gerado ? esc(brl(r.gerado)) : '<span class="muted">R$ 0</span>'}</td>
      <td class="r nowrap">${r.mrrGerado ? esc(brl(r.mrrGerado)) + '<span class="tiny muted">/mes</span>' : '<span class="muted">-</span>'}</td>
      <td class="r nowrap">${r.cotaGerada ? esc(brl(r.cotaGerada)) : '<span class="muted">-</span>'}</td>
      <td class="r nowrap">${r.emAberto ? esc(brl(r.emAberto)) : '<span class="muted">-</span>'}</td>
    </tr>`;

    // No celular a tabela vira cartao. O vendedor abre isso com uma mao so
    // depois da reuniao, e tabela de 8 colunas no bolso e ilegivel.
    cards += `<div class="card" style="padding:13px;margin-bottom:9px${r.semCadastro ? "" : ";cursor:pointer"}"${r.semCadastro ? "" : ' data-a="ir" data-r="pessoa/' + esc(r.id) + '"'}>
      <div style="display:flex;justify-content:space-between;gap:9px;align-items:flex-start">
        <div style="min-width:0">
          <div class="cel-nome truncate">${esc(r.nome)}</div>
          <div class="cel-sub truncate">${esc(r.empresa || "sem empresa")}</div>
        </div>

      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:9px">

        <div><div class="tiny muted">Viraram cliente</div><div class="num" style="font-size:19px">${r.ganhos} <span class="tiny muted">${pct(r.conversao,0)}</span></div></div>
        <div><div class="tiny muted">Gerado</div><div class="num" style="font-size:19px">${brlCurto(r.gerado)}</div></div>
      </div>
      <div class="tiny muted" style="margin-top:8px">
        ${r.mrrGerado ? esc(brl(r.mrrGerado)) + "/mes de recorrente · " : ""}${r.cotaGerada ? esc(brl(r.cotaGerada)) + " em cota · " : ""}${r.emAberto ? esc(brl(r.emAberto)) + " em aberto" : "nada em aberto"}
      </div>
    </div>`;
  }

  return `<div>
    <div class="sec-title">Quem indicou, e o que aquilo virou</div>
    <div class="sec-sub">Ordenado por R$ gerado. Toda taxa vem com o n ao lado, porque 100% com uma indicacao nao e 100%, e uma indicacao.</div>
    <div class="tw no-mob" style="margin-top:12px">
      <table class="tb">
        <thead><tr>
          <th>Quem indicou</th>
          <th class="r">Indicacoes</th>
          <th class="r">Viraram cliente</th>
          <th class="r">Conversao</th>
          <th class="r">Gerado (R$)</th>
          <th class="r">Recorrente (R$/mes)</th>

      Recorrente conta so contrato ativo, contrato encerrado continua contando em Gerado porque a porta foi aberta do mesmo jeito.
    </div>
  </div>`;
}

/* A linha do buraco. Numero derivado sem o buraco declarado e numero em
   que ninguem deveria acreditar. */
function pesBlocoBuraco(totN, totG, totGer, orfas){
  var medio;
  if(totN >= 8){
    medio = `<b>${esc(brl(Math.round(totGer/totN)))}</b> por indicacao recebida <span class="tiny muted">(${esc(brl(totGer))} gerados divididos por ${totN} indicacoes, contando as que nao fecharam)</span>`;
  } else {
    // Abaixo de 8 nao existe media honesta aqui: a mediana por indicacao
    // daria R$ 0 na maioria das bases pequenas (a maior parte das
    // indicacoes ainda nao fechou) e leria como "indicacao nao vale nada",
    // que e o contrario do que o dado diz. Entao mostra os brutos.
    medio = `<b>${esc(brl(totGer))}</b> gerados em ${pesQtd(totN,"indicacao","indicacoes")}, ${pesQtd(totG,"virou","viraram")} cliente <span class="tiny" style="color:var(--text3);opacity:.7">amostra pequena demais pra media, precisa de 8 indicacoes</span>`;
  }

  var buraco = orfas.length
    ? `<div class="tiny" style="color:var(--warn);margin-top:7px">(${pesQtd(orfas.length,"negocio","negocios")} com origem indicacao e indicador nao informado ${orfas.length === 1 ? "ficou" : "ficaram"} de fora desta conta)</div>`
    : `<div class="tiny muted" style="margin-top:7px">Nenhum negocio com origem indicacao ficou sem indicador anotado. A conta acima cobre todos.</div>`;

  return `<div class="card">
    <div class="h3" style="margin-bottom:7px">Valor medio da indicacao</div>
    <div style="font-size:15px">${medio}</div>
    ${buraco}
  </div>`;
}

/* Indicador esfriando: 2 indicacoes ganhas ou mais e mais de 120 dias sem
   indicar. Pra uma agencia que so entra por indicacao, mandar a m5 pra
   essas pessoas e a acao de maior retorno disponivel no sistema inteiro. */
function pesBlocoEsfriando(rank){
  var frios = rank.filter(function(r){ return r.frio; });
  if(!frios.length) return "";

  var itens = frios.map(function(r){
    var semTel = r.tel ? null : "Sem telefone cadastrado.";
    return `<div class="card" style="background:var(--card2);padding:13px;margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div style="min-width:0">
          <div class="cel-nome">${esc(r.nome)}</div>
          <div class="cel-sub">${esc(r.empresa || "sem empresa")}${r.ultimaEm ? ", ultima indicacao em " + esc(dataBR(r.ultimaEm)) + " (" + pesDias(r.diasSemIndicar) + " atras)" : ""}</div>
          <div class="tiny muted" style="margin-top:5px">${pesQtd(r.n,"indicacao","indicacoes")}, ${pesQtd(r.ganhos,"virou","viraram")} cliente, ${esc(brl(r.gerado))} gerados${r.acordo ? " · acordo: " + esc(r.acordo) : ""}</div>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start">
          ${pesBotao("Pedir indicacao","pessoaPedirIndicacao",{ id:r.id },"btn-primary",semTel)}
          ${r.semCadastro ? "" : pesBotao("Abrir","ir",{ r:"pessoa/" + r.id },"btn-sm",null)}
        </div>
      </div>
    </div>`;
  }).join("");

  return `<div class="card card-lime">
    <div class="sec-title">Indicador esfriando</div>
    <div class="sec-sub">Ja trouxe 2 clientes ou mais e passou de 120 dias sem indicar ninguem. O botao abre a mensagem de pedir indicacao (modelo m5).</div>
    <div style="margin-top:13px">${itens}</div>
  </div>`;
}

/* Marcado como indicador e que nunca indicou. Nao e "frio" pela regra dos
   120 dias (nunca teve a primeira), mas e a mesma ligacao. */
function pesBlocoSemIndicar(rank){
  var tem = {}, i;
  for(i=0;i<rank.length;i++) tem[rank[i].id] = true;
  var zerados = lista("contatos").filter(function(c){ return c.ehIndicador && !tem[c.id]; });
  if(!zerados.length) return "";

  zerados.sort(function(a,b){ return chave(a.nome) < chave(b.nome) ? -1 : 1; });
  var itens = zerados.map(function(c){
    var semTel = c.tel ? null : "Sem telefone cadastrado.";
    return `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--border)">
      <div style="min-width:0">
        <div class="cel-nome truncate">${esc(c.nome)}</div>
        <div class="cel-sub truncate">${esc(c.empresa || "sem empresa")}</div>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        ${pesBotao("Pedir indicacao","pessoaPedirIndicacao",{ id:c.id },"",semTel)}
        ${pesBotao("Abrir","ir",{ r:"pessoa/" + c.id },"btn-sm",null)}
      </div>
    </div>`;
  }).join("");

  return `<div class="card">
    <div class="sec-title">Marcados como indicador, ainda sem indicar</div>
    <div class="sec-sub">${pesQtd(zerados.length,"pessoa esta","pessoas estao")} com a marca de indicador e nenhuma indicacao anotada ate agora.</div>
    <div style="margin-top:11px">${itens}</div>
  </div>`;
}

/* Indicado contra nao indicado. A frase so aparece quando os DOIS lados
   tem n suficiente: comparar 8 fechados com 2 fechados produz uma frase
   redonda e falsa, e frase redonda e falsa e o jeito mais rapido de o
   sistema inteiro perder a confianca de quem le. */
function pesBlocoComparativo(){
  var c = pesComparaIndicacao(), a = c.ind, b = c.out;
  if(!a.nFech && !b.nFech) return "";

  var partes = [];
  if(a.nFech >= 3 && b.nFech >= 3){
    if(b.taxa > 0 && a.taxa > 0){
      var r = a.taxa / b.taxa;
      if(r >= 1.05)      partes.push("ganha " + pesNumBR(r) + " vezes mais");
      else if(r <= 0.95) partes.push("ganha " + pesNumBR(1/r) + " vezes menos");
      else               partes.push("ganha na mesma proporcao");
    } else if(a.taxa > 0 && b.taxa === 0){
      partes.push("ganha, e nenhum negocio de outra origem fechou ainda");
    }
  }
  if(a.ciclos.length >= 3 && b.ciclos.length >= 3){
    var d = mediana(b.ciclos) - mediana(a.ciclos);
    if(d > 0)      partes.push("fecha " + pesDias(d) + " antes");
    else if(d < 0) partes.push("fecha " + pesDias(-d) + " depois");
    else           partes.push("fecha no mesmo tempo");
  }
  var frase = partes.length ? "Negocio indicado " + partes.join(" e ") + "." : "";

  return `<div class="card">
    <div class="sec-title">Indicado contra nao indicado</div>
    <div class="sec-sub">So negocio ja fechado entra. Quem a gente desqualificou ("nao era perfil") fica fora do denominador da taxa.</div>
    ${frase ? `<div class="h1" style="margin-top:13px;color:var(--lime);font-size:20px;line-height:1.3">${esc(frase)}</div>` : `<div class="tiny muted" style="margin-top:13px">Ainda nao da pra comparar os dois lados: um deles tem menos de 3 negocios fechados, e com menos de 3 a frase sai bonita e errada.</div>`}
    <div class="grid2" style="margin-top:15px">
      ${pesColunaComparativo("Veio de indicacao", a)}
      ${pesColunaComparativo("Outras origens", b)}
    </div>
    <div class="tiny muted" style="margin-top:11px;line-height:1.6">
      Ticket junta valor total de contrato de agencia com cota de patrocinio. Serve pra comparar esforco, nao e caixa.
    </div>
  </div>`;
}

// Aberto primeiro (e o que da pra fazer algo hoje), depois o mais recente.
function pesOrdemNegocio(a, b){
  var aa = a.status === "aberto" ? 0 : 1, bb = b.status === "aberto" ? 0 : 1;
  if(aa !== bb) return aa - bb;
  // Nomes dA/dB porque "db" e o handle do Firestore, global neste arquivo.
  var dA = a.fechadoEm || a.encerradoEm || a.criadoEm || "";
  var dB = b.fechadoEm || b.encerradoEm || b.criadoEm || "";
  return dA < dB ? 1 : -1;
}

/* ============ 10-painel ============ */
/* =====================================================================
   CRM LIME - PAINEL DO GESTOR

   Esta e a tela de quem SO OLHA. O gestor nao move card, nao fecha
   negocio e nao edita valor: o painel e o produto inteiro pra ele.
   Por isso duas coisas mandam aqui:

   1. TODO NUMERO GRANDE E CLICAVEL e abre a lista dos negocios que
      entram na conta, e a soma da lista bate com o numero na tela.
      Numero que nao pode ser aberto e numero em que ninguem acredita,
      e um numero desacreditado derruba o sistema inteiro junto.
   2. Nada aqui le o banco. Trocar de mes, alternar mes/edicao e abrir
      qualquer lista e aritmetica sobre o array que ja esta na memoria,
      exatamente como manda a regra 5 do orcamento de leitura.
   ===================================================================== */

/* ---------------------------------------------------------------------
   ESTADO DA TELA
   Fica fora da funcao porque redesenhar() troca o innerHTML inteiro e
   nada sobrevive dentro do DOM entre dois renders.
   --------------------------------------------------------------------- */
var PAINEL = { ym:"", ptModo:"mes", ed:(EDICOES[0] && EDICOES[0].k) || "" };

// Mes escolhido, resolvido tarde de proposito: a aba fica aberta dias
// seguidos e o painel nao pode congelar no mes em que a pagina carregou.
function pnlYm(){
  if(!PAINEL.ym) PAINEL.ym = mesAtual();
  return PAINEL.ym;
}
// Aritmetica de "AAAA-MM" na mao. Date com dia 31 andando pra tras pula
// fevereiro inteiro, e o seletor de mes ficaria com buraco.
function pnlMesMenos(ym, n){
  var p = String(ym || mesAtual()).split("-");
  var a = Number(p[0]), m = Number(p[1]) - n;
  while(m <= 0){ m += 12; a--; }
  while(m > 12){ m -= 12; a++; }
  return a + "-" + (m < 10 ? "0" : "") + m;
}
// Os ultimos 6 meses mais o atual, do mais antigo pro mais novo.
function pnlMeses(){
  var atual = mesAtual(), out = [];
  for(var i = 6; i >= 0; i--) out.push(pnlMesMenos(atual, i));
  return out;
}
function pnlNomeMes(ym){
  var i = Number(String(ym || "").slice(5, 7)) - 1;
  return MESES[i] || mesBR(ym);
}

/* ---------------------------------------------------------------------
   CONFIG E META
   O nucleo grava a config de dois jeitos: o delta do sincronismo poe o
   documento na RAIZ de BASE.config, e a gravacao local (aplicarNoCache)
   poe em BASE.config.geral. Ler os dois juntos e o que impede a meta
   recem salva de sumir no redesenho seguinte.
   --------------------------------------------------------------------- */
function pnlConfig(){
  var c = BASE.config || {}, out = {}, k;
  for(k in c) if(Object.prototype.hasOwnProperty.call(c, k) && k !== "geral") out[k] = c[k];
  var g = (c.geral && typeof c.geral === "object") ? c.geral : null;
  if(g) for(k in g) if(Object.prototype.hasOwnProperty.call(g, k)) out[k] = g[k];
  return out;
}
// Meta de MRR NOVO por mes, em R$/mes. E a unica meta mensal que existe
// no modelo de dados (crm_config/geral.metaMrrMes), entao e ela que a
// tela compara com novoMrr. Meta de cota e por EDICAO, nao por mes,
// porque cota nao obedece mes, obedece ciclo de verba da montadora.
function pnlMetaMrr(){ return Number(pnlConfig().metaMrrMes) || 0; }
function pnlMetaCota(k){
  var mc = pnlConfig().metaCota;
  return Number(mc && mc[k]) || 0;
}

/* ---------------------------------------------------------------------
   ALTA CHANCE (7.2)
   Os quatro testes do SPEC, na ordem, sem nenhum quinto inventado.
   --------------------------------------------------------------------- */
// Indice do primeiro estagio em que o COMPRADOR se comprometeu. Se o
// funil nao tiver nenhum marcado, ninguem entra em alta chance, que e o
// erro seguro: previsao a menos nao mente, previsao a mais mente.
function idxCompromisso(tipo){
  var f = FUNIL[tipo] || [];
  for(var i = 0; i < f.length; i++) if(f[i].compromisso) return i;
  return f.length;
}
function altaChance(n, ym){
  if(!n || n.status !== "aberto") return false;
  if(n.prevEstimada) return false;               // data automatica nao conta
  if(!n.prevFechamento) return false;
  var hoje = hojeISO();
  var alvo = ym || mesAtual();
  // Plano vivo: quem marcou reuniao pro dia 25 continua em alta chance ate
  // o dia 25. Teto de 21 dias pra "plano" nao virar data no ano que vem.
  var planoVivo = !!n.proxData && n.proxData >= hoje && diasEntre(hoje, n.proxData) <= 21;
  // Sem ultimoToqueEm gravado, diasVencido devolve 0 e o negocio passaria
  // como "tocado hoje". Sem toque registrado so entra por plano vivo.
  var toqueRecente = !!n.ultimoToqueEm && diasVencido(n.ultimoToqueEm) <= 10;
  return idxEstagio(n) >= idxCompromisso(n.tipo)   // 1. comprador se comprometeu
      && mesDe(n.prevFechamento) === alvo          // 2. previsto pra este mes
      && n.prevFechamento >= hoje                  // 3. a data nao venceu
      && (planoVivo || toqueRecente);              // 4. plano vivo OU toque recente
}

/* ---------------------------------------------------------------------
   OS NUMEROS DO MES (7.1 e 7.2)
   Uma varredura so sobre a base inteira. Devolve tambem as LISTAS por
   tras de cada numero, porque a tela precisa abrir cada um deles e a
   lista nao pode ser recalculada com outro criterio em outro lugar.
   --------------------------------------------------------------------- */
function numerosDoMes(ym){
  ym = ym || mesAtual();
  var todos = lista("negocios");
  var r = {
    ym:ym,
    // carteira (7.1)
    carteira:0, carteiraFee:0, carteiraVerba:0, verbaSobGestao:0, carteiraItens:[],
    // movimento do mes (7.1)
    novoMrr:0, novoMrrItens:[],
    mrrPerdido:0, mrrPerdidoCancel:0, mrrPerdidoNaoRenov:0, perdidoItens:[],
    mrrLiquido:0, mrrAlta:0,
    fechado:0, fechadoItens:[],
    // previsao (7.2)
    altaChance:[], riscoItens:[], piso:0, provavel:0, limpo:0,
    porTipo:{
      agencia:   { fechado:0, alta:0, risco:0, piso:0, provavel:0, limpo:0, nFechado:0, nAlta:0 },
      patrocinio:{ fechado:0, alta:0, risco:0, piso:0, provavel:0, limpo:0, nFechado:0, nAlta:0 }
    },
    // meta
    meta:0, temMeta:false, faltam:0, pctMeta:0
  };

  for(var i = 0; i < todos.length; i++){
    var n = todos[i];

    /* CARTEIRA ATIVA. Contrato recorrente nao termina por data, termina
       por evento: filtrar por vigencia apaga o cliente que continua
       pagando depois do fim do papel. Por isso o corte e encerradoEm. */
    if(n.tipo === "agencia" && n.status === "ganho" && !n.encerradoEm){
      r.carteira      += mrrDe(n);
      r.carteiraFee   += (n.ag && n.ag.mrr) || 0;
      r.verbaSobGestao += (n.ag && n.ag.verbaMidia) || 0;
      r.carteiraItens.push(n);
    }

    /* FECHADO NO MES, nos dois funis. */
    if(n.status === "ganho" && mesDe(n.fechadoEm) === ym){
      var v = valorRefDe(n);
      r.fechado += v;
      r.fechadoItens.push(n);
      var t = r.porTipo[n.tipo];
      if(t){ t.fechado += v; t.nFechado++; }
      if(n.tipo === "agencia"){ r.novoMrr += mrrDe(n); r.novoMrrItens.push(n); }
    }

    /* MRR PERDIDO NO MES. "renovado" fica de fora: renovacao encerra o
       contrato velho e abre um novo, e contar isso como perda mostraria
       uma queda de R$ 3.500/mes que nao aconteceu. */
    if(n.tipo === "agencia" && n.status === "encerrado" &&
       mesDe(n.encerradoEm) === ym && n.motivoEncerramento !== "renovado"){
      var m = mrrDe(n);
      r.mrrPerdido += m;
      r.perdidoItens.push(n);
      // Duas linhas na tela porque as correcoes sao opostas: cancelamento
      // e ruptura no meio do contrato (se corrige com entrega e relacao),
      // nao renovacao e fim de ciclo (se corrige conversando antes).
      if(n.motivoEncerramento === "fim_natural") r.mrrPerdidoNaoRenov += m;
      else r.mrrPerdidoCancel += m;
    }

    /* ALTA CHANCE DO MES. */
    if(altaChance(n, ym)){
      var va = valorRefDe(n);
      r.altaChance.push(n);
      var tt = r.porTipo[n.tipo];
      if(tt){ tt.alta += va; tt.nAlta++; }
      if(n.tipo === "agencia") r.mrrAlta += mrrDe(n);
      if(riscoAlto(n)){
        r.riscoItens.push(n);
        if(tt) tt.risco += va;
      }
    }
  }

  r.carteiraVerba = r.carteira - r.carteiraFee;   // fatia de pctVerba, estimada
  r.mrrLiquido    = r.novoMrr - r.mrrPerdido;

  var somaAlta = 0, somaRisco = 0, j;
  for(j = 0; j < r.altaChance.length; j++) somaAlta += valorRefDe(r.altaChance[j]);
  for(j = 0; j < r.riscoItens.length; j++) somaRisco += valorRefDe(r.riscoItens[j]);

  r.piso     = r.fechado;                 // ja assinado, nao depende de ninguem
  r.provavel = r.piso + somaAlta;
  r.limpo    = r.provavel - somaRisco;    // tira o que esta apoiado em negocio parado

  var k;
  for(k in r.porTipo){
    if(!Object.prototype.hasOwnProperty.call(r.porTipo, k)) continue;
    var c = r.porTipo[k];
    c.piso = c.fechado;
    c.provavel = c.fechado + c.alta;
    c.limpo = c.provavel - c.risco;
  }

  r.meta    = pnlMetaMrr();
  r.temMeta = r.meta > 0;
  // Sem meta cadastrada o painel escreve "sem meta definida" e NUNCA NaN%.
  r.faltam  = r.temMeta ? Math.max(0, r.meta - r.novoMrr) : 0;
  r.pctMeta = r.temMeta ? Math.round((r.novoMrr / r.meta) * 100) : 0;
  return r;
}

/* ---------------------------------------------------------------------
   SAUDE DO FUNIL (7.3)
   --------------------------------------------------------------------- */
function pnlAbertos(){
  return lista("negocios").filter(function(n){ return n.status === "aberto"; });
}
// Em dia = tem plano com data no futuro E o silencio esta dentro do
// limite do proprio funil (5 dias em agencia, 15 em patrocinio).
function pnlEmDia(n){
  if(!n.proxData || n.proxData < hojeISO()) return false;
  var lim = (TOQUE[n.tipo] && TOQUE[n.tipo].normal) || 7;
  return !!n.ultimoToqueEm && diasVencido(n.ultimoToqueEm) <= lim;
}
function pnlSaude(ym){
  var ab = pnlAbertos(), i, n;
  var s = {
    abertos:ab, total:ab.length,
    emDia:[], foraDia:[], tocados:[], naoTocados:[],
    vencidos:[], piorAtraso:0,
    abertosMes:[], maior:null, somaMes:0, concentracao:0, temConcentracao:false
  };
  for(i = 0; i < ab.length; i++){
    n = ab[i];
    if(pnlEmDia(n)) s.emDia.push(n); else s.foraDia.push(n);
    // Cobertura de toque: medir so o toque mais recente da base inteira da
    // verde permanente pra quem cuida do negocio grande e deixa os outros
    // onze apodrecerem. Aqui conta negocio por negocio.
    if(n.ultimoToqueEm && diasVencido(n.ultimoToqueEm) <= 7) s.tocados.push(n);
    else s.naoTocados.push(n);
    var atraso = n.proxData ? diasVencido(n.proxData) : 0;
    if(atraso >= 1){
      s.vencidos.push(n);
      if(atraso > s.piorAtraso) s.piorAtraso = atraso;
    }
    if(mesDe(n.prevFechamento) === ym) s.abertosMes.push(n);
  }
  s.pctEmDia    = s.total ? Math.round((s.emDia.length / s.total) * 100) : 0;
  s.pctCobertura = s.total ? Math.round((s.tocados.length / s.total) * 100) : 0;

  // Concentracao so aparece com 3 ou mais abertos no mes. Com dois, "80%
  // num negocio so" e uma frase sobre o tamanho da amostra, nao sobre risco.
  if(s.abertosMes.length >= 3){
    for(i = 0; i < s.abertosMes.length; i++){
      var v = valorRefDe(s.abertosMes[i]);
      s.somaMes += v;
      if(!s.maior || v > valorRefDe(s.maior)) s.maior = s.abertosMes[i];
    }
    if(s.somaMes > 0){
      s.concentracao = Math.round((valorRefDe(s.maior) / s.somaMes) * 100);
      s.temConcentracao = true;
    }
  }
  return s;
}

/* ---------------------------------------------------------------------
   GANHOS E PERDAS, JANELA DE 12 MESES (7.4)
   --------------------------------------------------------------------- */
function pnlFechados12(){
  var corte = somaDias(hojeISO(), -365);
  return lista("negocios").filter(function(n){
    return (n.status === "ganho" || n.status === "perdido") &&
           n.fechadoEm && n.fechadoEm >= corte;
  });
}
function pnlGanhosPerdas(){
  var f = pnlFechados12(), i, n;
  var g = { fechados:f, ganhos:[], perdidos:[], perdasReais:[], foraPerfil:[],
            taxaGanho:0, temTaxa:false, ciclos:[], ciclosPerda:[], motivos:[] };
  var mapa = {};
  for(i = 0; i < f.length; i++){
    n = f[i];
    if(n.status === "ganho"){
      g.ganhos.push(n);
      if(n.criadoEm) g.ciclos.push(diasEntre(n.criadoEm, n.fechadoEm));
      continue;
    }
    g.perdidos.push(n);
    // "Fora do perfil" sai do denominador: contar desqualificacao como
    // derrota pune a unica disciplina que faz um time de duas pessoas
    // sobreviver, que e dizer nao.
    if(n.motivoPerda === "fora_do_perfil"){ g.foraPerfil.push(n); continue; }
    g.perdasReais.push(n);
    if(n.criadoEm) g.ciclosPerda.push(diasEntre(n.criadoEm, n.fechadoEm));
    var k = n.motivoPerda || "sem_motivo";
    if(!mapa[k]) mapa[k] = { k:k, valor:0, n:0 };
    mapa[k].valor += valorRefDe(n);
    mapa[k].n++;
  }
  var den = g.ganhos.length + g.perdasReais.length;
  g.temTaxa = den > 0;
  g.taxaGanho = den ? Math.round((g.ganhos.length / den) * 100) : 0;
  g.den = den;
  for(var mk in mapa) if(Object.prototype.hasOwnProperty.call(mapa, mk)) g.motivos.push(mapa[mk]);
  // Ranqueado por R$ PERDIDO, nunca por quantidade: tres contratos de
  // R$ 3.500/mes perdidos por preco somam menos que uma cota perdida por
  // verba, e ordenar por quantidade esconde justamente o que importa.
  g.motivos.sort(function(a, b){ return b.valor - a.valor; });
  return g;
}
// Conversao de um estagio pro SEGUINTE, so com negocio ja fechado. Aberto
// parado no estagio 2 ainda pode avancar; conta-lo derruba a conversao e
// o diagnostico sai invertido.
function pnlConversao(tipo, fechados){
  var f = FUNIL[tipo] || [], out = [], i, j, n;
  var base = fechados.filter(function(x){ return x.tipo === tipo; });
  for(i = 0; i < f.length - 1; i++){
    var nb = 0, np = 0;
    for(j = 0; j < base.length; j++){
      n = base[j];
      if((n.maiorEstagio || 0) >= i){
        nb++;
        if((n.maiorEstagio || 0) >= i + 1) np++;
      }
    }
    out.push({ i:i, de:f[i].rot, para:f[i+1].rot, base:nb, passou:np,
               taxa: nb ? Math.round((np / nb) * 100) : 0 });
  }
  return out;
}

/* ---------------------------------------------------------------------
   COBERTURA DA EDICAO (7.6)
   A unica metrica do sistema que junta dinheiro e tempo.
   --------------------------------------------------------------------- */
function pnlEdicao(k){
  var ed = edicaoDe(k);
  var r = { k:k, ed:ed, vendido:0, emAberto:0, permuta:0, nVend:0, nAb:0,
            meta:pnlMetaCota(k), vendidos:[], abertos:[] };
  if(!ed) return r;
  var todos = lista("negocios");
  for(var i = 0; i < todos.length; i++){
    var n = todos[i];
    if(n.tipo !== "patrocinio" || !n.pt || n.pt.edicao !== k) continue;
    if(n.status === "ganho"){
      r.vendido += (n.pt.valor || 0);
      r.permuta += (n.pt.permuta || 0);   // nunca somada ao dinheiro
      r.vendidos.push(n); r.nVend++;
    } else if(n.status === "aberto"){
      r.emAberto += (n.pt.valor || 0);
      r.abertos.push(n); r.nAb++;
    }
  }
  r.diasCorte  = diasEntre(hojeISO(), ed.corteComercial);  // positivo = ainda falta
  r.diasEvento = diasEntre(hojeISO(), ed.dataEvento);
  r.pct = r.meta > 0 ? Math.round((r.vendido / r.meta) * 100) : 0;
  return r;
}

/* ---------------------------------------------------------------------
   PEDACOS DE HTML REUSADOS
   --------------------------------------------------------------------- */
// Todo numero grande e um botao. O tracejado embaixo e o unico aviso de
// que da pra abrir a lista: tooltip nao existe no dedo.
var PNL_CLIC = "border-bottom:1px dashed var(--border2);padding-bottom:1px";

// O parametro NAO se chama "lista": lista() e a funcao do nucleo que
// devolve a base, e um parametro com esse nome a apaga dentro da funcao.
function pnlNum(txt, chaveLista, cls, extra){
  return '<button class="kpi-v ' + (cls || "") + '" style="' + PNL_CLIC + '" ' +
         'data-a="verLista" data-lista="' + chaveLista + '"' + (extra || "") + '>' + txt + '</button>';
}
// Numero pequeno clicavel, pra dentro de tabela e de linha de texto. O
// padding vertical existe por causa do dedo: sem ele o alvo tem a altura
// da letra, uns 19px, e no celular o toque cai ao lado em vez de abrir a
// lista. Vem depois de PNL_CLIC pra vencer o padding-bottom de la.
function pnlNumPeq(txt, chaveLista, cor, extra){
  return '<button style="font-family:var(--disp);font-weight:800;font-size:16px;' + PNL_CLIC +
         ';display:inline-block;padding:7px 2px' +
         (cor ? ";color:" + cor : "") + '" data-a="verLista" data-lista="' + chaveLista + '"' +
         (extra || "") + '>' + txt + '</button>';
}
function pnlKpi(rot, valorHtml, sub, accent){
  return '<div class="kpi' + (accent ? " accent" : "") + '">' +
           '<div class="kpi-l">' + rot + '</div>' + valorHtml +
           (sub ? '<div class="kpi-s">' + sub + '</div>' : '') +
         '</div>';
}
function pnlBarra(pctNum, cls){
  var p = Math.max(0, Math.min(100, Math.round(pctNum || 0)));
  return '<div class="bar" style="margin-top:9px"><i class="' + (cls || "") + '" style="width:' + p + '%"></i></div>';
}
// Regra de amostra pequena, vale pra TODO numero derivado do sistema.
function pnlAmostra(vals, fmt){
  var n = (vals || []).length, i, s = [];
  if(!n) return '<span class="muted">sem negocio fechado ainda</span>';
  if(n < 3){
    // Com 2 fechados, "ticket medio R$ 41.000" e pior que "R$ 62.000 e R$ 20.000".
    for(i = 0; i < n; i++) s.push(fmt(vals[i]));
    return '<span style="font-family:var(--disp);font-weight:800;font-size:17px">' + s.join(" e ") + '</span>' +
           ' <span class="tiny muted">' + n + (n === 1 ? " negocio, sem mediana" : " negocios, sem mediana") + '</span>';
  }
  var op = n < 8 ? ";opacity:.7" : "";
  return '<span style="font-family:var(--disp);font-weight:900;font-size:22px' + op + '">' + fmt(mediana(vals)) + '</span>' +
         ' <span class="tiny muted">mediana, n=' + n + '</span>';
}
// Nota fixa da coluna Total. Escrita na tela, sempre, nunca em tooltip:
// a unica coisa que impede alguem de ler o Total como caixa do mes e
// esta frase estar visivel ao lado do numero.
var PNL_NOTA_TOTAL = "Soma valor total de contrato (fee vezes meses) com cota de patrocinio " +
  "(pagamento unico). Serve pra dimensionar o esforco comercial. Nao e caixa do mes.";

/* ---------------------------------------------------------------------
   A TELA
   --------------------------------------------------------------------- */
TELAS.painel = function(){
  var ym = pnlYm();
  var N  = numerosDoMes(ym);
  var S  = pnlSaude(ym);

  if(!lista("negocios").length){
    return pnlCabecalho(ym) +
      '<div class="empty"><div class="ei">📊</div>' +
      '<div class="et">Nenhum negocio cadastrado ainda</div>' +
      '<div class="ex">O painel e conta feita em cima dos negocios. Assim que o primeiro entrar, ' +
      'todos os numeros desta tela passam a existir sozinhos.</div>' +
      '<button class="btn" data-a="ir" data-r="funil">Ver o funil</button></div>';
  }

  return pnlCabecalho(ym) +
         pnlFaixaConfianca(S) +
         pnlBlocoCarteira(N) +
         pnlBlocoPrevisao(N) +
         pnlBlocoSaude(S, N) +
         pnlBlocoGanhosPerdas() +
         pnlBlocoEdicoes() +
         pnlBlocoMeta(N);
};

function pnlCabecalho(ym){
  var ms = pnlMeses(), h = "", i;
  for(i = 0; i < ms.length; i++){
    h += '<button class="pill' + (ms[i] === ym ? " on" : "") + '" data-a="painelMes" data-ym="' + ms[i] + '">' +
         esc(mesBR(ms[i])) + '</button>';
  }
  return '<div class="card-head" style="margin-bottom:0">' +
    '<div>' +
      '<div class="sec-title">Painel</div>' +
      '<div class="sec-sub">Todo numero grande abre a lista dos negocios que entram na conta. ' +
      'Trocar de mes nao consulta o banco.</div>' +
    '</div>' +
    '<div class="pills">' + h + '</div>' +
  '</div>';
}

/* Faixa de confianca no topo: cobertura de toque. Vem antes de qualquer
   previsao porque e ela que diz se dava pra acreditar na previsao. */
function pnlFaixaConfianca(S){
  if(!S.total){
    return '<div class="card"><div class="muted">Nenhum negocio aberto agora. ' +
           'A previsao do mes e so o que ja foi fechado.</div></div>';
  }
  var cls = S.pctCobertura > 70 ? "green" : (S.pctCobertura >= 40 ? "warn" : "red");
  var cor = S.pctCobertura > 70 ? "var(--green)" : (S.pctCobertura >= 40 ? "var(--warn)" : "var(--red)");
  var frase = S.pctCobertura > 70
    ? "A base esta sendo tocada. Da pra confiar no resto desta tela."
    : (S.pctCobertura >= 40
      ? "Boa parte da base passou uma semana sem contato. A previsao abaixo esta apoiada em negocio que ninguem tocou."
      : "A maior parte da base esta sem contato ha mais de 7 dias. Os numeros abaixo descrevem um funil parado.");
  return '<div class="card' + (cls === "green" ? " card-lime" : "") + '">' +
    '<div class="card-head" style="margin-bottom:8px">' +
      '<div class="h3" style="margin:0">Cobertura de toque, ultimos 7 dias</div>' +
      '<div>' + pnlNumPeq(pct(S.pctCobertura), "tocados", cor) + '</div>' +
    '</div>' +
    pnlBarra(S.pctCobertura, cls) +
    '<div class="kpi-s" style="margin-top:9px">' +
      pnlNumPeq(String(S.tocados.length), "tocados", "") +
      ' <span class="muted">de ' + S.total + ' negocios abertos tiveram contato nos ultimos 7 dias. ' +
      esc(frase) + '</span>' +
    '</div>' +
  '</div>';
}

/* ------------------------ 1. CARTEIRA E MOVIMENTO ------------------- */
function pnlBlocoCarteira(N){
  var nome = pnlNomeMes(N.ym);
  var liqCls = N.mrrLiquido > 0 ? "green" : (N.mrrLiquido < 0 ? "red" : "");
  var liqSinal = N.mrrLiquido > 0 ? "+" : "";

  var h = '<div class="card">' +
    '<div class="card-head">' +
      '<div><div class="sec-title">Carteira e movimento do mes</div>' +
      '<div class="sec-sub">O recorrente ativo hoje, e o que entrou e saiu em ' + esc(nome) + '</div></div>' +
    '</div>' +
    '<div class="kpis">';

  // Duas linhas separadas: dinheiro contratado e estimado sobre verba.
  h += pnlKpi("Carteira ativa",
        pnlNum(brl(N.carteira) + '<span style="font-size:16px;color:var(--text3)">/mes</span>', "carteira", "lime"),
        'em ' + N.carteiraItens.length + (N.carteiraItens.length === 1 ? ' contrato de agencia' : ' contratos de agencia') +
        '<br>' + pnlNumPeq(brl(N.carteiraFee), "carteiraFee", "") + '<span class="muted">/mes de fee contratado</span>' +
        '<br>' + pnlNumPeq(brl(N.carteiraVerba), "carteiraVerba", "") +
        '<span class="muted">/mes estimado sobre a verba (% de pctVerba)</span>', true);

  h += pnlKpi("Novo MRR no mes",
        pnlNum(brl(N.novoMrr) + '<span style="font-size:16px;color:var(--text3)">/mes</span>', "novoMrr", "green"),
        N.novoMrrItens.length + (N.novoMrrItens.length === 1 ? ' contrato novo' : ' contratos novos') + ' fechados em ' + esc(nome));

  h += pnlKpi("MRR perdido no mes",
        pnlNum(brl(N.mrrPerdido) + '<span style="font-size:16px;color:var(--text3)">/mes</span>', "mrrPerdido", N.mrrPerdido ? "red" : ""),
        pnlNumPeq(brl(N.mrrPerdidoCancel), "perdidoCancel", "") + '<span class="muted">/mes de cancelamento</span><br>' +
        pnlNumPeq(brl(N.mrrPerdidoNaoRenov), "perdidoNaoRenov", "") + '<span class="muted">/mes de nao renovacao</span><br>' +
        '<span class="muted">renovacao nao entra aqui: ela vira contrato novo</span>');

  /* MRR liquido e o numero que um dono de agencia olha primeiro e que
     quase nenhum CRM mostra. Fechar R$ 3.500 e perder R$ 4.000 no mesmo
     mes e ENCOLHER, e sem a linha de perdido o CRM comemora isso. */
  h += pnlKpi("MRR liquido do mes",
        pnlNum(liqSinal + brl(N.mrrLiquido) + '<span style="font-size:16px;color:var(--text3)">/mes</span>', "mrrLiquido", liqCls),
        N.mrrLiquido < 0
          ? 'A carteira encolheu em ' + esc(nome) + '. Entrou ' + brl(N.novoMrr) + '/mes e saiu ' + brl(N.mrrPerdido) + '/mes.'
          : 'novo menos perdido, o tamanho real do crescimento no mes');

  h += pnlKpi("Fechado no mes",
        pnlNum(brl(N.fechado), "fechado", "lime"),
        N.fechadoItens.length + (N.fechadoItens.length === 1 ? ' negocio ganho' : ' negocios ganhos') +
        ', contrato cheio mais cota. Nao e caixa do mes.');

  h += '</div>';

  // Verba sob gestao em linha propria, com o rotulo que impede o engano.
  h += '<div class="kpi-s" style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">' +
       pnlNumPeq(brl(N.verbaSobGestao) + "/mes", "verba", "") +
       ' <span class="muted">de verba sob gestao. Verba do cliente, NAO e receita da Lime. ' +
       'So a fatia de pctVerba entra no MRR acima.</span></div>';

  h += pnlSerieFechado(N.ym);
  h += '</div>';
  return h;
}

// Serie mensal em barra de CSS. Clicar numa barra troca o mes do painel,
// que custa zero leitura porque tudo aqui e conta sobre o array carregado.
function pnlSerieFechado(ym){
  var ms = pnlMeses(), vals = [], i, maior = 0, todos = lista("negocios");
  for(i = 0; i < ms.length; i++){
    var v = 0;
    for(var j = 0; j < todos.length; j++){
      var n = todos[j];
      if(n.status === "ganho" && mesDe(n.fechadoEm) === ms[i]) v += valorRefDe(n);
    }
    vals.push(v);
    if(v > maior) maior = v;
  }
  if(!maior) return "";
  var h = '<div class="h3" style="margin-top:18px">Fechado por mes</div>' +
          '<div class="chart-bars">';
  for(i = 0; i < ms.length; i++){
    var alt = Math.max(2, Math.round((vals[i] / maior) * 100));
    h += '<button class="cb" data-a="painelMes" data-ym="' + ms[i] + '">' +
           '<span class="cv">' + (vals[i] ? esc(brlCurto(vals[i])) : "-") + '</span>' +
           '<i class="' + (ms[i] === ym ? "" : "dim") + '" style="height:' + alt + '%"></i>' +
           '<span class="cl">' + esc(mesBR(ms[i])) + '</span>' +
         '</button>';
  }
  return h + '</div><div class="tiny muted" style="margin-top:6px">' +
         'Valor total de contrato somado com cota, em R$. Toque numa barra pra abrir o mes.</div>';
}

/* ------------------------ 2. PREVISAO DO MES ------------------------ */
function pnlBlocoPrevisao(N){
  var nome = pnlNomeMes(N.ym);
  var edicao = PAINEL.ptModo === "edicao";
  var h = '<div class="card">' +
    '<div class="card-head">' +
      '<div><div class="sec-title">Previsao de ' + esc(nome) + '</div>' +
      '<div class="sec-sub">Valor cheio em tres linhas, nunca um ponderado como manchete: ' +
      'com 10 a 15 negocios abertos o resultado de cada um e binario.</div></div>' +
    '</div>';

  /* As tres manchetes. A distancia entre Provavel e Sem risco alto e a
     metrica mais honesta do sistema: mede quanto da previsao esta apoiado
     em negocio que ninguem toca ha semanas. */
  h += '<div class="kpis">' +
    pnlKpi("Piso", pnlNum(brl(N.piso), "piso", ""),
      'ja assinado em ' + esc(nome) + ', nao depende de mais ninguem') +
    pnlKpi("Provavel", pnlNum(brl(N.provavel), "provavel", "lime"),
      'piso mais ' + N.altaChance.length + (N.altaChance.length === 1 ? ' negocio' : ' negocios') + ' em alta chance', true) +
    pnlKpi("Sem risco alto", pnlNum(brl(N.limpo), "limpo", N.limpo < N.provavel ? "warn" : ""),
      N.riscoItens.length
        ? brl(N.provavel - N.limpo) + ' do Provavel esta em ' + N.riscoItens.length +
          (N.riscoItens.length === 1 ? ' negocio de risco alto' : ' negocios de risco alto') + '. ' +
          pnlNumPeq("ver quais", "risco", "var(--warn)")
        : 'nenhum negocio de alta chance esta em risco alto') +
  '</div>';

  // Alternador MES | EDICAO do patrocinio: cota nao obedece mes, obedece
  // ciclo de verba da montadora.
  h += '<div class="card-head" style="margin:18px 0 10px">' +
    '<div class="h3" style="margin:0">Duas reguas, nunca no mesmo numero</div>' +
    '<div class="pills"><span class="tiny muted">Patrocinio por</span>' +
      '<button class="pill' + (edicao ? "" : " on") + '" data-a="painelPt" data-m="mes">Mes</button>' +
      '<button class="pill' + (edicao ? " on" : "") + '" data-a="painelPt" data-m="edicao">Edicao</button>' +
    '</div>' +
  '</div>';

  h += edicao ? pnlTabelaEdicao(N) : pnlTabelaMes(N);
  h += '<div class="tiny muted" style="margin-top:10px"><b>Coluna Total.</b> ' + esc(PNL_NOTA_TOTAL) + '</div>';

  // Novo MRR em jogo, na unidade certa (R$/mes), nunca somado ao total.
  h += '<div class="kpi-s" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">' +
    '<span class="muted">Novo MRR em jogo: </span>' +
    pnlNumPeq(brl(N.novoMrr) + "/mes", "novoMrr", "var(--green)") + '<span class="muted"> fechado, </span>' +
    pnlNumPeq(brl(N.mrrAlta) + "/mes", "altaAg", "") + '<span class="muted"> em alta chance de agencia</span>' +
  '</div>';

  h += pnlLinhaMeta(N);
  return h + '</div>';
}

// Definicao das colunas, usada pela tabela do desktop e pelos cartoes do
// celular, pra que os dois nunca discordem.
function pnlColunasMes(N){
  var a = N.porTipo.agencia, p = N.porTipo.patrocinio;
  return [
    { rot:"Agencia",    fechado:a.fechado, alta:a.alta, piso:a.piso, provavel:a.provavel, limpo:a.limpo,
      lf:"fechadoT", la:"altaT", ex:' data-tipo="agencia"' },
    { rot:"Patrocinio", fechado:p.fechado, alta:p.alta, piso:p.piso, provavel:p.provavel, limpo:p.limpo,
      lf:"fechadoT", la:"altaT", ex:' data-tipo="patrocinio"' },
    { rot:"Total",      fechado:N.fechado, alta:N.provavel - N.piso, piso:N.piso, provavel:N.provavel, limpo:N.limpo,
      lf:"fechado", la:"alta", ex:"", total:true }
  ];
}

function pnlTabelaMes(N){
  var c = pnlColunasMes(N), i;
  // Desktop: tabela. Celular: tres cartoes empilhados, porque tabela com
  // rolagem lateral no celular nao e lida por ninguem.
  var h = '<div class="tw no-mob"><table class="tb"><thead><tr><th>' + esc(pnlNomeMes(N.ym)) + '</th>';
  for(i = 0; i < c.length; i++) h += '<th class="r">' + esc(c[i].rot) + '</th>';
  h += '</tr></thead><tbody>';

  h += '<tr><td class="cel-nome">Fechado</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].fechado), c[i].lf, "", c[i].ex) + '</td>';
  h += '</tr><tr><td class="cel-nome">Alta chance</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].alta), c[i].la, "", c[i].ex) + '</td>';
  h += '</tr><tr><td class="cel-nome">Provavel</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].provavel), c[i].total ? "provavel" : "provavelT", "var(--lime)", c[i].ex) + '</td>';
  h += '</tr><tr><td class="cel-nome">Sem risco alto</td>';
  for(i = 0; i < c.length; i++)
    h += '<td class="r">' + pnlNumPeq(brl(c[i].limpo), c[i].total ? "limpo" : "limpoT", "", c[i].ex) + '</td>';
  h += '</tr></tbody></table></div>';

  h += '<div class="only-mob">';
  for(i = 0; i < c.length; i++){
    h += '<div class="card" style="margin-top:9px;background:var(--card2)">' +
      '<div class="h3" style="margin-bottom:8px">' + esc(c[i].rot) + '</div>' +
      pnlLinhaCartao("Fechado", pnlNumPeq(brl(c[i].fechado), c[i].lf, "", c[i].ex)) +
      pnlLinhaCartao("Alta chance", pnlNumPeq(brl(c[i].alta), c[i].la, "", c[i].ex)) +
      pnlLinhaCartao("Provavel", pnlNumPeq(brl(c[i].provavel), c[i].total ? "provavel" : "provavelT", "var(--lime)", c[i].ex)) +
      pnlLinhaCartao("Sem risco alto", pnlNumPeq(brl(c[i].limpo), c[i].total ? "limpo" : "limpoT", "", c[i].ex)) +
    '</div>';
  }
  h += '</div>';

  // Mes vazio de patrocinio nao some nem parece problema: diz onde a cota
  // esta, que e na edicao.
  if(!N.porTipo.patrocinio.fechado && !N.porTipo.patrocinio.alta){
    var e = pnlEdicao(PAINEL.ed || (EDICOES[0] && EDICOES[0].k));
    h += '<div class="kpi-s" style="margin-top:10px">Nenhuma cota prevista pra ' + esc(pnlNomeMes(N.ym)) + '. ' +
      (e.ed ? 'Na edicao ' + esc(e.ed.rot) + ': ' + pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(e.k) + '"') +
              ' <span class="muted">em aberto.</span>' : '') + '</div>';
  }
  return h;
}

function pnlTabelaEdicao(N){
  var a = N.porTipo.agencia;
  var k = PAINEL.ed || (EDICOES[0] && EDICOES[0].k);
  var e = pnlEdicao(k), i;
  var pills = "";
  for(i = 0; i < EDICOES.length; i++){
    pills += '<button class="pill' + (EDICOES[i].k === k ? " on" : "") + '" data-a="painelEd" data-k="' +
             esc(EDICOES[i].k) + '">' + esc(EDICOES[i].rot) + '</button>';
  }
  var h = '<div class="pills" style="margin-bottom:10px">' + pills + '</div>';

  h += '<div class="tw no-mob"><table class="tb"><thead><tr>' +
    '<th>Regua</th><th class="r">Agencia (' + esc(mesBR(N.ym)) + ')</th>' +
    '<th class="r">Patrocinio (' + esc(e.ed ? e.ed.rot : "edicao") + ')</th><th class="r">Total</th>' +
  '</tr></thead><tbody>' +
    '<tr><td class="cel-nome">Fechado</td>' +
      '<td class="r">' + pnlNumPeq(brl(a.fechado), "fechadoT", "", ' data-tipo="agencia"') + '</td>' +
      '<td class="r">' + pnlNumPeq(brl(e.vendido), "edVendido", "", ' data-k="' + esc(k) + '"') + '</td>' +
      '<td class="r muted">nao se soma</td></tr>' +
    '<tr><td class="cel-nome">Em aberto</td>' +
      '<td class="r">' + pnlNumPeq(brl(a.alta), "altaT", "", ' data-tipo="agencia"') + '</td>' +
      '<td class="r">' + pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(k) + '"') + '</td>' +
      '<td class="r muted">nao se soma</td></tr>' +
  '</tbody></table></div>';

  h += '<div class="only-mob">' +
    '<div class="card" style="margin-top:9px;background:var(--card2)">' +
      '<div class="h3" style="margin-bottom:8px">Agencia, ' + esc(mesBR(N.ym)) + '</div>' +
      pnlLinhaCartao("Fechado", pnlNumPeq(brl(a.fechado), "fechadoT", "", ' data-tipo="agencia"')) +
      pnlLinhaCartao("Alta chance", pnlNumPeq(brl(a.alta), "altaT", "", ' data-tipo="agencia"')) +
    '</div>' +
    '<div class="card" style="margin-top:9px;background:var(--card2)">' +
      '<div class="h3" style="margin-bottom:8px">Patrocinio, ' + esc(e.ed ? e.ed.rot : "edicao") + '</div>' +
      pnlLinhaCartao("Vendido", pnlNumPeq(brl(e.vendido), "edVendido", "", ' data-k="' + esc(k) + '"')) +
      pnlLinhaCartao("Em aberto", pnlNumPeq(brl(e.emAberto), "edAberto", "", ' data-k="' + esc(k) + '"')) +
    '</div>' +
  '</div>';

  /* Nesta regua a coluna Total fica vazia de proposito: agencia esta no
     mes e patrocinio esta na edicao inteira. Somar duas janelas de tempo
     diferentes produz um numero que nao responde pergunta nenhuma. */
  h += '<div class="tiny muted" style="margin-top:10px">Com o patrocinio por edicao nao existe Total: ' +
       'a coluna de agencia e do mes e a de patrocinio e da edicao inteira. ' +
       'Somar duas janelas de tempo diferentes daria um numero que nao responde nada.</div>';
  return h;
}

// So aparece dentro de .only-mob, entao a altura minima e a do dedo: 44px.
function pnlLinhaCartao(rot, valorHtml){
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;' +
         'min-height:44px;padding:4px 0;border-bottom:1px solid var(--border)">' +
         '<span class="muted small">' + esc(rot) + '</span>' + valorHtml + '</div>';
}

function pnlLinhaMeta(N){
  var bloqueio = motivoBloqueio("crm_config");
  var botao = '<button class="btn btn-sm" data-a="editarMeta"' + (bloqueio ? " disabled" : "") + '>' +
              (N.temMeta ? "Editar meta" : "Definir meta") + '</button>' +
              (bloqueio ? '<div class="tiny" style="color:var(--text3);margin-top:4px">' + esc(bloqueio) + '</div>' : '');

  if(!N.temMeta){
    // Sem meta cadastrada, nunca NaN%.
    return '<div class="card-head" style="margin:12px 0 0;border-top:1px solid var(--border);padding-top:12px">' +
      '<div class="muted">Meta de MRR novo: <b>sem meta definida</b>. Enquanto nao houver meta, ' +
      'o painel nao mostra percentual nenhum.</div><div>' + botao + '</div></div>';
  }
  var cls = N.pctMeta >= 100 ? "green" : (N.pctMeta >= 60 ? "" : "warn");
  return '<div style="margin:12px 0 0;border-top:1px solid var(--border);padding-top:12px">' +
    '<div class="card-head" style="margin-bottom:6px">' +
      '<div class="muted2">Meta de MRR novo: <b>' + brl(N.meta) + '/mes</b>. Fechado ' +
        pnlNumPeq(brl(N.novoMrr) + "/mes", "novoMrr", "") +
        '<span class="muted">, ' + (N.faltam > 0 ? 'faltam <b>' + brl(N.faltam) + '/mes</b>' : 'meta batida') +
        ' (' + pct(N.pctMeta) + ')</span></div>' +
      '<div>' + botao + '</div>' +
    '</div>' + pnlBarra(N.pctMeta, cls) + '</div>';
}

/* ------------------------ 3. SAUDE DO FUNIL ------------------------- */
function pnlBlocoSaude(S, N){
  if(!S.total) return "";
  var h = '<div class="card">' +
    '<div class="card-head"><div>' +
      '<div class="sec-title">Saude do funil</div>' +
      '<div class="sec-sub">Nao virou indice de 0 a 100 de proposito: indice composto ninguem sabe o que ' +
      'fazer com, e "3 negocios fora" tem nome, valor e telefone.</div>' +
    '</div></div><div class="kpis">';

  var clsDia = S.pctEmDia >= 75 ? "green" : (S.pctEmDia >= 50 ? "warn" : "red");
  h += '<div class="kpi"><div class="kpi-l">Negocios em dia</div>' +
    pnlNum(S.emDia.length + '<span style="font-size:17px;color:var(--text3)"> de ' + S.total + '</span>', "emDia",
      clsDia === "green" ? "green" : (clsDia === "warn" ? "warn" : "red")) +
    pnlBarra(S.pctEmDia, clsDia) +
    '<div class="kpi-s">Em dia = proximo passo com data no futuro e contato dentro do limite do funil ' +
    '(5 dias em agencia, 15 em patrocinio). ' +
    (S.foraDia.length ? pnlNumPeq(String(S.foraDia.length), "foraDia", "") + '<span class="muted"> fora.</span>' : '') +
    '</div></div>';

  // Concentracao: quatro linhas de codigo e o alerta mais honesto do painel.
  if(S.temConcentracao){
    var cc = S.concentracao > 60 ? "red" : (S.concentracao > 40 ? "warn" : "");
    h += '<div class="kpi"><div class="kpi-l">Concentracao do mes</div>' +
      pnlNum(pct(S.concentracao), "concentra", cc) +
      pnlBarra(S.concentracao, cc || "green") +
      '<div class="kpi-s">' + esc((S.maior && (S.maior.empresa || S.maior.titulo)) || "o maior negocio") +
      ' sozinho vale ' + brl(valorRefDe(S.maior)) + ' de ' + brl(S.somaMes) +
      ' em ' + S.abertosMes.length + ' negocios abertos previstos pro mes.' +
      (S.concentracao > 60 ? '<br><b style="color:var(--red)">A previsao do mes e uma moeda girando num negocio so.</b>' : '') +
      '</div></div>';
  } else {
    h += pnlKpi("Concentracao do mes", '<div class="kpi-v muted" style="font-size:20px">-</div>',
      'So aparece com 3 ou mais negocios abertos previstos pro mes. Agora sao ' + S.abertosMes.length + '.');
  }

  var cv = !S.vencidos.length ? "green" : (S.piorAtraso > 30 ? "red" : "warn");
  h += '<div class="kpi"><div class="kpi-l">Com data vencida</div>' +
    pnlNum(String(S.vencidos.length) + '<span style="font-size:17px;color:var(--text3)"> ' +
      (S.vencidos.length === 1 ? 'negocio' : 'negocios') + '</span>', "vencidos", cv) +
    '<div class="kpi-s">' +
    (!S.vencidos.length
      ? 'Nenhum proximo passo vencido. Funil em dia.'
      : 'O pior esta vencido ha ' + S.piorAtraso + (S.piorAtraso === 1 ? ' dia' : ' dias') + '. ' +
        (S.piorAtraso > 30 ? 'Passou de 30 dias nao e atraso, e negocio morto contando na conta.' : '')) +
    '</div></div>';

  h += '</div></div>';
  return h;
}

/* ------------------------ 4. GANHOS E PERDAS ------------------------ */
function pnlBlocoGanhosPerdas(){
  var G = pnlGanhosPerdas();
  var h = '<div class="card">' +
    '<div class="card-head"><div>' +
      '<div class="sec-title">Ganhos e perdas</div>' +
      '<div class="sec-sub">Janela de 12 meses, so com negocio ja fechado. ' +
      G.fechados.length + (G.fechados.length === 1 ? ' negocio fechado' : ' negocios fechados') + ' no periodo.</div>' +
    '</div></div>';

  if(!G.fechados.length){
    return h + '<div class="empty"><div class="ei">🗂</div><div class="et">Nada fechado nos ultimos 12 meses</div>' +
      '<div class="ex">Taxa de ganho, ciclo e motivo de perda aparecem aqui assim que o primeiro negocio for ' +
      'fechado como ganho ou perdido.</div></div></div>';
  }

  h += '<div class="kpis">';
  // Taxa de ganho: fora_do_perfil FORA do denominador.
  h += '<div class="kpi accent"><div class="kpi-l">Taxa de ganho</div>' +
    (G.temTaxa
      ? pnlNum(pct(G.taxaGanho), "ganhos12", "lime") +
        '<div class="kpi-s">' + pnlNumPeq(String(G.ganhos.length), "ganhos12", "") +
        '<span class="muted"> ganhos em ' + G.den + ' decididos. </span>' +
        (G.foraPerfil.length
          ? pnlNumPeq(String(G.foraPerfil.length), "foraPerfil", "") +
            '<span class="muted"> desqualificados ficaram fora da conta: dizer nao nao e derrota.</span>'
          : '<span class="muted">Nenhum desqualificado no periodo.</span>') + '</div>'
      : '<div class="kpi-v muted" style="font-size:20px">-</div><div class="kpi-s">nada decidido ainda</div>') +
  '</div>';

  h += pnlKpi("Ciclo ate ganhar",
    '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(G.ciclos, function(v){ return v + " dias"; }) + '</div>',
    'de criado ate fechado, mediana em dias');

  h += pnlKpi("Ciclo ate perder",
    '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(G.ciclosPerda, function(v){ return v + " dias"; }) + '</div>',
    'quanto tempo se gasta ate descobrir que nao vai. Perto do ciclo de ganho e bom sinal.');

  h += '</div>';

  h += pnlConversaoHTML("agencia", G.fechados);
  h += pnlConversaoHTML("patrocinio", G.fechados);
  h += pnlMotivosHTML(G);
  h += pnlTicketHTML(G);
  return h + '</div>';
}

function pnlConversaoHTML(tipo, fechados){
  var linhas = pnlConversao(tipo, fechados), i, tem = false;
  for(i = 0; i < linhas.length; i++) if(linhas[i].base) tem = true;
  var rot = tipo === "agencia" ? "Agencia" : "Patrocinio";
  if(!tem){
    return '<div class="h3" style="margin-top:18px">Conversao por estagio, ' + esc(rot) + '</div>' +
           '<div class="tiny muted">Nenhum negocio de ' + esc(rot.toLowerCase()) +
           ' fechado nos ultimos 12 meses, entao nao ha conversao pra calcular.</div>';
  }
  var h = '<div class="h3" style="margin-top:18px">Conversao por estagio, ' + esc(rot) + '</div>' +
          '<div class="tiny muted" style="margin-bottom:8px">Quantos dos que chegaram no estagio avancaram pro seguinte. ' +
          'So negocio ja fechado entra: aberto parado no estagio 2 ainda pode avancar.</div>' +
          '<div class="funnel">';
  for(i = 0; i < linhas.length; i++){
    var l = linhas[i];
    h += '<button style="display:block;width:100%;text-align:left" data-a="verLista" data-lista="conv" ' +
         'data-tipo="' + tipo + '" data-i="' + l.i + '">' +
      '<div class="fn-row">' +
        '<div class="fn-lbl">' + esc(l.de) + '</div>' +
        '<div class="fn-bar"><i style="width:' + l.taxa + '%"></i></div>' +
        '<div class="fn-val">' + (l.base ? pct(l.taxa) : "-") + '</div>' +
      '</div>' +
      '<div class="tiny muted" style="margin:1px 0 7px">' + l.passou + ' de ' + l.base +
      ' passaram pra ' + esc(l.para) + '</div>' +
    '</button>';
  }
  return h + '</div>';
}

function pnlMotivosHTML(G){
  if(!G.motivos.length){
    return '<div class="h3" style="margin-top:18px">Motivo de perda</div>' +
           '<div class="tiny muted">Nenhuma perda real nos ultimos 12 meses.</div>';
  }
  var maior = G.motivos[0].valor || 1, i;
  var h = '<div class="h3" style="margin-top:18px">Motivo de perda, por R$ perdido</div>' +
    '<div class="tiny muted" style="margin-bottom:8px">Ranqueado por dinheiro, nunca por quantidade: ' +
    'tres contratos pequenos perdidos por preco somam menos que uma cota perdida por verba. ' +
    'As duas colunas ficam visiveis.</div><div class="funnel">';
  for(i = 0; i < G.motivos.length; i++){
    var m = G.motivos[i];
    var mp = motivoPerdaDe(m.k);
    var larg = Math.max(2, Math.round((m.valor / maior) * 100));
    h += '<button style="display:block;width:100%;text-align:left" data-a="verLista" data-lista="motivo" data-k="' + esc(m.k) + '">' +
      '<div class="fn-row">' +
        '<div class="fn-lbl">' + esc(mp ? mp.rot : "sem motivo") + '</div>' +
        '<div class="fn-bar"><i style="width:' + larg + '%"></i></div>' +
        '<div class="fn-val">' + esc(brlCurto(m.valor)) +
          '<div class="tiny muted" style="font-weight:400">' + m.n + (m.n === 1 ? ' negocio' : ' negocios') + '</div>' +
        '</div>' +
      '</div>' +
    '</button>';
  }
  return h + '</div><div class="tiny muted" style="margin-top:6px">' +
    'R$ perdido usa valor total de contrato na agencia e valor de cota no patrocinio, ' +
    'so pra ranquear. Nao e caixa.</div>';
}

function pnlTicketHTML(G){
  var ag = [], fee = [], mes = [], i, n;
  var porEd = {};
  for(i = 0; i < G.ganhos.length; i++){
    n = G.ganhos[i];
    if(n.tipo === "agencia"){
      ag.push(valorRefDe(n));
      fee.push(mrrDe(n));
      // meses 0 = indeterminado, e valorRefDe ja trata como 12. A duracao
      // mediana tem que contar a mesma coisa, senao as duas linhas brigam.
      mes.push(((n.ag && n.ag.meses) || 0) || 12);
    } else if(n.pt){
      var k = n.pt.edicao || "sem_edicao";
      if(!porEd[k]) porEd[k] = [];
      porEd[k].push(n.pt.valor || 0);
    }
  }
  var h = '<div class="h3" style="margin-top:18px">Ticket dos ganhos, 12 meses</div>' +
    '<div class="tiny muted" style="margin-bottom:8px">Agencia com tres numeros e tres unidades: ' +
    'R$ 42.000 pode ser 3.500 por 12 meses ou 7.000 por 6, e sao negocios diferentes.</div>' +
    '<div class="kpis">' +
    pnlKpi("Contrato de agencia", '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(ag, brl) + '</div>',
      'valor total do contrato, em R$. ' + (ag.length ? pnlNumPeq("ver a lista", "ticketAg", "") : "")) +
    pnlKpi("Fee de agencia", '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(fee, function(v){ return brl(v) + "/mes"; }) + '</div>',
      'R$ por mes que a Lime fatura, ja com a fatia da verba') +
    pnlKpi("Duracao de agencia", '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(mes, function(v){ return v + " meses"; }) + '</div>',
      'em meses. Contrato indeterminado conta como 12.');
  var ek;
  for(ek in porEd){
    if(!Object.prototype.hasOwnProperty.call(porEd, ek)) continue;
    var ed = edicaoDe(ek);
    h += pnlKpi("Cota " + esc(ed ? ed.rot : ek),
      '<div class="kpi-v" style="font-size:22px">' + pnlAmostra(porEd[ek], brl) + '</div>',
      'cota vendida, em R$. ' + pnlNumPeq("ver a lista", "edVendido", "", ' data-k="' + esc(ek) + '"'));
  }
  return h + '</div>';
}
