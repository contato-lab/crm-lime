/* =====================================================================
   CRM LIME - NEGOCIOS: A LISTA E O DETALHE

   O detalhe e a segunda tela mais importante do sistema, depois do Hoje,
   e o registro de atividade que mora dentro dele e o fluxo mais usado de
   todos. Tudo aqui foi desenhado em cima de tres decisoes:

   1. A BARRA DE REGISTRAR FICA ACIMA DA LINHA DO TEMPO. Quem abre um
      negocio abre pra registrar o que acabou de acontecer, nao pra ler o
      historico. Ler e a excecao, escrever e a regra.
   2. O REGISTRO CUSTA ZERO LEITURA E 2 CLIQUES. Uma escrita na atividade,
      uma no negocio, e o toast so aparece depois do servidor confirmar.
   3. NADA DIZ "SALVO" ANTES DE ESTAR SALVO. O item entra na timeline com
      opacidade 0.6 e um reloginho, e so fica opaco quando a Promise
      resolve. O CRM que mente uma vez sobre isso perde o vendedor.
   ===================================================================== */

/* ---------------------------------------------------------------------
   ESTADO DO MODULO
   Filtro da lista guardado no aparelho: o vendedor que trabalha so
   patrocinio nao pode ter que remarcar a pilula toda manha.
   --------------------------------------------------------------------- */
var NG_FILTRO = recuperar("filtroNegocios", null) || {};
if(!NG_FILTRO.tipo)   NG_FILTRO.tipo   = "todos";
if(!NG_FILTRO.status) NG_FILTRO.status = "abertos";
if(!NG_FILTRO.ordem)  NG_FILTRO.ordem  = "valor";

/* Proximo passo sugerido por estagio. Nao e adivinhacao: e o ato que o
   criterio de saida daquele estagio pede. Em Diagnostico o que falta e
   mandar a proposta; em Proposta o que falta e cobrar a resposta. */
var NG_SUGESTAO = {
  ag_contato:"ligar",      ag_diagnostico:"enviar_prop",
  ag_proposta:"cobrar_prop", ag_negociacao:"enviar_contr",
  pt_mapeado:"mensagem",   pt_apresentado:"enviar_prop",
  pt_proposta:"cobrar_prop", pt_aprovacao:"cobrar_aprov",
  pt_contrato:"enviar_contr"
};

/* O CSS da casa nao tem o grid de duas colunas com corte em 900px que a
   secao 6.3 pede, nem a linha de rotulo e valor dos blocos da lateral.
   Entao o detalhe carrega esse pedaco de estilo, com prefixo ng- pra nao
   encostar em nada. E so layout: cor, botao, cartao, etiqueta e o stepper
   de bolinha (.step, .step-p, .step-l, .step-rot) continuam vindo do
   sistema de design, que ja tem todos eles. */
var NG_CSS =
'<style>' +
'.ng-cols{display:flex;flex-direction:column;gap:16px}' +
'.ng-main,.ng-side{display:flex;flex-direction:column;gap:16px;min-width:0}' +
'@media(min-width:900px){.ng-cols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}}' +
'.ng-lin{display:flex;justify-content:space-between;gap:12px;padding:7px 0;' +
  'border-bottom:1px solid var(--border);font-size:12.5px}' +
'.ng-lin:last-child{border-bottom:0}' +
'</style>';

/* ---------------------------------------------------------------------
   HELPERS PEQUENOS (prefixo ng, sao privados deste modulo)
   --------------------------------------------------------------------- */
function ngCopia(o){
  var r = {};
  for(var k in o) if(Object.prototype.hasOwnProperty.call(o||{},k)) r[k] = o[k];
  return r;
}
function ngOpcoes(pares, sel, vazio){
  var h = vazio ? '<option value="">' + esc(vazio) + '</option>' : '';
  for(var i=0;i<pares.length;i++){
    h += '<option value="' + esc(pares[i][0]) + '"' +
         (pares[i][0] === sel ? ' selected' : '') + '>' + esc(pares[i][1]) + '</option>';
  }
  return h;
}
function ngRotEstagio(k){
  for(var t in FUNIL){
    if(!Object.prototype.hasOwnProperty.call(FUNIL,t)) continue;
    for(var i=0;i<FUNIL[t].length;i++) if(FUNIL[t][i].k === k) return FUNIL[t][i].rot;
  }
  return k || "";
}
function ngRotTipo(k, longo){
  for(var i=0;i<TIPOS.length;i++) if(TIPOS[i].k === k) return longo ? TIPOS[i].rotLongo : TIPOS[i].rot;
  return k || "";
}
function ngCorTemp(t){
  return t === "verde" ? "var(--green)" : t === "amarelo" ? "var(--warn)" :
         t === "vermelho" ? "var(--red)" : t === "congelado" ? "var(--blue)" : "var(--text3)";
}
// Link de proposta so abre se for http ou https. Campo de texto livre que
// vira href e o caminho mais curto pra um javascript: colado sem querer.
function ngLinkSeguro(u){
  var s = String(u||"").trim();
  return /^https?:\/\//i.test(s) ? s : "";
}
function ngDiaDoTs(ts){
  if(!ts) return "";
  var d = new Date(Number(ts));
  if(isNaN(d.getTime())) return "";
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
/* Dinheiro digitado a mao.
   O lerValor() de 02-util ja trata ponto separando grupos de tres digitos
   como milhar desde 11/09/2026, entao "3.500" e "1.200.000" chegam certos
   sozinhos. Esta funcao continua na frente dele por dois motivos: ela
   tolera o "R$" colado no numero antes da comparacao, e ela arredonda,
   porque dinheiro neste sistema e SEMPRE inteiro em reais, sem centavo
   (secao 2.2). Ela nunca desfaz o que o lerValor faz: so tira o ponto de
   milhar de um texto que ja e so milhar. */
function ngLerDinheiro(s){
  var t = String(s == null ? "" : s).trim();
  if(/^\d{1,3}(\.\d{3})+$/.test(t.replace(/[^\d.]/g, ""))) t = t.replace(/\./g, "");
  return Math.round(lerValor(t));
}
// Valor do negocio em uma linha, com a unidade que cada funil usa.
function ngValorTxt(n){
  if(n.tipo === "agencia") return brl(mrrDe(n)) + "/mes";
  return brl((n.pt && n.pt.valor) || 0);
}

/* ---------------------------------------------------------------------
   OS CHIPS DE DATA ESPALHAM DE PROPOSITO
   Reancorar 6 negocios seguidos com um clique em +1sem empilharia os 6
   exatamente no mesmo dia, e dali a uma semana a fila que existe pra
   parecer terminavel vira uma parede de 6 cobrancas. Cada clique sorteia
   dentro de uma janela, entao a mesma acao repetida distribui a semana
   sozinha. Em dia util, porque cobranca no sabado nao acontece.
   --------------------------------------------------------------------- */
function ngSorteio(min, max){ return min + Math.floor(Math.random()*(max-min+1)); }
function ngDiasUteis(iso, n){
  var d = iso || hojeISO(), i = 0, s;
  while(i < n){
    d = somaDias(d, 1);
    s = dataDe(d);
    if(s && s.getDay() !== 0 && s.getDay() !== 6) i++;
  }
  return d;
}
function ngDataChip(k){
  var h = hojeISO();
  if(k === "2d")   return ngDiasUteis(h, ngSorteio(2, 3));    // 2 ou 3 dias uteis
  if(k === "1sem") return ngDiasUteis(h, ngSorteio(6, 9));    // de 6 a 9
  if(k === "15d")  return ngDiasUteis(h, ngSorteio(12, 18));  // de 12 a 18
  return h;
}

/* Copia do negocio com o proximo passo APAGADO, pra passar pro
   blocoProxPasso quando o passo antigo acabou de ser cumprido.

   Existe porque blocoProxPasso da preferencia ao que ja esta gravado, e
   isso e o certo em duas telas (trocar o proximo passo, e a folha de
   estagio antes de escolher) e o errado em tres (registrar atividade,
   volta do WhatsApp, folha de estagio depois de escolher). Nessas tres a
   pessoa ACABOU de cumprir o passo, e reapresentar o mesmo com a data
   vencida faz o registro deixar o negocio atrasado do mesmo jeito.

   Compartilhada de proposito: a mesma correcao ja tinha sido escrita a
   mao em dois arquivos diferentes, e a terceira copia era so questao de
   tempo. Quem precisa chama semProxPasso(n).                           */
function semProxPasso(n){
  var c = ngCopia(n);
  c.proxTipo = ""; c.proxData = ""; c.proxTexto = ""; c.proxHora = "";
  return c;
}

/* ---------------------------------------------------------------------
   BLOCO DE PROXIMO PASSO
   Dono deste modulo, usado tambem pela folha de estagio do funil e pelo
   cadastro. A obrigacao e picklist mais data; o texto e opcional. Data
   sozinha vira botao de adiar alarme, e texto obrigatorio vira "TBD".
   --------------------------------------------------------------------- */
function blocoProxPasso(pref, n, ligadoPadrao){
  var bloq = motivoBloqueio("crm_negocios");
  var lig  = bloq ? false : (ligadoPadrao !== false);
  var tipo = (n && n.proxTipo) || NG_SUGESTAO[(n && n.estagio) || ""] || "ligar";
  var pt   = proxTipoDe(tipo) || PROX_TIPOS[0];
  var data = (n && n.proxData) || (pt.dias ? ngDiasUteis(hojeISO(), pt.dias) : "");
  var pares = [];
  for(var i=0;i<PROX_TIPOS.length;i++){
    // Cobrar aprovacao interna so existe em patrocinio: em agencia nao ha
    // comite, o dono decide na mesa.
    if(PROX_TIPOS[i].funil && n && PROX_TIPOS[i].funil !== n.tipo) continue;
    pares.push([PROX_TIPOS[i].k, PROX_TIPOS[i].ic + "  " + PROX_TIPOS[i].rot]);
  }
  var d = bloq ? ' disabled' : '';

  return '' +
  '<div class="card" style="background:var(--card2);padding:13px">' +
    '<label style="display:flex;align-items:center;gap:9px;cursor:pointer">' +
      '<input type="checkbox" id="' + pref + 'on" data-ch="ngChProxOn" data-pref="' + pref + '"' +
        (lig ? ' checked' : '') + d + ' style="width:18px;height:18px;accent-color:var(--lime)">' +
      '<span class="h3" style="margin:0">Marcar o proximo passo</span>' +
    '</label>' +
    '<div id="' + pref + 'box"' + (lig ? '' : ' hidden') + ' style="margin-top:11px;display:flex;flex-direction:column;gap:10px">' +
      '<select class="inp" id="' + pref + 'tipo" data-ch="ngChProxTipo" data-pref="' + pref + '"' + d + '>' +
        ngOpcoes(pares, tipo) +
      '</select>' +
      '<div class="pills">' +
        '<button type="button" class="pill" data-a="ngChipData" data-pref="' + pref + '" data-k="2d"' + d + '>+2 dias</button>' +
        '<button type="button" class="pill" data-a="ngChipData" data-pref="' + pref + '" data-k="1sem"' + d + '>+1 semana</button>' +
        '<button type="button" class="pill" data-a="ngChipData" data-pref="' + pref + '" data-k="15d"' + d + '>+15 dias</button>' +
        '<input class="inp" type="date" id="' + pref + 'data" value="' + esc(data) + '"' + d +
          ' style="width:auto;flex:1;min-width:148px">' +
      '</div>' +
      '<div id="' + pref + 'horaBox"' + (pt.hora ? '' : ' hidden') + '>' +
        '<div class="fld"><label>Hora da reuniao</label>' +
          '<input class="inp" type="time" id="' + pref + 'hora" value="' + esc((n && n.proxHora) || "") + '"' + d + '></div>' +
      '</div>' +
      '<input class="inp" type="text" id="' + pref + 'txt" maxlength="140" placeholder="detalhe do passo (opcional)" value="' +
        esc((n && n.proxTexto) || "") + '"' + d + '>' +
      // .err so pinta de vermelho dentro de .fld no design system.
      '<div class="fld"><div class="err" id="' + pref + 'err"></div></div>' +
    '</div>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:8px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Le o bloco de volta. Devolve sempre o mesmo formato, com ok:false e o
   texto do erro quando falta coisa, pra quem chamou nao precisar saber
   quais campos existem. */
function lerProxPasso(pref){
  var r = { proxTipo:"", proxData:"", proxTexto:"", proxHora:"", ligado:true, ok:true, erro:"" };
  var on = document.getElementById(pref + "on");
  r.ligado = on ? !!on.checked : true;
  if(!r.ligado) return r;

  var t = document.getElementById(pref + "tipo");
  var d = document.getElementById(pref + "data");
  var h = document.getElementById(pref + "hora");
  var x = document.getElementById(pref + "txt");

  r.proxTipo  = (t && t.value) || "";
  r.proxData  = (d && d.value) || "";
  r.proxTexto = String((x && x.value) || "").slice(0,140);
  var ptp = proxTipoDe(r.proxTipo);
  r.proxHora  = (ptp && ptp.hora && h && h.value) ? h.value : "";

  if(!r.proxTipo){ r.ok = false; r.erro = "Escolha o que vem depois."; }
  else if(!r.proxData){ r.ok = false; r.erro = "Escolha a data do proximo passo."; }
  var e = document.getElementById(pref + "err");
  if(e) e.textContent = r.ok ? "" : r.erro;
  return r;
}

ACOES.ngChProxOn = function(el){
  var box = document.getElementById(el.getAttribute('data-pref') + "box");
  if(box) box.hidden = !el.checked;
};
ACOES.ngChProxTipo = function(el){
  var pref = el.getAttribute('data-pref');
  var p = proxTipoDe(el.value);
  var hb = document.getElementById(pref + "horaBox");
  if(hb) hb.hidden = !(p && p.hora);
  // Trocar o tipo re-sugere a data, mas so quando o campo ainda esta
  // vazio: sobrescrever data escolhida a mao e o jeito mais rapido de
  // fazer alguem desistir do picklist.
  var d = document.getElementById(pref + "data");
  if(d && !d.value && p && p.dias) d.value = ngDiasUteis(hojeISO(), p.dias);
};
ACOES.ngChipData = function(el){
  var d = document.getElementById(el.getAttribute('data-pref') + "data");
  if(d) d.value = ngDataChip(el.getAttribute('data-k'));
};

/* ---------------------------------------------------------------------
   REGISTRAR ATIVIDADE
   1 escrita em crm_atividades, 1 update no negocio, ZERO leituras.

   dados aceita:
     tipo, texto, quando        o que aconteceu e em que dia
     prox                       o que lerProxPasso(pref) devolveu
     adiar:true                 incrementa vezesAdiado
     semToque:true              nao mexe em ultimoToqueEm (mudanca de estagio)
     de / para                  so em tipo "estagio"
     negocioExtra               campos a mais pro update do negocio, usado
                                pela folha de estagio do funil
   --------------------------------------------------------------------- */
function registrarAtividade(negocioId, dados){
  var n = achar("negocios", negocioId);
  if(!n) return Promise.reject(new Error("Esse negocio nao esta carregado neste aparelho."));
  dados = dados || {};

  var tipo = dados.tipo || "nota";
  var bloq = motivoBloqueio("crm_atividades", { tipo:tipo });
  if(bloq){ toast(bloq, "bad"); return Promise.reject(new Error(bloq)); }

  var quando = dados.quando || hojeISO();
  var idA = idAtiv();
  var ativ = {
    negocioId: negocioId,
    contatoId: n.contatoId || "",
    tipo: tipo,
    texto: String(dados.texto || "").slice(0,1200),
    quando: quando,
    ts: Date.now(),                                  // so desempata dentro do dia
    por: (SESSAO && SESSAO.nome) || ""
  };
  if(dados.de)   ativ.de = dados.de;
  if(dados.para) ativ.para = dados.para;

  // Entra na linha do tempo agora, esmaecido e com reloginho. So fica
  // opaco quando a Promise resolver.
  var naTela = ngCopia(ativ);
  naTela.id = idA;
  naTela.pendente = true;
  empurrarTimeline(negocioId, naTela);

  // Segura o carimbo da timeline local a frente do carimbo do negocio ate
  // o gravar terminar. O proprio gravar chama redesenhar() por dentro, e
  // sem essa folga o carregarTimeline veria o negocio mais novo que a
  // timeline e gastaria 1 leitura pra buscar de volta o item que acabamos
  // de escrever aqui. Registrar tem que custar zero leitura.
  TIMELINE[negocioId].at = Date.now() + 3600000;

  var up = {};
  if(!dados.semToque){
    up.ultimoToqueEm  = quando;
    up.ultimoToqueTxt = String(ativ.texto || tipoAtivDe(tipo).rot).slice(0,140);
  }
  var p = dados.prox;
  if(p && p.ligado !== false && p.proxData){
    up.proxTipo  = p.proxTipo || "";
    up.proxData  = p.proxData;
    up.proxTexto = String(p.proxTexto || "").slice(0,140);
    up.proxHora  = p.proxHora || "";
  }
  if(dados.adiar) up.vezesAdiado = (n.vezesAdiado || 0) + 1;
  if(dados.negocioExtra){
    for(var j in dados.negocioExtra)
      if(Object.prototype.hasOwnProperty.call(dados.negocioExtra,j)) up[j] = dados.negocioExtra[j];
  }

  // O gestor registra Nota e so Nota, e nao escreve no negocio. Tentar
  // gravar assim mesmo devolveria um toast de bloqueio por cima de um
  // registro que deu certo, o que faz parecer que nada foi salvo.
  var podeNegocio = !motivoBloqueio("crm_negocios");
  var alinhar = function(){
    var nn = achar("negocios", negocioId);
    if(TIMELINE[negocioId]) TIMELINE[negocioId].at = (nn && nn.at) || Date.now();
  };

  return Promise.all([
    gravar("crm_atividades", idA, ativ),
    podeNegocio ? gravar("crm_negocios", negocioId, up) : Promise.resolve()
  ]).then(function(){
    naTela.pendente = false;
    alinhar();
    return naTela;
  }).catch(function(e){
    // Falhou o envio, mas nao se perdeu nada: o gravar ja jogou na fila do
    // aparelho. O item fica na timeline com o selo de nao enviado.
    alinhar();
    throw e;
  });
}

/* Nota de sistema (ganho, perdido, congelado, adiado). Nao e toque no
   cliente, entao nao mexe em ultimoToqueEm. Erro aqui nunca derruba a
   operacao principal: o gravar ja guardou na fila e ja avisou na faixa. */
function ngNota(negocioId, texto){
  var idA = idAtiv();
  var a = {
    negocioId: negocioId, contatoId:"", tipo:"nota",
    texto: String(texto || "").slice(0,1200),
    quando: hojeISO(), ts: Date.now(), por:(SESSAO && SESSAO.nome) || ""
  };
  var naTela = ngCopia(a);
  naTela.id = idA; naTela.pendente = true;
  empurrarTimeline(negocioId, naTela);
  TIMELINE[negocioId].at = Date.now() + 3600000;
  var alinhar = function(){
    var nn = achar("negocios", negocioId);
    if(TIMELINE[negocioId]) TIMELINE[negocioId].at = (nn && nn.at) || Date.now();
  };
  return gravar("crm_atividades", idA, a)
    .then(function(){ naTela.pendente = false; alinhar(); })
    .catch(function(){ alinhar(); });
}

/* Tarefa: o que nao e negocio e, sem casa, nunca aparece. */
function ngCriarTarefa(t){
  var id = idNovo("t");
  var doc = {
    tipo: t.tipo, texto: String(t.texto||"").slice(0,160), data: t.data,
    contatoId: t.contatoId || "", contatoNome: t.contatoNome || "", contatoTel: t.contatoTel || "",
    negocioId: t.negocioId || "", negocioTitulo: String(t.negocioTitulo||"").slice(0,120),
    feita: false, criadoEm: hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || "", arquivado: false
  };
  return gravar("crm_tarefas", id, doc).catch(function(){});
}

/* ---------------------------------------------------------------------
   A BARRA DE REGISTRAR
   Alvo: 2 cliques ate salvo, 1 quando o tipo repete. O tipo ja vem
   marcado com o ultimo usado, o texto e opcional e o proximo passo vem
   ligado com tipo e data sugeridos pelo estagio.
   --------------------------------------------------------------------- */
function ngFormRegistro(n, pref, naFolha){
  var ultimo = recuperar("ultimoTipoAtiv", "ligacao"), achou = false, z;
  for(z=0;z<TIPOS_ATIV.length;z++) if(TIPOS_ATIV[z].k === ultimo) achou = true;
  if(!achou) ultimo = "ligacao";
  // Quem so pode nota comeca em nota, senao o primeiro clique e sempre
  // pra corrigir uma escolha que o sistema fez errado.
  if(motivoBloqueio("crm_atividades", { tipo:ultimo })) ultimo = "nota";

  var chips = "", i, t, bl;
  for(i=0;i<TIPOS_ATIV.length;i++){
    t = TIPOS_ATIV[i];
    bl = motivoBloqueio("crm_atividades", { tipo:t.k });
    chips += '<button type="button" class="pill' + (t.k === ultimo ? ' on' : '') + '"' +
      ' data-a="ngTipoAtiv" data-pref="' + pref + '" data-k="' + esc(t.k) + '"' +
      (bl ? ' disabled' : '') + '>' + t.ic + ' ' + esc(t.rot) + '</button>';
  }
  var blAtiv = motivoBloqueio("crm_atividades", { tipo:"ligacao" });
  var rasc = recuperar("rascunho_" + n.id, "");

  /* O bloco vem com a sugestao DO ESTAGIO, nao com o passo que ja esta
     gravado (secao 6.4). blocoProxPasso da preferencia ao que esta no
     negocio, e com o negocio cru a barra reapresentaria exatamente o passo
     que a pessoa acabou de cumprir, com a data vencida, e o registro
     deixaria o negocio atrasado do mesmo jeito. Quem nao quer reancorar
     desliga o toggle, e ai nada de proximo passo e gravado. */
  var semProx = semProxPasso(n);

  return '' +
  '<div class="card' + (naFolha ? '' : ' card-lime') + '"' + (naFolha ? ' style="padding:0;border:0;background:none"' : '') + '>' +
    (naFolha ? '' : '<div class="card-head"><div class="sec-title">Registrar</div>' +
      '<span class="tiny muted">Ctrl + Enter salva</span></div>') +
    '<form class="form" data-a="ngSalvarRegistro" data-id="' + esc(n.id) + '" data-pref="' + pref + '"' +
      (naFolha ? ' data-folha="1"' : '') + '>' +
      '<input type="hidden" id="' + pref + 'tp" value="' + esc(ultimo) + '">' +
      '<div class="pills">' + chips + '</div>' +
      (blAtiv ? '<div class="tiny" style="color:var(--text3)">' + esc(blAtiv) + '</div>' : '') +
      '<textarea class="inp" id="' + pref + 'obs" data-rascunho="' + esc(n.id) + '" maxlength="1200"' +
        ' placeholder="o que aconteceu (opcional)">' + esc(rasc) + '</textarea>' +
      '<div class="fld" style="max-width:220px"><label>Aconteceu em</label>' +
        // Nunca no futuro: o que vai acontecer nao e atividade, e o proximo passo.
        '<input class="inp" type="date" id="' + pref + 'quando" value="' + hojeISO() + '" max="' + hojeISO() + '"></div>' +
      blocoProxPasso(pref, semProx, true) +
      '<button class="btn btn-primary btn-lg btn-block" type="submit">Salvar</button>' +
    '</form>' +
  '</div>';
}

ACOES.ngSalvarRegistro = function(f){
  var id   = f.getAttribute('data-id');
  var pref = f.getAttribute('data-pref');
  var naFolha = !!f.getAttribute('data-folha');
  var n = achar("negocios", id);
  if(!n) return;

  var tipo   = (document.getElementById(pref + "tp") || {}).value || "nota";
  var ta     = document.getElementById(pref + "obs");
  var texto  = ta ? ta.value : "";
  var quando = (document.getElementById(pref + "quando") || {}).value || hojeISO();

  var prox = lerProxPasso(pref);
  if(!prox.ok){ toast(prox.erro, "bad"); return; }

  // Limpa o rascunho antes de gravar: o gravar redesenha a tela por
  // dentro e o campo some, e um rascunho orfao reapareceria no proximo
  // registro como se fosse texto novo.
  if(ta) ta.value = "";
  esquecer("rascunho_" + id);
  if(naFolha) fecharFolha();

  var estagioProposta = n.tipo === "agencia" ? "ag_proposta" : "pt_proposta";

  registrarAtividade(id, { tipo:tipo, texto:texto, quando:quando, prox:prox })
    .then(function(){
      toast("Registrado", "ok");
      // Sugere, nunca move sozinho: mover estagio tem pedagio (proximo
      // passo novo) e quem paga o pedagio e a pessoa, nao o sistema.
      if(tipo === "proposta" && idxEstagio(n) < idxEstagio({ tipo:n.tipo, estagio:estagioProposta }))
        ngToastMover(id, ngRotEstagio(estagioProposta));
      redesenhar();
    })
    .catch(function(){ /* ja avisado pela faixa, e o registro esta na fila */ });
};

/* Toast com acao. O toast comum nao tem botao, e esta sugestao so vale
   enquanto ela esta na tela. */
function ngToastMover(id, rotulo){
  var w = document.getElementById('toasts');
  if(!w){ w = document.createElement('div'); w.id = 'toasts'; w.className = 'toast-wrap'; document.body.appendChild(w); }
  var t = document.createElement('div');
  t.className = "toast ok";
  t.style.pointerEvents = "auto";
  t.innerHTML = 'Proposta enviada. ' +
    '<button class="btn btn-sm" style="margin-left:10px" data-a="ngMover" data-id="' + esc(id) + '">Mover pra ' + esc(rotulo) + '?</button>';
  w.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 8000);
}
ACOES.ngMover = function(el){
  var t = el.closest('.toast'); if(t && t.parentNode) t.parentNode.removeChild(t);
  abrirFolhaEstagio(el.getAttribute('data-id'));
};

/* ---------------------------------------------------------------------
   LINHA DO TEMPO
   Unica leitura por clique do sistema, e so quando o negocio e aberto ou
   mudou desde a ultima vez.
   --------------------------------------------------------------------- */
function ngPintarTimeline(negocioId, tudo){
  var box = document.getElementById('ngTl');
  if(!box) return;
  box.innerHTML = '<div class="tiny muted">carregando a linha do tempo...</div>';
  carregarTimeline(negocioId, tudo).then(function(itens){
    var b = document.getElementById('ngTl');
    // A tela pode ter trocado enquanto a leitura voltava.
    if(!b || b.getAttribute('data-n') !== negocioId) return;
    b.innerHTML = ngHtmlTimeline(itens, negocioId);
  });
}
function ngHtmlTimeline(itens, negocioId){
  itens = itens || [];
  if(!itens.length){
    return '<div class="empty" style="padding:24px 12px"><div class="ei">📝</div>' +
      '<div class="et">Nada registrado ainda</div>' +
      '<div class="ex">Toda ligacao, reuniao e mensagem que voce registrar aqui vira o historico que explica, daqui a dois meses, por que esse negocio ganhou ou morreu.</div></div>';
  }
  var h = '<div class="tl">', i, it, pend, dia, ic, titulo;
  for(i=0;i<itens.length;i++){
    it = itens[i];
    pend = it.pendente || PENDENTES[it.id];
    ic = it.tipo === "estagio" ? IC_ESTAGIO : tipoAtivDe(it.tipo).ic;
    titulo = it.tipo === "estagio"
      ? ("Mudou de " + ngRotEstagio(it.de) + " pra " + ngRotEstagio(it.para))
      : tipoAtivDe(it.tipo).rot;
    dia = ngDiaDoTs(it.ts);
    h += '<div class="tl-it"' + (pend ? ' style="opacity:.6"' : '') + '>' +
      '<div class="tl-ic">' + (pend ? "⏱" : ic) + '</div>' +
      '<div class="tl-bd">' +
        '<div class="tl-top">' +
          '<span class="tl-t">' + esc(titulo) + '</span>' +
          (it.por ? '<span class="tiny muted">' + esc(it.por) + '</span>' : '') +
          '<span class="tl-d">' + esc(dataCurta(it.quando)) + ', ' + esc(quando(it.quando)) + '</span>' +
        '</div>' +
        (it.texto ? '<div class="tl-x">' + esc(it.texto) + '</div>' : '') +
        // O dia em que aconteceu e o dia em que foi anotado sao coisas
        // diferentes, e a diferenca importa quando se le a historia depois.
        (dia && it.quando && dia !== it.quando
          ? '<div class="tiny muted">registrado em ' + esc(dataBR(dia)) + ', aconteceu em ' + esc(dataBR(it.quando)) + '</div>'
          : '') +
        (pend ? '<div class="tiny" style="color:var(--warn)">esperando internet, ja esta guardado no aparelho</div>' : '') +
      '</div>' +
    '</div>';
  }
  h += '</div>';
  var tl = TIMELINE[negocioId];
  if(tl && tl.completa === false){
    h += '<button class="btn btn-block btn-ghost" style="margin-top:10px" data-a="ngVerMais" data-id="' +
         esc(negocioId) + '">Ver mais (custa 1 leitura do banco)</button>';
  }
  return h;
}

   TELA: NEGOCIOS (a lista)
   ===================================================================== */
function ngOrdenar(arr, ordem){
  if(ordem === "previsao"){
    arr.sort(function(a,b){
      var da = a.prevFechamento || "9999-12-31", db = b.prevFechamento || "9999-12-31";
      if(da !== db) return da < db ? -1 : 1;
      return valorOrdem(b) - valorOrdem(a);
    });
  } else if(ordem === "parado"){
    arr.sort(function(a,b){
      return diasVencido(b.ultimoToqueEm || b.criadoEm) - diasVencido(a.ultimoToqueEm || a.criadoEm);
    });
  } else {
    // Invariante 11: quem ainda nao tem valor ordena por valorOrdem, nunca
    // por valorRefDe. Com zero, a indicacao cadastrada em 20 segundos fica
    // sempre no fim da lista e nunca aparece, e e o lead mais quente da casa.
    arr.sort(function(a,b){ return valorOrdem(b) - valorOrdem(a); });
  }
}

    '</div>';

  if(ag.length || pt.length){
    h += '<div class="kpis">' +

        '<div class="kpi-v lime">' + esc(brlCurto(somaAg)) + '</div>' +
        '<div class="kpi-s">' + ag.length + (ag.length===1?' negocio':' negocios') + ', ' +
          esc(brl(somaMrr)) + '/mes de MRR</div></div>' : '') +

        '<div class="kpi-s">' + pt.length + (pt.length===1?' negocio':' negocios') + ' em cota</div></div>' : '') +

        '<div class="ex">Comece pelos que estao abertos agora. Cliente antigo e negocio perdido entram quando forem tocados, nao antes.</div>' +
        '<button class="btn btn-primary" data-a="ngNovo">Cadastrar o primeiro</button></div>';
    } else {

  if(enc && f.status !== "todos"){

/* Faixa, valor heroi, stepper e acoes. Tudo o que decide o que fazer com
   esse negocio cabe aqui, sem rolar a tela. */
function ngBlocoTopo(n){
  var e = estagioDe(n), f = FUNIL[n.tipo] || [], i = idxEstagio(n);
  var bloq = motivoBloqueio("crm_negocios");
  var congelado = n.congeladoAte && n.congeladoAte > hojeISO();

  var tags = '<span class="tag tag-lime">' + esc(ngRotTipo(n.tipo)) + '</span>';
  if(n.tipo === "patrocinio" && n.pt && n.pt.edicao){
    var ed = edicaoDe(n.pt.edicao);
    if(ed) tags += ' <span class="tag tag-purple">' + esc(ed.rot) + '</span>';
  }
  if(n.status === "ganho")      tags += ' <span class="tag tag-green">Ganho em ' + esc(dataBR(n.fechadoEm)) + '</span>';
  if(n.status === "perdido")    tags += ' <span class="tag tag-red">Perdido, ' + esc((motivoPerdaDe(n.motivoPerda)||{rot:""}).rot) + '</span>';
  if(n.status === "encerrado")  tags += ' <span class="tag">Encerrado em ' + esc(dataBR(n.encerradoEm)) + '</span>';
  if(congelado)                 tags += ' <span class="tag tag-blue">Congelado ate ' + esc(dataBR(n.congeladoAte)) + '</span>';
  if(PENDENTES[n.id])           tags += ' <span class="tag tag-warn">Nao enviado ainda</span>';

  /* Valor heroi. Agencia mostra R$/mes porque e assim que se negocia fee,
     e o contrato inteiro vai embaixo em cinza. */
  var heroi = ngValorTxt(n), sub;
  if(n.tipo === "agencia"){
    var meses = (n.ag && n.ag.meses) || 0;
    sub = brl(valorRefDe(n)) + (meses ? " em " + meses + " meses" : " em 12 meses (contrato indeterminado, contado como 12)");
  } else {
    sub = ((n.pt && n.pt.cota) ? "Cota " + n.pt.cota : "Cota nao definida");
    if(n.pt && n.pt.permuta > 0) sub += " · mais " + brl(n.pt.permuta) + " em permuta, que nunca soma com o dinheiro";
  }
  var ponderado = Math.round(valorRefDe(n) * e.p);

  /* "pediu 220.000, esta em 180.000". E o numero que o dono quer ver
     antes de aprovar mais um desconto. */
  var desconto = "";
  if(n.tipo === "patrocinio" && n.pt && n.pt.valorInicial > 0 && n.pt.valorInicial !== n.pt.valor){
    desconto = ngLinhaDesconto(n.pt.valorInicial, n.pt.valor || 0, "");
  } else if(n.tipo === "agencia" && n.ag && n.ag.mrrInicial > 0 && n.ag.mrrInicial !== n.ag.mrr){
    desconto = ngLinhaDesconto(n.ag.mrrInicial, n.ag.mrr || 0, "/mes");
  }

  /* Stepper. Clicar em qualquer ponto abre a folha de estagio, que e o
     caminho unico de mover: escolher numa lista funciona com uma mao so,
     arrastar nao. */
  var dots = "";
  for(var k=0;k<f.length;k++){
    if(k) dots += '<span class="step-l' + (k <= i ? ' feito' : '') + '"></span>';
    dots += '<span class="step-p' + (k < i ? ' feito' : (k === i ? ' atual' : '')) + '"></span>';
  }
  var diasEstagio = diasVencido(n.estagioDesde);

  var acoes = "";
  if(n.status === "aberto"){
    acoes =
      '<button class="btn btn-primary" data-a="ngFocarRegistro" data-id="' + esc(n.id) + '">Registrar</button>' +
      '<button class="btn" data-a="ngGanho" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>✓ Ganho</button>' +
      '<button class="btn btn-danger" data-a="ngPerdido" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>✕ Perdido</button>' +
      (congelado
        ? '<button class="btn" data-a="ngDescongelar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Descongelar</button>'
        : '<button class="btn" data-a="ngCongelar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>❄ Congelar</button>');
  } else if(n.status === "ganho" && n.tipo === "agencia"){
    acoes =
      '<button class="btn btn-primary" data-a="ngRenovar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Renovar contrato</button>' +
      '<button class="btn" data-a="ngEncerrar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Encerrar contrato</button>';
  } else {
    acoes = '<button class="btn" data-a="ngFocarRegistro" data-id="' + esc(n.id) + '">Registrar</button>';
  }

  return '<div class="card">' +
    '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="negocios">‹ Negocios</button>' +
    '<div class="h1" style="margin-top:10px;text-transform:uppercase">' + esc(n.empresa) + '</div>' +
    '<div class="muted2" style="margin-bottom:8px">' + esc(n.titulo) + '</div>' +
    '<div class="pills" style="margin-bottom:14px">' + tags + '</div>' +

    '<div class="num" style="font-size:38px;color:var(--lime)">' + esc(heroi) + '</div>' +
    '<div class="tiny muted" style="margin-top:5px">' + esc(sub) + '</div>' +
    '<div class="small muted2" style="margin-top:4px">' + pct(e.p*100) + ' de chance no estagio, ' +
      esc(brl(ponderado)) + ' ponderado</div>' +
    desconto +

    '<div style="margin-top:2px">' +
      // width:100% em linha porque botao tem largura de conteudo mesmo com
      // display:flex, e sem isso o stepper encolhe pro tamanho das bolinhas.
      '<button class="step" data-a="ngEstagio" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') +
        ' style="width:100%;text-align:left" aria-label="Trocar de estagio">' + dots + '</button>' +
      '<div class="step-rot">' +
        '<b>' + esc(e.rot) + '</b>, ha ' + diasEstagio + (diasEstagio===1?' dia':' dias') +
        '<span class="muted"> (o teto deste estagio e ' + e.teto + ' dias)</span></div>' +
      (n.status === "aberto"
        ? '<div class="tiny muted">Saida: ' + esc(e.saida || "") + '</div>'
        : '<div class="tiny muted">Estava aqui quando fechou. E a unica informacao que explica onde o funil vaza.</div>') +
    '</div>' +

    '<div class="pills" style="margin-top:16px">' + acoes + '</div>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

function ngLinhaDesconto(de, para, un){
  var queda = de > 0 ? Math.round((de - para) / de * 100) : 0;
  var cor = para < de ? "var(--warn)" : "var(--green)";
  return '<div class="small" style="margin-top:7px;color:' + cor + '">' +
    'pediu ' + esc(brl(de) + un) + ', esta em ' + esc(brl(para) + un) +
    ' (' + (queda > 0 ? "desconto de " + pct(queda) : "aumento de " + pct(-queda)) + ')</div>';
}

/* O proximo passo em destaque. Negocio aberto sem proximo passo e o
   estado mais perigoso do CRM, entao ele aparece em amarelo e com botao,
   nunca como um campo vazio discreto. */
function ngBlocoProx(n){
  var bloq = motivoBloqueio("crm_negocios");
  if(n.status !== "aberto") return "";

  if(!n.proxData){
    return '<div class="card" style="border-color:rgba(255,184,0,.35)">' +
      '<div class="sec-title" style="border-left-color:var(--warn)">Sem proximo passo</div>' +
      '<div class="small muted2" style="margin:10px 0">Negocio aberto sem data marcada nao aparece em fila nenhuma, e some do dia a dia sem ninguem decidir que ele morreu.</div>' +
      '<button class="btn btn-primary btn-block" data-a="ngTrocarProx" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Marcar o proximo passo</button>' +
      (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
    '</div>';
  }

  var p = proxTipoDe(n.proxTipo) || { rot:"Proximo passo", ic:"•" };
  var venc = diasVencido(n.proxData);
  var cor = venc >= 1 ? "var(--red)" : (venc >= -1 ? "var(--warn)" : "var(--lime)");
  var quandoTxt = venc >= 1 ? ("venceu ha " + venc + (venc===1?" dia":" dias"))
                : venc === 0 ? "e hoje" : quando(n.proxData);

  return '<div class="card card-lime">' +
    '<div class="card-head" style="margin-bottom:10px">' +
      '<div class="sec-title">Proximo passo</div>' +
      '<span class="tag" style="color:' + cor + ';border-color:' + cor + '">' + esc(quandoTxt) + '</span>' +
    '</div>' +
    '<div class="h2" style="text-transform:none">' + p.ic + ' ' + esc(p.rot) + '</div>' +
    '<div class="small muted2" style="margin-top:4px">' + esc(dataExtenso(n.proxData)) +
      (n.proxHora ? ', as ' + esc(n.proxHora) : '') + '</div>' +
    (n.proxTexto ? '<div class="small" style="margin-top:7px">' + esc(n.proxTexto) + '</div>' : '') +
    ((n.vezesAdiado||0) >= 1
      ? '<div class="tiny" style="margin-top:7px;color:' + ((n.vezesAdiado||0) >= ADIAMENTOS_PARA_RISCO ? 'var(--red)' : 'var(--text3)') +
        '">ja foi adiado ' + n.vezesAdiado + (n.vezesAdiado===1?' vez':' vezes') +
        ((n.vezesAdiado||0) >= ADIAMENTOS_PARA_RISCO ? ', e por isso ele entra como risco alto na previsao' : '') + '</div>'
      : '') +
    '<div class="pills" style="margin-top:13px">' +
      '<button class="btn btn-sm" data-a="ngAdiar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Adiar</button>' +
      '<button class="btn btn-sm btn-ghost" data-a="ngTrocarProx" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Trocar</button>' +
    '</div>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Quem decide. O botao de WhatsApp e o de ligar ficam aqui porque e daqui
   que o vendedor sai pra falar com a pessoa. */
function ngBlocoContato(n){
  var c = n.contatoId ? contatoPorId(n.contatoId) : null;
  var nome = (c && c.nome) || n.contatoNome || "";
  var tel  = (c && c.tel)  || n.contatoTel  || "";
  var h = '<div class="card"><div class="sec-title">Quem decide</div>';

  if(!nome){
    h += '<div class="small muted2" style="margin-top:10px">Nenhuma pessoa vinculada. Negocio sem nome de gente e negocio que ninguem consegue cobrar.</div>';
  } else {
    h += '<div class="h2" style="text-transform:none;margin-top:10px">' + esc(nome) + '</div>' +
      (c && c.cargo ? '<div class="small muted">' + esc(c.cargo) + '</div>' : '') +
      (c && c.empresa ? '<div class="tiny muted">' + esc(c.empresa) + '</div>' : '') +
      (tel ? '<div class="small muted2" style="margin-top:6px">' + esc(foneBR(tel)) + '</div>' : '') +
      (c && c.email ? '<div class="tiny muted truncate">' + esc(c.email) + '</div>' : '') +
      '<div class="pills" style="margin-top:11px">' +
        (tel ? '<button class="btn btn-sm" data-a="ngZap" data-id="' + esc(n.id) + '">💬 WhatsApp</button>' +
               '<a class="btn btn-sm" href="tel:+' + esc(soDigito(tel).slice(0,2) === "55" ? soDigito(tel) : "55" + soDigito(tel)) + '">☎ Ligar</a>' : '') +
        (c && c.email ? '<a class="btn btn-sm" href="mailto:' + esc(c.email) + '">✉ E-mail</a>' : '') +
        (n.contatoId ? '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="pessoa/' + esc(n.contatoId) + '">Ver ficha</button>' : '') +
      '</div>';
  }
  if(n.tipo === "agencia" && n.ag && n.ag.quemDecide)
    h += '<div class="tiny muted" style="margin-top:10px">Quem bate o martelo: ' + esc(n.ag.quemDecide) + '</div>';
  if(n.tipo === "patrocinio" && n.pt && n.pt.quemAprova)
    h += '<div class="tiny muted" style="margin-top:10px">Quem aprova a verba: ' + esc(n.pt.quemAprova) + '</div>';
  return h + '</div>';
}

/* Indicacao. O telefone de quem indicou fica do lado de proposito: e a
   quem se pede um empurrao quando o negocio trava, e procurar esse numero
   em outra tela e o motivo de nunca se pedir. */
function ngBlocoIndicacao(n){
  if(n.origem !== "indicacao") {
    return '<div class="card"><div class="sec-title">Origem</div>' +
      '<div class="h2" style="text-transform:none;margin-top:10px">' + esc(rotOrigem(n.origem)) + '</div></div>';
  }
  var ind = n.indicadorId ? contatoPorId(n.indicadorId) : null;
  var nome = (ind && ind.nome) || n.indicadorNome || "";
  var linha = "", tel = (ind && ind.tel) || "";

  if(n.indicadorId){
    var r = rankIndicadores(), eu = null;
    for(var i=0;i<r.length;i++) if(r[i].id === n.indicadorId) eu = r[i];
    if(eu){
      linha = eu.n + (eu.n===1?" indicacao":" indicacoes") + ", " + eu.ganhos +
        (eu.ganhos===1?" ganho":" ganhos") + ", " + brlCurto(eu.gerado) + " gerados";
      if(!tel) tel = eu.tel || "";
    }
  }

  return '<div class="card"><div class="sec-title">Indicacao</div>' +
    '<div class="h2" style="text-transform:none;margin-top:10px">via ' + esc(nome || "alguem que nao foi informado") + '</div>' +
    (linha ? '<div class="small muted2">' + esc(linha) + '</div>' : '') +
    (tel ? '<div class="small muted" style="margin-top:5px">' + esc(foneBR(tel)) + '</div>' : '') +
    '<div class="pills" style="margin-top:11px">' +
      (tel ? '<button class="btn btn-sm" data-a="ngZapIndicador" data-id="' + esc(n.id) + '">💬 Pedir um empurrao</button>' : '') +
      (n.indicadorId ? '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="pessoa/' + esc(n.indicadorId) + '">Ver ficha</button>' : '') +
    '</div>' +
    (!n.indicadorId ? '<div class="tiny muted" style="margin-top:9px">Sem indicador informado, esse negocio fica de fora do ranking de indicacao.</div>' : '') +
  '</div>';
}

/* Saude: os quatro numeros que dizem se esse negocio esta vivo. Cada um
   com o limite escrito do lado, porque alerta sem numero e ignorado. */
function ngBlocoSaude(n){
  var e = estagioDe(n), f = FUNIL[n.tipo] || [], i = idxEstagio(n);
  var limToque = (i === f.length-1) ? TOQUE[n.tipo].ultimo : TOQUE[n.tipo].normal;
  var parado = diasVencido(n.estagioDesde);
  var silen  = n.ultimoToqueEm ? diasVencido(n.ultimoToqueEm) : diasVencido(n.criadoEm);
  var noFunil = diasVencido(n.criadoEm);
  var t = temperatura(n);
  var bloq = motivoBloqueio("crm_negocios");

  var lin = function(r, v, ex, cor){
    return '<div class="ng-lin"><span class="muted">' + esc(r) + '</span>' +
      '<span style="text-align:right"><b' + (cor ? ' style="color:' + cor + '"' : '') + '>' + esc(v) + '</b>' +
      (ex ? '<div class="tiny muted">' + esc(ex) + '</div>' : '') + '</span></div>';
  };

  return '<div class="card">' +
    '<div class="card-head" style="margin-bottom:8px"><div class="sec-title">Saude</div>' +
      '<span class="dot" style="background:' + ngCorTemp(t) + '"></span></div>' +
    (n.status === "aberto" ? '<div class="small muted2" style="margin-bottom:8px">' + esc(porQue(n)) + '</div>' : '') +
    lin("No estagio", parado + (parado===1?" dia":" dias"), "o teto de " + e.rot + " e " + e.teto + " dias",
        parado > e.teto ? "var(--warn)" : "") +
    lin("Sem contato", silen + (silen===1?" dia":" dias"), "o limite aqui e " + limToque + " dias",
        silen > limToque ? "var(--warn)" : "") +
    lin("Previsao", n.prevFechamento ? dataBR(n.prevFechamento) : "sem data",
        (n.prevEstimada ? "data estimada, nao entra em alta chance" : "confirmada") +
        ((n.vezesRemarcouPrev||0) ? ", remarcada " + n.vezesRemarcouPrev + " vezes" : "")) +
    lin("No funil", noFunil + (noFunil===1?" dia":" dias"),
        "o ciclo mediano em " + ngRotTipo(n.tipo).toLowerCase() + " e " + CICLO_MEDIANO[n.tipo] + " dias") +
    (n.status === "aberto" && silen >= ABANDONO[n.tipo]
      ? '<div class="tiny" style="color:var(--red);margin-top:9px">' + silen + ' dias sem nenhum toque. Acima de ' +
        ABANDONO[n.tipo] + ' dias o honesto e fechar como "sumiu, nao respondeu" e deixar a tarefa de retomar cuidar do resto.</div>'
      : '') +
    '<div class="pills" style="margin-top:11px">' +
      '<button class="btn btn-sm btn-ghost" data-a="ngRemarcarPrev" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Remarcar previsao</button>' +
    '</div>' +
    // Botao desabilitado sem o motivo escrito embaixo e botao que parece
    // quebrado (invariante 12).
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Outros negocios da mesma empresa. Renovacao, segunda cota e upsell
   moram aqui, e sem esse bloco o vendedor abre a empresa errada. */
function ngBlocoOutros(n){
  var arr = lista("negocios").filter(function(x){
    return x.id !== n.id && x.empresaChave && x.empresaChave === n.empresaChave;
  });
  if(!arr.length) return "";
  ngOrdenar(arr, "valor");
  var h = '<div class="card"><div class="sec-title">Outros negocios da ' + esc(n.empresa) + '</div><div style="margin-top:8px">';
  for(var i=0;i<arr.length;i++){
    var x = arr[i];
    var tg = x.status === "ganho" ? '<span class="tag tag-green">Ganho</span>'
           : x.status === "perdido" ? '<span class="tag tag-red">Perdido</span>'
           : x.status === "encerrado" ? '<span class="tag">Encerrado</span>'
           : '<span class="tag tag-lime">' + esc(estagioDe(x).rot) + '</span>';
    h += '<button class="ng-lin" style="width:100%;text-align:left" data-a="ngAbrir" data-id="' + esc(x.id) + '">' +
      '<span><div class="small">' + esc(x.titulo) + '</div>' +
        '<div class="tiny muted">' + esc(ngValorTxt(x)) + '</div></span>' + tg + '</button>';
  }
  return h + '</div></div>';
}

function ngBlocoProposta(n){
  var url = ngLinkSeguro(n.linkProposta);
  var bloq = motivoBloqueio("crm_negocios");
  return '<div class="card"><div class="sec-title">Proposta</div>' +
    (url
      ? '<a class="btn btn-block" style="margin-top:10px" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Abrir a proposta</a>' +
        '<div class="tiny muted truncate" style="margin-top:6px">' + esc(url) + '</div>'
      : '<div class="small muted2" style="margin:10px 0">Sem link. Cole aqui o link do arquivo pra nao ter que procurar no Drive na frente do cliente.</div>') +
    '<button class="btn btn-sm btn-ghost btn-block" style="margin-top:8px" data-a="ngLinkProp" data-id="' + esc(n.id) + '"' +
      (bloq?' disabled':'') + '>' + (url ? "Trocar o link" : "Colar o link") + '</button>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Valores, com a OBSERVACAO FIXA no topo. A obs e a memoria que o
   vendedor usa de verdade ("nao ligar antes das 10h") e que numa
   atividade afundaria na timeline em duas semanas. */
function ngBlocoValores(n){
  var bloq = motivoBloqueio("crm_negocios");
  var lin = function(r, v, ex){
    return '<div class="ng-lin"><span class="muted">' + esc(r) + '</span>' +
      '<span style="text-align:right"><b>' + esc(v) + '</b>' +
      (ex ? '<div class="tiny muted">' + esc(ex) + '</div>' : '') + '</span></div>';
  };

  var h = '<div class="card">' +
    '<div class="card-head" style="margin-bottom:10px"><div class="sec-title">Valores</div>' +
      '<button class="btn btn-sm btn-ghost" data-a="ngEditarValores" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Editar</button>' +
    '</div>' +
    // Vale pro Editar e pro Anotar deste cartao: desabilitado sim, mudo
    // nunca (invariante 12).
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-bottom:10px">' + esc(bloq) + '</div>' : '');

  h += '<div style="background:var(--card2);border-radius:var(--rad-sm);padding:11px;margin-bottom:12px">' +
      '<div class="tiny muted" style="margin-bottom:4px">Observacao fixa</div>' +
      (n.obs ? '<div class="small" style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(n.obs) + '</div>'
             : '<div class="small muted">Nada anotado. Aqui mora o que nao pode ser esquecido nunca, nao o que aconteceu ontem.</div>') +
      '<button class="btn btn-sm btn-ghost" style="margin-top:8px" data-a="ngObs" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>' +
        (n.obs ? "Editar a observacao" : "Anotar") + '</button>' +
    '</div>';

  if(n.tipo === "agencia"){
    var a = n.ag || {};
    h += lin("Fee mensal", brl(a.mrr||0) + "/mes", a.mrrInicial && a.mrrInicial !== a.mrr ? "pedido inicial de " + brl(a.mrrInicial) + "/mes" : "");
    if(a.verbaMidia > 0){
      // Verba de midia NAO e receita da Lime. So entra no MRR a fatia do
      // percentual, e por isso ela vive em linha propria e rotulada.
      h += lin("Verba de midia", brl(a.verbaMidia) + "/mes", "verba do cliente, nao e receita da Lime");
      h += lin("Nossa fatia da verba", pct(a.pctVerba||0), brl(Math.round((a.verbaMidia||0)*((a.pctVerba||0)/100))) + "/mes");
    }
    h += lin("MRR que a Lime fatura", brl(mrrDe(n)) + "/mes", "fee mais a fatia da verba");
    h += lin("Duracao", (a.meses ? a.meses + " meses" : "indeterminado, contado como 12 meses"),
             brl(valorRefDe(n)) + " no contrato inteiro");
    if(a.inicioContrato) h += lin("Comeca em", dataBR(a.inicioContrato), "");
    if(a.fimContrato)    h += lin("Termina em", dataBR(a.fimContrato), diasVencido(a.fimContrato) < 0 ? "faltam " + Math.abs(diasVencido(a.fimContrato)) + " dias" : "");
    if(a.servicos && a.servicos.length) h += lin("Servicos", a.servicos.join(", "), "");
    if(a.faixaVerba) h += lin("Faixa de verba", a.faixaVerba, "declarada pelo cliente");
    if(a.renovacaoDeId) h += '<div class="tiny muted" style="margin-top:8px">Este contrato e a renovacao de outro. ' +
      '<button class="btn btn-sm btn-ghost" data-a="ngAbrir" data-id="' + esc(a.renovacaoDeId) + '">Ver o anterior</button></div>';
  } else {
    var p = n.pt || {}, ed = edicaoDe(p.edicao);
    h += lin("Edicao", ed ? ed.rot : "nao definida",
             ed ? ("evento em " + dataBR(ed.dataEvento) + ", corte comercial em " + dataBR(ed.corteComercial)) : "");
    if(ed && n.status === "aberto"){
      var dCorte = diasEntre(hojeISO(), ed.corteComercial);
      h += lin("Ate o corte comercial", (dCorte >= 0 ? dCorte + " dias" : "ja passou"),
               dCorte >= 0 ? "depois disso nao da tempo de produzir material e estande" : "quem manda nessa data e a producao");
    }
    h += lin("Cota", p.cota || "nao definida", "");
    h += lin("Valor", brl(p.valor||0), p.valorInicial && p.valorInicial !== p.valor ? "pedido inicial de " + brl(p.valorInicial) : "");
    if(p.permuta > 0) h += lin("Permuta", brl(p.permuta), "nunca somada ao dinheiro, em nenhum numero");
    if(p.mesBudget) h += lin("Mes do budget", mesBR(p.mesBudget), "e quando a marca decide");
    if(p.entregaveis){
      h += '<div style="padding:9px 0"><div class="tiny muted">Entregaveis</div>' +
        '<div class="small" style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(p.entregaveis) + '</div></div>';
    }
  }

  h += '<div class="tiny muted" style="margin-top:10px">Criado em ' + esc(dataBR(n.criadoEm)) +
       ' por ' + esc(n.criadoPor || "") + '</div>';
  return h + '</div>';
}

/* ---------------------------------------------------------------------
   FECHAR GANHO
   A folha cobra o que falta pro numero existir: em agencia o fee e a data
   de inicio, em patrocinio o valor e a edicao. Ganho sem esses campos
   entra no painel como zero e some da carteira.
   --------------------------------------------------------------------- */
function ngAntesDeFechar(n){
  // O que o Desfazer devolve. A tarefa criada junto nao volta, e isso e
  // dito no toast: tarefa aberta a mais e barulho, negocio com status

  return {

    motivoPerdaObs:n.motivoPerdaObs || "", proxTipo:n.proxTipo || "", proxData:n.proxData || "",
    proxTexto:n.proxTexto || "", proxHora:n.proxHora || ""
  };
}

ACOES.ngSalvarGanho = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var err = document.getElementById('ngErr');
  var quandoFechou = (document.getElementById('ngGdata')||{}).value || hojeISO();
  var up = { status:"ganho", fechadoEm:quandoFechou,
             proxTipo:"", proxData:"", proxTexto:"", proxHora:"", congeladoAte:"" };
  var fim = "";

  if(n.tipo === "agencia"){
    var mrr   = ngLerDinheiro((document.getElementById('ngGmrr')||{}).value);
    var ini   = (document.getElementById('ngGini')||{}).value || "";
    var meses = parseInt((document.getElementById('ngGmeses')||{}).value, 10) || 0;
    fim       = (document.getElementById('ngGfim')||{}).value || "";
    if(mrr <= 0){ err.textContent = "Preencha o fee mensal em R$. Ganho sem valor vira zero no painel do mes."; return; }
    if(!ini){ err.textContent = "Preencha a data de inicio do contrato."; return; }
    if(fim && fim <= ini){ err.textContent = "A data de termino tem que ser depois da de inicio."; return; }
    var a = ngCopia(n.ag);
    // mrrInicial e gravado uma vez e nunca sobrescrito: e ele que sustenta
    // a linha "pediu 4.500, esta em 3.500" na tela do dono.
    if(!a.mrrInicial) a.mrrInicial = (n.ag && n.ag.mrr) || mrr;
    a.mrr = mrr; a.meses = meses; a.inicioContrato = ini; a.fimContrato = fim;
    up.ag = a;
  } else {
    var valor  = ngLerDinheiro((document.getElementById('ngGvalor')||{}).value);
    var edicao = (document.getElementById('ngGedicao')||{}).value || "";
    var cota   = (document.getElementById('ngGcota')||{}).value || "";
    var perm   = ngLerDinheiro((document.getElementById('ngGpermuta')||{}).value);
    if(valor <= 0){ err.textContent = "Preencha o valor da cota em R$."; return; }
    if(!edicao){ err.textContent = "Escolha a edicao do festival."; return; }
    var p = ngCopia(n.pt);
    if(!p.valorInicial) p.valorInicial = (n.pt && n.pt.valor) || valor;
    p.valor = valor; p.edicao = edicao; p.cota = cota; p.permuta = perm;
    up.pt = p;
  }
  up.valorRef = valorRefDe({ tipo:n.tipo, ag:up.ag || n.ag, pt:up.pt || n.pt });

  var antes = ngAntesDeFechar(n);
  // A regra e a origem, nao o cadastro do indicador (secao 4.4, item 7). Com
  // indicadorId a tarefa ja nasce com o telefone; sem ele nasce so com o
  // nome, que ainda e o suficiente pra lembrar de dar o retorno. Amarrar no
  // id faria a folha prometer a tarefa e o sistema nao criar.
  var indicou = n.origem === "indicacao";
  var indId = n.indicadorId || "", indNome = n.indicadorNome, empresa = n.empresa, titulo = n.titulo;
  var tipoNeg = n.tipo;
  fecharFolha();

  gravar("crm_negocios", id, up).then(function(){
    ngNota(id, "Ganho em " + dataBR(quandoFechou) + ", " +
      (tipoNeg === "agencia" ? brl(up.ag.mrr) + "/mes por " + (up.ag.meses || 12) + " meses"
                             : brl(up.pt.valor) + " na cota " + (up.pt.cota || "sem cota definida")) + ".");
    if(indicou){
      var ind = indId ? contatoPorId(indId) : null;
      ngCriarTarefa({
        tipo:"avisar_indicador", data:somaDias(hojeISO(), 1),
        texto:"Avisar " + (indNome || "quem indicou") + " que fechamos com a " + empresa,
        contatoId:indId, contatoNome:indNome || "", contatoTel:(ind && ind.tel) || "",
        negocioId:id, negocioTitulo:titulo
      });
    }
    if(tipoNeg === "agencia" && fim){
      // 60 dias antes do fim. Se o contrato ja termina antes disso, a
      // tarefa cai pra amanha: aviso no passado e aviso que ninguem ve.
      var d = somaDias(fim, -60);
      if(d <= hojeISO()) d = somaDias(hojeISO(), 1);
      ngCriarTarefa({
        tipo:"renovacao", data:d,
        texto:"Renovacao da " + empresa + ", o contrato termina em " + dataBR(fim),
        contatoId:n.contatoId || "", contatoNome:n.contatoNome || "", contatoTel:n.contatoTel || "",
        negocioId:id, negocioTitulo:titulo
      });
    }
    comDesfazer("Ganho! " + (indicou ? "Tarefa de avisar quem indicou criada." : ""), "crm_negocios", id, antes);
    redesenhar();
  });
};

/* ---------------------------------------------------------------------
   FECHAR PERDIDO
   O motivo e obrigatorio e e picklist, sem opcao "outros": "outros" come
   60% das respostas em tres meses e mata a unica analise que diz onde a
   gente perde. Motivo com prazo de reabertura vira tarefa de retomar.
   --------------------------------------------------------------------- */
ACOES.ngPerdido = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var mot = [];
  for(var i=0;i<MOTIVOS_PERDA.length;i++){
    var m = MOTIVOS_PERDA[i];
    if(m.funil !== "ambos" && m.funil !== n.tipo) continue;
    mot.push([m.k, m.rot]);
  }
  folha("Fechar como perdido",
    '<form class="form" id="ngF" data-a="ngSalvarPerdido" data-id="' + esc(n.id) + '">' +
      '<div class="fld"><label>O que aconteceu <span class="req">*</span></label>' +
        '<select class="inp" id="ngPmot" data-ch="ngChMotivoPerda">' + ngOpcoes(mot, "", "escolha") + '</select>' +
        '<div class="hint" id="ngPhint">Sem opcao "outros" de proposito. Se nenhuma servir, a mais proxima mais a observacao embaixo resolve.</div></div>' +
      '<div class="fld" id="ngPdataBox" hidden><label>Quando vale a pena voltar</label>' +
        '<input class="inp" type="date" id="ngPreabrir" value="' + esc(somaDias(hojeISO(), 90)) + '" min="' + hojeISO() + '">' +
        '<div class="hint">Vira uma tarefa de retomar nessa data.</div></div>' +
      '<div class="fld"><label>Observacao (opcional)</label>' +
        '<textarea class="inp" id="ngPobs" maxlength="400" placeholder="adiaram pro orcamento de 2028"></textarea></div>' +
      '<div class="fld" style="max-width:220px"><label>Fechou em</label>' +
        '<input class="inp" type="date" id="ngPdata" value="' + hojeISO() + '" max="' + hojeISO() + '"></div>' +
      (n.origem === "indicacao"
        ? '<div class="small" style="color:var(--lime)">Vamos criar a tarefa de dar o retorno pra ' +
          esc(n.indicadorNome || "quem indicou") + '. Avisar quando nao deu certo e o que faz a proxima indicacao existir.</div>'
        : '') +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-danger" type="submit" form="ngF">Marcar como perdido</button>');
};

ACOES.ngChMotivoPerda = function(el){
  var m = motivoPerdaDe(el.value);
  var box = document.getElementById('ngPdataBox');
  var hint = document.getElementById('ngPhint');
  var dt = document.getElementById('ngPreabrir');
  if(!m || !box) return;
  // reabrir "informar" pergunta a data, numero agenda sozinho, zero nao
  // cria tarefa nenhuma.
  box.hidden = m.reabrir !== "informar";
  if(typeof m.reabrir === "number" && m.reabrir > 0){
    if(dt) dt.value = somaDias(hojeISO(), m.reabrir);
    if(hint) hint.textContent = "Vamos criar a tarefa de retomar pra daqui " + m.reabrir +
      " dias (" + dataBR(somaDias(hojeISO(), m.reabrir)) + ").";
  } else if(m.reabrir === "informar"){
    if(hint) hint.textContent = "Escolha embaixo a data de voltar a falar.";
  } else if(m.foraDaTaxa){
    if(hint) hint.textContent = "Desqualificar nao conta como derrota: esse motivo fica fora do denominador da taxa de ganho.";
  } else {
    if(hint) hint.textContent = "Esse motivo nao gera tarefa de retomar.";
  }
};

ACOES.ngSalvarPerdido = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var err = document.getElementById('ngErr');
  var k = (document.getElementById('ngPmot')||{}).value || "";
  if(!k){ err.textContent = "Escolha o que aconteceu. Sem motivo, perder vira estatistica muda."; return; }
  var m = motivoPerdaDe(k) || { reabrir:0, rot:k };
  var obs = String((document.getElementById('ngPobs')||{}).value || "").slice(0,400);
  var quandoFechou = (document.getElementById('ngPdata')||{}).value || hojeISO();

  var dataRetomar = "";
  if(m.reabrir === "informar"){
    dataRetomar = (document.getElementById('ngPreabrir')||{}).value || "";
    if(!dataRetomar){ err.textContent = "Escolha a data de voltar a falar."; return; }
  } else if(typeof m.reabrir === "number" && m.reabrir > 0){
    dataRetomar = somaDias(hojeISO(), m.reabrir);
  }

  var antes = ngAntesDeFechar(n);
  // Ganho OU perdido, e pela origem, nao pelo cadastro do indicador
  // (secao 4.4, item 7). O retorno de "nao deu certo" e o que faz a
  // proxima indicacao existir, e e o que mais se esquece de mandar.
  var indicou = n.origem === "indicacao";
  var indId = n.indicadorId || "", indNome = n.indicadorNome, empresa = n.empresa, titulo = n.titulo;
  var contatoId = n.contatoId || "", contatoNome = n.contatoNome || "", contatoTel = n.contatoTel || "";
  fecharFolha();

  gravar("crm_negocios", id, {
    status:"perdido", motivoPerda:k, motivoPerdaObs:obs, fechadoEm:quandoFechou,
    proxTipo:"", proxData:"", proxTexto:"", proxHora:"", congeladoAte:""
  }).then(function(){
    ngNota(id, "Perdido em " + dataBR(quandoFechou) + ". Motivo: " + m.rot + "." + (obs ? " " + obs : ""));
    if(dataRetomar){
      ngCriarTarefa({
        tipo:"retomar", data:dataRetomar,
        texto:"Retomar a " + empresa + " (" + m.rot + ")",
        contatoId:contatoId, contatoNome:contatoNome, contatoTel:contatoTel,
        negocioId:id, negocioTitulo:titulo
      });
    }
    if(indicou){
      var ind = indId ? contatoPorId(indId) : null;
      ngCriarTarefa({
        tipo:"avisar_indicador", data:somaDias(hojeISO(), 1),
        texto:"Dar o retorno pra " + (indNome || "quem indicou") + " sobre a " + empresa,
        contatoId:indId, contatoNome:indNome || "", contatoTel:(ind && ind.tel) || "",
        negocioId:id, negocioTitulo:titulo
      });
    }
    comDesfazer("Marcado como perdido" + (dataRetomar ? ", com retomada em " + dataBR(dataRetomar) : ""),
                "crm_negocios", id, antes);
    redesenhar();
  });
};

/* ---------------------------------------------------------------------
   CONGELAR
   E a valvula de escape honesta. Sem ela o vendedor bota data falsa no
   proximo passo pra parar o alarme, e a partir dai o dado inteiro
   apodrece. Teto de CONGELAMENTO_MAX dias, motivo em picklist, e a
   previsao de fechamento e EMPURRADA pra depois do descongelamento,
   avisando na tela: previsao dentro do congelamento e mentira que o
   painel repete o mes inteiro.
   --------------------------------------------------------------------- */
ACOES.ngCongelar = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var mot = [], i;
  for(i=0;i<MOTIVOS_CONGELAR.length;i++) mot.push([MOTIVOS_CONGELAR[i], MOTIVOS_CONGELAR[i]]);
  var padrao = somaDias(hojeISO(), 30);
  folha("Congelar",
    '<form class="form" id="ngF" data-a="ngSalvarCongelar" data-id="' + esc(n.id) + '">' +
      '<div class="small muted2">Congelado, o negocio sai das cobrancas e fica esmaecido no funil. Ele nao morre, so para de pedir atencao ate a data.</div>' +
      '<div class="fld"><label>Por que <span class="req">*</span></label>' +
        '<select class="inp" id="ngCmot">' + ngOpcoes(mot, "", "escolha") + '</select></div>' +
      '<div class="fld"><label>Volta a cobrar em <span class="req">*</span></label>' +
        '<div class="pills">' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="15">15 dias</button>' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="30">30 dias</button>' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="60">60 dias</button>' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="90">90 dias</button>' +
        '</div>' +
        '<input class="inp" type="date" id="ngCate" value="' + esc(padrao) + '" min="' + esc(somaDias(hojeISO(),1)) +
          '" max="' + esc(somaDias(hojeISO(), CONGELAMENTO_MAX)) + '" data-ch="ngChCongela" style="margin-top:8px">' +
        '<div class="hint">O maximo e ' + CONGELAMENTO_MAX + ' dias. Mais que isso nao e pausa, e negocio perdido sem ninguem assumir.</div></div>' +
      '<div class="small" id="ngCaviso" style="color:var(--warn)"></div>' +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-primary" type="submit" form="ngF">Congelar</button>');
  ACOES.ngChCongela();
};
ACOES.ngCongDias = function(el){
  var d = document.getElementById('ngCate');
  if(d){ d.value = somaDias(hojeISO(), parseInt(el.getAttribute('data-d'), 10) || 30); ACOES.ngChCongela(d); }
};
ACOES.ngChCongela = function(){
  // Le o id do proprio formulario, e nao da rota: esta folha tambem abre
  // de dentro do Hoje, onde a rota nao e a do negocio.
  var fo = document.getElementById('ngF');
  var n = fo ? achar("negocios", fo.getAttribute('data-id')) : null;
  var d = document.getElementById('ngCate');
  var av = document.getElementById('ngCaviso');
  if(!n || !d || !av) return;
  var nova = ngPrevDepoisDoGelo(n, d.value);
  av.textContent = nova
    ? ("A previsao de fechamento vai de " + dataBR(n.prevFechamento) + " pra " + dataBR(nova) +
       ", porque previsao dentro do congelamento e data que ninguem vai cumprir.")
    : "";
};
// Empurra a previsao pra depois do descongelamento. Uma semana util
// depois, nao no proprio dia: no dia em que volta a falar ainda nao
// fechou nada.
function ngPrevDepoisDoGelo(n, ate){
  if(!ate || !n.prevFechamento) return "";
  if(n.prevFechamento > ate) return "";
  return ngDiasUteis(ate, 5);
}

ACOES.ngSalvarCongelar = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  var err = document.getElementById('ngErr');
  var motivo = (document.getElementById('ngCmot')||{}).value || "";
  var ate    = (document.getElementById('ngCate')||{}).value || "";
  if(!motivo){ err.textContent = "Escolha o motivo."; return; }
  if(!ate || ate <= hojeISO()){ err.textContent = "Escolha uma data futura."; return; }
  if(diasEntre(hojeISO(), ate) > CONGELAMENTO_MAX){
    err.textContent = "O maximo e " + CONGELAMENTO_MAX + " dias (ate " + dataBR(somaDias(hojeISO(), CONGELAMENTO_MAX)) + ").";
    return;
  }
  var up = { congeladoAte:ate, congeladoMotivo:motivo };
  var novaPrev = ngPrevDepoisDoGelo(n, ate);
  if(novaPrev){ up.prevFechamento = novaPrev; up.vezesRemarcouPrev = (n.vezesRemarcouPrev||0) + 1; }
  // O proximo passo vai pro dia do descongelamento: e o que faz o negocio
  // voltar sozinho pra fila em vez de sumir de vez.
  up.proxTipo = "retomar"; up.proxData = ate; up.proxTexto = "descongelar: " + motivo;
  fecharFolha();
  gravar("crm_negocios", id, up).then(function(){
    ngNota(id, "Congelado ate " + dataBR(ate) + ". Motivo: " + motivo + "." +
      (novaPrev ? " Previsao movida pra " + dataBR(novaPrev) + "." : ""));
    toast("Congelado ate " + dataBR(ate) + (novaPrev ? ", previsao movida pra " + dataBR(novaPrev) : ""), "ok");
    redesenhar();
  });
};
ACOES.ngDescongelar = function(el){
  var id = el.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var antes = { congeladoAte:n.congeladoAte || "", congeladoMotivo:n.congeladoMotivo || "" };
  gravar("crm_negocios", id, { congeladoAte:"", congeladoMotivo:"" }).then(function(){
    ngNota(id, "Descongelado.");
    comDesfazer("Descongelado. Ele volta pra fila hoje.", "crm_negocios", id, antes);
    redesenhar();
  });
};

ACOES.ngSalvarEncerrar = function(f){

                               proxTipo:"", proxData:"", proxTexto:"", proxHora:"" })
    .then(function(){
      ngNota(id, "Contrato encerrado em " + dataBR(d) + ". Motivo: " + rot + ".");
      toast("Contrato encerrado", "ok");
      redesenhar();
    });
};

/* ---------------------------------------------------------------------
   RENOVAR
   Renovacao e negocio NOVO, com origem cliente_atual e ag.renovacaoDeId
   apontando pro anterior, e o anterior encerra com motivo "renovado".
   Esticar a data do contrato antigo faria a maior vitoria do trimestre
   nao existir; encerrar e recriar sem o vinculo mostraria uma perda de
   R$ 3.500/mes que nunca aconteceu.
   --------------------------------------------------------------------- */
ACOES.ngRenovar = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n || n.tipo !== "agencia") return;
  var a = n.ag || {};
  var inicio = a.fimContrato ? somaDias(a.fimContrato, 1) : hojeISO();
  // O novo nasce em Negociacao: o contrato ja existe e a conversa e sobre
  // continuar, nao sobre a Lime existir. Comecar em Contato faria o funil
  // contar uma prospeccao que nao houve.
  var novoTitulo = "Renovacao " + (a.fimContrato ? String(a.fimContrato).slice(0,4) : hojeISO().slice(0,4)) + " " + n.empresa;

  folha("Renovar o contrato da " + n.empresa,
    '<form class="form" id="ngF" data-a="ngSalvarRenovar" data-id="' + esc(n.id) + '">' +
      '<div class="small muted2">Isto cria um negocio NOVO ligado a este, e encerra este com o motivo "renovado". Renovacao encerrada assim fica fora do MRR perdido do mes.</div>' +
      '<div class="fld"><label>Titulo do negocio novo</label>' +
        '<input class="inp" id="ngRtit" maxlength="120" value="' + esc(novoTitulo) + '"></div>' +
      '<div class="grid2">' +
        '<div class="fld"><label>Fee proposto em R$ <span class="req">*</span></label>' +
          '<input class="inp" id="ngRmrr" inputmode="decimal" value="' + esc(a.mrr ? String(a.mrr) : "") + '">' +
          '<div class="hint">O atual e ' + esc(brl(a.mrr||0)) + '/mes.</div></div>' +
        '<div class="fld"><label>Meses</label>' +
          '<input class="inp" id="ngRmeses" inputmode="numeric" value="' + esc(a.meses ? String(a.meses) : "12") + '"></div>' +
        '<div class="fld"><label>Comeca em</label>' +
          '<input class="inp" type="date" id="ngRini" value="' + esc(inicio) + '"></div>' +
        '<div class="fld"><label>Previsao de fechar</label>' +
          '<input class="inp" type="date" id="ngRprev" value="' + esc(a.fimContrato || somaDias(hojeISO(), CICLO_MEDIANO.agencia)) + '"></div>' +
      '</div>' +
      blocoProxPasso("rn", { tipo:"agencia", estagio:"ag_negociacao" }, true) +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-primary" type="submit" form="ngF">Criar a renovacao</button>');
};
ACOES.ngSalvarRenovar = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var err = document.getElementById('ngErr');
  var mrr = ngLerDinheiro((document.getElementById('ngRmrr')||{}).value);
  if(mrr <= 0){ err.textContent = "Preencha o fee proposto em R$."; return; }
  var prox = lerProxPasso("rn");
  if(!prox.ok){ err.textContent = prox.erro; return; }

  var a = n.ag || {};
  var meses = parseInt((document.getElementById('ngRmeses')||{}).value, 10) || 0;
  var ini   = (document.getElementById('ngRini')||{}).value || hojeISO();
  var prev  = (document.getElementById('ngRprev')||{}).value || somaDias(hojeISO(), CICLO_MEDIANO.agencia);
  var titulo = String((document.getElementById('ngRtit')||{}).value || ("Renovacao " + n.empresa)).slice(0,120);

  var novoId = idNovo("n");
  var novo = {
    tipo:"agencia", titulo:titulo, empresa:n.empresa, empresaChave:n.empresaChave || chave(n.empresa),
    contatoId:n.contatoId || "", contatoNome:n.contatoNome || "", contatoTel:n.contatoTel || "",
    estagio:"ag_negociacao", status:"aberto", origem:"cliente_atual",
    indicadorId:"", indicadorNome:"",
    ag:{ mrr:mrr, mrrInicial:mrr, meses:meses, verbaMidia:a.verbaMidia || 0, pctVerba:a.pctVerba || 0,
         servicos:a.servicos || [], inicioContrato:ini, fimContrato:(meses ? somaDias(ini, meses*30 - 1) : ""),
         renovacaoDeId:id, quemDecide:a.quemDecide || "", faixaVerba:a.faixaVerba || "" },
    pt:null,
    prevFechamento:prev, prevEstimada:false,
    proxTipo:prox.proxTipo, proxData:prox.proxData, proxTexto:prox.proxTexto, proxHora:prox.proxHora,
    congeladoAte:"", congeladoMotivo:"", vezesAdiado:0, vezesRemarcouPrev:0,
    ultimoToqueEm:hojeISO(), ultimoToqueTxt:"Renovacao aberta a partir do contrato anterior",
    estagioDesde:hojeISO(), maiorEstagio:idxEstagio({ tipo:"agencia", estagio:"ag_negociacao" }),
    motivoPerda:"", motivoPerdaObs:"", fechadoEm:"", encerradoEm:"", motivoEncerramento:"",
    linkProposta:"", obs:n.obs || "",
    busca:chave(n.empresa + " " + titulo + " " + (n.contatoNome || "")),
    criadoEm:hojeISO(), criadoPor:(SESSAO && SESSAO.nome) || "", arquivado:false
  };
  novo.valorRef = valorRefDe(novo);
  fecharFolha();

  gravar("crm_negocios", novoId, novo).then(function(){
    return gravar("crm_negocios", id, {
      status:"encerrado", motivoEncerramento:"renovado", encerradoEm:hojeISO(),
      proxTipo:"", proxData:"", proxTexto:"", proxHora:""
    });
  }).then(function(){
    ngNota(id, "Encerrado como renovado. O contrato novo e " + titulo + ".");
    ngNota(novoId, "Renovacao do contrato anterior, que estava em " + brl(a.mrr || 0) + "/mes.");
    toast("Renovacao criada", "ok");
    ir("negocio/" + novoId);
  });
};

/* ---------------------------------------------------------------------
   EDITAR VALORES
   O campo *Inicial e gravado uma vez e nunca sobrescrito. Sem ele a tela
   nao consegue dizer "pediu 220.000, esta em 180.000", que e exatamente o
   que o dono quer ver antes de aprovar mais um desconto.
   --------------------------------------------------------------------- */
ACOES.ngEditarValores = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var corpo = '<form class="form" id="ngF" data-a="ngSalvarValores" data-id="' + esc(n.id) + '">', i;

  if(n.tipo === "agencia"){
    var a = n.ag || {}, serv = a.servicos || [];
    var chk = "";
    for(i=0;i<SERVICOS.length;i++){
      var marcado = false;
      for(var j=0;j<serv.length;j++) if(serv[j] === SERVICOS[i]) marcado = true;

ACOES.ngSalvarValores = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var up = {}, i, el;

  if(n.tipo === "agencia"){
    var a = ngCopia(n.ag);
    var mrr = ngLerDinheiro((document.getElementById('ngVmrr')||{}).value);
    if(!a.mrrInicial && mrr > 0) a.mrrInicial = (n.ag && n.ag.mrr) || mrr;   // so na primeira vez
    a.mrr = mrr;
    a.meses = parseInt((document.getElementById('ngVmeses')||{}).value, 10) || 0;
    a.verbaMidia = ngLerDinheiro((document.getElementById('ngVverba')||{}).value);
    a.pctVerba = lerValor((document.getElementById('ngVpct')||{}).value) || 0;
    a.inicioContrato = (document.getElementById('ngVini')||{}).value || "";
    a.fimContrato = (document.getElementById('ngVfim')||{}).value || "";
    a.quemDecide = (document.getElementById('ngVqd')||{}).value || "";
    a.faixaVerba = (document.getElementById('ngVfv')||{}).value || "";
    var marcados = document.querySelectorAll('.ngServ'), serv = [];
    for(i=0;i<marcados.length;i++) if(marcados[i].checked && serv.length < 6) serv.push(marcados[i].value);
    a.servicos = serv;
    if(a.fimContrato && a.inicioContrato && a.fimContrato <= a.inicioContrato){
      document.getElementById('ngErr').textContent = "A data de termino tem que ser depois da de inicio.";
      return;
    }
    up.ag = a;
  } else {
    var p = ngCopia(n.pt);
    var valor = ngLerDinheiro((document.getElementById('ngVvalor')||{}).value);
    if(!p.valorInicial && valor > 0) p.valorInicial = (n.pt && n.pt.valor) || valor;
    p.valor = valor;
    p.edicao = (document.getElementById('ngVedicao')||{}).value || "";
    p.cota = (document.getElementById('ngVcota')||{}).value || "";
