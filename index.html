/* ============ 05-shell ============ */
/* =====================================================================
   CRM LIME - CASCA
   Tela de entrada, roteador, folhas e o contrato que toda tela usa.

   CONTRATO DE TELA
     Toda tela é uma função que devolve HTML (string) e opcionalmente
     registra o que fazer depois de pintar em DEPOIS.push(fn).
     Não existe addEventListener espalhado: tudo é delegado pelo
     data-a="acao" no clique, resolvido em ACOES[nome](el, ev).
     Assim redesenhar() pode trocar o innerHTML inteiro sem vazar
     escuta e sem deixar botão morto na tela.
   ===================================================================== */

var ROTA = { tela:"hoje", id:"", extra:"" };
var DEPOIS = [];          // funções a rodar depois de pintar
var ACOES = {};           // nome da ação -> função(el, ev)
var TELAS = {};           // nome da tela -> função() que devolve HTML

/* ---------------------------------------------------------------------
   ROTEADOR POR HASH
   Por hash porque o voltar do Android tem que sair do detalhe sem fechar
   o app, e porque os dois vão mandar link de negócio um pro outro no
   WhatsApp, o que num time de duas pessoas substitui metade das
   notificações que um CRM grande precisa ter.
   --------------------------------------------------------------------- */
function lerRota(){
  var h = String(location.hash || "").replace(/^#\/?/, "");
  var p = h.split("/").filter(Boolean);
  return { tela:p[0] || (PERM && PERM.home) || "hoje", id:p[1] || "", extra:p[2] || "" };
}
function ir(rota){
  if(location.hash === "#/" + rota) redesenhar();
  else location.hash = "#/" + rota;
}
function voltar(){
  if(history.length > 1) history.back();
  else ir((PERM && PERM.home) || "hoje");
}

var ABAS = [
  { k:"hoje",     rot:"Hoje",     ic:"⚡" },
  { k:"funil",    rot:"Funil",    ic:"▦" },
  { k:"negocios", rot:"Negócios", ic:"💼" },
  { k:"pessoas",  rot:"Pessoas",  ic:"👥" },
  { k:"painel",   rot:"Painel",   ic:"📊" },
  { k:"acessos",  rot:"Acessos",  ic:"🔑", soAdmin:true },
  // Fica por ultimo de proposito: e a aba que se le uma vez, nao todo dia.
  { k:"tutorial", rot:"Tutorial", ic:"📖" }
];

function redesenhar(){
  if(!SESSAO){ pintarGate(); return; }
  ROTA = lerRota();
  if(ROTA.tela === "acessos" && !ehAdmin()) ROTA.tela = (PERM && PERM.home) || "hoje";
  if(!TELAS[ROTA.tela]) ROTA.tela = (PERM && PERM.home) || "hoje";

  DEPOIS = [];
  var alvo = document.getElementById('conteudo');
  if(!alvo) return;
  var html = "";
  try{ html = TELAS[ROTA.tela](); }
  catch(e){
    console.error(e);
    html = '<div class="empty"><div class="ei">⚠</div><div class="et">Essa tela quebrou</div>' +
           '<div class="ex">' + esc(String(e && e.message || e)) + '</div>' +
           '<button class="btn" data-a="ir" data-r="hoje">Voltar pro Hoje</button></div>';
  }
  alvo.innerHTML = html;
  alvo.scrollTop = 0;

  pintarNav(); pintarSync(); atualizaTituloAba();
  for(var i=0;i<DEPOIS.length;i++){ try{ DEPOIS[i](); }catch(e){ console.error(e); } }
}

function pintarNav(){
  var w = document.getElementById('nav');
  if(!w) return;
  var h = "";
  for(var i=0;i<ABAS.length;i++){
    var a = ABAS[i];
    if(a.soAdmin && !ehAdmin()) continue;
    var cnt = contadorAba(a.k);
    h += '<button class="' + (ROTA.tela === a.k ? "on" : "") + '" data-a="ir" data-r="' + a.k + '">' +
           '<span class="ic">' + a.ic + '</span><span>' + a.rot + '</span>' +
           (cnt ? '<span class="cnt' + (cnt.alerta ? " alert" : "") + '">' + cnt.n + '</span>' : '') +
         '</button>';
  }
  w.innerHTML = h;
}
function contadorAba(k){
  if(k === "hoje"){
    var f = filaDeHoje();
    return f.total ? { n:f.total, alerta:f.vencidos > 0 } : null;
  }
  if(k === "negocios"){
    var n = lista("negocios").filter(function(x){ return x.status === "aberto"; }).length;
    return n ? { n:n } : null;
  }
  return null;
}
// Contador no título da aba. Notificação do navegador só aparece pra quem
// já está com a aba aberta, então é decoração; o título funciona sempre.
function atualizaTituloAba(){
  var f = SESSAO ? filaDeHoje() : { total:0 };
  document.title = (f.total ? "(" + f.total + ") " : "") + "CRM Lime";
}

/* ---------------------------------------------------------------------
   DELEGAÇÃO DE EVENTO
   Um escutador no documento inteiro. Nenhuma tela registra o próprio.
   --------------------------------------------------------------------- */
document.addEventListener('click', function(ev){
  var alvo = ev.target;
  var el = alvo.closest('[data-a]');
  if(!el) return;

  /* DUAS GUARDAS, e as duas nasceram de um defeito que apareceu em uso
     real (11/09/2026) e afetava os 24 formulários do sistema.

     1) Um <form data-a="salvarX"> pertence ao SUBMIT, nunca ao clique.
        Sem esta linha, closest() subia do campo clicado até o formulário
        e disparava "salvar" a CADA clique dentro dele. Pior: o
        preventDefault logo abaixo impedia o campo de receber o foco.
        Na tela isso aparecia assim: a pessoa digitava a senha, clicava no
        campo do telefone, e o sistema salvava sozinho sem o telefone e
        ainda não deixava digitar. O botão de enviar que fica dentro do
        formulário também disparava a ação duas vezes, uma no clique e
        outra no submit.

     2) Clique em campo de formulário é a pessoa focando o campo, nunca
        uma ação, mesmo quando o campo está dentro de um bloco clicável. */
  if(el.tagName === "FORM") return;
  if(alvo.closest("input, select, textarea, option, label")) return;

  var nome = el.getAttribute('data-a');
  if(!ACOES[nome]) return;
  ev.preventDefault();
  try{ ACOES[nome](el, ev); }catch(e){ console.error(e); toast("Não deu certo: " + (e.message||e), "bad"); }
});
document.addEventListener('submit', function(ev){
  var f = ev.target.closest('form[data-a]');
  if(!f) return;
  ev.preventDefault();
  var nome = f.getAttribute('data-a');
  if(ACOES[nome]) { try{ ACOES[nome](f, ev); }catch(e){ console.error(e); toast(e.message||String(e), "bad"); } }
});

   Nada de confirm() do navegador. Folha de baixo pra cima pra tudo que
   tem consequência, e Desfazer de 8 segundos em vez de confirmação dupla:
   mover errado acontece toda semana, e confirmar toda vez cobra um clique
   de todo mundo pra proteger de um erro de 8 segundos.
   --------------------------------------------------------------------- */
var FOLHA_ABERTA = false;
function folha(titulo, corpo, rodape, largo){
  var ov = document.getElementById('folha');
  ov.innerHTML =
    '<div class="modal' + (largo ? " wide" : "") + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><div class="h2">' + esc(titulo) + '</div>' +
        '<button class="x" data-a="fecharFolha" aria-label="Fechar">&times;</button></div>' +
      '<div class="modal-b">' + corpo + '</div>' +
      (rodape ? '<div class="modal-f">' + rodape + '</div>' : '') +
    '</div>';
  ov.hidden = false;
  FOLHA_ABERTA = true;
  document.body.style.overflow = "hidden";
  var p = ov.querySelector('input:not([type=hidden]), select, textarea');
  if(p && window.innerWidth > 860) setTimeout(function(){ try{ p.focus(); }catch(e){} }, 40);
}
function fecharFolha(){
  var ov = document.getElementById('folha');
  ov.hidden = true; ov.innerHTML = "";
  FOLHA_ABERTA = false;
  document.body.style.overflow = "";
}
document.addEventListener('keydown', function(ev){
  if(ev.key === "Escape" && FOLHA_ABERTA) fecharFolha();
});
document.addEventListener('click', function(ev){
  if(ev.target && ev.target.id === "folha") fecharFolha();
});

/* Desfazer de 8 segundos. Guarda o documento como estava e devolve se a
   pessoa clicar. Nada de confirmação dupla. */
var DESFAZER = null;
function comDesfazer(msg, colecao, id, antes){
  var copia = JSON.parse(JSON.stringify(antes || {}));
  DESFAZER = { colecao:colecao, id:id, dados:copia, ate:Date.now()+8000 };
  var w = document.getElementById('toasts');
  if(!w){ w = document.createElement('div'); w.id='toasts'; w.className='toast-wrap'; document.body.appendChild(w); }
  var t = document.createElement('div');
  t.className = "toast ok";
  t.style.pointerEvents = "auto";
  t.innerHTML = esc(msg) + ' <button class="btn btn-sm" style="margin-left:10px" data-a="desfazer">Desfazer</button>';
  w.appendChild(t);
  setTimeout(function(){
    if(t.parentNode) t.parentNode.removeChild(t);
    if(DESFAZER && DESFAZER.id === id) DESFAZER = null;
  }, 8000);
}
ACOES.desfazer = function(el){
  if(!DESFAZER || Date.now() > DESFAZER.ate){ toast("O prazo de desfazer passou"); return; }
  var d = DESFAZER; DESFAZER = null;
  var t = el.closest('.toast'); if(t && t.parentNode) t.parentNode.removeChild(t);
  gravar(d.colecao, d.id, d.dados).then(function(){ toast("Desfeito", "ok"); redesenhar(); });
};

ACOES.entrar = function(f){
  var campo = document.getElementById('pw');
  var err = document.getElementById('gateErr');
  var senha = campo.value;
  if(!senha){ err.textContent = "Digite a senha."; return; }
  err.textContent = "Conferindo...";

  sha256(senha).then(function(h){
    // A senha de recuperação funciona SEMPRE, mesmo com a coleção vazia,
    // apagada ou fora do ar. É o que impede ficar trancado pra fora.
    if(h === ACESSO_RECUPERACAO.hash){
      abrirSessao(ACESSO_RECUPERACAO, true);
      return entrou();
    }
    return carregarAcessos().then(function(acc){
      for(var i=0;i<acc.length;i++){
        if(acc[i].ativo !== false && acc[i].hash === h){ abrirSessao(acc[i], false); return entrou(); }
      }
      err.textContent = acc.length ? "Senha não confere." :
        "Não consegui ler os acessos. Use a senha de recuperação.";
    });
  }).catch(function(e){
    if(e && e.message === "sem-crypto"){
      err.textContent = "Não deu pra conferir a senha neste navegador. Abra pelo endereço https, não por arquivo local.";
    } else {
      err.textContent = "Não deu pra entrar: " + ((e&&e.code)||(e&&e.message)||"erro");
    }
  });
};

ACOES.baixarBackup = function(){

ACOES.salvarMinhaSenha = function(){
  var a = document.getElementById('ms1').value.trim();
  var b = document.getElementById('ms2').value.trim();
  var err = document.getElementById('msErr');
  if(a.length < 8){ err.textContent = "Muito curta. Use pelo menos 8."; return; }
  if(a !== b){ err.textContent = "As duas não batem."; return; }
  // Rede de segurança. A checagem que vale é a de SESSAO.recuperacao, não
  // a de acessoId vazio: o acesso de recuperação já teve id preenchido no
  // passado, e só por isso este caminho deixou passar uma gravação que o
  // banco recusou com um erro incompreensível na tela.
  if(!SESSAO || SESSAO.recuperacao || !SESSAO.acessoId){
    err.textContent = "Você entrou pela senha de recuperação, que não tem senha própria pra trocar. Crie o seu acesso em Acessos e entre com ele.";
    return;
  }
  sha256(a).then(function(h){
    return gravar("crm_acessos", SESSAO.acessoId, { hash:h });
  }).then(function(){ fecharFolha(); toast("Senha trocada", "ok"); })
    .catch(function(e){ err.textContent = "Não deu: " + ((e&&e.message)||"erro"); });
};

function boot(){
  pintarSync();
  // O hash da senha de recuperação já vem pronto em 03-const.js. Antes
  // era calculado aqui a partir da senha em texto, o que num repositório
  // público equivale a publicar a senha.
  Promise.resolve()
    .then(function(){ return iniciarBanco(); })
    .then(function(){
      var s = sessaoValida();
      if(s){
        SESSAO = s; PERM = PERFIS[s.perfil];
        document.getElementById('gate').hidden = true;
        document.getElementById('app').hidden = false;
        pintarCabecalho();
        carregarCache();
        if(!location.hash) location.hash = "#/" + ((PERM && PERM.home) || "hoje");
        redesenhar();
        // Revalida contra a lista de acessos. Lista VAZIA não derruba
        // ninguém: mantém a sessão e avisa. Derrubar o time por causa de
        // um erro de leitura é pior que o risco que evita.
        carregarAcessos().then(function(acc){
          if(!acc.length){
            if(!SESSAO.recuperacao) avisoBarra("Não consegui ler a lista de acessos agora. Você continua dentro com o perfil da última vez.");
            return;
          }
          if(SESSAO.recuperacao) return;
          var eu = null;
          for(var i=0;i<acc.length;i++) if(acc[i].id === SESSAO.acessoId) eu = acc[i];
          if(!eu || eu.ativo === false){
            fecharSessao(); pintarGate();
            var g = document.getElementById('gateErr');
            if(g) g.textContent = "Seu acesso foi desativado.";
            return;
          }
          if(eu.perfil !== SESSAO.perfil){
            SESSAO.perfil = eu.perfil; PERM = PERFIS[eu.perfil];
            guardar("sessao", SESSAO); pintarCabecalho(); redesenhar();
          }
        });
        sincronizar(true).then(function(){ redesenhar(); return esvaziarOutbox(); });
        perguntarDoRetorno();
      } else {
        pintarGate();
      }
      atualizaAvisoFila();
    })
    /* A PARTIDA NÃO PODE FALHAR EM SILÊNCIO.

       Esta cadeia não tinha catch. Qualquer exceção dentro dela (uma
       tela que quebra ao desenhar, um dado velho no cache, o SDK que
       não carregou) deixava a promessa rejeitada sem ninguém ouvindo, e
       o resultado na tela era a página de senha parada pra sempre, sem
       mensagem nenhuma. Quem estivesse do outro lado concluiria que o
       CRM morreu, e não teria como saber por quê.

       Aqui o erro vira tela: a pessoa vê o motivo, sabe que o registro
       dela não se perdeu, e tem um botão pra recarregar.              */
    .catch(function(e){
      console.error("a partida do CRM falhou:", e);
      try{
        document.getElementById('app').hidden = true;
        var g = document.getElementById('gate');
        g.hidden = false;
        g.innerHTML =
          '<div class="gate-card">' +
            '<img src="logo-lime.png" alt="Agência Lime">' +
            '<div class="gate-t">Não consegui abrir</div>' +
            '<div class="gate-s">Erro na partida</div>' +
            '<p class="muted2" style="margin-top:18px;line-height:1.55">O CRM travou ao iniciar. ' +
            'Nada do que você registrou se perdeu: o que ainda não subiu continua guardado neste aparelho ' +
            'e sobe sozinho quando o sistema abrir.</p>' +
            '<p class="tiny muted" style="margin-top:12px;word-break:break-word">' + esc(String((e && e.message) || e)) + '</p>' +
            '<div class="gate-f">' +
              '<button class="btn btn-primary btn-lg btn-block" onclick="location.reload()">Tentar de novo</button>' +
              '<button class="btn btn-ghost btn-block" data-a="limparCacheEAbrir">Limpar o cache e abrir</button>' +
            '</div>' +
            '<div class="gate-n">Se acontecer de novo depois de limpar o cache, o problema não está neste aparelho. ' +
            'Avise o Eric com o texto do erro acima.</div>' +
          '</div>';
      }catch(e2){ /* se nem isso desenhar, o console fica com o motivo */ }
    });
}

/* Saída de emergência da tela de erro da partida: cache velho é a causa

  }catch(e){}
  location.reload();
};

/* ---------------------------------------------------------------------
   O BOTÃO
   ajuda("chave") devolve o HTML pra colar ao lado de qualquer rótulo.
   --------------------------------------------------------------------- */
function ajuda(chave){
  if(!AJUDA[chave]){
    // Chave errada não pode virar bolinha muda na tela: melhor não
    // desenhar nada e deixar o console reclamar pra quem programa.
    if(typeof console !== "undefined") console.warn("ajuda sem texto: " + chave);
    return "";
  }
  return '<button type="button" class="aj" data-a="verAjuda" data-k="' + esc(chave) +
         '" aria-label="O que é isso?">?</button>';
}

var AJ_ABERTA = null;

function fecharAjuda(){
  var p = document.getElementById('ajudaPop');
  if(p){ p.hidden = true; p.innerHTML = ""; }
  AJ_ABERTA = null;
}

function mostrarAjuda(el){
  var k = el.getAttribute('data-k');
  var a = AJUDA[k];
  if(!a) return;

  var p = document.getElementById('ajudaPop');
  if(!p){
    p = document.createElement('div');
    p.id = "ajudaPop"; p.className = "aj-pop"; p.hidden = true;
    document.body.appendChild(p);
  }
  // Cada parágrafo do texto vira um <p>, pra explicação de três partes
  // não virar um bloco único que ninguém lê.
  var corpo = String(a.x).split("\n\n").map(function(par){
    return '<p>' + esc(par).replace(/\n/g, "<br>") + '</p>';
  }).join("");
  p.innerHTML = '<div class="aj-t">' + esc(a.t) + '</div>' + corpo +
                '<button type="button" class="aj-x" data-a="fecharAjudaBtn">entendi</button>';
  p.hidden = false;

  /* Posição: ancorada no botão no computador, presa embaixo no celular.
     No celular a tela é estreita demais pra caixinha flutuante caber sem
     tapar justamente o número que a pessoa quer entender. */
  if(window.innerWidth <= 860){
    p.className = "aj-pop aj-baixo";
    p.style.left = ""; p.style.top = "";
  } else {
    p.className = "aj-pop";
    var r = el.getBoundingClientRect();
    var larg = 340;
    var x = r.left + r.width/2 - larg/2;
    if(x < 12) x = 12;
    if(x + larg > window.innerWidth - 12) x = window.innerWidth - larg - 12;
    p.style.left = Math.round(x) + "px";
    // Abre pra baixo; se não couber, abre pra cima.
    var abaixo = window.innerHeight - r.bottom;
    if(abaixo < 240 && r.top > 240){
      p.style.top = Math.round(r.top + window.scrollY - p.offsetHeight - 10) + "px";
    } else {
      p.style.top = Math.round(r.bottom + window.scrollY + 10) + "px";
    }
  }
  AJ_ABERTA = k;
}

ACOES.verAjuda = function(el){
  // Segundo toque no mesmo botão fecha, que é o que o dedo espera.
  if(AJ_ABERTA === el.getAttribute('data-k')){ fecharAjuda(); return; }
  mostrarAjuda(el);
};
ACOES.fecharAjudaBtn = function(){ fecharAjuda(); };

/* Mouse por cima abre no computador, sem precisar clicar. No celular
   não existe hover e o evento nem dispara, então vale só o toque. */
document.addEventListener('mouseover', function(ev){
  if(window.innerWidth <= 860) return;
  var el = ev.target.closest && ev.target.closest('.aj');
  if(el) mostrarAjuda(el);
});
document.addEventListener('mouseout', function(ev){
  if(window.innerWidth <= 860) return;
  var el = ev.target.closest && ev.target.closest('.aj');
  if(!el) return;
  // Some só se o mouse não foi parar DENTRO da própria caixinha, senão
  // não dá pra ler um texto de três parágrafos sem ele fugir.
  var pra = ev.relatedTarget;
  if(pra && pra.closest && pra.closest('#ajudaPop')) return;
  setTimeout(function(){
    var p = document.getElementById('ajudaPop');
    if(p && !p.matches(':hover')) fecharAjuda();
  }, 220);
});
document.addEventListener('click', function(ev){
  if(!AJ_ABERTA) return;
  if(ev.target.closest && (ev.target.closest('.aj') || ev.target.closest('#ajudaPop'))) return;
  fecharAjuda();
});
document.addEventListener('keydown', function(ev){
  if(ev.key === "Escape" && AJ_ABERTA) fecharAjuda();
});

/* =====================================================================
   CRM LIME - TELA HOJE
   A home do vendedor é a tela mais importante do sistema.

   Com 30 negocios abertos o kanban nao informa nada às 9h da manha: o
   vendedor ja sabe de cor onde cada um está. O que ele nao sabe é QUAL
   passou do ponto. Em funil de mil leads quem esconde a informacao é o
   volume; em funil de 30 quem esconde é o tempo, e tempo o kanban nao
   mostra.

   Duas decisoes mandam nesta tela:
     1. Teto duro de 8 cartoes. Uma terca com 11 atrasados faz a pessoa
        fechar a aba e nao voltar. Melhor 8 itens terminaveis do que a
        lista honesta que ninguem encara.
     2. Toda linha diz POR QUE está ali, com o numero. Nunca "atrasado",
        sempre "16 dias sem contato, o limite em Diagnostico é 5". Alerta
        sem motivo explicito é treinado a ser ignorado em uma semana.
   ===================================================================== */

/* ---------------------------------------------------------------------
   A FILA
   Recalculada em todo render de proposito, sem memoria entre chamadas:
   aba fixada por dias congelava a fila na data de ontem e mostrava
   "0 pra hoje" numa terca cheia. Sao ~130 negocios em memoria, custa
   menos que pintar a tela.
   --------------------------------------------------------------------- */

// Ordena por valor de ordenacao, NUNCA por valorRefDe: negocio sem valor
// entra com VALOR_PRESUMIDO, senao a indicacao fresca cadastrada em 20
// segundos fica sempre no fim e nunca aparece, e é o lead mais quente da casa.
function hjPorValor(a, b){ return valorOrdem(b) - valorOrdem(a); }
function hjPorNovo(a, b){ return String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")); }
function hjPorData(campo){
  return function(a, b){ return String(a[campo]||"").localeCompare(String(b[campo]||"")); };
}

// Balde 1 tem teto 3 e UMA vaga reservada pro mais recente. Sem essa vaga,
// tres cotas grandes atrasadas ocupam o balde todo dia e o negocio novo,
// que ainda nao tem valor, nunca chega a ser visto.
function hjTresComVaga(arr){
  var r = arr.slice().sort(hjPorValor);
  if(r.length <= 3) return r;
  var resto = r.slice(2).sort(hjPorNovo);
  return r.slice(0, 2).concat(resto.slice(0, 1));
}

/* O motivo do balde 4 e do balde 5 nao pode sair de porQue(): porQue responde
   "por que o semaforo está nessa cor", e para quem vence amanha ele responde
   "Ligar amanhã". Um item listado como esfriando com a frase "Ligar amanhã"
   embaixo nao diz numero nenhum e nao explica por que está na fila, que é
   justamente o que a tela promete. Aqui a frase explica o BALDE. */
function hjLimToque(n){
  var f = FUNIL[n.tipo] || [], ix = idxEstagio(n);
  // toqueDe() é do nucleo e ja tem o padrao pra tipo fora da tabela. Repetir
  // um padrao proprio aqui fazia a fila cobrar com 7 dias e o semaforo do
  // mesmo negocio pintar com 5, dois numeros diferentes na mesma linha.
  var tq = (typeof toqueDe === "function") ? toqueDe(n.tipo) : (TOQUE[n.tipo] || { normal:5, ultimo:3 });
  return (ix === f.length - 1) ? tq.ultimo : tq.normal;
}
function hjMotivoEsfriando(n){
  var f = FUNIL[n.tipo] || [], ix = idxEstagio(n);
  // Sem fallback de rótulo a frase saía "o limite em o estágio é 7 dias".
  var e = f[ix] || { teto:30, rot:"um estágio que não é deste funil" };
  var lim = hjLimToque(n);
  var silen = diasVencido(n.ultimoToqueEm), parado = diasVencido(n.estagioDesde);
  // Silêncio primeiro porque é o que o vendedor resolve hoje, com uma mensagem.
  if(silen > lim) return silen + " dias sem contato, o limite em " + e.rot + " é " + lim + " dias";
  return parado + " dias parado em " + e.rot + ", o teto do estágio é " + e.teto + " dias";
}
function hjMotivoSemPlano(n){
  if(!n.criadoEm) return "sem próximo passo marcado, sem data de cadastro no registro";
  var d = diasVencido(n.criadoEm);
  return "sem próximo passo marcado, cadastrado há " + d + (d === 1 ? " dia" : " dias");
}

/* A fila e de QUEM ESTA OLHANDO, nao do escritorio.

   Com SDR e closer no mesmo banco, uma fila unica faz o SDR abrir o dia e
   ver dez negocios que nao sao dele pra tocar, e o numero gigante da tela
   deixa de ser uma promessa e vira barulho. Quem quiser ver tudo aperta
   "do time", que e um filtro visivel, nao um padrao escondido.

   Admin e gestor comecam vendo o time, que e o trabalho deles. Negocio
   sem dono aparece pra todo mundo em qualquer modo (ver donoDe). */
var HOJE_SO_MEUS = null;   // null = ainda nao escolhido nesta sessao
function hjSoMeus(){
  if(HOJE_SO_MEUS !== null) return HOJE_SO_MEUS;
  return !(ehAdmin() || (PERM && PERM.negocios === "ver"));
}
function filaDeHoje(){
  var hoje = hojeISO();
  var todos = lista("negocios");
  var abertos = [], i, n;
  var soMeus = hjSoMeus();

  for(i = 0; i < todos.length; i++){
    n = todos[i];
    if(n.status !== "aberto") continue;
    if(soMeus && !meuNegocio(n)) continue;
    // Congelado nao entra em balde nenhum. Congelar é o pedido explicito
    // de parar de cobrar; cobrar assim mesmo ensina a nunca mais congelar,
    // e ai o vendedor bota data falsa e o dado inteiro apodrece.
    if(n.congeladoAte && n.congeladoAte > hoje) continue;
    abertos.push(n);
  }

  var resgate = [], candidatos = [], vencidos = 0, semData = 0, venc;
  for(i = 0; i < abertos.length; i++){
    n = abertos[i];
    if(!n.proxData){ semData++; candidatos.push(n); continue; }
    venc = diasVencido(n.proxData);
    if(venc >= 1) vencidos++;
    // Atraso de mais de 14 dias SAI da fila de todo dia e vai pro Resgate
    // de sexta. Esse corte é o que impede a terca com 11 atrasados.
    if(venc > 14) resgate.push(n);
    else candidatos.push(n);
  }
  var resgateTotal = resgate.length;
  resgate = resgate.slice().sort(hjPorValor).slice(0, 5);

  var itens = [], usados = {};
  function empurrar(arr, balde, teto, motivoFn){
    var postos = 0;
    for(var j = 0; j < arr.length; j++){
      if(itens.length >= 8 || postos >= teto) return;   // teto do balde e teto duro de 8
      var x = arr[j];
      if(usados[x.id]) continue;
      usados[x.id] = true;
      postos++;
      itens.push({ n:x, motivo:(motivoFn ? motivoFn(x) : porQue(x)), balde:balde, tarefa:null });
    }
  }

  // 1. Proximo passo vencido (ate 14 dias), teto 3
  var b1 = candidatos.filter(function(x){ return x.proxData && diasVencido(x.proxData) >= 1; });
  empurrar(hjTresComVaga(b1), 1, 3);

  // 2. Hoje e amanha, teto 4. Hora marcada primeiro, depois valor: reuniao
  // das 9h de hoje tem que vir antes da das 16h de amanha, e as duas antes
  // de qualquer ligacao sem hora, por maior que seja o negocio.
  var b2 = candidatos.filter(function(x){
    if(!x.proxData) return false;
    var d = diasVencido(x.proxData);
    return d === 0 || d === -1;
  }).sort(function(a, b){
    var ha = a.proxHora ? 0 : 1, hb = b.proxHora ? 0 : 1;
    if(ha !== hb) return ha - hb;
    if(ha === 0){
      var ka = String(a.proxData) + String(a.proxHora), kb = String(b.proxData) + String(b.proxHora);
      return ka.localeCompare(kb);
    }
    return hjPorValor(a, b);
  });
  empurrar(b2, 2, 4);

  // 3. Tarefa vencida ou de hoje, teto 3, por data (a mais velha primeiro)
  var tarefas = lista("tarefas").filter(function(t){
    return t.feita !== true && t.data && t.data <= hoje;
  }).sort(hjPorData("data"));
  var tarefasTotal = tarefas.length;
  for(i = 0; i < tarefas.length && itens.length < 8; i++){
    if(i >= 3) break;
    var t = tarefas[i];
    itens.push({
      n: t.negocioId ? achar("negocios", t.negocioId) : null,
      motivo: hjMotivoTarefa(t), balde:3, tarefa:t
    });
  }

  // 4. Esfriando: passou do teto do estagio ou do teto de toque, teto 2.
  // Só entra quem TEM plano marcado pra frente: quem nao tem cai no balde 5,
  // que explica melhor o que fazer ("sem próximo passo marcado").
  var b4 = candidatos.filter(function(x){
    if(!x.proxData || diasVencido(x.proxData) >= 0) return false;
    var f = FUNIL[x.tipo] || [], ix = idxEstagio(x), e = f[ix] || { teto:30 };
    return diasVencido(x.estagioDesde) > e.teto || diasVencido(x.ultimoToqueEm) > hjLimToque(x);
  }).sort(hjPorValor);
  empurrar(b4, 4, 2, hjMotivoEsfriando);

  // 5. Sem proximo passo, criado ha mais de 2 dias, teto 2, mais recente
  // primeiro. Os 2 dias de folga existem pra nao cobrar plano de um negocio
  // cadastrado hoje de manha no corredor.
  // Sem criadoEm (importacao, cadastro de outra versao) diasVencido devolve 0
  // e o negocio ficava invisivel pra sempre: nao tem plano e ninguem cobra.
  var b5 = candidatos.filter(function(x){
    return !x.proxData && (!x.criadoEm || diasVencido(x.criadoEm) > 2);
  }).sort(hjPorNovo);
  empurrar(b5, 5, 2, hjMotivoSemPlano);

  var naFila = 0;
  for(i = 0; i < itens.length; i++) if(itens[i].n && !itens[i].tarefa) naFila++;
  var fora = abertos.length - naFila - resgateTotal;
  if(fora < 0) fora = 0;

  return {
    itens: itens,
    total: itens.length,           // é o numero gigante e o contador da aba
    vencidos: vencidos,            // conta honesta, inclui os que foram pro resgate
    semData: semData,
    resgate: resgate,
    resgateTotal: resgateTotal,
    fora: fora,
    abertos: abertos.length,
    tarefasTotal: tarefasTotal
  };
}

/* ---------------------------------------------------------------------
   PECAS DA TELA
   --------------------------------------------------------------------- */

function hjMotivoTarefa(t){
  var d = diasVencido(t.data);
  if(d > 0) return "venceu há " + d + (d === 1 ? " dia" : " dias");
  if(d === 0) return "pra hoje";
  return "em " + Math.abs(d) + (Math.abs(d) === 1 ? " dia" : " dias");
}
function hjRotTarefa(k){
  for(var i = 0; i < TIPOS_TAREFA.length; i++) if(TIPOS_TAREFA[i].k === k) return TIPOS_TAREFA[i].rot;
  return "Tarefa";
}
// Cor do semaforo, do CONTRATO: verde, amarelo, vermelho, azul, cinza.
function hjCor(t){
  if(t === "verde") return "var(--green)";
  if(t === "amarelo") return "var(--warn)";
  if(t === "vermelho") return "var(--red)";
  if(t === "congelado") return "var(--blue)";
  return "var(--text3)";
}
function hjIcone(it){
  if(it.tarefa) return "☐";
  if(it.balde === 1) return "🔥";
  if(it.balde === 2) return "⏰";
  if(it.balde === 4) return "💤";
  return "⚠";
}
// Unidade sempre explicita: agencia é R$ por mes, patrocinio é R$ cheio.
// Os dois nunca viram o mesmo numero.
function hjValor(n){
  if(!n) return "";
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mês" : "valor a definir";
  }
  var v = valorRefDe(n);
  return v > 0 ? brl(v) : "valor a definir";
}
function hjUltimoToque(n){
  if(!n.ultimoToqueEm) return "sem toque registrado ainda";
  var q = quando(n.ultimoToqueEm);
  // "último toque 10 set (hoje)" é redundante. Perto, só a palavra; longe,
  // a data, porque "há 23 dias" sozinho nao diz em que semana foi.
  var base = "último toque " + ((q === "hoje" || q === "ontem") ? q : dataCurta(n.ultimoToqueEm) + ", " + q);
  return n.ultimoToqueTxt ? base + ": " + n.ultimoToqueTxt : base;
}
function hjEmpresa(n){ return n.empresa || n.titulo || "Sem nome"; }

/* O nome da empresa É o botao de abrir o negocio. Assim a linha fica com os
   dois botoes que o SPEC pede (zap e feito) e nao um terceiro que estoura a
   largura num celular de 320px.
   O min-height de 44px existe porque este é o alvo principal da tela no
   celular: só a altura do texto daria 21px, que é menor que a ponta do dedo
   e faz errar pro negocio de cima. */
function hjTituloAbre(n){
  return '<button class="h2 truncate" data-a="hjAbrir" data-id="' + esc(n.id) + '" ' +
    'style="flex:1;min-width:120px;text-align:left;padding:0;min-height:44px">' + esc(hjEmpresa(n)) + '</button>';
}

// O painel é quem sabe somar o mes. Se aquele modulo ainda nao existe, a
// tela nao pode quebrar por causa de um numero de apoio.
function hjNumerosDoMes(){
  try{
    if(typeof numerosDoMes !== "function") return null;
    var m = numerosDoMes(mesAtual());
    return (m && typeof m === "object") ? m : null;
  }catch(e){ return null; }
}
function hjRank(){
  try{
    if(typeof rankIndicadores !== "function") return [];
    var r = rankIndicadores();
    return (r && r.length) ? r : [];
  }catch(e){ return []; }
}
// Ultimo dia do mes: dia 0 do mes seguinte. Serve pra escrever a data
// absoluta na tela ("Fecha até 30/09/2026"), nunca "até o fim do mês".
function hjFimDoMes(ym){
  var p = String(ym || mesAtual()).split("-");
  var d = new Date(Number(p[0]), Number(p[1]), 0);
  return p[0] + "-" + p[1] + "-" + pad2(d.getDate());
}

/* Botao de WhatsApp de uma linha. Fica VISIVEL e desabilitado quando nao da
   pra usar, com o motivo embaixo: botao que some faz a pessoa achar que o
   CRM quebrou. */
function hjBotaoZap(acao, id, temTel){
  if(temTel) return '<button class="btn acao-fila" data-a="' + acao + '" data-id="' + esc(id) + '">💬 Zap</button>';
  return '<button class="btn acao-fila" disabled>💬 Zap</button>';
}

function hjLinhaNegocio(it){
  var n = it.n;
  var cor = hjCor(temperatura(n));
  var temTel = !!(n.contatoTel && soDigito(n.contatoTel).length >= 10);
  return `
  <div style="border-left:3px solid ${cor};padding:11px 0 13px 12px;border-bottom:1px solid var(--border)">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="font-size:17px;line-height:1.25;flex:0 0 auto">${hjIcone(it)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          ${hjTituloAbre(n)}
          <div class="num nowrap" style="font-size:17px;color:var(--lime)">${esc(hjValor(n))}</div>
        </div>
        <div class="small" style="color:${cor};margin-top:2px">${esc(it.motivo || "")}</div>
        <div class="tiny muted" style="margin-top:3px">${esc(hjUltimoToque(n))}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${hjBotaoZap("hjZap", n.id, temTel)}
      <button class="btn acao-fila" data-a="hjRegistro" data-id="${esc(n.id)}">✓ Feito</button>
    </div>
    ${temTel ? "" : '<div class="tiny" style="color:var(--text3);margin-top:5px">Zap desligado: esse negócio não tem telefone com DDD cadastrado.</div>'}
  </div>`;
}

function hjLinhaTarefa(it){
  var t = it.tarefa;
  var temTel = !!(t.contatoTel && soDigito(t.contatoTel).length >= 10);
  var bloq = motivoBloqueio("crm_tarefas");
  var vencida = diasVencido(t.data) > 0;
  return `
  <div style="padding:11px 0 13px;border-bottom:1px solid var(--border)">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="font-size:16px;line-height:1.3;flex:0 0 auto">☐</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${esc(t.texto || hjRotTarefa(t.tipo))}</div>
        <div class="tiny" style="color:${vencida ? "var(--red)" : "var(--warn)"};margin-top:2px">
          ${esc(hjRotTarefa(t.tipo))}, ${esc(hjMotivoTarefa(t))}
        </div>
        ${t.negocioTitulo ? '<div class="tiny muted" style="margin-top:2px">' + esc(t.negocioTitulo) + '</div>' : ""}
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${hjBotaoZap("hjZapTarefa", t.id, temTel)}
      ${bloq
        ? '<button class="btn acao-fila" disabled>✓ Feita</button>'
        : '<button class="btn acao-fila" data-a="hjTarefaFeita" data-id="' + esc(t.id) + '">✓ Feita</button>'}
    </div>
    ${bloq ? '<div class="tiny" style="color:var(--text3);margin-top:5px">' + esc(bloq) + '</div>' : ""}
    ${temTel ? "" : '<div class="tiny" style="color:var(--text3);margin-top:5px">Zap desligado: essa tarefa não tem telefone com DDD.</div>'}
  </div>`;
}

/* FILA VAZIA É VITORIA, e a tela trata como vitoria. Nao é tela vazia
   triste com um icone cinza: e o dia em que o funil esta em dia, em --lime,
   com as duas coisas que valem o tempo que sobrou. As duas saem do cache,
   sem nenhuma leitura. */
function hjVitoria(f){
  var hoje = hojeISO();
  var abertos = lista("negocios").filter(function(n){
    return n.status === "aberto" && !(n.congeladoAte && n.congeladoAte > hoje);
  });

  // 1) o negocio mais esquecido, medido em dias sem contato
  var parado = null, maior = -1, semToque = 0;
  for(var i = 0; i < abertos.length; i++){
    if(!abertos[i].ultimoToqueEm) semToque++;
    var d = diasVencido(abertos[i].ultimoToqueEm || abertos[i].criadoEm);
    if(d > maior){ maior = d; parado = abertos[i]; }
  }

  // 2) um indicador frio: 2 ganhos ou mais e mais de 120 dias sem indicar.
  // E a acao de maior retorno de uma agencia que vive de indicacao.
  var frio = null;
  var rank = hjRank();
  for(var j = 0; j < rank.length; j++){
    if((rank[j].ganhos || 0) >= 2 && rank[j].ultimaEm && diasVencido(rank[j].ultimaEm) > 120){ frio = rank[j]; break; }
  }

  // A frase muda quando sobrou tarefa: dizer "nada pra hoje" com duas tarefas
  // vencidas logo embaixo faz a tela mentir na primeira semana de uso.
  var sub = (f && f.tarefasTotal > 0)
    ? "Nenhum negócio atrasado ou vencendo hoje. Fecha as tarefas aqui embaixo e o dia acabou."
    : "Nada atrasado, nada vencendo hoje. Duas coisas que valem seu tempo agora.";

  var h = '<div class="card card-lime">' +
    '<div class="sec-title" style="border-left-color:var(--lime)">Fila limpa</div>' +
    '<div class="sec-sub">' + sub + '</div>' +
    '<div style="margin-top:14px;display:flex;flex-direction:column;gap:12px">';

  // Exige pelo menos 1 dia: com tudo tocado hoje a tela escrevia "O mais
  // esquecido, 0 dias sem contato", que é uma cobranca inventada em cima de
  // um dia em que o vendedor fez tudo certo.
  if(parado && maior >= 1){
    var temTel = !!(parado.contatoTel && soDigito(parado.contatoTel).length >= 10);
    h += '<div style="border-left:3px solid var(--lime);padding-left:12px">' +
      '<div class="h3" style="color:var(--lime)">O mais esquecido</div>' +
      '<div style="display:flex;margin-top:3px">' + hjTituloAbre(parado) + '</div>' +
      '<div class="small muted2">' + maior + (maior === 1 ? " dia" : " dias") + ' sem contato, ' + esc(hjValor(parado)) + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:9px">' +
        hjBotaoZap("hjZap", parado.id, temTel) +
        '<button class="btn acao-fila" data-a="hjRegistro" data-id="' + esc(parado.id) + '">✓ Feito</button>' +
      '</div></div>';
  } else {
    /* Nunca afirmar toque que nao existe. No primeiro dia de uso o vendedor
       cadastra a carteira inteira sem nenhum toque registrado, e a tela dizia
       "foram tocados hoje. Nenhum esta esquecido." em cima de negocio que
       ninguem chamou ainda. Quem nao tem toque no registro é contado a parte. */
    var fraseEsq;
    if(!abertos.length) fraseEsq = "Nenhum negócio aberto agora.";
    else if(semToque === abertos.length)
      fraseEsq = (abertos.length === 1 ? "O negócio aberto ainda não tem" : "Os " + abertos.length + " negócios abertos ainda não têm") +
                 " nenhum toque registrado. Assim que você registrar o primeiro, a conta de dias começa aqui.";
    else
      fraseEsq = (abertos.length === 1 ? "O negócio aberto foi tocado" : "Os " + abertos.length + " negócios abertos foram tocados") +
                 " hoje. Nenhum está esquecido." +
                 (semToque ? " " + semToque + (semToque === 1 ? " ainda está" : " ainda estão") + " sem toque registrado." : "");
    h += '<div style="border-left:3px solid var(--border2);padding-left:12px">' +
      '<div class="h3">O mais esquecido</div>' +
      '<div class="small muted">' + fraseEsq + '</div></div>';
  }

  if(frio){
    h += '<div style="border-left:3px solid var(--lime);padding-left:12px">' +
      '<div class="h3" style="color:var(--lime)">Indicador esfriando</div>' +
      '<div class="h2 truncate" style="margin-top:3px">' + esc(frio.nome || "") + '</div>' +
      '<div class="small muted2">' + (frio.ganhos || 0) + ' negócios ganhos por indicação dele, ' +
        diasVencido(frio.ultimaEm) + ' dias sem indicar</div>' +
      '<div style="display:flex;gap:8px;margin-top:9px">' +
        '<button class="btn acao-fila" data-a="hjPedirIndicacao" data-id="' + esc(frio.id || "") + '">💬 Pedir indicação</button>' +
      '</div></div>';
  } else {
    h += '<div style="border-left:3px solid var(--border2);padding-left:12px">' +
      '<div class="h3">Indicador esfriando</div>' +
      '<div class="small muted">Nenhum indicador com 2 ganhos ou mais passou de 120 dias sem indicar. ' +
      'Quando algum passar, ele aparece aqui com o botão de mensagem pronto.</div></div>';
  }

  h += '</div>';
  /* Os 2 dias de folga do balde 5 escondem, no primeiro dia de uso, a carteira
     inteira cadastrada de manha sem proximo passo. A fila fica em 0, o que é
     certo, mas a tela precisa dizer que esses negocios existem. */
  if(f && f.semData > 0){
    h += '<div class="tiny muted" style="margin-top:12px">' +
      f.semData + (f.semData === 1 ? " negócio aberto está" : " negócios abertos estão") +
      ' sem próximo passo marcado. Cadastrado há 2 dias ou menos ainda não é cobrado aqui.' +
      ' <button class="btn btn-sm btn-ghost" data-a="ir" data-r="negocios">Ver os negócios</button></div>';
  }
  h += '</div>';
  return h;
}

function hjBlocoIndicadores(){
  var rank = hjRank();
  if(!rank.length) return "";
  var h = '<div class="card">' +
    '<div class="card-head">' +
      '<div class="sec-title">Quem te trouxe negócio' + ajuda("indicacao") + '</div>' +
      '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="pessoas">Ver ranking</button>' +
    '</div>';
  for(var i = 0; i < rank.length && i < 3; i++){
    var r = rank[i];
    h += '<div style="display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border)">' +
      '<div class="num" style="font-size:15px;color:var(--text3);flex:0 0 20px">' + (i + 1) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="cel-nome truncate">' + esc(r.nome || "") + '</div>' +
        '<div class="cel-sub">' + (r.n || 0) + (r.n === 1 ? " indicação" : " indicações") +
          ', ' + (r.ganhos || 0) + (r.ganhos === 1 ? " virou cliente" : " viraram cliente") + '</div>' +
      '</div>' +
      '<div class="num nowrap" style="font-size:16px;color:var(--lime)">' + brlCurto(r.gerado || 0) + '</div>' +
    '</div>';
  }
  h += '<div class="tiny muted" style="margin-top:9px">Valor gerado em negócios ganhos. ' +
       'MRR de agência e cota de patrocínio aparecem separados na aba Pessoas.</div></div>';
  return h;
}

TELAS.hoje = function(){
  var f = filaDeHoje();
  var m = hjNumerosDoMes();
  var fimMes = hjFimDoMes(mesAtual());

  // "Fecha até <data>" soma o que está em alta chance. Valor total de
  // contrato somado com cota de patrocinio: serve pra dimensionar esforco
  // comercial e a nota embaixo diz isso, porque nao é caixa do mes.
  var somaAlta = 0, qtdAlta = 0;
  if(m && m.altaChance && m.altaChance.length){
    qtdAlta = m.altaChance.length;
    for(var i = 0; i < m.altaChance.length; i++) somaAlta += valorRefDe(m.altaChance[i]);
  }

  var h = '';

  /* Cabecalho: o numero gigante é a promessa da tela. Se der 8, deu 8 e
     acabou, e isso é proposital. */
  h += '<div class="card">' +
    '<div class="card-head" style="margin-bottom:6px">' +
      '<div>' +
        '<div class="h3">Fila de hoje' + ajuda("fila_hoje") +
          (hjSoMeus() ? '' : ' <span class="tag tag-blue" style="vertical-align:middle">do time</span>') + '</div>' +
        '<div class="num" style="font-size:clamp(48px,14vw,68px);color:' +
          (f.total ? "var(--lime)" : "var(--green)") + '">' + f.total + '</div>' +
        '<div class="tiny muted">' +
          (f.total ? (f.total === 1 ? "1 coisa pra resolver hoje" : f.total + " coisas pra resolver hoje")
                   : "nada atrasado e nada vencendo hoje") +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="kpi-l">Fecha até ' + dataBR(fimMes) + ajuda("fecha_ate") + '</div>' +
        (m
          ? '<div class="num" style="font-size:26px">' + brl(somaAlta) + '</div>' +
            '<div class="tiny muted">' + qtdAlta + (qtdAlta === 1 ? " negócio" : " negócios") + ' em alta chance</div>'
          : '<div class="num muted" style="font-size:26px">sem número</div>' +
            '<div class="tiny muted">o Painel ainda não respondeu</div>') +
      '</div>' +
    '</div>' +
    (m ? '<div class="tiny muted">Soma valor total de contrato com cota de patrocínio. ' +
         'Serve pra dimensionar o esforço comercial, não é caixa do mês.</div>' : '') +
    '<div style="display:flex;gap:8px;margin-top:13px;flex-wrap:wrap">' +
      '<button class="btn btn-sm" data-a="resumoDia">Copiar o resumo do dia</button>' +
      '<button class="btn btn-sm btn-ghost" data-a="hjTrocarFila">' +
        (hjSoMeus() ? "Ver a fila do time" : "Ver só a minha fila") + '</button>' +
      (f.resgate.length
        ? '<button class="btn btn-sm" data-a="hjResgate">Resgate de sexta (' + f.resgateTotal +
          (f.resgateTotal === 1 ? ' negócio' : ' negócios') + ')</button>'
        : '') +
    '</div>' +
  '</div>';

  /* A fila. Tarefa tem bloco proprio embaixo, mas conta no numero de cima:
     uma tarefa de avisar quem indicou vale tanto quanto um negocio. */
  var negocios = f.itens.filter(function(it){ return !it.tarefa && it.n; });
  var tarefas = f.itens.filter(function(it){ return !!it.tarefa; });

  if(negocios.length){
    h += '<div class="card" style="padding-top:8px;padding-bottom:4px">';
    for(var j = 0; j < negocios.length; j++) h += hjLinhaNegocio(negocios[j]);

    if(f.fora > 0){
      var partes = [];
      partes.push(f.abertos + (f.abertos === 1 ? " negócio aberto" : " negócios abertos") + " no total");
      if(f.semData > 0) partes.push(f.semData + " sem próximo passo marcado");
      if(f.resgateTotal > 0) partes.push(f.resgateTotal + " no resgate, com mais de 14 dias de atraso");
      h += '<div style="padding:13px 0 12px">' +
        '<button class="btn btn-block btn-ghost" data-a="ir" data-r="negocios">Ver os outros ' +
          f.fora + (f.fora === 1 ? ' negócio' : ' negócios') + '</button>' +
        '<div class="tiny muted center" style="margin-top:7px">' + esc(partes.join(", ")) + '</div>' +
      '</div>';
    }
    h += '</div>';
  } else if(f.abertos === 0 && !tarefas.length){
    // Vazio de verdade, primeiro dia de uso. Texto proprio: repetir o texto
    // de "fila limpa" aqui faria a pessoa achar que perdeu os dados.
    var bloqNovo = motivoBloqueio("crm_negocios");
    h += '<div class="empty"><div class="ei">◎</div>' +
      '<div class="et">Nenhum negócio aberto ainda</div>' +
      '<div class="ex">Cadastre os negócios que estão de pé agora. Cliente antigo e negócio perdido entram quando forem tocados, não existe backlog de digitação.</div>' +
      (bloqNovo
        ? '<button class="btn btn-primary" disabled>Cadastrar negócio</button>' +
          '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloqNovo) + '</div>'
        : '<button class="btn btn-primary" data-a="novo">Cadastrar negócio</button>') +
    '</div>';
  } else {
    h += hjVitoria(f);
  }

  /* TAREFAS: o que nao é negocio e, sem casa propria, nunca aparece. */
  if(tarefas.length){
    h += '<div class="card" style="padding-bottom:4px">' +
      '<div class="card-head" style="margin-bottom:4px">' +
        '<div class="sec-title">Tarefas' + ajuda("proximo_passo") + '</div>' +
        '<span class="tag tag-warn">' + f.tarefasTotal + ' pra hoje ou vencidas</span>' +
      '</div>';
    for(var k = 0; k < tarefas.length; k++) h += hjLinhaTarefa(tarefas[k]);
    if(f.tarefasTotal > tarefas.length){
      h += '<div class="tiny muted center" style="padding:12px 0">' +
        'Mais ' + (f.tarefasTotal - tarefas.length) + ' com data pra hoje ou vencida. ' +
        'A fila mostra 3 por dia pra caber no dia.</div>';
    }
    h += '</div>';
  }

  h += hjBlocoIndicadores();

  // A barra da volta do WhatsApp vive fora do #conteudo, entao é pintada
  // depois que a tela existe.
  DEPOIS.push(function(){ perguntarDoRetorno(); });

  return h;
};

/* ---------------------------------------------------------------------
   ACOES DA TELA
   Nome prefixado com hj pra nao brigar com acao de outro modulo: ACOES é
   um mapa global e quem registrar por ultimo ganha, calado.
   --------------------------------------------------------------------- */

// Abre a conversa. Quem monta a folha de mensagem é o modulo de cadastro;
// o caminho cru (sem modelo) existe como reserva e nunca é bloqueado,
// porque um modelo que pede um campo que nao existe nao pode travar
// justamente o negocio de maior ticket.
function hjAbrirConversa(ctx){
  try{
    if(typeof abrirMensagem === "function"){ abrirMensagem(ctx); return; }
  }catch(e){ /* cai no caminho cru */ }
  var url = linkWhats(ctx.tel, "");
  if(!url){ toast("Sem telefone com DDD nesse cadastro", "bad"); return; }
  // O pendente é gravado no localStorage, nao em memoria: no celular o
  // webview é descarregado enquanto o WhatsApp está aberto e a memoria vai
  // junto. Sem isso a pergunta da volta nunca aparece.
  if(ctx.negocioId){
    guardar("pendente", { negocioId:ctx.negocioId, contatoId:ctx.contatoId || "",
                          nome:ctx.nome || "", quando:Date.now() });
  }
  var a = document.createElement('a');
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 500);
}

ACOES.hjZap = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  fecharFolha();
  hjAbrirConversa({ tel:n.contatoTel, nome:n.contatoNome || n.empresa,
                    negocioId:n.id, contatoId:n.contatoId || "" });
};

ACOES.hjZapTarefa = function(el){
  var t = achar("tarefas", el.getAttribute('data-id'));
  if(!t) return;
  // O modelo certo pra cada tarefa: agradecer quem indicou, pedir indicacao
  // ou reativar. Se o modulo de mensagem nao existir, abre a conversa crua.
  var modelo = t.tipo === "avisar_indicador" ? "m6"
             : t.tipo === "pedir_indicacao"  ? "m5"
             : t.tipo === "retomar"          ? "m4" : "";
  fecharFolha();
  hjAbrirConversa({ tel:t.contatoTel, nome:t.contatoNome, negocioId:t.negocioId || "",
                    contatoId:t.contatoId || "", modelo:modelo });
};

ACOES.hjPedirIndicacao = function(el){
  var id = el.getAttribute('data-id');
  var c = id ? achar("contatos", id) : null;
  if(!c){ ir("pessoas"); return; }
  hjAbrirConversa({ tel:c.tel, nome:c.nome, contatoId:c.id, negocioId:"", modelo:"m5" });
};

   nome no mesmo escopo, e a ultima concatenada ganhava calada.
   Um dono só pro laco inteiro: quem abre a conversa e quem pergunta na
   volta sao a mesma funcao.

/* ---------------------------------------------------------------------
   RESUMO COLAVEL DO DIA
   O bloco que o vendedor cola no grupo do WhatsApp às 18h.
   --------------------------------------------------------------------- */
function hjDescricaoValor(n){
  if(n.tipo === "agencia"){
    var mrr = mrrDe(n);
    var meses = (n.ag && n.ag.meses) || 0;
    return "agência, " + brl(mrr) + "/mês" + (meses ? " por " + meses + " meses" : " por prazo indeterminado");
  }
  var ed = edicaoDe(n.pt && n.pt.edicao);
  var cota = (n.pt && n.pt.cota) ? n.pt.cota : "cota";
  return "cota " + cota + (ed ? " " + ed.rot : "") + ", " + brl(valorRefDe(n));
}

function hjResumoTexto(){
  var hoje = hojeISO();
  var L = [];
  L.push("*LIME | Comercial, " + dataBR(hoje) + "*");
  L.push("");

  var m = hjNumerosDoMes();
  if(m){
    /* A meta cadastrada é de MRR NOVO, em R$ por mes. Comparar com o fechado,
       que soma valor total de contrato com cota de patrocinio, dava "1008%
       atingido" numa base com R$ 4.200/mes de MRR novo contra meta de
       R$ 5.000/mes. Cada numero aqui sai com a unidade dele, e fee de agencia
       nunca vira o mesmo numero que cota de patrocinio. */
    var pT = m.porTipo || {}, pAg = pT.agencia || {}, pPt = pT.patrocinio || {};
    var nFech = (pAg.nFechado || 0) + (pPt.nFechado || 0);
    L.push("Fechado no mês: " + nFech + (nFech === 1 ? " negócio" : " negócios"));
    L.push("Agência: " + brl(pAg.fechado || 0) + " em contrato, " + brl(m.novoMrr || 0) + "/mês de MRR novo");
    L.push("Patrocínio: " + brl(pPt.fechado || 0) + " em cota");
    if(m.temMeta){
      // Nunca NaN%: sem meta cadastrada a linha diz que nao tem meta.
      L.push("Meta de MRR novo: " + brl(m.meta) + "/mês (" + m.pctMeta + "% atingido" +
             (m.faltam > 0 ? ", faltam " + brl(m.faltam) + "/mês" : ", meta batida") + ")");
    } else {
      L.push("Meta de MRR novo: não definida");
    }
    var alta = (m.altaChance || []).slice();
    var somaAlta = 0, i;
    for(i = 0; i < alta.length; i++) somaAlta += valorRefDe(alta[i]);
    L.push("Alta chance: " + brl(somaAlta) + " em " + alta.length + (alta.length === 1 ? " negócio" : " negócios"));

    var liq = m.mrrLiquido || 0;
    L.push("Base recorrente ativa: " + brl(m.carteira || 0) + "/mês (variação no mês: " +
           (liq >= 0 ? "+" : "-") + brl(Math.abs(liq)) + "/mês)");
    L.push("");

    if(alta.length){
      alta.sort(hjPorData("prevFechamento"));
      L.push("*Vai fechar*");
      for(i = 0; i < alta.length && i < 5; i++){
        L.push((i + 1) + ". " + (alta[i].empresa || alta[i].titulo || "") + ", " +
               hjDescricaoValor(alta[i]) + ", previsto " + dataBR(alta[i].prevFechamento));
      }
      if(alta.length > 5) L.push("e mais " + (alta.length - 5) + " em alta chance");
      L.push("");
    }
  }

  // Travado: isto a tela Hoje sabe sozinha, sem depender de outro modulo.
  var abertos = lista("negocios").filter(function(n){
    return n.status === "aberto" && !(n.congeladoAte && n.congeladoAte > hoje);
  });
  var semContato = abertos.filter(function(n){ return diasVencido(n.ultimoToqueEm) > 7; });
  var vencidos = abertos.filter(function(n){ return n.proxData && diasVencido(n.proxData) >= 1; })
                        .sort(function(a, b){ return diasVencido(b.proxData) - diasVencido(a.proxData); });

  L.push("*Travado*");
  if(semContato.length){
    var soma = 0, semValor = 0, j;
    for(j = 0; j < semContato.length; j++){
      var v = valorRefDe(semContato[j]);
      if(v > 0) soma += v; else semValor++;
    }
    L.push(semContato.length + (semContato.length === 1 ? " negócio" : " negócios") +
           " sem contato há mais de 7 dias, " + brl(soma) + " no total" +
           (semValor ? " (" + semValor + " ainda sem valor definido)" : ""));
  }
  if(vencidos.length){
    var v0 = vencidos[0];
    var d0 = diasVencido(v0.proxData);
    L.push(vencidos.length + (vencidos.length === 1 ? " negócio" : " negócios") +
           " com data vencida: " + (v0.empresa || v0.titulo || "") + ", venceu há " +
           d0 + (d0 === 1 ? " dia" : " dias") + (vencidos.length > 1 ? " (o mais antigo)" : ""));
  }
  if(!semContato.length && !vencidos.length){
    L.push("Nada travado. Todo negócio aberto foi tocado nos últimos 7 dias.");
  }

  var rank = hjRank();
  if(rank.length){
    var t = rank[0];
    L.push("");
    L.push("*Indicação*");
    L.push("Quem mais trouxe: " + (t.nome || "") + ", " + (t.n || 0) +
           ((t.n === 1) ? " indicação" : " indicações") + ", " + brl(t.gerado || 0) + " gerados");
  }

  return L.join("\n");
}

ACOES.resumoDia = function(){
  // A string é montada ANTES do writeText. No Safari do iPhone qualquer
  // await entre o clique e a chamada faz a permissao ser recusada em
  // silencio, e o botao parece quebrado sem dar erro nenhum.
  var txt = hjResumoTexto();
  fecharFolha();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)
      .then(function(){ toast("Resumo copiado", "ok"); })
      .catch(function(){ hjFolhaResumo(txt); });
    return;
  }
  hjFolhaResumo(txt);
};

function hjFolhaResumo(txt){
  folha("Resumo do dia",
    '<div class="form">' +
      '<textarea class="inp" id="hjResumoTxt" rows="16" readonly style="font-size:13px">' + esc(txt) + '</textarea>' +
      '<p class="tiny muted">Este navegador não deixou copiar sozinho. O texto já está selecionado: ' +
      'use copiar do teclado, ou segure o dedo em cima e escolha Copiar.</p>' +
    '</div>');
  // Selecionar precisa acontecer depois de a folha existir no DOM.
  setTimeout(function(){
    var t = document.getElementById('hjResumoTxt');
    if(t){ try{ t.focus(); t.select(); }catch(e){} }
  }, 60);
}

/* O filtro vive so na memoria desta aba, de proposito. Guardar no
   aparelho faria alguem que espiou a fila do time uma vez abrir o dia
   seguinte com ela, sem lembrar que trocou, e cobrar negocio que nao e
   dele. Recarregou, volta pro padrao do perfil. */
ACOES.hjTrocarFila = function(){
  HOJE_SO_MEUS = !hjSoMeus();
  redesenhar();
  toast(HOJE_SO_MEUS ? "Mostrando só o que é seu" : "Mostrando a fila do time todo", "ok");
};

/* ============ 07-funil ============ */
/* =====================================================================
   CRM LIME - FUNIL
   O quadro de estagios, o cartao de negocio (usado tambem pelo Hoje e
   pela lista) e a folha de trocar estagio.

   TRES DECISOES QUE MANDAM NESTA TELA
     1. UM funil por vez. Onze colunas lado a lado é ilegivel no
        computador e impossivel no celular, e um funil generico é gosma:
        "Proposta" nao significa a mesma coisa pra um fee de R$ 3.500/mes
        e pra uma cota de R$ 180.000. A faixa de totais mostra os DOIS
        funis sempre, entao nada some por causa da escolha.
     2. Ganho, perdido e encerrado NAO sao coluna. Se fossem, fechar o
        negocio apagaria em QUE estagio ele morreu, que é a unica
        informacao que explica onde o funil vaza.
     3. Mover estagio tem um caminho unico, a folha. Nao existe arrastar.
   ===================================================================== */

/* Estagio aberto no celular, por funil. Fica no aparelho porque quem
   volta do detalhe do negocio espera cair no mesmo estagio de onde saiu,
   e redesenhar() reconstroi a tela inteira toda vez. */
var FN_ESTAGIO = recuperar("funilEstagio", {});

/* ---------------------------------------------------------------------
   PECINHAS DE TEXTO E COR
   Prefixo fn_ nos ajudantes privados pra nao brigar com nome de outro
   modulo: só cardNegocio, abrirFolhaEstagio e TELAS.funil sao publicos.
   --------------------------------------------------------------------- */
function fnPlural(n, sing, plur){ return n + " " + (Math.abs(n) === 1 ? sing : plur); }

/* Indice do estagio DENTRO do funil do negocio, ou -1 quando a chave nao
   pertence a esse funil. idxEstagio() devolve 0 nesse caso, que serve pra
   ordenar mas nao serve pra decidir se o dado está torto. */
function fnIdxNoFunil(n){
  var f = FUNIL[(n && n.tipo)] || [];
  for(var i=0;i<f.length;i++) if(f[i].k === (n && n.estagio)) return i;
  return -1;
}

function fnFunilAtual(){
  var k = ROTA.id;
  if(k !== "agencia" && k !== "patrocinio") k = recuperar("funilAberto", "agencia");
  return FUNIL[k] ? k : "agencia";
}
function fnCor(t){
  return t === "vermelho" ? "var(--red)"
       : t === "amarelo"  ? "var(--warn)"
       : t === "verde"    ? "var(--green)"
       : t === "congelado"? "var(--blue)" : "var(--text3)";
}
function fnTagCls(t){
  return t === "vermelho" ? "tag-red"
       : t === "amarelo"  ? "tag-warn"
       : t === "verde"    ? "tag-green"
       : t === "congelado"? "tag-blue" : "";
}

/* Selo de temperatura do cartao. A ordem dos testes é a MESMA de
   temperatura() no nucleo, senao o selo diz "em 5 dias" com a borda
   vermelha e o vendedor para de acreditar na cor.
   O texto é curto de proposito: .tag nao quebra linha e o cartao do
   quadro tem 268px. A frase inteira com o limite fica em porQue(). */
function fnSelo(n){
  var t = temperatura(n), cls = fnTagCls(t), cor = fnCor(t);
  if(t === "fechado"){
    var d = n.fechadoEm || n.encerradoEm || "";
    var r = n.status === "ganho" ? "ganho" : n.status === "perdido" ? "perdido" : "encerrado";
    return { cls:"", ic:"●", txt:r + (d ? " em " + dataCurta(d) : ""), cor:cor, t:t };
  }
  if(t === "congelado"){
    return { cls:cls, ic:"❄", txt:"volta em " + fnPlural(diasEntre(hojeISO(), n.congeladoAte), "dia", "dias"),
             cor:cor, t:t };
  }
  var f = FUNIL[n.tipo] || [], i = idxEstagio(n), e = f[i] || { teto:30, rot:"" };
  var venc   = diasVencido(n.proxData);
  var parado = diasVencido(n.estagioDesde || n.criadoEm);
  var silen  = diasVencido(n.ultimoToqueEm);
  var tq = TOQUE[n.tipo] || { normal:5, ultimo:3 };   // tipo torto nao derruba a tela inteira
  var limToque = (i === f.length-1) ? tq.ultimo : tq.normal;
  if(!n.proxData)           return { cls:cls, ic:"⚠", txt:fnPlural(parado,"dia","dias") + " parado", cor:cor, t:t };
  if(venc >= 1)             return { cls:cls, ic:"🔥", txt:"venceu há " + fnPlural(venc,"dia","dias"), cor:cor, t:t };
  if(parado > e.teto * 1.5) return { cls:cls, ic:"💤", txt:fnPlural(parado,"dia","dias") + " no estágio", cor:cor, t:t };
  if(venc === 0)            return { cls:cls, ic:"⏰", txt:"hoje" + (n.proxHora ? ", " + n.proxHora : ""), cor:cor, t:t };
  if(venc === -1)           return { cls:cls, ic:"⏰", txt:"amanhã", cor:cor, t:t };
  if(parado > e.teto)       return { cls:cls, ic:"💤", txt:fnPlural(parado,"dia","dias") + " no estágio", cor:cor, t:t };
  if(silen > limToque)      return { cls:cls, ic:"💤", txt:fnPlural(silen,"dia","dias") + " sem contato", cor:cor, t:t };
  return { cls:cls, ic:"✓", txt:"em " + fnPlural(Math.abs(venc),"dia","dias"), cor:cor, t:t };
}

/* Valor heroi. Agencia mostra o que entra POR MES, patrocinio mostra a
   cota inteira. Sao grandezas diferentes e nunca viram o mesmo numero. */
function fnValorHeroi(n){
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mês" : "";
  }
  var v = (n.pt && n.pt.valor) || 0;
  return v > 0 ? brl(v) : "";
}
/* Linha de apoio: o contrato inteiro na agencia, a edicao no patrocinio. */
function fnApoio(n){
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    if(m <= 0) return "";
    var meses = (n.ag && n.ag.meses) || 0;
    return meses > 0
      ? brl(valorRefDe(n)) + " em " + fnPlural(meses, "mês", "meses")
      : brl(valorRefDe(n)) + " em 12 meses (contrato indeterminado)";
  }
  var ed = edicaoDe(n.pt && n.pt.edicao);
  var cota = (n.pt && n.pt.cota) ? ", cota " + n.pt.cota : "";
  return (ed ? ed.rot.toUpperCase() : "edição não definida") + cota;
}
function fnLinhaProx(n){
  if(n.status !== "aberto") return '<span class="muted">negócio fechado</span>';
  if(!n.proxData) return '<span style="color:var(--warn)">⚠ sem próximo passo</span>';
  var t = proxTipoDe(n.proxTipo);
  return '<span class="truncate">' + esc((t ? t.ic + " " + t.rot : "Próximo passo")) +
         ', ' + esc(dataCurta(n.proxData)) + (n.proxHora ? " " + esc(n.proxHora) : "") + '</span>';
}
// "via Carla": so o primeiro nome porque o cartao tem 268px e o vendedor
// reconhece quem indicou pelo primeiro nome.
function fnChipIndicacao(n){
  if(n.origem !== "indicacao" || !n.indicadorNome) return "";
  var p = String(n.indicadorNome).trim().split(/\s+/)[0] || "";
  return '<span class="tag tag-purple">via ' + esc(p) + '</span>';
}

/* ---------------------------------------------------------------------
   O CARTAO DE NEGOCIO
   ctx = "kanban" (quadro do funil) | "lista" (tela de negocios) |
         "fila" (tela Hoje).
   No quadro o toque abre a folha de estagio, que é o caminho unico de
   mover. Na lista e na fila o toque abre o negocio, que é o que a pessoa
   quer nessas duas telas.
   --------------------------------------------------------------------- */
function cardNegocio(n, ctx){
  if(!n) return "";
  ctx = ctx || "kanban";
  var s = fnSelo(n);
  var congelado = n.congeladoAte && n.congeladoAte > hojeISO();
  var e = estagioDe(n);
  // Estagio de outro funil nao pode sumir calado. A conferencia é pela
  // lista de estagios do tipo, e nao comparando com estagioDe(n).k: o
  // nucleo devolve um estagio de mentira com a chave ORIGINAL dentro
  // quando nao reconhece, entao comparar as chaves daria sempre igual.
  var foraDoFunil = fnIdxNoFunil(n) < 0;
  var heroi = fnValorHeroi(n);
  var apoio = fnApoio(n);
  var permuta = (n.tipo === "patrocinio" && n.pt && n.pt.permuta) ? n.pt.permuta : 0;

  var abre = ctx === "kanban"
    ? 'data-a="funilMover" data-id="' + esc(n.id) + '"'
    : 'data-a="funilAbrirNegocio" data-id="' + esc(n.id) + '"';
  var dim = congelado ? "opacity:.55;" : "";

  /* ---- FILA (tela Hoje): empresa e valor na mesma linha, e o motivo
     escrito com o numero. Alerta sem motivo explicito é treinado a ser
     ignorado em uma semana. ---- */
  if(ctx === "fila"){
    return `<div class="kb-card" ${abre} style="${dim}">
      <i class="flag" style="background:${s.cor}"></i>
      <div style="display:flex;gap:10px;align-items:baseline">
        <div class="truncate" style="flex:1;min-width:0;font-family:var(--disp);font-weight:700;
             text-transform:uppercase;letter-spacing:.5px;font-size:15px">${esc(n.empresa || "sem empresa")}</div>
        <div class="nowrap" style="font-family:var(--disp);font-weight:900;font-size:16px;color:var(--lime)">
          ${heroi ? esc(heroi) : '<span class="muted" style="font-size:12px">valor a definir</span>'}</div>
      </div>
      <div style="color:${s.cor};font-size:12px;margin-top:3px">${esc(s.ic + " " + porQue(n))}</div>
      ${n.ultimoToqueEm ? '<div class="tiny muted truncate" style="margin-top:4px">último toque ' +
          esc(dataBR(n.ultimoToqueEm)) + (n.ultimoToqueTxt ? ": " + esc(n.ultimoToqueTxt) : "") + '</div>' : ''}
    </div>`;
  }

  /* ---- QUADRO e LISTA ---- */
  var topo = '<span class="tag ' + s.cls + '">' + esc(s.ic + " " + s.txt) + '</span>';
  if(ctx === "lista"){
    topo += '<span class="tag">' + esc(e.rot) + '</span>';
  }
  if(foraDoFunil){
    topo += '<span class="tag tag-red">estágio fora do funil</span>';
  }

  return `<div class="kb-card" ${abre} style="${dim}">
    <i class="flag" style="background:${s.cor}"></i>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px">
      ${topo}
      <button class="btn btn-icon" style="margin-left:auto;min-width:44px;min-height:44px"
              data-a="funilAbrirNegocio" data-id="${esc(n.id)}" aria-label="Abrir o negócio">↗</button>
    </div>
    <div class="kt truncate" style="font-family:var(--disp);font-weight:700;font-size:14.5px;
         letter-spacing:.5px;text-transform:uppercase">${esc(n.empresa || "sem empresa")}</div>
    <div class="ke truncate" style="font-size:12px;margin-bottom:7px">${esc(n.titulo || "")}</div>
    <div class="kv" style="color:${heroi ? "var(--lime)" : "var(--text3)"};font-weight:900">
      ${heroi ? esc(heroi) : "valor a definir"}</div>
    ${apoio ? '<div class="tiny muted" style="margin-top:2px">' + esc(apoio) + '</div>' : ''}
    ${permuta ? '<div class="tiny" style="color:var(--text3);margin-top:2px">mais ' + esc(brl(permuta)) +
                ' em permuta, que nunca soma com dinheiro</div>' : ''}
    ${congelado ? '<div class="tiny" style="color:var(--blue);margin-top:4px">congelado até ' +
                  esc(dataBR(n.congeladoAte)) + '</div>' : ''}
    ${fnChipIndicacao(n) ? '<div style="margin-top:7px">' + fnChipIndicacao(n) + '</div>' : ''}
    ${ctx === "lista" && n.proxTexto ? '<div class="tiny muted truncate" style="margin-top:6px">' +
        esc(n.proxTexto) + '</div>' : ''}
    <div class="kf">${fnLinhaProx(n)}</div>
  </div>`;
}

/* ---------------------------------------------------------------------
   FAIXA DE TOTAIS
   Os dois funis sempre, lado a lado, NUNCA somados num numero so:
   R$/mes de fee e R$ de cota sao grandezas diferentes, e permuta nao
   entra em nenhum dos dois.
   --------------------------------------------------------------------- */
function fnTotais(k){
  var ns = lista("negocios").filter(function(n){ return n.status === "aberto" && n.tipo === k; });
  var total = 0, mrr = 0, congelados = 0, hoje = hojeISO();
  for(var i=0;i<ns.length;i++){
    total += valorRefDe(ns[i]);
    mrr   += mrrDe(ns[i]);
    if(ns[i].congeladoAte && ns[i].congeladoAte > hoje) congelados++;
  }
  return { ns:ns, n:ns.length, total:total, mrr:mrr, congelados:congelados };
}
function fnFechadosMes(){
  var ym = mesAtual(), r = { agN:0, agMrr:0, ptN:0, ptValor:0 };
  var ns = lista("negocios");
  for(var i=0;i<ns.length;i++){
    var n = ns[i];
    if(n.status !== "ganho" || mesDe(n.fechadoEm) !== ym) continue;
    if(n.tipo === "agencia"){ r.agN++; r.agMrr += mrrDe(n); }
    else { r.ptN++; r.ptValor += (n.pt && n.pt.valor) || 0; }
  }
  return r;
}
function fnFaixaTotais(k){
  var a = fnTotais("agencia"), p = fnTotais("patrocinio"), fe = fnFechadosMes();
  // Funil com negocio mas sem nenhum valor preenchido mostra "valor a
  // definir", nunca R$ 0: "R$ 0 em 5 negócios" parece defeito de conta e
  // faz duvidar de todo o resto da tela. Com zero negocios, R$ 0 é a
  // verdade e fica.
  function bloco(kk, t, rot, sub){
    var on = k === kk;
    return `<button class="kpi${on ? " accent" : ""}" data-a="funilTrocar" data-k="${kk}"
              style="text-align:left;width:100%;${on ? "" : "opacity:.7"}">
      <div class="kpi-l">${rot}</div>
      <div class="kpi-v${on ? " lime" : ""}">${t.n && !t.total ? "valor a definir" : esc(brl(t.total))}</div>
      <div class="kpi-s">${sub}</div>
    </button>`;
  }
  return `<div class="kpis">
    ${bloco("agencia", a, "Agência em aberto (contrato inteiro)",
        esc(fnPlural(a.n, "negócio", "negócios")) + (a.mrr ? ", " + esc(brl(a.mrr)) + "/mês de MRR" : "") +
        (a.congelados ? "<br>" + a.congelados + " congelado" + (a.congelados > 1 ? "s" : "") : ""))}
    ${bloco("patrocinio", p, "Patrocínio em aberto",
        esc(fnPlural(p.n, "negócio", "negócios")) + " em cotas" +
        (p.congelados ? "<br>" + p.congelados + " congelado" + (p.congelados > 1 ? "s" : "") : ""))}
    <div class="kpi" style="opacity:.85">
      <div class="kpi-l">Fechados em ${esc(mesBR(mesAtual()))}</div>
      <div class="kpi-s" style="margin-top:2px;font-size:12.5px;color:var(--text2)">
        Agência: ${fe.agN ? esc(fnPlural(fe.agN,"negócio","negócios")) + ", " + esc(brl(fe.agMrr)) + "/mês de MRR novo" : "nenhum ainda"}<br>
        Patrocínio: ${fe.ptN ? esc(fnPlural(fe.ptN,"negócio","negócios")) + ", " + esc(brl(fe.ptValor)) : "nenhum ainda"}
      </div>
      <div class="tiny muted" style="margin-top:6px">R$/mês de fee e R$ de cota nunca viram um número só.</div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   VIRADA DE EDICAO
   O evento aconteceu e sobrou negocio aberto daquela edicao. Enquanto
   ninguem resolve, o funil de patrocinio mostra dinheiro que nao existe
   mais.
   --------------------------------------------------------------------- */
function fnEdicoesViradas(){
  var hoje = hojeISO(), r = [];
  for(var i=0;i<EDICOES.length;i++){
    var ed = EDICOES[i];
    if(ed.dataEvento >= hoje) continue;
    var abertos = lista("negocios").filter(function(n){
      return n.status === "aberto" && n.tipo === "patrocinio" && n.pt && n.pt.edicao === ed.k;
    });
    if(abertos.length) r.push({ ed:ed, abertos:abertos });
  }
  return r;
}
// Pra onde migrar: a proxima edicao da MESMA familia (moto vai pra moto),
// e só se nao houver, a proxima que existir no calendario.
function fnProximaEdicao(edAtual){
  var hoje = hojeISO(), futuras = [];
  for(var i=0;i<EDICOES.length;i++){
    if(EDICOES[i].k !== edAtual.k && EDICOES[i].dataEvento > hoje) futuras.push(EDICOES[i]);
  }
  futuras.sort(function(a,b){ return a.dataEvento < b.dataEvento ? -1 : 1; });
  for(var j=0;j<futuras.length;j++) if(futuras[j].edicao === edAtual.edicao) return futuras[j];
  return futuras[0] || null;
}
function fnFaixaVirada(){
  var v = fnEdicoesViradas(), h = "";
  for(var i=0;i<v.length;i++){
    var ed = v[i].ed, q = v[i].abertos.length;
    h += `<div class="card card-lime">
      <div class="sec-title">Virada de edição${ajuda("corte_comercial")}</div>
      <div class="muted2" style="margin-top:10px">
        O ${esc(ed.rot)} aconteceu em ${esc(dataBR(ed.dataEvento))} e ainda tem
        <b>${esc(fnPlural(q, "negócio aberto", "negócios abertos"))}</b> dessa edição no funil.
      </div>
      <div class="tiny muted" style="margin-top:6px">Enquanto não resolver, o total de patrocínio mostra dinheiro que não existe mais.</div>
      <div style="margin-top:12px"><button class="btn btn-primary" data-a="funilVirada" data-k="${esc(ed.k)}">Resolver ${q === 1 ? "o negócio" : "os " + q + " negócios"}</button></div>
    </div>`;
  }
  return h;
}

/* ---------------------------------------------------------------------
   A TELA
   --------------------------------------------------------------------- */
TELAS.funil = function(){
  var k = fnFunilAtual();
  var f = FUNIL[k] || [];
  var tipo = null;
  for(var t=0;t<TIPOS.length;t++) if(TIPOS[t].k === k) tipo = TIPOS[t];

  // Agrupa por INDICE de estagio, nao pela chave crua: negocio com
  // estagio de outro funil cairia fora de todas as colunas e sumiria da
  // tela. Aqui ele aparece na primeira coluna com o selo de aviso.
  var abertos = lista("negocios").filter(function(n){ return n.status === "aberto" && n.tipo === k; });
  var grupos = [], i;
  for(i=0;i<f.length;i++) grupos.push([]);
  for(i=0;i<abertos.length;i++){
    var idx = idxEstagio(abertos[i]);
    (grupos[idx] || grupos[0]).push(abertos[i]);
  }
  var hoje = hojeISO();
  for(i=0;i<grupos.length;i++){
    grupos[i].sort(function(a, b){
      // Congelado afunda: nao da pra trabalhar hoje. O resto desce por
      // valorOrdem (invariante 11), que da valor presumido pra quem
      // ainda nao tem numero, senao a indicacao fresca nunca aparece.
      var ca = (a.congeladoAte && a.congeladoAte > hoje) ? 1 : 0;
      var cb = (b.congeladoAte && b.congeladoAte > hoje) ? 1 : 0;
      if(ca !== cb) return ca - cb;
      return valorOrdem(b) - valorOrdem(a);
    });
  }

  var h = "";
  // Cadastrar sem permissao fica VISIVEL e desabilitado, com o motivo
  // embaixo (invariante 12). Botao que some faz o gestor abrir o funil no
  // celular, nao ver acao nenhuma e achar que o CRM quebrou.
  var bloqNovo = motivoBloqueio("crm_negocios");

  /* cabecalho com a pilula segmentada */
  h += `<div class="card-head" style="margin-bottom:0">
    <div>
      <div class="sec-title">Funil ${esc(tipo ? tipo.rot : k)}${ajuda("funil")}</div>
      <div class="sec-sub">Um funil por vez. Ganho, perdido e encerrado não são coluna, são status,
        senão fechar um negócio apagaria em que estágio ele morreu.</div>
    </div>
    <div class="pills">
      <button class="pill${k === "agencia" ? " on" : ""}" data-a="funilTrocar" data-k="agencia">Agência</button>
      <button class="pill${k === "patrocinio" ? " on" : ""}" data-a="funilTrocar" data-k="patrocinio">Patrocínio</button>
      ${bloqNovo
        ? '<span style="display:flex;flex-direction:column;gap:3px;align-items:flex-start">' +
            '<button class="btn btn-sm" disabled>+ Negócio</button>' +
            '<span class="tiny" style="color:var(--text3)">' + esc(bloqNovo) + '</span></span>'
        : '<button class="btn btn-sm" data-a="funilNovo" data-k="' + esc(k) + '">+ Negócio</button>'}
    </div>
  </div>`;

  h += fnFaixaTotais(k);
  if(k === "patrocinio") h += fnFaixaVirada();

  if(!abertos.length){
    h += `<div class="empty">
      <div class="ei">▦</div>
      <div class="et">Nenhum negócio aberto ${esc(tipo ? "de " + tipo.rot.toLowerCase() : "")}</div>
      <div class="ex">O outro funil continua com os negócios dele, e a faixa de cima mostra os dois.</div>
      ${bloqNovo
        ? '<button class="btn btn-primary" disabled>Cadastrar um negócio</button>' +
          '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloqNovo) + '</div>'
        : '<button class="btn btn-primary" data-a="funilNovo" data-k="' + esc(k) + '">Cadastrar um negócio</button>'}
    </div>`;
    return h;
  }

  /* ---- QUADRO NO COMPUTADOR ---- */
  var cols = "";
  for(i=0;i<f.length;i++){
    var e = f[i], gs = grupos[i], somaV = 0, somaM = 0;
    for(var j=0;j<gs.length;j++){ somaV += valorRefDe(gs[j]); somaM += mrrDe(gs[j]); }
    var corpo = "";
    if(!gs.length){
      corpo = '<div class="kb-empty">Ninguém aqui.<br>Sai deste estágio quando:<br>' + esc(e.saida || "") + '</div>';
    } else {
      for(var c=0;c<gs.length;c++) corpo += cardNegocio(gs[c], "kanban");
    }
    // Coluna com negocio mas sem valor mostra "a definir", nunca R$ 0:
    // R$ 0 parece defeito e faz duvidar do resto dos numeros da tela.
    cols += `<section class="kb-col">
      <div class="kb-h">
        <div class="n"><span class="dot" style="background:var(--lime)"></span>${esc(e.rot)}</div>
        <div class="v">${gs.length && !somaV ? "a definir" : esc(brlCurto(somaV))}</div>
        <div class="c">${esc(fnPlural(gs.length, "negócio", "negócios"))}${k === "agencia" && somaM ? ", " + esc(brl(somaM)) + "/mês de MRR" : ""}, ${Math.round(e.p*100)}% de chance</div>
      </div>
      <div class="kb-body">${corpo}</div>
    </section>`;
  }
  h += '<div class="tiny muted no-mob">Toque no cartão pra mover de estágio. Não existe arrastar: no celular o arraste dispara sozinho no meio da rolagem.</div>';
  h += '<div class="kb no-mob">' + cols + '</div>';

  /* ---- UM ESTAGIO POR VEZ NO CELULAR ----
     Como .only-mob vira um item do flex da area de conteudo, ele volta a
     ser bloco no celular e some no computador. */
  var sel = fnEstagioMob(k, f, grupos);
  var iSel = 0;
  for(i=0;i<f.length;i++) if(f[i].k === sel) iSel = i;
  var pills = "", lista_ = "";
  for(i=0;i<f.length;i++){
    var ee = f[i], gg = grupos[i], sv = 0;
    for(var m=0;m<gg.length;m++) sv += valorRefDe(gg[m]);
    // min-height de 44px porque essa barra É a navegacao do quadro no
    // celular: com os 30px da pilula, rolando na horizontal, o dedo erra
    // pro estagio do lado.
    pills += `<button class="pill${i === iSel ? " on" : ""}" data-a="funilEstagio" data-k="${esc(ee.k)}"
       style="flex:0 0 auto;min-height:44px">${esc(ee.rot)} <span style="opacity:.7">${
         !gg.length ? "0 negócios" : esc(fnPlural(gg.length, "negócio", "negócios")) + ", " + (sv ? esc(brlCurto(sv)) : "a definir")
       }</span></button>`;
  }
  var gsel = grupos[iSel] || [];
  if(!gsel.length){
    lista_ = '<div class="kb-empty">Ninguém em ' + esc(f[iSel].rot) + '.<br>Sai deste estágio quando:<br>' + esc(f[iSel].saida || "") + '</div>';
  } else {
    for(i=0;i<gsel.length;i++) lista_ += cardNegocio(gsel[i], "kanban");
  }
  h += `<div class="only-mob">
    <div class="pills" id="fnPills" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:7px">${pills}</div>
    <div class="tiny muted" style="margin:4px 0 10px">Sai de ${esc(f[iSel].rot)} quando: ${esc(f[iSel].saida || "")}</div>
    <div style="display:flex;flex-direction:column;gap:9px">${lista_}</div>
  </div>`;

  // Traz a pilula do estagio aberto pro campo de visao, senao quem está
  // no ultimo estagio abre a tela vendo a barra no comeco.
  DEPOIS.push(function(){
    var p = document.querySelector('#fnPills .pill.on');
    if(p && p.scrollIntoView){ try{ p.scrollIntoView({ block:"nearest", inline:"center" }); }catch(e){} }
  });

  return h;
};

function fnEstagioMob(k, f, grupos){
  var atual = FN_ESTAGIO[k], i;
  for(i=0;i<f.length;i++) if(f[i].k === atual) return atual;
  for(i=0;i<f.length;i++) if(grupos[i].length) return f[i].k;   // primeiro estagio com gente
  return f.length ? f[0].k : "";
}

ACOES.funilTrocar = function(el){
  var k = el.getAttribute('data-k');
  guardar("funilAberto", k);
  ir("funil/" + k);
};
ACOES.funilEstagio = function(el){
  var k = fnFunilAtual();
  FN_ESTAGIO[k] = el.getAttribute('data-k');
  guardar("funilEstagio", FN_ESTAGIO);
  redesenhar();
};
ACOES.funilNovo = function(el){

};
// Fecha a folha antes de navegar: o overlay nao morre sozinho na troca de
// hash e ficaria cobrindo a tela nova.
ACOES.funilAbrirNegocio = function(el){
