function boot(){
  pintarSync();
  // O hash da senha de recuperacao ja vem pronto em 03-const.js. Antes
  // era calculado aqui a partir da senha em texto, o que num repositorio
  // publico equivale a publicar a senha.
  Promise.resolve()
    .then(function(){ return iniciarBanco(); })
    .then(function(){
      var s = sessaoValida();
      if(s){
        SESSAO = s; PERM = PERFIS[s.perfil];
        document.getElementById('gate').hidden = true;
        document.getElementById('app').hidden = false;
        pintarCabecalho();
        carregarCache();
        if(!location.hash) location.hash = "#/" + ((PERM && PERM.home) || "hoje");
        redesenhar();
        // Revalida contra a lista de acessos. Lista VAZIA nao derruba
        // ninguem: mantem a sessao e avisa. Derrubar o time por causa de
        // um erro de leitura e pior que o risco que evita.
        carregarAcessos().then(function(acc){
          if(!acc.length){
            if(!SESSAO.recuperacao) avisoBarra("Nao consegui ler a lista de acessos agora. Voce continua dentro com o perfil da ultima vez.");
            return;
          }
          if(SESSAO.recuperacao) return;
          var eu = null;
          for(var i=0;i<acc.length;i++) if(acc[i].id === SESSAO.acessoId) eu = acc[i];
          if(!eu || eu.ativo === false){
            fecharSessao(); pintarGate();
            var g = document.getElementById('gateErr');
            if(g) g.textContent = "Seu acesso foi desativado.";
            return;
          }
          if(eu.perfil !== SESSAO.perfil){
            SESSAO.perfil = eu.perfil; PERM = PERFIS[eu.perfil];
            guardar("sessao", SESSAO); pintarCabecalho(); redesenhar();
          }
        });
        sincronizar(true).then(function(){ redesenhar(); return esvaziarOutbox(); });
        perguntarDoRetorno();
      } else {
        pintarGate();
      }
      atualizaAvisoFila();
    });
}

/* ============ 06-hoje ============ */
/* =====================================================================
   CRM LIME - TELA HOJE
   A home do vendedor e a tela mais importante do sistema.

   Com 30 negocios abertos o kanban nao informa nada as 9h da manha: o
   vendedor ja sabe de cor onde cada um esta. O que ele nao sabe e QUAL
   passou do ponto. Em funil de mil leads quem esconde a informacao e o
   volume; em funil de 30 quem esconde e o tempo, e tempo o kanban nao
   mostra.

   Duas decisoes mandam nesta tela:
     1. Teto duro de 8 cartoes. Uma terca com 11 atrasados faz a pessoa
        fechar a aba e nao voltar. Melhor 8 itens terminaveis do que a
        lista honesta que ninguem encara.
     2. Toda linha diz POR QUE esta ali, com o numero. Nunca "atrasado",
        sempre "16 dias sem contato, o limite em Diagnostico e 5". Alerta
        sem motivo explicito e treinado a ser ignorado em uma semana.
   ===================================================================== */

/* ---------------------------------------------------------------------
   A FILA
   Recalculada em todo render de proposito, sem memoria entre chamadas:
   aba fixada por dias congelava a fila na data de ontem e mostrava
   "0 pra hoje" numa terca cheia. Sao ~130 negocios em memoria, custa
   menos que pintar a tela.
   --------------------------------------------------------------------- */

// Ordena por valor de ordenacao, NUNCA por valorRefDe: negocio sem valor
// entra com VALOR_PRESUMIDO, senao a indicacao fresca cadastrada em 20
// segundos fica sempre no fim e nunca aparece, e e o lead mais quente da casa.
function hjPorValor(a, b){ return valorOrdem(b) - valorOrdem(a); }
function hjPorNovo(a, b){ return String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")); }
function hjPorData(campo){
  return function(a, b){ return String(a[campo]||"").localeCompare(String(b[campo]||"")); };
}

// Balde 1 tem teto 3 e UMA vaga reservada pro mais recente. Sem essa vaga,
// tres cotas grandes atrasadas ocupam o balde todo dia e o negocio novo,
// que ainda nao tem valor, nunca chega a ser visto.
function hjTresComVaga(arr){
  var r = arr.slice().sort(hjPorValor);
  if(r.length <= 3) return r;
  var resto = r.slice(2).sort(hjPorNovo);
  return r.slice(0, 2).concat(resto.slice(0, 1));
}

function filaDeHoje(){
  var hoje = hojeISO();
  var todos = lista("negocios");
  var abertos = [], i, n;

  for(i = 0; i < todos.length; i++){
    n = todos[i];
    if(n.status !== "aberto") continue;
    // Congelado nao entra em balde nenhum. Congelar e o pedido explicito
    // de parar de cobrar; cobrar assim mesmo ensina a nunca mais congelar,
    // e ai o vendedor bota data falsa e o dado inteiro apodrece.
    if(n.congeladoAte && n.congeladoAte > hoje) continue;
    abertos.push(n);
  }

  var resgate = [], candidatos = [], vencidos = 0, semData = 0, venc;
  for(i = 0; i < abertos.length; i++){
    n = abertos[i];
    if(!n.proxData){ semData++; candidatos.push(n); continue; }
    venc = diasVencido(n.proxData);
    if(venc >= 1) vencidos++;
    // Atraso de mais de 14 dias SAI da fila de todo dia e vai pro Resgate
    // de sexta. Esse corte e o que impede a terca com 11 atrasados.
    if(venc > 14) resgate.push(n);
    else candidatos.push(n);
  }
  var resgateTotal = resgate.length;
  resgate = resgate.slice().sort(hjPorValor).slice(0, 5);

  var itens = [], usados = {};
  function empurrar(arr, balde, teto){
    var postos = 0;
    for(var j = 0; j < arr.length; j++){
      if(itens.length >= 8 || postos >= teto) return;   // teto do balde e teto duro de 8
      var x = arr[j];
      if(usados[x.id]) continue;
      usados[x.id] = true;
      postos++;
      itens.push({ n:x, motivo:porQue(x), balde:balde, tarefa:null });
    }
  }

  // 1. Proximo passo vencido (ate 14 dias), teto 3
  var b1 = candidatos.filter(function(x){ return x.proxData && diasVencido(x.proxData) >= 1; });
  empurrar(hjTresComVaga(b1), 1, 3);

  // 2. Hoje e amanha, teto 4. Hora marcada primeiro, depois valor: reuniao
  // das 9h de hoje tem que vir antes da das 16h de amanha, e as duas antes
  // de qualquer ligacao sem hora, por maior que seja o negocio.
  var b2 = candidatos.filter(function(x){
    if(!x.proxData) return false;
    var d = diasVencido(x.proxData);
    return d === 0 || d === -1;
  }).sort(function(a, b){
    var ha = a.proxHora ? 0 : 1, hb = b.proxHora ? 0 : 1;
    if(ha !== hb) return ha - hb;
    if(ha === 0){
      var ka = String(a.proxData) + String(a.proxHora), kb = String(b.proxData) + String(b.proxHora);
      return ka.localeCompare(kb);
    }
    return hjPorValor(a, b);
  });
  empurrar(b2, 2, 4);

  // 3. Tarefa vencida ou de hoje, teto 3, por data (a mais velha primeiro)
  var tarefas = lista("tarefas").filter(function(t){
    return t.feita !== true && t.data && t.data <= hoje;
  }).sort(hjPorData("data"));
  var tarefasTotal = tarefas.length;
  for(i = 0; i < tarefas.length && itens.length < 8; i++){
    if(i >= 3) break;
    var t = tarefas[i];
    itens.push({
      n: t.negocioId ? achar("negocios", t.negocioId) : null,
      motivo: hjMotivoTarefa(t), balde:3, tarefa:t
    });
  }

  // 4. Esfriando: passou do teto do estagio ou do teto de toque, teto 2.
  // So entra quem TEM plano marcado pra frente: quem nao tem cai no balde 5,
  // que explica melhor o que fazer ("sem proximo passo marcado").
  var b4 = candidatos.filter(function(x){
    if(!x.proxData || diasVencido(x.proxData) >= 0) return false;
    var f = FUNIL[x.tipo] || [], ix = idxEstagio(x), e = f[ix] || { teto:30 };
    var limToque = (ix === f.length - 1) ? TOQUE[x.tipo].ultimo : TOQUE[x.tipo].normal;
    return diasVencido(x.estagioDesde) > e.teto || diasVencido(x.ultimoToqueEm) > limToque;
  }).sort(hjPorValor);
  empurrar(b4, 4, 2);

  // 5. Sem proximo passo, criado ha mais de 2 dias, teto 2, mais recente
  // primeiro. Os 2 dias de folga existem pra nao cobrar plano de um negocio
  // cadastrado hoje de manha no corredor.
  var b5 = candidatos.filter(function(x){
    return !x.proxData && diasVencido(x.criadoEm) > 2;
  }).sort(hjPorNovo);
  empurrar(b5, 5, 2);

  var naFila = 0;
  for(i = 0; i < itens.length; i++) if(itens[i].n && !itens[i].tarefa) naFila++;
  var fora = abertos.length - naFila - resgateTotal;
  if(fora < 0) fora = 0;

  return {
    itens: itens,
    total: itens.length,           // e o numero gigante e o contador da aba
    vencidos: vencidos,            // conta honesta, inclui os que foram pro resgate
    semData: semData,
    resgate: resgate,
    resgateTotal: resgateTotal,
    fora: fora,
    abertos: abertos.length,
    tarefasTotal: tarefasTotal
  };
}

/* ---------------------------------------------------------------------
   PECAS DA TELA
   --------------------------------------------------------------------- */

function hjMotivoTarefa(t){
  var d = diasVencido(t.data);
  if(d > 0) return "venceu ha " + d + (d === 1 ? " dia" : " dias");
  if(d === 0) return "pra hoje";
  return "em " + Math.abs(d) + (Math.abs(d) === 1 ? " dia" : " dias");
}
function hjRotTarefa(k){
  for(var i = 0; i < TIPOS_TAREFA.length; i++) if(TIPOS_TAREFA[i].k === k) return TIPOS_TAREFA[i].rot;
  return "Tarefa";
}
// Cor do semaforo, do CONTRATO: verde, amarelo, vermelho, azul, cinza.
function hjCor(t){
  if(t === "verde") return "var(--green)";
  if(t === "amarelo") return "var(--warn)";
  if(t === "vermelho") return "var(--red)";
  if(t === "congelado") return "var(--blue)";
  return "var(--text3)";
}
function hjIcone(it){
  if(it.tarefa) return "☐";
  if(it.balde === 1) return "🔥";
  if(it.balde === 2) return "⏰";
  if(it.balde === 4) return "💤";
  return "⚠";
}
// Unidade sempre explicita: agencia e R$ por mes, patrocinio e R$ cheio.
// Os dois nunca viram o mesmo numero.
function hjValor(n){
  if(!n) return "";
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mes" : "valor a definir";
  }
  var v = valorRefDe(n);
  return v > 0 ? brl(v) : "valor a definir";
}
function hjUltimoToque(n){
  if(!n.ultimoToqueEm) return "sem toque registrado ainda";
  var q = quando(n.ultimoToqueEm);
  // "ultimo toque 10 set (hoje)" e redundante. Perto, so a palavra; longe,
  // a data, porque "ha 23 dias" sozinho nao diz em que semana foi.
  var base = "ultimo toque " + ((q === "hoje" || q === "ontem") ? q : dataCurta(n.ultimoToqueEm) + ", " + q);
  return n.ultimoToqueTxt ? base + ": " + n.ultimoToqueTxt : base;
}
function hjEmpresa(n){ return n.empresa || n.titulo || "Sem nome"; }

/* O nome da empresa E o botao de abrir o negocio. Assim a linha fica com os
   dois botoes que o SPEC pede (zap e feito) e nao um terceiro que estoura a
   largura num celular de 320px.
   O min-height de 44px existe porque este e o alvo principal da tela no
   celular: so a altura do texto daria 21px, que e menor que a ponta do dedo
   e faz errar pro negocio de cima. */
function hjTituloAbre(n){
  return '<button class="h2 truncate" data-a="hjAbrir" data-id="' + esc(n.id) + '" ' +
    'style="flex:1;min-width:120px;text-align:left;padding:0;min-height:44px">' + esc(hjEmpresa(n)) + '</button>';
}

// O painel e quem sabe somar o mes. Se aquele modulo ainda nao existe, a
// tela nao pode quebrar por causa de um numero de apoio.
function hjNumerosDoMes(){
  try{
    if(typeof numerosDoMes !== "function") return null;
    var m = numerosDoMes(mesAtual());
    return (m && typeof m === "object") ? m : null;
  }catch(e){ return null; }
}
function hjRank(){
  try{
    if(typeof rankIndicadores !== "function") return [];
    var r = rankIndicadores();
    return (r && r.length) ? r : [];
  }catch(e){ return []; }
}
// Ultimo dia do mes: dia 0 do mes seguinte. Serve pra escrever a data
// absoluta na tela ("Fecha ate 30/09/2026"), nunca "ate o fim do mes".
function hjFimDoMes(ym){
  var p = String(ym || mesAtual()).split("-");
  var d = new Date(Number(p[0]), Number(p[1]), 0);
  return p[0] + "-" + p[1] + "-" + pad2(d.getDate());
}

/* Botao de WhatsApp de uma linha. Fica VISIVEL e desabilitado quando nao da
   pra usar, com o motivo embaixo: botao que some faz a pessoa achar que o
   CRM quebrou. */
function hjBotaoZap(acao, id, temTel){
  if(temTel) return '<button class="btn" style="flex:1" data-a="' + acao + '" data-id="' + esc(id) + '">💬 Zap</button>';
  return '<button class="btn" style="flex:1" disabled>💬 Zap</button>';
}

function hjLinhaNegocio(it){
  var n = it.n;
  var cor = hjCor(temperatura(n));
  var temTel = !!(n.contatoTel && soDigito(n.contatoTel).length >= 10);
  return `
  <div style="border-left:3px solid ${cor};padding:11px 0 13px 12px;border-bottom:1px solid var(--border)">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="font-size:17px;line-height:1.25;flex:0 0 auto">${hjIcone(it)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          ${hjTituloAbre(n)}
          <div class="num nowrap" style="font-size:17px;color:var(--lime)">${esc(hjValor(n))}</div>
        </div>
        <div class="small" style="color:${cor};margin-top:2px">${esc(it.motivo || "")}</div>
        <div class="tiny muted" style="margin-top:3px">${esc(hjUltimoToque(n))}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${hjBotaoZap("hjZap", n.id, temTel)}
      <button class="btn" style="flex:1" data-a="hjRegistro" data-id="${esc(n.id)}">✓ Feito</button>
    </div>
    ${temTel ? "" : '<div class="tiny" style="color:var(--text3);margin-top:5px">Zap desligado: esse negocio nao tem telefone com DDD cadastrado.</div>'}
  </div>`;
}

function hjLinhaTarefa(it){
  var t = it.tarefa;
  var temTel = !!(t.contatoTel && soDigito(t.contatoTel).length >= 10);
  var bloq = motivoBloqueio("crm_tarefas");
  var vencida = diasVencido(t.data) > 0;
  return `
  <div style="padding:11px 0 13px;border-bottom:1px solid var(--border)">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="font-size:16px;line-height:1.3;flex:0 0 auto">☐</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${esc(t.texto || hjRotTarefa(t.tipo))}</div>
        <div class="tiny" style="color:${vencida ? "var(--red)" : "var(--warn)"};margin-top:2px">
          ${esc(hjRotTarefa(t.tipo))}, ${esc(hjMotivoTarefa(t))}
        </div>
        ${t.negocioTitulo ? '<div class="tiny muted" style="margin-top:2px">' + esc(t.negocioTitulo) + '</div>' : ""}
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${hjBotaoZap("hjZapTarefa", t.id, temTel)}
      ${bloq
        ? '<button class="btn" style="flex:1" disabled>✓ Feita</button>'
        : '<button class="btn" style="flex:1" data-a="hjTarefaFeita" data-id="' + esc(t.id) + '">✓ Feita</button>'}
    </div>
    ${bloq ? '<div class="tiny" style="color:var(--text3);margin-top:5px">' + esc(bloq) + '</div>' : ""}
    ${temTel ? "" : '<div class="tiny" style="color:var(--text3);margin-top:5px">Zap desligado: essa tarefa nao tem telefone com DDD.</div>'}
  </div>`;
}

/* FILA VAZIA E VITORIA, e a tela trata como vitoria. Nao e tela vazia
   triste com um icone cinza: e o dia em que o funil esta em dia, em --lime,
   com as duas coisas que valem o tempo que sobrou. As duas saem do cache,
   sem nenhuma leitura. */
function hjVitoria(f){
  var hoje = hojeISO();
  var abertos = lista("negocios").filter(function(n){
    return n.status === "aberto" && !(n.congeladoAte && n.congeladoAte > hoje);
  });

  // 1) o negocio mais esquecido, medido em dias sem contato
  var parado = null, maior = -1;
  for(var i = 0; i < abertos.length; i++){
    var d = diasVencido(abertos[i].ultimoToqueEm || abertos[i].criadoEm);
    if(d > maior){ maior = d; parado = abertos[i]; }
  }

  // 2) um indicador frio: 2 ganhos ou mais e mais de 120 dias sem indicar.
  // E a acao de maior retorno de uma agencia que vive de indicacao.
  var frio = null;
  var rank = hjRank();
  for(var j = 0; j < rank.length; j++){
    if((rank[j].ganhos || 0) >= 2 && rank[j].ultimaEm && diasVencido(rank[j].ultimaEm) > 120){ frio = rank[j]; break; }
  }

  // A frase muda quando sobrou tarefa: dizer "nada pra hoje" com duas tarefas
  // vencidas logo embaixo faz a tela mentir na primeira semana de uso.
  var sub = (f && f.tarefasTotal > 0)
    ? "Nenhum negocio atrasado ou vencendo hoje. Fecha as tarefas aqui embaixo e o dia acabou."
    : "Nada atrasado, nada vencendo hoje. Duas coisas que valem seu tempo agora.";

  var h = '<div class="card card-lime">' +
    '<div class="sec-title" style="border-left-color:var(--lime)">Fila limpa</div>' +
    '<div class="sec-sub">' + sub + '</div>' +
    '<div style="margin-top:14px;display:flex;flex-direction:column;gap:12px">';

  if(parado && maior >= 0){
    var temTel = !!(parado.contatoTel && soDigito(parado.contatoTel).length >= 10);
    h += '<div style="border-left:3px solid var(--lime);padding-left:12px">' +
      '<div class="h3" style="color:var(--lime)">O mais esquecido</div>' +
      '<div style="display:flex;margin-top:3px">' + hjTituloAbre(parado) + '</div>' +
      '<div class="small muted2">' + maior + (maior === 1 ? " dia" : " dias") + ' sem contato, ' + esc(hjValor(parado)) + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:9px">' +
        hjBotaoZap("hjZap", parado.id, temTel) +
        '<button class="btn" style="flex:1" data-a="hjRegistro" data-id="' + esc(parado.id) + '">✓ Feito</button>' +
      '</div></div>';
  }

  if(frio){
    h += '<div style="border-left:3px solid var(--lime);padding-left:12px">' +
      '<div class="h3" style="color:var(--lime)">Indicador esfriando</div>' +
      '<div class="h2 truncate" style="margin-top:3px">' + esc(frio.nome || "") + '</div>' +
      '<div class="small muted2">' + (frio.ganhos || 0) + ' negocios ganhos por indicacao dele, ' +
        diasVencido(frio.ultimaEm) + ' dias sem indicar</div>' +
      '<div style="display:flex;gap:8px;margin-top:9px">' +
        '<button class="btn" style="flex:1" data-a="hjPedirIndicacao" data-id="' + esc(frio.id || "") + '">💬 Pedir indicacao</button>' +
      '</div></div>';
  } else {
    h += '<div style="border-left:3px solid var(--border2);padding-left:12px">' +
      '<div class="h3">Indicador esfriando</div>' +
      '<div class="small muted">Nenhum indicador com 2 ganhos ou mais passou de 120 dias sem indicar. ' +
      'Quando algum passar, ele aparece aqui com o botao de mensagem pronto.</div></div>';
  }

  h += '</div></div>';
  return h;
}

function hjBlocoIndicadores(){
  var rank = hjRank();
  if(!rank.length) return "";
  var h = '<div class="card">' +
    '<div class="card-head">' +
      '<div class="sec-title">Quem te trouxe negocio</div>' +
      '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="pessoas">Ver ranking</button>' +
    '</div>';
  for(var i = 0; i < rank.length && i < 3; i++){
    var r = rank[i];
    h += '<div style="display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border)">' +
      '<div class="num" style="font-size:15px;color:var(--text3);flex:0 0 20px">' + (i + 1) + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="cel-nome truncate">' + esc(r.nome || "") + '</div>' +
        '<div class="cel-sub">' + (r.n || 0) + (r.n === 1 ? " indicacao" : " indicacoes") +
          ', ' + (r.ganhos || 0) + (r.ganhos === 1 ? " virou cliente" : " viraram cliente") + '</div>' +
      '</div>' +
      '<div class="num nowrap" style="font-size:16px;color:var(--lime)">' + brlCurto(r.gerado || 0) + '</div>' +
    '</div>';
  }
  h += '<div class="tiny muted" style="margin-top:9px">Valor gerado em negocios ganhos. ' +
       'MRR de agencia e cota de patrocinio aparecem separados na aba Pessoas.</div></div>';
  return h;
}

/* ---------------------------------------------------------------------
   A TELA
   --------------------------------------------------------------------- */
TELAS.hoje = function(){
  var f = filaDeHoje();
  var m = hjNumerosDoMes();
  var fimMes = hjFimDoMes(mesAtual());

  // "Fecha ate <data>" soma o que esta em alta chance. Valor total de
  // contrato somado com cota de patrocinio: serve pra dimensionar esforco
  // comercial e a nota embaixo diz isso, porque nao e caixa do mes.
  var somaAlta = 0, qtdAlta = 0;
  if(m && m.altaChance && m.altaChance.length){
    qtdAlta = m.altaChance.length;
    for(var i = 0; i < m.altaChance.length; i++) somaAlta += valorRefDe(m.altaChance[i]);
  }

  var h = '';

  /* Cabecalho: o numero gigante e a promessa da tela. Se der 8, deu 8 e
     acabou, e isso e proposital. */
  h += '<div class="card">' +
    '<div class="card-head" style="margin-bottom:6px">' +
      '<div>' +
        '<div class="h3">Fila de hoje</div>' +
        '<div class="num" style="font-size:clamp(48px,14vw,68px);color:' +
          (f.total ? "var(--lime)" : "var(--green)") + '">' + f.total + '</div>' +
        '<div class="tiny muted">' +
          (f.total ? (f.total === 1 ? "1 coisa pra resolver hoje" : f.total + " coisas pra resolver hoje")
                   : "nada atrasado e nada vencendo hoje") +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="kpi-l">Fecha ate ' + dataBR(fimMes) + '</div>' +
        (m
          ? '<div class="num" style="font-size:26px">' + brl(somaAlta) + '</div>' +
            '<div class="tiny muted">' + qtdAlta + (qtdAlta === 1 ? " negocio" : " negocios") + ' em alta chance</div>'
          : '<div class="num muted" style="font-size:26px">sem numero</div>' +
            '<div class="tiny muted">o Painel ainda nao respondeu</div>') +
      '</div>' +
    '</div>' +
    (m ? '<div class="tiny muted">Soma valor total de contrato com cota de patrocinio. ' +
         'Serve pra dimensionar o esforco comercial, nao e caixa do mes.</div>' : '') +
    '<div style="display:flex;gap:8px;margin-top:13px;flex-wrap:wrap">' +
      '<button class="btn btn-sm" data-a="resumoDia">Copiar o resumo do dia</button>' +
      (f.resgate.length
        ? '<button class="btn btn-sm" data-a="hjResgate">Resgate de sexta (' + f.resgateTotal +
          (f.resgateTotal === 1 ? ' negocio' : ' negocios') + ')</button>'
        : '') +
    '</div>' +
  '</div>';

  /* A fila. Tarefa tem bloco proprio embaixo, mas conta no numero de cima:
     uma tarefa de avisar quem indicou vale tanto quanto um negocio. */
  var negocios = f.itens.filter(function(it){ return !it.tarefa && it.n; });
  var tarefas = f.itens.filter(function(it){ return !!it.tarefa; });

  if(negocios.length){
    h += '<div class="card" style="padding-top:8px;padding-bottom:4px">';
    for(var j = 0; j < negocios.length; j++) h += hjLinhaNegocio(negocios[j]);

    if(f.fora > 0){
      var partes = [];
      partes.push(f.abertos + (f.abertos === 1 ? " negocio aberto" : " negocios abertos") + " no total");
      if(f.semData > 0) partes.push(f.semData + " sem proximo passo marcado");
      if(f.resgateTotal > 0) partes.push(f.resgateTotal + " no resgate, com mais de 14 dias de atraso");
      h += '<div style="padding:13px 0 12px">' +
        '<button class="btn btn-block btn-ghost" data-a="ir" data-r="negocios">Ver os outros ' +
          f.fora + (f.fora === 1 ? ' negocio' : ' negocios') + '</button>' +
        '<div class="tiny muted center" style="margin-top:7px">' + esc(partes.join(", ")) + '</div>' +
      '</div>';
    }
    h += '</div>';
  } else if(f.abertos === 0 && !tarefas.length){
    // Vazio de verdade, primeiro dia de uso. Texto proprio: repetir o texto
    // de "fila limpa" aqui faria a pessoa achar que perdeu os dados.
    var bloqNovo = motivoBloqueio("crm_negocios");
    h += '<div class="empty"><div class="ei">◎</div>' +
      '<div class="et">Nenhum negocio aberto ainda</div>' +
      '<div class="ex">Cadastre os negocios que estao de pe agora. Cliente antigo e negocio perdido entram quando forem tocados, nao existe backlog de digitacao.</div>' +
      (bloqNovo
        ? '<button class="btn btn-primary" disabled>Cadastrar negocio</button>' +
          '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloqNovo) + '</div>'
        : '<button class="btn btn-primary" data-a="novo">Cadastrar negocio</button>') +
    '</div>';
  } else {
    h += hjVitoria(f);
  }

  /* TAREFAS: o que nao e negocio e, sem casa propria, nunca aparece. */
  if(tarefas.length){
    h += '<div class="card" style="padding-bottom:4px">' +
      '<div class="card-head" style="margin-bottom:4px">' +
        '<div class="sec-title">Tarefas</div>' +
        '<span class="tag tag-warn">' + f.tarefasTotal + ' pra hoje ou vencidas</span>' +
      '</div>';
    for(var k = 0; k < tarefas.length; k++) h += hjLinhaTarefa(tarefas[k]);
    if(f.tarefasTotal > tarefas.length){
      h += '<div class="tiny muted center" style="padding:12px 0">' +
        'Mais ' + (f.tarefasTotal - tarefas.length) + ' com data pra hoje ou vencida. ' +
        'A fila mostra 3 por dia pra caber no dia.</div>';
    }
    h += '</div>';
  }

  h += hjBlocoIndicadores();

  // A barra da volta do WhatsApp vive fora do #conteudo, entao e pintada
  // depois que a tela existe.
  DEPOIS.push(function(){ perguntarDoRetorno(); });

  return h;
};

// Abre a conversa. Quem monta a folha de mensagem e o modulo de cadastro;
// o caminho cru (sem modelo) existe como reserva e nunca e bloqueado,
// porque um modelo que pede um campo que nao existe nao pode travar
// justamente o negocio de maior ticket.
function hjAbrirConversa(ctx){
  try{
    if(typeof abrirMensagem === "function"){ abrirMensagem(ctx); return; }
  }catch(e){ /* cai no caminho cru */ }
  var url = linkWhats(ctx.tel, "");
  if(!url){ toast("Sem telefone com DDD nesse cadastro", "bad"); return; }
  // O pendente e gravado no localStorage, nao em memoria: no celular o
  // webview e descarregado enquanto o WhatsApp esta aberto e a memoria vai
  // junto. Sem isso a pergunta da volta nunca aparece.
  if(ctx.negocioId){
    guardar("pendente", { negocioId:ctx.negocioId, contatoId:ctx.contatoId || "",
                          nome:ctx.nome || "", quando:Date.now() });
  }
  var a = document.createElement('a');
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 500);
}

ACOES.hjZap = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  fecharFolha();
  hjAbrirConversa({ tel:n.contatoTel, nome:n.contatoNome || n.empresa,
                    negocioId:n.id, contatoId:n.contatoId || "" });
};

ACOES.hjZapTarefa = function(el){
  var t = achar("tarefas", el.getAttribute('data-id'));

  var modelo = t.tipo === "avisar_indicador" ? "m6"
             : t.tipo === "pedir_indicacao"  ? "m5"

                    contatoId:t.contatoId || "", modelo:modelo });
};

/* ---------------------------------------------------------------------

   O bloco que o vendedor cola no grupo do WhatsApp as 18h.

function hjDescricaoValor(n){
  if(n.tipo === "agencia"){
    var mrr = mrrDe(n);
    var meses = (n.ag && n.ag.meses) || 0;
    return "agencia, " + brl(mrr) + "/mes" + (meses ? " por " + meses + " meses" : " por prazo indeterminado");
  }
  var ed = edicaoDe(n.pt && n.pt.edicao);
  var cota = (n.pt && n.pt.cota) ? n.pt.cota : "cota";
  return "cota " + cota + (ed ? " " + ed.rot : "") + ", " + brl(valorRefDe(n));
}

function hjResumoTexto(){
  var hoje = hojeISO();
  var L = [];
  L.push("*LIME | Comercial, " + dataBR(hoje) + "*");
  L.push("");

  var m = hjNumerosDoMes();
  if(m){
    L.push("Fechado no mes: " + brl(m.fechado || 0));
    if(m.meta > 0){
      // Nunca NaN%: sem meta cadastrada a linha diz que nao tem meta.
      L.push("Meta do mes: " + brl(m.meta) + " (" + Math.round(((m.fechado || 0) / m.meta) * 100) + "% atingido)");
    } else {
      L.push("Meta do mes: nao definida");
    }
    var alta = (m.altaChance || []).slice();
    var somaAlta = 0, i;
    for(i = 0; i < alta.length; i++) somaAlta += valorRefDe(alta[i]);
    L.push("Alta chance: " + brl(somaAlta) + " em " + alta.length + (alta.length === 1 ? " negocio" : " negocios"));

    var liq = m.mrrLiquido || 0;
    L.push("Base recorrente ativa: " + brl(m.carteira || 0) + "/mes (variacao no mes: " +
           (liq >= 0 ? "+" : "-") + brl(Math.abs(liq)) + "/mes)");
    L.push("");

    if(alta.length){
      alta.sort(hjPorData("prevFechamento"));
      L.push("*Vai fechar*");
      for(i = 0; i < alta.length && i < 5; i++){
        L.push((i + 1) + ". " + (alta[i].empresa || alta[i].titulo || "") + ", " +
               hjDescricaoValor(alta[i]) + ", previsto " + dataBR(alta[i].prevFechamento));
      }
      if(alta.length > 5) L.push("e mais " + (alta.length - 5) + " em alta chance");
      L.push("");
    }
  }

  // Travado: isto a tela Hoje sabe sozinha, sem depender de outro modulo.
  var abertos = lista("negocios").filter(function(n){
    return n.status === "aberto" && !(n.congeladoAte && n.congeladoAte > hoje);
  });
  var semContato = abertos.filter(function(n){ return diasVencido(n.ultimoToqueEm) > 7; });
  var vencidos = abertos.filter(function(n){ return n.proxData && diasVencido(n.proxData) >= 1; })
                        .sort(function(a, b){ return diasVencido(b.proxData) - diasVencido(a.proxData); });

  L.push("*Travado*");
  if(semContato.length){
    var soma = 0, semValor = 0, j;
    for(j = 0; j < semContato.length; j++){
      var v = valorRefDe(semContato[j]);
      if(v > 0) soma += v; else semValor++;
    }
    L.push(semContato.length + (semContato.length === 1 ? " negocio" : " negocios") +
           " sem contato ha mais de 7 dias, " + brl(soma) + " no total" +
           (semValor ? " (" + semValor + " ainda sem valor definido)" : ""));
  }
  if(vencidos.length){
    var v0 = vencidos[0];
    var d0 = diasVencido(v0.proxData);
    L.push(vencidos.length + (vencidos.length === 1 ? " negocio" : " negocios") +
           " com data vencida: " + (v0.empresa || v0.titulo || "") + ", venceu ha " +
           d0 + (d0 === 1 ? " dia" : " dias") + (vencidos.length > 1 ? " (o mais antigo)" : ""));
  }
  if(!semContato.length && !vencidos.length){
    L.push("Nada travado. Todo negocio aberto foi tocado nos ultimos 7 dias.");
  }

  var rank = hjRank();
  if(rank.length){
    var t = rank[0];
    L.push("");
    L.push("*Indicacao*");
    L.push("Quem mais trouxe: " + (t.nome || "") + ", " + (t.n || 0) +
           ((t.n === 1) ? " indicacao" : " indicacoes") + ", " + brl(t.gerado || 0) + " gerados");
  }

  return L.join("\n");
}

ACOES.resumoDia = function(){
  // A string e montada ANTES do writeText. No Safari do iPhone qualquer
  // await entre o clique e a chamada faz a permissao ser recusada em
  // silencio, e o botao parece quebrado sem dar erro nenhum.
  var txt = hjResumoTexto();

/* ============ 07-funil ============ */
/* =====================================================================
   CRM LIME - FUNIL
   O quadro de estagios, o cartao de negocio (usado tambem pelo Hoje e
   pela lista) e a folha de trocar estagio.

   TRES DECISOES QUE MANDAM NESTA TELA
     1. UM funil por vez. Onze colunas lado a lado e ilegivel no
        computador e impossivel no celular, e um funil generico e gosma:
        "Proposta" nao significa a mesma coisa pra um fee de R$ 3.500/mes
        e pra uma cota de R$ 180.000. A faixa de totais mostra os DOIS
        funis sempre, entao nada some por causa da escolha.
     2. Ganho, perdido e encerrado NAO sao coluna. Se fossem, fechar o
        negocio apagaria em QUE estagio ele morreu, que e a unica
        informacao que explica onde o funil vaza.
     3. Mover estagio tem um caminho unico, a folha. Nao existe arrastar.
   ===================================================================== */

/* Estagio aberto no celular, por funil. Fica no aparelho porque quem
   volta do detalhe do negocio espera cair no mesmo estagio de onde saiu,
   e redesenhar() reconstroi a tela inteira toda vez. */
var FN_ESTAGIO = recuperar("funilEstagio", {});

/* ---------------------------------------------------------------------
   PECINHAS DE TEXTO E COR
   Prefixo fn_ nos ajudantes privados pra nao brigar com nome de outro
   modulo: so cardNegocio, abrirFolhaEstagio e TELAS.funil sao publicos.
   --------------------------------------------------------------------- */
function fnPlural(n, sing, plur){ return n + " " + (Math.abs(n) === 1 ? sing : plur); }

function fnFunilAtual(){
  var k = ROTA.id;
  if(k !== "agencia" && k !== "patrocinio") k = recuperar("funilAberto", "agencia");
  return FUNIL[k] ? k : "agencia";
}
function fnCor(t){
  return t === "vermelho" ? "var(--red)"
       : t === "amarelo"  ? "var(--warn)"
       : t === "verde"    ? "var(--green)"
       : t === "congelado"? "var(--blue)" : "var(--text3)";
}
function fnTagCls(t){
  return t === "vermelho" ? "tag-red"
       : t === "amarelo"  ? "tag-warn"
       : t === "verde"    ? "tag-green"
       : t === "congelado"? "tag-blue" : "";
}

/* Selo de temperatura do cartao. A ordem dos testes e a MESMA de
   temperatura() no nucleo, senao o selo diz "em 5 dias" com a borda
   vermelha e o vendedor para de acreditar na cor.
   O texto e curto de proposito: .tag nao quebra linha e o cartao do
   quadro tem 268px. A frase inteira com o limite fica em porQue(). */
function fnSelo(n){
  var t = temperatura(n), cls = fnTagCls(t), cor = fnCor(t);
  if(t === "fechado"){
    var d = n.fechadoEm || n.encerradoEm || "";
    var r = n.status === "ganho" ? "ganho" : n.status === "perdido" ? "perdido" : "encerrado";
    return { cls:"", ic:"●", txt:r + (d ? " em " + dataCurta(d) : ""), cor:cor, t:t };
  }
  if(t === "congelado"){
    return { cls:cls, ic:"❄", txt:"volta em " + fnPlural(diasEntre(hojeISO(), n.congeladoAte), "dia", "dias"),
             cor:cor, t:t };
  }
  var f = FUNIL[n.tipo] || [], i = idxEstagio(n), e = f[i] || { teto:30, rot:"" };
  var venc   = diasVencido(n.proxData);
  var parado = diasVencido(n.estagioDesde || n.criadoEm);
  var silen  = diasVencido(n.ultimoToqueEm);
  var tq = TOQUE[n.tipo] || { normal:5, ultimo:3 };   // tipo torto nao derruba a tela inteira
  var limToque = (i === f.length-1) ? tq.ultimo : tq.normal;
  if(!n.proxData)           return { cls:cls, ic:"⚠", txt:fnPlural(parado,"dia","dias") + " parado", cor:cor, t:t };
  if(venc >= 1)             return { cls:cls, ic:"🔥", txt:"venceu ha " + fnPlural(venc,"dia","dias"), cor:cor, t:t };
  if(parado > e.teto * 1.5) return { cls:cls, ic:"💤", txt:fnPlural(parado,"dia","dias") + " no estagio", cor:cor, t:t };
  if(venc === 0)            return { cls:cls, ic:"⏰", txt:"hoje" + (n.proxHora ? ", " + n.proxHora : ""), cor:cor, t:t };
  if(venc === -1)           return { cls:cls, ic:"⏰", txt:"amanha", cor:cor, t:t };
  if(parado > e.teto)       return { cls:cls, ic:"💤", txt:fnPlural(parado,"dia","dias") + " no estagio", cor:cor, t:t };
  if(silen > limToque)      return { cls:cls, ic:"💤", txt:fnPlural(silen,"dia","dias") + " sem contato", cor:cor, t:t };
  return { cls:cls, ic:"✓", txt:"em " + fnPlural(Math.abs(venc),"dia","dias"), cor:cor, t:t };
}

/* Valor heroi. Agencia mostra o que entra POR MES, patrocinio mostra a
   cota inteira. Sao grandezas diferentes e nunca viram o mesmo numero. */
function fnValorHeroi(n){
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    return m > 0 ? brl(m) + "/mes" : "";
  }
  var v = (n.pt && n.pt.valor) || 0;
  return v > 0 ? brl(v) : "";
}
/* Linha de apoio: o contrato inteiro na agencia, a edicao no patrocinio. */
function fnApoio(n){
  if(n.tipo === "agencia"){
    var m = mrrDe(n);
    if(m <= 0) return "";
    var meses = (n.ag && n.ag.meses) || 0;
    return meses > 0
      ? brl(valorRefDe(n)) + " em " + fnPlural(meses, "mes", "meses")
      : brl(valorRefDe(n)) + " em 12 meses (contrato indeterminado)";
  }
  var ed = edicaoDe(n.pt && n.pt.edicao);
  var cota = (n.pt && n.pt.cota) ? ", cota " + n.pt.cota : "";
  return (ed ? ed.rot.toUpperCase() : "edicao nao definida") + cota;
}
function fnLinhaProx(n){
  if(n.status !== "aberto") return '<span class="muted">negocio fechado</span>';
  if(!n.proxData) return '<span style="color:var(--warn)">⚠ sem proximo passo</span>';
  var t = proxTipoDe(n.proxTipo);
  return '<span class="truncate">' + esc((t ? t.ic + " " + t.rot : "Proximo passo")) +
         ', ' + esc(dataCurta(n.proxData)) + (n.proxHora ? " " + esc(n.proxHora) : "") + '</span>';
}
// "via Carla": so o primeiro nome porque o cartao tem 268px e o vendedor
// reconhece quem indicou pelo primeiro nome.
function fnChipIndicacao(n){
  if(n.origem !== "indicacao" || !n.indicadorNome) return "";
  var p = String(n.indicadorNome).trim().split(/\s+/)[0] || "";
  return '<span class="tag tag-purple">via ' + esc(p) + '</span>';
}

/* ---------------------------------------------------------------------
   O CARTAO DE NEGOCIO
   ctx = "kanban" (quadro do funil) | "lista" (tela de negocios) |
         "fila" (tela Hoje).
   No quadro o toque abre a folha de estagio, que e o caminho unico de
   mover. Na lista e na fila o toque abre o negocio, que e o que a pessoa
   quer nessas duas telas.
   --------------------------------------------------------------------- */
function cardNegocio(n, ctx){
  if(!n) return "";
  ctx = ctx || "kanban";
  var s = fnSelo(n);
  var congelado = n.congeladoAte && n.congeladoAte > hojeISO();
  var e = estagioDe(n);
  var foraDoFunil = n.estagio !== e.k;      // estagio de outro funil, nao pode sumir calado
  var heroi = fnValorHeroi(n);
  var apoio = fnApoio(n);
  var permuta = (n.tipo === "patrocinio" && n.pt && n.pt.permuta) ? n.pt.permuta : 0;

  var abre = ctx === "kanban"
    ? 'data-a="funilMover" data-id="' + esc(n.id) + '"'
    : 'data-a="funilAbrirNegocio" data-id="' + esc(n.id) + '"';
  var dim = congelado ? "opacity:.55;" : "";

  /* ---- FILA (tela Hoje): empresa e valor na mesma linha, e o motivo
     escrito com o numero. Alerta sem motivo explicito e treinado a ser
     ignorado em uma semana. ---- */
  if(ctx === "fila"){
    return `<div class="kb-card" ${abre} style="${dim}">
      <i class="flag" style="background:${s.cor}"></i>
      <div style="display:flex;gap:10px;align-items:baseline">
        <div class="truncate" style="flex:1;min-width:0;font-family:var(--disp);font-weight:700;
             text-transform:uppercase;letter-spacing:.5px;font-size:15px">${esc(n.empresa || "sem empresa")}</div>
        <div class="nowrap" style="font-family:var(--disp);font-weight:900;font-size:16px;color:var(--lime)">
          ${heroi ? esc(heroi) : '<span class="muted" style="font-size:12px">valor a definir</span>'}</div>
      </div>
      <div style="color:${s.cor};font-size:12px;margin-top:3px">${esc(s.ic + " " + porQue(n))}</div>
      ${n.ultimoToqueEm ? '<div class="tiny muted truncate" style="margin-top:4px">ultimo toque ' +
          esc(dataBR(n.ultimoToqueEm)) + (n.ultimoToqueTxt ? ": " + esc(n.ultimoToqueTxt) : "") + '</div>' : ''}
    </div>`;
  }

  /* ---- QUADRO e LISTA ---- */
  var topo = '<span class="tag ' + s.cls + '">' + esc(s.ic + " " + s.txt) + '</span>';
  if(ctx === "lista"){
    topo += '<span class="tag">' + esc(e.rot) + '</span>';
  }
  if(foraDoFunil){
    topo += '<span class="tag tag-red">estagio fora do funil</span>';
  }

  return `<div class="kb-card" ${abre} style="${dim}">
    <i class="flag" style="background:${s.cor}"></i>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px">
      ${topo}
      <button class="btn btn-icon" style="margin-left:auto;min-width:44px;min-height:44px"
              data-a="funilAbrirNegocio" data-id="${esc(n.id)}" aria-label="Abrir o negocio">↗</button>
    </div>
    <div class="kt truncate" style="font-family:var(--disp);font-weight:700;font-size:14.5px;
         letter-spacing:.5px;text-transform:uppercase">${esc(n.empresa || "sem empresa")}</div>
    <div class="ke truncate" style="font-size:12px;margin-bottom:7px">${esc(n.titulo || "")}</div>
    <div class="kv" style="color:${heroi ? "var(--lime)" : "var(--text3)"};font-weight:900">
      ${heroi ? esc(heroi) : "valor a definir"}</div>
    ${apoio ? '<div class="tiny muted" style="margin-top:2px">' + esc(apoio) + '</div>' : ''}
    ${permuta ? '<div class="tiny" style="color:var(--text3);margin-top:2px">mais ' + esc(brl(permuta)) +
                ' em permuta, que nunca soma com dinheiro</div>' : ''}
    ${congelado ? '<div class="tiny" style="color:var(--blue);margin-top:4px">congelado ate ' +
                  esc(dataBR(n.congeladoAte)) + '</div>' : ''}
    ${fnChipIndicacao(n) ? '<div style="margin-top:7px">' + fnChipIndicacao(n) + '</div>' : ''}
    ${ctx === "lista" && n.proxTexto ? '<div class="tiny muted truncate" style="margin-top:6px">' +
        esc(n.proxTexto) + '</div>' : ''}
    <div class="kf">${fnLinhaProx(n)}</div>
  </div>`;
}

/* ---------------------------------------------------------------------
   FAIXA DE TOTAIS
   Os dois funis sempre, lado a lado, NUNCA somados num numero so:
   R$/mes de fee e R$ de cota sao grandezas diferentes, e permuta nao
   entra em nenhum dos dois.
   --------------------------------------------------------------------- */
function fnTotais(k){
  var ns = lista("negocios").filter(function(n){ return n.status === "aberto" && n.tipo === k; });
  var total = 0, mrr = 0, congelados = 0, hoje = hojeISO();
  for(var i=0;i<ns.length;i++){
    total += valorRefDe(ns[i]);
    mrr   += mrrDe(ns[i]);
    if(ns[i].congeladoAte && ns[i].congeladoAte > hoje) congelados++;
  }
  return { ns:ns, n:ns.length, total:total, mrr:mrr, congelados:congelados };
}
function fnFechadosMes(){
  var ym = mesAtual(), r = { agN:0, agMrr:0, ptN:0, ptValor:0 };
  var ns = lista("negocios");
  for(var i=0;i<ns.length;i++){
    var n = ns[i];
    if(n.status !== "ganho" || mesDe(n.fechadoEm) !== ym) continue;
    if(n.tipo === "agencia"){ r.agN++; r.agMrr += mrrDe(n); }
    else { r.ptN++; r.ptValor += (n.pt && n.pt.valor) || 0; }
  }
  return r;
}
function fnFaixaTotais(k){
  var a = fnTotais("agencia"), p = fnTotais("patrocinio"), fe = fnFechadosMes();
  function bloco(kk, t, rot, sub){
    var on = k === kk;
    return `<button class="kpi${on ? " accent" : ""}" data-a="funilTrocar" data-k="${kk}"
              style="text-align:left;width:100%;${on ? "" : "opacity:.7"}">
      <div class="kpi-l">${rot}</div>
      <div class="kpi-v${on ? " lime" : ""}">${esc(brl(t.total))}</div>
      <div class="kpi-s">${sub}</div>
    </button>`;
  }
  return `<div class="kpis">
    ${bloco("agencia", a, "Agencia em aberto (contrato inteiro)",
        esc(fnPlural(a.n, "negocio", "negocios")) + (a.mrr ? ", " + esc(brl(a.mrr)) + "/mes de MRR" : "") +
        (a.congelados ? "<br>" + a.congelados + " congelado" + (a.congelados > 1 ? "s" : "") : ""))}
    ${bloco("patrocinio", p, "Patrocinio em aberto",
        esc(fnPlural(p.n, "negocio", "negocios")) + " em cotas" +
        (p.congelados ? "<br>" + p.congelados + " congelado" + (p.congelados > 1 ? "s" : "") : ""))}
    <div class="kpi" style="opacity:.85">
      <div class="kpi-l">Fechados em ${esc(mesBR(mesAtual()))}</div>
      <div class="kpi-s" style="margin-top:2px;font-size:12.5px;color:var(--text2)">
        Agencia: ${fe.agN ? esc(fnPlural(fe.agN,"negocio","negocios")) + ", " + esc(brl(fe.agMrr)) + "/mes de MRR novo" : "nenhum ainda"}<br>
        Patrocinio: ${fe.ptN ? esc(fnPlural(fe.ptN,"negocio","negocios")) + ", " + esc(brl(fe.ptValor)) : "nenhum ainda"}
      </div>
      <div class="tiny muted" style="margin-top:6px">R$/mes de fee e R$ de cota nunca viram um numero so.</div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   VIRADA DE EDICAO
   O evento aconteceu e sobrou negocio aberto daquela edicao. Enquanto
   ninguem resolve, o funil de patrocinio mostra dinheiro que nao existe
   mais.
   --------------------------------------------------------------------- */
function fnEdicoesViradas(){
  var hoje = hojeISO(), r = [];
  for(var i=0;i<EDICOES.length;i++){
    var ed = EDICOES[i];
    if(ed.dataEvento >= hoje) continue;
    var abertos = lista("negocios").filter(function(n){
      return n.status === "aberto" && n.tipo === "patrocinio" && n.pt && n.pt.edicao === ed.k;
    });
    if(abertos.length) r.push({ ed:ed, abertos:abertos });
  }
  return r;
}
// Pra onde migrar: a proxima edicao da MESMA familia (moto vai pra moto),
// e so se nao houver, a proxima que existir no calendario.
function fnProximaEdicao(edAtual){
  var hoje = hojeISO(), futuras = [];
  for(var i=0;i<EDICOES.length;i++){
    if(EDICOES[i].k !== edAtual.k && EDICOES[i].dataEvento > hoje) futuras.push(EDICOES[i]);
  }
  futuras.sort(function(a,b){ return a.dataEvento < b.dataEvento ? -1 : 1; });
  for(var j=0;j<futuras.length;j++) if(futuras[j].edicao === edAtual.edicao) return futuras[j];
  return futuras[0] || null;
}
function fnFaixaVirada(){
  var v = fnEdicoesViradas(), h = "";
  for(var i=0;i<v.length;i++){
    var ed = v[i].ed, q = v[i].abertos.length;
    h += `<div class="card card-lime">
      <div class="sec-title">Virada de edicao</div>
      <div class="muted2" style="margin-top:10px">
        O ${esc(ed.rot)} aconteceu em ${esc(dataBR(ed.dataEvento))} e ainda tem
        <b>${esc(fnPlural(q, "negocio aberto", "negocios abertos"))}</b> dessa edicao no funil.
      </div>
      <div class="tiny muted" style="margin-top:6px">Enquanto nao resolver, o total de patrocinio mostra dinheiro que nao existe mais.</div>
      <div style="margin-top:12px"><button class="btn btn-primary" data-a="funilVirada" data-k="${esc(ed.k)}">Resolver ${q === 1 ? "o negocio" : "os " + q + " negocios"}</button></div>
    </div>`;
  }
  return h;
}

/* ---------------------------------------------------------------------
   A TELA
   --------------------------------------------------------------------- */
TELAS.funil = function(){
  var k = fnFunilAtual();
  var f = FUNIL[k] || [];
  var tipo = null;
  for(var t=0;t<TIPOS.length;t++) if(TIPOS[t].k === k) tipo = TIPOS[t];

  // Agrupa por INDICE de estagio, nao pela chave crua: negocio com
  // estagio de outro funil cairia fora de todas as colunas e sumiria da
  // tela. Aqui ele aparece na primeira coluna com o selo de aviso.
  var abertos = lista("negocios").filter(function(n){ return n.status === "aberto" && n.tipo === k; });
  var grupos = [], i;
  for(i=0;i<f.length;i++) grupos.push([]);
  for(i=0;i<abertos.length;i++){
    var idx = idxEstagio(abertos[i]);
    (grupos[idx] || grupos[0]).push(abertos[i]);
  }
  var hoje = hojeISO();
  for(i=0;i<grupos.length;i++){
    grupos[i].sort(function(a, b){
      // Congelado afunda: nao da pra trabalhar hoje. O resto desce por
      // valorOrdem (invariante 11), que da valor presumido pra quem
      // ainda nao tem numero, senao a indicacao fresca nunca aparece.
      var ca = (a.congeladoAte && a.congeladoAte > hoje) ? 1 : 0;
      var cb = (b.congeladoAte && b.congeladoAte > hoje) ? 1 : 0;
      if(ca !== cb) return ca - cb;
      return valorOrdem(b) - valorOrdem(a);
    });
  }

  var h = "";
  // Cadastrar sem permissao fica VISIVEL e desabilitado, com o motivo
  // embaixo (invariante 12). Botao que some faz o gestor abrir o funil no
  // celular, nao ver acao nenhuma e achar que o CRM quebrou.
  var bloqNovo = motivoBloqueio("crm_negocios");

  /* cabecalho com a pilula segmentada */
  h += `<div class="card-head" style="margin-bottom:0">
    <div>
      <div class="sec-title">Funil ${esc(tipo ? tipo.rot : k)}</div>
      <div class="sec-sub">Um funil por vez. Ganho, perdido e encerrado nao sao coluna, sao status,
        senao fechar um negocio apagaria em que estagio ele morreu.</div>
    </div>
    <div class="pills">
      <button class="pill${k === "agencia" ? " on" : ""}" data-a="funilTrocar" data-k="agencia">Agencia</button>
      <button class="pill${k === "patrocinio" ? " on" : ""}" data-a="funilTrocar" data-k="patrocinio">Patrocinio</button>
      ${bloqNovo
        ? '<span style="display:flex;flex-direction:column;gap:3px;align-items:flex-start">' +
            '<button class="btn btn-sm" disabled>+ Negocio</button>' +
            '<span class="tiny" style="color:var(--text3)">' + esc(bloqNovo) + '</span></span>'
        : '<button class="btn btn-sm" data-a="funilNovo" data-k="' + esc(k) + '">+ Negocio</button>'}
    </div>
  </div>`;

  h += fnFaixaTotais(k);
  if(k === "patrocinio") h += fnFaixaVirada();

  if(!abertos.length){
    h += `<div class="empty">
      <div class="ei">▦</div>
      <div class="et">Nenhum negocio aberto ${esc(tipo ? "de " + tipo.rot.toLowerCase() : "")}</div>
      <div class="ex">O outro funil continua com os negocios dele, e a faixa de cima mostra os dois.</div>
      ${bloqNovo
        ? '<button class="btn btn-primary" disabled>Cadastrar um negocio</button>' +
          '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloqNovo) + '</div>'
        : '<button class="btn btn-primary" data-a="funilNovo" data-k="' + esc(k) + '">Cadastrar um negocio</button>'}
    </div>`;
    return h;
  }

  /* ---- QUADRO NO COMPUTADOR ---- */
  var cols = "";
  for(i=0;i<f.length;i++){
    var e = f[i], gs = grupos[i], somaV = 0, somaM = 0;
    for(var j=0;j<gs.length;j++){ somaV += valorRefDe(gs[j]); somaM += mrrDe(gs[j]); }
    var corpo = "";
    if(!gs.length){
      corpo = '<div class="kb-empty">Ninguem aqui.<br>Sai deste estagio quando:<br>' + esc(e.saida || "") + '</div>';
    } else {
      for(var c=0;c<gs.length;c++) corpo += cardNegocio(gs[c], "kanban");
    }
    // Coluna com negocio mas sem valor mostra "a definir", nunca R$ 0:
    // R$ 0 parece defeito e faz duvidar do resto dos numeros da tela.
    cols += `<section class="kb-col">
      <div class="kb-h">
        <div class="n"><span class="dot" style="background:var(--lime)"></span>${esc(e.rot)}</div>
        <div class="v">${gs.length && !somaV ? "a definir" : esc(brlCurto(somaV))}</div>
        <div class="c">${esc(fnPlural(gs.length, "negocio", "negocios"))}${k === "agencia" && somaM ? ", " + esc(brl(somaM)) + "/mes de MRR" : ""}, ${Math.round(e.p*100)}% de chance</div>
      </div>
      <div class="kb-body">${corpo}</div>
    </section>`;
  }
  h += '<div class="tiny muted no-mob">Toque no cartao pra mover de estagio. Nao existe arrastar: no celular o arraste dispara sozinho no meio da rolagem.</div>';
  h += '<div class="kb no-mob">' + cols + '</div>';

  /* ---- UM ESTAGIO POR VEZ NO CELULAR ----
     Como .only-mob vira um item do flex da area de conteudo, ele volta a
     ser bloco no celular e some no computador. */
  var sel = fnEstagioMob(k, f, grupos);
  var iSel = 0;
  for(i=0;i<f.length;i++) if(f[i].k === sel) iSel = i;
  var pills = "", lista_ = "";
  for(i=0;i<f.length;i++){
    var ee = f[i], gg = grupos[i], sv = 0;
    for(var m=0;m<gg.length;m++) sv += valorRefDe(gg[m]);
    // min-height de 44px porque essa barra E a navegacao do quadro no
    // celular: com os 30px da pilula, rolando na horizontal, o dedo erra
    // pro estagio do lado.
    pills += `<button class="pill${i === iSel ? " on" : ""}" data-a="funilEstagio" data-k="${esc(ee.k)}"
       style="flex:0 0 auto;min-height:44px">${esc(ee.rot)} <span style="opacity:.7">${
         !gg.length ? "0 negocios" : esc(fnPlural(gg.length, "negocio", "negocios")) + ", " + (sv ? esc(brlCurto(sv)) : "a definir")
       }</span></button>`;
  }
  var gsel = grupos[iSel] || [];
  if(!gsel.length){
    lista_ = '<div class="kb-empty">Ninguem em ' + esc(f[iSel].rot) + '.<br>Sai deste estagio quando:<br>' + esc(f[iSel].saida || "") + '</div>';
  } else {
    for(i=0;i<gsel.length;i++) lista_ += cardNegocio(gsel[i], "kanban");
  }
  h += `<div class="only-mob">
    <div class="pills" id="fnPills" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:7px">${pills}</div>
    <div class="tiny muted" style="margin:4px 0 10px">Sai de ${esc(f[iSel].rot)} quando: ${esc(f[iSel].saida || "")}</div>
    <div style="display:flex;flex-direction:column;gap:9px">${lista_}</div>
  </div>`;

  // Traz a pilula do estagio aberto pro campo de visao, senao quem esta
  // no ultimo estagio abre a tela vendo a barra no comeco.
  DEPOIS.push(function(){
    var p = document.querySelector('#fnPills .pill.on');
    if(p && p.scrollIntoView){ try{ p.scrollIntoView({ block:"nearest", inline:"center" }); }catch(e){} }
  });

  return h;
};

function fnEstagioMob(k, f, grupos){
  var atual = FN_ESTAGIO[k], i;
  for(i=0;i<f.length;i++) if(f[i].k === atual) return atual;
  for(i=0;i<f.length;i++) if(grupos[i].length) return f[i].k;   // primeiro estagio com gente
  return f.length ? f[0].k : "";
}

ACOES.funilTrocar = function(el){
  var k = el.getAttribute('data-k');
  guardar("funilAberto", k);
  ir("funil/" + k);
};
ACOES.funilEstagio = function(el){
  var k = fnFunilAtual();
  FN_ESTAGIO[k] = el.getAttribute('data-k');
  guardar("funilEstagio", FN_ESTAGIO);
  redesenhar();
};
ACOES.funilNovo = function(el){
  abrirNovoNegocio({ tipo: el.getAttribute('data-k') || fnFunilAtual() });
};
// Fecha a folha antes de navegar: o overlay nao morre sozinho na troca de
// hash e ficaria cobrindo a tela nova.
ACOES.funilAbrirNegocio = function(el){
  fecharFolha();
  ir("negocio/" + el.getAttribute('data-id'));
};

/* =====================================================================
   A FOLHA DE ESTAGIO, O CAMINHO UNICO DE MOVER

   NAO EXISTE ARRASTAR na versao 1, e nao existe atalho de segurar: no
   iOS o long press dispara sozinho no meio de uma rolagem e move o
   negocio sem ninguem ver o toast. Dois toques com o pedagio pago
   (escolher o estagio, confirmar o proximo passo) funcionam igual no
   computador e no celular, e o Desfazer de 8 segundos cobre o erro.
   ===================================================================== */
function abrirFolhaEstagio(id){
  var n = achar("negocios", id);
  if(!n){ toast("Negocio nao encontrado", "bad"); return; }
  var f = FUNIL[n.tipo] || [];
  var iAtual = idxEstagio(n);
  var parado = diasVencido(n.estagioDesde || n.criadoEm);
  var motivo = motivoBloqueio("crm_negocios");

  var linhas = "";
  for(var i=0;i<f.length;i++){
    var e = f[i], atual = (i === iAtual);
    var selo = atual
      ? '<span class="tag tag-lime">aqui agora</span><span class="tiny muted">' +
        esc(fnPlural(parado, "dia", "dias")) + ' neste estagio, o limite e ' + e.teto + ' dias</span>'
      : (i < iAtual ? '<span class="tag">voltar</span>' : '');
    var dentro = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="dot" style="background:${atual ? "var(--lime)" : "var(--text3)"}"></span>
        <b style="font-family:var(--disp);font-size:15px;letter-spacing:.4px;text-transform:uppercase">
          ${(i+1)}. ${esc(e.rot)}</b>
        <span class="tiny muted">${Math.round(e.p*100)}% de chance</span>
        ${selo}
      </div>
      <div class="tiny muted" style="margin-top:5px;white-space:normal;line-height:1.45">
        Sai daqui quando: ${esc(e.saida || "")}</div>`;
    var caixa = "display:block;text-align:left;padding:11px 13px;width:100%;";
    if(atual){
      // O estagio de agora e uma caixa, nao um botao desabilitado: com
      // opacity de botao morto, justamente a linha de referencia da folha
      // fica a mais apagada da tela.
      linhas += '<div class="btn" style="' + caixa + 'border-color:var(--lime);background:var(--lime-dim);cursor:default">' +
                dentro + '</div>';
    } else {
      // Acao sem permissao fica VISIVEL e desabilitada, com o motivo
      // embaixo. Botao que some faz o gestor achar que o CRM quebrou.
      var att = motivo ? 'disabled'
        : 'data-a="funilEscolher" data-id="' + esc(n.id) + '" data-k="' + esc(e.k) + '"';
      linhas += '<button class="btn btn-block" ' + att + ' style="' + caixa + '">' + dentro + '</button>';
    }
  }

  var corpo = `<div class="form">
    <div class="tiny muted">${esc(n.empresa || "")} ${n.titulo ? "&middot; " + esc(n.titulo) : ""}<br>
      Funil de ${esc(n.tipo === "agencia" ? "agencia" : "patrocinio")}, ${f.length} estagios.
      ${esc(porQue(n))}</div>
    ${linhas}
    ${motivo ? '<div class="tiny" style="color:var(--text3)">' + esc(motivo) + '</div>' : ''}
    <div class="tiny muted">Pular estagio pode. Voltar tambem pode, e vira uma linha na linha do tempo.</div>
  </div>`;

  folha("Mover de estagio",
    corpo,
    '<button class="btn btn-ghost" data-a="fecharFolha">Fechar</button>' +
    '<button class="btn" data-a="funilAbrirNegocio" data-id="' + esc(n.id) + '">Abrir o negocio</button>');
}

ACOES.funilMover = function(el){ abrirFolhaEstagio(el.getAttribute('data-id')); };
ACOES.funilEscolher = function(el){
  fnPasso2(el.getAttribute('data-id'), el.getAttribute('data-k'));
};

/* Passo 2, NA MESMA FOLHA: o proximo passo ja sugerido pelo estagio de
   DESTINO, e os campos que o destino exige. Um botao Salvar. */
function fnPasso2(id, novoK){
  var n = achar("negocios", id);
  if(!n){ toast("Negocio nao encontrado", "bad"); return; }
  var f = FUNIL[n.tipo] || [];
  var iAtual = idxEstagio(n), iNovo = 0;
  for(var i=0;i<f.length;i++) if(f[i].k === novoK) iNovo = i;
  var eAtual = f[iAtual] || { rot:"Estagio desconhecido" };
  var eNovo  = f[iNovo]  || { rot:"" };
  var motivo = motivoBloqueio("crm_negocios");

  // A sugestao de proximo passo tem que ser a do estagio de DESTINO, nao
  // a do atual: quem entra em Proposta cobra resposta, nao envia de novo.
  // O proximo passo ANTIGO sai da copia de proposito: blocoProxPasso da
  // preferencia ao que ja esta gravado no negocio, e com ele dentro a
  // folha reapresentaria o passo que acabou de ser cumprido, com a data
  // vencida, em vez da sugestao do destino. O pedagio e passo NOVO.
  var simulado = {};
  for(var kk in n) if(Object.prototype.hasOwnProperty.call(n, kk)) simulado[kk] = n[kk];
  simulado.estagio = novoK;
  simulado.proxTipo = ""; simulado.proxData = "";
  simulado.proxTexto = ""; simulado.proxHora = "";

  var corpo = `<form class="form" data-a="funilSalvarEstagio" data-id="${esc(n.id)}" data-k="${esc(novoK)}">
    <div class="card" style="padding:12px 14px;background:var(--card2)">
      <div class="tiny muted">${esc(n.empresa || "")}</div>
      <div style="font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.4px;margin-top:2px">
        ${esc(eAtual.rot)} <span style="color:var(--lime)">&rsaquo;</span> ${esc(eNovo.rot)}</div>
      <div class="tiny muted" style="margin-top:4px">
        ${iNovo < iAtual ? "Voltar estagio pode, e vira linha na linha do tempo." :
          iNovo > iAtual + 1 ? "Pular estagio pode: o sistema guarda o maior estagio alcancado." :
          "Avanco de um estagio."}</div>
    </div>
    ${fnGateProposta(n, iNovo)}
    ${blocoProxPasso("fe", simulado, true)}
    <div class="fld"><div class="err" id="feErr"></div></div>
    <p class="tiny muted">Toda mudanca de estagio pede um proximo passo novo. E o pedagio de mover o
      cartao, e e o que impede o funil de virar decoracao que muda de cor.</p>
  </form>`;

  var rodape = '<button class="btn btn-ghost" data-a="funilMover" data-id="' + esc(n.id) + '">Voltar</button>' +
    (motivo
      ? '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">' +
          '<button class="btn btn-primary" disabled>Salvar</button>' +
          '<span class="tiny" style="color:var(--text3)">' + esc(motivo) + '</span></div>'
      : '<button class="btn btn-primary" data-a="funilSalvarEstagio" data-id="' + esc(n.id) +
        '" data-k="' + esc(novoK) + '">Salvar</button>');

  folha("Mover pra " + (eNovo.rot || "novo estagio"), corpo, rodape);
}

/* Entrar em Proposta (ou em qualquer estagio depois dela) exige fee,
   meses e previsao confirmada. Vale pra frente toda e nao so pra
   ag_proposta porque pular de Diagnostico direto pra Negociacao passaria
   por cima da regra, e e justamente onde o valor chutado entra e envenena
   a previsao do mes. Antes disso o valor e opcional de proposito. */
function fnGateProposta(n, iNovo){
  if(n.tipo !== "agencia") return "";
  var iProp = 0, f = FUNIL.agencia;
  for(var i=0;i<f.length;i++) if(f[i].k === "ag_proposta") iProp = i;
  if(iNovo < iProp) return "";

  var ag = n.ag || {};
  var faltaMrr   = !(ag.mrr > 0);
  var faltaMeses = (typeof ag.meses !== "number");
  var faltaPrev  = !n.prevFechamento || n.prevEstimada === true;
  if(!faltaMrr && !faltaMeses && !faltaPrev) return "";

  var opcoes = [3, 6, 12, 18, 24];
  // Contrato com duracao fora da lista (9 meses, por exemplo) entra como
  // opcao propria. Sem ela nenhum <option> nasce marcado, o navegador
  // mostra o primeiro e salvar trocaria 9 meses por 3 sem ninguem ver,
  // encolhendo o valor do contrato inteiro na previsao.
  if(typeof ag.meses === "number" && ag.meses > 0 && opcoes.indexOf(ag.meses) === -1){
    opcoes.push(ag.meses);
    opcoes.sort(function(x, y){ return x - y; });
  }
  var sel = "";
  for(var j=0;j<opcoes.length;j++){
    sel += '<option value="' + opcoes[j] + '"' + (ag.meses === opcoes[j] ? " selected" : "") + '>' +
           opcoes[j] + ' meses</option>';
  }
  sel += '<option value="0"' + (ag.meses === 0 ? " selected" : "") + '>indeterminado (conta 12 meses)</option>';

  return `<div class="card" style="padding:14px;border-color:var(--lime-border)">
    <div class="h3">Antes de entrar em proposta</div>
    <div class="tiny muted" style="margin-bottom:12px">Proposta em analise so existe com numero.
      Fee chutado no dia 1 vira R$ 1.000 de mentira e envenena a previsao do mes.</div>
    <div class="grid2">
      <div class="fld">
        <label>Fee por mes (R$)</label>
        <input class="inp" id="feg_mrr" inputmode="decimal" placeholder="3.500"
               value="${ag.mrr > 0 ? esc(String(ag.mrr)) : ""}">
      </div>
      <div class="fld">
        <label>Duracao do contrato</label>
        <select class="inp" id="feg_meses">
          ${faltaMeses ? '<option value="">escolha</option>' : ''}
          ${sel}
        </select>
      </div>
    </div>
    <div class="fld" style="margin-top:12px">
      <label>Previsao de fechamento</label>
      <input class="inp" id="feg_prev" type="date" value="${esc(String(n.prevFechamento || "").slice(0,10))}">
      <div class="hint">${n.prevEstimada === true ? "Hoje esta como data estimada pelo sistema. Confirme ou ajuste." : "Confirme a data com o cliente."}</div>
    </div>
  </div>`;
}

ACOES.funilSalvarEstagio = function(el){
  var id = el.getAttribute('data-id'), novoK = el.getAttribute('data-k');
  var n = achar("negocios", id);
  var err = document.getElementById('feErr');
  function ruim(msg){ if(err) err.textContent = msg; else toast(msg, "bad"); }
  if(!n){ ruim("Negocio nao encontrado."); return; }

  var motivo = motivoBloqueio("crm_negocios");
  if(motivo){ toast(motivo, "bad"); return; }

  var f = FUNIL[n.tipo] || [], iNovo = 0, i;
  for(i=0;i<f.length;i++) if(f[i].k === novoK) iNovo = i;
  var eNovo = f[iNovo] || { rot:"" };
  var eAtual = estagioDe(n);

  var dados = {
    estagio: novoK,
    estagioDesde: hojeISO(),
    maiorEstagio: Math.max(Number(n.maiorEstagio || 0), iNovo)
  };
  var antes = {
    estagio: n.estagio || "",
    estagioDesde: n.estagioDesde || hojeISO(),
    maiorEstagio: Number(n.maiorEstagio || 0),
    proxTipo: n.proxTipo || "",
    proxData: n.proxData || "",
    proxTexto: n.proxTexto || "",
    proxHora: n.proxHora || ""
  };

  /* campos que o estagio de proposta exige */
  var campoMrr = document.getElementById('feg_mrr');
  if(campoMrr){
    var mrr = lerValor(campoMrr.value);
    var mesesTxt = (document.getElementById('feg_meses') || {}).value;
    var prev = (document.getElementById('feg_prev') || {}).value;
    if(!(mrr > 0)){ ruim("O fee por mes precisa de um valor pra entrar em proposta."); return; }
    if(mesesTxt === "" || mesesTxt == null){ ruim("Escolha a duracao do contrato."); return; }
    if(!prev){ ruim("Confirme a previsao de fechamento."); return; }
    var ag = {};
    for(var a in (n.ag || {})) if(Object.prototype.hasOwnProperty.call(n.ag, a)) ag[a] = n.ag[a];
    ag.mrr = Math.round(mrr);
    ag.meses = Number(mesesTxt);
    // mrrInicial e gravado uma vez e nunca sobrescrito: e o que mostra o
    // desconto que a negociacao comeu.
    if(!(ag.mrrInicial > 0)) ag.mrrInicial = ag.mrr;
    dados.ag = ag;
    dados.prevFechamento = prev;
    dados.prevEstimada = false;
    dados.valorRef = valorRefDe({ tipo:n.tipo, ag:ag, pt:n.pt });
    antes.ag = n.ag || null;
    antes.prevFechamento = n.prevFechamento || "";
    antes.prevEstimada = n.prevEstimada === true;
    antes.valorRef = Number(n.valorRef || 0);
  }

  /* O pedagio: proximo passo novo, com tipo e data. A caixinha "Marcar o
     proximo passo" do bloco pode ser desmarcada, e nesse caso lerProxPasso
     devolve ok:true com os campos vazios de proposito, porque em outras
     telas marcar o passo e opcional. Aqui nao e: sem conferir o ligado,
     desmarcar viraria a saida pra mover o cartao sem pagar o pedagio, e o
     funil volta a ser decoracao que muda de cor (regra 3 da secao 4.4). */
  var p = lerProxPasso("fe");
  if(!p || !p.ok || p.ligado === false || !p.proxTipo || !p.proxData){
    ruim((p && p.erro) || "Marque o proximo passo com tipo e data. Toda mudanca de estagio pede um.");
    return;
  }
  dados.proxTipo  = p.proxTipo;
  dados.proxData  = p.proxData;
  dados.proxTexto = p.proxTexto || "";
  dados.proxHora  = p.proxHora || "";

  // semToque:true porque mover o cartao nao e falar com o cliente. Sem
  // ele, registrarAtividade carimba ultimoToqueEm com hoje e o semaforo
  // passa a dizer "0 dias sem contato" pra quem so arrumou o funil.
  var ativ = {
    tipo: "estagio",
    semToque: true,
    de: n.estagio || "",
    para: novoK,
    quando: hojeISO(),
    ts: Date.now(),
    texto: "De " + (eAtual.rot || "?") + " para " + (eNovo.rot || "?") +
           (iNovo < idxEstagio(n) ? " (voltou)" : "")
  };

  gravar("crm_negocios", id, dados)
    .then(function(){ return registrarAtividade(id, ativ); })
    .then(function(){
      fecharFolha();
      // Toast so depois do servidor confirmar (invariante 8), com
      // Desfazer de 8 segundos em vez de confirmacao dupla.
      comDesfazer("Movido pra " + (eNovo.rot || "novo estagio"), "crm_negocios", id, antes);
      redesenhar();
    })
    .catch(function(e){ ruim("Nao deu pra salvar: " + ((e && e.message) || "erro")); });
};

/* =====================================================================
   FOLHA DA VIRADA DE EDICAO
   Quem passou de Mapeado se resolve um a um, porque cada um desses e uma
   conversa real que merece uma decisao. Quem ficou em Mapeado sai em
   LOTE, e essa e a unica excecao da casa a regra do nada em massa:
   aqui nao e silenciar alarme, e fechar um ciclo que acabou de verdade
   numa data conhecida.
   ===================================================================== */
function fnFolhaVirada(edK){
  var ed = edicaoDe(edK);
  if(!ed){ toast("Edicao nao encontrada", "bad"); return; }
  var prox = fnProximaEdicao(ed);
  var motivo = motivoBloqueio("crm_negocios");

  var abertos = lista("negocios").filter(function(n){
    return n.status === "aberto" && n.tipo === "patrocinio" && n.pt && n.pt.edicao === edK;
  });
  var passou = [], mapeados = [], i;
  for(i=0;i<abertos.length;i++){
    if(idxEstagio(abertos[i]) > 0) passou.push(abertos[i]); else mapeados.push(abertos[i]);
  }
  passou.sort(function(a,b){ return valorOrdem(b) - valorOrdem(a); });
  mapeados.sort(function(a,b){ return valorOrdem(b) - valorOrdem(a); });

  var h = `<div class="form">
    <div class="tiny muted">${esc(ed.rot)} aconteceu em ${esc(dataBR(ed.dataEvento))}.
      ${esc(fnPlural(abertos.length, "negocio segue aberto", "negocios seguem abertos"))} nessa edicao.</div>`;

  if(passou.length){
    h += '<div class="sec-title">Um a um, ' + esc(fnPlural(passou.length, "negocio", "negocios")) + '</div>' +
         '<div class="sec-sub">Esses sairam de Mapeado, ou seja, teve conversa. Cada um merece uma decisao.</div>';
    for(i=0;i<passou.length;i++){
      var n = passou[i], e = estagioDe(n), v = (n.pt && n.pt.valor) || 0;
      var btnMigrar = (motivo || !prox)
        ? '<button class="btn btn-sm" disabled>Migrar</button>'
        : '<button class="btn btn-sm" data-a="funilMigrar" data-id="' + esc(n.id) + '" data-e="' + esc(prox.k) +
          '" data-de="' + esc(edK) + '">Migrar pra ' + esc(prox.rot) + '</button>';
      var btnPerder = motivo
        ? '<button class="btn btn-sm btn-danger" disabled>Perder</button>'
        : '<button class="btn btn-sm btn-danger" data-a="funilPerder" data-id="' + esc(n.id) +
          '" data-de="' + esc(edK) + '">Perder</button>';
      h += `<div class="card" style="padding:12px 14px">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
          <b class="truncate" style="flex:1;min-width:120px;font-family:var(--disp);font-size:15px;
             text-transform:uppercase;letter-spacing:.4px">${esc(n.empresa || "sem empresa")}</b>
          <span class="nowrap" style="font-family:var(--disp);font-weight:800;color:var(--lime)">
            ${v > 0 ? esc(brl(v)) : "valor a definir"}</span>
        </div>
        <div class="tiny muted" style="margin-top:3px">${esc(e.rot)}, ${esc(fnPlural(diasVencido(n.estagioDesde || n.criadoEm), "dia", "dias"))} parado</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${btnPerder}${btnMigrar}</div>
        ${(!prox && !motivo) ? '<div class="tiny" style="color:var(--text3);margin-top:6px">Nao ha edicao futura cadastrada pra onde migrar.</div>' : ''}
        ${motivo ? '<div class="tiny" style="color:var(--text3);margin-top:6px">' + esc(motivo) + '</div>' : ''}
      </div>`;
    }
  }

  if(mapeados.length){
    h += '<div class="sec-title">Em lote, ' + esc(fnPlural(mapeados.length, "negocio", "negocios")) + '</div>' +
         '<div class="sec-sub">Ninguem nomeado da marca respondeu. Fechar como "perdeu a janela do evento".</div>' +
         '<div class="pills" style="margin-top:2px">' +
           '<button class="pill" data-a="funilLoteTodos" data-v="1">Marcar todos</button>' +
           '<button class="pill" data-a="funilLoteTodos" data-v="0">Desmarcar todos</button>' +
         '</div>';
    for(i=0;i<mapeados.length;i++){
      var mp = mapeados[i];
      h += `<label style="display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);min-height:44px">
        <input type="checkbox" class="fnLote" data-id="${esc(mp.id)}" checked style="width:20px;height:20px;flex:0 0 20px">
        <span class="truncate" style="flex:1;min-width:0">${esc(mp.empresa || "sem empresa")}
          <span class="tiny muted">${esc(quando(mp.criadoEm))}</span></span>
        <span class="tiny muted nowrap">${(mp.pt && mp.pt.valor) ? esc(brlCurto(mp.pt.valor)) : "sem valor"}</span>
      </label>`;
    }
    h += '<div class="tiny muted">Fechar em lote nao tem o Desfazer de 8 segundos. Confira a lista antes.</div>';
    if(motivo) h += '<div class="tiny" style="color:var(--text3)">' + esc(motivo) + '</div>';
  }

  h += '</div>';

  var rodape = '<button class="btn btn-ghost" data-a="fecharFolha">Fechar</button>';
  if(mapeados.length){
    rodape += motivo
      ? '<button class="btn btn-primary" disabled>Fechar os ' + mapeados.length + ' negocios</button>'
      : '<button class="btn btn-primary" data-a="funilLote" data-k="' + esc(edK) + '">Fechar os ' +
        mapeados.length + ' negocios que nao sairam de Mapeado</button>';
  }
  folha("Virada de edicao, " + ed.rot, h, rodape);
}

ACOES.funilVirada = function(el){ fnFolhaVirada(el.getAttribute('data-k')); };
ACOES.funilLoteTodos = function(el){
  var v = el.getAttribute('data-v') === "1";
  var cx = document.querySelectorAll('.fnLote');
  for(var i=0;i<cx.length;i++) cx[i].checked = v;
};

// Fecha um negocio como "perdeu a janela do evento". Regra 7 da secao
// 4.4: fechar negocio que veio de indicacao cria a tarefa de avisar quem
// indicou, ganho ou perdido, porque e a mensagem que mais gera a proxima
// indicacao e a que mais se esquece de mandar.
// txtIndicador troca o texto dessa tarefa quando o fechamento nao foi uma
// perda de verdade: quem migrou pra proxima edicao nao "nao saiu", e a
// pessoa vai ler esse texto no Hoje sem o negocio na frente.
function fnFecharPerdido(id, edK, obs, txtIndicador){
  var n = achar("negocios", id);
  if(!n) return Promise.resolve();

  // Guarda explicita: quem so le nao fecha negocio. Sem ela, o caminho
  // abaixo registraria a nota (que o gestor pode) e NAO fecharia o
  // negocio (que ele nao pode), deixando a tela dizendo que fechou.
  var bloq = motivoBloqueio("crm_negocios");
  if(bloq){ toast(bloq, "bad"); return Promise.reject(new Error(bloq)); }

  var ed = edicaoDe(edK);
  var motivo = obs || ("Fechado na virada da edicao " + ((ed && ed.rot) || edK));
  var dados = {
    status: "perdido",
    motivoPerda: "janela_evento",
    motivoPerdaObs: motivo,
    fechadoEm: hojeISO(),
    proxTipo: "", proxData: "", proxHora: "", proxTexto: ""
  };

  // Uma chamada so, com negocioExtra: a linha entra na linha do tempo e o
  // negocio e atualizado junto. Antes isso era um gravar() direto, e o
  // negocio fechado pela virada de edicao ficava SEM NENHUMA linha no
  // historico, enquanto o mesmo fechamento feito pela tela do negocio
  // deixava. Como nao existe colecao de auditoria (secao 10 do SPEC), a
  // linha do tempo E o log: buraco nela e buraco no log.
  // semToque porque virada de edicao nao e contato com o cliente, e
  // carimbar contato que nao houve envenena o alerta de esfriamento.
  return registrarAtividade(id, {
    tipo: "nota",
    texto: motivo,
    semToque: true,
    negocioExtra: dados
  }).then(function(){
    // A regra 7 da secao 4.4 e pela ORIGEM, nao por ter indicador
    // cadastrado. Negocio que veio de indicacao mas ficou so com o nome
    // digitado tambem gera o aviso: e a mensagem que mais traz a proxima
    // indicacao e a que mais se esquece de mandar.
    if(n.origem !== "indicacao") return;
    var c = n.indicadorId ? achar("contatos", n.indicadorId) : null;
    var tid = idNovo("t");
    return gravar("crm_tarefas", tid, {
      id: tid,
      tipo: "avisar_indicador",
      texto: String(txtIndicador || ("Avisar " + (n.indicadorNome || "quem indicou") + " que o negocio da " +
             (n.empresa || "empresa") + " nao saiu nessa edicao")).slice(0,160),
      data: somaDias(hojeISO(), 1),
      contatoId: n.indicadorId || "",
      contatoNome: n.indicadorNome || "",
      contatoTel: (c && c.tel) || "",
      negocioId: n.id,
      negocioTitulo: n.titulo || "",
      feita: false,
      criadoEm: hojeISO(),
      criadoPor: (SESSAO && SESSAO.nome) || "",
      arquivado: false
    }).catch(function(){ /* o negocio ja fechou; falha na tarefa nao vira "nao deu pra fechar" */ });
  });
}

ACOES.funilPerder = function(el){

// O lote: uma escrita por negocio, em fila, pra nao disparar dezenas de
// gravacoes ao mesmo tempo no 4G do estacionamento. Fecha pelo mesmo
// caminho do um a um, porque a regra 7 da secao 4.4 nao abre excecao pro
// lote: negocio que veio de indicacao gera o aviso pra quem indicou,
// ganho ou perdido. Sao poucos, ja que so conta quem tem indicador, e a
// fila do Hoje tem teto proprio de 8 cartoes.
ACOES.funilLote = function(el){
  var edK = el.getAttribute('data-k');
  var motivo = motivoBloqueio("crm_negocios");
  if(motivo){ toast(motivo, "bad"); return; }
  var cx = document.querySelectorAll('.fnLote'), ids = [];
  for(var i=0;i<cx.length;i++) if(cx[i].checked) ids.push(cx[i].getAttribute('data-id'));
  if(!ids.length){ toast("Nenhum marcado", "bad"); return; }

  var ed = edicaoDe(edK), feitos = 0;
  var fila = ids.reduce(function(p, id){
    return p.then(function(){
      return fnFecharPerdido(id, edK, "Nao saiu de Mapeado ate o " + ((ed && ed.rot) || edK))
        .then(function(){ feitos++; });
    });
  }, Promise.resolve());

  fila.then(function(){
    fecharFolha();
    toast(fnPlural(feitos, "negocio fechado", "negocios fechados"), "ok");
    redesenhar();
  }).catch(function(e){
    toast("Parou em " + fnPlural(feitos, "negocio", "negocios") + ": " + ((e && e.message) || "erro"), "bad");
    redesenhar();
  });
};
