/* =====================================================================
   TELA: NEGÓCIO (o detalhe)
   ===================================================================== */

/* Faixa, valor herói, stepper e ações. Tudo o que decide o que fazer com
   esse negócio cabe aqui, sem rolar a tela. */
function ngBlocoTopo(n){
  var e = estagioDe(n), f = FUNIL[n.tipo] || [], i = idxEstagio(n);
  var bloq = motivoBloqueio("crm_negocios");
  var congelado = n.congeladoAte && n.congeladoAte > hojeISO();

  var tags = '<span class="tag tag-lime">' + esc(ngRotTipo(n.tipo)) + '</span>';
  if(n.tipo === "patrocinio" && n.pt && n.pt.edicao){
    var ed = edicaoDe(n.pt.edicao);
    if(ed) tags += ' <span class="tag tag-purple">' + esc(ed.rot) + '</span>';
  }
  // Dado antigo pode chegar sem a data ou sem o motivo. Escrever "Ganho em"
  // e parar ali, ou "Perdido," e parar ali, é pior que não escrever nada:
  // parece campo quebrado e não diz o que aconteceu.
  var motPerda = (motivoPerdaDe(n.motivoPerda) || { rot:"" }).rot;
  if(n.status === "ganho")      tags += ' <span class="tag tag-green">' +
    (n.fechadoEm ? 'Ganho em ' + esc(dataBR(n.fechadoEm)) : 'Ganho, sem data de fechamento') + '</span>';
  if(n.status === "perdido")    tags += ' <span class="tag tag-red">' +
    (motPerda ? 'Perdido, ' + esc(motPerda) : 'Perdido, sem motivo registrado') + '</span>';
  if(n.status === "encerrado")  tags += ' <span class="tag">' +
    (n.encerradoEm ? 'Encerrado em ' + esc(dataBR(n.encerradoEm)) : 'Encerrado, sem data') + '</span>';
  if(congelado)                 tags += ' <span class="tag tag-blue">Congelado até ' + esc(dataBR(n.congeladoAte)) + '</span>';
  if(PENDENTES[n.id])           tags += ' <span class="tag tag-warn">Não enviado ainda</span>';

  /* Valor herói. Agência mostra R$/mês porque é assim que se negocia fee,
     e o contrato inteiro vai embaixo em cinza. */
  var heroi = ngValorTxt(n), sub;
  // R$ 0 gigante em verde não é o valor do negócio, é a ausência dele. O
  // SPEC (seção 4.1) pede valor opcional até a proposta, e dizer "valor a
  // definir" é a única leitura honesta enquanto ninguém digitou nada.
  var semValor = n.status === "aberto" && valorRefDe(n) <= 0;
  if(n.tipo === "agencia"){
    var meses = (n.ag && n.ag.meses) || 0;
    sub = brl(valorRefDe(n)) + (meses ? " em " + meses + " meses" : " em 12 meses (contrato indeterminado, contado como 12)");
  } else {
    sub = ((n.pt && n.pt.cota) ? "Cota " + n.pt.cota : "Cota não definida");
    if(n.pt && n.pt.permuta > 0) sub += " · mais " + brl(n.pt.permuta) + " em permuta, que nunca soma com o dinheiro";
  }
  if(semValor){
    heroi = "valor a definir";
    sub = n.tipo === "agencia" ? "o fee mensal em R$ ainda não foi preenchido"
                               : "o valor da cota em R$ ainda não foi preenchido";
  }
  var ponderado = Math.round(valorRefDe(n) * e.p);
  // Chance do estágio só faz sentido em negócio aberto: escrever "85% de
  // chance" embaixo de um negócio já ganho é a tela mentindo por descuido.
  var linhaChance = n.status !== "aberto"
    ? '<div class="small muted2" style="margin-top:4px">Negócio ' + esc(n.status) +
        ', a chance do estágio não vale mais para ele</div>'
    : (semValor
        ? '<div class="small muted2" style="margin-top:4px">' + pct(e.p*100) +
            ' de chance no estágio, e sem valor ele entra na previsão como R$ 0</div>'
        : '<div class="small muted2" style="margin-top:4px">' + pct(e.p*100) + ' de chance no estágio, ' +
            esc(brl(ponderado)) + ' ponderado</div>');

  /* "pediu 220.000, está em 180.000". É o número que o dono quer ver
     antes de aprovar mais um desconto. */
  var desconto = "";
  if(n.tipo === "patrocinio" && n.pt && n.pt.valorInicial > 0 && n.pt.valorInicial !== n.pt.valor){
    desconto = ngLinhaDesconto(n.pt.valorInicial, n.pt.valor || 0, "");
  } else if(n.tipo === "agencia" && n.ag && n.ag.mrrInicial > 0 && n.ag.mrrInicial !== n.ag.mrr){
    desconto = ngLinhaDesconto(n.ag.mrrInicial, n.ag.mrr || 0, "/mês");
  }

  /* Stepper. Clicar em qualquer ponto abre a folha de estágio, que é o
     caminho único de mover: escolher numa lista funciona com uma mão só,
     arrastar não. */
  var dots = "";
  for(var k=0;k<f.length;k++){
    if(k) dots += '<span class="step-l' + (k <= i ? ' feito' : '') + '"></span>';
    dots += '<span class="step-p' + (k < i ? ' feito' : (k === i ? ' atual' : '')) + '"></span>';
  }
  var diasEstagio = diasVencido(n.estagioDesde);

  var acoes = "";
  if(n.status === "aberto"){
    acoes =
      '<button class="btn btn-primary" data-a="ngFocarRegistro" data-id="' + esc(n.id) + '">Registrar</button>' +
      '<button class="btn" data-a="ngGanho" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>✓ Ganho</button>' +
      '<button class="btn btn-danger" data-a="ngPerdido" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>✕ Perdido</button>' +
      (congelado
        ? '<button class="btn" data-a="ngDescongelar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Descongelar</button>'
        : '<button class="btn" data-a="ngCongelar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>❄ Congelar</button>');
  } else if(n.status === "ganho" && n.tipo === "agencia"){
    acoes =
      '<button class="btn btn-primary" data-a="ngRenovar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Renovar contrato</button>' +
      '<button class="btn" data-a="ngEncerrar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Encerrar contrato</button>';
  } else {
    acoes = '<button class="btn" data-a="ngFocarRegistro" data-id="' + esc(n.id) + '">Registrar</button>';
  }

  return '<div class="card">' +
    '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="negocios">‹ Negócios</button>' +
    '<div class="h1" style="margin-top:10px;text-transform:uppercase">' + esc(n.empresa) + '</div>' +
    '<div class="muted2" style="margin-bottom:8px">' + esc(n.titulo) + '</div>' +
    '<div class="pills" style="margin-bottom:14px">' + tags + '</div>' +

    '<div class="num" style="font-size:38px;color:var(--lime)">' + esc(heroi) + '</div>' +
    '<div class="tiny muted" style="margin-top:5px">' + esc(sub) + '</div>' +
    linhaChance +
    desconto +

    '<div style="margin-top:2px">' +
      // width:100% em linha porque botão tem largura de conteúdo mesmo com
      // display:flex, e sem isso o stepper encolhe pro tamanho das bolinhas.
      /* Em negócio fechado o stepper vira só desenho.
         Ele só ficava desabilitado por PERMISSÃO, então num negócio
         ganho, perdido ou encerrado continuava clicável e convidava a
         trocar o estágio. A folha já recusa a gravação, mas um botão que
         convida pra uma ação que nunca acontece é defeito por si só: em
         negócio fechado o estágio é o registro de ONDE ele morreu, e
         essa é a única informação que explica onde o funil vaza.       */
      '<button class="step" data-a="ngEstagio" data-id="' + esc(n.id) + '"' +
        ((bloq || n.status !== "aberto") ? ' disabled' : '') +
        ' style="width:100%;text-align:left" aria-label="Trocar de estágio">' + dots + '</button>' +
      '<div class="step-rot">' +
        '<b>' + esc(e.rot) + '</b>, há ' + diasEstagio + (diasEstagio===1?' dia':' dias') +
        '<span class="muted"> (o teto deste estágio é ' + e.teto + ' dias)</span></div>' +
      (n.status !== "aberto"
        ? '<div class="tiny" style="color:var(--text3)">Negócio fechado: o estágio fica congelado aqui de propósito, ' +
          'porque é ele que diz onde o negócio parou.</div>'
        : (bloq ? '<div class="tiny" style="color:var(--text3)">' + esc(bloq) + '</div>' : '')) +
      (n.status === "aberto"
        ? '<div class="tiny muted">Saída: ' + esc(e.saida || "") + '</div>'
        : '<div class="tiny muted">Estava aqui quando fechou. É a única informação que explica onde o funil vaza.</div>') +
    '</div>' +

    '<div class="pills" style="margin-top:16px">' + acoes + '</div>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

function ngLinhaDesconto(de, para, un){
  var queda = de > 0 ? Math.round((de - para) / de * 100) : 0;
  var cor = para < de ? "var(--warn)" : "var(--green)";
  return '<div class="small" style="margin-top:7px;color:' + cor + '">' +
    'pediu ' + esc(brl(de) + un) + ', está em ' + esc(brl(para) + un) +
    ' (' + (queda > 0 ? "desconto de " + pct(queda) : "aumento de " + pct(-queda)) + ')</div>';
}

/* O próximo passo em destaque. Negócio aberto sem próximo passo é o
   estado mais perigoso do CRM, então ele aparece em amarelo e com botão,
   nunca como um campo vazio discreto. */
function ngBlocoProx(n){
  var bloq = motivoBloqueio("crm_negocios");
  if(n.status !== "aberto") return "";

  if(!n.proxData){
    return '<div class="card" style="border-color:rgba(255,184,0,.35)">' +
      '<div class="sec-title" style="border-left-color:var(--warn)">Sem próximo passo</div>' +
      '<div class="small muted2" style="margin:10px 0">Negócio aberto sem data marcada não aparece em fila nenhuma, e some do dia a dia sem ninguém decidir que ele morreu.</div>' +
      '<button class="btn btn-primary btn-block" data-a="ngTrocarProx" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Marcar o próximo passo</button>' +
      (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
    '</div>';
  }

  var p = proxTipoDe(n.proxTipo) || { rot:"Próximo passo", ic:"•" };
  var venc = diasVencido(n.proxData);
  var cor = venc >= 1 ? "var(--red)" : (venc >= -1 ? "var(--warn)" : "var(--lime)");
  var quandoTxt = venc >= 1 ? ("venceu há " + venc + (venc===1?" dia":" dias"))
                : venc === 0 ? "é hoje" : quando(n.proxData);

  return '<div class="card card-lime">' +
    '<div class="card-head" style="margin-bottom:10px">' +
      '<div class="sec-title">Próximo passo' + ajuda("proximo_passo") + '</div>' +
      '<span class="tag" style="color:' + cor + ';border-color:' + cor + '">' + esc(quandoTxt) + '</span>' +
    '</div>' +
    '<div class="h2" style="text-transform:none">' + p.ic + ' ' + esc(p.rot) + '</div>' +
    '<div class="small muted2" style="margin-top:4px">' + esc(dataExtenso(n.proxData)) +
      (n.proxHora ? ', às ' + esc(n.proxHora) : '') + '</div>' +
    (n.proxTexto ? '<div class="small" style="margin-top:7px">' + esc(n.proxTexto) + '</div>' : '') +
    ((n.vezesAdiado||0) >= 1
      ? '<div class="tiny" style="margin-top:7px;color:' + ((n.vezesAdiado||0) >= ADIAMENTOS_PARA_RISCO ? 'var(--red)' : 'var(--text3)') +
        '">já foi adiado ' + n.vezesAdiado + (n.vezesAdiado===1?' vez':' vezes') +
        ((n.vezesAdiado||0) >= ADIAMENTOS_PARA_RISCO ? ', e por isso ele entra como risco alto na previsão' : '') + '</div>'
      : '') +
    '<div class="pills" style="margin-top:13px">' +
      '<button class="btn btn-sm" data-a="ngAdiar" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Adiar</button>' +
      '<button class="btn btn-sm btn-ghost" data-a="ngTrocarProx" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Trocar</button>' +
    '</div>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Quem decide. O botão de WhatsApp e o de ligar ficam aqui porque é daqui
   que o vendedor sai pra falar com a pessoa. */
function ngBlocoContato(n){
  var c = n.contatoId ? contatoPorId(n.contatoId) : null;
  var nome = (c && c.nome) || n.contatoNome || "";
  var tel  = (c && c.tel)  || n.contatoTel  || "";
  var h = '<div class="card"><div class="sec-title">Quem decide</div>';

  if(!nome){
    h += '<div class="small muted2" style="margin-top:10px">Nenhuma pessoa vinculada. Negócio sem nome de gente é negócio que ninguém consegue cobrar.</div>';
  } else {
    h += '<div class="h2" style="text-transform:none;margin-top:10px">' + esc(nome) + '</div>' +
      (c && c.cargo ? '<div class="small muted">' + esc(c.cargo) + '</div>' : '') +
      (c && c.empresa ? '<div class="tiny muted">' + esc(c.empresa) + '</div>' : '') +
      (tel ? '<div class="small muted2" style="margin-top:6px">' + esc(foneBR(tel)) + '</div>' : '') +
      (c && c.email ? '<div class="tiny muted truncate">' + esc(c.email) + '</div>' : '') +
      '<div class="pills" style="margin-top:11px">' +
        (tel ? '<button class="btn btn-sm" data-a="ngZap" data-id="' + esc(n.id) + '">💬 WhatsApp</button>' +
               '<a class="btn btn-sm" href="tel:+' + esc(soDigito(tel).slice(0,2) === "55" ? soDigito(tel) : "55" + soDigito(tel)) + '">☎ Ligar</a>' : '') +
        (c && c.email ? '<a class="btn btn-sm" href="mailto:' + esc(c.email) + '">✉ E-mail</a>' : '') +
        (n.contatoId ? '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="pessoa/' + esc(n.contatoId) + '">Ver ficha</button>' : '') +
      '</div>';
  }
  if(n.tipo === "agencia" && n.ag && n.ag.quemDecide)
    h += '<div class="tiny muted" style="margin-top:10px">Quem bate o martelo: ' + esc(n.ag.quemDecide) + '</div>';
  if(n.tipo === "patrocinio" && n.pt && n.pt.quemAprova)
    h += '<div class="tiny muted" style="margin-top:10px">Quem aprova a verba: ' + esc(n.pt.quemAprova) + '</div>';
  return h + '</div>';
}

/* Indicação. O telefone de quem indicou fica do lado de propósito: é a
   quem se pede um empurrão quando o negócio trava, e procurar esse número
   em outra tela é o motivo de nunca se pedir. */
function ngBlocoIndicacao(n){
  if(n.origem !== "indicacao") {
    return '<div class="card"><div class="sec-title">Origem' + ajuda("origem") + '</div>' +
      '<div class="h2" style="text-transform:none;margin-top:10px">' + esc(rotOrigem(n.origem)) + '</div></div>';
  }
  var ind = n.indicadorId ? contatoPorId(n.indicadorId) : null;
  var nome = (ind && ind.nome) || n.indicadorNome || "";
  var linha = "", tel = (ind && ind.tel) || "";

  if(n.indicadorId){
    var r = rankIndicadores(), eu = null;
    for(var i=0;i<r.length;i++) if(r[i].id === n.indicadorId) eu = r[i];
    if(eu){
      linha = eu.n + (eu.n===1?" indicação":" indicações") + ", " + eu.ganhos +
        (eu.ganhos===1?" ganho":" ganhos") + ", " + brlCurto(eu.gerado) + " gerados";
      if(!tel) tel = eu.tel || "";
    }
  }

  return '<div class="card"><div class="sec-title">Indicação' + ajuda("indicacao") + '</div>' +
    '<div class="h2" style="text-transform:none;margin-top:10px">via ' + esc(nome || "alguém que não foi informado") + '</div>' +
    (linha ? '<div class="small muted2">' + esc(linha) + '</div>' : '') +
    (tel ? '<div class="small muted" style="margin-top:5px">' + esc(foneBR(tel)) + '</div>' : '') +
    '<div class="pills" style="margin-top:11px">' +
      (tel ? '<button class="btn btn-sm" data-a="ngZapIndicador" data-id="' + esc(n.id) + '">💬 Pedir um empurrão</button>' : '') +
      (n.indicadorId ? '<button class="btn btn-sm btn-ghost" data-a="ir" data-r="pessoa/' + esc(n.indicadorId) + '">Ver ficha</button>' : '') +
    '</div>' +
    (!n.indicadorId ? '<div class="tiny muted" style="margin-top:9px">Sem indicador informado, esse negócio fica de fora do ranking de indicação.</div>' : '') +
  '</div>';
}

/* Saúde: os quatro números que dizem se esse negócio está vivo. Cada um
   com o limite escrito do lado, porque alerta sem número é ignorado. */
function ngBlocoSaude(n){
  var e = estagioDe(n), f = FUNIL[n.tipo] || [], i = idxEstagio(n);
  var limToque = (i === f.length-1) ? TOQUE[n.tipo].ultimo : TOQUE[n.tipo].normal;
  var parado = diasVencido(n.estagioDesde);
  var silen  = n.ultimoToqueEm ? diasVencido(n.ultimoToqueEm) : diasVencido(n.criadoEm);
  var noFunil = diasVencido(n.criadoEm);
  var t = temperatura(n);
  var bloq = motivoBloqueio("crm_negocios");

  var lin = function(r, v, ex, cor){
    return '<div class="ng-lin"><span class="muted">' + esc(r) + '</span>' +
      '<span style="text-align:right"><b' + (cor ? ' style="color:' + cor + '"' : '') + '>' + esc(v) + '</b>' +
      (ex ? '<div class="tiny muted">' + esc(ex) + '</div>' : '') + '</span></div>';
  };

  return '<div class="card">' +
    '<div class="card-head" style="margin-bottom:8px"><div class="sec-title">Saúde' + ajuda("temperatura") + '</div>' +
      '<span class="dot" style="background:' + ngCorTemp(t) + '"></span></div>' +
    (n.status === "aberto" ? '<div class="small muted2" style="margin-bottom:8px">' + esc(porQue(n)) + '</div>' : '') +
    lin("No estágio", parado + (parado===1?" dia":" dias"), "o teto de " + e.rot + " é " + e.teto + " dias",
        parado > e.teto ? "var(--warn)" : "") +
    lin("Sem contato", silen + (silen===1?" dia":" dias"), "o limite aqui é " + limToque + " dias",
        silen > limToque ? "var(--warn)" : "") +
    lin("Previsao", n.prevFechamento ? dataBR(n.prevFechamento) : "sem data",
        (n.prevEstimada ? "data estimada, não entra em alta chance" : "confirmada") +
        ((n.vezesRemarcouPrev||0) ? ", remarcada " + n.vezesRemarcouPrev + " vezes" : "")) +
    lin("No funil", noFunil + (noFunil===1?" dia":" dias"),
        "o ciclo mediano em " + ngRotTipo(n.tipo).toLowerCase() + " é " + CICLO_MEDIANO[n.tipo] + " dias") +
    (n.status === "aberto" && silen >= ABANDONO[n.tipo]
      ? '<div class="tiny" style="color:var(--red);margin-top:9px">' + silen + ' dias sem nenhum toque. Acima de ' +
        ABANDONO[n.tipo] + ' dias o honesto é fechar como "sumiu, não respondeu" e deixar a tarefa de retomar cuidar do resto.</div>'
      : '') +
    '<div class="pills" style="margin-top:11px">' +
      '<button class="btn btn-sm btn-ghost" data-a="ngRemarcarPrev" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Remarcar previsão</button>' +
    '</div>' +
    // Botão desabilitado sem o motivo escrito embaixo é botão que parece
    // quebrado (invariante 12).
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Outros negócios da mesma empresa. Renovação, segunda cota e upsell
   moram aqui, e sem esse bloco o vendedor abre a empresa errada. */
function ngBlocoOutros(n){
  var arr = lista("negocios").filter(function(x){
    return x.id !== n.id && x.empresaChave && x.empresaChave === n.empresaChave;
  });
  if(!arr.length) return "";
  ngOrdenar(arr, "valor");
  var h = '<div class="card"><div class="sec-title">Outros negócios da ' + esc(n.empresa) + '</div><div style="margin-top:8px">';
  for(var i=0;i<arr.length;i++){
    var x = arr[i];
    var tg = x.status === "ganho" ? '<span class="tag tag-green">Ganho</span>'
           : x.status === "perdido" ? '<span class="tag tag-red">Perdido</span>'
           : x.status === "encerrado" ? '<span class="tag">Encerrado</span>'
           : '<span class="tag tag-lime">' + esc(estagioDe(x).rot) + '</span>';
    h += '<button class="ng-lin" style="width:100%;text-align:left" data-a="ngAbrir" data-id="' + esc(x.id) + '">' +
      '<span><div class="small">' + esc(x.titulo) + '</div>' +
        '<div class="tiny muted">' + esc(ngValorTxt(x)) + '</div></span>' + tg + '</button>';
  }
  return h + '</div></div>';
}

function ngBlocoProposta(n){
  var url = ngLinkSeguro(n.linkProposta);
  var bloq = motivoBloqueio("crm_negocios");
  return '<div class="card"><div class="sec-title">Proposta</div>' +
    (url
      ? '<a class="btn btn-block" style="margin-top:10px" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Abrir a proposta</a>' +
        '<div class="tiny muted truncate" style="margin-top:6px">' + esc(url) + '</div>'
      : '<div class="small muted2" style="margin:10px 0">Sem link. Cole aqui o link do arquivo pra não ter que procurar no Drive na frente do cliente.</div>') +
    '<button class="btn btn-sm btn-ghost btn-block" style="margin-top:8px" data-a="ngLinkProp" data-id="' + esc(n.id) + '"' +
      (bloq?' disabled':'') + '>' + (url ? "Trocar o link" : "Colar o link") + '</button>' +
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-top:7px">' + esc(bloq) + '</div>' : '') +
  '</div>';
}

/* Valores, com a OBSERVAÇÃO FIXA no topo. A obs é a memória que o
   vendedor usa de verdade ("não ligar antes das 10h") e que numa
   atividade afundaria na timeline em duas semanas. */
function ngBlocoValores(n){
  var bloq = motivoBloqueio("crm_negocios");
  var lin = function(r, v, ex){
    return '<div class="ng-lin"><span class="muted">' + esc(r) + '</span>' +
      '<span style="text-align:right"><b>' + esc(v) + '</b>' +
      (ex ? '<div class="tiny muted">' + esc(ex) + '</div>' : '') + '</span></div>';
  };

  var h = '<div class="card">' +
    '<div class="card-head" style="margin-bottom:10px"><div class="sec-title">Valores' + ajuda("valor_contrato") + '</div>' +
      '<button class="btn btn-sm btn-ghost" data-a="ngEditarValores" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>Editar</button>' +
    '</div>' +
    // Vale pro Editar e pro Anotar deste cartão: desabilitado sim, mudo
    // nunca (invariante 12).
    (bloq ? '<div class="tiny" style="color:var(--text3);margin-bottom:10px">' + esc(bloq) + '</div>' : '');

  h += '<div style="background:var(--card2);border-radius:var(--rad-sm);padding:11px;margin-bottom:12px">' +
      '<div class="tiny muted" style="margin-bottom:4px">Observação fixa</div>' +
      (n.obs ? '<div class="small" style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(n.obs) + '</div>'
             : '<div class="small muted">Nada anotado. Aqui mora o que não pode ser esquecido nunca, não o que aconteceu ontem.</div>') +
      '<button class="btn btn-sm btn-ghost" style="margin-top:8px" data-a="ngObs" data-id="' + esc(n.id) + '"' + (bloq?' disabled':'') + '>' +
        (n.obs ? "Editar a observação" : "Anotar") + '</button>' +
    '</div>';

  if(n.tipo === "agencia"){
    var a = n.ag || {};
    h += lin("Fee mensal", brl(a.mrr||0) + "/mês", a.mrrInicial && a.mrrInicial !== a.mrr ? "pedido inicial de " + brl(a.mrrInicial) + "/mês" : "");
    if(a.verbaMidia > 0){
      // Verba de mídia NÃO é receita da Lime. Só entra no MRR a fatia do
      // percentual, e por isso ela vive em linha própria e rotulada.
      h += lin("Verba de mídia", brl(a.verbaMidia) + "/mês", "verba do cliente, não é receita da Lime");
      h += lin("Nossa fatia da verba", pct(a.pctVerba||0), brl(Math.round((a.verbaMidia||0)*((a.pctVerba||0)/100))) + "/mês");
    }
    h += lin("MRR que a Lime fatura", brl(mrrDe(n)) + "/mês", "fee mais a fatia da verba");
    h += lin("Duracao", (a.meses ? a.meses + " meses" : "indeterminado, contado como 12 meses"),
             brl(valorRefDe(n)) + " no contrato inteiro");
    if(a.inicioContrato) h += lin("Começa em", dataBR(a.inicioContrato), "");
    if(a.fimContrato)    h += lin("Termina em", dataBR(a.fimContrato), diasVencido(a.fimContrato) < 0 ? "faltam " + Math.abs(diasVencido(a.fimContrato)) + " dias" : "");
    if(a.servicos && a.servicos.length) h += lin("Servicos", a.servicos.join(", "), "");
    if(a.faixaVerba) h += lin("Faixa de verba", a.faixaVerba, "declarada pelo cliente");
    if(a.renovacaoDeId) h += '<div class="tiny muted" style="margin-top:8px">Este contrato é a renovação de outro. ' +
      '<button class="btn btn-sm btn-ghost" data-a="ngAbrir" data-id="' + esc(a.renovacaoDeId) + '">Ver o anterior</button></div>';
  } else {
    var p = n.pt || {}, ed = edicaoDe(p.edicao);
    h += lin("Edicao", ed ? ed.rot : "não definida",
             ed ? ("evento em " + dataBR(ed.dataEvento) + ", corte comercial em " + dataBR(ed.corteComercial)) : "");
    if(ed && n.status === "aberto"){
      var dCorte = diasEntre(hojeISO(), ed.corteComercial);
      h += lin("Até o corte comercial", (dCorte >= 0 ? dCorte + " dias" : "já passou"),
               dCorte >= 0 ? "depois disso não da tempo de produzir material e estande" : "quem manda nessa data é a produção");
    }
    h += lin("Cota", p.cota || "não definida", "");
    h += lin("Valor", brl(p.valor||0), p.valorInicial && p.valorInicial !== p.valor ? "pedido inicial de " + brl(p.valorInicial) : "");
    if(p.permuta > 0) h += lin("Permuta", brl(p.permuta), "nunca somada ao dinheiro, em nenhum número");
    if(p.mesBudget) h += lin("Mês do budget", mesBR(p.mesBudget), "é quando a marca decide");
    if(p.entregaveis){
      h += '<div style="padding:9px 0"><div class="tiny muted">Entregaveis</div>' +
        '<div class="small" style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(p.entregaveis) + '</div></div>';
    }
  }

  h += '<div class="tiny muted" style="margin-top:10px">Criado em ' + esc(dataBR(n.criadoEm)) +
       ' por ' + esc(n.criadoPor || "") + '</div>';
  return h + '</div>';
}

TELAS.negocio = function(){
  var n = achar("negocios", ROTA.id);
  if(!n){
    return '<div class="empty"><div class="ei">🔍</div><div class="et">Esse negócio não está aqui</div>' +
      '<div class="ex">Ou ele foi arquivado, ou ainda não chegou neste aparelho. Buscar novidades no menu resolve o segundo caso.</div>' +
      '<button class="btn" data-a="ir" data-r="negocios">Ver a lista de negócios</button></div>';
  }

  // A linha do tempo é a única leitura de banco desta tela, e roda depois
  // de pintar pra a tela nunca esperar rede pra aparecer.
  DEPOIS.push(function(){ ngPintarTimeline(n.id, false); });

  /* A ordem do HTML é a ordem do CELULAR: faixa, stepper, ações, próximo
     passo, registrar, timeline, e só depois contato, indicação, saúde,
     valores e observação. No computador as duas colunas viram grid e a
     lateral vai pra direita, sem mudar uma linha do HTML. */
  return NG_CSS +
  '<div class="ng-cols">' +
    '<div class="ng-main">' +
      ngBlocoTopo(n) +
      ngBlocoProx(n) +
      ngFormRegistro(n, "rg", false) +
      '<div class="card">' +
        '<div class="sec-title">Linha do tempo' + ajuda("proximo_passo") + '</div>' +
        '<div class="sec-sub">as últimas ' + TIMELINE_PAGINA + ' interacoes</div>' +
        '<div id="ngTl" data-n="' + esc(n.id) + '" style="margin-top:12px"></div>' +
      '</div>' +
    '</div>' +
    '<div class="ng-side">' +
      ngBlocoContato(n) +
      ngBlocoQuemToca(n) +
      ngBlocoIndicacao(n) +
      ngBlocoSaude(n) +
      ngBlocoOutros(n) +
      ngBlocoProposta(n) +
      ngBlocoValores(n) +
    '</div>' +
  '</div>';
};

/* ---------------------------------------------------------------------
   QUEM TOCA ESTE NEGOCIO

   Mostra os dois nomes e o botao da passagem. Fica na coluna lateral,
   junto de contato e origem, porque e informacao de contexto: quem
   trabalha o negocio olha isso uma vez e nao volta mais.
   --------------------------------------------------------------------- */
function ngBlocoQuemToca(n){
  var d = donoDe(n);
  if(d.papel === "time"){
    /* Negocio de antes da divisao entre SDR e closer. Nao invento um dono
       pra ele: digo a verdade e ofereco assumir. */
    return '<div class="card"><div class="sec-title">Quem toca' + ajuda("quem_toca") + '</div>' +
      '<div class="h2" style="text-transform:none;margin-top:10px">O time todo</div>' +
      '<div class="small muted2">Esse negócio é de antes da divisão entre captação e fechamento, então aparece na fila de todo mundo.</div>' +
      (podeEditarNegocios() ?
        '<div class="pills" style="margin-top:11px">' +
          '<button class="btn btn-sm" data-a="ngAssumir" data-id="' + esc(n.id) + '">Assumir este negócio</button>' +
        '</div>' : '') +
    '</div>';
  }

  var passado = !!n.passadoEm;
  var estagioDaPassagem = "";
  if(passado && n.passadoNoEstagio){
    var f = FUNIL[n.tipo] || [];
    for(var i=0;i<f.length;i++) if(f[i].k === n.passadoNoEstagio) estagioDaPassagem = f[i].rot;
  }

  var h = '<div class="card"><div class="sec-title">Quem toca' + ajuda("quem_toca") + '</div>' +
    '<div class="h2" style="text-transform:none;margin-top:10px">' +
      esc(d.nome || "sem nome") +
      ' <span class="tag ' + (passado ? "tag-green" : "tag-lime") + '" style="vertical-align:middle">' +
      (passado ? "fechando" : "captando") + '</span></div>';

  if(passado){
    h += '<div class="small muted2">Captado por ' + esc(n.captouNome || "alguém que não foi informado") +
         ', passado em ' + esc(dataBR(n.passadoEm)) +
         (estagioDaPassagem ? ' no estágio ' + esc(estagioDaPassagem) : '') + '.</div>';
  } else {
    h += '<div class="small muted2">Ainda em captação. Quando estiver pronto pra proposta, passe pro closer: ' +
         'ele passa a aparecer na fila de hoje dele, e sai da sua.</div>';
  }

  if(podeEditarNegocios() && n.status === "aberto"){
    h += '<div class="pills" style="margin-top:11px">' +
      (passado
        ? '<button class="btn btn-sm btn-ghost" data-a="ngPassar" data-id="' + esc(n.id) + '">Trocar quem fecha</button>'
        : '<button class="btn btn-sm" data-a="ngPassar" data-id="' + esc(n.id) + '">Passar pro closer</button>') +
      (passado ? '<button class="btn btn-sm btn-ghost" data-a="ngDevolver" data-id="' + esc(n.id) + '">Devolver pra captação</button>' : '') +
    '</div>';
  }
  return h + '</div>';
}

/* Lista de quem pode fechar. Closer e admin entram; SDR nao, porque a
   casa decidiu que quem capta nunca fecha, e oferecer o proprio nome no
   seletor e o jeito mais facil de essa regra morrer na pratica. */
function ngClosers(){
  var r = [], i;
  for(i=0;i<ACESSOS.length;i++){
    var a = ACESSOS[i];
    if(a.ativo === false) continue;
    if(a.perfil === "closer" || a.perfil === "admin" || a.perfil === "vendedor") r.push(a);
  }
  return r;
}

ACOES.ngPassar = function(el){
  var id = el.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var lista = ngClosers(), i, op = "";
  for(i=0;i<lista.length;i++)
    op += '<option value="' + esc(lista[i].id) + '"' +
          (n.fechaId === lista[i].id ? ' selected' : '') + '>' + esc(lista[i].nome) + '</option>';

  folha(n.passadoEm ? "Trocar quem fecha" : "Passar pro closer",
    '<form class="form" id="ngPF" data-a="ngSalvarPassagem" data-id="' + esc(id) + '">' +
      (lista.length
        ? '<div class="fld"><label>Quem vai fechar</label>' +
            '<select class="inp" id="ngPQuem">' + op + '</select>' +
            '<div class="hint">Só aparece aqui quem tem acesso de Closer ou de Admin.</div></div>'
        : '<div class="fld"><label>Quem vai fechar</label>' +
            '<input class="inp" id="ngPNome" maxlength="60" placeholder="Igor" value="' + esc(n.fechaNome || "") + '">' +

ACOES.ngSalvarPassagem = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var sel = document.getElementById('ngPQuem');
  var inp = document.getElementById('ngPNome');
  var nota = String((document.getElementById('ngPNota')||{}).value || "").trim().slice(0,400);
  var quemId = "", quemNome = "";
  if(sel){
    quemId = sel.value || "";
    for(var i=0;i<ACESSOS.length;i++) if(ACESSOS[i].id === quemId) quemNome = ACESSOS[i].nome;
  } else {
    quemNome = String((inp && inp.value) || "").trim().slice(0,60);
  }
  if(!quemNome){ toast("Diga quem vai fechar.", "bad"); return; }

  var antes = { fechaId:n.fechaId || "", fechaNome:n.fechaNome || "",
                passadoEm:n.passadoEm || "", passadoNoEstagio:n.passadoNoEstagio || "" };
  var jaTinha = !!n.passadoEm;
  var up = { fechaId:quemId, fechaNome:quemNome };
  /* A data da passagem so e gravada UMA vez. Trocar de closer depois nao
     e uma passagem nova: se a data andasse junto, o tempo que o lead
     levou pra sair da captacao mudaria toda vez que alguem trocasse o
     nome, e o placar do SDR contaria a troca como merito dele. */
  if(!jaTinha){ up.passadoEm = hojeISO(); up.passadoNoEstagio = n.estagio || ""; }

  fecharFolha();
  gravar("crm_negocios", id, up).then(function(){
    ngNota(id, (jaTinha ? "Quem fecha agora é " + quemNome + "." :
                          "Passado da captação pro fechamento, com " + quemNome + ".") +
               (nota ? " " + nota : ""));
    comDesfazer(jaTinha ? "Quem fecha agora é " + quemNome
                        : "Passado pro " + quemNome + ". Ele já vê na fila dele.",
                "crm_negocios", id, antes);
  });
};

ACOES.ngSalvarPrev = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  // O negócio pode ter sido arquivado em outro aparelho enquanto a folha
  // estava aberta. Sem esta guarda o formulário morre calado e o botão
  // Salvar vira um botão que não faz nada.
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var v = (document.getElementById('ngPrev')||{}).value || "";
  var err = document.getElementById('ngErr');
  if(!v){ err.textContent = "Escolha a data."; return; }
  // Previsão no passado é negócio que já devia ter fechado e não fechou.
  // Gravar isso enche o mês de hoje de número que nunca vai acontecer.
  if(v < hojeISO()){
    err.textContent = "A previsão não pode ser antes de hoje (" + dataBR(hojeISO()) + ").";
    return;
  }
  var up = { prevFechamento:v, prevEstimada:false };
  if(n.prevFechamento && n.prevFechamento !== v) up.vezesRemarcouPrev = (n.vezesRemarcouPrev||0) + 1;
  fecharFolha();
  gravar("crm_negocios", id, up).then(function(){ toast("Previsão em " + dataBR(v), "ok"); });
};

/* ---------------------------------------------------------------------
   ADIAR E TROCAR O PRÓXIMO PASSO
   Adiar pede motivo em picklist e incrementa vezesAdiado, que é o que
   revela o negócio que nunca anda. Trocar não conta como adiamento: mudar
   de "ligar" pra "enviar proposta" é progresso, não fuga.

ACOES.ngAdiar = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var p = proxTipoDe(n.proxTipo) || { rot:"Próximo passo" };
  var mot = [];
  for(var i=0;i<MOTIVOS_ADIAR.length;i++) mot.push([MOTIVOS_ADIAR[i], MOTIVOS_ADIAR[i]]);

  folha("Adiar: " + p.rot,
    '<form class="form" id="ngF" data-a="ngSalvarAdiar" data-id="' + esc(n.id) + '">' +
      '<div class="small muted2">Estava marcado pra ' + esc(dataExtenso(n.proxData)) + '.</div>' +
      '<div class="fld"><label>Por que adiou <span class="req">*</span></label>' +
        '<select class="inp" id="ngAdMot">' + ngOpcoes(mot, "", "escolha") + '</select>' +
        '<div class="hint">É picklist de propósito. Em três meses isso vira a resposta pra "onde a gente perde tempo".</div></div>' +
      '<div class="fld"><label>Nova data</label>' +
        '<div class="pills">' +
          '<button type="button" class="pill" data-a="ngChipData" data-pref="ad" data-k="2d">+2 dias</button>' +
          '<button type="button" class="pill" data-a="ngChipData" data-pref="ad" data-k="1sem">+1 semana</button>' +
          '<button type="button" class="pill" data-a="ngChipData" data-pref="ad" data-k="15d">+15 dias</button>' +
          '<input class="inp" type="date" id="addata" value="' + esc(ngDataChip("2d")) +
            '" min="' + esc(somaDias(hojeISO(), 1)) + '" style="width:auto;flex:1;min-width:148px">' +
        '</div></div>' +
      ((n.vezesAdiado||0) + 1 >= ADIAMENTOS_PARA_RISCO
        ? '<div class="tiny" style="color:var(--warn)">Com este, são ' + ((n.vezesAdiado||0)+1) +
          ' adiamentos. A partir de ' + ADIAMENTOS_PARA_RISCO + ' adiamentos o negócio entra como risco alto e sai do número provável do mês.</div>'
        : '') +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-primary" type="submit" form="ngF">Adiar</button>');
};
ACOES.ngSalvarAdiar = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  var err = document.getElementById('ngErr');
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var motivo = (document.getElementById('ngAdMot')||{}).value || "";
  var data   = (document.getElementById('addata')||{}).value || "";
  if(!motivo){ err.textContent = "Escolha o motivo."; return; }
  if(!data){ err.textContent = "Escolha a nova data."; return; }
  // Adiar é empurrar pra frente. Data de ontem soma um adiamento, deixa o
  // negócio vencido do mesmo jeito e ainda o manda pro balde de atrasado
  // no dia seguinte, que é o contrário do que a pessoa pediu.
  if(data <= hojeISO()){
    err.textContent = "A nova data tem que ser depois de hoje (" + dataBR(hojeISO()) + ").";
    return;
  }
  var antes = n.proxData;
  fecharFolha();
  gravar("crm_negocios", id, { proxData:data, vezesAdiado:(n.vezesAdiado||0) + 1 })
    .then(function(){
      // Vira linha na timeline porque a história do adiamento é o que
      // explica, dois meses depois, por que o negócio nunca andou. Nao
      // mexe em ultimoToqueEm: adiar não é falar com o cliente.
      ngNota(id, "Adiado de " + dataBR(antes) + " pra " + dataBR(data) + ". Motivo: " + motivo + ".");
      toast("Adiado pra " + dataBR(data), "ok");
      redesenhar();
    });
};

/* ---------------------------------------------------------------------
   FECHAR GANHO
   A folha cobra o que falta pro número existir: em agência o fee e a data
   de início, em patrocínio o valor e a edição. Ganho sem esses campos
   entra no painel como zero e some da carteira.
   --------------------------------------------------------------------- */
function ngAntesDeFechar(n){
  // O que o Desfazer devolve. A tarefa criada junto não volta, e isso é
  // dito no toast: tarefa aberta a mais é barulho, negócio com status
  // errado é número errado no painel do mês.
  return {
    status:n.status, fechadoEm:n.fechadoEm || "", motivoPerda:n.motivoPerda || "",
    motivoPerdaObs:n.motivoPerdaObs || "", proxTipo:n.proxTipo || "", proxData:n.proxData || "",
    proxTexto:n.proxTexto || "", proxHora:n.proxHora || ""
  };
}

ACOES.ngSalvarGanho = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var err = document.getElementById('ngErr');
  var quandoFechou = (document.getElementById('ngGdata')||{}).value || hojeISO();
  var up = { status:"ganho", fechadoEm:quandoFechou,
             proxTipo:"", proxData:"", proxTexto:"", proxHora:"", congeladoAte:"" };
  var fim = "";

  if(n.tipo === "agencia"){
    var mrr   = ngLerDinheiro((document.getElementById('ngGmrr')||{}).value);
    var ini   = (document.getElementById('ngGini')||{}).value || "";
    var meses = parseInt((document.getElementById('ngGmeses')||{}).value, 10) || 0;
    fim       = (document.getElementById('ngGfim')||{}).value || "";
    if(mrr <= 0){ err.textContent = "Preencha o fee mensal em R$. Ganho sem valor vira zero no painel do mês."; return; }
    if(!ini){ err.textContent = "Preencha a data de início do contrato."; return; }
    if(fim && fim <= ini){ err.textContent = "A data de término tem que ser depois da de início."; return; }
    var a = ngCopia(n.ag);
    // mrrInicial é gravado uma vez e nunca sobrescrito: é ele que sustenta
    // a linha "pediu 4.500, está em 3.500" na tela do dono.
    if(!a.mrrInicial) a.mrrInicial = (n.ag && n.ag.mrr) || mrr;
    a.mrr = mrr; a.meses = meses; a.inicioContrato = ini; a.fimContrato = fim;
    up.ag = a;
  } else {
    var valor  = ngLerDinheiro((document.getElementById('ngGvalor')||{}).value);
    var edicao = (document.getElementById('ngGedicao')||{}).value || "";
    var cota   = (document.getElementById('ngGcota')||{}).value || "";
    var perm   = ngLerDinheiro((document.getElementById('ngGpermuta')||{}).value);
    if(valor <= 0){ err.textContent = "Preencha o valor da cota em R$."; return; }
    if(!edicao){ err.textContent = "Escolha a edição do festival."; return; }
    var p = ngCopia(n.pt);
    if(!p.valorInicial) p.valorInicial = (n.pt && n.pt.valor) || valor;
    p.valor = valor; p.edicao = edicao; p.cota = cota; p.permuta = perm;
    up.pt = p;
  }
  up.valorRef = valorRefDe({ tipo:n.tipo, ag:up.ag || n.ag, pt:up.pt || n.pt });

  var antes = ngAntesDeFechar(n);
  // A regra é a origem, não o cadastro do indicador (seção 4.4, item 7). Com
  // indicadorId a tarefa já nasce com o telefone; sem ele nasce só com o
  // nome, que ainda é o suficiente pra lembrar de dar o retorno. Amarrar no
  // id faria a folha prometer a tarefa e o sistema não criar.
  var indicou = n.origem === "indicacao";
  var indId = n.indicadorId || "", indNome = n.indicadorNome, empresa = n.empresa, titulo = n.titulo;
  var tipoNeg = n.tipo;
  fecharFolha();

  gravar("crm_negocios", id, up).then(function(){
    ngNota(id, "Ganho em " + dataBR(quandoFechou) + ", " +
      (tipoNeg === "agencia" ? brl(up.ag.mrr) + "/mês por " + (up.ag.meses || 12) + " meses"
                             : brl(up.pt.valor) + " na cota " + (up.pt.cota || "sem cota definida")) + ".");
    if(indicou){
      var ind = indId ? contatoPorId(indId) : null;
      ngCriarTarefa({
        tipo:"avisar_indicador", data:somaDias(hojeISO(), 1),
        texto:"Avisar " + (indNome || "quem indicou") + " que fechamos com a " + empresa,
        contatoId:indId, contatoNome:indNome || "", contatoTel:(ind && ind.tel) || "",
        negocioId:id, negocioTitulo:titulo
      });
    }
    if(tipoNeg === "agencia" && fim){
      // 60 dias antes do fim. Se o contrato já termina antes disso, a
      // tarefa cai pra amanhã: aviso no passado é aviso que ninguém vê.
      var d = somaDias(fim, -60);
      if(d <= hojeISO()) d = somaDias(hojeISO(), 1);
      ngCriarTarefa({
        tipo:"renovacao", data:d,
        texto:"Renovação da " + empresa + ", o contrato termina em " + dataBR(fim),
        contatoId:n.contatoId || "", contatoNome:n.contatoNome || "", contatoTel:n.contatoTel || "",
        negocioId:id, negocioTitulo:titulo
      });
    }
    comDesfazer("Ganho! " + (indicou ? "Tarefa de avisar quem indicou criada." : ""), "crm_negocios", id, antes);
    redesenhar();
  });
};

/* ---------------------------------------------------------------------
   FECHAR PERDIDO
   O motivo é obrigatório e é picklist, sem opção "outros": "outros" come
   60% das respostas em três meses e mata a única análise que diz onde a
   gente perde. Motivo com prazo de reabertura vira tarefa de retomar.
   --------------------------------------------------------------------- */
ACOES.ngPerdido = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var mot = [];
  for(var i=0;i<MOTIVOS_PERDA.length;i++){
    var m = MOTIVOS_PERDA[i];
    if(m.funil !== "ambos" && m.funil !== n.tipo) continue;
    mot.push([m.k, m.rot]);
  }
  folha("Fechar como perdido",
    '<form class="form" id="ngF" data-a="ngSalvarPerdido" data-id="' + esc(n.id) + '">' +
      '<div class="fld"><label>O que aconteceu <span class="req">*</span></label>' +
        '<select class="inp" id="ngPmot" data-ch="ngChMotivoPerda">' + ngOpcoes(mot, "", "escolha") + '</select>' +
        '<div class="hint" id="ngPhint">Sem opção "outros" de propósito. Se nenhuma servir, a mais próxima mais a observação embaixo resolve.</div></div>' +
      '<div class="fld" id="ngPdataBox" hidden><label>Quando vale a pena voltar</label>' +
        '<input class="inp" type="date" id="ngPreabrir" value="' + esc(somaDias(hojeISO(), 90)) + '" min="' + hojeISO() + '">' +
        '<div class="hint">Virá uma tarefa de retomar nessa data.</div></div>' +
      '<div class="fld"><label>Observação (opcional)</label>' +
        '<textarea class="inp" id="ngPobs" maxlength="400" placeholder="adiaram pro orçamento de 2028"></textarea></div>' +
      '<div class="fld" style="max-width:220px"><label>Fechou em</label>' +
        '<input class="inp" type="date" id="ngPdata" value="' + hojeISO() + '" max="' + hojeISO() + '"></div>' +
      (n.origem === "indicacao"
        ? '<div class="small" style="color:var(--lime)">Vamos criar a tarefa de dar o retorno pra ' +
          esc(n.indicadorNome || "quem indicou") + '. Avisar quando não deu certo é o que faz a próxima indicação existir.</div>'
        : '') +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-danger" type="submit" form="ngF">Marcar como perdido</button>');
};

ACOES.ngChMotivoPerda = function(el){
  var m = motivoPerdaDe(el.value);
  var box = document.getElementById('ngPdataBox');
  var hint = document.getElementById('ngPhint');
  var dt = document.getElementById('ngPreabrir');
  if(!m || !box) return;
  // reabrir "informar" pergunta a data, número agenda sozinho, zero não
  // cria tarefa nenhuma.
  box.hidden = m.reabrir !== "informar";
  if(typeof m.reabrir === "number" && m.reabrir > 0){
    if(dt) dt.value = somaDias(hojeISO(), m.reabrir);
    if(hint) hint.textContent = "Vamos criar a tarefa de retomar pra daqui " + m.reabrir +
      " dias (" + dataBR(somaDias(hojeISO(), m.reabrir)) + ").";
  } else if(m.reabrir === "informar"){
    if(hint) hint.textContent = "Escolha embaixo a data de voltar a falar.";
  } else if(m.foraDaTaxa){
    if(hint) hint.textContent = "Desqualificar não conta como derrota: esse motivo fica fora do denominador da taxa de ganho.";
  } else {
    if(hint) hint.textContent = "Esse motivo não gera tarefa de retomar.";
  }
};

ACOES.ngSalvarPerdido = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var err = document.getElementById('ngErr');
  var k = (document.getElementById('ngPmot')||{}).value || "";
  if(!k){ err.textContent = "Escolha o que aconteceu. Sem motivo, perder vira estatistica muda."; return; }
  var m = motivoPerdaDe(k) || { reabrir:0, rot:k };
  var obs = String((document.getElementById('ngPobs')||{}).value || "").slice(0,400);
  var quandoFechou = (document.getElementById('ngPdata')||{}).value || hojeISO();

  var dataRetomar = "";
  if(m.reabrir === "informar"){
    dataRetomar = (document.getElementById('ngPreabrir')||{}).value || "";
    if(!dataRetomar){ err.textContent = "Escolha a data de voltar a falar."; return; }
  } else if(typeof m.reabrir === "number" && m.reabrir > 0){
    dataRetomar = somaDias(hojeISO(), m.reabrir);
  }

  var antes = ngAntesDeFechar(n);
  // Ganho OU perdido, e pela origem, não pelo cadastro do indicador
  // (seção 4.4, item 7). O retorno de "não deu certo" é o que faz a
  // próxima indicação existir, e é o que mais se esquece de mandar.
  var indicou = n.origem === "indicacao";
  var indId = n.indicadorId || "", indNome = n.indicadorNome, empresa = n.empresa, titulo = n.titulo;
  var contatoId = n.contatoId || "", contatoNome = n.contatoNome || "", contatoTel = n.contatoTel || "";
  fecharFolha();

  gravar("crm_negocios", id, {
    status:"perdido", motivoPerda:k, motivoPerdaObs:obs, fechadoEm:quandoFechou,
    proxTipo:"", proxData:"", proxTexto:"", proxHora:"", congeladoAte:""
  }).then(function(){
    ngNota(id, "Perdido em " + dataBR(quandoFechou) + ". Motivo: " + m.rot + "." + (obs ? " " + obs : ""));
    if(dataRetomar){
      ngCriarTarefa({
        tipo:"retomar", data:dataRetomar,
        texto:"Retomar a " + empresa + " (" + m.rot + ")",
        contatoId:contatoId, contatoNome:contatoNome, contatoTel:contatoTel,
        negocioId:id, negocioTitulo:titulo
      });
    }
    if(indicou){
      var ind = indId ? contatoPorId(indId) : null;
      ngCriarTarefa({
        tipo:"avisar_indicador", data:somaDias(hojeISO(), 1),
        texto:"Dar o retorno pra " + (indNome || "quem indicou") + " sobre a " + empresa,
        contatoId:indId, contatoNome:indNome || "", contatoTel:(ind && ind.tel) || "",
        negocioId:id, negocioTitulo:titulo
      });
    }
    comDesfazer("Marcado como perdido" + (dataRetomar ? ", com retomada em " + dataBR(dataRetomar) : ""),
                "crm_negocios", id, antes);
    redesenhar();
  });
};

/* ---------------------------------------------------------------------
   CONGELAR
   É a válvula de escape honesta. Sem ela o vendedor bota data falsa no
   próximo passo pra parar o alarme, e a partir daí o dado inteiro
   apodrece. Teto de CONGELAMENTO_MAX dias, motivo em picklist, e a
   previsão de fechamento é EMPURRADA pra depois do descongelamento,
   avisando na tela: previsão dentro do congelamento é mentira que o
   painel repete o mês inteiro.
   --------------------------------------------------------------------- */
ACOES.ngCongelar = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var mot = [], i;
  for(i=0;i<MOTIVOS_CONGELAR.length;i++) mot.push([MOTIVOS_CONGELAR[i], MOTIVOS_CONGELAR[i]]);
  var padrao = somaDias(hojeISO(), 30);
  folha("Congelar",
    '<form class="form" id="ngF" data-a="ngSalvarCongelar" data-id="' + esc(n.id) + '">' +
      '<div class="small muted2">Congelado, o negócio sai das cobranças e fica esmaecido no funil. Ele não morre, só para de pedir atenção até a data.</div>' +
      '<div class="fld"><label>Por que <span class="req">*</span></label>' +
        '<select class="inp" id="ngCmot">' + ngOpcoes(mot, "", "escolha") + '</select></div>' +
      '<div class="fld"><label>Volta a cobrar em <span class="req">*</span></label>' +
        '<div class="pills">' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="15">15 dias</button>' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="30">30 dias</button>' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="60">60 dias</button>' +
          '<button type="button" class="pill" data-a="ngCongDias" data-d="90">90 dias</button>' +
        '</div>' +
        '<input class="inp" type="date" id="ngCate" value="' + esc(padrao) + '" min="' + esc(somaDias(hojeISO(),1)) +
          '" max="' + esc(somaDias(hojeISO(), CONGELAMENTO_MAX)) + '" data-ch="ngChCongela" style="margin-top:8px">' +
        '<div class="hint">O máximo é ' + CONGELAMENTO_MAX + ' dias. Mais que isso não é pausa, é negócio perdido sem ninguém assumir.</div></div>' +
      '<div class="small" id="ngCaviso" style="color:var(--warn)"></div>' +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-primary" type="submit" form="ngF">Congelar</button>');
  ACOES.ngChCongela();
};
ACOES.ngCongDias = function(el){
  var d = document.getElementById('ngCate');
  if(d){ d.value = somaDias(hojeISO(), parseInt(el.getAttribute('data-d'), 10) || 30); ACOES.ngChCongela(d); }
};
ACOES.ngChCongela = function(){
  // Lê o id do próprio formulário, e não da rota: esta folha também abre
  // de dentro do Hoje, onde a rota não é a do negócio.
  var fo = document.getElementById('ngF');
  var n = fo ? achar("negocios", fo.getAttribute('data-id')) : null;
  var d = document.getElementById('ngCate');
  var av = document.getElementById('ngCaviso');
  if(!n || !d || !av) return;
  var nova = ngPrevDepoisDoGelo(n, d.value);
  av.textContent = nova
    ? ("A previsão de fechamento vai de " + dataBR(n.prevFechamento) + " pra " + dataBR(nova) +
       ", porque previsão dentro do congelamento é data que ninguém vai cumprir.")
    : "";
};
// Empurra a previsão pra depois do descongelamento. Uma semana util
// depois, não no próprio dia: no dia em que volta a falar ainda não
// fechou nada.
function ngPrevDepoisDoGelo(n, ate){
  if(!ate || !n.prevFechamento) return "";
  if(n.prevFechamento > ate) return "";
  return ngDiasUteis(ate, 5);
}

ACOES.ngSalvarCongelar = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var err = document.getElementById('ngErr');
  var motivo = (document.getElementById('ngCmot')||{}).value || "";
  var ate    = (document.getElementById('ngCate')||{}).value || "";
  if(!motivo){ err.textContent = "Escolha o motivo."; return; }
  if(!ate || ate <= hojeISO()){ err.textContent = "Escolha uma data futura."; return; }
  if(diasEntre(hojeISO(), ate) > CONGELAMENTO_MAX){
    err.textContent = "O máximo é " + CONGELAMENTO_MAX + " dias (até " + dataBR(somaDias(hojeISO(), CONGELAMENTO_MAX)) + ").";
    return;
  }
  var up = { congeladoAte:ate, congeladoMotivo:motivo };
  var novaPrev = ngPrevDepoisDoGelo(n, ate);
  if(novaPrev){ up.prevFechamento = novaPrev; up.vezesRemarcouPrev = (n.vezesRemarcouPrev||0) + 1; }
  // O próximo passo vai pro dia do descongelamento: é o que faz o negocio
  // voltar sozinho pra fila em vez de sumir de vez.
  up.proxTipo = "retomar"; up.proxData = ate; up.proxTexto = "descongelar: " + motivo;
  fecharFolha();
  gravar("crm_negocios", id, up).then(function(){
    ngNota(id, "Congelado até " + dataBR(ate) + ". Motivo: " + motivo + "." +
      (novaPrev ? " Previsão movida pra " + dataBR(novaPrev) + "." : ""));
    toast("Congelado até " + dataBR(ate) + (novaPrev ? ", previsão movida pra " + dataBR(novaPrev) : ""), "ok");
    redesenhar();
  });
};
ACOES.ngDescongelar = function(el){
  var id = el.getAttribute('data-id'), n = achar("negocios", id);
  if(!n) return;
  var antes = { congeladoAte:n.congeladoAte || "", congeladoMotivo:n.congeladoMotivo || "" };
  gravar("crm_negocios", id, { congeladoAte:"", congeladoMotivo:"" }).then(function(){
    ngNota(id, "Descongelado.");
    comDesfazer("Descongelado. Ele volta pra fila hoje.", "crm_negocios", id, antes);
    redesenhar();
  });
};

/* ---------------------------------------------------------------------
   ENCERRAR CONTRATO (só agência já ganha)
   Encerrar não é perder: perder é não ter fechado. Por isso status
   próprio e lista de motivos própria, e por isso "renovado" existe:
   contrato que virou contrato novo não pode aparecer como MRR perdido.
   --------------------------------------------------------------------- */
ACOES.ngEncerrar = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n) return;
  var mot = [];
  for(var i=0;i<MOTIVOS_ENCERRAMENTO.length;i++) mot.push([MOTIVOS_ENCERRAMENTO[i].k, MOTIVOS_ENCERRAMENTO[i].rot]);
  folha("Encerrar o contrato",
    '<form class="form" id="ngF" data-a="ngSalvarEncerrar" data-id="' + esc(n.id) + '">' +
      '<div class="small muted2">' + esc(brl(mrrDe(n))) + '/mês saem da carteira ativa a partir da data de encerramento.</div>' +
      '<div class="fld"><label>Por que encerrou <span class="req">*</span></label>' +
        '<select class="inp" id="ngEmot">' + ngOpcoes(mot, "", "escolha") + '</select>' +
        '<div class="hint">Se foi renovação, use o botão Renovar contrato: ele cria o contrato novo e encerra este com o motivo certo, e assim a renovação não aparece como MRR perdido no painel.</div></div>' +
      '<div class="fld" style="max-width:220px"><label>Encerrou em</label>' +
        '<input class="inp" type="date" id="ngEdata" value="' + esc((n.ag && n.ag.fimContrato) || hojeISO()) + '"></div>' +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-danger" type="submit" form="ngF">Encerrar</button>');
};
ACOES.ngSalvarEncerrar = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var k = (document.getElementById('ngEmot')||{}).value || "";
  var d = (document.getElementById('ngEdata')||{}).value || hojeISO();
  if(!k){ document.getElementById('ngErr').textContent = "Escolha o motivo."; return; }
  var rot = "";
  for(var i=0;i<MOTIVOS_ENCERRAMENTO.length;i++) if(MOTIVOS_ENCERRAMENTO[i].k === k) rot = MOTIVOS_ENCERRAMENTO[i].rot;
  fecharFolha();
  gravar("crm_negocios", id, { status:"encerrado", motivoEncerramento:k, encerradoEm:d,
                               proxTipo:"", proxData:"", proxTexto:"", proxHora:"" })
    .then(function(){
      ngNota(id, "Contrato encerrado em " + dataBR(d) + ". Motivo: " + rot + ".");
      toast("Contrato encerrado", "ok");
      redesenhar();
    });
};

/* ---------------------------------------------------------------------
   RENOVAR
   Renovação é negócio NOVO, com origem cliente_atual e ag.renovacaoDeId
   apontando pro anterior, e o anterior encerra com motivo "renovado".
   Esticar a data do contrato antigo faria a maior vitória do trimestre
   não existir; encerrar e recriar sem o vinculo mostraria uma perda de
   R$ 3.500/mês que nunca aconteceu.
   --------------------------------------------------------------------- */
ACOES.ngRenovar = function(el){
  var n = achar("negocios", el.getAttribute('data-id'));
  if(!n || n.tipo !== "agencia") return;
  var a = n.ag || {};
  var inicio = a.fimContrato ? somaDias(a.fimContrato, 1) : hojeISO();
  // O novo nasce em Negociação: o contrato já existe e a conversa é sobre
  // continuar, não sobre a Lime existir. Começar em Contato faria o funil
  // contar uma prospecção que não houve.
  var novoTitulo = "Renovação " + (a.fimContrato ? String(a.fimContrato).slice(0,4) : hojeISO().slice(0,4)) + " " + n.empresa;

  folha("Renovar o contrato da " + n.empresa,
    '<form class="form" id="ngF" data-a="ngSalvarRenovar" data-id="' + esc(n.id) + '">' +
      '<div class="small muted2">Isto cria um negócio NOVO ligado a este, e encerra este com o motivo "renovado". Renovação encerrada assim fica fora do MRR perdido do mês.</div>' +
      '<div class="fld"><label>Título do negócio novo</label>' +
        '<input class="inp" id="ngRtit" maxlength="120" value="' + esc(novoTitulo) + '"></div>' +
      '<div class="grid2">' +
        '<div class="fld"><label>Fee proposto em R$ <span class="req">*</span></label>' +
          '<input class="inp" id="ngRmrr" inputmode="decimal" value="' + esc(a.mrr ? String(a.mrr) : "") + '">' +
          '<div class="hint">O atual é ' + esc(brl(a.mrr||0)) + '/mês.</div></div>' +
        '<div class="fld"><label>Meses</label>' +
          '<input class="inp" id="ngRmeses" inputmode="numeric" value="' + esc(a.meses ? String(a.meses) : "12") + '"></div>' +
        '<div class="fld"><label>Começa em</label>' +
          '<input class="inp" type="date" id="ngRini" value="' + esc(inicio) + '"></div>' +
        '<div class="fld"><label>Previsão de fechar</label>' +
          '<input class="inp" type="date" id="ngRprev" value="' + esc(a.fimContrato || somaDias(hojeISO(), CICLO_MEDIANO.agencia)) + '"></div>' +
      '</div>' +
      blocoProxPasso("rn", { tipo:"agencia", estagio:"ag_negociacao" }, true) +
      '<div class="fld"><div class="err" id="ngErr"></div></div>' +
    '</form>',
    '<button class="btn btn-ghost" data-a="fecharFolha">Cancelar</button>' +
    '<button class="btn btn-primary" type="submit" form="ngF">Criar a renovação</button>');
};
ACOES.ngSalvarRenovar = function(f){
  var id = f.getAttribute('data-id'), n = achar("negocios", id);
  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var err = document.getElementById('ngErr');
  var mrr = ngLerDinheiro((document.getElementById('ngRmrr')||{}).value);
  if(mrr <= 0){ err.textContent = "Preencha o fee proposto em R$."; return; }
  var prox = lerProxPasso("rn");
  if(!prox.ok){ err.textContent = prox.erro; return; }

  var a = n.ag || {};
  var meses = parseInt((document.getElementById('ngRmeses')||{}).value, 10) || 0;
  var ini   = (document.getElementById('ngRini')||{}).value || hojeISO();
  var prev  = (document.getElementById('ngRprev')||{}).value || somaDias(hojeISO(), CICLO_MEDIANO.agencia);
  var titulo = String((document.getElementById('ngRtit')||{}).value || ("Renovação " + n.empresa)).slice(0,120);

  var novoId = idNovo("n");
  var novo = {
    tipo:"agencia", titulo:titulo, empresa:n.empresa, empresaChave:n.empresaChave || chave(n.empresa),
    contatoId:n.contatoId || "", contatoNome:n.contatoNome || "", contatoTel:n.contatoTel || "",
    estagio:"ag_negociacao", status:"aberto", origem:"cliente_atual",
    indicadorId:"", indicadorNome:"",
    ag:{ mrr:mrr, mrrInicial:mrr, meses:meses, verbaMidia:a.verbaMidia || 0, pctVerba:a.pctVerba || 0,
         servicos:a.servicos || [], inicioContrato:ini, fimContrato:(meses ? somaDias(ini, meses*30 - 1) : ""),

ACOES.ngSalvarValores = function(f){

  if(!n){ fecharFolha(); toast("Esse negócio não está mais neste aparelho.", "bad"); return; }
  var up = {}, i, el;

  if(n.tipo === "agencia"){
    var a = ngCopia(n.ag);
    var mrr = ngLerDinheiro((document.getElementById('ngVmrr')||{}).value);
    if(!a.mrrInicial && mrr > 0) a.mrrInicial = (n.ag && n.ag.mrr) || mrr;   // só na primeira vez
    a.mrr = mrr;
    a.meses = parseInt((document.getElementById('ngVmeses')||{}).value, 10) || 0;
    a.verbaMidia = ngLerDinheiro((document.getElementById('ngVverba')||{}).value);
    a.pctVerba = lerValor((document.getElementById('ngVpct')||{}).value) || 0;
    a.inicioContrato = (document.getElementById('ngVini')||{}).value || "";
    a.fimContrato = (document.getElementById('ngVfim')||{}).value || "";
    a.quemDecide = (document.getElementById('ngVqd')||{}).value || "";
    a.faixaVerba = (document.getElementById('ngVfv')||{}).value || "";
    var marcados = document.querySelectorAll('.ngServ'), serv = [];
    for(i=0;i<marcados.length;i++) if(marcados[i].checked && serv.length < 6) serv.push(marcados[i].value);
    a.servicos = serv;
    if(a.fimContrato && a.inicioContrato && a.fimContrato <= a.inicioContrato){
      document.getElementById('ngErr').textContent = "A data de término tem que ser depois da de início.";
      return;
    }
    up.ag = a;
  } else {
    var p = ngCopia(n.pt);
    var valor = ngLerDinheiro((document.getElementById('ngVvalor')||{}).value);
    if(!p.valorInicial && valor > 0) p.valorInicial = (n.pt && n.pt.valor) || valor;

    p.quemAprova = String((document.getElementById('ngVaprova')||{}).value || "").slice(0,80);
    p.mesBudget = (document.getElementById('ngVbudget')||{}).value || "";
    p.entregaveis = String((document.getElementById('ngVentreg')||{}).value || "").slice(0,600);
    up.pt = p;
  }
  // valorRef é o único campo derivado gravado, e tem que ser recalculado
  // em TODO ponto de escrita que mexe em valor, senao a lista ordena por
  // um número que não existe mais.
  up.valorRef = valorRefDe({ tipo:n.tipo, ag:up.ag || n.ag, pt:up.pt || n.pt });
  fecharFolha();
  gravar("crm_negocios", id, up).then(function(){ toast("Valores salvos", "ok"); });
};

/* ---------------------------------------------------------------------
   DELEGAÇÕES DO MÓDULO
   Registradas UMA vez no carregamento, nunca dentro de uma tela: o
   redesenhar() troca o innerHTML inteiro e escuta presa a elemento
   vazaria a cada pintura.
   --------------------------------------------------------------------- */
if(!window.NG_DELEGADO){
  window.NG_DELEGADO = true;

  // O clique já é delegado pela casca. O change não era, e sem ele o
  // picklist de motivo e a data de congelamento não conseguem explicar na
  // hora o que vai acontecer.
  document.addEventListener('change', function(ev){
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-ch]') : null;
    if(!el) return;
    var nome = el.getAttribute('data-ch');
    if(ACOES[nome]){ try{ ACOES[nome](el, ev); }catch(e){ console.error(e); } }
  });

  // Ctrl + Enter salva, e só no formulário de registro: sequestrar o
  // atalho em qualquer formulário quebraria as telas dos outros módulos.
  document.addEventListener('keydown', function(ev){
    if(ev.key !== "Enter" || !(ev.ctrlKey || ev.metaKey)) return;
    var f = ev.target && ev.target.closest ? ev.target.closest('form[data-a="ngSalvarRegistro"]') : null;
    if(!f) return;
    ev.preventDefault();
    try{ ACOES.ngSalvarRegistro(f, ev); }catch(e){ console.error(e); }
  });

  /* Rascunho a cada 3 segundos enquanto houver texto. O iOS mata o Safari
     em segundo plano o tempo todo, e perder o relato de uma reunião de uma
     hora é o tipo de coisa que faz alguém voltar pro caderno. */
  window.NG_RASCUNHO = setInterval(function(){
    var ta = document.querySelector('textarea[data-rascunho]');
    if(!ta || !ta.value) return;
    guardar("rascunho_" + ta.getAttribute('data-rascunho'), ta.value);
  }, 3000);
}

/* ============ 09-pessoas ============ */
/* =====================================================================
   CRM LIME - PESSOAS E INDICAÇÃO

   Contato e indicador são a MESMA entidade (seção 2.5 do SPEC). Criar uma
   segunda coleção de "indicadores" faria o Paulo da Shineray existir duas
   vezes e nunca mais bater.

   Indicação é praticamente o único canal de entrada da casa, então esta
   tela não é um cadastro: é o relatório que responde quem trouxe dinheiro,
   quem parou de trazer e quanto a indicação vale contra as outras origens.

   ZERO LEITURA. Tudo aqui é aritmética em cima do array que já está na
   memória. Não existe contador de indicação gravado no banco de propósito:
   contador gravado desalinha na primeira gravação que falha, precisa de
   lote atômico (que o sistema não tem, invariante 2) e acaba pedindo um
   botão de "recalcular" que ninguém confia. Somar 130 negócios em memória
   custa menos que um clique.
   ===================================================================== */

/* Estado da tela. Fica só em memória: filtro de lista não é dado de
   negócio e não merece viajar pro banco nem pro cache. */
var PESSOAS_VISAO = "todos";     // "todos" | "indicadores"
var PESSOAS_FILTRO = "";

/* Atalho de achar(). Devolve também contato arquivado, de propósito: o
   detalhe precisa abrir pra permitir restaurar, e o Desfazer de 8s
   depende de o documento continuar alcançável logo depois de arquivar. */
function contatoPorId(id){ return achar("contatos", id); }

/* ---------------------------------------------------------------------
   RANKING DE INDICADORES

   Agrupa os negócios em memória por indicadorId.

   Negócio "encerrado" conta como cliente que a indicação trouxe: ele foi
   ganho um dia, e o fim do contrato dois anos depois não apaga a porta que
   a pessoa abriu. O que NÃO conta encerrado é o mrrGerado, que responde
   "quanto recorrente está ativo hoje" e por isso usa a mesma base da
   carteira da seção 7.1 (status ganho e sem encerradoEm).

   Agrupa por indicadorId mesmo quando a origem não é "indicacao": se
   alguém apontou o caminho, apontou. Os negócios com origem indicação e
   SEM indicadorId ficam de fora e são contados a parte por
   indicacoesSemDono(), porque número sem o buraco declarado vira mentira.
   --------------------------------------------------------------------- */
function pesVirouCliente(n){ return n.status === "ganho" || n.status === "encerrado"; }

function rankIndicadores(){
  var neg = lista("negocios"), mapa = {}, ordem = [], i, n, r, c;

  for(i=0;i<neg.length;i++){
    n = neg[i];
    if(!n.indicadorId) continue;

    r = mapa[n.indicadorId];
    if(!r){
      c = contatoPorId(n.indicadorId);
      r = mapa[n.indicadorId] = {
        id: n.indicadorId,
        // O nome do contato manda. O indicadorNome gravado no negócio é o
        // retrato do dia do cadastro e serve só quando o contato sumiu.
        nome: (c && c.nome) || n.indicadorNome || "Indicador sem cadastro",
        tel: (c && c.tel) || "",
        empresa: (c && c.empresa) || "",
        acordo: (c && c.acordo) || "",
        semCadastro: !c,
        n:0, ganhos:0, perdidos:0, abertos:0,
        gerado:0, mrrGerado:0, cotaGerada:0, emAberto:0,
        conversao:0, ultimaEm:"", diasSemIndicar:0, valorMedio:0, frio:false
      };
      ordem.push(r);
    }

    r.n++;
    if((n.criadoEm||"") > r.ultimaEm) r.ultimaEm = n.criadoEm || "";

    if(pesVirouCliente(n)){
      r.ganhos++;
      r.gerado += valorRefDe(n);
      // Recorrente (R$/mês) e cota (R$) andam em colunas separadas e nunca
      // se somam: são unidades diferentes (invariante 5).
      if(n.tipo === "agencia"){
        if(n.status === "ganho" && !n.encerradoEm) r.mrrGerado += mrrDe(n);
      } else {
        r.cotaGerada += Math.round((n.pt && n.pt.valor) || 0);
      }
    } else if(n.status === "perdido"){
      r.perdidos++;
    } else if(n.status === "aberto"){
      r.abertos++;
      r.emAberto += valorRefDe(n);
    }
  }

  for(i=0;i<ordem.length;i++){
    r = ordem[i];
    r.conversao = r.n ? (r.ganhos / r.n) * 100 : 0;        // em % (0 a 100)
    r.diasSemIndicar = r.ultimaEm ? diasVencido(r.ultimaEm) : 0;
    // Valor médio da indicação divide o gerado por TODAS as indicacoes
    // recebidas, não só pelas ganhas (seção 7.5). Quem indica cinco e
    // acerta uma não trouxe R$ 96 mil por indicação.
    r.valorMedio = r.n ? Math.round(r.gerado / r.n) : 0;
    // Esfriando: já provou que a indicação dele fecha (2 ganhos ou mais) e
    // sumiu há mais de 120 dias. É a ligação de maior retorno da casa.
    r.frio = r.ganhos >= 2 && r.diasSemIndicar > 120;
  }

  ordem.sort(function(a,b){
    if(b.gerado !== a.gerado) return b.gerado - a.gerado;
    if(b.emAberto !== a.emAberto) return b.emAberto - a.emAberto;   // promessa viva antes de histórico vazio
    if(b.n !== a.n) return b.n - a.n;
    return chave(a.nome) < chave(b.nome) ? -1 : 1;
  });
  return ordem;
}

/* O buraco do ranking: origem indicação e ninguém anotado como indicador.
   Declarar isso na tela é o que sustenta o resto dos números. */
function indicacoesSemDono(){
  return lista("negocios").filter(function(n){
    return n.origem === "indicacao" && !n.indicadorId;
  });
}

/* ---------------------------------------------------------------------
   INDICADO CONTRA NÃO INDICADO
   Taxa de ganho, ciclo mediano e ticket mediano dos dois lados.
   "Fora do perfil" sai do denominador da taxa (seção 7.4): contar
   desqualificação como derrota pune a única disciplina que faz um time de
   duas pessoas sobreviver, que é dizer não.
   --------------------------------------------------------------------- */
function pesLadoFechado(negocios){
  var ganhos = [], perdas = [], i, n;
  for(i=0;i<negocios.length;i++){
    n = negocios[i];
    if(pesVirouCliente(n)) ganhos.push(n);
    else if(n.status === "perdido" && n.motivoPerda !== "fora_do_perfil") perdas.push(n);
  }
  var ciclos = [], tickets = [], d;
  for(i=0;i<ganhos.length;i++){
    n = ganhos[i];
    if(n.criadoEm && n.fechadoEm){
      d = diasEntre(n.criadoEm, n.fechadoEm);
      if(d >= 0) ciclos.push(d);
    }
    if(valorRefDe(n) > 0) tickets.push(valorRefDe(n));
  }
  var nFech = ganhos.length + perdas.length;
  return {
    nGanhos: ganhos.length, nPerdas: perdas.length, nFech: nFech,
    taxa: nFech ? (ganhos.length / nFech) * 100 : 0,
    ciclos: ciclos, tickets: tickets
  };
}
function pesComparaIndicacao(){
  var fechados = lista("negocios").filter(function(n){
    return n.status === "ganho" || n.status === "perdido" || n.status === "encerrado";
  });
  var ind = [], out = [], i;
  for(i=0;i<fechados.length;i++){
    if(fechados[i].origem === "indicacao" || fechados[i].indicadorId) ind.push(fechados[i]);
    else out.push(fechados[i]);
  }
  return { ind: pesLadoFechado(ind), out: pesLadoFechado(out) };
}

/* ---------------------------------------------------------------------
   FORMATAÇÃO LOCAL
   Tudo com prefixo "pes" pra não colidir com helper de outro módulo.
   --------------------------------------------------------------------- */
function pesNumBR(v){
  return (Number(v)||0).toLocaleString('pt-BR',{ minimumFractionDigits:1, maximumFractionDigits:1 });
}
function pesDias(v){ return v + (v === 1 ? " dia" : " dias"); }
function pesQtd(v, sing, plur){ return v + " " + (v === 1 ? sing : plur); }

/* Regra de amostra pequena, vale pra TODO número derivado do sistema:
     8 ou mais    -> a estatística normal
     de 3 a 7     -> a MEDIANA, com "n=5" ao lado em --text3, opacidade 70%
     menos de 3   -> média nenhuma, lista os valores
   Com 2 fechados, "ticket médio de R$ 41.000" informa menos que
   "R$ 62.000 e R$ 20.000", e ainda por cima mente. */
function pesEstat(valores, fmt){
  var v = (valores||[]).filter(function(x){ return typeof x === "number" && !isNaN(x); });
  if(!v.length) return '<span class="muted small">sem dado ainda</span>';
  if(v.length < 3){
    return '<b>' + v.map(fmt).join(" e ") + '</b>' +
           ' <span class="tiny" style="color:var(--text3);opacity:.7">valor a valor, n=' + v.length + '</span>';
  }
  var m = mediana(v);
  var peq = v.length < 8;
  // "mediana de 9" se le como se 9 fosse o valor. O tamanho da amostra
  // precisa vir com a unidade dele, que é quantidade de negócios.
  return '<b>' + fmt(m) + '</b> <span class="tiny" style="color:var(--text3)' + (peq ? ';opacity:.7' : '') + '">' +
         (peq ? 'mediana, n=' + v.length : 'mediana de ' + pesQtd(v.length, "negócio", "negócios")) + '</span>';
}

/* Ação sem permissão fica VISÍVEL e DESABILITADA, com o motivo embaixo em
   --text3 (invariante 12). Botão que some faz o gestor abrir no celular,
   não ver ação nenhuma e achar que o CRM quebrou. */
function pesBotao(rotulo, acao, dados, classe, motivo){
  var at = "", k;
  for(k in dados) if(Object.prototype.hasOwnProperty.call(dados,k)) at += ' data-' + k + '="' + esc(dados[k]) + '"';
  var b = '<button class="btn ' + (classe||"") + '"' +
          (motivo ? ' disabled' : ' data-a="' + esc(acao) + '"') + at + '>' + esc(rotulo) + '</button>';
  if(!motivo) return b;
  return '<div>' + b + '<div class="tiny" style="color:var(--text3);margin-top:4px;max-width:200px">' + esc(motivo) + '</div></div>';
}

function pesRotEncerramento(k){
  for(var i=0;i<MOTIVOS_ENCERRAMENTO.length;i++) if(MOTIVOS_ENCERRAMENTO[i].k === k) return MOTIVOS_ENCERRAMENTO[i].rot;
  return k || "encerrado";
}
function pesTagStatus(n){
  if(n.status === "ganho")     return '<span class="tag tag-green">Ganho</span>';
  if(n.status === "perdido")   return '<span class="tag tag-red">Perdido</span>';
  if(n.status === "encerrado") return '<span class="tag">Encerrado</span>';
  var t = temperatura(n);
  var cls = t === "verde" ? "tag-green" : t === "amarelo" ? "tag-warn" :
            t === "vermelho" ? "tag-red" : t === "congelado" ? "tag-blue" : "";
  return '<span class="tag ' + cls + '">' + esc(estagioDe(n).rot) + '</span>';
}
function pesResultado(n){
  // Data sempre condicional: dataBR("") devolve texto vazio e a frase sairia
  // como "ganho em ," no negócio importado ou fechado antes de o campo
  // existir. Buraco na frase é pior que a frase sem a data.
  if(n.status === "ganho"){
    var d = (n.criadoEm && n.fechadoEm) ? diasEntre(n.criadoEm, n.fechadoEm) : null;
    return "ganho" + (n.fechadoEm ? " em " + dataBR(n.fechadoEm) : ", sem data de fechamento anotada") +
           (d !== null && d >= 0 ? ", levou " + pesDias(d) : "");
  }
  if(n.status === "perdido"){
    var m = motivoPerdaDe(n.motivoPerda);
    return "perdido" + (n.fechadoEm ? " em " + dataBR(n.fechadoEm) : "") + (m ? ", " + m.rot.toLowerCase() : "");
  }
  if(n.status === "encerrado")
    return "encerrado" + (n.encerradoEm ? " em " + dataBR(n.encerradoEm) : "") + ", " + pesRotEncerramento(n.motivoEncerramento).toLowerCase();
  return estagioDe(n).rot + ", " + porQue(n);
}

/* Casa por PREFIXO DE PALAVRA, igual a busca do cabeçalho: "mar" acha
   "Marroca" e "Ana Maria", não acha "Camargo". Telefone casa por dígito. */
function pesCasa(c, termo){
  if(!termo) return true;
  var dig = soDigito(termo);
  if(dig.length >= 3 && soDigito(c.tel||"").indexOf(dig) > -1) return true;
  // O termo também é quebrado em palavras. Comparando o termo inteiro de
  // uma vez, quem digitava o nome completo ("ana silva") procurava uma
  // palavra com espaço dentro, que nunca casa, e a lista voltava vazia
  // justo na busca mais natural que existe.
  var busca = chave(termo).split(/[\s.@_\-]+/).filter(Boolean);
  if(!busca.length) return false;
  var pal = chave((c.nome||"") + " " + (c.empresa||"") + " " + (c.cargo||"") + " " + (c.email||"")).split(/[\s.@_\-]+/);
  for(var j=0;j<busca.length;j++){
    var achou = false;
    for(var i=0;i<pal.length;i++) if(pal[i] && pal[i].indexOf(busca[j]) === 0){ achou = true; break; }
    if(!achou) return false;   // toda palavra do termo precisa casar
  }
  return true;
}

/* Abaixo de 860px toda tabela deste módulo vira lista de cartão. O
   espaçamento dos cartões do celular vai em margin-bottom, e não em gap de
   flex, porque .only-mob entra como display:initial (ou seja, inline) e
   gap não valeria: a margem do filho é o único jeito que funciona nos dois
   casos sem inventar classe nova de CSS. */

/* O campo tel é GUARDADO só com dígito e SEM DDI, que é o formato que o
   cadastro (módulo 11) grava e que o foneBR espera. O 55 entra só na hora
   de montar link (tel: aqui, wa.me dentro do linkWhats), nunca no banco:
   duas telas gravando o mesmo campo em formato diferente é como o mesmo
   telefone passa a existir de dois jeitos. Número de 10 ou 11 dígitos é
   sempre brasileiro. */
function pesTelComDDI(s){
  var d = soDigito(s);
  if(d.length === 10 || d.length === 11) d = "55" + d;
  return d;
}

/* Motivo pra bloquear os botões de telefone, ou null quando dá pra usar.
   Ter o campo preenchido não é o mesmo que ter telefone utilizável:
   linkWhats() devolve string vazia abaixo de 10 dígitos, então um ramal de
   4 dígitos deixava o botão de WhatsApp vivo e sem link nenhum atrás.
   O vendedor toca, a folha abre vazia, e ele acha que o CRM travou.
   Invariante 12: o botão fica visível e DESABILITADO, com o motivo escrito. */
function pesMotivoTel(tel){
  var d = soDigito(tel||"");
  if(!d) return "Sem telefone cadastrado.";
  if(d.length < 10) return "O telefone anotado (" + d + ") está sem DDD, então não dá pra abrir WhatsApp nem discar. Edite o contato e escreva com os 2 dígitos do DDD.";
  return null;
}
